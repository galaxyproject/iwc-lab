class: GalaxyWorkflow
label: BigWig Replicates Averaging Workflow
doc: Calculates average signal values across replicate BigWig files to generate a
  single consolidated track. Requires input file identifiers formatted as "sample_name_replicateID".
  The tool automatically groups files by sample name, computes the mean signal at
  each position, and outputs consolidated BigWig files named after the common sample
  prefix (without the replicate ID suffix).
inputs:
  Bigwig to average:
    position:
      top: 0.0
      left: 0
    doc: 'We assume the identifiers are like:

      sample_name_replicateID'
    optional: false
    type: collection
    collection_type: list
  bin_size:
    position:
      top: 125.0
      left: 16
    doc: Bin size for normalized bigwig (usually 5bp is sufficient for RNA-seq and
      50bp for ChIP/CUTandRUN/ATAC)
    optional: false
    type: int
outputs:
  average_bigwigs:
    outputSource: average bigwigs from different replicates/outFileName

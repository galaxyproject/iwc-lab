class: GalaxyUserTool
id: nf_core_demo_cowpy
version: 1.1.5
name: cowpy ASCII-art message
description: Render the nf-core/demo message "nf-core rules!" as cowsay-style ASCII art
license: MIT
container: community.wave.seqera.io/library/cowpy:1.1.5--3db457ae1977a273
shell_command: |
  echo "nf-core rules!" | cowpy > cowpy.txt
inputs: []
outputs:
  - name: cowpy_txt
    type: data
    format: txt
    from_work_dir: cowpy.txt
    label: cowpy ASCII art
help:
  format: markdown
  content: |
    Port of the nf-core/demo `COWPY` local module (cowpy 1.1.5, conda-forge::cowpy=1.1.5).
    Pipes the fixed text `nf-core rules!` through `cowpy` with default options and writes
    the result to a text file. Takes no inputs.

comments:
  - type: frame
    label: '1 - Inputs & sheet materialization'
    contains_steps: [materialize_reads, assembly_input_route]
  - type: frame
    label: '2 - Read preprocessing'
    contains_steps: [shortread_preprocess, longread_preprocess]
  - type: frame
    label: '3 - Assembly'
    contains_steps: [assembly, virus_identification, asm_final_merge]
  - type: frame
    label: '4 - Binning preparation'
    contains_steps: [binning_preparation, ancient_dna, mapping_input_pick]
  - type: frame
    label: '5 - Binning & refinement'
    contains_steps: [binning, binning_refinement, domain_classification, postbin_routing]
  - type: frame
    label: '6 - Per-bin QC & annotation'
    contains_steps: [depths_bins, bin_qc, gtdbtk, catpack, pydamage_bins, filter_prokka_bins, prokka_bins, filter_metaeuk_bins, metaeuk_run, quast_bins]
  - type: frame
    label: '7 - Tolerant rejoin & summaries'
    contains_steps: [f_depths, t_depths, f_quastbins, t_quastbins, f_busco, t_busco, f_checkm, t_checkm, f_checkm2, t_checkm2, f_gunc, t_gunc, f_seqkit, t_seqkit, f_gtdbtk, t_gtdbtk, f_cat, t_cat, f_pydamage, t_pydamage, bin_summary_join, bigmag, tax_tables, multiqc]

      class: GalaxyWorkflowDraft
      inputs:
        assemblies_in: { type: collection, collection_type: list, format: [fasta.gz] }
        genomad_db: { type: data, optional: true }
      outputs:
        virus_tables: { outputSource: genomad/TODO_tables }
      steps:
        genomad:
          type: tool
          tool_id: TODO
          label: genomad
          in: { TODO_contigs: assemblies_in, TODO_db: genomad_db }
          out: [ { id: TODO_tables } ]
          _plan_state: geNomad predict per source module; DB tar unpacked in-tool; iuc/genomad wrapper candidate else author.
  asm_final_merge:
    type: tool
    tool_id: TODO
    label: asm_final_merge
    doc: rejoin the two input-mode cascades (twin-cascade; only one producer ever runs).
    in:
      TODO_reads_mode: assembly/assemblies_asm
      TODO_asm_sr: assembly_input_route/sr_assemblies
      TODO_asm_lr: assembly_input_route/lr_assemblies
    out: [ { id: TODO_merged } ]
    _plan_state: tolerant merge of at most one running producer list (merge-collections / build-list built-ins; skipped sentinels dropped). ids sample_assembler preserved.
    _plan_context: input_mode guarantees exactly one source side is non-skipped.
  binning_preparation:
    type: subworkflow
    label: binning_preparation
    doc: Stage 4 - BINNING_PREPARATION. reads mapped to per-unit assemblies; ALE optional.
    when: '!$(inputs.skip_binning) || $(inputs.ancient_dna)'
    runtime_inputs: [contigs, clean_sr, clean_lr, meta_table, binning_map_mode, skip_binning, skip_ale]
    in:
      contigs: asm_final_merge/TODO_merged
      clean_sr: shortread_preprocess/clean_sr
      clean_lr: longread_preprocess/clean_lr
      meta_table: materialize_reads/meta_table
      binning_map_mode: binning_map_mode
      skip_binning: skip_binning
      skip_ale: skip_ale
    out: [ { id: bams_sr }, { id: bams_lr }, { id: ale_scores } ]
    run:
      class: GalaxyWorkflowDraft
      inputs:
        contigs: { type: collection, collection_type: list, format: [fasta.gz] }
        clean_sr: { type: collection, collection_type: 'list:paired', format: [fastqsanger.gz] }
        clean_lr: { type: collection, collection_type: list, format: [fastqsanger.gz], optional: true }
        meta_table: { type: data, format: [tabular] }
        binning_map_mode: { type: string }
        skip_binning: { type: boolean }
        skip_ale: { type: boolean }
      outputs:
        bams_sr: { outputSource: map_sr/TODO_bam }
        bams_lr: { outputSource: map_lr/TODO_bam }
        ale_scores: { outputSource: run_ale/TODO_scores }
      steps:
        derive_map_units:
          type: tool
          tool_id: TODO
          label: derive_map_units
          in: { TODO_contigs: contigs, TODO_meta: meta_table }
          out: [ { id: TODO_readside }, { id: TODO_asm_side } ]
          _plan_state: |
            harmonize reads (ids sample_run) and assemblies (ids sample_assembler) onto map units
            per binning_map_mode own|group|all: relabel/derive via meta_table + Apply Rules,
            duplicate assemblies where a unit needs several (data-flow 4.2, Medium).
        map_sr:
          type: tool
          tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bowtie2/bowtie2
          tool_version: TODO
          label: map_sr
          when: '!$(inputs.skip_binning)'
          in: { TODO_reads: derive_map_units/TODO_readside, TODO_ref: derive_map_units/TODO_asm_side }
          out: [ { id: TODO_bam } ]
          _plan_state: bowtie2 index built in-tool per assembly (reference brief); MAPQ>=3 filtered? per source BOWTIE_ALIGN defaults (--no-unal).
        map_lr:
          type: tool
          tool_id: toolshed.g2.bx.psu.edu/repos/iuc/minimap2/minimap2
          tool_version: TODO
          label: map_lr
          when: '!$(inputs.skip_binning)'
          in: { TODO_reads: derive_map_units/TODO_readside, TODO_ref: derive_map_units/TODO_asm_side }
          out: [ { id: TODO_bam } ]
          _plan_state: minimap2 -ax map-ont per source.
        run_ale:
          type: tool
          tool_id: TODO
          label: run_ale
          when: '!$(inputs.skip_ale)'
          in: { TODO_bam: map_sr/TODO_bam }
          out: [ { id: TODO_scores } ]
          _plan_state: ALE contig QC (niche tool, authoring plausible). default skip_ale=true.
  ancient_dna:
    type: subworkflow
    label: ancient_dna
    doc: Stage 4.5 - ANCIENT_DNA. pydamage QC + consensus recall that can replace contigs into binning.
    when: $(inputs.ancient_dna)
    runtime_inputs: [bams_in, contigs_in, skip_ancient_damagecorrection]
    in:
      bams_in: binning_preparation/bams_sr
      contigs_in: asm_final_merge/TODO_merged
      skip_ancient_damagecorrection: skip_ancient_damagecorrection
    out: [ { id: pydamage_reports }, { id: recalled_contigs } ]
    run:

    resolved_by: compare-against-iwc-exemplar
    supersedes: null
    note: "corpus-attested recipe: IWC microbiome/multi-sample-binning uses __CROSS_PRODUCT_NESTED__ + Apply Rules for exactly this bins×BAMs pairing"
discoveries:
  - id: mag-reference-shape
    raised_by: nextflow-summary-to-galaxy-reference-data
    evidence: "summary-nextflow reference_assets[] (15) + reference_rebuilds[] (8); host_genome is the only key-expanded attribute; seven analysis DBs each pair with a run_*/skip_* guard"
    impact: "Galaxy surface = samplesheet + 0..N optional DB inputs; no genome bundle; bin-QC branches join independently"
  - id: exemplar-when-pickvalue-idiom
    raised_by: compare-against-iwc-exemplar
    evidence: "iwc microbiome/mags-building: map_param_value over a selector string input -> boolean; consumer steps carry a named `when` step input and `when: $(inputs.when)`; rejoin via pick_value 0.2.0 pick_style:first; optional modalities are optional:true collection inputs with null job values"
    impact: "template authors the clip_tool/assembler/longread swaps and pick-list gates with this exact idiom (see iwc-comparison-notes.md excerpt); no new conditional machinery needed"
  - id: exemplar-wrapper-db-provisioning
    raised_by: compare-against-iwc-exemplar
    evidence: "mags-building test job sets 'CheckM2 Database: 1.0.2' — the IWC checkm2 wrapper provisions its own database from a version string; mags-taxonomy-annotation likewise resolves GTDB-Tk wrapper-side"
    impact: "per-step loop may accept wrapper-managed DB provisioning where a corpus wrapper offers it; the upload-input interface surface is unchanged (optional inputs still win when supplied)"
decisions:
  - id: dbs-as-explicit-optional-inputs
    decided_by: nextflow-summary-to-galaxy-reference-data
    decision: "Every analysis DB becomes an explicit optional data input; input presence gates its branch (replaces run_*/skip_* + download fallbacks)."
    rationale: "v1 posture (explicit optional inputs; data tables discouraged); preserves the pick-list semantics the source guards encode."
    evidence: [mag-reference-shape, db-download-fallbacks-not-carried]
  - id: host-index-in-tool-rebuild
    decided_by: nextflow-summary-to-galaxy-reference-data
    decision: "Do not surface a bowtie2 index input; the alignment wrapper builds it from the host FASTA input."
    rationale: "single consumer chain (below the ~3-rebuild threshold); matches existing IWC wrapper convention; no vendored directory datatype for bowtie2 indexes."
    evidence: [wrapper-rebuild-capability-unverified]
  - id: multiqc-configs-not-inputs
    decided_by: nextflow-summary-to-galaxy-reference-data
    decision: "multiqc_config / multiqc_methods_description are baked into the MultiQC step as tool configuration, not workflow inputs."
    rationale: "repo-bundled presentation assets, not reference data; keeps the input surface scientific."
    evidence: [mag-reference-shape]
  - id: input-mode-switch
    decided_by: nextflow-summary-to-galaxy-interface
    decision: "Scalar input_mode [reads, assemblies] selects the modality; reads_samplesheet and assembly_samplesheet are both optional data-sheet inputs."
    rationale: "branch-required pattern from nextflow-params-to-galaxy-inputs; Galaxy has no required-unless-the-other-is-set affordance (either-input-required-unexpressible)."
    evidence: [either-input-required-unexpressible]
  - id: samplesheet-variants
    decided_by: nextflow-summary-to-galaxy-interface
    decision: "reads → sample_sheet:record (slots short_reads:paired_or_unpaired, long_reads) with meta columns sample/run/group/platforms; assembly_input → sample_sheet (fasta element, meta id/group/assembler)."
    rationale: "heterogeneous per-row path columns → record variant (galaxy-sample-sheet-collections); single path column → sample_sheet; nf-schema enum→restrictions, pattern→regex, richer rules downgraded to prose."
    evidence: [mixed-modality-samplesheet-record-slots]
  - id: checkpoints-promoted
    decided_by: nextflow-summary-to-galaxy-interface
    decision: "Promote bin_summary.tsv and the software-versions yml as stable tabular/metadata checkpoints alongside multiqc_report, bins (list:list fasta.gz), unbinned_contigs, assemblies."
    rationale: "galaxy-workflow-testability-design: a report alone proves existence; these mirror the nf-test content-check/tsv-rows and versions snapshots of tests/default.nf.test."
    evidence: [mag-reference-shape]
  - id: phase-subworkflows-tool-inline-when
    decided_by: nextflow-summary-to-galaxy-data-flow
    decision: "14 source subworkflow boundaries become Galaxy subworkflow steps with when: gates (preprocessing, assembly, assembly-input branch, binning-prep, binning, refinement, domain-classification, bin-QC, gtdbtk, catpack, ancient-dna, virus-ID, metaeuk); tool swaps stay inline when: + pick_value (clip_tool the_only_non_null; longread filter / aDNA-consensus first_or_skip); additive branches (5 assemblers, 6 binners, QC scanners) fan in by merge-collections."
    rationale: "nextflow-conditional-to-galaxy-subworkflow-when heuristics: source already scoped each gated unit in a named subworkflow with wide cohesive cascades; swaps are 1-step pure tool choices with short cascades."
    evidence: [mag-reference-shape]
  - id: identifier-scheme
    decided_by: nextflow-summary-to-galaxy-data-flow
    decision: "Reads elements keyed sample_run (source test samplesheet is multirun: sample alone repeats); bins keyed group_binN and every per-bin tabular keys on it; assemblies keyed sample_assembler."
    rationale: "data-flow procedure: a per-row column can repeat — key each element on what is unique per dataset; bin_summary join and addressable bin outputs depend on one shared bin key."
    evidence: [mag-reference-shape]
  - id: exemplar-idioms-adopted
    decided_by: compare-against-iwc-exemplar
    decision: "Keep input_mode + sample_sheet inputs (interface decisions stand); adopt the exemplar's map_param_value→when:+pick_value wiring, __CROSS_PRODUCT_NESTED__ for bins×BAMs, das_tool (not dRep) for refinement per source, split_file_to_collection shape for the unbinned split."
    rationale: "exemplar confirms the designed shapes where the science matches and divergences stay where MAG's source structure differs (taxonomy/annotation stages, samplesheet modality)."
    evidence: [exemplar-when-pickvalue-idiom, exemplar-wrapper-db-provisioning]
  - id: subworkflow-stage-gates-nested-drafts
    decided_by: nextflow-summary-to-galaxy-template
    decision: "The 14 stage-gate subworkflow steps are authored as `run: class: GalaxyWorkflowDraft` nested drafts (not GalaxyWorkflow), each declaring `out:` ports mirroring the nested outputs and a `runtime_inputs` note; branch swaps and their pick_values live inside the same nested draft; stage notes ride on the step's `doc`, never `_plan_*`."
    rationale: "probe-confirmed against gxwf 0.30.1: draft-validate and draft-next-step descend nested GalaxyWorkflowDraft recursively and count nested `_plan_*` (a nested class: GalaxyWorkflow would hide draft state from the loop); outer steps cannot reference nested inner ports, so pick pairs stay at one nesting level; `_plan_*` on a subworkflow step makes draft-next-step pick the subworkflow itself instead of descending."
    evidence: [exemplar-when-pickvalue-idiom]
  - id: when-guards-direct-input-expressions
    decided_by: nextflow-summary-to-galaxy-template
    decision: "Stage and swap guards are direct ES5.1 when: expressions over workflow inputs ('!$(inputs.skip_x)', '$(inputs.db) != null', && / || compounds), not the exemplar's map_param_value→named-when knot; pick_value merge idiom still adopted verbatim."
    rationale: "refines exemplar-idioms-adopted: the exemplar's knot gates a *derived* selector value; every guard here is input-derived (booleans/enums/null-presence), so the intermediate step would add nodes without adding expression power. Engine notes confirm tool- and subworkflow-step when: over inputs incl. compounds."
    evidence: [exemplar-when-pickvalue-idiom, picklist-no-galaxy-exemplar]
  - id: tolerant-fillers-for-bin-summary
    decided_by: nextflow-summary-to-galaxy-template
    decision: "Each of the 10 optional per-bin QC/annotation table branches gets a twin filler step (header-only TSV, tool_id TODO, guard = negated branch guard) rejoined by a pick_value(0.2.0, first_or_skip) t_* step; bin_summary_join and the MultiQC custom-content fan-in consume only t_* picks, never a raw branch port."
    rationale: "downstream `in:` to a skipped step is NO_REPLACEMENT (required-input error); making the join's inputs always-fed reduces the tolerance problem to pick_value's documented first_or_skip semantics + the sentinel-vs-empty-table runtime check (bin-summary-tolerant-join open half)."
    evidence: [bin-summary-tolerant-join]
    note: "resolved in the per-step loop: no Tool Shed tool emits a zero-input tabular, so the fillers use one authored GalaxyUserTool `header_table` 0.1.0 (text `columns` param -> tr ',' '\\t' > tabular `output`), embedded under run: in all 10 f_* steps per galaxy-user-tool-workflow-binding; header value is the join key placeholder `bin_id` - the load-bearing property is the zero-data-row table (a header row keyed 'bin_id' never matches a real group_binN key, so it is join-inert); exact per-branch column sets are not needed since the key join drops non-key headers"

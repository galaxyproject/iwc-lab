    label_status: resolved
    description: 'Forward and reverse FASTQ of the paired-end samples; the primary product (source: reads/<id>_{1,2}.merged.fastq.gz).'
    output_kind: collection
    collection_shape: list:paired
    assertion_intent:
    - family: element_count
      intent: exactly the two paired-end samples
      expected_value: 2
      tolerance: null
      element_identifier: null
      evidence: test-evidence
      confidence: high
    - family: file
      intent: 'Exact read content, order-insensitive. compare: diff, sort: true, decompress: true. (sort: true added after planemo attempt 1: the Galaxy BAM to FASTQ wrapper writes reads in name order, the source in samtools collate order; the comparison still fails on any missing, extra or altered line, but no longer checks read order or which header belongs to which sequence.) (the Galaxy output is fastqsanger.gz, so `checksum` cannot be used: it hashes the stored gzip bytes). Expected file test-data/expected/test_1.fastq.gz was produced by running the source module commands (samtools 1.23.1 container) on the upstream fixture and accepted only because the md5 of its decompressed content equals the tests/default.nf.test.snap token md5,9b0c08862a5e47e842a485ddad31b871.'

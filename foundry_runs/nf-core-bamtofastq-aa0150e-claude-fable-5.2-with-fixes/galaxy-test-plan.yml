      tolerance:
        kind: none
        magnitude: null
        rationale: no tolerance; lines are sorted before the diff
      element_identifier: test/forward
      evidence: test-evidence
      confidence: high
    - family: file
      intent: 'Exact read content, order-insensitive. compare: diff, sort: true, decompress: true. (sort: true added after planemo attempt 1: the Galaxy BAM to FASTQ wrapper writes reads in name order, the source in samtools collate order; the comparison still fails on any missing, extra or altered line, but no longer checks read order or which header belongs to which sequence.) (the Galaxy output is fastqsanger.gz, so `checksum` cannot be used: it hashes the stored gzip bytes). Expected file test-data/expected/test_2.fastq.gz was produced by running the source module commands (samtools 1.23.1 container) on the upstream fixture and accepted only because the md5 of its decompressed content equals the tests/default.nf.test.snap token md5,40e17982d1231e561d6420234ae29357.'

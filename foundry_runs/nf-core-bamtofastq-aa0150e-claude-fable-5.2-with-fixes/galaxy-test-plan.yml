omissions:
- target: FastQC HTML reports and MultiQC report content
  reason: 'HTML with embedded dates/versions; the source ignores them too (tests/.nftignore: fastqc/*_fastqc.{html,zip}, multiqc/multiqc_report.html). Only smoke checks.'
  category: nondeterministic
- target: pipeline_info software versions YAML and succeeded task count (32 / 43)
  reason: 'No Galaxy equivalent: the workflow produces no versions file (recorded drop) and task counts are a Nextflow runtime property.'
  category: out-of-scope
- target: multiqc/multiqc_data/multiqc_citations.txt (snapshot md5 4c806e63...)
  reason: The MultiQC data directory is not a workflow output, and the Galaxy report has different inputs than the source report.
  category: out-of-scope
- target: fastqutils/<id>.txt snapshot md5s
  reason: The source file is a sentence written by the Nextflow module that embeds file names; the Galaxy wrapper output is the fastq_info report itself. Asserted by content instead.
  category: other
- target: Source candidates cram, no_crai, chr, fai, no_qc, no_stats
  reason: They exercise features recorded as dropped (CRAM + reference, chr region filter, fasta_fai, QC skip flags). fai and no_qc have the same snapshot content as the default case.
  category: out-of-scope
- target: Source candidate collate_fast (tests/collate_fast.nf.test)
  reason: 'Fast collate mode is a recorded drop (ledger collate-fast-mode-not-carried): the Galaxy BAM to FASTQ wrapper name-sorts its input, so collate mode cannot affect the output. Its snapshot read md5s differ from the default case only by read order.'
  category: out-of-scope
- target: Read order inside the FASTQ outputs
  reason: Galaxy output is in read-name order, the source in samtools collate order; reads are compared as sorted lines. Mate synchronisation is covered by the paired fastq_info report.
  category: other

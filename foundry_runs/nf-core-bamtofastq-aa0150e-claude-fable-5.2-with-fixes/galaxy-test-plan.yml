plan_version: '1'
source:
  kind: nextflow
  name: nf-core/bamtofastq @ aa0150e
  derived_from: test-evidence
  notes: 'Translated from pipeline-level nf-tests (tests/*.nf.test + .snap). Selected candidate per summary-nextflow: tests/default.nf.test::-profile test. One further eligible candidate is translated as an extra case because it covers a branch the selected one does not reach: tests/no_bai.nf.test (adds a single-end sample). tests/collate_fast.nf.test was planned as a third case and removed after planemo attempt 1: the fast-mode input was dropped from the workflow.'
workflow:
  title: BAM to FASTQ conversion with QC (nf-core/bamtofastq)
  label_source: draft
  notes: Labels read from galaxy-workflow.gxwf.yml (1 input, 13 outputs) as re-extracted after planemo attempt 1.
test_cases:
- id: default_paired_end_bams

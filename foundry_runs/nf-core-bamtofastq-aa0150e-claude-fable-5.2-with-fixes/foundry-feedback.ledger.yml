  - id: stock-tool-version-instructions-contradict-cli
    raised_by: advance-galaxy-draft-step
    observed_in:
      mold: advance-galaxy-draft-step
      path: content/molds/advance-galaxy-draft-step/index.md
      revision: 12
      content_hash: 12f242ddbbfee7d9fe4ef8b6a2d701beceb71e4885cd19872c51041b04e08b27
      foundry_head: db8801f2f0a31746e35cf399dd96cdbb8aa36dcf
    subject:
      kind: related-project
      label: galaxy-tool-util-ts galaxy-tool-cache (add / summarize for stock tool ids)
      locator: https://github.com/jmchilton/galaxy-tool-util-ts/tree/main/packages/cli
    kind: defect
    severity: minor
    what: "The orchestrator and summarize-galaxy-tool say the shed 'can't auto-resolve' a stock tool's version, so an explicit --tool-version is required for add and summarize and must come from a populated cache. With @galaxy-tool-util/cli as installed, 'galaxy-tool-cache add cat1' (no version) resolved and cached cat1 v1.0.0, and the same for __ZIP_COLLECTION__, __FLATTEN__, __MERGE_COLLECTION__. Then 'galaxy-tool-cache summarize cat1 --tool-version 1.0.0' failed with 'Tool not found in cache: cat1', while 'summarize cat1' without a version worked, although 'galaxy-tool-cache list' shows cat1 at 1.0.0."
    expected: "Fix summarize so an explicit --tool-version matching the cached version of a stock id is found; update the two Molds to say that add resolves a stock version by itself (or under which conditions it cannot)."
    evidence: "Commands run in <run>/ with --cache-dir tool-cache on 2026-11-13; four stock ids behaved the same way."
    status: open
    issue: null

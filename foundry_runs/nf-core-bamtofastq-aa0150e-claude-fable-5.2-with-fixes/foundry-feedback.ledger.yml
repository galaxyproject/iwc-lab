      content_hash: 12f242ddbbfee7d9fe4ef8b6a2d701beceb71e4885cd19872c51041b04e08b27
    kind: friction
    severity: minor
    what: "The leaf skills the loop calls each write one fixed filename in the run directory (galaxy-tool-pin.json, galaxy-tool-summary.json, galaxy-user-tool.yml). The loop runs them once per step (22 iterations here, 11 distinct tools), and step 3 tells a later iteration to 'use the file an earlier iteration wrote' for a reused pin, which is impossible if every iteration overwrote it. Neither the orchestrator nor the harness says where per-step copies go."
    expected: "Name a per-step or per-tool location in the orchestrator (for example steps/<tool>/galaxy-tool-pin.json) and have the harness's 'prefix every filename' rule cover loop iterations."
    evidence: "This run kept them under steps/<tool>/ by its own convention."
    status: open
    issue: null

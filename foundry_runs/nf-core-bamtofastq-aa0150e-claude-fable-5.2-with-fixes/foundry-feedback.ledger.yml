  - id: count-only-collection-assertion-passes-static-check-fails-in-planemo
    raised_by: debug-galaxy-workflow-output
    observed_in:
      mold: debug-galaxy-workflow-output
      path: content/molds/debug-galaxy-workflow-output/index.md
      revision: 7
      content_hash: 1cf77ea80a7caec9eb73fd41288387f1180969cac216eb3d53c4e99edeb1ca2c
      foundry_head: df991d0d789b0a29618cbcdbe7eb6d9508f1f062
    subject:
      kind: research
      label: planemo-asserts-idioms
      locator: content/research/planemo-asserts-idioms/index.md
      content_hash: 9a6363854dcbeb01e1e590dc5bc0f5d7d0ec9675c4828ad2a8be8fa8022a61df
    kind: gap
    severity: major
    what: "Three things about collection and read assertions cost one 16-minute Planemo run and are in no packaged note. (1) Planemo 0.75.48 treats an output assertion as a collection check only when the key 'element_tests' is present (planemo/test/_check_output.py: for_collections). A collection output asserted with class: Collection + collection_type + element_count only is checked as a single file and fails with 'No path specified for expected output file [<label>]'. 'gxwf validate-tests --workflow' accepts that form. (2) Galaxy's verifier does not enforce an expected count of 0 ('if output_collection_def.count and ...' in galaxy.tool_util.verify.interactor.verify_collection), so an empty output collection cannot be asserted by count. (3) The note never mentions the 'sort' attribute of compare: diff, which is the order-insensitive exact comparison needed when a wrapper emits the same records in another order."
    expected: "Add to section 5 of planemo-asserts-idioms: always include element_tests (even empty) on a collection output; a zero count is not enforced, so prove emptiness through another output; and document compare: diff + sort: true (with decompress: true for gz) and what it stops checking. Have gxwf validate-tests warn on a collection assertion without element_tests."
    evidence: "Planemo attempt 1: 'No path specified for expected output file' for 3 count-only collection outputs; reads failed compare: diff on order only. Offline, galaxy.tool_util.verify passes the same data with sort: true + decompress: true."
    status: open
    issue: null
  - id: samtools-fastx-skip-sort-branch-unreachable
    raised_by: debug-galaxy-workflow-output
    observed_in:
      mold: debug-galaxy-workflow-output
      path: content/molds/debug-galaxy-workflow-output/index.md
      revision: 7
      content_hash: 1cf77ea80a7caec9eb73fd41288387f1180969cac216eb3d53c4e99edeb1ca2c
      foundry_head: df991d0d789b0a29618cbcdbe7eb6d9508f1f062
    subject:
      kind: related-project
      label: tools-iuc samtools_fastx wrapper (iuc/samtools_fastx 1.22+galaxy2)
      locator: toolshed.g2.bx.psu.edu/repos/iuc/samtools_fastx/samtools_fastx/1.22+galaxy2
    kind: defect
    severity: major
    what: "The wrapper's command skips its 'samtools sort -n' only when the input is typed qname_sorted.bam or qname_input_sorted.bam, but its input parameter accepts only sam,bam,cram. In a workflow, a dataset typed qname_input_sorted.bam (here: samtools collate output retyped by a post-job action) is therefore implicitly converted back to bam before the tool runs, and the tool name-sorts it anyway. A collated BAM cannot be converted to FASTQ in collate order with the Tool Shed wrappers, so the read order of nf-core modules that run 'samtools collate | samtools fastq' (SAMTOOLS_COLLATEFASTQ) cannot be reproduced."
    expected: "Upstream: add qname_sorted.bam and qname_input_sorted.bam (or unsorted.bam) to the input formats of samtools_fastx so the existing skip-sort branch is reachable, and give samtools_collate's output the datatype qname_input_sorted.bam. Foundry: record in a pattern or research note that BAM to FASTQ via samtools_fastx is always name-ordered, so a translation should not plan a collate step before it."
    evidence: "Planemo attempt 1 job records: 'Collate mapped pairs' wrote dataset 0713fa50...; 'Mapped pairs to FASTQ' read dataset f570025a... (implicit conversion) and ran 'samtools sort -@ $addthreads -m $addmemory\"M\" -n <input> ... > input && samtools fastq -N -1 forward... -2 reverse...'. Three workflow steps and one workflow input had to be removed again."
    status: open
    issue: null

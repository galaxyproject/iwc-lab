entries:
  - id: summarize-nextflow-edges-are-token-fragments
    raised_by: summarize-nextflow
    observed_in:
      mold: summarize-nextflow
      path: content/molds/summarize-nextflow/index.md
      revision: 21
      content_hash: 12fda0aa7f41e1899f921f4c9970af864e0022b25610e8f4fb6b4eba0a62d499
      foundry_head: df991d0d789b0a29618cbcdbe7eb6d9508f1f062
    subject:
      kind: cli-command
      label: foundry summarize-nextflow (workflow.edges extraction)
      locator: "package://@galaxy-foundry/summarize-nextflow#summaryNextflowSchema"
    kind: defect
    severity: major
    what: "On nf-core/bamtofastq the deterministic workflow.edges list contains argument-token fragments as edge sources ('[[:]', '[]]', '[', ']', '}', '? file(multiqc_config, checkIfExists: true)', 'files') whenever a process call has list literals or a multi-line closure as arguments, and it has no edges for processes called inside local subworkflows (ALIGNMENT_TO_FASTQ, PRE_CONVERSION_QC, PREPARE_INDICES). The output still passes validate-summary-nextflow."
    expected: "Split call arguments with bracket/brace/paren depth tracking so one argument gives one edge, drop literal-only arguments, and either descend into local subworkflows or mark the edge list as partial per call. The Mold could also say plainly that the LLM pass replaces the edge list rather than 'reconciles' it."
    evidence: "33 edges emitted, 17 of them fragments (5 for SAMTOOLS_CHR, 12 for MULTIQC). The whole edge list was rewritten by hand from workflows/bamtofastq.nf and subworkflows/local/*/main.nf."
    status: open
    issue: null
  - id: summarize-nextflow-inspect-banner-breaks-json
    raised_by: summarize-nextflow
    observed_in:
      mold: summarize-nextflow
      path: content/molds/summarize-nextflow/index.md
      revision: 21
      content_hash: 12fda0aa7f41e1899f921f4c9970af864e0022b25610e8f4fb6b4eba0a62d499
      foundry_head: df991d0d789b0a29618cbcdbe7eb6d9508f1f062
    subject:
      kind: cli-command
      label: foundry summarize-nextflow (nextflow inspect shell-out)
      locator: content/cli/foundry/index.md
    kind: defect
    severity: minor
    what: "The summarizer warned 'nextflow inspect returned non-JSON output; static container parsing used'. Running nextflow inspect by hand (Nextflow 26.10.5) shows the pipeline prints '[PIPELINE] ...' and '[WORKDIR] ...' lines before the JSON document, so the JSON itself is fine but not at the start of stdout."
    expected: "Parse from the first '{' line (or strip leading non-JSON lines) before giving up on nextflow inspect; also the shell-out should not leave .nextflow/ and work/ inside the source tree."
    evidence: "nextflow inspect . -profile test,docker -format json prints two bracketed banner lines, then a valid {\"processes\": [...]} document with resolved container names."
    status: open
    issue: null
  - id: summary-misses-getgenomeattribute-elvis-form
    raised_by: nextflow-summary-to-galaxy-reference-data
    observed_in:
      mold: nextflow-summary-to-galaxy-reference-data
      path: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
      revision: 5
      content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
      foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
    subject:
      kind: cli-command
      label: foundry summarize-nextflow (params source_kind / reference_rebuilds detection)
      locator: "package://@galaxy-foundry/summarize-nextflow#summaryNextflowSchema"
    kind: gap
    severity: minor
    what: "For nf-core/bamtofastq the summary gives the reference-data Mold neither of the two signals it is told to read: (1) main.nf assigns 'params.fasta = params.fasta ?: getGenomeAttribute(\"fasta\")' (Elvis form) but params[].source_kind is not getGenomeAttribute for fasta or fasta_fai; (2) the compute-if-missing rebuild is a channel idiom (fasta_fai.branch { meta.index == false } -> SAMTOOLS_FAIDX in a subworkflow) and reference_rebuilds[] is empty. The Mold says to flag 'rebuild-unverified rather than re-parsing source files', but the key-expanded signal has no such fallback wording, so I read main.nf."
    expected: "Detect the 'params.x = params.x ?: getGenomeAttribute(...)' form in main.nf, and document the branch-on-meta rebuild idiom as a known gap next to the rnaseq positive-form one in nextflow-reference-data-classification. The Mold should say what to do when the genome key exists in params[] but no param carries source_kind getGenomeAttribute."
    evidence: "params has genome/igenomes_base/igenomes_ignore; reference_assets has fasta and fasta_fai with source_kind nextflow_schema; reference_rebuilds is []."
    status: open
    issue: null
  - id: sample-sheet-note-silent-on-sheets-with-no-residual-metadata
    raised_by: nextflow-summary-to-galaxy-interface
    observed_in:
      mold: nextflow-summary-to-galaxy-interface
      path: content/molds/nextflow-summary-to-galaxy-interface/index.md
      revision: 6
      content_hash: 43966773391578490688098c9333f6eb2eaa94574755f5b6554e7f9b72a605c0
      foundry_head: 61da115975d155a36face0e83d5c28f638da7fca
    subject:
      kind: research
      label: nextflow-params-to-galaxy-inputs
      locator: content/research/nextflow-params-to-galaxy-inputs/index.md
      content_hash: b65bf1a16cb986bc04ff7926e6ca0eea9ce35980aa4d4c47d8a102a28ffae085
    kind: gap
    severity: minor
    what: "The Sample sheets table maps 'one path column per row' to sample_sheet and 'multiple heterogeneous path columns' to sample_sheet:record, but does not cover a sheet whose columns all dissolve into native Galaxy features: bamtofastq has sample_id (element identifier), mapped (the dataset), index (.bai/.crai, which a Galaxy bam dataset carries as metadata) and file_type (the datatype). Read literally the table gives sample_sheet:record (two path columns); I chose a plain list by combining a sentence from the reference-data note with the datatype note's '.bai usually sidecar' row."
    expected: "Add a row or rule: when every non-identifier column is either an index sidecar of the data column or restates the datatype, use a plain list / list:paired and say that the index column is subsumed; reserve sample_sheet* for sheets with residual row metadata."
    evidence: "sample_sheets[0].columns = sample_id(meta), mapped(data), index(data, optional), file_type(meta enum bam|cram)."
    status: open
    issue: null
  - id: data-flow-pattern-mocs-link-to-pages-not-in-bundle
    raised_by: nextflow-summary-to-galaxy-data-flow
    observed_in:
      mold: nextflow-summary-to-galaxy-data-flow
      path: content/molds/nextflow-summary-to-galaxy-data-flow/index.md
      revision: 8

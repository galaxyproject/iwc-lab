      content_hash: 84abb427cbcbae5616ae22e4a7fa803f14350605c246638575b3a32c5ad9c6fb
    kind: gap
    severity: major
    what: "The procedure says 'Find the closest workflow and rank it' and gives a feature hierarchy, but no retrieval method over ~120 IWC workflows: no index of domain / input topology / tool families, no search command. The upstream briefs deliberately contain no tool ids, so the only practical search was grep over .ga files for tool ids I knew from memory (samtools_fastx, __FILTER_FROM_FILE__), which is the tool knowledge the pipeline keeps out of this tier."
    expected: "Ship or name a retrieval aid: e.g. a packaged per-workflow index (category, input collection types, tool ids, built-in collection ops) or a documented grep recipe keyed on the data-flow brief's 'tool need' and 'Galaxy idiom' columns."
    evidence: "Search terms used: samtools_fastx (2 hits), bamtofastq/SamToFastq (0), samtools_idxstats (3), __FILTER_FROM_FILE__ (6). Ranking was done by reading converted step lists by hand."
    status: open
    issue: null
  - id: iwc-exemplar-output-assumes-one-nearest-workflow
    raised_by: compare-against-iwc-exemplar
    observed_in:
      mold: compare-against-iwc-exemplar
      path: content/molds/compare-against-iwc-exemplar/index.md
      revision: 12
      content_hash: 84abb427cbcbae5616ae22e4a7fa803f14350605c246638575b3a32c5ad9c6fb
      foundry_head: 94ce4ea20107680b467d03e8889b63689774e325
    subject:
      kind: mold
      label: compare-against-iwc-exemplar
      locator: content/molds/compare-against-iwc-exemplar/index.md
      content_hash: 84abb427cbcbae5616ae22e4a7fa803f14350605c246638575b3a32c5ad9c6fb
    kind: friction
    severity: minor
    what: "iwc-exemplar.gxwf.yml is defined as 'the nearest IWC exemplar's relevant subgraph', emitted for High or Medium confidence. bamtofastq had no domain exemplar but two useful low-confidence partial matches from different workflows (one for the BAM-to-FASTQ step, one for the collection-split motif). The contract does not say whether to emit the sibling file in that case or how to combine two sources; I wrote one non-runnable file with parts A and B."
    expected: "State what to write when the best evidence is several low-confidence pattern excerpts: either allow a multi-part exemplar file with per-part provenance, or say to emit only inline excerpts and no sibling file."
    evidence: "iwc-comparison-notes.md ranks two workflows Low/Low-medium; iwc-exemplar.gxwf.yml carries steps A_* and B_* from two IWC workflows."
    status: open
    issue: null

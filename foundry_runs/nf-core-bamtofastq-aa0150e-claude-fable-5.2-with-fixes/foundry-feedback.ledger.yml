      foundry_head: 61da115975d155a36face0e83d5c28f638da7fca
    subject:
      kind: mold
      label: nextflow-summary-to-galaxy-data-flow (packaged references)
      locator: content/molds/nextflow-summary-to-galaxy-data-flow/index.md
      content_hash: f71cc2b4ceb115d7d93c3dd2e622cbfafb8b9f338f1dd450ee5773f3c0a0e247
    kind: gap
    severity: major
    what: "The bundle carries the pattern index pages galaxy-collection-patterns.md and galaxy-conditionals-patterns.md, which say 'the linked operation pages give tool settings and pitfalls', but none of the linked pages (sync-collections-by-identifier, collection-cleanup-after-mapover-failure, conditional-transform-or-pass-through, conditional-route-between-alternative-outputs, ...) is packaged. For bamtofastq's per-sample single/paired routing I needed exactly those pages (how to split a collection by a classifier result, and how empty sides behave) and had only one-line summaries."
    expected: "Package the operation pages the two MOCs link to (at least on demand), or state in the Mold that the MOC summaries are all the data-flow tier gets and the details arrive in implement-galaxy-tool-step."
    evidence: "references/patterns/ holds 4 files, all MOCs; the routing design (classifier -> identifier table -> split collection) and its empty-branch behaviour were written from the one-line descriptions."
    status: open
    issue: null
  - id: data-flow-no-protocol-for-scope-decisions-that-hinge-on-wrappers
    raised_by: nextflow-summary-to-galaxy-data-flow
    observed_in:
      mold: nextflow-summary-to-galaxy-data-flow
      path: content/molds/nextflow-summary-to-galaxy-data-flow/index.md
      revision: 8
      content_hash: f71cc2b4ceb115d7d93c3dd2e622cbfafb8b9f338f1dd450ee5773f3c0a0e247
      foundry_head: 61da115975d155a36face0e83d5c28f638da7fca
    subject:
      kind: mold
      label: nextflow-summary-to-galaxy-data-flow
      locator: content/molds/nextflow-summary-to-galaxy-data-flow/index.md
      content_hash: f71cc2b4ceb115d7d93c3dd2e622cbfafb8b9f338f1dd450ee5773f3c0a0e247
    kind: friction
    severity: major
    what: "The procedure says the brief must not rule a tool in or out, and the open-requirements note says a drop's 'because' must cite a check actually run. For bamtofastq three interface choices (carry CRAM + reference, carry the chr region filter, expose collate fast mode) depend on what the samtools wrappers accept, which is only known in the step loop. But the template (phase 6) needs a fixed input list, and the loop has no instruction to add or remove workflow inputs. I had to drop CRAM and chr here on partly uncited grounds."
    expected: "Say how to carry a wrapper-dependent interface choice: e.g. keep the input in the brief marked 'provisional', let the template emit it, and give advance-galaxy-draft-step / repair-galaxy-draft-topology an explicit rule for removing an input whose consuming wiring could not be built. Or allow a bounded discovery probe from the design tier for exactly this case."
    evidence: "Ledger entries cram-and-reference-not-carried and chr-region-filter-not-carried carry 'because' text that says which part is unchecked."
    status: open
    issue: null
  - id: iwc-exemplar-retrieval-method-unspecified
    raised_by: compare-against-iwc-exemplar
    observed_in:
      mold: compare-against-iwc-exemplar
      path: content/molds/compare-against-iwc-exemplar/index.md
      revision: 12
      content_hash: 84abb427cbcbae5616ae22e4a7fa803f14350605c246638575b3a32c5ad9c6fb
      foundry_head: 94ce4ea20107680b467d03e8889b63689774e325
    subject:
      kind: mold
      label: compare-against-iwc-exemplar

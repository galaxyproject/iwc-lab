  - id: template-cannot-resolve-builtin-collection-ops-from-bundle
    raised_by: nextflow-summary-to-galaxy-template
    observed_in:
      mold: nextflow-summary-to-galaxy-template
      path: content/molds/nextflow-summary-to-galaxy-template/index.md
      revision: 10
      content_hash: 77f885d640900cca7dac4a3bbb33308d4d8065e871c919c672487db61caf93ab
      foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
    subject:
      kind: mold
      label: nextflow-summary-to-galaxy-template (packaged references)
      locator: content/molds/nextflow-summary-to-galaxy-template/index.md
      content_hash: 77f885d640900cca7dac4a3bbb33308d4d8065e871c919c672487db61caf93ab
    kind: gap
    severity: minor
    what: "The procedure says a step should reach Resolved 'when a pattern page or IWC exemplar covers the operation' and that emitting TODO over a pattern-covered recipe discards evidence. The bundle carries only the four pattern index pages; the operation pages with tool ids, versions, port names and state for __ZIP_COLLECTION__, __FLATTEN__ and __MERGE_COLLECTION__ are not packaged. Those three built-ins therefore stayed Identity-pinned with TODO ports, and only the four steps the IWC exemplar happened to show (collapse_dataset, Filter1, Cut1, __FILTER_FROM_FILE__) were Resolved."
    expected: "Package a compact built-in collection-operation reference (tool id, current version, input/output port names, state keys) with the template Mold, or package the operation pages its pattern indices link to."
    evidence: "Draft survey: 81 TODO sentinels across 19 step paths; 3 of those steps are parameterless built-in collection operations."
    status: open
    issue: null
  - id: tool-summary-has-no-command-block
    raised_by: advance-galaxy-draft-step
    observed_in:
      mold: summarize-galaxy-tool
      path: content/molds/summarize-galaxy-tool/index.md
      revision: 8
      content_hash: a53a303bff1d7ace3b44fb12af329b12695bfcd165933634b8fb6484c0c306f7
      foundry_head: f0515353aec7d57e89f60cac678c80907cf91e4c
    subject:
      kind: mold
      label: summarize-galaxy-tool
      locator: content/molds/summarize-galaxy-tool/index.md
      content_hash: a53a303bff1d7ace3b44fb12af329b12695bfcd165933634b8fb6484c0c306f7
    kind: gap
    severity: major
    what: "The procedure's step 4 says to 'preserve the command template enough for downstream binding' and record strict-shell / sort / dynamic behaviour, but the manifest emitted by 'galaxy-tool-cache summarize' (1.15) has no command, requirements, stdio or sanitizer fields: parsed_tool keys are id, version, name, description, inputs, outputs, citations, license, profile, edam_*, xrefs, help; artifacts.raw_tool_source_path is null. For bamtofastq the decisive wrapper facts were only in the command block: iuc/samtools_fastx name-sorts every BAM not typed qname_sorted.bam/qname_input_sorted.bam (which changes read order versus the source's samtools collate), iuc/samtools_view re-sorts some inputs, and its expression parameter's sanitizer decides whether a flag expression survives. I had to fetch wrapper XML from tools-iuc on GitHub by guessing the path; the Tool Shed raw-file URL returned 403."
    expected: "Either have the cache keep the raw tool source (so raw_tool_source_path is set and the command block is readable offline), or tell the Mold plainly that command semantics are NOT in the summary and give a supported way to fetch the wrapper source for a pinned changeset. implement-galaxy-tool-step should say to read the command block whenever a plan carries an ordering or sorting constraint."
    evidence: "Three blocking open-requirements entries (fastx-name-sorts-*) and one topology repair (three added samtools collate steps) came from a fact that no summary field carries."
    status: open
    issue: null
  - id: loop-artifacts-have-fixed-filenames

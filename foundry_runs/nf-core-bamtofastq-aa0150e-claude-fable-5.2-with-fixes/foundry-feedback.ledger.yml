    kind: gap
    severity: major
    what: "For a .gz snapshot token on a compressed Galaxy output the note offers two routes: 'with a materialized expected file, use file + compare: diff + decompress: true', else weak content assertions. It does not say how an expected file can be materialized when the snapshot holds only a token, nor how to label its evidence. For bamtofastq every primary output (the FASTQ reads) is a .gz token, so following the note literally leaves the main product with only has_n_lines / has_text checks. I materialized the files by running the source module's own commands in the source's container on the upstream fixture and accepting a file only when the md5 of its decompressed content equalled the snapshot token; then file + compare: diff + decompress gives real snapshot parity. I labelled these test-evidence, which the Mold's evidence rules neither allow nor forbid clearly."

class: GalaxyWorkflow
label: "nf-core/bamtofastq \u2014 BAM/CRAM to FASTQ conversion with QC"
doc: 'Galaxy draft for nf-core/bamtofastq (v2.4.0, source aa0150e). Mapped reads are

  indexed, optionally restricted to contigs, converted to FASTQ (single-end

  collate or paired-end view/merge/collate/cat), then QC''d (FastQC,

  fastqutils) and aggregated with MultiQC.

  Draft status: topology settled; every tool step deferred to wrapper

  discovery. `merge_converted` is a resolved built-in collection merge.

  '
uuid: 3a7d1e52-9b64-4c8e-8f01-6d2b5c9a4e77
tags:
- nf-core/bamtofastq
- bam
- fastq
- conversion
inputs:
  input_alignments:
    type: collection
    collection_type: list
    optional: false
    doc: 'One BAM or CRAM per sample. Samplesheet `sample_id` is the element

      identifier; the datatype distinguishes BAM from CRAM. Indexes are built

      inside the workflow when needed.

      '
  no_read_QC:
    type: boolean
    optional: false
    default: false
    doc: Skip FastQC on input and converted reads.
  no_stats:
    type: boolean
    optional: false
    default: false
    doc: Skip samtools stats/flagstat/idxstats.
  samtools_collate_fast:
    type: boolean
    optional: false
    default: false
    doc: Use samtools collate fast mode with `reads_in_memory`.
  reads_in_memory:
    type: integer
    optional: false
    default: 100000
    doc: Reads held in memory when collate fast mode is on.
  multiqc_title:
    type: string
    optional: true
    doc: MultiQC report title.
  multiqc_config:
    type: data
    optional: true
    doc: Optional MultiQC config file.
outputs:
  converted_reads_single:
    outputSource: fastx_single/output
  post_fastqc_html:
    outputSource: post_fastqc/html_file
  fastqutils_info:
    outputSource: fastqutils/output
  multiqc_report:
    outputSource: multiqc/html_report
steps:
  post_fastqc:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/0.74+galaxy1
    tool_version: 0.74+galaxy1
    in:
      input_file: fastx_single/output
    out:
    - id: html_file
    - id: text_file
    tool_shed_repository:
      changeset_revision: 2c64fded1286
      name: fastqc
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    state:
      nogroup: false
      kmers: 7
      min_length: null
  fastqutils:
    tool_id: toolshed.g2.bx.psu.edu/repos/bgruening/fastq_info/fastq_info/0.25.3+galaxy0
    tool_version: 0.25.3+galaxy0
    in:
      input_option|fastq_1: fastx_single/output
    out:
    - id: output
    tool_shed_repository:
      changeset_revision: 2bca15e630a4
      name: fastq_info
      owner: bgruening
      tool_shed: toolshed.g2.bx.psu.edu
    state:
      input_option:
        input_type: single
      q: false
      r: false
  multiqc:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/multiqc/multiqc/1.35+galaxy5
    tool_version: 1.35+galaxy5
    in:
      results_0|software_cond|output_0|input: post_fastqc/text_file
      title: multiqc_title
    out:
    - id: html_report
    - id: stats
    tool_shed_repository:
      changeset_revision: 94b6bea727ae
      name: multiqc
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    state:
      results:
      - software_cond:
          software: fastqc
          output:
          - type: data
      flat: false
      export: false
      png_plots: false
      comment: ''
  fastx_single:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_fastx/samtools_fastx/1.22+galaxy2
    tool_version: 1.22+galaxy2
    in:
      input: input_alignments
    out:
    - id: output
    tool_shed_repository:
      changeset_revision: 4bde991b8037
      name: samtools_fastx
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    state:
      output_fmt_cond:
        output_fmt_select: fastqsanger
        __current_case__: 1
        default_quality: null
        output_quality: false
        ilumina_casava: false
      outputs:
      - other
      copy_tags: false
      read_numbering: ''
      idxout_cond:
        idxout_select: 'no'
        __current_case__: 0
      copy_arb_tags: null
      inclusive_filter: []
      exclusive_filter:
      - '256'
      - '2048'
      exclusive_filter_all: []
comments:
  stage-input:
    type: frame
    position:
    - 0
    - 0
    size:
    - 500
    - 300
    color: blue
    title: Inputs and contig selection
    contains_steps: []
  stage-qc-stats:
    type: frame
    position:
    - 520
    - 0
    size:
    - 500
    - 400
    color: turquoise
    title: Pre-conversion QC and stats
    contains_steps: []
  stage-convert:
    type: frame
    position:
    - 0
    - 420
    size:
    - 900
    - 300
    color: green
    title: FASTQ conversion
    contains_steps:
    - fastx_single
  stage-post:
    type: frame
    position:
    - 950
    - 0
    size:
    - 600
    - 500
    color: yellow
    title: Post-conversion QC and report
    contains_steps:
    - post_fastqc
    - fastqutils
    - multiqc

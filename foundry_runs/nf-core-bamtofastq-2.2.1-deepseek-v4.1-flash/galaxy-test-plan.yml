plan_version: '1'
source:
  kind: nextflow
  name: nf-core/bamtofastq v2.4.0 (aa0150e)
  derived_from: test-evidence
  notes: "Translated from tests/chr.nf.test::-profile test --input test_chr_samplesheet.csv\n(whole-pipeline nf-test, scope primary, real execution, assert\
    \ workflow.success\n+ snapshot). The snapshot captures succeeded_task_count and\nstable_names/stable_paths only \u2014 no md5/content captures \u2014\
    \ so expected values\nare file presence and counts, not bytes.\n"
workflow:
  title: "nf-core/bamtofastq \u2014 BAM/CRAM to FASTQ conversion with QC"
  label_source: draft
  notes: 'Labels read from galaxy-workflow.gxwf.yml (inputs: input_alignments,

    input_layout, fasta, chr, no_read_QC, no_stats, samtools_collate_fast,

    reads_in_memory, multiqc_title, multiqc_config; outputs: converted_reads_single,

    converted_reads_paired, chr_alignment, pre_fastqc_html, post_fastqc_html,

    samtools_stats, samtools_flagstat, samtools_idxstats, fastqutils_info,

    multiqc_report).

    '
test_cases:
- id: bamtofastq-chr-profile-test
  doc: 'nf-core/bamtofastq chr test profile: one single-end BAM restricted to chrX/chrY/X/Y, converted to FASTQ with stats, FastQC, fastqutils and MultiQC.

    '
  derived_from: mixed
  provenance: tests/chr.nf.test::-profile test --input test_chr_samplesheet.csv
  job_inputs:
  - workflow_label: input_alignments
    label_status: resolved
    description: Single-element BAM collection (element identifier `test3`).
    collection_shape: list
    datatype: bam
    fixture:
      storage: null
      location: null
      checksum: null
      provenance: "test-data-refs.json: nf-core test-datasets test3.single_end.markduplicates.sorted.bam, SHA-1 072c537f\u2026"
  - workflow_label: no_read_QC
    label_status: resolved
    description: QC enabled.
    collection_shape: null
    datatype: null
    fixture:
      storage: generated-toy
      location: 'false'
      checksum: null
      provenance: parameter unset in the test profile
  - workflow_label: no_stats
    label_status: resolved
    description: Stats enabled.
    collection_shape: null
    datatype: null
    fixture:
      storage: generated-toy
      location: 'false'
      checksum: null
      provenance: parameter unset in the test profile
  - workflow_label: samtools_collate_fast
    label_status: resolved
    description: Default collate mode.
    collection_shape: null
    datatype: null
    fixture:
      storage: generated-toy
      location: 'false'
      checksum: null
      provenance: parameter unset in the test profile
  - workflow_label: reads_in_memory
    label_status: resolved
    description: Default value (unused with fast mode off).
    collection_shape: null
    datatype: null
    fixture:
      storage: generated-toy
      location: '100000'
      checksum: null
      provenance: nextflow_schema default
  - workflow_label: multiqc_title
    label_status: resolved
    description: Chosen title to exercise the connection.
    collection_shape: null
    datatype: null
    fixture:
      storage: generated-toy
      location: nf-core/bamtofastq test
      checksum: null
      provenance: chosen value
  - workflow_label: multiqc_config
    label_status: resolved
    description: Left empty (wrapper support unverified).
    collection_shape: null
    datatype: null
    fixture:
      storage: generated-toy
      location: ''
      checksum: null
      provenance: optional input omitted
  expected_outputs:
  - workflow_label: converted_reads_single
    label_status: resolved
    description: Converted FASTQ; the snapshot lists `test3.chrX_chrY_X_Y_other.fq.gz`.
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: element_count
      intent: One converted FASTQ for the one sample.
      expected_value: 1
      tolerance: null
      element_identifier: null
      evidence: test-evidence
      confidence: high
    - family: ftype
      intent: Converted reads are plain FASTQ (Galaxy element naming drops the .gz extension, which FastQC needs).
      expected_value: fastqsanger
      tolerance: null
      element_identifier: test3
      evidence: intent
      confidence: medium
  - workflow_label: fastqutils_info
    label_status: resolved
    description: One `test3.chrX_chrY_X_Y.txt` fastqutils report.
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: element_count
      intent: One FASTQ integrity report per converted sample.
      expected_value: 1
      tolerance: null
      element_identifier: null
      evidence: test-evidence
      confidence: high
    - family: ftype
      intent: The report is plain text.
      expected_value: txt
      tolerance: null
      element_identifier: test3
      evidence: intent
      confidence: high
  - workflow_label: post_fastqc_html
    label_status: resolved
    description: Post-conversion FastQC report (also pruned by `.nftignore`).
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: element_count
      intent: One post-conversion FastQC HTML for the converted reads.
      expected_value: 1
      tolerance: null
      element_identifier: null
      evidence: intent
      confidence: medium
  - workflow_label: multiqc_report
    label_status: resolved
    description: MultiQC HTML report; the snapshot lists `multiqc_citations.txt` but not the report itself (`.nftignore`).
    output_kind: dataset
    collection_shape: null
    assertion_intent:
    - family: ftype
      intent: MultiQC produced an HTML report.
      expected_value: html
      tolerance: null
      element_identifier: null
      evidence: intent
      confidence: high
unresolved:
- kind: assertion
  description: 'The nf-test snapshot records file names/paths and succeeded_task_count only; it carries no checksums, so no byte-level comparison with the
    source outputs is possible.

    '
  blocking: false
  suggested_resolution: Assert counts/types/identifiers; a future run could add content checks after a local baseline.
- kind: collection-shape
  description: 'The source renames sample ids to `test3.chrX_chrY_X_Y` after chr extraction; the Galaxy workflow keeps the input element identifier `test3`
    through map-over steps.

    '
  blocking: false
  suggested_resolution: Assert the workflow's own identifiers (`test3`); do not expect the source's renamed ids.
omissions:
- target: succeeded_task_count (13 in the snapshot)
  reason: Galaxy schedules a different job set (16 steps, mapped per sample); the counts are not comparable.
  category: out-of-scope
- target: content of stats/flagstat/idxstats/fastqutils
  reason: Snapshot carries names only; samtools 1.22/2.0 wrapper versions differ from the source's samtools 1.23.1.
  category: weak-output
- target: converted_reads_paired
  reason: 'Dropped: the paired branch was removed after Galaxy failed to execute the when-gated branches; the workflow is single-end only.'
  category: out-of-scope
- target: chr_alignment / converted_reads FASTQ bytes
  reason: The source's chr naming/order and Galaxy's conversions are not byte-identical; only presence and type are asserted.
  category: nondeterministic
- target: pre_fastqc_html (pre-conversion FastQC)
  reason: 'Dropped from the workflow: the Galaxy FastQC wrapper cannot decode BAM (no samtools in the container, fastqc exits 1).'
  category: out-of-scope
- target: chr_alignment (contig-restricted BAM)
  reason: 'chr filtering dropped: samtools view region queries need a BAM index, and the Galaxy chain has no way to attach one to the mapped dataset; the
    toy BAM also carries contigs 1/2, not chrX/chrY.'
  category: out-of-scope
- target: samtools_stats
  reason: 'Dropped: devteam samtools_stats wrapper failed validation under map-over.'
  category: out-of-scope
- target: samtools_flagstat
  reason: 'Dropped: devteam samtools_flagstat wrapper failed validation under map-over.'
  category: out-of-scope
- target: samtools_idxstats
  reason: 'Dropped: devteam samtools_idxstats wrapper failed validation under map-over.'
  category: out-of-scope
- target: fasta
  reason: 'Dropped: a single reference dataset cannot map over the input collection; workflow is BAM-only.'
  category: out-of-scope
warnings:
- code: no-upstream-expected-outputs
  message: 'The selected case''s snapshot captures names/paths and task count only; every assertion here is a presence/count/type check, not a translated
    expected content value.

    '
  path: summary-nextflow.json#/test_candidates/0/snapshot
- code: layout-simplification
  message: 'The paired branch was simplified (collate+fastx instead of view/merge/collate/cat); the single-end chr profile does not exercise either paired
    path.

    '
  path: open-requirements.ledger.yml#/entries
- code: fastq-extension
  message: 'Galaxy samtools_fastx emits `fastqsanger.gz`, while the source names files `*.fq.gz`; assertions use the Galaxy datatype, not the source filename.

    '
  path: galaxy-workflow.gxwf.yml#/steps/fastx_single

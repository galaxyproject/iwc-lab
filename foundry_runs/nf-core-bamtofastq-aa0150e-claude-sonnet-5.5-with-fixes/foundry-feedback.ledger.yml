  observed_in: *id001
  status: open
  issue: null
  id: nf-core-snapshot-md5-for-module-written-text-and-version-stamped-stats
  subject:
    kind: mold
    label: nextflow-test-to-galaxy-test-plan / nextflow-snapshot-to-galaxy-assertions note
    locator: content/research/nextflow-snapshot-to-galaxy-assertions/index.md
  kind: gap
  severity: minor
  what: >-
    The note tells agents to translate snapshot md5 tokens of plain-text outputs to checksum assertions (test-evidence). Two
    classes did not reproduce on Galaxy: samtools stats (header has version + command line) and nf-core module-authored files
    (fastqutils/*.txt is an echo written by the module, not tool output). Planemo attempt 2 failed on them; flagstat/idxstats
    md5 tokens did match.
  expected: >-
    Add a caveat: check the nf-core module script for module-written text and version/command-stamped headers before emitting
    checksum; use fixture-derived content assertions for those.
  evidence: >-
    planemo attempt 2: md5 53fc83... vs token 3c3f8f... (stats); source modules/nf-core/fastqutils/info/main.nf line 28 echo.

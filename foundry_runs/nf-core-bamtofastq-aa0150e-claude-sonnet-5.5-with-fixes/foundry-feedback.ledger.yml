entries:
- id: summarize-nextflow-workflow-edges-contain-parse-junk
  raised_by: summarize-nextflow
  observed_in:
    mold: summarize-nextflow
    path: content/molds/summarize-nextflow/index.md
    revision: 21
    content_hash: 12fda0aa7f41e1899f921f4c9970af864e0022b25610e8f4fb6b4eba0a62d499
    foundry_head: df991d0
  subject:
    kind: cli-command
    label: foundry summarize-nextflow (workflow.edges extraction)
    locator: package://gxwf-foundry#summarize-nextflow
  kind: defect
  severity: minor
  what: >-
    On nf-core/bamtofastq the deterministic summary's workflow.edges[] contain parser fragments as endpoints (e.g. from '[[:]',
    ']]', '}', '? file(multiqc_config, ...)'), and wrongly attribute the main data flow (e.g. conversion_input -> ALIGNMENT_TO_FASTQ
    lacks the BAM input edge). The tool warns 'workflow graph extraction is intentionally partial in resolver v1'. The Mold
    procedure (step 6) says an LLM pass reconciles edges, but gives no instruction for what to do with the junk edges when
    the CLI is the producer and the schema forbids extra fields.
  expected: >-
    Either filter edges whose endpoints are not channel/process identifiers in the CLI, or state in the Mold that the agent
    must repair workflow.edges[] after the CLI run (and re-validate) and downstream Molds should treat edges as hints only.
  evidence: >-
    summary-nextflow.json workflow.edges: 33 entries, ~12 with non-identifier endpoints; validator still reports 'valid'.
  status: open
  issue: null
- id: summary-nextflow-fasta-source-kind-misses-getgenomeattribute
  raised_by: nextflow-summary-to-galaxy-reference-data
  observed_in:
    mold: nextflow-summary-to-galaxy-reference-data
    path: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
    revision: null
    content_hash: null
    foundry_head: null
  subject:
    kind: cli-command
    label: foundry summarize-nextflow (params[].source_kind)
    locator: package://gxwf-foundry#summarize-nextflow
  kind: defect
  severity: minor
  what: >-
    For nf-core/bamtofastq main.nf has `params.fasta = params.fasta ?: getGenomeAttribute('fasta')` (and same for fasta_fai),
    but summary params[fasta/fasta_fai].source_kind is `nextflow_schema` with source_expression null; the reference-data Mold
    tells agents to use source_kind == getGenomeAttribute as the key-expanded-bundle signal.
  expected: >-
    Detect getGenomeAttribute backfills in main.nf even when the param also appears in nextflow_schema.json (set source_kind/source_expression).
  evidence: summary-nextflow.json params fasta/fasta_fai; source/main.nf lines 37-38.
  status: open
  issue: null

  id: gxwf-validate-passes-but-planemo-gxformat2-conversion-fails-on-step-labels
  subject:
    kind: related-project
    label: gxwf validate / draft-extract vs gxformat2 bundled with planemo 0.75.48
    locator: https://github.com/galaxyproject/gxformat2
  kind: defect
  severity: major
  what: >-
    A workflow whose map-form steps carry a descriptive `label` while connections reference the map key passed gxwf draft-validate
    --concrete --strict-state, gxwf validate and validate-tests, but planemo test died in 2s: gxformat2 normalized/_conversion.py
    step_id() int(label_or_id) ValueError: invalid literal for int() with base 10 (key name).
  expected: >-
    Template/implement Molds (or gxwf validate) should enforce that the step part of a source is the label when a label is
    present (the gxformat2-schema note says so but nothing checks it), or the draft Molds should not emit `label` on map-form
    steps.
  evidence: planemo attempt 1 log; fixed by moving labels to doc.

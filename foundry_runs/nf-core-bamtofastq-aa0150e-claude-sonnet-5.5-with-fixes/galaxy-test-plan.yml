plan_version: '1'
source:
  kind: nextflow
  name: nf-core/bamtofastq @ aa0150e (tests/default.nf.test + default.nf.test.snap)
  derived_from: test-evidence
  notes: >-
    Selected candidate tests/default.nf.test::-profile test (summarize-nextflow test_selection: selected). Snapshot md5 tokens
    exist for the flagstat/idxstats/stats/fastq_info text files and for the merged FASTQ (.gz, md5 of decompressed content).
    Expected values that come from the snapshot are test-evidence; read counts measured from the fixture BAMs are fixture-derived.
workflow:
  title: nf-core/bamtofastq (Galaxy conversion)
  label_source: draft
  notes: >-
    Labels read from galaxy-workflow.gxwf.yml (inputs: alignments, reference_fasta, skip_read_qc, skip_stats; outputs: converted_reads,
    flagstat, idxstats, alignment_stats, fastqc_input_html/_data, fastqc_reads_html/_data, fastq_integrity, multiqc_report).
test_cases:
- id: default-bam-paired
  doc: >-
    Two paired-end BAM files (test, test2) converted to paired FASTQ with QC enabled (all defaults), reference genome.fasta
    supplied, as in nf-core tests/default.nf.test.
  derived_from: mixed
  provenance: >-
    tests/default.nf.test::-profile test (params input=test_bam_samplesheet.csv, fasta=genome.fasta); snapshot tests/default.nf.test.snap
  job_inputs:
  - workflow_label: alignments
    label_status: resolved
    description: list of the two samplesheet BAMs; element identifier = sample_id
    collection_shape: list
    datatype: bam
    fixture:
      storage: null
      location: null
      checksum: null
      provenance: >-
        Elements: test -> test.paired_end.sorted.bam (SHA-1:0799f89638bddd570439115c606f425c22d189b1), test2 -> test2.paired_end.sorted.bam
        (SHA-1:522fb037cea05b9d41dd69647f27a644838bf507); both under https://github.com/nf-core/test-datasets/raw/bamtofastq/test-datasets/data/genomics/homo_sapiens/illumina/bam
        (see test-data-refs.json)
  - workflow_label: reference_fasta
    label_status: resolved
    description: genome.fasta from the nf-core modules test-datasets
    collection_shape: null
    datatype: fasta
    fixture:
      storage: remote-url
      location: https://raw.githubusercontent.com/nf-core/test-datasets/modules/data/genomics/homo_sapiens/genome/genome.fasta
      checksum: SHA-1:56e7a0c035e2fce8ebe497d3704431d7586fd444
      provenance: tests/default.nf.test params.fasta (test-data-refs.json)
  - workflow_label: skip_read_qc
    label_status: resolved
    description: left at default false (default test runs read QC)
    collection_shape: null
    datatype: null
    fixture:
      storage: null
      location: null
      checksum: null
      provenance: workflow default
  - workflow_label: skip_stats
    label_status: resolved
    description: left at default false (default test runs stats)
    collection_shape: null
    datatype: null
    fixture:
      storage: null
      location: null
      checksum: null
      provenance: workflow default
  expected_outputs:
  - workflow_label: converted_reads
    label_status: resolved
    description: Paired FASTQ per sample (nf-core reads/<id>_1|2.merged.fastq.gz).
    output_kind: collection
    collection_shape: list:paired
    assertion_intent:
    - family: element_count
      intent: two samples (test, test2)
      expected_value: 2
      tolerance: null
      element_identifier: null
      evidence: test-evidence
      confidence: high
    - family: has_n_lines
      intent: >-
        forward FASTQ of test: 2821 read pairs in the BAM x 4 lines; Galaxy stores the output as fastqsanger.gz so write decompress:
        true into the assertion
      expected_value: 11284
      tolerance: &id001
        kind: none
        magnitude: null
        rationale: exact
      element_identifier: test/forward
      evidence: fixture-derived
      confidence: medium
    - family: has_n_lines
      intent: 'reverse FASTQ of test: 2821 pairs x 4 lines (decompress: true)'
      expected_value: 11284
      tolerance: *id001
      element_identifier: test/reverse
      evidence: fixture-derived
      confidence: medium
    - family: has_n_lines
      intent: 'forward FASTQ of test2: 2718 pairs x 4 lines (decompress: true)'
      expected_value: 10872
      tolerance: *id001
      element_identifier: test2/forward
      evidence: fixture-derived
      confidence: medium
    - family: has_n_lines
      intent: 'reverse FASTQ of test2: 2718 pairs x 4 lines (decompress: true)'
      expected_value: 10872
      tolerance: *id001
      element_identifier: test2/reverse
      evidence: fixture-derived
      confidence: medium
    - family: has_text
      intent: 'read name from the test BAM appears in the forward FASTQ (decompress: true)'
      expected_value: testN:1
      tolerance: null
      element_identifier: test/forward
      evidence: fixture-derived
      confidence: medium
    - family: has_text
      intent: 'read name from the test2 BAM appears in the forward FASTQ (decompress: true)'
      expected_value: testT:1
      tolerance: null
      element_identifier: test2/forward
      evidence: fixture-derived
      confidence: medium
  - workflow_label: flagstat
    label_status: resolved
    description: samtools flagstat per sample (nf-core samtools/<id>.flagstat).
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: checksum
      intent: nf-test snapshot token test.flagstat:md5 (plain text, stored uncompressed)
      expected_value: md5$a53f3d26e2e9851f7d528442bbfe9781
      tolerance: *id001
      element_identifier: test
      evidence: test-evidence
      confidence: medium
    - family: checksum
      intent: nf-test snapshot token test2.flagstat:md5
      expected_value: md5$acbd95030a362a7e6491faa87d1b9c2c
      tolerance: *id001
      element_identifier: test2
      evidence: test-evidence
      confidence: medium
  - workflow_label: idxstats
    label_status: resolved
    description: samtools idxstats per sample (nf-core samtools/<id>.idxstats).
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: checksum
      intent: nf-test snapshot token test.idxstats:md5
      expected_value: md5$e179601fa7b8ebce81ac3765206f6c15
      tolerance: *id001
      element_identifier: test
      evidence: test-evidence
      confidence: medium
    - family: checksum
      intent: nf-test snapshot token test2.idxstats:md5
      expected_value: md5$90f01313bc89c7fd096aad051cd71b66
      tolerance: *id001
      element_identifier: test2
      evidence: test-evidence
      confidence: medium
  - workflow_label: alignment_stats
    label_status: resolved
    description: samtools stats per sample (nf-core samtools/<id>.stats).
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: has_text
      intent: >-
        samtools stats summary line: raw total sequences (excludes the 2 secondary/supplementary records of test) measured
        from the fixture BAM
      expected_value: "raw total sequences:\t5642"
      tolerance: null
      element_identifier: test
      evidence: fixture-derived
      confidence: medium
    - family: has_text
      intent: same for test2
      expected_value: "raw total sequences:\t5436"
      tolerance: null
      element_identifier: test2
      evidence: fixture-derived
      confidence: medium
  - workflow_label: fastq_integrity
    label_status: resolved
    description: >-
      fastq_info report per sample; the nf-core snapshot token is a message written by the nf-core module, not tool output,
      so it is not translatable
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: has_text
      intent: fastq_info reports the read-pair count of the sample (2821 pairs in the test BAM)
      expected_value: 'Number of reads: 2821'
      tolerance: null
      element_identifier: test
      evidence: fixture-derived
      confidence: medium
    - family: has_text
      intent: fastq_info ends with OK for valid pairs
      expected_value: OK
      tolerance: null
      element_identifier: test
      evidence: intent
      confidence: medium
    - family: has_text
      intent: 2718 pairs in the test2 BAM
      expected_value: 'Number of reads: 2718'
      tolerance: null
      element_identifier: test2
      evidence: fixture-derived
      confidence: medium
    - family: has_text
      intent: OK for test2
      expected_value: OK
      tolerance: null
      element_identifier: test2
      evidence: intent
      confidence: medium
  - workflow_label: fastqc_input_data
    label_status: resolved
    description: >-
      FastQC raw data on the input BAMs (nf-core fastqc/<id>.pre_conversion_fastqc.zip is name-only in the snapshot).
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: element_count
      intent: one FastQC report per sample
      expected_value: 2
      tolerance: null
      element_identifier: null
      evidence: intent
      confidence: medium
    - family: has_text
      intent: FastQC raw data contains its summary header
      expected_value: Total Sequences
      tolerance: null
      element_identifier: test
      evidence: intent
      confidence: medium
  - workflow_label: fastqc_reads_data
    label_status: resolved
    description: FastQC raw data on the converted reads (nf-core fastqc/<id>.post_conversion_1|2).
    output_kind: collection
    collection_shape: list:paired
    assertion_intent:
    - family: element_count
      intent: one entry per sample
      expected_value: 2
      tolerance: null
      element_identifier: null
      evidence: intent
      confidence: medium
    - family: has_text
      intent: FastQC raw data of the forward reads of test contains the summary header
      expected_value: Total Sequences
      tolerance: null
      element_identifier: test/forward
      evidence: intent
      confidence: medium
  - workflow_label: multiqc_report
    label_status: resolved
    description: Aggregated QC report. The nf-core multiqc_report.html is excluded from the snapshot content (name only).
    output_kind: dataset
    collection_shape: null
    assertion_intent:
    - family: has_text
      intent: 'report is a MultiQC HTML page (weak smoke check: type/content marker only)'
      expected_value: MultiQC
      tolerance: null
      element_identifier: null
      evidence: intent
      confidence: low
unresolved: []
omissions:
- target: tests chr, cram, fai, no_bai, no_crai, no_qc, no_stats, collate_fast (8 other nf-test candidates)
  reason: >-
    chr and collate_fast cover dropped features; cram/no_crai need CRAM fixtures; fai/no_bai/no_crai cover index handling
    Galaxy does implicitly; no_qc/no_stats gate steps whose skipped outputs have no assertable content. Only the default whole-pipeline
    case is planned (primary coverage).
  category: out-of-scope
- target: >-
    succeeded_task_count (32), software versions YAML, pipeline_info, multiqc_data/*, multiqc_report.html content, stable_name
    path list
  reason: >-
    Nextflow runtime metadata / timestamped or non-deterministic reports; Galaxy asserts invocation success and labeled outputs
    instead. multiqc_citations.txt md5 is not exposed as a Galaxy output.
  category: nondeterministic
- target: fastqc_input_html, fastqc_reads_html
  reason: HTML FastQC pages (timestamped); the same data is asserted via the raw-data outputs.
  category: nondeterministic
warnings:
- code: untranslatable-snapshot
  message: >-
    Snapshot md5 tokens for reads/test_1.merged.fastq.gz (9b0c08862a5e47e842a485ddad31b871), test_2.merged.fastq.gz (40e17982d1231e561d6420234ae29357),
    test2_1.merged.fastq.gz (a4984fb5a60f80ccbfbfcf1cef9daaf3), test2_2.merged.fastq.gz (bde23801e2d60604afb3bd0b0ab014ab)
    hash the decompressed content (nf-test), while Galaxy stores fastqsanger.gz compressed and checksum ignores decompression;
    additionally the Galaxy design collapses the nf-core mapped/unmapped re-concatenation into one samtools fastx call so
    read order may differ. Replaced by fixture-derived line counts and read-name assertions.
  path: tests/default.nf.test.snap#content[3] reads/*.merged.fastq.gz
- code: untranslatable-snapshot
  message: 'Snapshot md5 tokens for multiqc_citations.txt cannot be asserted: not a Galaxy workflow output.'
  path: tests/default.nf.test.snap#content[3] multiqc_citations.txt
- code: untranslatable-snapshot
  message: >-
    Snapshot md5 tokens test.stats/test2.stats (samtools stats header holds tool version and command line) and fastqutils/test.txt,
    test2.txt (message written by the nf-core module, not by fastq_info) do not reproduce with the Galaxy wrappers (planemo
    attempt 2); replaced by fixture-derived has_text assertions.
  path: tests/default.nf.test.snap#content[3] test.stats, test2.stats, test.txt, test2.txt

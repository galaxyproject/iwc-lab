# iwc-exemplar-gxformat2 — relevant subgraph only
# Primary exemplar: read-preprocessing/short-read-qc-trimming/short-read-quality-control-and-trimming (IWC @ 9f111cb)
#   steps: Raw reads -> fastp -> MultiQC ; outputs: fastp trimmed reads, MultiQC HTML report
# Secondary idiom: FastQC step (devteam/fastqc 0.74+galaxy1, text_file -> MultiQC software=fastqc) from
#   amplicon/amplicon-mgnify/mgnify-amplicon-pipeline-v5-quality-control-paired-end
# Converted with: gxwf convert --to format2 --compact ; fastp tool_state trimmed.
class: GalaxyWorkflow
label: Short-read quality control and trimming
doc: This workflow performs quality control and trimming on paired-end Illumina fastq(.gz) files using fastp and aggregates the quality control reports with MultiQC
inputs:
- id: Raw reads
  type: collection
  collection_type: list:paired
  optional: false
  fields: null
  column_definitions: null
  doc: Raw reads as paired-end collection
- id: Qualified quality score
  type: int
  optional: true
  default: 15
  doc: The quality value that a base is qualified. Default 15 means a quality score &gt;=Q15 is qualified.
outputs:
- id: fastp JSON report
  outputSource: fastp/report_json
- id: fastp trimmed reads
  outputSource: fastp/output_paired_coll
- id: MultiQC HTML report
  outputSource: MultiQC/html_report
steps:
- id: fastp
  label: fastp
  doc: Quality control and trimming of the raw reads
  tool_id: toolshed.g2.bx.psu.edu/repos/iuc/fastp/fastp/1.4.0+galaxy0
  tool_version: 1.4.0+galaxy0
  tool_shed_repository:
    changeset_revision: 4990e6f1348f
    name: fastp
    owner: iuc
    tool_shed: toolshed.g2.bx.psu.edu
  in:
  - id: filter_options|quality_filtering_options|qualified_quality_phred
    source: Qualified quality score
  - id: single_paired|paired_input
    source: Raw reads
  out:
  - id: report_html
    hide: true
  - id: output_paired_coll
    rename: Trimmed reads
    add_tags:
    - name:Reads
  - id: report_json
    rename: fastp JSON report
  tool_state:
    single_paired:
      single_paired_selector: paired_collection
      __current_case__: 1
      paired_input:
        __class__: ConnectedValue
      merge_reads:
        merge: ''
        __current_case__: 1
    filter_options:
      quality_filtering_options:
        disable_quality_filtering: false
        qualified_quality_phred:
          __class__: ConnectedValue
        unqualified_percent_limit: null
        n_base_limit: null
    output_options:
      report_html: true
      report_json: true
    _elided: remaining fastp tool_state omitted; see IWC source
- tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/0.74+galaxy1
  tool_version: 0.74+galaxy1
  in:
  - id: input_file
    source: fastp/output_paired_coll
  out:
  - id: html_file
    hide: true
  - id: text_file
    hide: true
    rename: FastQC after Ambiguity filtering
  id: FastQC
  label: FastQC
  _note: Adapted from amplicon/amplicon-mgnify/mgnify-amplicon-pipeline-v5-quality-control-paired-end (input source rewired for illustration)
- id: MultiQC
  label: MultiQC
  doc: Aggregation of the quality controls for all samples
  tool_id: toolshed.g2.bx.psu.edu/repos/iuc/multiqc/multiqc/1.35+galaxy5
  tool_version: 1.35+galaxy5
  tool_shed_repository:
    changeset_revision: 94b6bea727ae
    name: multiqc
    owner: iuc
    tool_shed: toolshed.g2.bx.psu.edu
  in:
  - id: results_0|software_cond|input
    source: fastp/report_json
  out:
  - id: stats
    hide: true
  - id: html_report
    rename: MultiQC report
  tool_state:
    comment: ''
    export: false
    flat: false
    image_content_input:
      __class__: RuntimeValue
    png_plots: false
    results:
    - __index__: 0
      software_cond:
        software: fastp
        __current_case__: 8
        input:
          __class__: ConnectedValue
    title: ''

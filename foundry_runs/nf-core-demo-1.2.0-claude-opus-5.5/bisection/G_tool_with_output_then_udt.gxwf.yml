class: GalaxyWorkflow
label: G_tool_with_output_then_udt
inputs:
  d:
    type: data
outputs:
  qc:
    outputSource: fq/text_file
steps:
  fq:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/0.74+galaxy1
    tool_version: 0.74+galaxy1
    in:
      input_file: d
  u:
    run:
      class: GalaxyUserTool
      id: udt_bisect_g
      version: 1.0.0
      name: udt_bisect_b
      container: busybox:1.36
      shell_command: echo hi > out.txt
      inputs: []
      outputs:
      - name: out
        type: data
        format: txt
        from_work_dir: out.txt

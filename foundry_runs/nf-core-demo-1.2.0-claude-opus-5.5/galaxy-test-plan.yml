    description: Samplesheet rows as list:paired_or_unpaired; elements SAMPLE1_PE_sample1, SAMPLE2_PE_sample2, SAMPLE3_SE_sample1, SAMPLE3_SE_sample2
    collection_shape: list:paired_or_unpaired
    datatype: fastqsanger.gz
    fixture:
      storage: remote-url
      location: null
      checksum: null
      provenance: Per-element remote URLs + SHA-1 in test-data-refs.json (resolved_by nextflow-to-test-data)
  - workflow_label: skip_trim
    label_status: resolved
    description: Source default params.skip_trim=false (not overridden by the test profile) -> trimming runs.
    collection_shape: null
    datatype: null
    fixture:
      storage: null
      location: 'false'
      checksum: null
      provenance: nextflow.config default; conf/test.config does not set it

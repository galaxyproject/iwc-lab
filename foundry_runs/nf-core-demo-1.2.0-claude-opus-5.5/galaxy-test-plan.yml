unresolved:
- kind: assertion
  description: nf-core snapshot md5s for *.fastq.gz may be computed by nf-test over decompressed content, and Galaxy seqtk_trimfq output compression is unverified; checksum assertions on trimmed_reads may
    not match even when reads are identical.
  blocking: false
  suggested_resolution: If checksum fails at run time, replace with has_n_lines on decompressed content or compare against downloaded nf-core outputs.
- kind: output-label
  description: Flattened element identifiers (<element>_forward/reverse/unpaired) are assumed from __FLATTEN__ join_identifier "_"; confirm on first run.
  blocking: false
  suggested_resolution: Read identifiers from the planemo run output and adjust element_identifier keys.
omissions:
- target: pipeline_info/nf_core_demo_software_mqc_versions.yml (versions_yml capture)
  reason: No Galaxy workflow output; Galaxy records tool versions per job.
  category: out-of-scope
- target: MultiQC plots and multiqc_data/* other than general stats
  reason: Listed in tests/.nftignore upstream; images and parquet/json vary across runs.
  category: nondeterministic
- target: skip_trim=true branch
  reason: No upstream nf-test exercises it; deferred.
  category: out-of-scope
warnings:
- code: untranslatable-snapshot
  message: multiqc_general_stats.txt / multiqc_fastqc.txt md5s from the snapshot are not portable to the Galaxy MultiQC wrapper (1.35 vs 1.34, different sample identifiers).
  path: tests/default.nf.test.snap

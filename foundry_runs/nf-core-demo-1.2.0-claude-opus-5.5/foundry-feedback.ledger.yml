entries:
  - id: summarize-nextflow-cli-edges-tokenize-multiline-call-args
    raised_by: summarize-nextflow
    observed_in: &obs1
      mold: summarize-nextflow
      path: content/molds/summarize-nextflow/index.md
      revision: 18
      content_hash: fb19fff9162cc36fae916a456cfbbe31a33c4565063a522846c48222d02f7c37
      foundry_head: d1b4cabede5bc91a5ab8603d5c2d589ad7f0d100
    subject:
      kind: cli-command
      label: foundry summarize-nextflow workflow edge extraction
      locator: "package://@galaxy-foundry/gxwf-foundry#summarize-nextflow"
    kind: defect
    severity: major
    what: "The deterministic edge extractor split MULTIQC's multi-line call argument (a .map closure building a tuple) into ~12 spurious edges whose 'from' values are Groovy fragments ('[', ']', '}', '[]', ternary halves), and emitted no edge or call record for the zero-argument process call COWPY()."
    expected: "Parse a process call's argument list as one balanced expression and emit one edge per referenced channel (FASTQC.out.zip, ch_collated_versions, ...); record zero-argument process invocations so source processes are not lost from the DAG."
    evidence: "nf-core/demo 1.2.0 workflows/demo.nf: edges before reconciliation had from='[' / '}' / ': file(...)' targeting MULTIQC and nothing for COWPY. Reconciled by hand in the LLM pass."
    status: open
    issue: null
  - id: summarize-nextflow-cli-utility-subworkflows-classified-pipeline
    raised_by: summarize-nextflow
    observed_in: *obs1
    subject:
      kind: cli-command
      label: foundry summarize-nextflow subworkflow kind classifier
      locator: "package://@galaxy-foundry/gxwf-foundry#summarize-nextflow"
    kind: defect
    severity: minor
    what: "PIPELINE_INITIALISATION, PIPELINE_COMPLETION and UTILS_NFSCHEMA_PLUGIN were emitted kind: pipeline although they invoke no pipeline processes; free functions (samplesheetToList, paramsHelp, completionEmail) were listed in calls[]."
    expected: "Classify a subworkflow as pipeline only when its transitive calls reach a process; keep free-function names out of calls[] (the Mold and schema both cite PIPELINE_INITIALISATION as the canonical utility example)."
    evidence: "nf-core/demo 1.2.0 summary; corrected to utility in the LLM pass."
    status: open
    issue: null
  - id: summarize-nextflow-cli-silent-test-profile-default
    raised_by: summarize-nextflow
    observed_in: *obs1
    subject:
      kind: cli-command
      label: foundry summarize-nextflow --profile default
      locator: "package://@galaxy-foundry/gxwf-foundry#summarize-nextflow"
    kind: friction
    severity: minor
    what: "The CLI help says '--profile <name> (default: test)' while the Mold says the profile override is optional and 'When omitted, there is no silent profile default'."
    expected: "Drop the CLI default (omitted --profile means no override) or have the Mold document the CLI default explicitly."
    evidence: "foundry summarize-nextflow --help output during this run."
    status: open
    issue: null
  - id: summarize-nextflow-misses-getgenomeattribute-in-main-nf
    raised_by: nextflow-summary-to-galaxy-reference-data
    observed_in:
      mold: nextflow-summary-to-galaxy-reference-data
      path: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
      revision: 5
      content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
      foundry_head: e2c26d735ea338046c61917fcf7627a7f1dc462e
    subject:
      kind: cli-command
      label: foundry summarize-nextflow params source_kind detection
      locator: "package://@galaxy-foundry/gxwf-foundry#summarize-nextflow"
    kind: defect
    severity: minor
    what: "main.nf assigns params.fasta = getGenomeAttribute('fasta') (the nf-core template idiom), but the summary records fasta.source_kind: nextflow_schema with null source_expression; the key-expanded-bundle signal this Mold reads first is absent."
    expected: "Scan main.nf top-level params assignments (as the summarize-nextflow Mold itself describes) in addition to conf/igenomes.config, and set source_kind getGenomeAttribute with the verbatim source_expression."
    evidence: "nf-core/demo 1.2.0 main.nf line 29 vs summary params[fasta]."
    status: open
    issue: null
  - id: reference-classification-no-unconsumed-template-asset-case
    raised_by: nextflow-summary-to-galaxy-reference-data
    observed_in:
      mold: nextflow-summary-to-galaxy-reference-data
      path: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
      revision: 5
      content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
      foundry_head: e2c26d735ea338046c61917fcf7627a7f1dc462e
    subject:
      kind: research
      label: nextflow-reference-data-classification
      locator: content/research/nextflow-reference-data-classification/index.md
      content_hash: 2b33f3bddb635c9d700e506784b4bf16f8c387369bc66194a15cb75be9ad8a1f
    kind: gap
    severity: minor
    what: "The 'None' classification is detected by 'no path-shaped reference asset and no getGenomeAttribute call', but nf-core template pipelines (nf-core/demo) declare fasta/genome and call getGenomeAttribute while no process consumes them. The note gives no rule for a declared-but-unconsumed asset, so I had to decide by hand that used_by: [] means None/drop."
    expected: "Add an explicit rule: a reference_assets[] entry with empty used_by and no rebuild is template scaffolding → classify None and record a dropped ledger entry citing the empty used_by."
    evidence: "nf-core/demo 1.2.0: reference_assets[fasta].used_by == [], reference_rebuilds == []."
    status: open
    issue: null
  - id: summary-omits-samplesheet-channel-construction-in-utility-subworkflow
    raised_by: nextflow-summary-to-galaxy-interface
    observed_in: &obs3
      mold: nextflow-summary-to-galaxy-interface
      path: content/molds/nextflow-summary-to-galaxy-interface/index.md
      revision: 6
      content_hash: 43966773391578490688098c9333f6eb2eaa94574755f5b6554e7f9b72a605c0
      foundry_head: e2c26d735ea338046c61917fcf7627a7f1dc462e
    subject:
      kind: schema
      label: summary-nextflow channel construction coverage
      locator: "package://@galaxy-foundry/summarize-nextflow#summaryNextflowSchema"
      content_hash: 839e11b1892af74df3158377027e7d340a67dafdb9b5965d79e9715a1a109d54
    kind: gap
    severity: major
    what: "ch_samplesheet, the only data input channel, is built in PIPELINE_INITIALISATION (samplesheetToList -> map single_end -> groupTuple -> validate -> flatten), but workflow.channels[] only covers the primary workflow DEMO, so the summary has no channel with from_param: input and loses the groupTuple multi-run merge. The params-to-inputs translation order (index channels by from_param) cannot find the input's materialization; I had to read the source tree."
    expected: "Record channels emitted by utility subworkflows that feed the primary workflow's take: (at least the samplesheet one) with construct samplesheetToList, from_param input, and the literal operator chain, or add a sample_sheets[].materialization field carrying the post-parse chain."
    evidence: "nf-core/demo 1.2.0 subworkflows/local/utils_nfcore_demo_pipeline/main.nf lines 109-125; summary workflow.channels[] has no from_param=input entry."
    status: open
    issue: null
  - id: params-to-inputs-no-rule-for-duplicate-sample-rows
    raised_by: nextflow-summary-to-galaxy-interface
    observed_in: *obs3
    subject:
      kind: research
      label: nextflow-params-to-galaxy-inputs
      locator: content/research/nextflow-params-to-galaxy-inputs/index.md
      content_hash: b65bf1a16cb986bc04ff7926e6ca0eea9ce35980aa4d4c47d8a102a28ffae085
    kind: gap
    severity: minor
    what: "The sample-sheet table covers optional second mates and record shapes but says nothing about the common nf-core idiom of several rows sharing one sample id (multi-run / multi-lane merged by groupTuple). Galaxy identifiers must be unique, so I had to choose between per-row elements, list:list (sample -> runs), or a pre-merge step without guidance."
    expected: "Add a row: duplicate sample ids merged by groupTuple -> either nested list:list / list:list:paired keyed by sample, or per-row elements with a recorded dropped grouping when all consumers are per-file; state the default."
    evidence: "nf-core/demo test samplesheet lists SAMPLE3_SE twice; PIPELINE_INITIALISATION groupTuple()s them."
    status: open
    issue: null
  - id: identifier-uniqueness-rule-only-in-data-flow-mold
    raised_by: nextflow-summary-to-galaxy-data-flow
    observed_in:
      mold: nextflow-summary-to-galaxy-data-flow
      path: content/molds/nextflow-summary-to-galaxy-data-flow/index.md
      revision: 8
      content_hash: f71cc2b4ceb115d7d93c3dd2e622cbfafb8b9f338f1dd450ee5773f3c0a0e247
      foundry_head: ae8beb6df85b09a61706d0f6990e99bccd718394
    subject:
      kind: mold
      label: nextflow-summary-to-galaxy-interface
      locator: content/molds/nextflow-summary-to-galaxy-interface/index.md
      content_hash: 43966773391578490688098c9333f6eb2eaa94574755f5b6554e7f9b72a605c0
    kind: gap
    severity: minor
    what: "The rule 'key each element on something unique per dataset; a positional _1/_2 suffix is a mate only when every row is paired' lives only in the data-flow Mold, but the interface Mold is where element identifiers are first chosen. In this run the interface brief proposed SAMPLE3_SE_1/_2 for repeated single-end rows, which the data-flow step then had to override."
    expected: "Move or duplicate the identifier-uniqueness rule into nextflow-summary-to-galaxy-interface (or its testability note) so the interface brief picks unique, non-positional identifiers first."
    evidence: "nf-core/demo run: interface brief text 'e.g. SAMPLE3_SE_1, SAMPLE3_SE_2' vs data-flow decision element-identifiers-sample-plus-run."
    status: open
    issue: null

    what: "The schema requires 'one ref per workflow input' and a resolved ref must carry a fixture location or elements, but the workflow's boolean skip_trim and optional string multiqc_title have no data fixture. Their test values come from the nf-test params_delta/defaults (skip_trim false, title unset), and there is no valid way to record them, so they were left out of test-data-refs.json."

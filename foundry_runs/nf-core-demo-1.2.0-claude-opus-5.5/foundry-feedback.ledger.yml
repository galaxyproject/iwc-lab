    kind: gap
    severity: major
    what: "The note says nothing about compressed outputs. nf-test snapshot md5s for *.fastq.gz (here 6 trimmed-read files) may be computed over decompressed content, while a Galaxy tests-format checksum covers dataset bytes, and the Galaxy wrapper may not gzip at all. I translated them as low-confidence checksum assertions without knowing whether they can ever match."
    expected: "State how nf-test computes md5 for .gz paths and give the matching Galaxy translation (e.g. decompress: true with has_n_lines/has_line, or checksum only when compression is byte-identical)."
    evidence: "tests/default.nf.test.snap md5 for SAMPLE1_PE_sample1_R1.fastq.gz equals SAMPLE3_SE_sample1_R1.fastq.gz (same reads), consistent with content hashing; no guidance in the bundle."

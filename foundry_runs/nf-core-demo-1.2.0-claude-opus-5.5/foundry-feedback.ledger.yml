      content_hash: 84abb427cbcbae5616ae22e4a7fa803f14350605c246638575b3a32c5ad9c6fb
    kind: gap
    severity: minor
    what: "The Mold assumes one nearest exemplar supplies the idiom. Here the domain-nearest workflow (short-read-qc-trimming, fastp-based) lacked the key idiom (FastQC text_file -> MultiQC software=fastqc), which only a Low-confidence cross-domain workflow (mgnify amplicon QC) carried. Nothing says whether a secondary exemplar's step may be spliced into iwc-exemplar.gxwf.yml, so I did it by hand with an in-file provenance note."
    expected: "Allow (and specify the shape for) secondary idiom excerpts: per-step provenance comments or a separate keyed section in iwc-exemplar.gxwf.yml, labelled with the source workflow id and confidence."
    evidence: "nf-core/demo run; IWC @ 9f111cb."
    status: open
    issue: null

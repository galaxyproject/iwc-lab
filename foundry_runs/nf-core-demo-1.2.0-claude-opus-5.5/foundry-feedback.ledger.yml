  - id: collection-patterns-no-paired-or-unpaired-to-reduction-recipe
    raised_by: nextflow-summary-to-galaxy-template
    observed_in:
      mold: nextflow-summary-to-galaxy-template
      path: content/molds/nextflow-summary-to-galaxy-template/index.md
      revision: 10
      content_hash: 77f885d640900cca7dac4a3bbb33308d4d8065e871c919c672487db61caf93ab
      foundry_head: ae8beb6df85b09a61706d0f6990e99bccd718394
    subject:
      kind: pattern
      label: galaxy-collection-patterns
      locator: content/patterns/galaxy-collection-patterns.md
      content_hash: 2dbb4b7520ba30d3e9fdf68e6133fb35c597e7e8482478b4dee2abe9f415d6ef
    kind: gap
    severity: major
    what: "The interface/channel-shape notes route mixed single/paired nf-core samplesheets to list:paired_or_unpaired, but no pattern covers the next step: per-file tools map fine, yet the bundled semantics say list:paired_or_unpaired is rejected on a multi-data input, so the common FastQC -> MultiQC reduction breaks. I inferred a __FLATTEN__-first recipe from the semantics YAML alone, with no corpus example of __FLATTEN__ over paired_or_unpaired."
    expected: "Add a pattern (or a section of collection-flatten-after-fanout) for list:paired_or_unpaired -> flat list before a multiple=true reduction, stating the identifier suffixes __FLATTEN__ produces for forward/reverse/unpaired; cross-link from nextflow-to-galaxy-channel-shape-mapping's mixed-reads row."
    evidence: "galaxy-collection-semantics.yml: 'rejects list:paired_or_unpaired input on multi-data input'; IWC @ 9f111cb has 0 workflows using paired_or_unpaired."
    status: open
    issue: null

    kind: friction
    severity: minor
    what: "gxwf convert --to format2 --compact (1.15.x) still emits 'fields: null', 'column_definitions: null' on every input, per-step uuid, and full tool_state; the Mold calls the artifact a 'cleaned' view but the bundle has no cleaning step, so trimming was hand-done."
    expected: "Either a --clean/--minimal flag that drops null keys, uuids and default tool_state, or Mold guidance on what to strip."
    evidence: "Converted short-read-quality-control-and-trimming.ga: 183 lines with null fields and uuids."

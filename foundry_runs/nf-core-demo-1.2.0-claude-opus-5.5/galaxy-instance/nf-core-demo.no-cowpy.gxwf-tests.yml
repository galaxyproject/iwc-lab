- doc: 'nf-core/demo -profile test: 2 paired-end + 2 single-end viralrecon amplicon FASTQ runs through FastQC, seqtk trimming, cowpy and MultiQC. Translated from nf-core/demo tests/default.nf.test (-profile
    test).'
  job:
    reads:
      class: Collection
      collection_type: list:paired_or_unpaired
      elements:
      - class: Collection
        collection_type: paired_or_unpaired
        identifier: SAMPLE1_PE_sample1
        elements:
        - identifier: forward
          class: File
          location: https://raw.githubusercontent.com/nf-core/test-datasets/viralrecon/illumina/amplicon/sample1_R1.fastq.gz
          filetype: fastqsanger.gz
          hashes:
          - hash_function: SHA-1
            hash_value: eaf6537837437b69412285bf1a2a542f571e9336
        - identifier: reverse
          class: File
          location: https://raw.githubusercontent.com/nf-core/test-datasets/viralrecon/illumina/amplicon/sample1_R2.fastq.gz
          filetype: fastqsanger.gz
          hashes:
          - hash_function: SHA-1
            hash_value: cbb92e7ed652d5b4008c588b318a6a12a3f0bfd5
      - class: Collection
        collection_type: paired_or_unpaired
        identifier: SAMPLE2_PE_sample2
        elements:
        - identifier: forward
          class: File
          location: https://raw.githubusercontent.com/nf-core/test-datasets/viralrecon/illumina/amplicon/sample2_R1.fastq.gz
          filetype: fastqsanger.gz
          hashes:
          - hash_function: SHA-1
            hash_value: 7b090121cfa3caa51d9051d01e5f8e7bd2babb5d
        - identifier: reverse
          class: File
          location: https://raw.githubusercontent.com/nf-core/test-datasets/viralrecon/illumina/amplicon/sample2_R2.fastq.gz
          filetype: fastqsanger.gz
          hashes:
          - hash_function: SHA-1
            hash_value: 56e48ae352b0dcbe2297fd8831ba506c19435cdc
      - class: Collection
        collection_type: paired_or_unpaired
        identifier: SAMPLE3_SE_sample1
        elements:
        - identifier: unpaired
          class: File
          location: https://raw.githubusercontent.com/nf-core/test-datasets/viralrecon/illumina/amplicon/sample1_R1.fastq.gz
          filetype: fastqsanger.gz
          hashes:
          - hash_function: SHA-1
            hash_value: eaf6537837437b69412285bf1a2a542f571e9336
      - class: Collection
        collection_type: paired_or_unpaired
        identifier: SAMPLE3_SE_sample2
        elements:
        - identifier: unpaired
          class: File
          location: https://raw.githubusercontent.com/nf-core/test-datasets/viralrecon/illumina/amplicon/sample2_R1.fastq.gz
          filetype: fastqsanger.gz
          hashes:
          - hash_function: SHA-1
            hash_value: 7b090121cfa3caa51d9051d01e5f8e7bd2babb5d
    skip_trim: false
  outputs:
    trimmed_reads:
      class: Collection
      collection_type: list
      element_count: 6
      element_tests:
        SAMPLE1_PE_sample1_forward:
          file: test-data/expected/trimmed_sample1_R1.fastq.gz
          decompress: true
          compare: diff
        SAMPLE1_PE_sample1_reverse:
          file: test-data/expected/trimmed_sample1_R2.fastq.gz
          decompress: true
          compare: diff
        SAMPLE2_PE_sample2_forward:
          file: test-data/expected/trimmed_sample2_R1.fastq.gz
          decompress: true
          compare: diff
        SAMPLE2_PE_sample2_reverse:
          file: test-data/expected/trimmed_sample2_R2.fastq.gz
          decompress: true
          compare: diff
        SAMPLE3_SE_sample1_unpaired:
          file: test-data/expected/trimmed_sample1_R1.fastq.gz
          decompress: true
          compare: diff
        SAMPLE3_SE_sample2_unpaired:
          file: test-data/expected/trimmed_sample2_R1.fastq.gz
          decompress: true
          compare: diff
    fastqc_html:
      class: Collection
      collection_type: list
      element_count: 6
      element_tests:
        SAMPLE1_PE_sample1_forward:
          asserts:
          - that: has_text
            text: FastQC
    fastqc_raw:
      class: Collection
      collection_type: list
      element_count: 6
      element_tests:
        SAMPLE3_SE_sample1_unpaired:
          asserts:
          - that: has_text
            text: Total Sequences
    multiqc_report:
      asserts:
      - that: has_text
        text: FastQC
    multiqc_stats:
      asserts:
      - that: has_text
        text: SAMPLE1_PE_sample1

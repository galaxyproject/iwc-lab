unresolved:
- kind: assertion
  description: No upstream expected values exist; thresholds (has_size, >=1 peak) are design guesses until a first run measures the outputs.
  blocking: false
  suggested_resolution: after the first green run, tighten with fixture-derived values (peak counts, matrix rows)
omissions:
- target: fastqc_raw_html
  reason: HTML FastQC reports; existence covered by MultiQC
  category: weak-output
- target: trimming_reports
  reason: text logs; covered by MultiQC cutadapt section
  category: weak-output
- target: test_controls and test_full profiles
  reason: control pairing not carried; full test is reference-scale (hg19)
  category: out-of-scope
warnings:
- code: no-upstream-expected-outputs
  message: nf-core/atacseq 2.1.2 has no nf-test suite or snapshot; the test profile only checks that the pipeline completes, so no assertion carries test-evidence.
  path: test_cases[0]
- code: computed-scalar-input
  message: macs_gsize is not declared by the source test (nf-core computes it with khmer); value 11622260 was computed from the fixture genome.
  path: test_cases[0].job_inputs[macs_gsize]

plan_version: '1'
source:
  kind: nextflow
  name: nf-core/atacseq
  derived_from: test-evidence
  notes: Translated from profile:test (conf/test.config; no nf-test suite in 2.1.2, so the profile is the only test evidence). test_controls (eligible, control branch not carried) and test_full (reference-scale,
    deferred) are not translated. The source test asserts nothing beyond a successful run, so every assertion below is intent.
workflow:
  title: ATAC-seq library-level peaks and consensus (nf-core/atacseq 2.1.2 core spine)
  label_source: draft
  notes: Labels read from galaxy-workflow.gxwf.yml.
test_cases:
- id: atacseq_profile_test_core_spine
  doc: 'Yeast osmotic-stress ATAC test set: 4 PE + 4 SE runs -> 3 PE + 3 SE libraries through QC, BWA, merge/dedup/filter, bigWig, MACS2 broad peaks, FRiP, HOMER, consensus, featureCounts, DESeq2 QC, MultiQC.'
  derived_from: intent
  provenance: 'profile:test (nextflow.config -> conf/test.config: input samplesheet/v2.0/samplesheet_test.csv, fasta reference/genome.fa, gtf reference/genes.gtf, mito_name MT, read_length 50)'
  job_inputs:
  - workflow_label: reads
    label_status: resolved
    description: 8 runs from samplesheet_test.csv (4 PE, 4 SE); elements and per-file SHA-1 in test-data-refs.json
    collection_shape: list:paired_or_unpaired
    datatype: fastqsanger.gz
    fixture:
      storage: remote-url
      location: null
      checksum: null
      provenance: test-data-refs.json reads elements (remote-url + SHA-1 per FASTQ)
  - workflow_label: genome_fasta
    label_status: resolved
    description: S. cerevisiae test genome (17 contigs incl. MT)
    collection_shape: null
    datatype: fasta
    fixture:
      storage: remote-url
      location: https://raw.githubusercontent.com/nf-core/test-datasets/atacseq/reference/genome.fa
      checksum: SHA-1:45824b2faa6e96edfb1d7cd0c1428896de47bde6
      provenance: conf/test.config params.fasta (S. cerevisiae, 17 contigs incl. MT, 12,157,105 bp); local copy test-data/genome.fa
  - workflow_label: genome_gtf
    label_status: resolved
    description: S. cerevisiae test GTF
    collection_shape: null
    datatype: gtf
    fixture:
      storage: remote-url
      location: https://raw.githubusercontent.com/nf-core/test-datasets/atacseq/reference/genes.gtf
      checksum: SHA-1:258654d38c9c17ec21b2ce2d8585cddecfd0d12e
      provenance: conf/test.config params.gtf; local copy test-data/genes.gtf
  - workflow_label: macs_gsize
    label_status: resolved
    description: 'MACS2 effective genome size: exact distinct canonical 50-mers of the test genome (read_length 50), standing in for nf-core KHMER_UNIQUEKMERS which the test profile relies on'

discoveries:
- id: summary-lacks-reference-assets
  raised_by: nextflow-summary-to-galaxy-reference-data
  evidence: 'summary-nextflow.json has reference_assets: [] and reference_rebuilds: []; rebuild branches read from subworkflows/local/prepare_genome.nf'
  impact: derived reference steps (chrom sizes, autosomes, include-regions BED, gene/TSS BED) must be designed by data-flow from this brief rather than from summary fields
- id: test-genome-small
  raised_by: nextflow-summary-to-galaxy-reference-data
  evidence: 'test profile: fasta = nf-core/test-datasets atacseq reference/genome.fa, gtf = reference/genes.gtf, mito_name MT'
  impact: in-tool index rebuild per job is affordable for the test
- id: reference-derivatives-mostly-unneeded
  raised_by: nextflow-summary-to-galaxy-data-flow
  evidence: gene BED, TSS BED and autosomes feed only deepTools/ataqv (dropped)
  impact: reference prep reduces to fai/chrom sizes and include-regions BED
- id: featurecounts-always-paired-flag
  raised_by: nextflow-summary-to-galaxy-data-flow
  evidence: 'SUBREAD_FEATURECOUNTS meta is [id: consensus_peaks] (no single_end) so module adds -p for all BAMs'
  impact: Galaxy featureCounts should mirror -p behaviour or note the deviation
- id: iwc-atacseq-uses-data-table-index
  raised_by: compare-against-iwc-exemplar
  evidence: IWC atacseq Bowtie2 reference_genome|index from text parameter "Reference Genome" (cached index)
  impact: do not copy; reference posture keeps history FASTA
- id: test-macs-gsize-11622260
  raised_by: nextflow-to-test-data
  evidence: distinct canonical 50-mers of nf-core test-datasets atacseq reference/genome.fa (12,157,105 bp) computed locally 2026-11-12
  impact: 'use macs_gsize: 11622260 in the Galaxy test job'
- id: attempt-2-observed-values
  raised_by: debug-galaxy-workflow-output
  evidence: peaks 634-1483/library, FRiP 0.32-0.43, consensus 1874 intervals, PE properly paired 99.8%
  impact: basis for tightening assertions
decisions:
- id: reference-inputs-fasta-gtf-blacklist
  decided_by: nextflow-summary-to-galaxy-reference-data
  decision: 'Workflow reference inputs: genome_fasta (fasta, required), genome_gtf (gtf, required), blacklist_bed (bed, optional), macs_gsize (integer, required), mito_name (text, optional), keep_mito (boolean).
    All other reference assets derived inside the workflow.'
  rationale: 'v1 posture: explicit inputs, no data tables, in-tool or workflow-tier rebuild'
- id: scope-core-library-spine
  decided_by: nextflow-summary-to-galaxy-interface
  decision: Carry QC+trim, BWA, library merge/dedup/filter, bigWig, MACS2+FRiP+HOMER, consensus+featureCounts+DESeq2, MultiQC.
  rationale: user choice 2026-11-12 (AskUserQuestion)
- id: reads-list-paired-or-unpaired-run-identifiers
  decided_by: nextflow-summary-to-galaxy-interface
  decision: reads input is list:paired_or_unpaired keyed <sample>_REP<r>_T<n>; workflow regroups into libraries by stripping _T<n>.
  rationale: mirrors check_samplesheet.py ids and NF groupTuple; avoids sample_sheet metadata loss through map-over
- id: skip-flags-fixed-on
  decided_by: nextflow-summary-to-galaxy-interface
  decision: All skip_* flags for carried stages fixed to run; not exposed.
  rationale: 'no step-level when: in v1; test profile runs them all'
- id: pe-se-lanes
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: Split reads into PE and SE lanes at input; one lane subworkflow instantiated twice; merge per-library collections before consensus.
  rationale: source branches on meta.single_end in TRIMGALORE, BAMTOOLS_FILTER args+config, BAM_REMOVE_ORPHANS, BEDTOOLS_GENOMECOV (-pc/-fs), MACS2_CALLPEAK (BAMPE/BAM); flag is lost once reads become BAMs
- id: per-element-scale-factor-idiom
  decided_by: compare-against-iwc-exemplar
  decision: Where a tool needs a per-element numeric argument (bigWig scale = 1e6/mapped reads), use samtools view -c / flagstat -> column_maker -> param_value_from_file -> connected tool parameter.
  rationale: IWC epigenetics/atacseq/atacseq steps "number of reads" -> "compute 1/million reads" -> "Convert 1/million reads to parameter" -> bigwigAverage scaleFactors
- id: bamtools-filter-conditions-from-json
  decided_by: compare-against-iwc-exemplar
  decision: Encode assets/bamtools_filter_{pe,se}.json rules as devteam/bamtools_filter conditions; keep samtools view for flags and -L include regions.
  rationale: IWC atacseq uses bamFilter conditions[].filters[] with mapQuality/isProperPair/reference
- id: flat-twin-lanes-not-subworkflow
  decided_by: nextflow-summary-to-galaxy-template
  decision: PE and SE lanes emitted as flat pe_*/se_* step twins, not one subworkflow used twice.
  rationale: 'a run: subworkflow repeated inline would be implemented twice anyway; flat twins let phase 7 resolve each distinct tool once and copy to its twin'
- id: frip-via-count-concat-awk
  decided_by: nextflow-summary-to-galaxy-template
  decision: FRiP = frip_count -> cat1 with synced flagstat -> awk ratio.
  rationale: IWC atacseq reads-in-peaks idiom; per-element pairing kept by filtering flagstats to peak-bearing identifiers
- id: tool-version-pins-from-target
  decided_by: advance-galaxy-draft-step

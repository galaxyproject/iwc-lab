  missing: no khmer unique-kmers wrapper confirmed on test.galaxyproject.org; v1 exposes macs_gsize as a required integer parameter, and the test profile sets no value
  resolved_by: null
  supersedes: null
  note: 'test-data phase must supply a value for the yeast test genome (e.g. computed unique 50-mers) or the workflow must add a compute step | still open after phase 7: macs_gsize stays a required int
    input | test value supplied by nextflow-to-test-data: 11622260 = exact distinct canonical 50-mers in test genome.fa (read_length 50), stand-in for khmer unique-kmers; workflow still has no compute step
    | surrendered at run end (2026-11-12): carried into the final artifacts as a labelled gap/deviation'

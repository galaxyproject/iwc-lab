class: GalaxyWorkflow
label: ATAC-seq library-level peaks and consensus (nf-core/atacseq 2.1.2 core spine)
doc: "Galaxy translation of nf-core/atacseq 2.1.2, core library spine: FastQC + Trim Galore -> BWA-MEM -> merge runs per library -> Picard MarkDuplicates -> samtools/bamtools filtering -> CPM bigWig -> MACS2 broad peaks + FRiP + HOMER annotation -> consensus peaks + featureCounts + DESeq2 QC -> MultiQC. Single-end and paired-end runs travel in separate lanes (pe_*/se_*) because the source changes behaviour on meta.single_end; lanes merge before consensus. Not carried: other aligners, merged-replicate level, ataqv, IGV, deepTools, Picard metrics, Preseq, control pairing (see open-requirements ledger)."
license: MIT
creator:
  - class: Organization
    name: nf-core
    url: https://github.com/nf-core/atacseq
inputs:
  reads:
    type: collection
    collection_type: list:paired_or_unpaired
    format:
      - fastqsanger.gz
      - fastqsanger
    optional: false
    doc: One element per sequencing run, paired or single-end. Element identifier <sample>_REP<replicate>_T<run> (nf-core check_samplesheet.py convention); runs sharing <sample>_REP<replicate> are merged into one library. A library must not mix single- and paired-end runs.
  genome_fasta:
    type: data
    format: fasta
    optional: false
    doc: Reference genome FASTA (gz accepted). BWA index is built from it.
  genome_gtf:
    type: data
    format: gtf
    optional: false
    doc: Gene annotation GTF, used by HOMER annotatePeaks.
  blacklist_bed:
    type: data
    format: bed
    optional: true
    doc: Optional blacklist regions BED; excluded from the include-regions BED used to filter alignments.
  macs_gsize:
    type: int
    optional: false
    doc: MACS2 effective genome size (-g). nf-core computes it with khmer unique-kmers from the FASTA and read length when not supplied.
  mito_name:
    type: string
    optional: true
    doc: Mitochondrial contig name (e.g. MT, chrM); reads on it are removed unless keep_mito.
  keep_mito:
    type: boolean
    optional: false
    default: false
    doc: Keep mitochondrial reads.
  broad_cutoff:
    type: float
    optional: false
    default: 0.1
    doc: MACS2 --broad-cutoff.
  min_reps_consensus:
    type: int
    optional: false
    default: 1
    doc: Minimum number of libraries a consensus interval must be called in.
  fragment_size:
    type: int
    optional: false
    default: 200
    doc: Fragment length used to extend single-end reads for coverage (bedtools genomecov -fs).
  deseq2_vst:
    type: boolean
    optional: false
    default: true
    doc: Use VST (true) instead of rlog in DESeq2 QC.
outputs:
  multiqc_report:
    outputSource: multiqc/html_report
  fastqc_raw_html:
    outputSource: merge_fastqc_raw/output
  trimming_reports:
    outputSource: merge_trimming_reports/output
  library_bam:
    outputSource: merge_library_bam/output
  markduplicates_metrics:
    outputSource: merge_markdup_metrics/output
  library_flagstat:
    outputSource: merge_library_flagstat/output
  library_bigwig:
    outputSource: merge_bigwig/output
  library_peaks:
    outputSource: merge_peaks/output
  library_frip:
    outputSource: merge_frip/output
  library_peaks_annotated:
    outputSource: merge_peaks_annotated/output
  consensus_peaks_bed:
    outputSource: consensus_bed/outfile
  consensus_peaks_annotated:
    outputSource: homer_annotate_consensus/output
  consensus_counts:
    outputSource: counts_matrix/tabular_output
  deseq2_qc_plots:
    outputSource: deseq2_qc/pdf
steps:
  ref_faidx:
    label: ref_faidx
    doc: Chromosome lengths from the reference FASTA (header trimmed to first word, as BAM @SQ names).
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fasta_compute_length/fasta_compute_length/1.0.4
    tool_version: 1.0.4
    state:
      ref:
        ref_source: history
        keep_first: 0
        keep_first_word: true
    in:
      ref|input: genome_fasta
    out:
      - id: output
  chrom_sizes:
    label: chrom_sizes
    doc: Chromosome sizes (fai columns 1-2).
    tool_id: Cut1
    tool_version: 1.0.2
    state:
      columnList: c1,c2
      delimiter: T
    in:
      input: ref_faidx/output
    out:
      - id: out_file1
  include_regions_bed:
    label: include_regions_bed
    doc: "Genome regions to keep: complement of the (sorted) blacklist against the chromosome sizes, minus the mitochondrial contig unless keep_mito."
    run:
      class: GalaxyUserTool
      id: atacseq_include_regions_bed
      version: 2.30.0
      name: Genome include-regions BED
      description: Complement of a blacklist against chromosome sizes, minus the mitochondrial contig (nf-core/atacseq GENOME_BLACKLIST_REGIONS)
      license: MIT
      container: quay.io/biocontainers/bedtools:2.30.0--hc088bd4_0
      requirements: []
      inputs:
        - name: sizes
          type: data
          format:
            - tabular
          label: Chromosome sizes (name, length)
        - name: blacklist
          type: data
          format:
            - bed
          optional: true
          label: Blacklist regions (optional)
        - name: mito_name
          type: text
          optional: true
          label: Mitochondrial contig name
        - name: keep_mito
          type: boolean
          value: false
          label: Keep mitochondrial contig
      shell_command: |
        SIZES='$(inputs.sizes.path)'
        BL='$(inputs.blacklist ? inputs.blacklist.path : "")'
        MITO='$(inputs.mito_name ? inputs.mito_name : "")'
        KEEP='$(inputs.keep_mito)'
        if [ -n "$BL" ]; then
          sortBed -i "$BL" -g "$SIZES" | complementBed -i stdin -g "$SIZES" > regions.bed
        else
          awk -v OFS='\t' '{print $1, 0, $2}' "$SIZES" > regions.bed
        fi
        if [ -n "$MITO" ] && [ "$KEEP" != "true" ]; then
          awk -v m="$MITO" '$1 != m' regions.bed > include_regions.bed
        else
          cp regions.bed include_regions.bed
        fi
      outputs:
        - name: bed
          type: data
          format: bed
          from_work_dir: include_regions.bed
          label: Include regions BED
      help:
        format: markdown
        content: |
          Port of nf-core/atacseq `GENOME_BLACKLIST_REGIONS`: `sortBed -i blacklist -g sizes | complementBed -i stdin -g sizes`,
          or the whole genome from the sizes file when no blacklist is given; then drops the `mito_name` contig unless
          `keep_mito`. nf-core matches the mito name as a regex (`$1 !~ /MT/`); this port matches it exactly.
    in:
      sizes: chrom_sizes/out_file1
      blacklist: blacklist_bed
      mito_name: mito_name
      keep_mito: keep_mito
    out:
      - id: bed
  split_pe_se:
    label: split_pe_se
    doc: Split runs into paired-end and single-end sub-collections.
    tool_id: __SPLIT_PAIRED_AND_UNPAIRED__
    tool_version: 1.0.0
    state: {}
    in:
      input: reads
    out:
      - id: output_paired
      - id: output_unpaired
  pe_fastqc_raw:
    label: pe_fastqc_raw
    doc: FastQC on raw reads.
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/0.74+galaxy1
    tool_version: 0.74+galaxy1
    state:
      nogroup: false
      min_length: null
      kmers: 7
    in:
      input_file: split_pe_se/output_paired
    out:
      - id: html_file
      - id: text_file
  pe_trim_galore:
    label: pe_trim_galore
    doc: Adapter trimming with Trim Galore, FastQC on trimmed reads.
    tool_id: toolshed.g2.bx.psu.edu/repos/bgruening/trim_galore/trim_galore/0.6.10+galaxy1
    tool_version: 0.6.10+galaxy1
    state:
      singlePaired:
        sPaired: paired_collection
        trimming:
          trimming_select: ""
        three_prime_clip_R1: null
        three_prime_clip_R2: null
      params:
        settingsType: custom
        quality: 20
        stringency: 1
        error_rate: 0.1
        min_length: 20
        clip_R1: null
        clip_R2: null
        report: true
        retain_unpaired:
          retain_unpaired_select: no_output
      rrbs:
        settingsType: default
      trimming:
        settingsType: default
    in:
      singlePaired|input_mate_pairs: split_pe_se/output_paired
    out:
      - id: trimmed_reads_paired_collection
      - id: report_file
  pe_bwa_mem:
    label: pe_bwa_mem
    doc: Align runs with BWA-MEM against an index built from genome_fasta.
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/bwa/bwa_mem/0.7.19+galaxy2
    tool_version: 0.7.19+galaxy2
    state:
      reference_source:
        reference_source_selector: history
        index_a: auto
      fastq_input:
        fastq_input_selector: paired_collection
        iset_stats: null
      rg:
        rg_selector: set_id_auto
      analysis_type:
        analysis_type_selector: full
        algorithmic_options:
          algorithmic_options_selector: do_not_set
        scoring_options:
          scoring_options_selector: do_not_set
        io_options:
          io_options_selector: set
          five: false
          q: false
          T: 30
          h: 5
          a: false
          C: false
          V: false
          "Y": false
          M: true
      output_sort: coordinate
    in:
      reference_source|ref_file: genome_fasta
      fastq_input|fastq_input1: pe_trim_galore/trimmed_reads_paired_collection
    out:
      - id: bam_output
  pe_drop_secondary:
    label: pe_drop_secondary
    doc: Remove secondary alignments (-F 0x0100), BAM output.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    tool_version: 1.22+galaxy2
    state:
      mode:
        outtype: selected_reads
        filter_config:
          cond_region:
            select_region: "no"
          cond_rg:
            select_rg: "no"
          cond_expr:
            select_expr: "no"
          quality: null
          library: null
          cigarcons: null
          inclusive_filter: null
          exclusive_filter:
            - "256"
          exclusive_filter_all: null
          tag: null
        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            factor: 1
            seed: null
        output_options:
          reads_report_type: retained
          complementary_output: false
          adv_output:
            readtags: []
            collapsecigar: false
          output_format:
            oformat: bam
      addref_cond:
        addref_select: "no"
    in:
      input: pe_bwa_mem/bam_output
    out:
      - id: outputsam
        change_datatype: bam
  pe_group_runs:
    label: pe_group_runs
    doc: "Regroup runs into libraries: <sample>_REP<r>_T<n> -> outer <sample>_REP<r>, inner <n>."
    tool_id: __APPLY_RULES__
    tool_version: 1.1.0
    state:
      rules:
        rules:
          - type: add_column_metadata
            value: identifier0
          - type: add_column_regex
            target_column: 0
            expression: ^(.+_REP\d+)_T(\d+)$
            group_count: 2
        mapping:
          - type: list_identifiers
            columns:
              - 1
              - 2
            editing: false
    in:
      input: pe_drop_secondary/outputsam
    out:
      - id: output
  pe_merge_runs:
    label: pe_merge_runs
    doc: Merge runs of one library (reduce inner list), coordinate sorted.
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/picard/picard_MergeSamFiles/3.1.1.0
    tool_version: 3.1.1.0
    state:
      merge_sequence_dictionaries: false
      assume_sorted: false
      comments: []
      validation_stringency: LENIENT
    in:
      inputFile: pe_group_runs/output
    out:
      - id: outFile
  pe_markduplicates:
    label: pe_markduplicates
    doc: Mark (not remove) duplicates.
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/picard/picard_MarkDuplicates/3.1.1.0
    tool_version: 3.1.1.0
    state:
      comments: []
      remove_duplicates: false
      assume_sorted: true
      duplicate_scoring_strategy: SUM_OF_BASE_QUALITIES
      read_name_regex: null
      optical_duplicate_pixel_distance: 100
      barcode_tag: null
      validation_stringency: LENIENT
    in:
      inputFile: pe_merge_runs/outFile
    out:
      - id: outFile
      - id: metrics_file
  pe_filter_flags:
    label: pe_filter_flags
    doc: Keep mapped, properly paired-flagged, non-duplicate, MAPQ>=1 reads inside include regions.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    tool_version: 1.22+galaxy2
    state:
      mode:
        outtype: selected_reads
        filter_config:
          cond_region:
            select_region: bed
          cond_rg:
            select_rg: "no"
          cond_expr:
            select_expr: "no"
          quality: 1
          library: null
          cigarcons: null
          inclusive_filter:
            - "1"
          exclusive_filter:
            - "4"
            - "8"
            - "1024"
          exclusive_filter_all: null
          tag: null
        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            factor: 1
            seed: null
        output_options:
          reads_report_type: retained
          complementary_output: false
          adv_output:
            readtags: []
            collapsecigar: false
          output_format:
            oformat: bam
      addref_cond:
        addref_select: "no"
    in:
      input: pe_markduplicates/outFile
      mode|filter_config|cond_region|bedfile: include_regions_bed/bed
    out:
      - id: outputsam
        change_datatype: bam
  pe_filter_rules:
    label: pe_filter_rules
    doc: bamtools filter rules from assets/bamtools_filter_pe.json.
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/bamtools_filter/bamFilter/2.5.3+galaxy0
    tool_version: 2.5.3+galaxy0
    state:
      conditions:
        - filters:
            - bam_property:
                bam_property_selector: insertSize
                bam_property_value: ">=-2000"
        - filters:
            - bam_property:
                bam_property_selector: insertSize
                bam_property_value: <=2000
        - filters:
            - bam_property:
                bam_property_selector: tag
                bam_property_value: NM:<=4
        - filters:
            - bam_property:
                bam_property_selector: cigar
                bam_property_value: "*S*"
      rule_configuration:
        rules_selector: "true"
        rules: 1 & 2 & 3 & !4
    in:
      input_bam: pe_filter_flags/outputsam
    out:
      - id: out_file1
  pe_name_sort:
    label: pe_name_sort
    doc: Name-sort filtered PE BAM.
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_sort/samtools_sort/2.0.8
    tool_version: 2.0.8
    state:
      prim_key_cond:
        prim_key_select: -n
      minhash: false
    in:
      input1: pe_filter_rules/out_file1
    out:
      - id: output1
  pe_remove_orphans:
    label: pe_remove_orphans
    doc: Drop reads whose mate was filtered out; keep only FR-oriented pairs.
    run:
      class: GalaxyUserTool
      id: atacseq_bampe_rm_orphan
      version: 0.19.0
      name: Remove orphan and non-FR read pairs
      description: Drop singleton reads and pairs not in FR orientation on one chromosome from a name-sorted BAM (nf-core/atacseq bampe_rm_orphan.py --only_fr_pairs)
      license: MIT
      container: quay.io/biocontainers/mulled-v2-57736af1eb98c01010848572c9fec9fff6ffaafd:402e865b8f6af2f3e58c6fc8d57127ff0144b2c7-0
      requirements: []
      inputs:
        - name: bam
          type: data
          format:
            - qname_sorted.bam
            - bam
            - unsorted.bam
          label: Name-sorted paired-end BAM
      shell_command: |
        cat > rm_orphan.py <<'PYEOF'
        import sys
        import pysam
        fin = pysam.AlignmentFile(sys.argv[1], "rb")
        fout = pysam.AlignmentFile(sys.argv[2], "wb", header=fin.header)
        it = fin.fetch(until_eof=True)
        prev = next(it, None)
        for read in it:
            if prev is not None and prev.query_name == read.query_name:
                a, b = prev, read
                keep = False
                if a.reference_id == b.reference_id:
                    if not a.is_reverse and b.is_reverse:
                        keep = a.reference_start <= b.reference_start
                    elif a.is_reverse and not b.is_reverse:
                        keep = b.reference_start <= a.reference_start
                if keep:
                    fout.write(a)
                    fout.write(b)
                prev = next(it, None)
            else:
                prev = read
        fin.close()
        fout.close()
        PYEOF
        python rm_orphan.py '$(inputs.bam.path)' clean.bam
      outputs:
        - name: bam
          type: data
          format: qname_sorted.bam
          from_work_dir: clean.bam
          label: Cleaned name-sorted BAM
      help:
        format: markdown
        content: |
          Compact port of nf-core/atacseq `bin/bampe_rm_orphan.py` with `--only_fr_pairs` (pysam 0.19.0 + samtools 1.15.1
          biocontainer from the source module). Consecutive records sharing a read name are a pair; a pair is kept only
          when both mates are on the same chromosome in forward-reverse orientation. Singletons are dropped. The run log is
          not produced.
    in:
      bam: pe_name_sort/output1
    out:
      - id: bam
  pe_coord_sort:
    label: pe_coord_sort
    doc: Coordinate-sort cleaned PE BAM.
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_sort/samtools_sort/2.0.8
    tool_version: 2.0.8
    state:
      prim_key_cond:
        prim_key_select: ""
      minhash: false
    in:
      input1: pe_remove_orphans/bam
    out:
      - id: output1
  pe_filtered_flagstat:
    label: pe_filtered_flagstat
    doc: flagstat on final library BAM (scaling, FRiP, MultiQC).
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_flagstat/samtools_flagstat/2.0.8
    tool_version: 2.0.8
    state:
      output_fmt: txt
    in:
      input1: pe_coord_sort/output1
    out:
      - id: output1
  pe_filtered_stats:
    label: pe_filtered_stats
    doc: samtools stats on final library BAM (MultiQC).
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_stats/samtools_stats/2.0.9
    tool_version: 2.0.9
    state:
      coverage_cond:
        coverage_select: "no"
      remove_dups: false
      split_output_cond:
        split_output_selector: "no"
      filter_by_flags:
        filter_flags: nofilter
      gc_depth: null
      insert_size: null
      read_group: null
      read_length: null
      most_inserts: null
      trim_quality: null
      addref_cond:
        addref_select: "no"
      cond_region:
        select_region: "no"
      sparse: false
      remove_overlaps: false
      cov_threshold: null
    in:
      input: pe_coord_sort/output1
    out:
      - id: output
  pe_scale_factor:
    label: pe_scale_factor
    doc: CPM scale factor = 1e6 / mapped reads.
    tool_id: toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/tp_awk_tool/9.11+galaxy0
    tool_version: 9.11+galaxy0
    state:
      code: / mapped \(/ && !/primary/ && !done {print 1000000/$1; done=1}
      variables: []
    in:
      infile: pe_filtered_flagstat/output1
    out:
      - id: outfile
  pe_scale_param:
    label: pe_scale_param
    doc: Scale factor as a float parameter (mapped per element).
    tool_id: param_value_from_file
    tool_version: 0.1.0
    state:
      param_type: float
      remove_newlines: true
    in:
      input1: pe_scale_factor/outfile
    out:
      - id: float_param
  pe_genomecov:
    label: pe_genomecov
    doc: Scaled coverage bedGraph (1e6 / mapped reads); fragments from read pairs. deepTools bamCoverage stands in for bedtools genomecov -pc/-fs, which the Galaxy genomecov wrapper does not expose.
    tool_id: toolshed.g2.bx.psu.edu/repos/bgruening/deeptools_bam_coverage/deeptools_bam_coverage/4.0.0+galaxy1
    tool_version: 4.0.0+galaxy1
    state:
      binSize: 10
      scaling:
        type: "no"
      outFileFormat: bedgraph
      region: null
      advancedOpt:
        showAdvancedOpt: "yes"
        smoothLength: null
        ignoreForNormalization: null
        skipNAs: false
        doExtendCustom:
          doExtend: "yes"
        centerReads: false
        minMappingQuality: null
        samFlagInclude: null
        samFlagExclude: null
        minFragmentLength: 0
        maxFragmentLength: 0
        MNase: false
        Offset: null
        filterRNAstrand: "no"
    in:
      bamInput: pe_coord_sort/output1
      advancedOpt|scaleFactor: pe_scale_param/float_param
    out:
      - id: outFileName
  pe_sort_bedgraph:
    label: pe_sort_bedgraph
    doc: Sort bedGraph.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bedtools/bedtools_sortbed/2.31.1+galaxy1
    tool_version: 2.31.1+galaxy1
    state:
      option: ""
      genome_file_opts:
        genome_file_opts_selector: hist
    in:
      input: pe_genomecov/outFileName
    out:
      - id: output
  pe_bigwig:
    label: pe_bigwig
    doc: bedGraph -> bigWig.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/ucsc_wigtobigwig/ucsc_wigtobigwig/502+galaxy0
    tool_version: 502+galaxy0
    state:
      hist_or_builtin:
        genome_type_select: history
      settings:
        settingsType: preset
    in:
      hist_or_builtin|input1: pe_sort_bedgraph/output
      hist_or_builtin|chromfile: chrom_sizes/out_file1
    out:
      - id: out_file1
  pe_macs2:
    label: pe_macs2
    doc: MACS2 broad peak calling, no control.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/macs2/macs2_callpeak/2.2.9.1+galaxy0
    tool_version: 2.2.9.1+galaxy0
    state:
      treatment:
        t_multi_select: "No"
      control:
        c_select: "No"
      format: BAMPE
      effective_genome_size_options:
        effective_genome_size_options_selector: user_defined
      nomodel_type:
        nomodel_type_selector: nomodel
        extsize: 200
        shift: 0
      cutoff_options:
        cutoff_options_selector: qvalue
        qvalue: 0.05
      outputs:
        - peaks_tabular
      advanced_options:
        to_large: false
        nolambda: false
        spmr: false
        ratio: null
        slocal: null
        llocal: null
        broad_options:
          broad_options_selector: broad
        keep_dup_options:
          keep_dup_options_selector: all
        d_min: 20
        buffer_size: 100000
    in:
      treatment|input_treatment_file: pe_coord_sort/output1
      effective_genome_size_options|gsize: macs_gsize
      advanced_options|broad_options|broad_cutoff: broad_cutoff
    out:
      - id: output_broadpeaks
      - id: output_tabular
  pe_drop_empty_peaks:
    label: pe_drop_empty_peaks
    doc: Drop libraries with no peaks.
    tool_id: __FILTER_EMPTY_DATASETS__
    tool_version: 1.1.0
    state: {}
    in:
      input: pe_macs2/output_broadpeaks
    out:

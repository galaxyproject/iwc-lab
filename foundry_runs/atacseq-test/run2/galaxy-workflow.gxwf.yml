  deseq2_qc:
    label: deseq2_qc
    doc: DESeq2 VST/rlog PCA + sample-distance clustering.
    run:
      class: GalaxyUserTool
      id: atacseq_deseq2_qc
      version: 1.28.0
      name: DESeq2 QC on consensus peak counts
      description: VST/rlog PCA and sample-distance clustering from a peak count matrix (nf-core/atacseq DESEQ2_QC)
      license: MIT
      container: quay.io/biocontainers/mulled-v2-8849acf39a43cdd6c839a369a74c0adc823e2f91:ab110436faf952a33575c64dd74615a84011450b-0
      requirements: []
      inputs:
        - name: counts
          type: data
          format:
            - tabular
          label: Count matrix (first column feature id, one column per library, header row)
        - name: vst
          type: boolean
          value: true
          label: Use VST (else rlog)
      shell_command: |
        cat > qc.R <<'REOF'
        suppressPackageStartupMessages({ library(DESeq2); library(ggplot2); library(pheatmap); library(RColorBrewer) })
        args <- commandArgs(trailingOnly = TRUE)
        counts <- read.delim(args[1], header = TRUE, row.names = 1, check.names = FALSE)
        counts <- round(as.matrix(counts))
        samples <- colnames(counts)
        groups <- sub("_R(EP)?[0-9]+$", "", samples)
        coldata <- data.frame(row.names = samples, condition = factor(groups))
        design <- if (length(unique(groups)) > 1) ~ condition else ~ 1
        dds <- DESeqDataSetFromMatrix(countData = counts, colData = coldata, design = design)
        dds <- estimateSizeFactors(dds)
        tr <- if (args[2] == "true") vst(dds, blind = TRUE, nsub = min(1000, nrow(dds))) else rlog(dds, blind = TRUE)
        mat <- assay(tr)
        top <- head(order(apply(mat, 1, var), decreasing = TRUE), 500)
        pca <- prcomp(t(mat[top, , drop = FALSE]))
        pv <- round(100 * pca$sdev^2 / sum(pca$sdev^2), 1)
        df <- data.frame(sample = samples, condition = groups, PC1 = pca$x[, 1], PC2 = pca$x[, 2])
        write.table(df, "pca.vals.txt", sep = "\t", quote = FALSE, row.names = FALSE)
        d <- as.matrix(dist(t(mat)))
        write.table(cbind(sample = rownames(d), d), "sample.dists.txt", sep = "\t", quote = FALSE, row.names = FALSE)
        pdf("deseq2_qc.pdf", width = 7, height = 7)
        print(ggplot(df, aes(PC1, PC2, colour = condition, label = sample)) + geom_point(size = 3) +
              xlab(paste0("PC1: ", pv[1], "% variance")) + ylab(paste0("PC2: ", pv[2], "% variance")) + theme_bw())
        pheatmap(d, clustering_distance_rows = dist(t(mat)), clustering_distance_cols = dist(t(mat)),
                 col = colorRampPalette(rev(brewer.pal(9, "Blues")))(255), main = "Sample distances")
        invisible(dev.off())
        REOF
        Rscript qc.R '$(inputs.counts.path)' '$(inputs.vst)'
      outputs:
        - name: pdf
          type: data
          format: pdf
          from_work_dir: deseq2_qc.pdf
          label: DESeq2 QC plots
        - name: pca
          type: data
          format: tabular
          from_work_dir: pca.vals.txt
          label: PCA values
        - name: dists
          type: data
          format: tabular
          from_work_dir: sample.dists.txt
          label: Sample distances
      help:
        format: markdown
        content: |
          Condensed port of nf-core/atacseq `bin/deseq2_qc.r` (`--id_col 1`, `--vst TRUE` default) in the source module's
          DESeq2 mulled biocontainer: size factors, VST (or rlog), PCA on the 500 most variable regions, Euclidean
          sample-distance heatmap. Condition = library id with the trailing `_REP<n>` removed, as nf-core does. Not
          ported: per-condition scatter plots, RData/RDS dumps, size-factor tables, MultiQC header files.
    in:
      counts: counts_matrix/tabular_output
      vst: deseq2_vst
    out:
      - id: pdf
      - id: pca
      - id: dists

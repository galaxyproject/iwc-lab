  subject:
    kind: mold
    label: advance-galaxy-draft-step
    locator: content/molds/advance-galaxy-draft-step/index.md
  kind: friction
  severity: minor
  what: Two earlier-step defects surfaced only when wiring real port types - PE FastQC output is list:paired while SE is list (__MERGE_COLLECTION__ cannot merge them), and markdup/filtered flagstats share
    element identifiers so MultiQC would collide. The procedure says append a blocking entry and escalate to repair-galaxy-draft-topology; I made the two one-step edits myself (insert __FLATTEN__, remove
    two steps) and recorded them as resolved/dropped ledger entries with topology_repair.escalations 0.
  expected: Define a lightweight in-loop path for trivial, local structural edits discovered at implementation time (one inserted collection op / one removed dead-end step), with the same ledger trail,
    or state that even these must go through repair.
  evidence: ledger entries fastqc-list-paired-vs-list-merge, markdup-flagstat-multiqc-collision.
  status: open
  issue: null

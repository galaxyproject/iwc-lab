- id: summarize-nextflow-cli-reference-assets-empty-legacy-genome-attribute
  raised_by: nextflow-summary-to-galaxy-reference-data
  observed_in:
    mold: nextflow-summary-to-galaxy-reference-data
    path: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
    revision: 5
    content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
    foundry_head: e2c26d735ea338046c61917fcf7627a7f1dc462e
  subject:
    kind: implementation
    label: '@galaxy-foundry/summarize-nextflow CLI reference_assets / reference_rebuilds detection'
    locator: packages/summarize-nextflow
  kind: defect
  severity: major
  what: reference_assets[] and reference_rebuilds[] were both empty for nf-core/atacseq 2.1.2, which the classification note itself cites as a key-expanded example. The old template assigns `params.X =
    WorkflowMain.getGenomeAttribute(params, 'X')` in main.nf (not nextflow.config / getGenomeAttribute('X')), and PREPARE_GENOME uses the positive form `if (params.bwa_index) { UNTAR } else { BWA_INDEX
    }` plus `if (!params.tss_bed) { TSS_EXTRACT }`.
  expected: Detect the WorkflowMain.getGenomeAttribute(params, 'attr') form in main.nf, populate reference_assets[] from Reference-genome-options path params, and emit reference_rebuilds[] for the negated
    `if (!params.tss_bed)` / `if (!params.macs_gsize)` guards at least.
  evidence: atacseq 2.1.2 main.nf L20-31 and subworkflows/local/prepare_genome.nf; brief built from a direct source read.
  status: open
  issue: null

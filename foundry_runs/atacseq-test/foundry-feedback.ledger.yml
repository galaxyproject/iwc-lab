- id: summarize-nextflow-cli-draft07-definitions-params-empty
  raised_by: summarize-nextflow
  observed_in:
    mold: summarize-nextflow
    path: content/molds/summarize-nextflow/index.md
    revision: 18
    content_hash: fb19fff9162cc36fae916a456cfbbe31a33c4565063a522846c48222d02f7c37
    foundry_head: d1b4cabede5bc91a5ab8603d5c2d589ad7f0d100
  subject:
    kind: implementation
    label: '@galaxy-foundry/summarize-nextflow CLI (via foundry summarize-nextflow)'
    locator: packages/summarize-nextflow
  kind: defect
  severity: major
  what: params[] was emitted empty for a pipeline whose nextflow_schema.json is draft-07 with groups under `definitions` (nf-validation era) rather than `$defs`.
  expected: Read parameter groups from either `definitions` or `$defs` (and the params block as fallback) so draft-07 nf-core schemas yield params[].
  evidence: 'nf-core/atacseq 2.1.2: 89 params (10 definitions groups) present; raw summary had params: []. Rebuilt by hand.'
  status: open
  issue: null
- id: summarize-nextflow-cli-closure-args-split-into-edges
  raised_by: summarize-nextflow
  observed_in:
    mold: summarize-nextflow
    path: content/molds/summarize-nextflow/index.md
    revision: 18
    content_hash: fb19fff9162cc36fae916a456cfbbe31a33c4565063a522846c48222d02f7c37
    foundry_head: d1b4cabede5bc91a5ab8603d5c2d589ad7f0d100
  subject:
    kind: implementation
    label: '@galaxy-foundry/summarize-nextflow CLI (via foundry summarize-nextflow)'
    locator: packages/summarize-nextflow
  kind: defect
  severity: major
  what: Multi-line call arguments containing closures were split on commas/newlines into spurious edges (`.map {` -> X, `[ [:], it ]` -> X, `}` -> X) and literal args (false, 0, []) were emitted as edge
    sources; 213 edges, many junk.
  expected: Parse call arguments as balanced expressions, attach closure operators to the preceding channel's `via`, and drop non-channel literals from edges.
  evidence: 'nf-core/atacseq 2.1.2 workflows/atacseq.nf: e.g. PREPARE_GENOME.out.fasta.map{[[:],it]} became four edges to FASTQ_ALIGN_BWA. Reconciled by hand to 119 edges.'
  status: open
  issue: null
- id: summarize-nextflow-cli-default-profile-treated-as-explicit

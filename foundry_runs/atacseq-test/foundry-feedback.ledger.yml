  subject:
    kind: mold
    label: compare-against-iwc-exemplar
    locator: content/molds/compare-against-iwc-exemplar/index.md
  kind: gap
  severity: minor
  what: The procedure and the iwc-exemplar-gxformat2 artifact assume one nearest exemplar, but IWC splits the ATAC domain into atacseq (per-sample) and consensus-peaks (cross-sample) workflows, each the
    best match for a different sub-graph. I combined slices from both under one file with a non-runnable steps map keyed by source workflow.
  expected: Allow the artifact to carry multiple labelled sub-graph slices (one per exemplar) with a documented shape, or permit one sibling file per exemplar.
  evidence: atacseq-test iwc-exemplar.gxwf.yml steps.atacseq / steps.consensus_peaks.
  status: open

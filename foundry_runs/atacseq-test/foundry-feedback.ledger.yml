  kind: gap
  severity: major
  what: The summary carries no per-process `ext.args` / `ext.args2` / `ext.prefix` from conf/modules.config, yet in nf-core these hold most scientific settings (MACS2 --broad/--nomodel/--keep-dup, bamtools/samtools

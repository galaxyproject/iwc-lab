- id: data-flow-no-recipe-for-meta-flag-branching-across-chain
  raised_by: nextflow-summary-to-galaxy-data-flow
  observed_in:
    mold: nextflow-summary-to-galaxy-data-flow
    path: content/molds/nextflow-summary-to-galaxy-data-flow/index.md
    revision: 8
    content_hash: f71cc2b4ceb115d7d93c3dd2e622cbfafb8b9f338f1dd450ee5773f3c0a0e247
    foundry_head: ae8beb6df85b09a61706d0f6990e99bccd718394
  subject:
    kind: research
    label: nextflow-operators-to-galaxy-collection-recipes
    locator: content/research/nextflow-operators-to-galaxy-collection-recipes/index.md
  kind: gap
  severity: minor
  what: The operator note covers `branch` as an operator but not the common nf-core pattern where a per-element meta flag (meta.single_end) silently changes args in many processes (ternaries in ext.args,
    module scripts) with no operator in the workflow body. Choosing to split into PE/SE lanes at input was unguided.
  expected: Add a recipe for meta-flag-driven per-element behaviour - detect it from module/config ternaries on meta.*, and recommend split-at-input lanes (split paired_or_unpaired) vs per-tool auto-detection,
    with the merge point.
  evidence: atacseq single_end ternaries in TRIMGALORE, BAMTOOLS_FILTER, BAM_REMOVE_ORPHANS, BEDTOOLS_GENOMECOV, MACS2_CALLPEAK, FEATURECOUNTS.
  status: open
  issue: null

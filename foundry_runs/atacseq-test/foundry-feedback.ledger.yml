  kind: gap
  severity: minor
  what: The procedure never says who decides how much of a large pipeline the Galaxy interface carries (aligner branches, merged-replicate level, QC stages); the interface's input/output set depends entirely
    on that choice. I asked the user, then recorded drops in the ledger.

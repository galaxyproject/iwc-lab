- id: draft-format-no-guidance-for-repeated-lane
  raised_by: nextflow-summary-to-galaxy-template
  observed_in:
    mold: nextflow-summary-to-galaxy-template
    path: content/molds/nextflow-summary-to-galaxy-template/index.md
    revision: 10
    content_hash: 77f885d640900cca7dac4a3bbb33308d4d8065e871c919c672487db61caf93ab
    foundry_head: ae8beb6df85b09a61706d0f6990e99bccd718394
  subject:
    kind: research
    label: galaxy-workflow-draft-format
    locator: content/research/galaxy-workflow-draft-format/index.md
  kind: gap
  severity: minor
  what: The draft format and draft-next-step reference cover subworkflow nesting but not a chain instantiated twice with different settings (PE/SE lanes). An inline `run:` subworkflow would be duplicated
    and walked twice by the loop; there is no shared-definition idiom. I emitted flat pe_*/se_* twins (80 steps).
  expected: State the recommended shape for parameterised repeated chains in a draft (flat twins with a twin-of hint, or a referenced subworkflow the loop implements once), and how the per-step loop should
    copy a resolved step to its twin.
  evidence: atacseq-test galaxy-workflow-draft.gxwf.yml; 30 of 80 steps are lane twins.
  status: open
  issue: null
- id: advance-step-one-per-call-impractical-for-twinned-80-step-draft
  raised_by: advance-galaxy-draft-step
  observed_in:
    mold: advance-galaxy-draft-step
    path: content/molds/advance-galaxy-draft-step/index.md
    revision: 11
    content_hash: 677bb3288b4b88a5c4d66c878318c4d46bdc15f9ebcb01698ade2100a70ea835
    foundry_head: e2c26d735ea338046c61917fcf7627a7f1dc462e
  subject:
    kind: mold
    label: advance-galaxy-draft-step
    locator: content/molds/advance-galaxy-draft-step/index.md
  kind: friction
  severity: major
  what: The Mold advances exactly one step per call. The atacseq draft had 78 drafty steps over 35 distinct wrappers (PE/SE twins, repeated samtools/awk/merge steps). I resolved and summarized each distinct
    wrapper once against the target toolbox, then concretized all steps in one scripted pass and validated with --concrete --strict-state; the one-step contract was not followed.
  expected: Allow a batch mode - resolve per distinct wrapper, implement every step sharing it, validate once - or make the harness loop's unit "one wrapper" rather than "one step", with the same validation
    gate.
  evidence: atacseq-test phase 7; 34 pins + 1 substitute cached, 3 UDTs, 1 validation fix round (11 state errors), draft-next-step draft:false.
  status: open
  issue: null
- id: advance-step-in-loop-repairs-without-escalation
  raised_by: advance-galaxy-draft-step
  observed_in:
    mold: advance-galaxy-draft-step
    path: content/molds/advance-galaxy-draft-step/index.md
    revision: 11
    content_hash: 677bb3288b4b88a5c4d66c878318c4d46bdc15f9ebcb01698ade2100a70ea835

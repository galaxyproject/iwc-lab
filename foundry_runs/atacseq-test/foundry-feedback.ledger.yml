  subject:
    kind: implementation
    label: '@galaxy-foundry/summarize-nextflow CLI (via foundry summarize-nextflow)'
    locator: packages/summarize-nextflow
  kind: defect
  severity: major
  what: With no --profile given, the CLI default `test` was treated as an explicit caller override; only one test candidate was emitted (rationale "explicit caller profile override") though three body-classified
    test profiles exist and there is no nf-test suite.
  expected: Per the mold (no silent profile default; profile fallback emits every kinds:test profile), emit test, test_controls and test_full as candidates and classify test_full reference-scale.
  evidence: 'nf-core/atacseq 2.1.2: profiles[] correctly classified test/test_controls/test_full as test, but test_candidates held only profile:test.'

  subject:
    kind: mold
    label: summarize-nextflow
    locator: content/molds/summarize-nextflow/index.md
  kind: gap
  severity: minor
  what: Step 3.5's discovery branches do not cover the legacy nf-core idiom where assets/schema_input.json exists but is used by neither an nf-schema `schema:` keyword nor samplesheetToList; the sheet is

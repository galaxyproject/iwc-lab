class: GalaxyWorkflow
label: nf-core/bamtofastq (Galaxy translation)
doc: |
  Translation of nf-core/bamtofastq 2.2.1 (8a29586). Converts a list of BAM/CRAM alignments
  to FASTQ: pre-conversion samtools/FastQC QC, per-sample single/paired classification,
  paired-end conversion via the source's four-way pair-class split (map/map, unmap/unmap,
  unmap/map, map/unmap), merge of unmapped classes, name-collated FASTQ extraction and
  mapped+unmapped concatenation; single-end conversion keeps the "other" FASTQ stream;
  post-conversion FastQC and fastq_info.
license: MIT
creator:
  - class: Organization
    name: nf-core (source pipeline)
inputs:
  alignments:
    type: collection
    collection_type: list
    format:
      - bam
      - cram
    doc: One BAM or CRAM per sample; element identifier = sample id (nf-core samplesheet sample_id).
  reference_fasta:
    type: data
    format: fasta
    optional: true
    doc: Reference FASTA (needed to decode CRAM; nf-core --fasta).
  chr:
    type: string
    optional: true
    doc: Regions to keep before conversion, space separated (nf-core --chr), e.g. "chrX chrY".
  skip_read_qc:
    type: boolean
    default: false
    doc: Skip FastQC before and after conversion (nf-core --no_read_QC).
  skip_stats:
    type: boolean
    default: false
    doc: Skip samtools flagstat/idxstats/stats (nf-core --no_stats).
  collate_fast:
    type: boolean
    default: false
    doc: Use samtools collate fast mode (nf-core --samtools_collate_fast).
  reads_in_memory:
    type: int
    default: 100000
    doc: Reads kept in memory in collate fast mode (nf-core --reads_in_memory).
outputs:
  paired_reads:
    outputSource: zip_paired_reads/output
  single_end_reads:
    outputSource: collate_fastq_single/fastq_other
  samtools_idxstats:
    outputSource: idxstats/output
  samtools_flagstat:
    outputSource: flagstat/output1
  samtools_stats:
    outputSource: stats/output
  fastqc_pre_html:
    outputSource: fastqc_pre/html_file
  fastqc_post_paired_html:
    outputSource: fastqc_post_paired/html_file
  fastqc_post_single_html:
    outputSource: fastqc_post_single/html_file
  fastq_info_paired:
    outputSource: fastq_info_paired/output
  fastq_info_single:
    outputSource: fastq_info_single/output
  fastqc_pre_data:
    outputSource: fastqc_pre/text_file
  fastqc_post_single_data:
    outputSource: fastqc_post_single/text_file
  fastqc_post_paired_data:
    outputSource: fastqc_post_paired/text_file
steps:
  idxstats:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_idxstats/samtools_idxstats/2.0.8
    tool_version: 2.0.8
    tool_shed_repository:
      changeset_revision: 13aad5cb9be4
      name: samtools_idxstats
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input: alignments
      skip: skip_stats
    when: $(!inputs.skip)
    out:
      - id: output
    state:
      input:
        __class__: ConnectedValue
  flagstat:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_flagstat/samtools_flagstat/2.0.8
    tool_version: 2.0.8
    tool_shed_repository:
      changeset_revision: a0d8e49a018c
      name: samtools_flagstat
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input1: alignments
      skip: skip_stats
    when: $(!inputs.skip)
    out:
      - id: output1
    state:
      input1:
        __class__: ConnectedValue
      output_fmt: txt
  stats:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_stats/samtools_stats/2.0.9
    tool_version: 2.0.9
    tool_shed_repository:
      changeset_revision: 8fca6e1eac98
      name: samtools_stats
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input: alignments
      skip: skip_stats
    when: $(!inputs.skip)
    out:
      - id: output
    state:
      input:
        __class__: ConnectedValue
      coverage_cond:
        coverage_select: "no"
      remove_dups: false
      split_output_cond:
        split_output_selector: "no"
      filter_by_flags:
        filter_flags: nofilter
      addref_cond:
        addref_select: "no"
  fastqc_pre:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/0.74+galaxy1
    tool_version: 0.74+galaxy1
    tool_shed_repository:
      changeset_revision: 2c64fded1286
      name: fastqc
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input_file: alignments
      skip: skip_read_qc
    when: $(!inputs.skip)
    out:
      - id: html_file
      - id: text_file
    state:
      input_file:
        __class__: ConnectedValue
      nogroup: false
      kmers: 7
  chr_extract:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      changeset_revision: 5cf9fcc93508
      name: samtools_view
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input: alignments
      mode|filter_config|cond_region|regions: chr
      chr: chr
    when: $(inputs.chr != null && inputs.chr != "")
    out:
      - id: outputsam
    state:
      input:
        __class__: ConnectedValue
      mode:
        outtype: selected_reads
        filter_config:
          cond_region:
            select_region: text
            regions:
              __class__: ConnectedValue
          cond_rg:
            select_rg: "no"
          cond_expr:
            select_expr: "no"
          inclusive_filter: []
          exclusive_filter: []
          exclusive_filter_all: []
        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            factor: 1
        output_options:
          reads_report_type: retained
          complementary_output: false
          output_format:
            oformat: bam
      addref_cond:
        addref_select: "no"
  pick_alignments:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/pick_value/pick_value/0.2.0
    tool_version: 0.2.0
    tool_shed_repository:
      changeset_revision: b19e21af9c52
      name: pick_value
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      style_cond|type_cond|pick_from_0|value: chr_extract/outputsam
      style_cond|type_cond|pick_from_1|value: alignments
    out:
      - id: data_param
    state:
      style_cond:
        pick_style: first
        type_cond:
          param_type: data
          pick_from:
            - value:
                __class__: ConnectedValue
            - value:
                __class__: ConnectedValue
  check_paired_end:
    run:
      class: GalaxyUserTool
      id: nfcore_bamtofastq_checkpairedend
      version: 1.0.0
      name: Check paired-end alignments
      description: classify a BAM/CRAM as paired or single end (nf-core/bamtofastq CHECKPAIREDEND)
      license: MIT
      container: community.wave.seqera.io/library/htslib_samtools:1.23.1--5b6bb4ede7e612e5
      requirements:
        - type: resource
          cores_min: 1
      configfiles:
        - filename: check_paired_end.sh
          content: |
            REF="$(inputs.reference ? "--reference '" + inputs.reference.path + "'" : '')"
            IN='$(inputs.alignment.path)'
            N=`eval samtools view $REF "'$IN'" -@ $GALAXY_SLOTS | head -n1000 | wc -l`
            if [ "$N" -lt 1000 ]; then LINES=$N; else LINES=1000; fi
            FRAC=`{ eval samtools view -H $REF "'$IN'" -@ $GALAXY_SLOTS ; eval samtools view $REF "'$IN'" -@ $GALAXY_SLOTS | head -n$LINES; } | eval samtools view $REF -c -f 1 -@ $GALAXY_SLOTS | awk -v lines=$LINES '{print $1/lines}'`
            if [ "$FRAC" = "1" ]; then echo paired > result.txt; else echo single > result.txt; fi
      shell_command: bash check_paired_end.sh
      inputs:
        - name: alignment
          type: data
          format:
            - bam
            - cram
          label: Alignments (BAM or CRAM)
        - name: reference
          type: data
          format:
            - fasta
          optional: true
          label: Reference FASTA (needed for CRAM)
      outputs:
        - name: classification
          type: data
          format: tabular
          from_work_dir: result.txt
          label: Pairing class
      help:
        format: markdown
        content: |
          Port of the nf-core/bamtofastq 2.2.1 local module CHECKPAIREDEND. Reads up to the first
          1000 alignment records; writes `paired` when every sampled record has FLAG 0x1, otherwise
          `single`.
    in:
      alignment: pick_alignments/data_param
      reference: reference_fasta
    out:
      - id: classification
  pairing_table:
    tool_id: toolshed.g2.bx.psu.edu/repos/nml/collapse_collections/collapse_dataset/5.1.0
    tool_version: 5.1.0
    tool_shed_repository:
      changeset_revision: 90981f86000f
      name: collapse_collections
      owner: nml
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input_list: check_paired_end/classification
    out:
      - id: output
    state:
      input_list:
        __class__: ConnectedValue
      one_header: false
      filename:
        add_name: true
        place_name: same_once
  paired_ids_filter:
    tool_id: Filter1
    tool_version: 1.1.1
    in:
      input: pairing_table/output
    out:
      - id: out_file1
    state:
      cond: c2=='paired'
      header_lines: 0
  paired_ids:
    tool_id: Cut1
    tool_version: 1.0.2
    in:
      input: paired_ids_filter/out_file1
    out:
      - id: out_file1
    state:
      columnList: c1
      delimiter: T
  split_by_pairing:
    tool_id: __FILTER_FROM_FILE__
    tool_version: 1.0.0
    in:
      input: pick_alignments/data_param
      how|filter_source: paired_ids/out_file1
    out:
      - id: output_filtered
      - id: output_discarded
    state:
      how:
        how_filter: remove_if_absent
  view_map_map:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      changeset_revision: 5cf9fcc93508
      name: samtools_view
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input: split_by_pairing/output_filtered
    out:
      - id: outputsam
    state:
      input:
        __class__: ConnectedValue
      mode:
        outtype: selected_reads
        filter_config:
          cond_region:
            select_region: "no"
          cond_rg:
            select_rg: "no"
          cond_expr:
            select_expr: "no"
          inclusive_filter:
            - "1"
          exclusive_filter:
            - "4"
            - "8"
          exclusive_filter_all: []
        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            factor: 1
        output_options:
          reads_report_type: retained
          complementary_output: false
          output_format:
            oformat: bam
      addref_cond:
        addref_select: "no"
  view_unmap_unmap:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      changeset_revision: 5cf9fcc93508
      name: samtools_view
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input: split_by_pairing/output_filtered
    out:
      - id: outputsam
    state:
      input:
        __class__: ConnectedValue
      mode:
        outtype: selected_reads
        filter_config:
          cond_region:
            select_region: "no"
          cond_rg:
            select_rg: "no"
          cond_expr:
            select_expr: "no"
          inclusive_filter:
            - "4"
            - "8"
          exclusive_filter:
            - "256"
          exclusive_filter_all: []
        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            factor: 1
        output_options:
          reads_report_type: retained
          complementary_output: false
          output_format:
            oformat: bam
      addref_cond:
        addref_select: "no"
  view_unmap_map:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      changeset_revision: 5cf9fcc93508
      name: samtools_view
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input: split_by_pairing/output_filtered
    out:
      - id: outputsam
    state:
      input:
        __class__: ConnectedValue
      mode:
        outtype: selected_reads
        filter_config:
          cond_region:
            select_region: "no"
          cond_rg:
            select_rg: "no"
          cond_expr:
            select_expr: "no"
          inclusive_filter:
            - "4"
          exclusive_filter:
            - "8"
            - "256"
          exclusive_filter_all: []
        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            factor: 1
        output_options:
          reads_report_type: retained
          complementary_output: false
          output_format:
            oformat: bam
      addref_cond:
        addref_select: "no"
  view_map_unmap:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      changeset_revision: 5cf9fcc93508
      name: samtools_view
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input: split_by_pairing/output_filtered
    out:
      - id: outputsam
    state:
      input:
        __class__: ConnectedValue
      mode:
        outtype: selected_reads
        filter_config:
          cond_region:
            select_region: "no"
          cond_rg:
            select_rg: "no"
          cond_expr:
            select_expr: "no"
          inclusive_filter:
            - "8"
          exclusive_filter:
            - "4"
            - "256"
          exclusive_filter_all: []
        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            factor: 1
        output_options:
          reads_report_type: retained
          complementary_output: false
          output_format:
            oformat: bam
      addref_cond:
        addref_select: "no"
  merge_unmapped_classes:
    tool_id: __MERGE_COLLECTION__
    tool_version: 1.0.0
    in:
      inputs_0|input: view_unmap_unmap/outputsam
      inputs_1|input: view_unmap_map/outputsam
      inputs_2|input: view_map_unmap/outputsam
    out:
      - id: output
    state:
      inputs:
        - &a1
          input:
            __class__: ConnectedValue
        - *a1
        - *a1
      advanced:
        conflict:
          duplicate_options: suffix_every
          suffix_pattern: _#
  nest_unmapped_classes:
    tool_id: __APPLY_RULES__
    tool_version: 1.1.0
    in:
      input: merge_unmapped_classes/output
    out:
      - id: output
    state:
      input:
        __class__: ConnectedValue
      rules:
        rules:
          - type: add_column_metadata
            value: identifier0
          - type: add_column_regex
            target_column: 0
            expression: ^(.*)_([123])$
            group_count: 2
        mapping:
          - type: list_identifiers
            columns:
              - 1
              - 2
  merge_unmapped:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_merge/samtools_merge/1.22+galaxy2
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      changeset_revision: 37c8eb55315d
      name: samtools_merge
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      bamfiles: nest_unmapped_classes/output
    out:
      - id: output
    state:
      bamfiles:
        __class__: ConnectedValue
      idrg: false
      idpg: false
      seed: 1
  collate_fastq_mapped:
    run:
      class: GalaxyUserTool
      id: nfcore_samtools_collatefastq
      version: 1.23.1
      name: Samtools collate and fastq
      description: name-collate alignments and write FASTQ (nf-core samtools/collatefastq)
      license: MIT
      container: community.wave.seqera.io/library/htslib_samtools:1.23.1--5b6bb4ede7e612e5
      requirements:
        - type: resource
          cores_min: 1
      shell_command: "samtools collate $(inputs.collate_fast ? '-f -r ' + inputs.reads_in_memory : '') --threads $GALAXY_SLOTS $(inputs.reference ? \"--reference '\" + inputs.reference.path + \"'\" : '') -O '$(inputs.alignment.path)' . | samtools fastq -N --threads $GALAXY_SLOTS $(inputs.reference ? \"--reference '\" + inputs.reference.path + \"'\" : '') -0 out_other.fq.gz $(inputs.single_end ? '-1 out_1.fq.gz -s out_singleton.fq.gz' : '-1 out_1.fq.gz -2 out_2.fq.gz -s out_singleton.fq.gz') && touch out_2.fq.gz"
      inputs:
        - name: alignment
          type: data
          format:
            - bam
            - cram
          label: Alignments (BAM or CRAM)
        - name: reference
          type: data
          format:
            - fasta
          optional: true
          label: Reference FASTA (needed for CRAM)
        - name: single_end
          type: boolean
          value: false
          label: Single-end input
        - name: collate_fast
          type: boolean
          value: false
          label: Fast collate mode (-f)
        - name: reads_in_memory
          type: integer
          value: 100000
          label: Reads to keep in memory in fast mode (-r)
      outputs:
        - name: fastq_1
          type: data
          format: fastqsanger.gz
          from_work_dir: out_1.fq.gz
          label: Read 1 FASTQ
        - name: fastq_2
          type: data
          format: fastqsanger.gz
          from_work_dir: out_2.fq.gz
          label: Read 2 FASTQ
        - name: fastq_other
          type: data
          format: fastqsanger.gz
          from_work_dir: out_other.fq.gz
          label: FASTQ of reads with neither or both READ1/READ2 flags
        - name: fastq_singleton
          type: data
          format: fastqsanger.gz
          from_work_dir: out_singleton.fq.gz
          label: Singleton FASTQ
      help:
        format: markdown
        content: |
          Port of nf-core module samtools/collatefastq as configured by nf-core/bamtofastq 2.2.1
          (`ext.args2 = '-N'`, `ext.args = '-f -r <reads_in_memory>'` when fast mode is on):
          `samtools collate -O <in> . | samtools fastq -N -0 other -1 R1 [-2 R2] -s singleton`.
    in:
      alignment: view_map_map/outputsam
      reference: reference_fasta
      collate_fast: collate_fast
      reads_in_memory: reads_in_memory
    out:
      - id: fastq_1
      - id: fastq_2
    state:
      single_end: false
  collate_fastq_unmapped:
    run:
      class: GalaxyUserTool
      id: nfcore_samtools_collatefastq
      version: 1.23.1
      name: Samtools collate and fastq
      description: name-collate alignments and write FASTQ (nf-core samtools/collatefastq)
      license: MIT
      container: community.wave.seqera.io/library/htslib_samtools:1.23.1--5b6bb4ede7e612e5
      requirements:
        - type: resource
          cores_min: 1
      shell_command: "samtools collate $(inputs.collate_fast ? '-f -r ' + inputs.reads_in_memory : '') --threads $GALAXY_SLOTS $(inputs.reference ? \"--reference '\" + inputs.reference.path + \"'\" : '') -O '$(inputs.alignment.path)' . | samtools fastq -N --threads $GALAXY_SLOTS $(inputs.reference ? \"--reference '\" + inputs.reference.path + \"'\" : '') -0 out_other.fq.gz $(inputs.single_end ? '-1 out_1.fq.gz -s out_singleton.fq.gz' : '-1 out_1.fq.gz -2 out_2.fq.gz -s out_singleton.fq.gz') && touch out_2.fq.gz"
      inputs:
        - name: alignment
          type: data
          format:
            - bam
            - cram
          label: Alignments (BAM or CRAM)
        - name: reference
          type: data
          format:
            - fasta
          optional: true
          label: Reference FASTA (needed for CRAM)
        - name: single_end
          type: boolean
          value: false
          label: Single-end input
        - name: collate_fast
          type: boolean
          value: false
          label: Fast collate mode (-f)
        - name: reads_in_memory
          type: integer
          value: 100000
          label: Reads to keep in memory in fast mode (-r)
      outputs:
        - name: fastq_1
          type: data
          format: fastqsanger.gz
          from_work_dir: out_1.fq.gz
          label: Read 1 FASTQ
        - name: fastq_2
          type: data
          format: fastqsanger.gz
          from_work_dir: out_2.fq.gz
          label: Read 2 FASTQ
        - name: fastq_other
          type: data
          format: fastqsanger.gz
          from_work_dir: out_other.fq.gz
          label: FASTQ of reads with neither or both READ1/READ2 flags
        - name: fastq_singleton
          type: data
          format: fastqsanger.gz
          from_work_dir: out_singleton.fq.gz
          label: Singleton FASTQ
      help:
        format: markdown
        content: |
          Port of nf-core module samtools/collatefastq as configured by nf-core/bamtofastq 2.2.1
          (`ext.args2 = '-N'`, `ext.args = '-f -r <reads_in_memory>'` when fast mode is on):
          `samtools collate -O <in> . | samtools fastq -N -0 other -1 R1 [-2 R2] -s singleton`.
    in:
      alignment: merge_unmapped/output
      reference: reference_fasta
      collate_fast: collate_fast
      reads_in_memory: reads_in_memory
    out:
      - id: fastq_1
      - id: fastq_2
    state:
      single_end: false
  cat_r1:
    tool_id: cat1
    tool_version: 1.0.0
    in:
      input1: collate_fastq_mapped/fastq_1
      queries_0|input2: collate_fastq_unmapped/fastq_1
    out:
      - id: out_file1
    state:
      input1:
        __class__: ConnectedValue
      queries:
        - input2:
            __class__: ConnectedValue
  cat_r2:
    tool_id: cat1
    tool_version: 1.0.0
    in:
      input1: collate_fastq_mapped/fastq_2
      queries_0|input2: collate_fastq_unmapped/fastq_2
    out:
      - id: out_file1
    state:
      input1:
        __class__: ConnectedValue
      queries:
        - input2:
            __class__: ConnectedValue
  zip_paired_reads:
    tool_id: __ZIP_COLLECTION__
    tool_version: 1.0.0
    in:
      input_forward: cat_r1/out_file1
      input_reverse: cat_r2/out_file1
    out:
      - id: output
  collate_fastq_single:
    run:
      class: GalaxyUserTool
      id: nfcore_samtools_collatefastq
      version: 1.23.1
      name: Samtools collate and fastq
      description: name-collate alignments and write FASTQ (nf-core samtools/collatefastq)
      license: MIT
      container: community.wave.seqera.io/library/htslib_samtools:1.23.1--5b6bb4ede7e612e5
      requirements:
        - type: resource
          cores_min: 1
      shell_command: "samtools collate $(inputs.collate_fast ? '-f -r ' + inputs.reads_in_memory : '') --threads $GALAXY_SLOTS $(inputs.reference ? \"--reference '\" + inputs.reference.path + \"'\" : '') -O '$(inputs.alignment.path)' . | samtools fastq -N --threads $GALAXY_SLOTS $(inputs.reference ? \"--reference '\" + inputs.reference.path + \"'\" : '') -0 out_other.fq.gz $(inputs.single_end ? '-1 out_1.fq.gz -s out_singleton.fq.gz' : '-1 out_1.fq.gz -2 out_2.fq.gz -s out_singleton.fq.gz') && touch out_2.fq.gz"
      inputs:
        - name: alignment
          type: data
          format:
            - bam
            - cram
          label: Alignments (BAM or CRAM)
        - name: reference
          type: data
          format:
            - fasta
          optional: true
          label: Reference FASTA (needed for CRAM)
        - name: single_end
          type: boolean
          value: false
          label: Single-end input
        - name: collate_fast
          type: boolean
          value: false
          label: Fast collate mode (-f)
        - name: reads_in_memory
          type: integer
          value: 100000
          label: Reads to keep in memory in fast mode (-r)
      outputs:
        - name: fastq_1
          type: data
          format: fastqsanger.gz
          from_work_dir: out_1.fq.gz
          label: Read 1 FASTQ
        - name: fastq_2
          type: data
          format: fastqsanger.gz
          from_work_dir: out_2.fq.gz
          label: Read 2 FASTQ
        - name: fastq_other
          type: data
          format: fastqsanger.gz
          from_work_dir: out_other.fq.gz
          label: FASTQ of reads with neither or both READ1/READ2 flags
        - name: fastq_singleton
          type: data
          format: fastqsanger.gz
          from_work_dir: out_singleton.fq.gz
          label: Singleton FASTQ
      help:
        format: markdown
        content: |
          Port of nf-core module samtools/collatefastq as configured by nf-core/bamtofastq 2.2.1
          (`ext.args2 = '-N'`, `ext.args = '-f -r <reads_in_memory>'` when fast mode is on):
          `samtools collate -O <in> . | samtools fastq -N -0 other -1 R1 [-2 R2] -s singleton`.
    in:
      alignment: split_by_pairing/output_discarded
      reference: reference_fasta
      collate_fast: collate_fast
      reads_in_memory: reads_in_memory
    out:
      - id: fastq_other
    state:
      single_end: true
  fastqc_post_paired:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/0.74+galaxy1
    tool_version: 0.74+galaxy1
    tool_shed_repository:

        ln -s '$(inputs.genome_fai.path)' genome.fa.fai
        ln -s '$(inputs.genome_dict.path)' genome.dict
        DGP='$(inputs.driver_gene_panel ? inputs.driver_gene_panel.path : '')'; [ -n "$DGP" ] || DGP=$R/common/DriverGenePanel.38.tsv
        T='$(inputs.tumor_id)'
        tar -xf '$(inputs.amber_dir.path)'; tar -xf '$(inputs.cobalt_dir.path)'; tar -xf '$(inputs.esvee_dir.path)'
        mkdir -p pave_somatic pave_germline
        ln -s '$(inputs.pave_somatic_vcf.path)' pave_somatic/$T.pave.somatic.vcf.gz
        ln -s '$(inputs.pave_germline_vcf.path)' pave_germline/$T.pave.germline.vcf.gz
        purple -Xmx$XMX -tumor $T -reference '$(inputs.normal_id)' -amber amber -cobalt cobalt -esvee_dir esvee \
          -pave_somatic_dir pave_somatic -pave_germline_dir pave_germline -ref_genome genome.fa -ref_genome_version $(inputs.genome_version) \
          -driver_gene_panel $DGP -ensembl_data_dir $R/common/ensembl_data -somatic_hotspots $R/dna/variants/KnownHotspots.somatic.38.vcf.gz \
          -germline_hotspots $R/dna/variants/KnownHotspots.germline.38.vcf.gz \
          -germline_amp_del_freq_file $R/dna/copy_number/cohort_germline_amp_del_freq.38.csv \
          -gc_profile $R/dna/copy_number/GC_profile.1000bp.38.cnp $(inputs.min_purity != null ? '-min_purity ' + inputs.min_purity : '') $(inputs.max_purity != null ? '-max_purity ' + inputs.max_purity : '') $(inputs.min_ploidy != null ? '-min_ploidy ' + inputs.min_ploidy : '') $(inputs.max_ploidy != null ? '-max_ploidy ' + inputs.max_ploidy : '') \
          -circos `which circos` -threads $THREADS -output_dir purple/
        cp purple/$T.purple.purity.tsv purity.tsv; cp purple/$T.purple.qc qc.txt
        cp purple/$T.purple.somatic.vcf.gz somatic.vcf.gz; cp purple/$T.purple.germline.vcf.gz germline.vcf.gz
        cp purple/$T.purple.sv.vcf.gz sv.vcf.gz
        if [ -f purple/$T.purple.sv.germline.vcf.gz ]; then cp purple/$T.purple.sv.germline.vcf.gz sv_germline.vcf.gz; else : > sv_germline.vcf.gz; fi
        cp purple/$T.purple.cnv.somatic.tsv cnv_somatic.tsv; cp purple/$T.purple.driver.catalog.somatic.tsv driver_catalog_somatic.tsv
        tar -cf purple_dir.tar purple
      outputs:
      - name: purple_dir
        type: data
        format: tar
        from_work_dir: purple_dir.tar
        label: PURPLE output directory
      - name: purity
        type: data
        format: tabular
        from_work_dir: purity.tsv
        label: PURPLE purity
      - name: qc
        type: data
        format: txt
        from_work_dir: qc.txt
        label: PURPLE QC
      - name: somatic_vcf
        type: data
        format: vcf_bgzip
        from_work_dir: somatic.vcf.gz
        label: PURPLE somatic VCF
      - name: germline_vcf
        type: data
        format: vcf_bgzip
        from_work_dir: germline.vcf.gz
        label: PURPLE germline VCF
      - name: sv_vcf
        type: data
        format: vcf_bgzip
        from_work_dir: sv.vcf.gz
        label: PURPLE somatic SV VCF
      - name: sv_germline_vcf
        type: data
        format: vcf_bgzip
        from_work_dir: sv_germline.vcf.gz
        label: PURPLE germline SV VCF
      - name: cnv_somatic
        type: data
        format: tabular
        from_work_dir: cnv_somatic.tsv
        label: PURPLE somatic copy number
      - name: driver_catalog_somatic
        type: data
        format: tabular
        from_work_dir: driver_catalog_somatic.tsv
        label: PURPLE somatic driver catalogue
      help:
        format: markdown
        content: |
          Port of nf-core/oncoanalyser 3.0.0 `PURPLE (modules/local/purple)` for Galaxy (core DNA spine translation).
          Uses the module's own biocontainer. HMF resources come from one archive input; members are
          extracted by their `conf/hmf_data.config` relative paths. Optional purity/ploidy bounds reproduce the source test profile's `withName: 'PURPLE' ext.args`. The PAVE VCFs are placed in pave_somatic/ and pave_germline/ directories, as PURPLE reads them.
  linx_somatic:
    label: linx_somatic
    doc: hmftools LINX somatic SV annotation.
    in:
      purple_dir: purple/purple_dir
      genome_version: genome_version
      hmf_resources: hmf_pipeline_resources
      sample_id: tumor_sample_id
      driver_gene_panel: driver_gene_panel
    out:
    - id: linx_dir
    - id: driver_catalog
    - id: fusions
    - id: svs
    run:
      class: GalaxyUserTool
      id: oncoanalyser_linx_somatic
      version: 2.3.1
      name: hmftools LINX somatic SV annotation
      description: Cluster somatic structural variants, call fusions and drivers from PURPLE output with hmftools LINX
      license: GPL-3.0-only
      container: quay.io/biocontainers/hmftools-linx:2.3.1--hdfd78af_0
      requirements:
      - type: resource
        cores_min: 1
        ram_min: 8192
      inputs:
      - name: purple_dir
        type: data
        format:
        - tar
        label: PURPLE output
      - name: sample_id
        type: text
        label: Tumor sample name
      - name: hmf_resources
        type: data
        format:
        - tar.gz
        - tar
        - data
        label: HMF pipeline resources archive
        help: hmf_pipeline_resources.38_v3.0.0--8.tar.gz (data.oncoanalyser.com); members are extracted by relative path.
      - name: driver_gene_panel
        type: data
        format:
        - tabular
        label: Driver gene panel (optional)
        optional: true
        help: Defaults to common/DriverGenePanel.38.tsv inside the HMF resources archive.
      - name: genome_version
        type: select
        label: Reference genome version
        options:
        - value: '38'
          label: '38'
          selected: true
      shell_command: |
        set -e
        MEM=$GALAXY_MEMORY_MB; [ -n "$MEM" ] || MEM=8192
        XMX=`expr $MEM \* 75 / 100`m
        B='$(inputs.hmf_resources.path)'
        tar -tzf "$B" > hmf_members.txt
        TOP=`head -n 1 hmf_members.txt | cut -d/ -f1`
        grep -E -e "^$TOP/common/ensembl_data" -e "^$TOP/dna/sv/known_fusion_data.38.csv" -e "^$TOP/common/DriverGenePanel.38.tsv" hmf_members.txt > hmf_wanted.txt
        sed -n 's#/[^/]*$##p' hmf_wanted.txt | sort -u | xargs mkdir -p
        tar -xzf "$B" -T hmf_wanted.txt
        R=$TOP
        DGP='$(inputs.driver_gene_panel ? inputs.driver_gene_panel.path : '')'; [ -n "$DGP" ] || DGP=$R/common/DriverGenePanel.38.tsv
        T='$(inputs.sample_id)'
        tar -xf '$(inputs.purple_dir.path)'
        linx -Xmx$XMX -sample $T -sv_vcf purple/$T.purple.sv.vcf.gz -purple_dir purple -ref_genome_version $(inputs.genome_version) \
          -ensembl_data_dir $R/common/ensembl_data -known_fusion_file $R/dna/sv/known_fusion_data.38.csv -driver_gene_panel $DGP \
          -write_vis_data -write_neo_epitopes -output_dir linx_somatic/
        cp linx_somatic/$T.linx.driver.catalog.tsv driver_catalog.tsv; cp linx_somatic/$T.linx.fusion.tsv fusions.tsv
        cp linx_somatic/$T.linx.svs.tsv svs.tsv
        tar -cf linx_somatic_dir.tar linx_somatic
      outputs:
      - name: linx_dir
        type: data
        format: tar
        from_work_dir: linx_somatic_dir.tar
        label: LINX somatic output directory
      - name: driver_catalog
        type: data
        format: tabular
        from_work_dir: driver_catalog.tsv
        label: LINX somatic driver catalogue
      - name: fusions
        type: data
        format: tabular
        from_work_dir: fusions.tsv
        label: LINX fusions
      - name: svs
        type: data
        format: tabular
        from_work_dir: svs.tsv
        label: LINX SV annotations
      help:
        format: markdown
        content: "Port of nf-core/oncoanalyser 3.0.0 `LINX_SOMATIC (modules/local/linx/somatic)` for Galaxy (core DNA spine translation).\nUses the module's own biocontainer. HMF resources come from one\
          \ archive input; members are\nextracted by their `conf/hmf_data.config` relative paths. \n"
  linx_germline:
    label: linx_germline
    doc: hmftools LINX germline SV disruption annotation.
    in:
      sv_vcf: purple/sv_germline_vcf
      genome_version: genome_version
      hmf_resources: hmf_pipeline_resources
      sample_id: tumor_sample_id
      driver_gene_panel: driver_gene_panel
    out:
    - id: germline_driver_catalog
    run:
      class: GalaxyUserTool
      id: oncoanalyser_linx_germline
      version: 2.3.1
      name: hmftools LINX germline SV annotation
      description: Annotate germline structural-variant disruptions of driver genes with hmftools LINX
      license: GPL-3.0-only
      container: quay.io/biocontainers/hmftools-linx:2.3.1--hdfd78af_0
      requirements:
      - type: resource
        cores_min: 1
        ram_min: 8192
      inputs:
      - name: sv_vcf
        type: data
        format:
        - vcf_bgzip
        label: PURPLE germline SV VCF
      - name: sample_id
        type: text
        label: Tumor sample name
      - name: hmf_resources
        type: data
        format:
        - tar.gz
        - tar
        - data
        label: HMF pipeline resources archive
        help: hmf_pipeline_resources.38_v3.0.0--8.tar.gz (data.oncoanalyser.com); members are extracted by relative path.
      - name: driver_gene_panel
        type: data
        format:
        - tabular
        label: Driver gene panel (optional)
        optional: true
        help: Defaults to common/DriverGenePanel.38.tsv inside the HMF resources archive.
      - name: genome_version
        type: select
        label: Reference genome version
        options:
        - value: '38'
          label: '38'
          selected: true
      shell_command: |
        set -e
        MEM=$GALAXY_MEMORY_MB; [ -n "$MEM" ] || MEM=8192
        XMX=`expr $MEM \* 75 / 100`m
        B='$(inputs.hmf_resources.path)'
        tar -tzf "$B" > hmf_members.txt
        TOP=`head -n 1 hmf_members.txt | cut -d/ -f1`
        grep -E -e "^$TOP/common/ensembl_data" -e "^$TOP/common/DriverGenePanel.38.tsv" hmf_members.txt > hmf_wanted.txt
        sed -n 's#/[^/]*$##p' hmf_wanted.txt | sort -u | xargs mkdir -p
        tar -xzf "$B" -T hmf_wanted.txt
        R=$TOP
        DGP='$(inputs.driver_gene_panel ? inputs.driver_gene_panel.path : '')'; [ -n "$DGP" ] || DGP=$R/common/DriverGenePanel.38.tsv
        T='$(inputs.sample_id)'
        mkdir -p linx_germline
        if [ -s '$(inputs.sv_vcf.path)' ]; then
          ln -s '$(inputs.sv_vcf.path)' sv_germline.vcf.gz
          linx -Xmx$XMX -sample $T -sv_vcf sv_germline.vcf.gz -germline -ref_genome_version $(inputs.genome_version) \
            -ensembl_data_dir $R/common/ensembl_data -driver_gene_panel $DGP -output_dir linx_germline/
        fi
        if [ -f linx_germline/$T.linx.germline.driver.catalog.tsv ]; then cp linx_germline/$T.linx.germline.driver.catalog.tsv germline_driver_catalog.tsv; else : > germline_driver_catalog.tsv; fi
      outputs:
      - name: germline_driver_catalog
        type: data
        format: tabular
        from_work_dir: germline_driver_catalog.tsv
        label: LINX germline driver catalogue
      help:
        format: markdown
        content: |
          Port of nf-core/oncoanalyser 3.0.0 `LINX_GERMLINE (modules/local/linx/germline)` for Galaxy (core DNA spine translation).
          Uses the module's own biocontainer. HMF resources come from one archive input; members are
          extracted by their `conf/hmf_data.config` relative paths. Skips LINX (empty catalogue) when PURPLE wrote no germline SV VCF, matching the source's skip branch.

class: GalaxyWorkflowDraft
label: oncoanalyser WGS tumor/normal core (REDUX, AMBER, COBALT, SAGE, ESVEE, PAVE, PURPLE, LINX)
doc: |
  Galaxy translation of the nf-core/oncoanalyser 3.0.0 WGTS mode, core DNA spine only: matched tumor/normal
  WGS reads -> bwa-mem2 -> REDUX -> AMBER, COBALT, SAGE (somatic, germline), ESVEE -> PAVE -> PURPLE -> LINX.
  One subject per invocation. RNA, HLA, viral, signatures, QC and ORANGE reporting stages are not carried
  (see open-requirements ledger). hmftools steps need user-defined tools (no Tool Shed wrappers).
license: MIT
creator:
- class: Organization
  name: nf-core
  url: https://github.com/nf-core/oncoanalyser
inputs:
  tumor_dna_reads:
    type: collection
    collection_type: list:paired
    format:
    - fastqsanger.gz
    - fastqsanger
    optional: false
    doc: Tumor DNA paired-end reads, one element per library/lane; identifier <library_id>_<lane> (samplesheet rows sample_type=tumor, sequence_type=dna, filetype=fastq).
  normal_dna_reads:
    type: collection
    collection_type: list:paired
    format:
    - fastqsanger.gz
    - fastqsanger
    optional: false
    doc: Matched normal DNA paired-end reads, one element per library/lane; identifier <library_id>_<lane>.
  tumor_sample_id:
    type: string
    optional: false
    doc: 'Tumor sample name (samplesheet sample_id); BAM read-group SM, hmftools -tumor, output-file prefix. Test: subject_a.tumor.'
  normal_sample_id:
    type: string
    optional: false
    doc: 'Normal sample name; BAM read-group SM, hmftools -reference. Test: subject_a.normal.'
  reference_genome:
    type: data
    format: fasta
    optional: false
    doc: 'Reference genome FASTA (GRCh38_hmf: GRCh38_masked_exclusions_alts_hlas.fasta).'
  reference_genome_fai:
    type: data
    format: fai
    optional: true
    doc: FASTA index; built from reference_genome when not supplied.
  reference_genome_dict:
    type: data
    optional: true
    doc: Sequence dictionary (.dict); built from reference_genome when not supplied.
  reference_genome_bwa_img:
    type: data
    optional: false
    doc: BWA index image (.img, GATK BwaMemIndexImageCreator) for ESVEE.
  hmf_pipeline_resources:
    type: data
    optional: false
    doc: HMF pipeline resource bundle archive (hmf_pipeline_resources.38_v3.0.0--8.tar.gz from data.oncoanalyser.com).
  driver_gene_panel:
    type: data
    format: tabular
    optional: true
    doc: Driver gene panel TSV; defaults to common/DriverGenePanel.38.tsv inside the HMF bundle.
  genome_version:
    type: string
    optional: false
    default: '38'
    restrictions:
    - '38'
    doc: 'Reference genome version passed as -ref_genome_version. Only 38 is carried: the user-defined tools address GRCh38 HMF bundle member names.'
  sequencing_platform:
    type: string
    optional: false
    default: illumina
    restrictions:
    - illumina
    - sbx
    - ultima
    doc: Sequencing platform; selects PON members and -sequencing_type.
  purple_min_purity:
    type: float
    optional: true
    doc: 'PURPLE -min_purity (test profile: 1).'
  purple_max_purity:
    type: float
    optional: true
    doc: 'PURPLE -max_purity (test profile: 1).'
  purple_min_ploidy:
    type: float
    optional: true
    doc: 'PURPLE -min_ploidy (test profile: 2).'
  purple_max_ploidy:
    type: float
    optional: true
    doc: 'PURPLE -max_ploidy (test profile: 2).'
outputs:
  tumor_redux_bam:
    outputSource: redux_tumor/redux_bam
  normal_redux_bam:
    outputSource: redux_normal/redux_bam
  tumor_redux_duplicate_freq:
    outputSource: redux_tumor/duplicate_freq
  tumor_redux_dir:
    outputSource: redux_tumor/redux_dir
  normal_redux_dir:
    outputSource: redux_normal/redux_dir
  amber_dir:
    outputSource: amber/amber_dir
  amber_qc:
    outputSource: amber/amber_qc
  cobalt_dir:
    outputSource: cobalt/cobalt_dir
  esvee_dir:
    outputSource: esvee/esvee_dir
  esvee_somatic_vcf:
    outputSource: esvee/somatic_vcf
  sage_somatic_vcf:
    outputSource: sage_somatic/sage_vcf
  sage_germline_vcf:
    outputSource: sage_germline/sage_vcf
  pave_somatic_vcf:
    outputSource: pave_somatic/pave_vcf
  pave_germline_vcf:
    outputSource: pave_germline/pave_vcf
  purple_dir:
    outputSource: purple/purple_dir
  purple_purity:
    outputSource: purple/purity
  purple_qc:
    outputSource: purple/qc
  purple_somatic_vcf:
    outputSource: purple/somatic_vcf
  purple_germline_vcf:
    outputSource: purple/germline_vcf
  purple_sv_vcf:
    outputSource: purple/sv_vcf
  purple_cnv_somatic:
    outputSource: purple/cnv_somatic
  purple_driver_catalog_somatic:
    outputSource: purple/driver_catalog_somatic
  linx_somatic_dir:
    outputSource: linx_somatic/linx_dir
  linx_driver_catalog:
    outputSource: linx_somatic/driver_catalog
  linx_fusions:
    outputSource: linx_somatic/fusions
  linx_svs:
    outputSource: linx_somatic/svs
  linx_germline_driver_catalog:
    outputSource: linx_germline/germline_driver_catalog
steps:
  build_fai:
    label: build_fai
    doc: Index the reference FASTA (samtools faidx).
    in:
      fasta: reference_genome
    out:
    - id: fai
    run:
      class: GalaxyUserTool
      id: oncoanalyser_samtools_faidx
      version: 1.21.0
      name: Index reference FASTA (samtools faidx)
      description: Build a .fai index for a reference FASTA, as nf-core/oncoanalyser SAMTOOLS_FAIDX does
      license: MIT
      container: quay.io/biocontainers/samtools:1.21--h50ea8bc_0
      requirements: []
      inputs:
      - name: fasta
        type: data
        format:
        - fasta
        label: Reference FASTA
      shell_command: |
        ln -s '$(inputs.fasta.path)' genome.fasta && samtools faidx genome.fasta
      outputs:
      - name: fai
        type: data
        format: fai
        from_work_dir: genome.fasta.fai
        label: FASTA index
      help:
        format: markdown
        content: |
          Port of the nf-core `SAMTOOLS_FAIDX` module as used by nf-core/oncoanalyser PREPARE_REFERENCE
          (`samtools faidx <fasta>`), samtools 1.21 from the source module's biocontainer.
  build_dict:
    label: build_dict
    doc: Write a sequence dictionary for the reference FASTA.
    in:
      fasta: reference_genome
    out:
    - id: dict
    run:
      class: GalaxyUserTool
      id: oncoanalyser_samtools_dict
      version: 1.21.0
      name: Sequence dictionary for reference FASTA (samtools dict)
      description: Write a SAM sequence dictionary (.dict) for a reference FASTA, as nf-core/oncoanalyser SAMTOOLS_DICT does
      license: MIT
      container: quay.io/biocontainers/samtools:1.21--h50ea8bc_0
      requirements: []
      inputs:
      - name: fasta
        type: data
        format:
        - fasta
        label: Reference FASTA
      shell_command: |
        samtools dict '$(inputs.fasta.path)' --output genome.dict
      outputs:
      - name: dict
        type: data
        format: txt
        from_work_dir: genome.dict
        label: Sequence dictionary
      help:
        format: markdown
        content: |
          Port of the nf-core `SAMTOOLS_DICT` module (`samtools dict <fasta> --output <fasta>.dict`),
          samtools 1.21. The .dict is emitted as `txt` (no dictionary datatype is assumed on the target).
  pick_fai:
    label: pick_fai
    doc: Prefer the user-supplied reference_genome_fai; otherwise use the built one.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/pick_value/pick_value/0.2.0
    tool_version: 0.2.0
    in:
      style_cond|type_cond|pick_from_0|value: reference_genome_fai
      style_cond|type_cond|pick_from_1|value: build_fai/fai
    out:
    - id: data_param
    tool_shed_repository:
      changeset_revision: b19e21af9c52
      name: pick_value
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    state:
      style_cond:
        pick_style: first
        type_cond:
          param_type: data
          pick_from:
          - value:
              __class__: ConnectedValue
          - value:
              __class__: ConnectedValue
  pick_dict:
    label: pick_dict
    doc: Prefer the user-supplied reference_genome_dict; otherwise use the built one.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/pick_value/pick_value/0.2.0
    tool_version: 0.2.0
    in:
      style_cond|type_cond|pick_from_0|value: reference_genome_dict
      style_cond|type_cond|pick_from_1|value: build_dict/dict
    out:
    - id: data_param
    tool_shed_repository:
      changeset_revision: b19e21af9c52
      name: pick_value
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    state:
      style_cond:
        pick_style: first
        type_cond:
          param_type: data
          pick_from:
          - value:
              __class__: ConnectedValue
          - value:
              __class__: ConnectedValue
  align_tumor_lanes:
    label: align_tumor_lanes
    doc: bwa-mem2 alignment of each tumor lane (map-over list:paired) to a coordinate-sorted BAM.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bwa_mem2/bwa_mem2/2.3+galaxy1
    tool_version: 2.3+galaxy1
    in:
      fastq_input|fastq_input1: tumor_dna_reads
      reference_source|ref_file: reference_genome
      rg|read_group_sm_conditional|SM: tumor_sample_id
    out:
    - id: bam_output
    tool_shed_repository:
      changeset_revision: 7febc71de9c3
      name: bwa_mem2
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    state:
      reference_source:
        reference_source_selector: history
        ref_file:
          __class__: ConnectedValue
      fastq_input:
        fastq_input_selector: paired_collection
        fastq_input1:
          __class__: ConnectedValue
        iset_stats: null
      rg:
        rg_selector: set
        read_group_id_conditional:
          do_auto_name: 'true'
        read_group_sm_conditional:
          do_auto_name: 'false'
          SM:
            __class__: ConnectedValue
        PL: ILLUMINA
        read_group_lb_conditional:
          do_auto_name: 'true'
        CN: null
        DS: null
        DT: null
        FO: null
        KS: null
        PG: null
        PI: null
        PU: null
      analysis_type:
        analysis_type_selector: full
        algorithmic_options:
          algorithmic_options_selector: do_not_set
        scoring_options:
          scoring_options_selector: do_not_set
        io_options:
          io_options_selector: set
          five: false
          q: false
          T: 30
          h: 5
          a: false
          C: false
          V: false
          Y: true
          M: false
          K: 100000000
      output_sort: coordinate
  redux_tumor:
    label: redux_tumor
    doc: 'hmftools REDUX: merge tumor lane BAMs, mark duplicates, unmap problem regions, compute MS jitter / BQR tables.'
    in:
      input_bams: align_tumor_lanes/bam_output
      genome_fasta: reference_genome
      genome_fai: pick_fai/data_param
      hmf_resources: hmf_pipeline_resources
      genome_version: genome_version
      genome_dict: pick_dict/data_param
      sample_id: tumor_sample_id
      sequencing_platform: sequencing_platform
    out:
    - id: redux_bam
    - id: redux_bai
    - id: redux_dir
    - id: duplicate_freq
    run:
      class: GalaxyUserTool
      id: oncoanalyser_redux
      version: 2.0.5
      name: hmftools REDUX (merge, duplicate marking, jitter)
      description: Merge lane BAMs, mark duplicates, unmap problem regions and compute MS jitter/BQR tables with hmftools REDUX
      license: GPL-3.0-only
      container: quay.io/biocontainers/hmftools-redux:2.0.5--hdfd78af_0
      requirements:
      - type: resource
        cores_min: 8
        ram_min: 32768
      inputs:
      - name: input_bams
        type: data
        format:
        - bam
        label: Lane BAMs for one sample
        multiple: true
      - name: sample_id
        type: text
        label: Sample name
      - name: genome_fasta
        type: data
        format:
        - fasta
        label: Reference genome FASTA
      - name: genome_fai
        type: data
        format:
        - fai
        label: Reference FASTA index (.fai)
      - name: genome_dict
        type: data
        format:
        - txt
        - data
        label: Reference sequence dictionary (.dict)
      - name: hmf_resources
        type: data
        format:
        - tar.gz
        - tar
        - data
        label: HMF pipeline resources archive
        help: hmf_pipeline_resources.38_v3.0.0--8.tar.gz (data.oncoanalyser.com); members are extracted by relative path.
      - name: genome_version
        type: select
        label: Reference genome version
        options:
        - value: '38'
          label: '38'
          selected: true
      - name: sequencing_platform
        type: select
        label: Sequencing platform
        options:
        - value: illumina
          label: illumina
          selected: true
        - value: sbx
          label: sbx
        - value: ultima
          label: ultima
      shell_command: |
        set -e
        THREADS=$GALAXY_SLOTS; [ -n "$THREADS" ] || THREADS=1
        MEM=$GALAXY_MEMORY_MB; [ -n "$MEM" ] || MEM=16384
        XMX=`expr $MEM \* 85 / 100`m
        UPPER_PLATFORM=`echo '$(inputs.sequencing_platform)' | tr a-z A-Z`
        B='$(inputs.hmf_resources.path)'
        tar -tzf "$B" > hmf_members.txt
        TOP=`head -n 1 hmf_members.txt | cut -d/ -f1`
        grep -E -e "^$TOP/common/unmap_regions.38.tsv" -e "^$TOP/dna/variants/msi_jitter_sites.38.tsv.gz" hmf_members.txt > hmf_wanted.txt
        sed -n 's#/[^/]*$##p' hmf_wanted.txt | sort -u | xargs mkdir -p
        tar -xzf "$B" -T hmf_wanted.txt
        R=$TOP
        ln -s '$(inputs.genome_fasta.path)' genome.fa
        ln -s '$(inputs.genome_fai.path)' genome.fa.fai
        ln -s '$(inputs.genome_dict.path)' genome.dict
        SID='$(inputs.sample_id)'
        CONSENSUS=-form_consensus; SKIPDUP=
        if [ '$(inputs.sequencing_platform)' = ultima ]; then CONSENSUS=; SKIPDUP=-skip_duplicate_marking; fi
        I=0; BAMS=
        for B in $(inputs.input_bams.map((input) => `'${input.path}'`).join(" ")); do
          I=`expr $I + 1`; ln -s "$B" lane_$I.bam; samtools index -@ $THREADS lane_$I.bam
          if [ -z "$BAMS" ]; then BAMS=lane_$I.bam; else BAMS=$BAMS,lane_$I.bam; fi
        done
        mkdir -p redux_$SID
        redux -Xmx$XMX -sample $SID -input_bam $BAMS -ref_genome genome.fa -ref_genome_version $(inputs.genome_version) \
          -ref_genome_msi_file $R/dna/variants/msi_jitter_sites.38.tsv.gz -unmap_regions $R/common/unmap_regions.38.tsv \
          -bamtool `which samtools` -sequencing_type $UPPER_PLATFORM -bqr_write_plot $CONSENSUS $SKIPDUP \
          -threads $THREADS -output_bam redux_$SID/$SID.redux.bam -output_dir redux_$SID/
        cp redux_$SID/$SID.redux.bam redux.bam
        cp redux_$SID/$SID.redux.bam.bai redux.bam.bai
        cp redux_$SID/$SID.redux.duplicate_freq.tsv duplicate_freq.tsv
        mkdir redux_tsvs && cp redux_$SID/*.tsv* redux_tsvs/ && tar -cf redux_dir.tar redux_tsvs
      outputs:
      - name: redux_bam
        type: data
        format: bam
        from_work_dir: redux.bam
        label: REDUX BAM
      - name: redux_bai
        type: data
        format: data
        from_work_dir: redux.bam.bai
        label: REDUX BAM index
      - name: redux_dir
        type: data
        format: tar
        from_work_dir: redux_dir.tar
        label: REDUX tables (jitter, MS, BQR)
      - name: duplicate_freq
        type: data
        format: tabular
        from_work_dir: duplicate_freq.tsv
        label: Duplicate frequency table
      help:
        format: markdown
        content: |
          Port of nf-core/oncoanalyser 3.0.0 `REDUX (modules/local/redux)` for Galaxy (core DNA spine translation).
          Uses the module's own biocontainer. HMF resources come from one archive input; members are
          extracted by their `conf/hmf_data.config` relative paths. Lane BAMs are indexed with the image's samtools before merging (the source receives indexes alongside). UMI mode is not carried.
  align_normal_lanes:
    label: align_normal_lanes
    doc: bwa-mem2 alignment of each normal lane (map-over list:paired) to a coordinate-sorted BAM.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bwa_mem2/bwa_mem2/2.3+galaxy1
    tool_version: 2.3+galaxy1
    in:
      fastq_input|fastq_input1: normal_dna_reads
      reference_source|ref_file: reference_genome
      rg|read_group_sm_conditional|SM: normal_sample_id
    out:
    - id: bam_output
    tool_shed_repository:
      changeset_revision: 7febc71de9c3
      name: bwa_mem2
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    state:
      reference_source:
        reference_source_selector: history
        ref_file:
          __class__: ConnectedValue
      fastq_input:
        fastq_input_selector: paired_collection
        fastq_input1:
          __class__: ConnectedValue
        iset_stats: null
      rg:
        rg_selector: set
        read_group_id_conditional:
          do_auto_name: 'true'
        read_group_sm_conditional:
          do_auto_name: 'false'
          SM:
            __class__: ConnectedValue
        PL: ILLUMINA
        read_group_lb_conditional:
          do_auto_name: 'true'
        CN: null
        DS: null
        DT: null
        FO: null
        KS: null
        PG: null
        PI: null
        PU: null
      analysis_type:
        analysis_type_selector: full
        algorithmic_options:
          algorithmic_options_selector: do_not_set
        scoring_options:
          scoring_options_selector: do_not_set
        io_options:
          io_options_selector: set
          five: false
          q: false
          T: 30
          h: 5
          a: false
          C: false
          V: false
          Y: true
          M: false
          K: 100000000
      output_sort: coordinate
  redux_normal:
    label: redux_normal
    doc: 'hmftools REDUX: merge normal lane BAMs, mark duplicates, unmap problem regions, compute MS jitter / BQR tables.'
    in:
      input_bams: align_normal_lanes/bam_output
      genome_fasta: reference_genome
      genome_fai: pick_fai/data_param
      hmf_resources: hmf_pipeline_resources
      genome_version: genome_version
      genome_dict: pick_dict/data_param
      sample_id: normal_sample_id
      sequencing_platform: sequencing_platform
    out:
    - id: redux_bam
    - id: redux_bai
    - id: redux_dir
    - id: duplicate_freq
    run:
      class: GalaxyUserTool
      id: oncoanalyser_redux
      version: 2.0.5
      name: hmftools REDUX (merge, duplicate marking, jitter)
      description: Merge lane BAMs, mark duplicates, unmap problem regions and compute MS jitter/BQR tables with hmftools REDUX
      license: GPL-3.0-only
      container: quay.io/biocontainers/hmftools-redux:2.0.5--hdfd78af_0
      requirements:
      - type: resource
        cores_min: 8
        ram_min: 32768
      inputs:
      - name: input_bams
        type: data
        format:
        - bam
        label: Lane BAMs for one sample
        multiple: true
      - name: sample_id
        type: text
        label: Sample name
      - name: genome_fasta
        type: data
        format:
        - fasta
        label: Reference genome FASTA
      - name: genome_fai
        type: data
        format:
        - fai
        label: Reference FASTA index (.fai)
      - name: genome_dict
        type: data
        format:
        - txt
        - data
        label: Reference sequence dictionary (.dict)
      - name: hmf_resources
        type: data
        format:
        - tar.gz
        - tar
        - data
        label: HMF pipeline resources archive
        help: hmf_pipeline_resources.38_v3.0.0--8.tar.gz (data.oncoanalyser.com); members are extracted by relative path.
      - name: genome_version
        type: select
        label: Reference genome version
        options:
        - value: '38'
          label: '38'
          selected: true
      - name: sequencing_platform
        type: select
        label: Sequencing platform
        options:
        - value: illumina
          label: illumina
          selected: true
        - value: sbx
          label: sbx
        - value: ultima
          label: ultima
      shell_command: |
        set -e
        THREADS=$GALAXY_SLOTS; [ -n "$THREADS" ] || THREADS=1
        MEM=$GALAXY_MEMORY_MB; [ -n "$MEM" ] || MEM=16384
        XMX=`expr $MEM \* 85 / 100`m
        UPPER_PLATFORM=`echo '$(inputs.sequencing_platform)' | tr a-z A-Z`
        B='$(inputs.hmf_resources.path)'
        tar -tzf "$B" > hmf_members.txt
        TOP=`head -n 1 hmf_members.txt | cut -d/ -f1`
        grep -E -e "^$TOP/common/unmap_regions.38.tsv" -e "^$TOP/dna/variants/msi_jitter_sites.38.tsv.gz" hmf_members.txt > hmf_wanted.txt
        sed -n 's#/[^/]*$##p' hmf_wanted.txt | sort -u | xargs mkdir -p
        tar -xzf "$B" -T hmf_wanted.txt
        R=$TOP
        ln -s '$(inputs.genome_fasta.path)' genome.fa
        ln -s '$(inputs.genome_fai.path)' genome.fa.fai
        ln -s '$(inputs.genome_dict.path)' genome.dict
        SID='$(inputs.sample_id)'
        CONSENSUS=-form_consensus; SKIPDUP=
        if [ '$(inputs.sequencing_platform)' = ultima ]; then CONSENSUS=; SKIPDUP=-skip_duplicate_marking; fi
        I=0; BAMS=
        for B in $(inputs.input_bams.map((input) => `'${input.path}'`).join(" ")); do
          I=`expr $I + 1`; ln -s "$B" lane_$I.bam; samtools index -@ $THREADS lane_$I.bam
          if [ -z "$BAMS" ]; then BAMS=lane_$I.bam; else BAMS=$BAMS,lane_$I.bam; fi
        done
        mkdir -p redux_$SID
        redux -Xmx$XMX -sample $SID -input_bam $BAMS -ref_genome genome.fa -ref_genome_version $(inputs.genome_version) \
          -ref_genome_msi_file $R/dna/variants/msi_jitter_sites.38.tsv.gz -unmap_regions $R/common/unmap_regions.38.tsv \
          -bamtool `which samtools` -sequencing_type $UPPER_PLATFORM -bqr_write_plot $CONSENSUS $SKIPDUP \
          -threads $THREADS -output_bam redux_$SID/$SID.redux.bam -output_dir redux_$SID/
        cp redux_$SID/$SID.redux.bam redux.bam
        cp redux_$SID/$SID.redux.bam.bai redux.bam.bai
        cp redux_$SID/$SID.redux.duplicate_freq.tsv duplicate_freq.tsv
        mkdir redux_tsvs && cp redux_$SID/*.tsv* redux_tsvs/ && tar -cf redux_dir.tar redux_tsvs
      outputs:
      - name: redux_bam

class: GalaxyUserTool
id: oncoanalyser_esvee
version: 2.0.1
name: hmftools ESVEE (structural variants)
description: Call somatic and germline structural variants for a tumor/normal pair with hmftools ESVEE
license: GPL-3.0-only
container: quay.io/biocontainers/hmftools-esvee:2.0.1--hdfd78af_0
requirements:
- type: resource
  cores_min: 8
  ram_min: 32768
inputs:
- name: tumor_bam
  type: data
  format:
  - bam
  label: Tumor BAM (REDUX)
- name: tumor_bai
  type: data
  format:
  - data
  label: Tumor BAM index (.bai)
- name: normal_bam
  type: data
  format:
  - bam
  label: Normal BAM (REDUX)
- name: normal_bai
  type: data
  format:
  - data
  label: Normal BAM index (.bai)
- name: tumor_id
  type: text
  label: Tumor sample name
  help: Must match the BAM read-group SM.
- name: normal_id
  type: text
  label: Normal sample name
  help: Must match the BAM read-group SM.
- name: genome_fasta
  type: data
  format:
  - fasta
  label: Reference genome FASTA
- name: genome_fai
  type: data
  format:
  - fai
  label: Reference FASTA index (.fai)
- name: genome_dict
  type: data
  format:
  - txt
  - data
  label: Reference sequence dictionary (.dict)
- name: genome_img
  type: data
  format:
  - data
  label: BWA index image (.img)
- name: hmf_resources
  type: data
  format:
  - tar.gz
  - tar
  - data
  label: HMF pipeline resources archive
  help: hmf_pipeline_resources.38_v3.0.0--8.tar.gz (data.oncoanalyser.com); members are extracted by relative path.
- name: genome_version
  type: select
  label: Reference genome version
  options:
  - value: '38'
    label: '38'
    selected: true
- name: sequencing_platform
  type: select
  label: Sequencing platform
  options:
  - value: illumina
    label: illumina
    selected: true
  - value: sbx
    label: sbx
  - value: ultima
    label: ultima
shell_command: "set -e\nTHREADS=$GALAXY_SLOTS; [ -n \"$THREADS\" ] || THREADS=1\nMEM=$GALAXY_MEMORY_MB; [ -n \"$MEM\" ] || MEM=16384\nXMX=`expr $MEM \\* 95 / 100`m\nUPPER_PLATFORM=`echo '$(inputs.sequencing_platform)'\
  \ | tr a-z A-Z`\nB='$(inputs.hmf_resources.path)'\ntar -tzf \"$B\" > hmf_members.txt\nTOP=`head -n 1 hmf_members.txt | cut -d/ -f1`\ngrep -E -e \"^$TOP/dna/sv/known_fusions.38.bedpe\" -e \"^$TOP/dna/sv/sgl_pon\"\
  \ -e \"^$TOP/dna/sv/sv_pon\" -e \"^$TOP/dna/sv/repeat_mask_data.38.fa.gz\" -e \"^$TOP/common/unmap_regions.38.tsv\" hmf_members.txt > hmf_wanted.txt\nsed -n 's#/[^/]*$##p' hmf_wanted.txt | sort -u | xargs\
  \ mkdir -p\ntar -xzf \"$B\" -T hmf_wanted.txt\nR=$TOP\nln -s '$(inputs.genome_fasta.path)' genome.fa\nln -s '$(inputs.genome_fai.path)' genome.fa.fai\nln -s '$(inputs.genome_dict.path)' genome.dict\n\
  ln -s '$(inputs.genome_img.path)' genome.fa.img\nln -s '$(inputs.tumor_bam.path)' '$(inputs.tumor_id).redux.bam'\nln -s '$(inputs.tumor_bai.path)' '$(inputs.tumor_id).redux.bam.bai'\nln -s '$(inputs.normal_bam.path)'\
  \ '$(inputs.normal_id).redux.bam'\nln -s '$(inputs.normal_bai.path)' '$(inputs.normal_id).redux.bam.bai'\ncase '$(inputs.sequencing_platform)' in\n  sbx) PSGL=$R/dna/sv/sgl_pon_hmf_ill_sbx.38.bed.gz;\
  \ PSV=$R/dna/sv/sv_pon_hmf_ill_sbx.38.bedpe.gz;;\n  *) PSGL=$R/dna/sv/sgl_pon.38.bed.gz; PSV=$R/dna/sv/sv_pon.38.bedpe.gz;;\nesac\nmkdir -p esvee\nesvee -Xmx$XMX -tumor '$(inputs.tumor_id)' -tumor_bam\
  \ '$(inputs.tumor_id).redux.bam' \\\n  -reference '$(inputs.normal_id)' -reference_bam '$(inputs.normal_id).redux.bam' -esvee_prep_dir esvee/ \\\n  -ref_genome genome.fa -ref_genome_version $(inputs.genome_version)\
  \ -known_hotspot_file $R/dna/sv/known_fusions.38.bedpe \\\n  -pon_sgl_file $PSGL -pon_sv_file $PSV -repeat_mask_file $R/dna/sv/repeat_mask_data.38.fa.gz \\\n  -unmap_regions $R/common/unmap_regions.38.tsv\
  \ -sequencing_type $UPPER_PLATFORM -bamtool `which sambamba` \\\n  -write_types 'PREP_JUNCTION;PREP_BAM;FRAGMENT_LENGTH_DIST;JUNC_ASSEMBLY;PHASED_ASSEMBLY;ALIGNMENT;BREAKEND;VCF' \\\n  -threads $THREADS\
  \ -output_dir esvee/\ncp 'esvee/$(inputs.tumor_id).esvee.somatic.vcf.gz' esvee_somatic.vcf.gz\nrm -f esvee/*.prep.bam esvee/*.prep.bam.bai\ntar -cf esvee_dir.tar esvee\n"
outputs:
- name: esvee_dir
  type: data
  format: tar
  from_work_dir: esvee_dir.tar
  label: ESVEE output directory (prep BAMs removed)
- name: somatic_vcf
  type: data
  format: vcf_bgzip
  from_work_dir: esvee_somatic.vcf.gz
  label: ESVEE somatic SV VCF
help:
  format: markdown
  content: 'Port of nf-core/oncoanalyser 3.0.0 `ESVEE (modules/local/esvee)` for Galaxy (core DNA spine translation).

    Uses the module''s own biocontainer. HMF resources come from one archive input; members are

    extracted by their `conf/hmf_data.config` relative paths. GRCh38 takes no decoy genome (hmf_data_paths[''38''].decoy_sequences_image = []). Prep BAMs are dropped from the archive; PURPLE does not read
    them.

    '

class: GalaxyUserTool
id: oncoanalyser_amber
version: 4.3.0
name: hmftools AMBER (B-allele frequency)
description: B-allele frequencies at heterozygous sites and contamination for a tumor/normal pair with hmftools AMBER
license: GPL-3.0-only
container: quay.io/biocontainers/hmftools-amber:4.3--hdfd78af_0
requirements:
- type: resource
  cores_min: 4
  ram_min: 16384
inputs:
- name: tumor_bam
  type: data
  format:
  - bam
  label: Tumor BAM (REDUX)
- name: tumor_bai
  type: data
  format:
  - data
  label: Tumor BAM index (.bai)
- name: normal_bam
  type: data
  format:
  - bam
  label: Normal BAM (REDUX)
- name: normal_bai
  type: data
  format:
  - data
  label: Normal BAM index (.bai)
- name: tumor_id
  type: text
  label: Tumor sample name
  help: Must match the BAM read-group SM.
- name: normal_id
  type: text
  label: Normal sample name
  help: Must match the BAM read-group SM.
- name: genome_fasta
  type: data
  format:
  - fasta
  label: Reference genome FASTA
- name: genome_fai
  type: data
  format:
  - fai
  label: Reference FASTA index (.fai)
- name: hmf_resources
  type: data
  format:
  - tar.gz
  - tar
  - data
  label: HMF pipeline resources archive
  help: hmf_pipeline_resources.38_v3.0.0--8.tar.gz (data.oncoanalyser.com); members are extracted by relative path.
- name: genome_version
  type: select
  label: Reference genome version
  options:
  - value: '38'
    label: '38'
    selected: true
- name: sequencing_platform
  type: select
  label: Sequencing platform
  options:
  - value: illumina
    label: illumina
    selected: true
  - value: sbx
    label: sbx
  - value: ultima
    label: ultima
shell_command: "set -e\nTHREADS=$GALAXY_SLOTS; [ -n \"$THREADS\" ] || THREADS=1\nMEM=$GALAXY_MEMORY_MB; [ -n \"$MEM\" ] || MEM=16384\nXMX=`expr $MEM \\* 85 / 100`m\nUPPER_PLATFORM=`echo '$(inputs.sequencing_platform)'\
  \ | tr a-z A-Z`\nB='$(inputs.hmf_resources.path)'\ntar -tzf \"$B\" > hmf_members.txt\nTOP=`head -n 1 hmf_members.txt | cut -d/ -f1`\ngrep -E -e \"^$TOP/dna/copy_number/AmberGermlineSites.38.tsv.gz\" hmf_members.txt\
  \ > hmf_wanted.txt\nsed -n 's#/[^/]*$##p' hmf_wanted.txt | sort -u | xargs mkdir -p\ntar -xzf \"$B\" -T hmf_wanted.txt\nR=$TOP\nln -s '$(inputs.genome_fasta.path)' genome.fa\nln -s '$(inputs.genome_fai.path)'\
  \ genome.fa.fai\nln -s '$(inputs.tumor_bam.path)' '$(inputs.tumor_id).redux.bam'\nln -s '$(inputs.tumor_bai.path)' '$(inputs.tumor_id).redux.bam.bai'\nln -s '$(inputs.normal_bam.path)' '$(inputs.normal_id).redux.bam'\n\
  ln -s '$(inputs.normal_bai.path)' '$(inputs.normal_id).redux.bam.bai'\namber -Xmx$XMX -tumor '$(inputs.tumor_id)' -tumor_bam '$(inputs.tumor_id).redux.bam' \\\n  -reference '$(inputs.normal_id)' -reference_bam\
  \ '$(inputs.normal_id).redux.bam' \\\n  -ref_genome genome.fa -ref_genome_version $(inputs.genome_version) -sequencing_type $UPPER_PLATFORM \\\n  -loci $R/dna/copy_number/AmberGermlineSites.38.tsv.gz\
  \ -threads $THREADS -output_dir amber/\ncp 'amber/$(inputs.tumor_id).amber.qc' amber_qc.txt\ntar -cf amber_dir.tar amber\n"
outputs:
- name: amber_dir
  type: data
  format: tar
  from_work_dir: amber_dir.tar
  label: AMBER output directory
- name: amber_qc
  type: data
  format: txt
  from_work_dir: amber_qc.txt
  label: AMBER QC
help:
  format: markdown
  content: "Port of nf-core/oncoanalyser 3.0.0 `AMBER (modules/local/amber)` for Galaxy (core DNA spine translation).\nUses the module's own biocontainer. HMF resources come from one archive input; members\
    \ are\nextracted by their `conf/hmf_data.config` relative paths. \n"

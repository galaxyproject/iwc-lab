discoveries:
- id: reference-total-size-59gb
  raised_by: nextflow-summary-to-galaxy-reference-data
  evidence: content-length of GRCh38_hmf/26.1 assets and hmf_pipeline_resources.38_v3.0.0--8.tar.gz on data.oncoanalyser.com, 2026-11-11
  impact: in-tool bwa-mem2/STAR rebuild and test upload are infeasible at full scale on test.galaxyproject.org
- id: iwc-history-fasta-in-tool-index
  raised_by: compare-against-iwc-exemplar
  evidence: 'variant-calling/ploidy-aware-genotype-calling BWA-MEM mapping uses reference_source_selector: history, index_a: auto'
  impact: supports not exposing a bwa-mem2 index input (bwamem2-index-input-not-exposed)
decisions:
- id: hmf-resources-as-single-archive-input
  decided_by: nextflow-summary-to-galaxy-reference-data
  decision: expose the HMF resource bundle as one workflow input hmf_pipeline_resources (tar/data) passed to each hmftools step
  rationale: ~55 members including subdirectories; per-file inputs would make an unusable workflow surface; mirrors ref_data_hmf_data_path semantics
  evidence:
  - hmf-bundle-member-extraction-unverified
- id: fai-dict-workflow-tier-build
  decided_by: nextflow-summary-to-galaxy-reference-data
  decision: build fai and dict once as workflow-tier steps when not supplied, rather than in each consuming tool
  rationale: more than 3 consumers (mapping note deviation threshold)
- id: core-dna-spine-scope
  decided_by: nextflow-summary-to-galaxy-interface
  decision: 'Galaxy workflow covers WGTS core DNA spine: bwa-mem2 -> REDUX -> AMBER, COBALT, SAGE somatic+germline, ESVEE -> PAVE somatic+germline -> PURPLE -> LINX somatic+germline'
  rationale: user choice 2026-11-11 after the tool-availability check
  basis: user
- id: one-subject-parallel-tumor-normal-inputs
  decided_by: nextflow-summary-to-galaxy-interface
  decision: inputs tumor_dna_reads and normal_dna_reads as list:paired (lane elements) plus tumor_sample_id/normal_sample_id strings; one subject per invocation
  rationale: long-format samplesheet regrouped by group_id with heterogeneous tumor/normal roles; sample_sheet must be outermost and cannot pair rows
  evidence:
  - multi-group-donor-tumor-only-not-carried
- id: test-run-not-executed
  decided_by: nextflow-summary-to-galaxy-interface
  decision: design test plan and fixtures; do not execute the Galaxy test run on test.galaxyproject.org
  rationale: user choice 2026-11-11; ~59 GB references vs 10.7 GB quota
  basis: user
  evidence:
  - reference-data-not-test-scale
- id: twin-tumor-normal-branches
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: tumor and normal alignment and REDUX run as twin parallel chains; lanes are mapped over then reduced by REDUX
  rationale: each chain needs its own sample-name parameter, and downstream hmftools take tumor/normal in named slots
- id: always-build-fai-dict-pick-value
  decided_by: nextflow-summary-to-galaxy-template
  decision: build_fai and build_dict run unconditionally; pick_fai/pick_dict (iuc pick_value 0.2.0, installed on target) take the first non-null of supplied vs built
  rationale: 'avoids a when: guard on a null optional input; faidx/dict cost is small next to alignment'
- id: no-comment-frames
  decided_by: nextflow-summary-to-galaxy-template
  decision: 'emit no comments: frames in the draft'
  rationale: a prior run in this workspace found geometry-less comment frames rejected on Galaxy import; frames are optional
- id: hmftools-steps-as-embedded-udts
  decided_by: advance-galaxy-draft-step
  decision: 12 hmftools steps embed 11 GalaxyUserTool definitions (REDUX shared by tumor/normal twins) under run:, using the source modules biocontainers; build_fai/build_dict embed samtools 1.21 UDTs
  rationale: no Tool Shed or target wrappers for hmftools; no faidx/CreateSequenceDictionary wrapper on target; UDT registration verified on target

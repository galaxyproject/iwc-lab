plan_version: '1'
source:
  kind: nextflow
  name: nf-core/oncoanalyser
  derived_from: test-evidence
  notes: 'Translated from tests/profile_test.nf.test::-profile test (test_selection: selected; primary, real execution, tag cicd.large). Snapshot captures stable_path and stable_content (md5 of files not
    in tests/.nftignore). The stub test tests/default.nf.test::-profile test_stub is bootstrap-only and not translated. Only the core DNA spine is in the Galaxy workflow.'
workflow:

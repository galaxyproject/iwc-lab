unresolved:
- kind: fixture
  description: 'References are full-scale (~59 GB: FASTA 3.2 GB, BWA img 5.6 GB, HMF bundle 5.9 GB, plus an in-tool bwa-mem2 index build needing ~64 GB RAM); exceed the 10.7 GB quota on test.galaxyproject.org.'
  blocking: true
  suggested_resolution: Run on a server with references preloaded or larger quota; the user chose not to execute the test run.
- kind: assertion
  description: Snapshot md5 parity depends on identical alignments (Galaxy bwa-mem2 2.3 vs source 2.2.1 container; samtools vs sambamba sort; read-group ID library_1_001 vs library_1.001) and identical
    bgzip/VCF headers.
  blocking: false
  suggested_resolution: Treat md5 checks as low/medium-confidence; on mismatch keep the structural has_text/has_n_lines/ftype checks and inspect value-level differences.
- kind: other
  description: hmftools user-defined tool commands have not run on the target (open-requirements udt-runtime-assumptions-unverified).
  blocking: false
  suggested_resolution: Smoke-run one UDT on real data before the full test.
omissions:
- target: RNA, LILAC, VIRUSBreakend, CUPPA, CHORD, SIGS, PEACH, Neo, TEAL, CIDER, Qsee, bam-tools, SAGE append/visualiser, LINX plots, ORANGE, MultiQC snapshot entries
  reason: stages not in the Galaxy workflow (core DNA spine scope decision; ledger *-not-built drops)
  category: out-of-scope
- target: logs/* and pipeline_info/* paths in stable_path
  reason: Nextflow runtime artifacts with no Galaxy equivalent
  category: out-of-scope
- target: redux .bam/.bai, esvee raw/somatic VCFs, purple .sv.vcf.gz md5
  reason: listed in tests/.nftignore upstream (non-deterministic); Galaxy test checks datatype only
  category: nondeterministic
- target: task-count assertion (46 tasks, 42 with cached refs)
  reason: Nextflow task accounting; the Galaxy job graph differs
  category: out-of-scope
warnings:
- code: test-not-executable-on-target
  message: 'User decision: test plan designed but not run (reference size vs quota).'
  path: test_cases[0]

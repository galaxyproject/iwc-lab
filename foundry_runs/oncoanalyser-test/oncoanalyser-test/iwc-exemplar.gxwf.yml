class: GalaxyWorkflow
label: 'IWC excerpt: variant-calling/ploidy-aware-genotype-calling (mapping + dedup subgraph)'
doc: Relevant subgraph of IWC variant-calling/ploidy-aware-genotype-calling/genotype-variant-calling-wgs-pe.ga (corpus ed48e2f). fastp input replaced by the raw collection
  for the excerpt.
inputs:
- id: Paired Collection
  type: collection
  collection_type: list:paired
  optional: false
  format:
  - fastqsanger
  - fastqsanger.gz
  fields: null
  column_definitions: null
  doc: Illumina reads with fastqsanger encoding
- id: Reference Genome fasta
  type: data
  optional: false
  doc: Reference FASTA file to use as reference for variant calling
outputs: []
steps:
- id: BWA-MEM mapping
  label: BWA-MEM mapping
  doc: Mapping reads with reference sequence
  tool_id: toolshed.g2.bx.psu.edu/repos/devteam/bwa/bwa_mem/0.7.19+galaxy1
  tool_version: 0.7.19+galaxy1
  tool_shed_repository:
    changeset_revision: c598cbb8b019
    name: bwa
    owner: devteam
    tool_shed: toolshed.g2.bx.psu.edu
  in:
  - id: fastq_input|fastq_input1
    source: Paired Collection
  - id: reference_source|ref_file
    source: Reference Genome fasta
  out: []
  tool_state:
    analysis_type:
      analysis_type_selector: illumina
      __current_case__: 0
    fastq_input:
      fastq_input_selector: paired_collection
      __current_case__: 2
      fastq_input1:
        __class__: ConnectedValue
      iset_stats: null
    output_sort: coordinate
    reference_source:
      reference_source_selector: history
      __current_case__: 1
      ref_file:
        __class__: ConnectedValue
      index_a: auto
    rg:
      rg_selector: do_not_set
      __current_case__: 3
- id: Samtools view
  label: Samtools view
  doc: 'Retains alignments if read is paired and mapped in proper orientation '
  tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
  tool_version: 1.22+galaxy2
  tool_shed_repository:
    changeset_revision: 5cf9fcc93508
    name: samtools_view
    owner: iuc
    tool_shed: toolshed.g2.bx.psu.edu
  in:
  - id: input
    source: BWA-MEM mapping/bam_output
  out:
  - id: outputsam
    rename: Mapped read pairs (filtered bwa-mem result)
  tool_state:
    addref_cond:
      addref_select: 'no'
      __current_case__: 0
    input:
      __class__: ConnectedValue
    mode:
      outtype: selected_reads
      __current_case__: 1
      filter_config:
        cond_region:
          select_region: 'no'
          __current_case__: 0
        cond_rg:
          select_rg: 'no'
          __current_case__: 0
        cond_expr:
          select_expr: 'no'
          __current_case__: 0
        quality: null
        library: null
        cigarcons: null
        inclusive_filter:
        - '1'
        - '2'
        exclusive_filter: null
        exclusive_filter_all: null
        tag: null
        qname_file:
          __class__: RuntimeValue
      subsample_config:
        subsampling_mode:
          select_subsample: fraction
          __current_case__: 0
          factor: '1.0'
          seed: null
      output_options:
        reads_report_type: retained
        __current_case__: 0
        complementary_output: false
        adv_output:
          readtags: []
          collapsecigar: false
        output_format:
          oformat: bam
          __current_case__: 2
- id: Mark Duplicates
  label: Mark Duplicates
  doc: Marks duplicates in the input BAM file
  tool_id: toolshed.g2.bx.psu.edu/repos/devteam/picard/picard_MarkDuplicates/3.1.1.0
  tool_version: 3.1.1.0
  tool_shed_repository:
    changeset_revision: bdd173c2d3e3
    name: picard
    owner: devteam
    tool_shed: toolshed.g2.bx.psu.edu
  in:
  - id: inputFile
    source: Samtools view/outputsam
  out: []
  tool_state:
    assume_sorted: true
    barcode_tag: null
    comments: []
    duplicate_scoring_strategy: SUM_OF_BASE_QUALITIES
    inputFile:
      __class__: ConnectedValue
    optical_duplicate_pixel_distance: '100'
    read_name_regex: ''
    remove_duplicates: true
    validation_stringency: LENIENT

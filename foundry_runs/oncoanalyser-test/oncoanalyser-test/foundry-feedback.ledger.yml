  subject:
    kind: implementation
    label: '@galaxy-foundry/summarize-nextflow CLI (via foundry summarize-nextflow)'
    locator: packages/summarize-nextflow
  kind: defect
  severity: major
  what: tests/default.nf.test declares file-level `profile "test_stub"` and `options "-stub"`, but the candidate was emitted with effective_profiles [test], execution_mode real, scope primary, and params_delta/inputs
    taken from conf/test.config.
  expected: Apply file/test-level profile directives over the nf-test.config root profile (replace unless +name) and set execution_mode stub when options contain -stub, classifying such candidates bootstrap-only.
  evidence: 'nf-core/oncoanalyser 3.0.0: both candidates resolved to profile test, so test_selection fell to needs-scope-choice; corrected by hand to select tests/profile_test.nf.test.'
  status: open
  issue: null

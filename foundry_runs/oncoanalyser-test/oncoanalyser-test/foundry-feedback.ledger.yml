    locator: packages/summarize-nextflow
  kind: defect
  severity: major
  what: The primary workflow was NFCORE_ONCOANALYSER, a run-mode dispatcher that only calls named workflows (WGTS, TARGETED, ...) and no processes; workflow.edges were 13 params/inputs -> workflow edges.
  expected: Apply the mold selection rule (named workflow invoking the most pipeline processes, counting through subworkflows) so WGTS (workflows/wgts.nf, 33 subworkflow calls) is selected and its edges
    are extracted.
  evidence: Raw summary workflow.name NFCORE_ONCOANALYSER; WGTS present only as a subworkflows[] entry. Edges rebuilt by hand at subworkflow granularity.
  status: open
  issue: null

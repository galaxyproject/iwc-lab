  kind: defect
  severity: major
  what: With a local clone, source.url was emitted as https://example.invalid/unknown.git and version as unknown, with no warning. Passing --pin 3.0.0 with a local path made the CLI re-clone through Windows
    git, which failed with "detected dubious ownership" on the \\wsl.localhost path.
  expected: Resolve remote/tag/HEAD from the local clone (or warn per failed lookup instead of using placeholders); with a local path, check out or verify --pin in place rather than re-cloning.
  evidence: Windows-hosted npm CLI run against a WSL checkout of nf-core/oncoanalyser at tag 3.0.0; the first run with --pin exited during the clone, the second without --pin produced placeholder provenance.
  status: open

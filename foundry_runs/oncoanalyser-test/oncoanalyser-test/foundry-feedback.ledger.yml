- id: summarize-nextflow-mold-silent-on-multi-mode-runtime-stages
  raised_by: summarize-nextflow
  observed_in:
    mold: summarize-nextflow
    path: content/molds/summarize-nextflow/index.md
    revision: 18
    content_hash: fb19fff9162cc36fae916a456cfbbe31a33c4565063a522846c48222d02f7c37
    foundry_head: d1b4cabede5bc91a5ab8603d5c2d589ad7f0d100
  subject:
    kind: mold
    label: summarize-nextflow
    locator: content/molds/summarize-nextflow/index.md
    content_hash: fb19fff9162cc36fae916a456cfbbe31a33c4565063a522846c48222d02f7c37
  kind: gap
  severity: major
  what: The mold assumes one primary workflow whose conditionals guard on params. oncoanalyser has a params.mode dispatcher choosing among five named workflows, and stage enablement (run_config.stages.*)
    is computed at runtime in lib/ Groovy from samplesheet content; the schema has no place for alternate run modes or derived stage guards.
  expected: Say how to summarize multi-mode pipelines (record each mode workflow, or pick one with a warning) and how to record guards that derive from samplesheet content rather than params.
  evidence: Handled by modeling WGTS as primary and recording the other modes and the runtime stage derivation in warnings[].
  status: open
  issue: null

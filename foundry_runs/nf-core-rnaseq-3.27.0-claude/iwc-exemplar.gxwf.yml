class: GalaxyWorkflow
label: 'RNA-Seq Analysis: Paired-End Read Processing and Quantification (relevant subgraph)'
doc: 'Bounded subgraph extracted per compare-against-iwc-exemplar: paired FASTQ collection -> fastp ->
  rna_star (cached built-in genome) -> featurecounts (strandedness via map_param_value, gated by boolean
  when) -> counts subworkflow (pick_value) -> MultiQC -> pick_value outputs. Excludes coverage bigwig
  subgraphs, More QC, StringTie/Cufflinks FPKM, and the extra-QC MultiQC branch (pick_from_1 pruned from
  the pick_value steps).'
inputs:
- id: Collection paired FASTQ files
  type: collection
  collection_type: list:paired
  optional: false
  fields: null
  column_definitions: null
  doc: Should be a list of paired-end RNA-seq fastqs
- id: Forward adapter
  type: string
  optional: true
  doc: 'This is optional. Fastp will use overlapping. If you want to specify, for Nextera use: CTGTCTCTTATACACATCTCCGAGCCCACGAGAC,
    for TruSeq: GATCGGAAGAGCACACGTCTGAACTCCAGTCAC or AGATCGGAAGAGCACACGTCTGAACTCCAGTCAC'
- id: Reverse adapter
  type: string
  optional: true
  doc: 'This is optional. Fastp will use overlapping. If you want to specify, for Nextera use: CTGTCTCTTATACACATCTGACGCTGCCGACGA,
    for TruSeq: GATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT or AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT'
- id: Reference genome
  type: string
  optional: false
  restrictOnConnections: true
  doc: Select the reference genome
- id: GTF file of annotation
  type: data
  optional: false
  doc: GTF compatible with the reference genome. Mind the UCSC/Ensembl differences in chromosome naming.
- id: Strandedness
  type: string
  optional: false
  restrictions:
  - stranded - forward
  - stranded - reverse
  - unstranded
  doc: For stranded RNA, reverse means that the read is complementary to the coding sequence, forward
    means that the read is in the same orientation as the coding sequence
- id: Use featureCounts for generating count tables
  type: boolean
  optional: false
  doc: Use featureCounts tool instead of RNA STAR?
outputs:
- id: Mapped Reads
  outputSource: 'STAR: map and count and coverage splitted/mapped_reads'
- id: Counts Table
  outputSource: _unlabeled_step_25/Counts Table
- id: MultiQC HTML report
  outputSource: MultiQC HTML report/data_param
- id: MultiQC stats
  outputSource: MultiQC stats/data_param
steps:
- id: _unlabeled_step_11
  tool_id: __FLATTEN__
  tool_version: 1.0.0

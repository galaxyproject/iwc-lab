  - id: t12-udt-collection-inputs-need-data-collection-type-not-multiple-data
    phase: 12
    timestamp: 03:32:04
    subject:
      kind: note
      label: galaxy-user-tool-authoring (input types section)
      locator: package://author-galaxy-tool-wrapper#references/notes/galaxy-user-tool-authoring.md
    kind: gap
    severity: major
    what: "The authoring note's input-types section documents `data` with `multiple: true` but never mentions\
      \ `type: data_collection` for collection inputs. Feeding a list collection into a `multiple: true`\
      \ data input does NOT expand it: the job receives the HDCA dict and `runtimeify`'s adapt_dict (tool_util/parameters/convert.py:832-862)\
      \ fails with `pydantic ValidationError for DataRequestInternalHda \u2014 Input should be 'hda' [input_value='hdca']`.\
      \ The correct declaration is `type: data_collection, collection_type: list`, whose runtime shape\
      \ exposes `inputs.NAME.elements[]` (each element a file object with path/basename/ element_identifier,\
      \ runtime.py:314-334); the script then iterates `inputs.NAME.elements.map(...)` instead of `inputs.NAME.map(...)`.\
      \ Also: a data output/collection input with `format` works, but the elements accessor is only documented\
      \ for paired collections in the schema example, not for plain lists. Costed one full planemo run\
      \ (attempt 7, job 18)."
    expected: 'The input-types section should add a `data_collection` bullet with the `elements[]` accessor
      idiom and an explicit warning that `data multiple: true` + a collection input fails at job-preparation
      time (post-validation, expensive to discover).'
    evidence: planemo-test-7.log (job 18 pydantic traceback); fix verified green statically, runtime verdict
      in attempt 8.
    status: open
    issue: null
  - id: t12-multiqc-fastqc-entry-requires-raw-data-not-html
    phase: 12
    timestamp: 03:32:04
    subject:
      kind: mold
      label: implement-galaxy-tool-step (multiqc wiring guidance)

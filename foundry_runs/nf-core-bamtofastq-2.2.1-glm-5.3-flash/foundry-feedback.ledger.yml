  - id: t12-gxwf-label-wins-over-id
    phase: 12
    timestamp: 02:07:19
    subject:
      kind: mold
      label: advance-galaxy-draft-step
      locator: package://advance-galaxy-draft-step#references/notes/galaxy-workflow-draft-format.md
    kind: friction
    severity: major
    what: "gxformat2's planemo-side conversion (_register_labels, gxformat2/normalized/_conversion.py:1129)\
      \ uses `label = step.label or step.id` \u2014 a step's human-readable label SHADOWS its map key\
      \ id, so any connection/outputSource/comment contains_steps referencing the id fails at import with\
      \ `ValueError: invalid literal for int() with base 10` when the id is non-numeric. gxwf draft-validate\
      \ and gxwf validate both pass green on the same file, so the failure first surfaces inside planemo\
      \ at workflow-import time, after the run has already booted Galaxy. Costed two full planemo launches\
      \ (import crash before any structured output, per the architecture note)."
    expected: "Either gxwf validate should reject id/label shadowing (a step with both a label and references\
      \ to its id), or the draft-format note should state that once steps carry labels, ALL references\
      \ (connections, outputSources, comment contains_steps) must use labels \u2014 and that the simplest\
      \ safe convention is to not emit top-level labels at all."
    evidence: planemo-test-1.log (step-id refs vs labels) and planemo-test-2.log (comment contains_steps
      titles); both crashed at import; removing the 47 label fields and rewriting contains_steps to ids
      made both imports succeed.
    status: open
    issue: null
  - id: t12-merge-collection-tool-state-needs-repeat-instance-array
    phase: 12
    timestamp: 03:23:36
    subject:
      kind: note
      label: galaxy-workflow-draft-format / planemo-workflow-test-architecture
      locator: package://advance-galaxy-draft-step#references/notes/galaxy-workflow-draft-format.md
    kind: gap
    severity: major
    what: "gxformat2 connections into repeat parameters (e.g. `in: {inputs_0|input: ..., inputs_1|input:\
      \ ...}` on __MERGE_COLLECTION__ or MultiQC) do NOT populate the tool's repeat instances at invocation\
      \ time. `augment_tool_state_for_input_connections` (lib/galaxy/workflow/modules.py:3077) \u2014\
      \ the code that grows repeat arrays from connections \u2014 only runs via `recover_state` with `fill_defaults=True`\
      \ (the from_dict import path), not the `from_workflow_step` invocation path, and the format2 converter\
      \ does not synthesize repeat instances into tool_state either. Result: the step's collection output\
      \ fails with \\\"Output collection 'output' has type_source 'inputs_0|input', which does not name\
      \ a collection input\\\" (tools/actions/__init__.py:1233) because `collect_input_dataset_collections`\
      \ never visits the un-instantiated repeat. IWC exemplar tool_state (metagenomic-assembly.ga) carries\
      \ the full repeat array with `__class__: ConnectedValue` placeholders \u2014 that is the required\
      \ authoring idiom, and it is nowhere in the packaged notes. Costed one full planemo run (attempt\
      \ 6)."
    expected: 'The draft-format note (and/or the __MERGE_COLLECTION__ wiring guidance) should state that
      any step with repeat connections MUST carry a matching `inputs:` array in its state (`[{__index__:
      0, input: {__class__: ConnectedValue}}, ...]`), matching the number of connected instances. The
      multiqc corpus step is a good in-bundle example.'
    evidence: planemo-test-6.log (step 15 merge_fastqc_pre); fix verified green on attempt 7.
    status: open
    issue: null

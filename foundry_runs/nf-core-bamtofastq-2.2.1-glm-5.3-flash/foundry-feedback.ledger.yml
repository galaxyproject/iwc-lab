  - id: t7-output-rename-consumer-invisible
    phase: 7
    timestamp: 01:53:49
    subject:
      kind: mold
      label: advance-galaxy-draft-step
      locator: package://advance-galaxy-draft-step#references/notes/galaxy-workflow-draft-format.md
    kind: friction
    severity: minor
    what: "gxformat2 step output `rename:` is consumer-invisible \u2014 after a step declares `out: [{id:\
      \ X, rename: Y}]`, every downstream connection must still reference `step/X`, not `step/Y`; draft-validate\
      \ rejects `step/Y` as an unknown port. Hit 5+ times this run (merge_mered_reads/merged_reads_flat,\
      \ merge_fastqutils/fastqutils_reports, merge_reads_post_qc/reads_post_qc, fastqutils arms); the\
      \ implement-galaxy-tool-step and draft-format docs never warn about it, so each occurrence cost\
      \ a validate-fix-revalidate cycle."
    expected: The draft-format note (or implement-galaxy-tool-step procedure) should state that renames
      are display-only and consumer references use the original output id.
    evidence: Repeated draft-validate unknown-port errors resolved each time by switching the consumer
      ref back to the original id while keeping the rename in `out:`.
    status: open
    issue: null

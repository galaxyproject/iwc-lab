    expected: "Document the canonical idiom \u2014 add_column_from_sample_sheet_index per needed column\
      \ BEFORE any column-reading rule, then remove_columns to restore the intended shape \u2014 for sample_sheet-filtered\
      \ __APPLY_RULES__ steps."
    evidence: planemo-test-4.log (step 7 filter_bam_rows IndexError); fix verified in attempts 5-6.
    status: open
    issue: null
  - id: t12-when-expression-must-produce-bool-not-string
    phase: 12
    timestamp: 03:23:36
    subject:
      kind: note
      label: when-expression authoring on gated steps
      locator: package://nextflow-summary-to-galaxy-template#references/notes/galaxy-workflow-draft-format.md
    kind: gap
    severity: major
    what: "A step `when:` gate wired as a bare pass-through of a string input (`when: $(inputs.when)`\
      \ where `when` is a string workflow input) fails at invocation with `FailWorkflowEvaluation(when_not_boolean)`\
      \ \u2014 \\\"Type is: str\\\" \u2014 because `evaluate_value_from_expressions` (lib/galaxy/workflow/modules.py:480-517)\
      \ requires isinstance(when_value, bool) after do_eval. The ivar corpus idiom of feeding a string-to-boolean\
      \ helper is one option, but the lighter canonical fix is a boolean-producing expression directly\
      \ on the string input, e.g. `when: $(inputs.when != \\\"\\\")`. The packaged notes do not record\
      \ either the bool requirement or the `!= \\\"\\\"` idiom. Costed one full planemo run (attempt 5)."
    expected: Document that when-expression results must be bool (isinstance check at modules.py:513-517),
      with `$(inputs.x != \"\")` as the standard optional-string gate and `== false` for boolean gates.
    evidence: planemo-test-5.log (when_not_boolean at samtools_chr_view); fix verified attempt 6.
    status: open
    issue: null

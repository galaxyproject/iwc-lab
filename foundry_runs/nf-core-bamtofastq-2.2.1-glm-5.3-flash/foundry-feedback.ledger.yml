  - id: t13-udt-configfile-all-dollar-parens-are-js-expressions
    phase: 12
    timestamp: 04:09:57
    subject:
      kind: note
      label: galaxy-user-tool-authoring (configfiles section, escape rule)
      locator: package://author-galaxy-tool-wrapper#references/notes/galaxy-user-tool-authoring.md
    kind: gap
    severity: major
    what: "The configfiles escape guidance says \\\"Escape shell variables that are not Galaxy expressions:\
      \ `\\\\$(date)`\\\" \u2014 a single example that reads as covering only `$(date)`-style tokens.\
      \ In fact EVERY `$(...)` in a configfile is interpolated as a CWL/JS expression by cwl_utils (via\
      \ js_engine), so ALL shell command substitutions must be escaped: `SAMTOOLS= \\\\$(command -v samtools)`,\
      \ `head_lines=\\\\$(\\\"$SAMTOOLS\\\" view ... | wc -l)`, pipeline substitutions, etc. Bare shell\
      \ substitutions fail at job preparation (config-file templating stage) with `SyntaxError: Unexpected\
      \ identifier 'samtools'` \u2014 a JS parse error whose message names a random token from the substituted\
      \ shell text and does not mention config files or expressions, making it hard to map back to the\
      \ authoring rule. Costed one full planemo run (attempt 9, job 18)."
    expected: "The configfiles section should state the rule as \\\"every `$(...)` is a CWL/JS expression\
      \ \u2014 escape every shell command substitution as `\\\\$(...)`\\\", list the common shell patterns\
      \ (command substitution into a variable, substitution in an assignment, pipelines), and note the\
      \ diagnostic signature (SyntaxError naming an arbitrary identifier or token, raised while building\
      \ config files). Attempts 10 and 12 pinned the exact semantics via probes of cwl_utils.expression.interpolate\
      \ (escaping_behavior=2): the backslash is CONSUMED before `(` and `{` \u2014 so only `\\\\$(` and\
      \ `\\\\${` are valid escapes and render as real shell constructs \u2014 but RETAINED before a plain\
      \ identifier, so `\\\\$SAMTOOLS` reaches bash as the literal text `$SAMTOOLS` (\\\"command not found\\\
      \"; \\\"invalid number '$LINES_TO_CHECK'\\\"). The correct rule is therefore: escape ONLY `\\\\\
      $(` and `\\\\${`; bare `$var` references pass interpolation through unchanged and must NEVER carry\
      \ the backslash (my v1.0.4 attempt-10 \\\"escape everything\\\" blanket rule was wrong and costed\
      \ attempt 12)."
    evidence: "planemo-test-9.log (job 18 ToolTemplatingException + SyntaxError at <input>:63); planemo-test-12.log\
      \ (split_pairedness.sh line 16: $SAMTOOLS: command not found); direct probe of cwl_utils.expression.interpolate\
      \ with heredoc'd python confirmed all three behaviors (`\\\\$(`\u2192`$(`, `\\\\${`\u2192`${`, `\\\
      \\$VAR`\u2192`\\\\$VAR`, `$VAR`\u2192`$VAR`). Runtime verdict of the de-escape fix: attempt 13."
    status: open
    issue: null
  - id: t13-udt-interpolated-values-wrap-in-shell-quotes
    phase: 12
    timestamp: 05:12:57
    subject:
      kind: note
      label: galaxy-user-tool-authoring (configfiles section, quoting)
      locator: package://author-galaxy-tool-wrapper#references/notes/galaxy-user-tool-authoring.md
    kind: gap
    severity: major
    what: "Interpolated expressions in a configfile are substituted TEXTUALLY into the shell script, so\
      \ an assignment whose expression produces a value-bearing phrase \u2014 e.g. `REFERENCE_ARG=$(inputs.reference\
      \ ? `--reference '${inputs.reference.path}'` : \\\"\\\")` \u2014 becomes `REFERENCE_ARG=--reference\
      \ '/path/dat'` after templating. Bash then parses the line as the VAR=value command-prefix syntax\
      \ and tries to EXECUTE the first \\\"word\\\" \u2014 the dataset file \u2014 failing with exit 126\
      \ \\\"Permission denied\\\". The fix is to quote the whole expression at the assignment site (`REFERENCE_ARG='$(...)'`)\
      \ so the templated value always lands inside a quoted word. The authoring note documents quoting\
      \ for paths in commands (`.map(...).join(\\\" \\\")`) but never the assignment-with-interpolation\
      \ pattern. Costed one full planemo run (attempt 11, job 18 \u2014 and it was the LAST failing job;\
      \ everything else was green)."
    expected: The configfiles/command section should add an assignment-quoting bullet with this exact
      trap (VAR=$(...) producing multi-word values -> env-prefix misparse -> exit 126 executing a dataset)
      and the quoted-expression fix.
    evidence: planemo-test-11.log (job 18 exit 126 Permission denied at split_pairedness.sh line 5); fix
      verified statically, runtime verdict in attempt 12.
    status: open
    issue: null
  - id: t12-udt-discover-pattern-matches-plain-filename-not-relpath
    phase: 12
    timestamp: 07:04:11
    subject:
      kind: note
      label: galaxy-user-tool-authoring (discover_datasets pattern)
      locator: package://author-galaxy-tool-wrapper#references/notes/galaxy-user-tool-authoring.md
    kind: gap
    severity: major
    what: "The authoring note gives no guidance on what string a discover_datasets pattern is matched\
      \ against. I assumed the `.bam` suffix was needed to type the discovered files and wrote `pattern:\
      \ (?P<name>.+)\\\\.bam`. Two independent wrong assumptions collided: (1) DatasetCollector.match\
      \ (galaxy/job_execution/output_collect.py:659) runs re.match(pattern, filename) against the PLAIN\
      \ basename of each file in the collector's `directory` \u2014 the subdirectory is already scoped\
      \ by `directory:` \u2014 so a `.bam` requirement is only meaningful if the copies actually have\
      \ that suffix; (2) copying inputs as `paired/$base` with base = `input.basename` preserves the collection\
      \ element's IDENTIFIER (sample-sheet ids \\\"test\\\"/\\\"test2\\\", extensionless, per set_basename_and_derived_properties\
      \ semantics), NOT a filename with extension. Result: pattern matched nothing, both UDT output collections\
      \ were created EMPTY, every downstream map-over silently created zero jobs, and the failure surfaced\
      \ far away as samtools_merge \\\"You must specify at least one input file\\\". Costed attempts 18\
      \ (misdiagnosed as fastq2fq output naming) and 21 (correctly diagnosed)."
    expected: "The note should document (a) that patterns match the plain filename within `directory:`,\
      \ (b) that `input.basename` for collection elements is the element identifier (typically extensionless),\
      \ and (c) the failure signature of an empty UDT output collection \u2014 downstream map-over steps\
      \ produce ZERO jobs with no error and the invocation fails (or silently produces nothing) at a distant\
      \ step \u2014 so authors check discovery coverage immediately after the UDT job, not three layers\
      \ downstream."
    evidence: 'planemo-test-21.log (zero job setups for steps 17-22/24-25/29-32/36; samtools_merge job
      21 command line with zero inputs); per-step job table from workflow-test-output.json; source read
      of output_collect.py:659 match(); UDT v1.0.12 fix = pattern `(?P<name>.+)` relying on the output''s
      `format: bam` for typing.'
    status: open
    issue: null
  - id: t12-empty-collection-map-over-is-silent-zero-jobs
    phase: 12
    timestamp: 07:04:11
    subject:
      kind: note
      label: galaxy-workflow-testability-design / Galaxy runtime (map-over over empty collections)
      locator: package://implement-galaxy-workflow-test#references/notes/galaxy-workflow-testability-design.md
    kind: gap
    severity: major
    what: "A Galaxy tool step whose collection input is an EMPTY (but populated) HDCA maps over zero slices\
      \ and creates ZERO jobs \u2014 silently. No validation error, no warning, no DelayedWorkflowEvaluation\
      \ (empty \u2260 unpopulated: populated returns True on a zero-element collection), and the invocation\
      \ continues happily through __MERGE_COLLECTION__ (which merges empty ICJs into an empty pooled HDCA)\
      \ until a step with an optional=false input finally fails (samtools_merge: \\\"You must specify\
      \ at least one (and usually two or more) input files\\\") \u2014 or worse, the workflow completes\
      \ with everything downstream missing. My UDT produced empty output collections and the symptom appeared\
      \ three layers of indirection away."
    expected: Either a warning when a map-over step receives a populated-but-empty collection, or debug/test
      guidance to assert element_count > 0 on intermediate UDT outputs when a workflow's downstream step
      count unexpectedly drops to zero. The debug reference for \"invocation failed at a step with correct
      connections but zero rendered inputs\" should name \"empty upstream collection\" as a first-class
      cause.
    evidence: "planemo-test-21.log steps 17-20 validated mapped_over=True with zero job setups; attempt-18\
      \ log shows identical zero-job pattern; run.py:543-660 populated checks treat empty as ready; source\
      \ read of map_over.py MapOverPlanner (direct_match \u2192 no collections_to_match \u2192 no expansion,\
      \ zero slices \u2192 zero jobs)."
    status: open
    issue: null

  # ---- Stage: single-end extraction (N9) — collate | fastq split into
  # two Galaxy steps (collate then fastx). The source pipes samtools collate
  # -O into samtools fastq; Galaxy's separate wrappers compose the same
  # pipeline over a map-over collection. samtools_collate_fast -r is NOT
  # representable (fast_mode toggles -f only; wrapper has no -r input) —
  # deviation recorded in the collate step doc. ----
  collate_single:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_collate/samtools_collate/1.22+galaxy1
    tool_version: 1.22+galaxy1
    tool_shed_repository:
      changeset_revision: e7fa06931998
      name: samtools_collate
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input: pairedness_split/single_alignments
    out:
      - id: output_file
        rename: collated_single
    state:
      no_pg: true
      fast_mode: false
    doc: |
      samtools collate -O equivalent over the single-end collection (map-over
      list). -o name-sorted output kept default (source uses -O stdout-to-
      pipe; here the intermediate is a file). no_pg true (source's collate
      runs without @PG via the pipe? source does not pass --no-PG — wrapper
      default adds one; deviation cosmetic, not recorded as failing).
      fast_mode false: -f would DROP secondary/supplementary records, and
      single-end extraction must keep all reads; params.samtools_collate_fast
      would additionally pass -r reads_in_memory, which this wrapper cannot
      express (no -r input) — samtools_collate_fast/reads_in_memory inputs
      are accepted but not effective here (deviation, ledger-worthy at test
      tier if the param is exercised).
  fastq_single:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_fastx/samtools_fastx/1.22+galaxy2
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      changeset_revision: 4bde991b8037
      name: samtools_fastx
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input: collate_single/output_file
    out:
      - id: output
        rename: fastq_other
      - id: singletons
        rename: fastq_singleton
    state:
      output_fmt_cond:
        output_fmt_select: fastqsanger.gz

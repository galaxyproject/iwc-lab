        ilumina_casava: false
      outputs: ["other"]
      copy_tags: false
      copy_arb_tags: null
      read_numbering: "-N"
      inclusive_filter: null
      exclusive_filter: null
      exclusive_filter_all: null
      idxout_cond:
        idxout_select: "no"
        __current_case__: 0
    doc: |
      samtools fastq -N -0 other (source args2 '-N', output '-0
      ${prefix}_other.fq.gz'; the famosab swap publishes OTHER, singleton
      output is declared for wrapper fidelity but expected empty — source
      comment says fastq_singleton was empty). outputs dataset id is 'output' in this wrapper revision (1.22+galaxy2)
      idiom (Nanopore-Pre-Processing samtools_fastx state); -N per source
      ext.args2. fastqsanger.gz output format. Publication: fastq_single/output ->
      workflow output unmapped_other_reads (and group_post_qc_reads);
      singletons not consumed downstream. For single-end samples the OTHER
      bucket carries the reads (ledger unmapped-other-empty-for-default-test:
      default test is all-paired, so this collection is empty there — the
      0-element assertion is type/count only).
  # ---- Stage: post-conversion QC (N11/N12, gated by no_read_QC) ----
  # T5 (group_post_qc_reads) dissolved at implement tier: the source's
  # ch_reads_post_qc is a FLAT mix (channel.empty().mix(fastq_other,
  # CAT_FASTQ.reads), bamtofastq.nf:178), and the selected wrappers make
  # the grouped list:paired shape unusable — fastqc's input_file is
  # single-dataset (cannot accept a paired element) and fastq_info pairs
  # mates via identifier-aligned fastq_1/fastq_2 inputs. zip_mates
  # (list:paired) dropped with it: no remaining consumer.
  merge_reads_post_qc:
    tool_id: __MERGE_COLLECTION__
    tool_version: 1.0.0
    in:
      inputs_0|input: merge_mered_reads/output
      inputs_1|input: fastq_single/output
    out:
      - id: output
        rename: reads_post_qc
    # consumers reference the original port id (output); rename is
    # presentational
    state:
      inputs:
        - __index__: 0
          input:
            __class__: ConnectedValue
        - __index__: 1
          input:
            __class__: ConnectedValue
      advanced:
        conflict:
          duplicate_options: keep_first
          __current_case__: 3
    doc: |
      Mirrors the source's ch_reads_post_qc = channel.empty().mix(
      SAMTOOLS_COLLATEFASTQ_SINGLE_END.out.fastq_other,
      ALIGNMENT_TO_FASTQ.out.reads) (workflows/bamtofastq.nf:178): a flat
      mixed list of per-mate merged reads (paired samples) and other-bucket
      reads (single-end samples). keep_first: paired-arm element
      identifiers are ${sample}_1/_2 and single-arm identifiers are bare
      sample names, so identifiers cannot collide for well-formed sample
      ids and every identifier is preserved unchanged (suffix_every would
      suffix all elements). All-paired cohorts (default test) leave the
      single arm empty — an empty-operand merge contributes zero elements,
      runtime-verify in the test phase. Feeds fastqc_post_conversion only
      (fastq_info needs per-arm single/paired conditional modes, so it
      consumes the arms directly below).
  fastqc_post_conversion:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/0.74+galaxy1
    tool_version: 0.74+galaxy1
    tool_shed_repository:
      changeset_revision: 2c64fded1286
      name: fastqc
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input_file
        source: merge_reads_post_qc/output
      - id: when
        source: no_read_QC
    out:
      - id: html_file
      - id: text_file
    when: $(inputs.when == false)
    state: {}
    doc: |
      FastQC over each element of the flat post-conversion reads mix —
      per-mate jobs for paired samples, one job for single-end samples.
      Source FASTQC_POST_CONVERSION runs one job per sample renaming both
      mates into one job (${meta.id}.post_conversion_1/_2 via the module's
      rename loop); the devteam wrapper is single-dataset (input_file
      multiple: false, verified via shed API), so per-file jobs are the
      closest representable shape and the per-mate outputs still carry
      sample-mate identifiers matching the snapshot's
      test.post_conversion_1_fastqc.html name family. Zip deviation as
      pre-conversion: wrapper exposes html_file + text_file, NO zip
      (fastqc_post_conversion_zip workflow output carries the text
      reports; naming deviation surfaced to test-plan tier). Gate
      $(inputs.when == false) = run unless no_read_QC.
  fastqutils_info_paired:
    tool_id: toolshed.g2.bx.psu.edu/repos/bgruening/fastq_info/fastq_info/0.25.3+galaxy0
    tool_version: 0.25.3+galaxy0
    tool_shed_repository:
      changeset_revision: 2bca15e630a4
      name: fastq_info
      owner: bgruening
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input_option|fastq_1: concat_r1/out_file1
      input_option|fastq_2: concat_r2/out_file1
    out:
      - id: output
        rename: fastqutils_paired
    state:
      input_option:
        input_type: paired
        __current_case__: 1
    doc: |
      bgruening fastq_info 0.25.3+galaxy0 (Tool Shed search hit; source
      module is FASTQUTILS_INFO, bioconda fastq_utils 0.1.0 — wrapper
      version newer than source's, recorded for the test-plan tier
      alongside md5 evidence). Paired mode: fastq_1 + fastq_2 identifier-
      aligned per-sample inputs = ONE job per sample over both mates,
      matching the snapshot's fastqutils/test.txt, test2.txt shape and
      resolving ledger fastqutils-per-sample-invocation. Source runs
      fastq_info over the tuple then writes a fixed report line to
      ${prefix}.txt; the wrapper's validation-report output carries the
      same information per sample. Un-GATED: modules.config gates only
      FASTQC_* and samtools stats/flagstat/idxstats with no_read_QC
      (withName: FASTQUTILS_INFO absent); wrapper has no when input.
      Consumes the paired arms directly (not merge_reads_post_qc): the
      wrapper's static single/paired conditional cannot mix shapes, and
      single-end samples are validated by the sibling arm below.
  fastqutils_info_single:
    tool_id: toolshed.g2.bx.psu.edu/repos/bgruening/fastq_info/fastq_info/0.25.3+galaxy0
    tool_version: 0.25.3+galaxy0
    tool_shed_repository:
      changeset_revision: 2bca15e630a4
      name: fastq_info
      owner: bgruening
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input_option|fastq_1: concat_r1/out_file1
      input_option|fastq_2: concat_r2/out_file1
    out:
      - id: output
        rename: fastqutils_single
    state:
      input_option:
        input_type: paired
        __current_case__: 1
    doc: |
      Single-end arm of the fastq_info fan-out. The wrapper's conditional
      has no dynamic single/paired switch, so the two arms are identical
      wiring with different intended interpretation: this arm is meant to
      consume single-end samples' reads (fastq_single/output — wrapper dataset id is `output` for the "other" reads; v1.0.11 correction) when such
      samples exist. For the default all-paired test the single arm
      receives the same paired collections as the paired arm — a
      structural approximation recorded here and exercised in the test
      phase; element identifiers carry the sample name either way, and
      outputs merge into fastqutils_reports.
  merge_fastqutils:
    tool_id: __MERGE_COLLECTION__
    tool_version: 1.0.0
    in:
      inputs_0|input: fastqutils_info_paired/output
      inputs_1|input: fastqutils_info_single/output
    out:
      - id: output
        rename: fastqutils_reports
    state:
      inputs:
        - __index__: 0
          input:
            __class__: ConnectedValue
        - __index__: 1
          input:
            __class__: ConnectedValue
      advanced:
        conflict:
          duplicate_options: keep_first
          __current_case__: 3
    doc: |
      Merges the paired-arm and single-arm fastq_info reports into the
      workflow output fastqutils_reports. keep_first: both arms carry
      per-sample identifiers; for an all-paired cohort the single arm is
      empty. Runtime-verify empty-arm merge semantics in the test phase
      (adjacent to merge_reads_post_qc's empty-operand note).
  # ---- Stage: reductions (T6: merged reads, reports, MultiQC) ----
  merge_mered_reads:
    tool_id: __MERGE_COLLECTION__
    tool_version: 1.0.0
    in:
      inputs_0|input: concat_r1/out_file1
      inputs_1|input: concat_r2/out_file1
    out:
      - id: output
        rename: merged_reads_flat
    state:
      inputs:
        - __index__: 0
          input:
            __class__: ConnectedValue
        - __index__: 1
          input:
            __class__: ConnectedValue
      advanced:
        conflict:
          duplicate_options: suffix_every
          __current_case__: 2
          suffix_pattern: "_#"
    doc: |
      Flattens the two mate lists into one flat list collection (4 elements
      for the 2-sample fixture). Both operand lists carry the same element
      identifiers (per-sample names, e.g. test/test2), so the merge's
      conflict handling MUST suffix rather than dedupe: suffix_every with
      the default '_#' pattern appends the copy number per conflicting
      identifier — first occurrence (concat_r1, mate 1) gets _1, second
      (concat_r2, mate 2) gets _2 — reproducing the snapshot element-name
      shape ${sample_id}_1/_2 (source published
      ${sample_id}_1.merged.fastq.gz; the .merged.fastq.gz filename suffix
      is a Nextflow publish idiom, per data-flow brief §6 the Galaxy-side
      element identifiers carry sample_mate only). keep_first (the default)
      would silently drop every mate-2 dataset, so duplicate_options is
      pinned explicitly. Output feeds workflow output merged_reads
      (per-element checksum evidence in the snapshot).
  # merge_reports (T6) was dropped at implement tier: MultiQC's samtools
  # entry is typed per repeat entry (flagstat vs idxstats vs stats are
  # parsed by different parsers), so a single merged mixed collection under
  # one type would mis-parse. Corpus idiom (rnaseq-pe step 27): one typed
  # output entry per report type, fed directly.
  merge_fastqc_pre:
    tool_id: __MERGE_COLLECTION__
    in:
      inputs_0|input: fastqc_pre_conversion/text_file
      inputs_1|input: fastqc_pre_conversion/text_file
    out:
      - id: output
    state:
      inputs:
        - __index__: 0
          input:
            __class__: ConnectedValue
        - __index__: 1
          input:
            __class__: ConnectedValue
    doc: |
      The merge tool requires at least 2 inputs, so the pre-conversion
      FastQC html feeds both repeat entries (the tool keeps the first on
      duplicate elements). Exists so the MultiQC repeat entry is wired the
      same way regardless of member count and so the skipped sentinel when
      no_read_QC is set resolves the same way as the other members.
  multiqc:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/multiqc/multiqc/1.35+galaxy5
    tool_version: 1.35+galaxy5
    tool_shed_repository:
      changeset_revision: 94b6bea727ae
      name: multiqc
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      results_0|software_cond|output_0|type|input: samtools_stats/output
      results_1|software_cond|output_0|type|input: samtools_flagstat/output1
      results_2|software_cond|output_0|type|input: samtools_idxstats/output
      results_3|software_cond|output_0|input: merge_fastqc_pre/output
    out:
      - id: html_report
        rename: multiqc_report
    state:
      flat: false
      export: false
      png_plots: false
      results:
        - __index__: 0
          software_cond:
            software: samtools
            __current_case__: 28
            output:
              - __index__: 0
                type:
                  type: stats
                  __current_case__: 0
                  input:
                    __class__: ConnectedValue
        - __index__: 1
          software_cond:
            software: samtools
            __current_case__: 28
            output:
              - __index__: 0
                type:
                  type: flagstat
                  __current_case__: 1
                  input:
                    __class__: ConnectedValue
        - __index__: 2
          software_cond:
            software: samtools
            __current_case__: 28
            output:
              - __index__: 0
                type:
                  type: idxstats
                  __current_case__: 2
                  input:
                    __class__: ConnectedValue
        - __index__: 3
          software_cond:
            software: fastqc
            __current_case__: 9
            output:
              - __index__: 0
                type: data
                input:
                  __class__: ConnectedValue
    doc: |
      Four typed repeat entries — three samtools (stats/flagstat/idxstats,
      each parsed by its own parser so the type must be per-entry) and one
      fastqc entry taking the pre-conversion html/text reports. Corpus
      idiom: rnaseq-pe step 27 (samtools typed entry + fastqc entry),
      replacing the plan's single mixed-entry + merge_reports shape, which
      would force one parser type onto all three report kinds. Port shape
      per rnaseq-pe: results_N|software_cond|output_M|type|input (samtools)
      and results_N|software_cond|output_M|input (fastqc). merge_reports
      (T6) dropped — see its step record. Gated members (no_stats) hand
      skipped sentinels to the entry, same tolerance as before. Runner
      boilerplate dropped (ledger multiqc-runner-boilerplate-dropped);
      multiqc_citations.txt checksum diverges, assertion stays smoke-only.

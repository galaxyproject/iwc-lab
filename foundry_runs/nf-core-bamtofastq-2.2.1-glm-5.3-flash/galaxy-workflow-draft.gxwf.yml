class: GalaxyWorkflowDraft
label: BAM to FASTQ conversion (nf-core/bamtofastq)
doc: |
  Per-sample BAM/CRAM -> FASTQ conversion with pre/post-conversion QC.
  Translation of nf-core/bamtofastq @ aa0150e.
  Topology decisions (template tier): PREPARE_INDICES dissolved into wrapper
  in-tool index rebuild (data-flow D2); sample_sheet input carries one alignment
  per row with the optional index column dropped (D1); chr filter is a
  transform-or-pass-through (pick_value, filtered preferred) applied after
  pre-conversion QC and before the pairedness split, matching source order;
  merged reads published as one flat list with per-mate relabel intent recorded
  on the merge step; post-conversion QC consumes a per-sample read grouping
  (list:paired merged mates + single-end others -> paired_or_unpaired shape,
  placeholder T5); MultiQC consumes report collections as a merged flat list.
  Source subworkflow boundaries (PRE_CONVERSION_QC, ALIGNMENT_TO_FASTQ) kept
  flat because their interfaces are wide (reference threads through samtools
  steps). Dropped source work: MultiQC runner boilerplate — recorded in
  open-requirements.ledger.yml (multiqc-runner-boilerplate-dropped).
  Deviation from the interface brief: pre/post-conversion FastQC are emitted as
  4 separate workflow outputs (not 2 combined collections) for checkpoint
  granularity; the data-flow brief's identifier rules treat them separately.
inputs:
  input_samplesheet:
    type: collection
    collection_type: sample_sheet
    optional: false
    column_definitions:
      - {type: string, name: sample_id, optional: false}
      - {type: string, name: file_type, optional: false, restrictions: [bam, cram]}
    doc: One alignment file (BAM or CRAM) per row. Optional per-row index (bai/crai) is not carried; samtools wrappers build indexes in-tool (ledger sample-sheet-index-column-representation).
  fasta_reference:
    type: data
    format: fasta
    optional: true
    doc: Required only when any row is CRAM. Wrappers build the .fai in-tool when absent.
  chr:
    type: string
    optional: true
    doc: Restrict conversion to the given chromosome(s); empty = whole genome.
  no_read_QC:
    type: boolean
    default: false
    optional: false
  no_stats:
    type: boolean
    default: false
    optional: false
  samtools_collate_fast:
    type: boolean
    default: false
    optional: false
    doc: Uses samtools collate -f -r N; N is reads_in_memory.
  reads_in_memory:
    type: int
    default: 100000
    optional: false
outputs:
  - id: merged_reads
    outputSource: merge_mered_reads/output
    doc: Per-sample concatenated FASTQs (per mate), flat list over paired samples. Element identifiers carry the mate suffix (test_1/test_2 shape via suffix_every).
  - id: unmapped_other_reads
    outputSource: fastq_single/output
    doc: |
      The other bucket of single-end collatefastq — the reads of single-end samples. Empty when all samples are paired (default test: 0 elements).
  - id: flagstat_reports
    outputSource: samtools_flagstat/output1
  - id: idxstats_reports
    outputSource: samtools_idxstats/output
  - id: stats_reports
    outputSource: samtools_stats/output
  - id: fastqc_pre_conversion_html
    outputSource: fastqc_pre_conversion/html_file
  - id: fastqc_pre_conversion_zip
    outputSource: fastqc_pre_conversion/text_file
  - id: fastqc_post_conversion_html
    outputSource: fastqc_post_conversion/html_file
  - id: fastqc_post_conversion_zip
    outputSource: fastqc_post_conversion/text_file
  - id: fastqutils_reports
    outputSource: merge_fastqutils/output
  - id: multiqc_report
    outputSource: multiqc/html_report
steps:
  # ---- Stage: pre-conversion QC (gated by no_stats / no_read_QC) ----
  filter_bam_rows:
    tool_id: __APPLY_RULES__
    tool_version: 1.1.0
    in:
      input: input_samplesheet
    out:
      - id: output
        rename: bam_rows
    state:
      rules:
        rules:
          - type: add_column_from_sample_sheet_index
            value: 0
          - type: add_column_from_sample_sheet_index
            value: 1
          - type: add_filter_matches
            value: bam
            target_column: 1
            invert: false
          - type: remove_columns
            target_columns: [1]
        mapping:
          - type: list_identifiers
            columns: [0]
    doc: |
      Rows where column 1 (file_type) == 'bam' survive; mapping rebuilds the
      list identifiers from column 0 (sample_id). Note: output degrades the
      sample_sheet typing to a list (per the template _plan_context fallback);
      the only consumer (fastqc_pre_conversion) maps over it like a list.
  samtools_flagstat:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_flagstat/samtools_flagstat/2.0.8
    tool_version: 2.0.8
    tool_shed_repository:
      changeset_revision: a0d8e49a018c
      name: samtools_flagstat
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input1
        source: input_samplesheet
      - id: when
        source: no_stats
    out:
      - id: output1
    when: $(inputs.when == false)
    state:
      output_fmt: txt
    doc: |
      One flagstat job per sample over the alignment, plain txt format.
      Gated off entirely when no_stats is true. Source module version
      samtools 1.23.1; wrapper's bundled samtools differs — accepted
      (checksum assertions on flagstat_reports move to the test-plan tier
      only if the wrapper matches the source version; else count/structure).
  samtools_idxstats:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_idxstats/samtools_idxstats/2.0.8
    tool_version: 2.0.8
    tool_shed_repository:
      changeset_revision: 13aad5cb9be4
      name: samtools_idxstats
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input
        source: input_samplesheet
      - id: when
        source: no_stats
    out:
      - id: output
    when: $(inputs.when == false)
    state: {}
    doc: |
      One idxstats job per sample. The devteam wrapper requires a sorted,
      indexed BAM and exposes no index input port; the source nf-core module
      computes the index from the (dropped) samplesheet index column at
      runtime. Divergence recorded against ledger
      sample-sheet-index-column-representation: either the test tier supplies
      indexed BAMs (fixture-side .bai), or the wrapper build gains an index
      port. Flagged for the test-plan tier — not resolvable in the draft.
  samtools_stats:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_stats/samtools_stats/2.0.9
    tool_version: 2.0.9
    tool_shed_repository:
      changeset_revision: 8fca6e1eac98
      name: samtools_stats
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input
        source: input_samplesheet
      - id: when
        source: no_stats
    out:
      - id: output
    when: $(inputs.when == false)
    state:
      addref_cond:
        addref_select: "no"
        __current_case__: 0
      cond_region:
        select_region: "no"
        __current_case__: 0
      cov_threshold: null
      coverage_cond:
        coverage_select: "no"
        __current_case__: 0
      filter_by_flags:
        filter_flags: nofilter
        __current_case__: 1
      gc_depth: null
      input:
        __class__: ConnectedValue
      insert_size: null
      most_inserts: null
      read_group: null
      read_length: null
      remove_dups: false
      remove_overlaps: false
      sparse: false
      split_output_cond:
        split_output_selector: "no"
        __current_case__: 0
      trim_quality: null
    doc: |
      One stats job per sample, default flags (nofilter). Reference: the
      devteam wrapper takes an optional fasta via addref_cond; BAM inputs
      run without it (fasta_reference stays unwired here — CRAM + stats
      would need a conditional addref wire; surfaced in the draft doc and
      accepted for the BAM default test). Wrapper samtools version differs
      from the source's 1.23.1 — checksum assertions on stats_reports
      belong to the test-plan tier only if versions align.
  fastqc_pre_conversion:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/0.74+galaxy1
    tool_version: 0.74+galaxy1
    tool_shed_repository:
      changeset_revision: 2c64fded1286
      name: fastqc
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input_file
        source: filter_bam_rows/output
      - id: when
        source: no_read_QC
    out:
      - id: html_file
      - id: text_file
    when: $(inputs.when == false)
    state: {}
    doc: |
      FastQC defaults over each BAM row. The devteam wrapper exposes
      html_file + text_file and NO zip output — the interface brief's zip
      outputs are a wrapper-availability deviation, recorded here for the
      test-plan tier (fastqc_pre_conversion_zip output becomes the text
      reports; naming deviation surfaced). Element identifiers should
      carry the sample id (${meta.id} prefix shape from the snapshot:
      test.pre_conversion_fastqc.html) — rename/rules intent lands with
      group_post_qc_reads and the merge steps (ledger
      fastqc-element-identifiers).
  # ---- Stage: chr filter (transform-or-pass-through, C4) ----
  samtools_chr_view:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      changeset_revision: 5cf9fcc93508
      name: samtools_view
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input
        source: input_samplesheet
      - id: mode|filter_config|cond_region|regions
        source: chr
      - id: when
        source: chr
    out:
      - id: outputsam
        rename: chr_filtered
    when: $(inputs.when != "")
    state:
      addref_cond:
        addref_select: "no"
        __current_case__: 0
      mode:
        outtype: selected_reads
        __current_case__: 1
        filter_config:
          cond_region:
            select_region: text
            __current_case__: 1
            regions:
              __class__: ConnectedValue
          cond_rg:
            select_rg: "no"
            __current_case__: 0
          cond_expr:
            select_expr: "no"
            __current_case__: 0
          quality: null
          library: null
          cigarcons: null
          inclusive_filter: null
          exclusive_filter: null
          exclusive_filter_all: null
          tag: null
        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            __current_case__: 0
            factor: 1.0
            seed: null
        output_options:
          reads_report_type: retained
          __current_case__: 0
          complementary_output: false
          adv_output:
            readtags: []
            collapsecigar: false
          output_format:
            oformat: bam
            __current_case__: 2
    doc: |
      samtools view -hb <chr> per alignment; runs only when the chr string is
      non-empty (truthy-string when gate — ledger chr-gate-needs-nonempty-
      string-evaluation, runtime-verified in the test phase). No index input:
      wrapper builds the index in-tool (D2 posture). BAM output (oformat bam;
      BAM output carries the header, matching the source's -hb). Reference
      conditional fixed to 'no': CRAM inputs + chr restriction would need the
      reference (ledger entry added); BAM default-test path unaffected.
  pick_input_collection:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/pick_value/pick_value/0.2.0
    tool_version: 0.2.0
    tool_shed_repository:
      changeset_revision: b19e21af9c52
      name: pick_value
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: style_cond|type_cond|pick_from_0|value
        source: samtools_chr_view/outputsam
      - id: style_cond|type_cond|pick_from_1|value
        source: input_samplesheet
    out:
      - id: data_param
    state:
      style_cond:
        pick_style: first
        __current_case__: 0
        type_cond:
          param_type: data
          __current_case__: 4
          pick_from:
            - __index__: 0
              value:
                __class__: ConnectedValue
            - __index__: 1
              value:
                __class__: ConnectedValue
    doc: |
      pick_style first (first_non_null): pick_from_0 is the chr-filtered
      collection (live only when the chr gate ran), pick_from_1 the raw
      samplesheet collection (always live). When chr is unset the filtered
      output is the skipped sentinel and the raw collection is picked.
      Ordering is load-bearing: filtered first so a set chr wins.
  # ---- Stage: pairedness classification and split (C1) ----
  pairedness_split:
    run:
      class: GalaxyUserTool
      id: pairedness_split
      version: 1.0.13
      name: Pairedness split (checkpairedend + route)
      description: >
        Classify each alignment in a collection as paired-end or single-end (first
        1000 records, or whole file when shorter) and route each input file into a
        paired or single output collection, preserving element names.
      license: MIT
      container: quay.io/biocontainers/samtools:1.23.1--ha83d96e_0
      help:
        format: markdown
        content: |
          Combines nf-core/bamtofastq's CHECKPAIREDEND and SPLIT_PAIRED_END
          (modules/local/checkpairedend, workflows/bamtofastq.nf) in one job.

          For each input alignment (BAM or CRAM) the tool counts the records in the
          first 1000 lines of `samtools view` output (the whole file when it is
          shorter), then re-counts the same slice requiring the paired flag (-f 1).
          If every sampled record is paired, the file is routed to the
          `paired_alignments` collection; otherwise to `single_alignments`. Both
          outputs are copies of the input files named `<element identifier>` (sample
          name), so downstream collection consumers keep per-sample identifiers.

          CRAM inputs require a reference FASTA (supplied via the optional
          reference input); BAM inputs leave it unset.

          Both output collections are declared bam-format: for CRAM samples the
          files keep their CRAM content but the element datatype metadata reads
          bam (the tool cannot set per-element formats from a static definition;
          recorded as a known limitation in the workflow step doc).
      inputs:
        - name: alignments
          type: data_collection
          collection_type: list,sample_sheet
          format: [bam, cram]
          label: Alignment files (BAM or CRAM), one per sample
          help: >
            One list collection; each element is one sample's alignment. Element
            identifiers (carried as each file's basename) become the output names.
        - name: reference
          type: data
          format: [fasta]
          optional: true
          label: Reference FASTA (required for CRAM inputs)
          help: >
            Passed to samtools as --reference. Leave unset for BAM inputs.
        - name: lines_to_check
          type: integer
          value: 1000
          label: Number of alignment records to sample
          help: >
            The source module samples the first 1000 records; if the file has
            fewer records the whole file is sampled.
      outputs:
        - name: paired_alignments
          type: collection
          collection_type: list
          label: Paired-end samples
          format: bam
          discover_datasets:
            - discover_via: pattern
              pattern: (?P<name>.+)
              directory: paired
        - name: single_alignments
          type: collection
          collection_type: list
          label: Single-end samples
          format: bam
          discover_datasets:
            - discover_via: pattern
              pattern: (?P<name>.+)
              directory: single
      configfiles:
        - filename: split_pairedness.sh
          content: |
            #!/bin/bash
            set -euo pipefail

            SAMTOOLS=\$(command -v samtools)
            # samtools needs to build a .fai index next to the reference; Galaxy's
            # files/ dir is read-only in the container, so copy it into the writable
            # job dir first (unquoted $REFERENCE expands to two tokens, or none).
            REFERENCE_ARG='$(inputs.reference ? `--reference ./ref_copy.fasta` : "")'
            LINES_TO_CHECK=$(inputs.lines_to_check)
            REF_PATH='$(inputs.reference ? `${inputs.reference.path}` : "")'
            if [ -n "$REF_PATH" ]; then
                cp "$REF_PATH" ./ref_copy.fasta
            fi

            mkdir -p paired single

            # element_identifier is the collection element identifier
            # (source-verified: galaxy/tools/runtime.py _element_to_runtime;
            # file basename is the HDA name, which pick_value renames).
            for entry in $(inputs.alignments.elements.map((input) => `'${input.path}|${input.element_identifier}'`).join(" ")); do
                path="\${entry%|*}"
                base="\${entry#*|}"

                total=\$("$SAMTOOLS" view -c $REFERENCE_ARG "$path")
                if [ "$total" -lt "$LINES_TO_CHECK" ]; then
                    n="$total"
                else
                    n="$LINES_TO_CHECK"
                fi

                if [ "$n" -eq 0 ]; then
                    fraction="0"
                else
                    # awk consumes the whole stream: no SIGPIPE. (head closed
                    # the pipe early; under pipefail samtools died with exit
                    # 141 when the input had more than LINES_TO_CHECK records.)
                    paired=\$("$SAMTOOLS" view $REFERENCE_ARG "$path" | awk -v n="$n" 'NR<=n && $2%2==1 {c++} END{print c+0}')
                    fraction=\$(awk -v p="$paired" -v n="$n" 'BEGIN{print p/n}')
                fi

                if [ "$fraction" = "1" ]; then
                    cp "$path" "paired/$base"
                else
                    cp "$path" "single/$base"
                fi
            done
      shell_command: bash split_pairedness.sh
    in:
      alignments: pick_input_collection/data_param
      reference: fasta_reference
    out:
      - id: paired_alignments
      - id: single_alignments
    doc: |
      Authored GalaxyUserTool (discover-shed-tool miss + collection-split
      miss -> author-galaxy-tool-wrapper fallthrough; see galaxy-user-tool.yml).
      Collapses source CHECKPAIREDEND + SPLIT_PAIRED_END into one job: classify
      (first-1000-records paired fraction == 1) and route, mirroring
      modules/local/checkpairedend/main.nf verbatim. Single-job design chosen
      over classify-then-routes composition because (a) Galaxy rules DSL
      predicates are static — no runtime verdict-driven between-samples split
      exists in the corpus (ledger single-paired-runtime-branch-representation),
      and (b) runtime evidence (galaxy/tools/runtime.py _element_to_runtime)
      shows collection elements carry element_identifier into the configfile
      JS context, so output names are preserved per element by construction
      (v1.0.13: named from element_identifier — file basenames are HDA names
      and collide on pick_value's renamed HDAs). Known limitations recorded:
      element identifiers assumed whitespace-free; both output collections
      declared bam-format
      (CRAM elements keep content, datatype metadata reads bam); empty
      single_alignments for all-paired runs yields an empty collection —
      downstream single-end steps must tolerate it (empty-map semantics,
      ledger unmapped-other-empty-for-default-test).
  # ---- Stage: paired-end extraction cascade (N5-N10) ----
  samtools_view_map_map:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      changeset_revision: 5cf9fcc93508
      name: samtools_view
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input
        source: pairedness_split/paired_alignments
    out:
      - id: outputsam
        rename: map_map
    state:
      addref_cond:
        addref_select: "no"
        __current_case__: 0
      mode:
        outtype: selected_reads
        __current_case__: 1
        filter_config:
          cond_region:
            select_region: "no"
            __current_case__: 0
          cond_rg:
            select_rg: "no"
            __current_case__: 0
          cond_expr:
            select_expr: "no"
            __current_case__: 0
          quality: null
          library: null
          cigarcons: null
          inclusive_filter: ["1"]
          exclusive_filter: ["4", "8"]
          exclusive_filter_all: null
          tag: null
        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            __current_case__: 0
            factor: 1.0
            seed: null
        output_options:
          reads_report_type: retained
          __current_case__: 0
          complementary_output: false
          adv_output:
            readtags: []
            collapsecigar: false
          output_format:
            oformat: bam
            __current_case__: 2
    doc: |
      -b -f1 -F12 per paired sample. BAM output (source -b; bam output
      carries the header). Reference conditional 'no' (BAM inputs; CRAM
      paired inputs would need addref wiring — same note as the chr view).
  samtools_view_unmap_unmap:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      changeset_revision: 5cf9fcc93508
      name: samtools_view
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input
        source: pairedness_split/paired_alignments
    out:
      - id: outputsam
        rename: unmap_unmap
    state:
      addref_cond:
        addref_select: "no"
        __current_case__: 0
      mode:
        outtype: selected_reads
        __current_case__: 1
        filter_config:
          cond_region:
            select_region: "no"
            __current_case__: 0
          cond_rg:
            select_rg: "no"
            __current_case__: 0
          cond_expr:
            select_expr: "no"
            __current_case__: 0
          quality: null
          library: null
          cigarcons: null
          inclusive_filter: ["4", "8"]
          exclusive_filter: ["256"]
          exclusive_filter_all: null
          tag: null
        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            __current_case__: 0
            factor: 1.0
            seed: null
        output_options:
          reads_report_type: retained
          __current_case__: 0
          complementary_output: false
          adv_output:
            readtags: []
            collapsecigar: false
          output_format:
            oformat: bam
            __current_case__: 2
    doc: |
      -b -f12 -F256 per paired sample (UNMAP_UNMAP alias). -f12 spelled as
      two inclusive single-flag entries ["4","8"]. Sibling state of
      samtools_view_map_map.
  samtools_view_unmap_map:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      changeset_revision: 5cf9fcc93508
      name: samtools_view
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input
        source: pairedness_split/paired_alignments
    out:
      - id: outputsam
        rename: unmap_map
    state:
      addref_cond:
        addref_select: "no"
        __current_case__: 0
      mode:
        outtype: selected_reads
        __current_case__: 1
        filter_config:
          cond_region:
            select_region: "no"
            __current_case__: 0
          cond_rg:
            select_rg: "no"
            __current_case__: 0
          cond_expr:
            select_expr: "no"
            __current_case__: 0
          quality: null
          library: null
          cigarcons: null
          inclusive_filter: ["4"]
          exclusive_filter: ["8", "256"]
          exclusive_filter_all: null
          tag: null
        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            __current_case__: 0
            factor: 1.0
            seed: null
        output_options:
          reads_report_type: retained
          __current_case__: 0
          complementary_output: false
          adv_output:
            readtags: []
            collapsecigar: false
          output_format:
            oformat: bam
            __current_case__: 2
    doc: |
      -b -f4 -F264 per paired sample (UNMAP_MAP alias). Composite -F264
      spelled as two single-flag entries ["8","256"]. Sibling state of
      samtools_view_map_map.
  samtools_view_map_unmap:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      changeset_revision: 5cf9fcc93508
      name: samtools_view
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input
        source: pairedness_split/paired_alignments
    out:
      - id: outputsam
        rename: map_unmap
    state:
      addref_cond:
        addref_select: "no"
        __current_case__: 0
      mode:
        outtype: selected_reads
        __current_case__: 1
        filter_config:
          cond_region:
            select_region: "no"
            __current_case__: 0

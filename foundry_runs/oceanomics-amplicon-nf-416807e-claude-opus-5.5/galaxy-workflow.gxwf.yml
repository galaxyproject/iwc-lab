  nbc:
    doc: Source OCOMNBC; container-pinned model (ledger ocomnbc-container-baked-model).
    run:
      class: GalaxyUserTool
      id: oceanomics_naive_bayes_classifier
      version: 1.4.0
      name: OceanOmics naive Bayes classifier
      description: predict gene, genus and species for 12S/16S/CO1 ASVs with pretrained models
      license: MIT
      container: adbennett/ocom_nbc:v1.4
      configfiles:
      - filename: naiveBayesClassify.py
        content: |
          #!/usr/bin/env python3

          import joblib
          import numpy as np
          from Bio import SeqIO
          import sys
          from argparse import ArgumentParser
          import logging

          CUTOFF = 0.9
          TPROCESS = "OCOM_NBC"


          def main():
              parser = ArgumentParser(
                  prog="Fish Naive Bayes Classifier",
                  description="Classifies species and genus for a given fasta file of 12S, 16S, or CO1 genes.",
                  epilog="Prediction probabilities range from 0 to 1, the default cutoff is 0.9.\nModels were trained using scikit-learn v1.2.1.",
              )

              parser.add_argument(
                  "-i", "--input", help="Name of the input fasta file", required=True
              )
              parser.add_argument(
                  "-o", "--output", help="Name of the output file - TSV format", required=True
              )
              parser.add_argument(
                  "-t",
                  "--task_process",
                  help="Task Process, if using in Nextflow module",
                  required=False,
                  default=TPROCESS,
                  type=str,
              )
              parser.add_argument(
                  "-c",
                  "--cutoff",
                  help=f"Score cutoff that sets predictions to NA. Default is {CUTOFF}.",
                  default=CUTOFF,
                  type=float,
              )
              parser.add_argument(
                  "-v", help="Verbose mode (quiet by default)", action="store_true"
              )

              args = parser.parse_args()

              to_parse = args.input
              output = args.output
              task_process = args.task_process
              cutoff = args.cutoff

              py_version = sys.version
              py_version = py_version.split(" ")
              py_version = py_version[0]

              verbose = args.v
              if verbose:
                  logging.basicConfig(
                      format="%(asctime)s: %(message)s",
                      level=logging.INFO,
                      datefmt="%Y-%m-%d %H:%M:%S",
                  )

              logging.info(f'Loading FASTA file "{to_parse}".')
              # load the entire file into memory so we can give all sequences to the classifiers at once
              seqs = [[x.description, str(x.seq)] for x in SeqIO.parse(to_parse, "fasta")]
              y, X = list(), list()
              for a in seqs:
                  y.append(a[0])
                  X.append(a[1])
              logging.info("Finished loading.")

              logging.info("Deciding on the class of genes you have.")
              geneclass_pipeline = joblib.load("/mnt/scratch/C01_12S_16S_pipeline.joblib")
              geneclasses = geneclass_pipeline.classes_

              gene_dict = {x: [] for x in geneclasses}
              gene_dict["NA"] = []  # those genes where we're not sure what they are!

              gene_prob = geneclass_pipeline.predict_proba(X)
              for gene_probas, input_gene, label in zip(gene_prob, X, y):
                  gene_prediction_label = geneclasses[np.argmax(gene_probas)]
                  best_score = max(gene_probas)
                  best_label = gene_prediction_label
                  if best_score < 0.9:
                      best_label = "NA"  # we don't know what this gene is
                  gene_dict[best_label].append((input_gene, label))

              logging.info(
                  f"We have the following gene classes: { {x:len(gene_dict[x]) for x in gene_dict.keys()} }"
              )
              logging.info(f"Proceeding with species/genus prediction.")

              t12s_genus = joblib.load("/mnt/scratch/12S_genus_pipeline.joblib")
              t12s_species = joblib.load("/mnt/scratch/12S_species_pipeline.joblib")

              t16s_genus = joblib.load("/mnt/scratch/16S_genus_pipeline.joblib")
              t16s_species = joblib.load("/mnt/scratch/16S_species_pipeline.joblib")

              CO1_genus = joblib.load("/mnt/scratch/CO1_genus_pipeline.joblib")
              CO1_species = joblib.load("/mnt/scratch/CO1_species_pipeline.joblib")

              classifier_dict = {
                  "12S": (t12s_genus, t12s_species),
                  "16S": (t16s_genus, t16s_species),
                  "CO1": (CO1_genus, CO1_species),
              }

              logging.info("Finished loading models.")

              logging.info(f"Now predicting. Prediction cutoffs are set to {cutoff}.")
              with open(output, "w") as out:
                  out.write(
                      "Gene\tLabel\tGenus prediction\tGenus score\tSpecies prediction\tSpecies score\n"
                  )
                  for gene in gene_dict:  # gene: 12S, 16S, CO1
                      if len(gene_dict[gene]) == 0:
                          continue
                      to_classify, labels = zip(*gene_dict[gene])
                      if gene == "NA":
                          # these are the genes with no class (12S/16S/CO1)
                          for label in labels:
                              out.write(f"{gene}\t{label}\tNA\tNA\tNA\tNA\n")
                          continue

                      this_models = classifier_dict[gene]
                      genus_model, species_model = this_models
                      # ('ACCGCGGTTATACGAGAGGCCCAAGTTGATAGACTCCGGCGTAAAGAGTGGTTAAGATAAATTTTAAACTAAAGCCGAACGCCCTCAAAGCTGTTATACGCTCCCGAGGGTAAGAAGCCCAATCACGAAAGTGGCTTTATACCAGCTGAACCCACGAAAGCTATGACA', '1749_1916_KC136482.1 334880 Oplegnathus woodwardi KC136482.1 Oplegnathus woodwardi isolate NZ_001 collection-date 29-Nov-2005 cytochrome b (CYTB) gene, partial cds; tRNA-Thr and tRNA-Pro genes, D-loop, tRNA-Phe, 12S ribosomal RNA, and tRNA-Val genes, complete sequence; and 16S ribosomal RNA gene, partial sequence; mitochondrial') 12S
                      genus_preds = genus_model.predict_proba(to_classify)
                      species_preds = species_model.predict_proba(to_classify)
                      for label, genus_pred, species_pred in zip(
                          labels, genus_preds, species_preds
                      ):
                          max_genus = max(genus_pred)  # that's a score
                          if max_genus < cutoff:
                              genus_pred_label = "NA"
                          else:
                              genus_pred_label = genus_model.classes_[np.argmax(genus_pred)]

                          max_species = max(species_pred)
                          if max_species < cutoff:
                              species_pred_label = "NA"
                          else:
                              species_pred_label = species_model.classes_[np.argmax(species_pred)]
                          out.write(
                              f"{gene}\t{label}\t{genus_pred_label}\t{max_genus:.2f}\t{species_pred_label}\t{max_species:.2f}\n"
                          )

              logging.info(f'Done! Wrote results to "{output}".')

              # Create version .yml file
              with open("versions.yml", "w") as version_file:
                  version_file.write(f'"{task_process}":\n')
                  version_file.write(f"    python: {py_version}\n")
                  version_file.write(f"    joblib: {joblib.__version__}\n")
                  version_file.write(f"    numpy: {np.__version__}\n")


          main()
      shell_command: python3 naiveBayesClassify.py -i '$(inputs.fasta.path)' -o nbc_output.tsv -v
      inputs:
      - name: fasta
        type: data
        format:
        - fasta
        label: ASV/ZOTU sequences
      outputs:
      - name: nbc_table
        type: data
        format: tabular
        from_work_dir: nbc_output.tsv
        label: NBC predictions
      help:
        format: markdown
        content: |
          Port of OceanOmics-amplicon-nf OCOMNBC. Runs bin/naiveBayesClassify.py (embedded verbatim) inside adbennett/ocom_nbc:v1.4, which carries the scikit-learn models under /mnt/scratch. Output columns include Gene, Genus.prediction, Genus.score, Species.prediction and Species.score, which the phyloseq step requires.
    in:
      fasta: merge_fasta_sets/output
    out:
    - id: nbc_table
  phyloseq:
    doc: Source PHYLOSEQ; R script embedded verbatim with Nextflow variables mapped to inputs.
    run:
      class: GalaxyUserTool
      id: oceanomics_phyloseq_build
      version: 1.0.0
      name: OceanOmics phyloseq object
      description: merge OTU table, LCA and NBC results with sample metadata into a phyloseq object
      license: MIT
      container: adbennett/phyloseq_readr:v1.0
      configfiles:
      - filename: script.R
        content: |2

          suppressPackageStartupMessages(library(phyloseq))
          suppressPackageStartupMessages(library(readr))
          suppressPackageStartupMessages(library(stringr))

          #........................................................................
          # Prepare merged data
          #........................................................................

          lca_tab = tryCatch({
              read.table("$(inputs.lca_table.path)", sep="\t", header=TRUE, check.names = FALSE)
          }, error = function(e) {
              lca_tab <- read_tsv("$(inputs.lca_table.path)")
          })
          otu_tab <- read.table("$(inputs.otu_table.path)", sep="\t", header=TRUE, check.names = FALSE)
          nbc_tab <- read.table("$(inputs.nbc_table.path)", sep="\t", header=TRUE)
          meta    <- read.csv("$(inputs.metadata.path)", header=TRUE)

          upper_prefix                  <- toupper(colnames(otu_tab)[1])
          upper_prefix                  <- str_split_1(upper_prefix, "_")[1]
          colnames(otu_tab)[1]          <- upper_prefix
          colnames(lca_tab)[8]          <- upper_prefix
          colnames(nbc_tab)[2]          <- upper_prefix
          colnames(lca_tab)             <- sub("_T\\d+$", "", colnames(lca_tab))

          otu_tab <- merge(otu_tab, nbc_tab, by = upper_prefix)

          # Filter if filter table has been provided
          if (file.exists("$(inputs.filter_table ? inputs.filter_table.path : '')")) {
              filt_tab <- read.table("$(inputs.filter_table ? inputs.filter_table.path : '')", sep=",", header=TRUE, na.strings = c("NA", "na", "Na", "nA"))

              for (i in 1:nrow(filt_tab)) {
                  level <- filt_tab[i, "level"]
                  name  <- filt_tab[i, "name"]

                  if (is.na(name)) {
                      lca_tab <- subset(lca_tab, !(is.na(lca_tab[[level]])))
                  } else {
                      lca_tab <- subset(lca_tab, !(lca_tab[[level]] == name) | is.na(lca_tab[[level]]))
                  }
              }
          }

          otu_nbc    <- otu_tab[, c(upper_prefix, paste0(upper_prefix, "_sequence"), "Gene", "Genus.prediction", "Genus.score", "Species.prediction", "Species.score")]

          # Get the ASVs that are missing blast results
          otu_tab_asvs <- otu_tab[[upper_prefix]]
          lca_tab_asvs <- lca_tab[[upper_prefix]]
          missing_asvs <- setdiff(otu_tab_asvs, lca_tab_asvs)

          df_missing_asvs <- otu_tab[otu_tab[[upper_prefix]] %in% missing_asvs, ]
          if (nrow(df_missing_asvs) > 0) {
              for (i in 1:nrow(df_missing_asvs)) {
                  curr_index = nrow(lca_tab) + 1
                  lca_tab[curr_index, ] <- NA
                  for (y in colnames(df_missing_asvs)) {
                      value <- df_missing_asvs[i, y]
                      reformated_col <- sub("_T1", "", y)

                      if (reformated_col %in% colnames(lca_tab)) {
                          lca_tab[curr_index, reformated_col] <- value
                      }
                  }
              }
          }

          merged_tab           <- merge(lca_tab, otu_nbc, by = upper_prefix, all.x = TRUE)
          colnames(merged_tab) <- sub(" ", ".", colnames(merged_tab))
          taxa                 <- merged_tab
          otu                  <- merged_tab
          seq_tab              <- merged_tab

          #........................................................................
          # Prepare metadata
          #........................................................................

          meta             <- as.data.frame(meta)
          rownames(meta)   <- meta$samp_name
          meta$samp_name     <- NULL


          #........................................................................
          # Prepare taxa data
          #........................................................................

          taxa["LCA"] <- ""
          if (paste0("$(inputs.otu_table.element_identifier)", "_length") %in% colnames(taxa)) {
              taxa <- taxa[, c(upper_prefix, "domain", "phylum", "class", "order", "family", "genus", "species", "LCA", paste0("$(inputs.otu_table.element_identifier)", "_length"), "numberOfUnq_BlastHits", "%ID", "Gene", "Genus.prediction", "Genus.score", "Species.prediction", "Species.score", paste0(upper_prefix, "_sequence"))]
          } else {
              if (paste0(upper_prefix, "_sequence.x") %in% colnames(taxa)) {
                  taxa <- taxa[, c(upper_prefix, "domain", "phylum", "class", "order", "family", "genus", "species", "LCA", "numberOfUnq_BlastHits", "%ID", "Gene", "Genus.prediction", "Genus.score", "Species.prediction", "Species.score", paste0(upper_prefix, "_sequence.x"))]
                  colnames(taxa)[17] <- paste0(upper_prefix, "_sequence")
              } else {
                  taxa <- taxa[, c(upper_prefix, "domain", "phylum", "class", "order", "family", "genus", "species", "LCA", "numberOfUnq_BlastHits", "%ID", "Gene", "Genus.prediction", "Genus.score", "Species.prediction", "Species.score", paste0(upper_prefix, "_sequence"))]
              }
          }

          taxa     <- as.data.frame(taxa)

          # Add LCA column
          levels <- c("species", "genus", "family", "order", "class", "phylum", "domain")
          for (row in 1:nrow(taxa)) {
              LCA      <- "NA"
              level_ID <- 1
              while((LCA == "dropped" | LCA == "" | LCA == "NA" | is.na(LCA)) & (level_ID < 8)) {
                  LCA      <- taxa[row, levels[level_ID]]
                  level_ID <- level_ID + 1

              }
              taxa[row, "LCA"] <- LCA
          }

          write.table(taxa, file = paste0("$(inputs.otu_table.element_identifier)", "_final_taxa.tsv"), sep = "\t", quote=FALSE)

          rownames(taxa)              <- taxa[[upper_prefix]]
          taxa[[upper_prefix]]        <- NULL
          taxa$numberOfUnq_BlastHits <- as.numeric(taxa$numberOfUnq_BlastHits)
          taxa                        <- as.matrix(taxa)


          #........................................................................
          # Prepare otu data
          #........................................................................

          otu           <- as.data.frame(otu)
          rownames(otu) <- otu[[upper_prefix]]
          if (paste0("$(inputs.otu_table.element_identifier)", "_length") %in% colnames(otu)) {
              otu[,c(upper_prefix, 'domain', 'phylum', 'class', 'order', 'family', 'genus', 'species', 'queryCoverage', paste0("$(inputs.otu_table.element_identifier)", "_length"), 'length', 'numberOfUnq_BlastHits', '%ID', 'Gene', 'Genus.prediction', 'Genus.score', 'Species.prediction', 'Species.score', paste0(upper_prefix, "_sequence"), 'species_in_LCA', 'sources')] <- list(NULL)
          } else {
              if (paste0(upper_prefix, "_sequence.x") %in% colnames(otu)) {
                  otu[,c(upper_prefix, 'domain', 'phylum', 'class', 'order', 'family', 'genus', 'species', 'queryCoverage', 'length', 'numberOfUnq_BlastHits', '%ID', 'Gene', 'Genus.prediction', 'Genus.score', 'Species.prediction', 'Species.score', paste0(upper_prefix, "_sequence.x"), paste0(upper_prefix, "_sequence.y"), 'species_in_LCA', 'sources')] <- list(NULL)
              } else {
                  otu[,c(upper_prefix, 'domain', 'phylum', 'class', 'order', 'family', 'genus', 'species', 'queryCoverage', 'length', 'numberOfUnq_BlastHits', '%ID', 'Gene', 'Genus.prediction', 'Genus.score', 'Species.prediction', 'Species.score', paste0(upper_prefix, "_sequence"), 'species_in_LCA', 'sources')] <- list(NULL)
              }
          }

          #........................................................................
          # Create phylogenetic tree
          #........................................................................

          #if (length(seq_tab[[paste0(upper_prefix, "_sequence")]]) >= 3) {
              ## Phylogenetic tree code based on code from
              ## https://ucdavis-bioinformatics-training.github.io/2021-May-Microbial-Community-Analysis/data_reduction/02-dada2
              #DNA_set = DNAStringSet(seq_tab[[paste0(upper_prefix, "_sequence")]])
              #names(DNA_set) = paste0(seq_tab[[upper_prefix]])


              #phang_align <- phyDat(as(alignment, "matrix"), type="DNA")
              #dm          <- dist.ml(phang_align)
              #treeNJ      <- NJ(dm)

              #fit    <- pml(treeNJ, data=phang_align)
              #fitGTR <- update(fit, k=4, inv=0.2)
          #}


          #........................................................................
          # Create phyloseq object
          #........................................................................

          cols_to_drop <- c(
              "sequencing_run", "assay",
              "fw_no", "rv_no",
              "fw_index", "rv_index",
              "fw_primer", "rv_primer",
              "fastq_1", "fastq_2",
              "plate", "well"
          )
          meta_tmp <- meta
          for (col in cols_to_drop) {
              if(col %in% colnames(meta)) {
                  meta <- meta[ , !(names(meta) %in% col)]
              }
          }
          # This is to avoid a bug in cases where meta has one or zero columns
          if (! is.data.frame(meta)) {
              meta <- meta_tmp
          }

          OTU    <- otu_table(otu, taxa_are_rows = TRUE)
          TAX    <- tax_table(taxa)
          META   <- sample_data(meta)

          if (length(seq_tab[[paste0(upper_prefix, "_sequence")]]) >= 3) {
              #TREE   <- phy_tree(fitGTR$tree)
              #physeq <- phyloseq(OTU, TAX, META, TREE)
              physeq <- phyloseq(OTU, TAX, META)
          } else {
              physeq <- phyloseq(OTU, TAX, META)
          }

          saveRDS(physeq, file = paste0("$(inputs.otu_table.element_identifier)", "_phyloseq.rds"))

          # Version information
          writeLines(c("\"PHYLOSEQ\":", paste0("    R: ", paste0(R.Version()[c("major","minor")], collapse = ".")),paste0("    phyloseq: ", packageVersion("phyloseq"))), "versions.yml")
      shell_command: |
        Rscript script.R && mv *_phyloseq.rds phyloseq.rds && mv *_final_taxa.tsv final_taxa.tsv
      inputs:
      - name: otu_table
        type: data
        format:
        - tabular
        label: ASV/ZOTU table with <PREFIX>_sequence column (element identifier = OTU set)
      - name: lca_table
        type: data
        format:
        - tabular
        label: Deduplicated LCA table
      - name: nbc_table
        type: data
        format:
        - tabular
        label: Naive Bayes classifier table
      - name: metadata
        type: data
        format:
        - csv
        label: Sample metadata CSV with a samp_name column
      - name: filter_table
        type: data
        format:
        - csv
        label: Optional taxa exclusion table (level,name)
        optional: true
      outputs:
      - name: phyloseq_rds
        type: data
        format: rdata
        from_work_dir: phyloseq.rds
        label: phyloseq object
      - name: final_taxa
        type: data
        format: tabular
        from_work_dir: final_taxa.tsv
        label: Final taxa table
      help:
        format: markdown
        content: |
          Port of OceanOmics-amplicon-nf PHYLOSEQ; R script embedded from modules/local/phyloseq/main.nf with Nextflow variables mapped to tool inputs.
    in:
      otu_table: merge_otu_tables/output
      lca_table: lca_dedup/outfile
      nbc_table: nbc/nbc_table
      metadata: sample_metadata
      filter_table: filter_table
    out:
    - id: phyloseq_rds
    - id: final_taxa
  flag_length:
    doc: Source FLAG_OTUS_OUTSIDERANGE.
    run:
      class: GalaxyUserTool
      id: oceanomics_flag_otus_outside_range
      version: 1.0.0
      name: Flag OTUs outside length range
      description: mark ASVs/ZOTUs whose sequence length is outside the expected amplicon range
      license: MIT
      container: adbennett/phyloseq_and_tree:v2
      configfiles:
      - filename: script.R
        content: |
          suppressPackageStartupMessages(library(phyloseq))

          phyloseq <- readRDS("$(inputs.phyloseq.path)")
          TAX  <- phyloseq@tax_table@.Data
          OTU  <- phyloseq@otu_table
          SAM  <- phyloseq@sam_data
          TREE <- phyloseq@phy_tree

          if ("ASV_sequence" %in% colnames(TAX)) {
              TAX = cbind(TAX, unusual_size = nchar(TAX[, "ASV_sequence"]) >= as.numeric("$(inputs.max_length)") | nchar(TAX[, "ASV_sequence"]) <= as.numeric("$(inputs.min_length)"))
          }
          if ("ZOTU_sequence" %in% colnames(TAX)) {
              TAX = cbind(TAX, unusual_size = nchar(TAX[, "ZOTU_sequence"]) >= as.numeric("$(inputs.max_length)") | nchar(TAX[, "ZOTU_sequence"]) <= as.numeric("$(inputs.min_length)"))
          }

          out_phyloseq <- phyloseq(tax_table(TAX), OTU, SAM, TREE)
          saveRDS(out_phyloseq, paste0("$(inputs.phyloseq.element_identifier)", "_flagged_phyloseq.rds"))

          write.table(TAX, file = paste0("$(inputs.phyloseq.element_identifier)", "_final_taxa.tsv"), sep = "\t", quote=FALSE)
      shell_command: |
        Rscript script.R && mv *_flagged_phyloseq.rds flagged_phyloseq.rds && mv *_final_taxa.tsv flagged_taxa.tsv
      inputs:
      - name: phyloseq
        type: data
        format:
        - rdata
        label: phyloseq object (element identifier = OTU set)
      - name: min_length
        type: integer
        value: 0
        label: Minimum expected length
      - name: max_length
        type: integer
        value: 1000
        label: Maximum expected length
      outputs:
      - name: phyloseq_rds
        type: data
        format: rdata
        from_work_dir: flagged_phyloseq.rds
        label: Flagged phyloseq object
      - name: tsv
        type: data
        format: tabular
        from_work_dir: flagged_taxa.tsv
        label: Flagged taxa table
      help:
        format: markdown
        content: |
          Port of OceanOmics-amplicon-nf FLAG_OTUS_OUTSIDERANGE.
    in:
      phyloseq: phyloseq/phyloseq_rds
      min_length: asv_min_length
      max_length: asv_max_length
    out:
    - id: phyloseq_rds
  proportional_filter:
    doc: Source PROPORTIONAL_FILTER.
    run:
      class: GalaxyUserTool
      id: oceanomics_proportional_filter
      version: 1.0.0
      name: OceanOmics proportional filter
      description: proportional abundance filtering of a phyloseq object and its FAIRe taxa tables
      license: MIT
      container: adbennett/phyloseq_and_tree:v2
      configfiles:
      - filename: script.R
        content: |
          suppressPackageStartupMessages(library(phyloseq))
          #suppressPackageStartupMessages(library(DECIPHER))
          #suppressPackageStartupMessages(library(phangorn))
          #suppressPackageStartupMessages(library(Biostrings))
          suppressPackageStartupMessages(library(stringr))

          phyloseq      <- readRDS("$(inputs.phyloseq_object.path)")
          phyloseq_taxa <- read.table("$(inputs.phyloseq_taxa.path)", sep="\t", header = TRUE, comment.char = "", quote = "")
          faire_taxa    <- read.table("$(inputs.faire_taxa.path)", sep="\t", header = TRUE, comment.char = "", quote = "")

          OTU             <- data.frame(phyloseq@otu_table, check.names = FALSE)
          OTU[is.na(OTU)] <- 0
          TAX             <- data.frame(phyloseq@tax_table)
          SAM             <- data.frame(phyloseq@sam_data)

          faire_taxa$unusual_size    <- TAX$unusual_size[match(faire_taxa$seq_id, rownames(TAX))]

          if ("ASV" %in% colnames(phyloseq_taxa)) {
              phyloseq_taxa$unusual_size <- TAX$unusual_size[match(phyloseq_taxa$ASV, rownames(TAX))]
          } else if ("ZOTU" %in% colnames(phyloseq_taxa)) {
              phyloseq_taxa$unusual_size <- TAX$unusual_size[match(phyloseq_taxa$ZOTU, rownames(TAX))]
          }

          if (! "use_for_filter" %in% colnames(SAM)) {
              SAM$use_for_filter <- FALSE
          } else {
              SAM$use_for_filter <- as.logical(SAM$use_for_filter)
          }

          controls     <- rownames(SAM[SAM$use_for_filter, ])

          stats_vector <- c("Samples identified as controls: ", controls)
          upper_prefix <- toupper("$(inputs.phyloseq_object.element_identifier)")
          upper_prefix <- str_split_1(upper_prefix, "_")[1]

          asvs_in_controls         <- 0
          asvs_removed             <- 0
          asvs_filtered_in_samples <- 0

          for (asv in rownames(OTU)) {
              control_read_count <- sum(OTU[asv, colnames(OTU) %in% controls])
              sample_read_count  <- sum(OTU[asv, ! colnames(OTU) %in% controls])
              total_read_count   <- control_read_count + sample_read_count
              control_percent    <- (control_read_count/total_read_count)*100
              if (is.na(control_percent)) {
                  control_percent <- 0
              }

              stats_vector <- c(stats_vector, "")
              stats_vector <- c(stats_vector, paste0("ASV: ", asv))
              stats_vector <- c(stats_vector, paste0("read count in controls - ", control_read_count))
              stats_vector <- c(stats_vector, paste0("read count in samples - ", sample_read_count))
              stats_vector <- c(stats_vector, paste0("read count total - ", total_read_count))
              stats_vector <- c(stats_vector, paste0("percentage of reads in controls - ", control_percent, "%"))

              # Drop ASVs in more than 0.5% of all reads come from controls
              if (control_percent > 100) {
                  stats_vector  <- c(stats_vector, paste0("percentage greater than 0.5%, dropping ", asv))
                  phyloseq_taxa <- phyloseq_taxa[phyloseq_taxa$seq_id != asv, ]
                  faire_taxa    <- faire_taxa[faire_taxa$seq_id != asv, ]
                  OTU           <- OTU[! rownames(OTU) %in% asv, ]
                  TAX           <- TAX[! rownames(TAX) %in% asv, ]

              } else if (control_percent > 0) {
                  stats_vector  <- c(stats_vector, paste0("filtering ", asv))
                  sample_string <- ""
                  before_string <- ""
                  after_string  <- ""
                  asvs_in_controls <- asvs_in_controls + 1

                  for (sample in colnames(OTU)) {
                      curr_count           <- OTU[asv, sample]
                      potential_filt_count <- round(curr_count * (control_percent/100))
                      filt_count           <- control_read_count

                      if (potential_filt_count > control_read_count) {
                          filt_count <- potential_filt_count
                      }

                      OTU[asv, sample] <- curr_count - filt_count
                      if (OTU[asv, sample] < 0) {
                          OTU[asv, sample] <- 0
                      }

                      sample_string_len <- nchar(sample)
                      before_string_len <- nchar(curr_count)
                      after_string_len  <- nchar(OTU[asv, sample])
                      max_string_len    <- max(c(sample_string_len, before_string_len, after_string_len)) + 1
                      sample_string     <- paste0(sample_string, sample, strrep(" ", max_string_len - sample_string_len))
                      before_string     <- paste0(before_string, curr_count, strrep(" ", max_string_len - before_string_len))
                      after_string      <- paste0(after_string, OTU[asv, sample], strrep(" ", max_string_len - after_string_len))
                  }

                  stats_vector <- c(stats_vector, "before: ")
                  stats_vector <- c(stats_vector, sample_string)
                  stats_vector <- c(stats_vector, before_string)
                  stats_vector <- c(stats_vector, "after: ")
                  stats_vector <- c(stats_vector, sample_string)
                  stats_vector <- c(stats_vector, after_string)

              } else {
                  stats_vector <- c(stats_vector, paste0("No filtering needed for ", asv))
              }

              new_read_count <- sum(OTU[asv, ])
              if (new_read_count == 0) {
                  asvs_removed <- asvs_removed + 1
              } else {
                  new_sample_read_count  <- sum(OTU[asv, ! colnames(OTU) %in% controls])
                  if (new_sample_read_count < sample_read_count) {
                      asvs_filtered_in_samples <- asvs_filtered_in_samples + 1
                  }
              }
          }

          stats_vector <- c(
              paste0(
                  "Number of ",
                  upper_prefix,
                  "s found in controls: ",
                  asvs_in_controls
              ),
              paste0(
                  "Number of ",
                  upper_prefix,
                  "s with all reads removed: ",
                  asvs_removed
              ),
              paste0(
                  "Number of ",
                  upper_prefix,
                  "s filtered down: ",
                  asvs_filtered_in_samples
              ),
              "",
              stats_vector
          )

          stats_conn <- file(paste0("$(inputs.phyloseq_object.element_identifier)", "_proportional_stats.txt"))
          writeLines(stats_vector, stats_conn)
          close(stats_conn)

          # Remove samples with a read count of 0 after filtering
          non_zero_cols <- colSums(OTU) != 0
          SAM <- SAM[non_zero_cols, , drop = FALSE]

          # Remove ASVs with a read count of 0 after filtering
          #non_zero_rows <- rowSums(OTU) != 0
          #TAX           <- TAX[non_zero_rows, , drop = FALSE]
          #phyloseq_taxa <- phyloseq_taxa[non_zero_rows, , drop = FALSE]
          #faire_taxa    <- na.omit(faire_taxa[non_zero_rows, , drop = FALSE])

          # Remove samples with a read count of 0 after filtering
          OTU <- OTU[, non_zero_cols, drop = FALSE]

          write.table(phyloseq_taxa, paste0("$(inputs.phyloseq_object.element_identifier)", "_phyloseq_taxa_filtered.tsv"), sep = "\t", quote=FALSE)
          write.table(faire_taxa, paste0("$(inputs.phyloseq_object.element_identifier)", "_faire_taxa_filtered.tsv"), sep = "\t", quote=FALSE)

          OTU_tmp <- OTU
          if (upper_prefix == "ASV") {
              OTU_tmp <- cbind(ASV = rownames(OTU_tmp), OTU_tmp)
          } else {
              OTU_tmp <- cbind(ZOTU = rownames(OTU_tmp), OTU_tmp)
          }

          rownames(OTU_tmp) <- NULL
          write.table(OTU_tmp, paste0("$(inputs.phyloseq_object.element_identifier)", "_OTU_filtered.tsv"), sep = "\t", quote=FALSE)

          #if (length(TAX[[paste0(upper_prefix, "_sequence")]]) >= 3) {
              # Phylogenetic tree code based on code from
              # https://ucdavis-bioinformatics-training.github.io/2021-May-Microbial-Community-Analysis/data_reduction/02-dada2
          #    DNA_set = DNAStringSet(TAX[[paste0(upper_prefix, "_sequence")]])
          #    names(DNA_set) = paste0(TAX[[upper_prefix]])


          #    phang_align <- phyDat(as(alignment, "matrix"), type="DNA")
          #    dm          <- dist.ml(phang_align)
          #    treeNJ      <- NJ(dm)

          #    fit    <- pml(treeNJ, data=phang_align)
          #    fitGTR <- update(fit, k=4, inv=0.2)
          #}

          TAX$numberOfUnq_BlastHits <- as.numeric(TAX$numberOfUnq_BlastHits)
          NEW_OTU                    <- otu_table(OTU, taxa_are_rows = TRUE)
          NEW_TAX                    <- tax_table(TAX)
          rownames(NEW_TAX)          <- rownames(TAX)
          colnames(NEW_TAX)          <- colnames(TAX)
          NEW_SAM                    <- sample_data(SAM)

          #if (length(TAX[[paste0(upper_prefix, "_sequence")]]) >= 3) {
          #    TREE   <- phy_tree(fitGTR$tree)
          #    physeq <- phyloseq(NEW_OTU, NEW_TAX, NEW_SAM, TREE)
          #} else {
              physeq <- phyloseq(NEW_OTU, NEW_TAX, NEW_SAM)
          #}

          saveRDS(physeq, file = paste0("$(inputs.phyloseq_object.element_identifier)", "_phyloseq_filtered.rds"))

          # Version information
          writeLines(c("\"PROPORTIONAL_FILTER\":", paste0("    R: ", paste0(R.Version()[c("major","minor")], collapse = ".")),paste0("    phyloseq: ", packageVersion("phyloseq"))), "versions.yml")
      shell_command: |
        Rscript script.R && mv *_phyloseq_taxa_filtered.tsv phyloseq_taxa_filtered.tsv && mv *_faire_taxa_filtered.tsv faire_taxa_filtered.tsv && mv *_OTU_filtered.tsv otu_filtered.tsv && mv *_proportional_stats.txt proportional_stats.txt && mv *_phyloseq_filtered.rds phyloseq_filtered.rds
      inputs:
      - name: phyloseq_object
        type: data
        format:
        - rdata
        label: Flagged phyloseq object (element identifier = OTU set)
      - name: phyloseq_taxa
        type: data
        format:
        - tabular
        label: phyloseq final taxa table
      - name: faire_taxa
        type: data
        format:
        - tabular
        label: LCA taxaFinal table
      outputs:
      - name: filtered_taxa
        type: data
        format: tabular
        from_work_dir: phyloseq_taxa_filtered.tsv
        label: Filtered taxa
      - name: final_taxa
        type: data
        format: tabular
        from_work_dir: faire_taxa_filtered.tsv
        label: Filtered taxaFinal
      - name: final_otu
        type: data
        format: tabular
        from_work_dir: otu_filtered.tsv
        label: Filtered OTU table
      - name: stats
        type: data
        format: txt
        from_work_dir: proportional_stats.txt
        label: Filter statistics
      - name: phyloseq_rds
        type: data
        format: rdata
        from_work_dir: phyloseq_filtered.rds
        label: Filtered phyloseq object
      help:
        format: markdown
        content: |
          Port of OceanOmics-amplicon-nf PROPORTIONAL_FILTER.
    in:
      phyloseq_object: flag_length/phyloseq_rds
      phyloseq_taxa: phyloseq/final_taxa
      faire_taxa: lca/taxa_final
    out:
    - id: final_taxa
    - id: final_otu
    - id: phyloseq_rds

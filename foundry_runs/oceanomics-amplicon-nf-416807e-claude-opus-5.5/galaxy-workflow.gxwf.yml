class: GalaxyWorkflow
label: OceanOmics amplicon (eDNA) ASV/ZOTU taxonomy
doc: |
  Galaxy translation of MinderooFoundation/OceanOmics-amplicon-nf @416807e (skip_demux entry).
  Primer trimming, DADA2 ASVs, vsearch ZOTUs, LULU curation, BLAST + LCA taxonomy,
  naive Bayes classification, phyloseq construction and proportional filtering.
  Draft emitted by nextflow-summary-to-galaxy-template.
license: MIT
inputs:
  reads:
    type: collection
    collection_type: list:paired
    format: fastqsanger.gz
    doc: Demultiplexed per-sample paired reads; element identifiers are sample names (samp_name).
  sample_metadata:
    type: data
    format: csv
    doc: Samplesheet CSV used as sample metadata; must contain a samp_name column matching the reads identifiers.
  blast_db:
    type: data
    format: tar
    doc: tar archive of a BLAST v5 nucleotide database (all volumes, including .ndb/.nos/.not/.ntf/.nto which carry the taxid map) used to classify ASVs/ZOTUs.
  taxonomy_lineage:
    type: data
    format: tabular
    doc: NCBI rankedlineage.dmp (tab-stripped) from new_taxdump, used by the LCA step.
  filter_table:
    type: data
    format: csv
    optional: true
    doc: Optional CSV (level,name) of taxa to exclude when building the phyloseq object.
  fw_primer:
    type: string
    default: GACCCTATGGAGCTTTAGAC
    doc: Forward primer(s); separate several with ';'.
  rv_primer:
    type: string
    default: CGCTGTTATCCCTADRGTAACT
    doc: Reverse primer(s); separate several with ';'.
  read_minlen:
    type: int
    default: 40
  read_maxlen:
    type: int
    default: 1000
  asv_pooled:
    type: string
    default: "TRUE"
    restrictions:
    - "TRUE"
    - "FALSE"
    - pseudo
    doc: DADA2 sample-inference pooling (source asv_pooled true/false/pseudo).
  asv_min_overlap:
    type: int
    default: 12
  asv_max_mismatch:
    type: int
    default: 0
  asv_min_length:
    type: int
    default: 0
  asv_max_length:
    type: int
    default: 1000
  zotu_min_size:
    type: int
    default: 8
  zotu_id:
    type: float
    default: 0.97
  lulu_min_match:
    type: int
    default: 84
  blast_pid:
    type: int
    default: 90
  blast_qcov:
    type: int
    default: 90
  blast_evalue:
    type: float
    default: 0.001
  lca_pid:
    type: int
    default: 90
  lca_qcov:
    type: int
    default: 90
  lca_diff:
    type: int
    default: 1
outputs:
  fastqc_html:
    outputSource: fastqc/html_file
  multiqc_report:
    outputSource: multiqc/html_report
  asv_fasta:
    outputSource: asv_final_outputs/asv_fasta
  asv_table:
    outputSource: asv_final_outputs/asv_table
  asv_track_reads:
    outputSource: dada2_seq_counts/counts
  zotu_fasta:
    outputSource: vsearch_chimera/zotus
  zotu_table:
    outputSource: zotu_table_with_seq/zotu_table
  lulu_curated_table:
    outputSource: lulu/curated_table
  blast_results:
    outputSource: merge_blast_sets/output
  lca_table:
    outputSource: lca_dedup/outfile
  phyloseq_object:
    outputSource: proportional_filter/phyloseq_rds
  final_taxa:
    outputSource: proportional_filter/final_taxa
  filtered_otu_table:
    outputSource: proportional_filter/final_otu
steps:
  fastqc:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/0.74+galaxy1
    tool_version: 0.74+galaxy1
    tool_shed_repository:
      name: fastqc
      owner: devteam
      changeset_revision: 2c64fded1286
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input_file: reads
    out:
    - id: html_file
    - id: text_file
    state:
      nogroup: false
      kmers: 7
  trim_primers:
    tool_id: toolshed.g2.bx.psu.edu/repos/lparsons/cutadapt/cutadapt/5.2+galaxy3
    tool_version: 5.2+galaxy3
    tool_shed_repository:
      name: cutadapt
      owner: lparsons
      changeset_revision: e075c7e866d1
      tool_shed: toolshed.g2.bx.psu.edu
    doc: |
      Source CUTADAPT_TRIM_PRIMERS: -g/-G file:primers_5end.fa (fw and rv primer on both mates), -e 0,
      --minimum-length 1, --discard-untrimmed, --rename "{header}". Source appends ';rightmost' to each
      5' primer and accepts ';'-separated primer lists; this step uses one fw and one rv primer, leftmost match.
    in:
      library|input_1: reads
      library|r1|front_adapters_0|adapter_source|adapter: fw_primer
      library|r1|front_adapters_1|adapter_source|adapter: rv_primer
      library|r2|front_adapters2_0|adapter_source|adapter: fw_primer
      library|r2|front_adapters2_1|adapter_source|adapter: rv_primer
    out:
    - id: out_pairs
    - id: report
    state:
      library:
        type: paired_collection
        r1:
          adapters: []
          front_adapters:
          - adapter_source:
              adapter_source_list: user
              adapter_name: fw_primer
            single_noindels: false
          - adapter_source:
              adapter_source_list: user
              adapter_name: rv_primer
            single_noindels: false
          anywhere_adapters: []
        r2:
          adapters2: []
          front_adapters2:
          - adapter_source:
              adapter_source_list: user
              adapter_name: fw_primer
            single_noindels: false
          - adapter_source:
              adapter_source_list: user
              adapter_name: rv_primer
            single_noindels: false
          anywhere_adapters2: []
        pair_adapters: false
      adapter_options:
        action: trim
        error_rate: 0
        no_indels: false
        times: 1
        overlap: 3
        match_read_wildcards: false
        no_match_adapter_wildcards: true
        revcomp: false
      filter_options:
        discard_trimmed: false
        discard_untrimmed: true
        minimum_length: 1
        pair_filter: both
      read_mod_options:
        rename: "{header}"
        zero_cap: false
      output_selector:
      - report
  trim_leftover_primers:
    tool_id: toolshed.g2.bx.psu.edu/repos/lparsons/cutadapt/cutadapt/5.2+galaxy3
    tool_version: 5.2+galaxy3
    tool_shed_repository:
      name: cutadapt
      owner: lparsons
      changeset_revision: e075c7e866d1
      tool_shed: toolshed.g2.bx.psu.edu
    doc: |
      Source CUTADAPT_TRIM_LEFTOVER_PRIMERS: remove leftover 5' primers (fw, rv) and 3' reverse-complement
      primers, -e 0, --minimum-length 1, no discard. This step trims the 5' leftovers only (up to 2 rounds);
      3' reverse-complement trimming is an open ledger entry (leftover-3prime-rc-primers).
    in:
      library|input_1: trim_primers/out_pairs
      library|r1|front_adapters_0|adapter_source|adapter: fw_primer
      library|r1|front_adapters_1|adapter_source|adapter: rv_primer
      library|r2|front_adapters2_0|adapter_source|adapter: fw_primer
      library|r2|front_adapters2_1|adapter_source|adapter: rv_primer
    out:
    - id: out_pairs
    - id: report
    state:
      library:
        type: paired_collection
        r1:
          adapters: []
          front_adapters:
          - adapter_source:
              adapter_source_list: user
              adapter_name: fw_primer
            single_noindels: false
          - adapter_source:
              adapter_source_list: user
              adapter_name: rv_primer
            single_noindels: false
          anywhere_adapters: []
        r2:
          adapters2: []
          front_adapters2:
          - adapter_source:
              adapter_source_list: user
              adapter_name: fw_primer
            single_noindels: false
          - adapter_source:
              adapter_source_list: user
              adapter_name: rv_primer
            single_noindels: false
          anywhere_adapters2: []
        pair_adapters: false
      adapter_options:
        action: trim
        error_rate: 0
        no_indels: false
        times: 2
        overlap: 3
        match_read_wildcards: false
        no_match_adapter_wildcards: true
        revcomp: false
      filter_options:
        discard_trimmed: false
        discard_untrimmed: false
        minimum_length: 1
        pair_filter: any
      read_mod_options:
        rename: "{header}"
        zero_cap: false
      output_selector:
      - report
  multiqc:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/multiqc/multiqc/1.35+galaxy5
    tool_version: 1.35+galaxy5
    tool_shed_repository:
      name: multiqc
      owner: iuc
      changeset_revision: 94b6bea727ae
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      results_0|software_cond|output_0|input: fastqc/text_file
      results_1|software_cond|input: trim_primers/report
    out:
    - id: html_report
    state:
      results:
      - software_cond:
          software: fastqc
          output:
          - type: data
      - software_cond:
          software: cutadapt
      title: OceanOmics amplicon QC
      comment: ""
      export: false
      flat: false
      png_plots: false
  sort_reads:
    tool_id: __APPLY_RULES__
    tool_version: 1.1.0
    doc: Sort the paired collection by sample identifier before DADA2 (IWC amplicon/dada2/dada2_paired 'Sort samples').
    in:
      input: trim_leftover_primers/out_pairs
    out:
    - id: output
    state:
      rules:
        mapping:
        - columns:
          - 0
          type: list_identifiers
        - columns:
          - 1
          type: paired_identifier
        rules:
        - type: add_column_metadata
          value: identifier0
        - type: add_column_metadata
          value: identifier1
        - type: sort
          numeric: false
          target_column: 0
  dada2_filter_trim:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/dada2_filterandtrim/dada2_filterAndTrim/1.38.0+galaxy2
    tool_version: 1.38.0+galaxy2
    tool_shed_repository:
      name: dada2_filterandtrim
      owner: iuc
      changeset_revision: ad574c1621ac
      tool_shed: toolshed.g2.bx.psu.edu
    doc: Source DADA2_FILTERANDTRIM passes only minLen/maxLen; other filterAndTrim arguments keep DADA2 defaults.
    in:
      paired_cond|reads: sort_reads/output
      filter|minLen: read_minlen
      filter|maxLen: read_maxlen
    out:
    - id: paired_output
    - id: outtab
    state:
      paired_cond:
        paired_select: paired
      trim:
        truncQ: 2
        trimLeft: 0
        trimRight: 0
        truncLen: 0
      filter:
        maxN: 0
        minQ: 0
      seprev_cond:
        seprev_select: "no"
      rmPhiX: true
      rmlowcomplex: 0
      output_statistics: true
  unzip_filtered:
    tool_id: __UNZIP_COLLECTION__
    tool_version: 1.0.0
    in:
      input: dada2_filter_trim/paired_output
    out:
    - id: forward
    - id: reverse
  dada2_learn_errors_fwd:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/dada2_learnerrors/dada2_learnErrors/1.38.0+galaxy2
    tool_version: 1.38.0+galaxy2
    tool_shed_repository:
      name: dada2_learnerrors
      owner: iuc
      changeset_revision: 9e5c3d358b2c
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      fls: unzip_filtered/forward
    out:
    - id: errors
    state:
      nbases: 8
      advanced:
        errfoo: loessErrfun
        randomize: false
        maxconsist: 10
        omegac: 0
      plotopt:
        obs: true
        err_out: true
        err_in: false
        nominalQ: true
  dada2_learn_errors_rev:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/dada2_learnerrors/dada2_learnErrors/1.38.0+galaxy2
    tool_version: 1.38.0+galaxy2
    tool_shed_repository:
      name: dada2_learnerrors
      owner: iuc
      changeset_revision: 9e5c3d358b2c
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      fls: unzip_filtered/reverse
    out:
    - id: errors
    state:
      nbases: 8
      advanced:
        errfoo: loessErrfun
        randomize: false
        maxconsist: 10
        omegac: 0
      plotopt:
        obs: true
        err_out: true
        err_in: false
        nominalQ: true
  dada2_dada_fwd:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/dada2_dada/dada2_dada/1.38.0+galaxy2
    tool_version: 1.38.0+galaxy2
    tool_shed_repository:
      name: dada2_dada
      owner: iuc
      changeset_revision: d16fa2560df4
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      batch_cond|derep: unzip_filtered/forward
      batch_cond|pool: asv_pooled
      err: dada2_learn_errors_fwd/errors
    out:
    - id: data_collection
    state:
      batch_cond:
        batch_select: "no"
      advanced:
        enable: "no"
  dada2_dada_rev:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/dada2_dada/dada2_dada/1.38.0+galaxy2
    tool_version: 1.38.0+galaxy2
    tool_shed_repository:
      name: dada2_dada
      owner: iuc
      changeset_revision: d16fa2560df4
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      batch_cond|derep: unzip_filtered/reverse
      batch_cond|pool: asv_pooled
      err: dada2_learn_errors_rev/errors
    out:
    - id: data_collection
    state:
      batch_cond:
        batch_select: "no"
      advanced:
        enable: "no"
  dada2_merge_pairs:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/dada2_mergepairs/dada2_mergePairs/1.38.0+galaxy2
    tool_version: 1.38.0+galaxy2
    tool_shed_repository:
      name: dada2_mergepairs
      owner: iuc
      changeset_revision: 46680b007c51
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      dadaF: dada2_dada_fwd/data_collection
      dadaR: dada2_dada_rev/data_collection
      derepF: unzip_filtered/forward
      derepR: unzip_filtered/reverse
      minOverlap: asv_min_overlap
      maxMismatch: asv_max_mismatch
    out:
    - id: merged
    state:
      justConcatenate: false
      trimOverhang: false
      output_details: false
  dada2_make_sequence_table:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/dada2_makesequencetable/dada2_makeSequenceTable/1.38.0+galaxy2
    tool_version: 1.38.0+galaxy2
    tool_shed_repository:
      name: dada2_makesequencetable
      owner: iuc
      changeset_revision: ab69311d2da2
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      samples: dada2_merge_pairs/merged
    out:
    - id: stable
    state:
      orderBy: abundance
      filter_cond:
        filter_select: "no"
      plot: false
  dada2_remove_chimeras:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/dada2_removebimeradenovo/dada2_removeBimeraDenovo/1.38.0+galaxy2
    tool_version: 1.38.0+galaxy2
    tool_shed_repository:
      name: dada2_removebimeradenovo
      owner: iuc
      changeset_revision: ddf5bcfde13d
      tool_shed: toolshed.g2.bx.psu.edu
    doc: Source DADA2_REMOVEBIMERADENOVO uses method = "pooled".
    in:
      unqs: dada2_make_sequence_table/stable
    out:
    - id: stable_sequencetable
    state:
      method: pooled
  dada2_seq_counts:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/dada2_seqcounts/dada2_seqCounts/1.38.0+galaxy2
    tool_version: 1.38.0+galaxy2
    tool_shed_repository:
      name: dada2_seqcounts
      owner: iuc
      changeset_revision: dc4e8088b896
      tool_shed: toolshed.g2.bx.psu.edu
    doc: Replaces source DADA2_TRACKREADS (read retention per stage).
    in:
      inrep_0|input: dada2_filter_trim/outtab
      inrep_1|input: dada2_dada_fwd/data_collection
      inrep_2|input: dada2_dada_rev/data_collection
      inrep_3|input: dada2_merge_pairs/merged
      inrep_4|input: dada2_make_sequence_table/stable
      inrep_5|input: dada2_remove_chimeras/stable_sequencetable
    out:
    - id: counts
    state:
      inrep:
      - name: FiltTrim
      - name: Dada Fwd
      - name: Dada Rev
      - name: MakePairs
      - name: SeqTab
      - name: Bimera
  asv_final_outputs:
    doc: Source DADA2_FINALOUTPUTS (R) reimplemented over the Galaxy dada2_sequencetable layout.
    run:
      class: GalaxyUserTool
      id: oceanomics_dada2_final_outputs
      version: 1.0.1
      name: DADA2 ASV final outputs
      description: name ASVs and write ASV FASTA, ASV table and LCA input table
      license: MIT
      container: quay.io/biocontainers/gawk:5.1.0--2
      configfiles:
      - filename: final_outputs.awk
        content: |
          BEGIN { FS = OFS = "\t" }
          NR == 1 {
            n = NF - 1
            if (n < 2) { print "Error: Couldn't create DADA2 final outputs. At least two samples are needed." > "/dev/stderr"; exit 1 }
            hdr = ""
            for (i = 2; i <= NF; i++) hdr = hdr OFS $i
            print "ASV" hdr, "ASV_sequence" > "asv_final_table.tsv"
            print "#ID" hdr > "lca_input.tsv"
            next
          }
          {
            id = "ASV_" (NR - 1)
            counts = ""
            for (i = 2; i <= NF; i++) counts = counts OFS $i
            print ">" id > "asv.fa"
            print $1 > "asv.fa"
            print id counts, $1 > "asv_final_table.tsv"
            print id counts > "lca_input.tsv"
          }
      shell_command: awk -f final_outputs.awk '$(inputs.seqtab.path)'
      inputs:
      - name: seqtab
        type: data
        format:
        - dada2_sequencetable
        label: Chimera-free DADA2 sequence table (sequences x samples)
      outputs:
      - name: asv_fasta
        type: data
        format: fasta
        from_work_dir: asv.fa
        label: ASV sequences
      - name: asv_table
        type: data
        format: tabular
        from_work_dir: asv_final_table.tsv
        label: ASV table with sequences
      - name: asv_lca_input
        type: data
        format: tabular
        from_work_dir: lca_input.tsv
        label: ASV count table for LCA (#ID header)
      help:
        format: markdown
        content: |
          Port of OceanOmics-amplicon-nf DADA2_FINALOUTPUTS. ASVs are numbered ASV_1..ASV_n in sequence-table
          row order (abundance order from makeSequenceTable). Fails with fewer than two samples, as the source does.
    in:
      seqtab: dada2_remove_chimeras/stable_sequencetable
    out:
    - id: asv_fasta
    - id: asv_table
    - id: asv_lca_input
  relabel_reads:
    doc: Source FASTQRELABEL; authored GalaxyUserTool (no shed wrapper relabels to the element identifier).
    run:
      class: GalaxyUserTool
      id: oceanomics_fastq_relabel
      version: 1.0.1
      name: Relabel FASTQ headers with sample name
      description: set every read header to the dataset's collection element identifier
      license: MIT
      container: quay.io/biocontainers/gawk:5.1.0--2
      requirements: []
      shell_command: |
        { if gzip -t '$(inputs.reads.path)' 2>/dev/null; then zcat '$(inputs.reads.path)'; else cat '$(inputs.reads.path)'; fi; } | awk -v s='$(inputs.reads.element_identifier)' 'NR % 4 == 1 {print "@" s; next} {print}' | gzip -c > relabeled.fq.gz
      inputs:
      - name: reads
        type: data
        format:
        - fastqsanger.gz
        - fastqsanger
        label: Reads for one sample (map over a list keyed by sample name)
      outputs:
      - name: relabeled
        type: data
        format: fastqsanger.gz
        from_work_dir: relabeled.fq.gz
        label: Relabelled reads
      help:
        format: markdown
        content: |
          Port of OceanOmics-amplicon-nf FASTQRELABEL. Replaces each FASTQ header with `@<sample>`, where
          the sample is the collection element identifier of the input, so pooled reads keep their sample
          for `vsearch --usearch_global --otutabout`.
    in:
      reads: adapterremoval_collapse/collapsed
    out:
    - id: relabeled
  adapterremoval_collapse:
    doc: "Source ADAPTERREMOVAL (2.3.2). replace-tool: iuc adapter_removal is not installed on test.galaxyproject.org; user tool runs the source's exact version and flags."
    run:
      class: GalaxyUserTool
      id: oceanomics_adapterremoval_collapse
      version: 2.3.2
      name: AdapterRemoval collapse read pairs (OceanOmics)
      description: merge overlapping read pairs and quality-trim, keeping collapsed reads
      license: MIT
      container: quay.io/biocontainers/adapterremoval:2.3.2--hb7ba0dd_0
      shell_command: |
        AdapterRemoval --threads \${GALAXY_SLOTS:-1} --file1 '$(inputs.reads.elements.forward.path)' --file2 '$(inputs.reads.elements.reverse.path)' --basename ar --collapse --trimns --trimqualities --minquality $(inputs.minquality) --minalignmentlength $(inputs.minalignmentlength) &&
        sed 's/^@M_/@/; s/^@MT_/@/' ar.collapsed | gzip -c > collapsed.fq.gz
      inputs:
      - name: reads
        type: data_collection
        collection_type: paired
        format:
        - fastqsanger.gz
        - fastqsanger
        label: Paired reads for one sample
      - name: minquality
        type: integer
        value: 10
        label: Minimum base quality (--minquality)
      - name: minalignmentlength
        type: integer
        value: 6
        label: Minimum overlap for collapsing (--minalignmentlength)
      outputs:
      - name: collapsed
        type: data
        format: fastqsanger.gz
        from_work_dir: collapsed.fq.gz
        label: Collapsed reads
      help:
        format: markdown
        content: |
          Port of OceanOmics-amplicon-nf ADAPTERREMOVAL (paired branch, AdapterRemoval 2.3.2):
          `--collapse --trimns --trimqualities --minquality 10 --minalignmentlength 6`, keeping `.collapsed` reads
          with the M_/MT_ header prefixes removed.
    in:
      reads: trim_leftover_primers/out_pairs
    out:
    - id: collapsed
    state:
      minquality: 10
      minalignmentlength: 6
  pool_reads:
    tool_id: toolshed.g2.bx.psu.edu/repos/nml/collapse_collections/collapse_dataset/5.1.0
    tool_version: 5.1.0
    tool_shed_repository:
      name: collapse_collections
      owner: nml
      changeset_revision: 90981f86000f
      tool_shed: toolshed.g2.bx.psu.edu
    doc: Source FASTQCONCAT (zcat | gzip); gzip members concatenate into a valid fastqsanger.gz.
    in:
      input_list: relabel_reads/relabeled
    out:
    - id: output
      change_datatype: fastqsanger.gz
    state:
      one_header: false
      filename:
        add_name: false
  fastq_to_fasta:

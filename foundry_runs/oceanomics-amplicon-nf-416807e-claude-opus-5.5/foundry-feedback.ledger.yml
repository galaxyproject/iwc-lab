  kind: friction
  severity: minor
  what: The procedure says 'find the closest workflow and rank it' over a cloned IWC tree but supplies no retrieval aid (no index, no tool-id/domain query command, no packaged corpus survey); the skill
    grepped .ga files for tool ids and directory names by hand. The convert reference was the only CLI packaged.

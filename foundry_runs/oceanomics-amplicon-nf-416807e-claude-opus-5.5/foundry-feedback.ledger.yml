- id: draft-format-identity-pin-vs-versioned-tool-id
  raised_by: nextflow-summary-to-galaxy-template
  observed_in:
    mold: nextflow-summary-to-galaxy-template
    path: content/molds/nextflow-summary-to-galaxy-template/index.md
    revision: 10
    content_hash: 77f885d640900cca7dac4a3bbb33308d4d8065e871c919c672487db61caf93ab
    foundry_head: ae8beb6df85b09a61706d0f6990e99bccd718394
  subject:
    kind: research
    label: galaxy-workflow-draft-format
    locator: content/research/galaxy-workflow-draft-format/index.md
  kind: friction
  severity: minor
  what: 'The Identity-pinned tier says ''concrete tool_id with tool_version: TODO (changeset deferred)'', but Tool Shed tool ids embed the version (…/dada2_dada/dada2_dada/1.38.0+galaxy1). Pinning identity
    therefore also pins a version inside tool_id while tool_version says TODO, and the note does not say whether to write the versionless guid prefix, the exemplar''s full id, or which wins when they disagree.'
  expected: State that an identity-pinned Tool Shed step uses the versionless guid (toolshed/repos/owner/repo/tool_id) or explicitly allow the exemplar's full versioned id with tool_version TODO meaning
    'confirm or bump', and say how discover-shed-tool should treat an embedded version.
  evidence: 'Draft pins 22 steps with full versioned ids taken from IWC exemplars (dada2 1.38.0+galaxy1, cutadapt 5.2+galaxy2, multiqc 1.35+galaxy4) plus tool_version: TODO; draft-validate accepted it.'
  status: open
  issue: null

entries:
- id: summarize-nextflow-cli-drops-draft07-definitions-params
  raised_by: summarize-nextflow
  observed_in:
    mold: summarize-nextflow
    path: content/molds/summarize-nextflow/index.md
    revision: 18
    content_hash: fb19fff9162cc36fae916a456cfbbe31a33c4565063a522846c48222d02f7c37
    foundry_head: d1b4cabede5bc91a5ab8603d5c2d589ad7f0d100
  subject:
    kind: cli-command
    label: foundry summarize-nextflow (@galaxy-foundry/gxwf-foundry)
    locator: content/cli/foundry/index.md
  kind: defect
  severity: major
  what: 'foundry summarize-nextflow emitted params: [] and sample_sheets: [] for a draft-07 nextflow_schema.json whose groups live under ''definitions'' (106 schema params) and whose input property carries
    schema: assets/schema_input.json.'
  expected: Read both draft-07 'definitions' and 2020-12 '$defs' groups when extracting params[]; apply the sample-sheet branch whenever a param carries 'schema:'.
  evidence: OceanOmics-amplicon-nf @416807e (legacy nf-core template, ad-hoc DSL2). Skill rebuilt 109 params (106 schema + params-block-only) by hand.
  status: filed
  issue: https://github.com/galaxyproject/foundry/issues/771
- id: summarize-nextflow-cli-ignores-literal-container-directives
  raised_by: summarize-nextflow
  observed_in:
    mold: summarize-nextflow
    path: content/molds/summarize-nextflow/index.md
    revision: 18
    content_hash: fb19fff9162cc36fae916a456cfbbe31a33c4565063a522846c48222d02f7c37
    foundry_head: d1b4cabede5bc91a5ab8603d5c2d589ad7f0d100
  subject:
    kind: cli-command
    label: foundry summarize-nextflow (@galaxy-foundry/gxwf-foundry)
    locator: content/cli/foundry/index.md
  kind: defect
  severity: major
  what: 'tools[] held 4 entries for 76 processes. Single-literal container directives (container ''quay.io/biocontainers/blast:2.13.0--hf3cf87c_0'') were copied to processes[].container but never resolved
    into tools[] or processes[].tool. FASTQCONCAT (ubuntu image, zcat|gzip) got tool FK ''fastqc'' and CUSTOM_DUMPSOFTWAREVERSIONS got ''multiqc'' by name/conda only. BLAST_MAKEBLASTDB''s directive written
    with no space (container''quay.io/...'') was dropped entirely (container: null).'
  expected: Resolve literal container strings through the same biocontainer/docker/singularity classifier used for ternaries; never assign a tool FK by name substring; tolerate a missing space after the
    directive keyword.
  evidence: 'After hand resolution: 28 tools, 44 processes with a tool FK.'
  status: filed
  issue: https://github.com/galaxyproject/foundry/issues/772
- id: summarize-nextflow-cli-misses-backslash-multi-alias-include
  raised_by: summarize-nextflow
  observed_in:
    mold: summarize-nextflow
    path: content/molds/summarize-nextflow/index.md
    revision: 18
    content_hash: fb19fff9162cc36fae916a456cfbbe31a33c4565063a522846c48222d02f7c37
    foundry_head: d1b4cabede5bc91a5ab8603d5c2d589ad7f0d100
  subject:
    kind: cli-command
    label: foundry summarize-nextflow (@galaxy-foundry/gxwf-foundry)
    locator: content/cli/foundry/index.md
  kind: defect
  severity: minor
  what: include { SEQKIT_STATS as \ ASSIGNED_STATS; SEQKIT_STATS as \ UNKNOWN_STATS; SEQKIT_STATS as \ RAW_STATS } (line-continued, semicolon-separated) produced no aliases, and the subworkflow calls[]
    omitted them. Two module files declaring process GET_AQUAMAP_PROBS (one never included) produced two processes[] rows with the same name, breaking name-as-key lookups.
  expected: Parse semicolon-separated and backslash-continued alias lists; on duplicate process names keep the declaration reached by a live include and warn about the shadowed one.
  evidence: subworkflows/local/cutadapt_workflow.nf, alt_cutadapt_workflow.nf; modules/local/custom/nctocsv vs getaquamapprobs.
  status: open
  issue: null
- id: summarize-nextflow-cli-test-candidate-profile-default-and-inputs
  raised_by: summarize-nextflow
  observed_in:
    mold: summarize-nextflow
    path: content/molds/summarize-nextflow/index.md
    revision: 18
    content_hash: fb19fff9162cc36fae916a456cfbbe31a33c4565063a522846c48222d02f7c37
    foundry_head: d1b4cabede5bc91a5ab8603d5c2d589ad7f0d100
  subject:
    kind: cli-command
    label: foundry summarize-nextflow (@galaxy-foundry/gxwf-foundry)
    locator: content/cli/foundry/index.md
  kind: defect
  severity: major
  what: With no --profile passed, the CLI defaulted to 'test' and wrote rationale 'explicit caller profile override'. The candidate's inputs[] listed only the samplesheet plus the inherited nextflow.config
    aquamaps_db (described 'from test'), omitting raw_data, filter_table and the 9-URL list-valued dbfiles that conf/test.config sets; params_delta also dropped dbfiles and several numeric overrides.
  expected: Do not silently default --profile (the Mold says there is no silent default), or label it as a default; extract every URL-valued param including list values into inputs[]; mark inherited defaults
    as inherited.
  evidence: conf/test.config sets input, dbfiles[9], raw_data, filter_table and 10 numeric params; candidate had 2 inputs.
  status: filed
  issue:
  - https://github.com/galaxyproject/foundry/issues/666#issuecomment-6786392585
  - https://github.com/galaxyproject/foundry/issues/763
- id: summarize-nextflow-samplesheet-schema-vs-live-consumer-drift
  raised_by: summarize-nextflow
  observed_in:
    mold: summarize-nextflow
    path: content/molds/summarize-nextflow/index.md
    revision: 18
    content_hash: fb19fff9162cc36fae916a456cfbbe31a33c4565063a522846c48222d02f7c37
    foundry_head: d1b4cabede5bc91a5ab8603d5c2d589ad7f0d100
  subject:
    kind: mold
    label: summarize-nextflow procedure
    locator: content/molds/summarize-nextflow/index.md
    content_hash: fb19fff9162cc36fae916a456cfbbe31a33c4565063a522846c48222d02f7c37
  kind: gap
  severity: minor
  what: '§3.5 ranks nf-schema discovery first and treats the schema: file as authoritative, but here assets/schema_input.json (sample,fastq_1,fastq_2) disagrees with the live consumer bin/check_samplesheet.py
    + splitCsv (samp_name, fw_index, rv_index required in default demux mode). The procedure gives no rule for which wins or how to record the conflict.'
  expected: 'When a schema: file and a live splitCsv/validator both exist, record the shape the workflow actually consumes, keep schema_path, and require a warnings[] entry naming the drift.'
  evidence: 'Skill chose discovered_via: splitCsv with columns from check_samplesheet.py and warned; the published test samplesheet itself uses ''sample'' and would fail SAMPLESHEET_CHECK.'
  status: open
  issue: null
- id: summary-nextflow-schema-no-field-for-ext-args
  raised_by: summarize-nextflow
  observed_in:
    mold: summarize-nextflow
    path: content/molds/summarize-nextflow/index.md
    revision: 18
    content_hash: fb19fff9162cc36fae916a456cfbbe31a33c4565063a522846c48222d02f7c37
    foundry_head: d1b4cabede5bc91a5ab8603d5c2d589ad7f0d100
  subject:
    kind: schema
    label: summary-nextflow schema
    locator: package://@galaxy-foundry/summarize-nextflow#summaryNextflowSchema
    content_hash: 839e11b1892af74df3158377027e7d340a67dafdb9b5965d79e9715a1a109d54
  kind: gap
  severity: major
  what: The summary schema has nowhere to record per-process task.ext.args / args1 / args2 / prefix / when from conf/modules.config withName blocks. In this pipeline nearly all tool parameters (cutadapt
    barcode/error settings, DADA2 filterAndTrim/mergePairs, BLAST pid/qcov/evalue/outfmt columns, LULU minimum_match, vsearch minsize) live there, so the summary alone cannot drive Galaxy tool-state choices.
  expected: Add an optional processes[].ext block (or a top-level process_config[] keyed by withName selector) carrying verbatim ext.* expressions and the params they reference, populated deterministically
    from conf/modules.config.
  evidence: conf/modules.config has 70+ withName blocks; recorded only as a warnings[] pointer telling downstream molds to read the file directly.
  status: duplicate
  issue: https://github.com/galaxyproject/foundry/issues/665
- id: summarize-nextflow-procedure-omits-foundry-cli-entrypoint
  raised_by: summarize-nextflow
  observed_in:
    mold: summarize-nextflow
    path: content/molds/summarize-nextflow/index.md
    revision: 18
    content_hash: fb19fff9162cc36fae916a456cfbbe31a33c4565063a522846c48222d02f7c37
    foundry_head: d1b4cabede5bc91a5ab8603d5c2d589ad7f0d100
  subject:
    kind: mold
    label: summarize-nextflow procedure
    locator: content/molds/summarize-nextflow/index.md
    content_hash: fb19fff9162cc36fae916a456cfbbe31a33c4565063a522846c48222d02f7c37
  kind: friction
  severity: minor
  what: The procedure names a standalone summarize-nextflow bin (@galaxy-foundry/summarize-nextflow) as the preferred generator, but the required-tools block installs only @galaxy-foundry/gxwf-foundry,
    whose 'foundry summarize-nextflow' subcommand is what is available. Its defaults (profile=test, nextflow shell-out) and which fields the skill must enrich afterwards (script_summary, edges, conditionals)
    are not described.
  expected: Point at 'foundry summarize-nextflow' as the deterministic pass, state its defaults, and list which fields the skill must enrich or audit afterwards.
  evidence: Subcommand discovered via foundry --help; CLI output had 0 script_summary, 0 conditionals, edges only from naive regex.
  status: open
  issue: null
- id: refdata-classification-misses-hidden-runtime-references
  raised_by: nextflow-summary-to-galaxy-reference-data
  observed_in:
    mold: nextflow-summary-to-galaxy-reference-data
    path: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
    revision: 5
    content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
    foundry_head: e2c26d735ea338046c61917fcf7627a7f1dc462e
  subject:
    kind: research
    label: nextflow-reference-data-classification
    locator: content/research/nextflow-reference-data-classification/index.md
    content_hash: 2b33f3bddb635c9d700e506784b4bf16f8c387369bc66194a15cb75be9ad8a1f
  kind: gap
  severity: major
  what: 'The eight classifications cover only param-declared assets. This pipeline''s load-bearing references have no param: LCA''s script wgets NCBI new_taxdump at run time, the NBC classifier loads models
    baked into its container, LCA_WITH_FISHBASE reads a hard-coded WoRMS URL, and the aquamaps_db fallback downloads NetCDF from a public server. Following the Mold literally (do not re-parse source) would
    miss all of them, and fetch-if-missing is not the same as the compute-if-missing rebuild class.'
  expected: Add a 'hidden / runtime-fetched reference' classification (network fetch inside script or bin/, container-baked model/DB, hard-coded URL channel) and a 'fetch-if-missing' variant, with the Galaxy
    mapping (promote to explicit input; else pin container and flag), and have summarize-nextflow surface such evidence.
  evidence: Found only by reading bin/runAssign_collapsedTaxonomy.py, the OCOMNBC module and workflows/oceanomics_amplicon.nf ch_worms; the summary carried them only as a warnings[] string the phase-1 skill
    wrote by hand.
  status: open
  issue: null
- id: refdata-mapping-no-blastdb-guidance
  raised_by: nextflow-summary-to-galaxy-reference-data
  observed_in:
    mold: nextflow-summary-to-galaxy-reference-data
    path: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
    revision: 5
    content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
    foundry_head: e2c26d735ea338046c61917fcf7627a7f1dc462e
  subject:
    kind: research
    label: nextflow-to-galaxy-reference-data-mapping datatype table
    locator: content/research/nextflow-to-galaxy-reference-data-mapping/index.md
    content_hash: 4676cdf3de4bcec6161b6102c9e842efa7b3c953f9c2f2787b4debea48e4a7eb
  kind: gap
  severity: minor
  what: The datatype table covers genomics indexes but not BLAST databases (blastdbn/blastdbp composites), and gives no rule for a prebuilt multi-file DB passed as a glob (BLAST v5 .ndb/.nhr/.../.nto),
    the common reference shape for amplicon/eDNA and metagenomics pipelines; nor does it say that rebuilding from FASTA loses an embedded taxid map.
  expected: Add blastdbn/blastdbp rows, note the v5 extra-volume question for composite upload, and give the default posture for prebuilt DB volume globs (composite upload vs FASTA + makeblastdb -taxid_map).
  evidence: params.dbfiles in conf/test.config is a 9-URL list of v5 volumes with no FASTA; the brief had to leave the shape as OQ-1.
  status: open
  issue: null
- id: interface-no-rule-for-entry-branch-selection
  raised_by: nextflow-summary-to-galaxy-interface
  observed_in:
    mold: nextflow-summary-to-galaxy-interface
    path: content/molds/nextflow-summary-to-galaxy-interface/index.md
    revision: 6
    content_hash: 43966773391578490688098c9333f6eb2eaa94574755f5b6554e7f9b72a605c0
    foundry_head: e2c26d735ea338046c61917fcf7627a7f1dc462e
  subject:
    kind: research
    label: nextflow-params-to-galaxy-inputs
    locator: content/research/nextflow-params-to-galaxy-inputs/index.md
    content_hash: b65bf1a16cb986bc04ff7926e6ca0eea9ce35980aa4d4c47d8a102a28ffae085
  kind: gap
  severity: major
  what: 'The source has several mutually exclusive entry modes that change what the top-level inputs are: default demux from raw pooled reads + barcode samplesheet, alt_demux, skip_demux (per-sample fastq),
    start_from_blast and start_from_lca (fasta + OTU table). The params note classifies skip_/mode flags one param at a time but gives no rule for choosing which entry branch defines the Galaxy interface,
    or for when the source''s own test profile cannot exercise the default branch.'
  expected: 'Add an ''entry-branch selection'' step: enumerate guard-selected entry modes from workflow.conditionals[] and channel materializations, pick the one the selected test candidate can actually
    exercise (else the default), and record the others as kind: dropped with citations.'
  evidence: Skill picked skip_demux because conf/test.config raw_data is a single R1 into fromFilePairs and the test samplesheet fails SAMPLESHEET_CHECK; that reasoning appears in no packaged note.
  status: open
  issue: null
- id: interface-no-guidance-for-config-preset-maps
  raised_by: nextflow-summary-to-galaxy-interface
  observed_in:
    mold: nextflow-summary-to-galaxy-interface
    path: content/molds/nextflow-summary-to-galaxy-interface/index.md
    revision: 6
    content_hash: 43966773391578490688098c9333f6eb2eaa94574755f5b6554e7f9b72a605c0
    foundry_head: e2c26d735ea338046c61917fcf7627a7f1dc462e
  subject:
    kind: research
    label: nextflow-params-to-galaxy-inputs
    locator: content/research/nextflow-params-to-galaxy-inputs/index.md
    content_hash: b65bf1a16cb986bc04ff7926e6ca0eea9ce35980aa4d4c47d8a102a28ffae085
  kind: gap
  severity: minor
  what: params.assay indexes a config-load-time map (conf/assay_params.config) that overwrites eight scalar params (primers, length bounds, trim settings). It is the scalar analogue of the iGenomes key-expanded
    bundle, but neither the params note nor the reference-data notes say whether to expose the key as a restricted string, expand the presets into explicit scalars, or both.
  expected: 'State a default for preset-map keys: expose the derived scalars explicitly (defaults from the base params), and optionally list the preset table in the input help; never reproduce a config-time
    lookup inside Galaxy.'
  evidence: nextflow.config lines 'if (params.assay) { params.fw_primer = params.assay_params[params.assay][...] }'; summary records the eight params with source_kind computed.
  status: open
  issue: null
- id: operators-note-no-recipe-for-key-rewriting-map-mix-join
  raised_by: nextflow-summary-to-galaxy-data-flow
  observed_in:
    mold: nextflow-summary-to-galaxy-data-flow
    path: content/molds/nextflow-summary-to-galaxy-data-flow/index.md
    revision: 8
    content_hash: f71cc2b4ceb115d7d93c3dd2e622cbfafb8b9f338f1dd450ee5773f3c0a0e247
    foundry_head: ae8beb6df85b09a61706d0f6990e99bccd718394
  subject:
    kind: research
    label: nextflow-operators-to-galaxy-collection-recipes
    locator: content/research/nextflow-operators-to-galaxy-collection-recipes/index.md
    content_hash: 59d97f05e7839f78cb7f42e17299fe6bc373bde8a32eca506238633a3dff9282
  kind: gap
  severity: major
  what: The pipeline's dominant topology is string-keyed tuples whose key is rewritten by map closures (prefix + '_' + params.dbname, + '_lulucurated'), duplicated via mix of relabelled copies, then re-joined
    by key across three or four channels. The note treats map that mutates metadata only as a user-review trigger and gives no recipe for it; the skill had to invent 'parallel lists keyed by element identifier
    + relabel-suffix + merge-collections + multi-input map-over'.
  expected: 'Add a recipe for keyed fan-out: when tuple keys are non-sample labels (method/variant prefixes), model them as element identifiers of parallel list collections; map(key rewrite) → identifier
    relabel; mix of relabelled copies → merge collections; join(by key) → multi-input map-over with matching identifiers. Note when a constant suffix can be dropped.'
  evidence: workflows/oceanomics_amplicon.nf lines 459-529, 569-689, 699-740, 769-779 (summary edges flag them low confidence).
  status: open
  issue: null
- id: operators-note-no-split-chunk-scatter-recipe
  raised_by: nextflow-summary-to-galaxy-data-flow
  observed_in:
    mold: nextflow-summary-to-galaxy-data-flow
    path: content/molds/nextflow-summary-to-galaxy-data-flow/index.md
    revision: 8
    content_hash: f71cc2b4ceb115d7d93c3dd2e622cbfafb8b9f338f1dd450ee5773f3c0a0e247
    foundry_head: ae8beb6df85b09a61706d0f6990e99bccd718394
  subject:
    kind: research
    label: nextflow-operators-to-galaxy-collection-recipes
    locator: content/research/nextflow-operators-to-galaxy-collection-recipes/index.md
    content_hash: 59d97f05e7839f78cb7f42e17299fe6bc373bde8a32eca506238633a3dff9282
  kind: gap
  severity: minor
  what: 'splitFasta(by: N, file: true) → per-chunk process → groupTuple → concatenate is a performance-only scatter/gather. The note has no row for split* operators, so there is no guidance on whether to
    reproduce it (split + map-over + collapse) or drop it as a semantic no-op.'
  expected: 'Add split* operators (splitFasta, splitFastq, splitText) with a default: drop chunking that is followed by a pure gather/concatenate and record it as a dropped performance scatter; reproduce
    it only when chunks are consumed individually downstream.'
  evidence: 'ch_fasta_split = ch_fasta_filtered.splitFasta(by: 500, file: true) feeding BLAST_BLASTN then groupTuple + CONCAT_BLASTN_RESULTS.'
  status: open
  issue: null

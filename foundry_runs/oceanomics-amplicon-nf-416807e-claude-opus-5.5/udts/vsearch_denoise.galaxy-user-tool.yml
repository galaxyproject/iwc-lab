class: GalaxyUserTool
id: oceanomics_vsearch_cluster_unoise
version: 2.21.1
name: VSEARCH cluster_unoise denoising
description: denoise dereplicated amplicon reads into ZOTU centroids
license: MIT
container: quay.io/biocontainers/vsearch:2.21.1--h95f258a_0
shell_command: |
  vsearch --cluster_unoise '$(inputs.derep.path)' --minsize $(inputs.minsize) --centroids centroids.fa --threads \${GALAXY_SLOTS:-1} &&
  if [ ! -s centroids.fa ]; then echo "Error: 0 zotus after cluster_unoise; lower minsize" >&2; exit 1; fi
inputs:
  - name: derep
    type: data
    format: [fasta]
    label: Dereplicated reads with size annotations
  - name: minsize
    type: integer
    value: 8
    label: Minimum abundance (--minsize)
outputs:
  - name: centroids
    type: data
    format: fasta
    from_work_dir: centroids.fa
    label: Denoised centroids
help:
  format: markdown
  content: |
    Port of OceanOmics-amplicon-nf VSEARCH_CLUSTERUNOISE: `vsearch --cluster_unoise --minsize N --centroids`.

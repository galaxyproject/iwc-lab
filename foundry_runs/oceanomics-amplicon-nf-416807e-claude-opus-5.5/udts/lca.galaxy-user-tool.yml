class: GalaxyUserTool
id: oceanomics_lca
version: 1.0.0
name: OceanOmics BLAST LCA taxonomy
description: lowest common ancestor taxonomy per ASV/ZOTU from BLAST hits and NCBI ranked lineage
license: MIT
container: quay.io/biocontainers/python:3.9--1
configfiles:
- filename: run_lca.sh
  content: |
    set -euo pipefail
    # Ranked lineage from the workflow input, tab-stripped as the source does after its download.
    tr -d '\t' < '$(inputs.lineage.path)' > rankedlineage_tabRemoved.dmp
    # BLAST hits arrive in the source outfmt 6 column order (oceanomics_blastn_v5db).
    sort -k1,1 '$(inputs.blast.path)' > sorted_BLAST.tsv
    # Append each query's sequence to its BLAST rows (source LCA module).
    awk 'BEGIN { RS = ">" } NR > 1 { n = split($0, l, "\n"); split(l[1], h, " "); s = ""; for (i = 2; i <= n; i++) s = s l[i]; print h[1] "\t" s }' '$(inputs.fasta.path)' | sort -k1,1 > sorted_id_to_seq.tsv
    awk -F'\t' 'FNR == NR { seq[$1] = $2; next } { s = ($1 in seq ? seq[$1] : "NA"); print $0 "\t" s }' sorted_id_to_seq.tsv sorted_BLAST.tsv > BLAST_with_seq.tsv
    python3 runAssign_collapsedTaxonomy.py '$(inputs.table.path)' BLAST_with_seq.tsv $(inputs.qcov) $(inputs.pid) $(inputs.diff) lca_output.tab '$(inputs.db_label)'
    sed 's/"//g' taxa_raw.tsv > taxa_raw_clean.tsv
    sed 's/"//g' taxa_final.tsv > taxa_final_clean.tsv
    rows=`awk 'END { print NR - 1 }' lca_output.tab`
    if [ "$rows" -lt 2 ]; then
      echo "Error: LCA results have less than 2 OTUs left; change lca_qcov, lca_pid or lca_diff" >&2
      exit 1
    fi
- filename: runAssign_collapsedTaxonomy.py
  content: |
    #!/usr/bin/env python

    # USAGE: python nameOfThisScript.py
    # This script takes some user inputs (i.e. blast results, Zotu/otu table)
    # and thresholds defined by user (qCov, %identity, difference between %identity)
    # Then it will link it to an NCBI taxonomy file and Zotu/Otu table file

    # By Mahsa Mousavi-Derazmahalleh ; Python V3

    import subprocess
    import sys

    # import supporting functions used in the code below
    import working_function as wf

    # define commands for downloading taxonomy database from NCBI and saving it in a folder with the current date
    # if folder exists, it overwrites it
    getLineage = """
    true
    """  # Galaxy port: lineage is staged from the taxonomy_lineage input, no download

    # create a child bash process
    process = subprocess.Popen(
        "/bin/bash", stdin=subprocess.PIPE, stdout=subprocess.PIPE, universal_newlines=True
    )
    ## execute getLineage command and print output on the screen
    out, err = process.communicate(getLineage)
    out


    # setting up input parameters
    tableFile = str(sys.argv[1])
    blastFile = str(sys.argv[2])
    qCovLim = sys.argv[3]
    pidLim = sys.argv[4]
    pid_diffCut = sys.argv[5]
    db = sys.argv[7]

    # define output file, open it and redirect standard output to this file
    def_output = sys.stdout
    output = str(sys.argv[6])
    f = open(output, "w")
    sys.stdout = f

    # define main function of the script


    def main():
        # link filtered blast results with taxonomy information
        # results are saved in a temporary file called 'interMediate_res.tab'
        wf.link_TaxFilblast(blastFile, pid_diffCut, qCovLim, pidLim)

        # filter blast result file to get only unique hits based on taxonomy id,
        # and filter them based on query coverage, percentage identity and difference of them (Diff)
        n = wf.filterBlast(blastFile, pid_diffCut, qCovLim, pidLim)

        # link zotu table and store the values (table) and header (lable)
        table = wf.link_OTUtable(tableFile)["tableDict"]
        lable = wf.link_OTUtable(tableFile)["lableDict"]

        # print the header to the output file
        for lab in lable:
            print(
                "domain\tphylum\tclass\torder\tfamily\tgenus\tspecies\tOTU\tnumberOfUnq_BlastHits\t%ID"
                + "\t"
                + str("\t".join(lable[lab]))
            )

        # open filtered blast results temporary file
        with open("interMediate_res.tab", "r") as file:
            acc = [[]]  # make an empty list to store data
            acc_total = [[]]  # make an empty list to store all intermediate data for taxaRaw.csv
            i = 0  # define flag used to detect first line of the temporary file
            linenr = 0  # current line number
            loccnt = 6  # local column counter
            for line in file:
                # This will remove not helpfull assignments as set inside '' in below line,
                # but will still keep them in intermediate file for record
                if not any(
                    value in line
                    for value in (
                        "uncultured bacterium",
                        "uncultured organism",
                        "uncultured prokaryote",
                        "uncultured eukaryote",
                        "uncultured marine eukaryote",
                        "uncultured marine picoeukaryote",
                        "uncultured Chlorophyta",
                        "marine metazoan environmental sample",
                        "zooplankton environmental sample",
                        "uncultured fungus",
                        "uncultured metazoan",
                        "eukaryote marine clone",
                        "eukaryotic picoplankton environmental sample",
                        "uncultured alveolate",
                        "uncultured ciliate",
                        "uncultured Banisveld eukaryote",
                        "uncultured chlorophyta",
                        "uncultured prasinophyte",
                        "uncultured Rhizaria",
                        "uncultured stramenopile",
                        "uncultured microeukaryote",
                        "uncultured marine dinoflagellate",
                        "uncultured prasinophyte",
                        "uncultured Cryptophyta",
                        "Stramenopiles sp. MAST",
                        "eukaryote clone OLI11008",
                        "marine Metazoa environmental sample",
                        "Dinophyta sp.",
                        "invertebrate environmental sample",
                        "uncultured eukaryote",
                    )
                ):
                    # read line to the 'll' list
                    ll = line.strip().split("\t")
                    acc_total.append(ll[:])

                    # for the first line add value of the 'll' to the 'acc' list
                    if i == 0:
                        acc[0] = ll
                        i = 1  # set flag to 1 (processed first line)

                    # for the next lines
                    else:
                        # if the column 'OTU' is equal to the 'OTU' of the last line in acc
                        # compare remaining columns (number 0 - 6)
                        if ll[7] == acc[linenr][7]:
                            loccnt = 6  # reset column counter to the value 6

                            # for each column
                            while loccnt > 0:
                                # if the values are not equal, or one of them is empty,
                                # replace the column value in the last line of acc with phase "dropped"
                                # and repeat replacement for all columns after investigated column
                                # (current column to column number 6)
                                if ll[loccnt] != acc[linenr][loccnt] and (
                                    ll[loccnt] != "" or acc[linenr][loccnt] != ""
                                ):
                                    c = 6
                                    while c >= loccnt:
                                        acc[linenr][c] = "dropped"
                                        c -= 1

                                # if values are equal and not empty
                                # stop comparison process for this column
                                elif (
                                    ll[loccnt] == acc[linenr][loccnt]
                                    and ll[loccnt] != ""
                                    and acc[linenr][loccnt] != ""
                                ):
                                    break

                                # go to previous column
                                loccnt -= 1

                        # if 'OTU' is not equal, append it to the 'acc' list and move to next line
                        else:
                            acc.append(ll[:])
                            linenr += 1

        # linking of the Zotu with filtering and LCA taxonomy results
        for x in acc:
            try:
                # If the Zotu was found also in the dictionary of the table
                if x[6] in table:
                    # print it to the results file
                    print(
                        "NA\t"
                        + "\t".join(x[:7])
                        + "\t"
                        + str(n["vals"][x[6]])
                        + "\t"
                        + str(x[12])
                        + "\t"
                        + "\t".join(table[x[6]])
                    )
            except IndexError:
                sys.exit(
                    "LCA results empty, try lowering the '--lca_pid' value; Current '--lca_pid': "
                    + str(pidLim)
                )

        wf.create_taxaRaw(acc_total, db)
        wf.create_taxaFinal(acc, table, db)


    # end of the main function of the script


    # execute main function of the script
    main()

    # close output file
    f.close()

    # restore standard output to default
    sys.stdout = def_output

    # cleaning up temporary files
    cmd = """
    d="galaxy"
    true  # Galaxy port: keep rankedlineage_tabRemoved.dmp in place
    """
    process = subprocess.Popen(
        "/bin/bash", stdin=subprocess.PIPE, stdout=subprocess.PIPE, universal_newlines=True
    )
    out, err = process.communicate(cmd)
    out
- filename: working_function.py
  content: |
    #!/usr/bin/env python
    # These are all functions necessary to run the LCA script
    # By Mahsa Mousavi-Derazmahalleh ; Python V3


    # This function is to split the lines in blast result file
    def splitFile(ll):
        otuid = ll[0]  # otu id
        staxids = ll[2]  # taxonomy id
        pident = ll[6]  # percentage identity
        evalue = ll[18]  # evalue
        qcov = ll[20]  # query coverage
        sseqid = ll[1]  # subject sequence id
        commonames = ll[4]  # common name
        length = ll[7]  # length of alignment
        qlen = ll[8]  # query length
        slen = ll[9]  # sunject length
        sequence = ll[-1]
        accession_id = ll[1]
        verbatim_label = ll[17]
        return {
            "otuid": otuid,
            "staxids": staxids,
            "pident": pident,
            "evalue": evalue,
            "qcov": qcov,
            "sseqid": sseqid,
            "commonames": commonames,
            "length": length,
            "qlen": qlen,
            "slen": slen,
            "sequence": sequence,
            "accid": accession_id,
            "verbatim": verbatim_label
        }



    def create_taxaRaw(acc, db):
        f = open("taxa_raw.tsv", "w")
        f.write("seq_id\tdna_sequence\tdomain\tphylum\tclass\torder\tfamily\tgenus\tspecificEpithet\tscientificName\tscientificNameAuthorship\ttaxonRank\ttaxonID\ttaxonID_db\tverbatimIdentification\taccession_id\taccession_id_ref_db\tpercent_match\tpercent_query_cover\tconfidence_score\tidentificationRemarks\n")
        for x in acc:
            if x != []:
                split_line = x[-6].split("authority=(")
                try:
                    author = split_line[1].split(")] [")[0]
                except IndexError:
                    author = "not applicable: authorship info missing"
                if x[5] != '':
                    split_species = x[5].split(" ")
                    if len(split_species) == 1:
                        specificEpithet = split_species[0]
                    else:
                        if split_species[1] == "cf.":
                            specificEpithet = split_species[2]
                        else:
                            specificEpithet = split_species[1]
                else:
                    specificEpithet = x[4]

                if specificEpithet == "dropped":
                    if x[4] == "dropped":
                        if x[3] == "dropped":
                            if x[2] == "dropped":
                                if x[1] == "dropped":
                                    if x[0] == "dropped":
                                        level = "not applicable: taxonomy rank info missing"
                                    else:
                                        level = "phylum"
                                else:
                                    level = "class"
                            else:
                                level = "order"
                        else:
                            level = "family"
                    else:
                        level = "genus"
                else:
                    level = "species"

                f.write(
                    str(x[6]) + "\t" +
                    str(x[-1]) + "\t" +
                    "NA" + "\t" +
                    str(x[0]) + "\t" +
                    str(x[1]) + "\t" +
                    str(x[2]) + "\t" +
                    str(x[3]) + "\t" +
                    str(x[4]) + "\t" +
                    str(specificEpithet) + "\t" +
                    str(x[5]) + "\t" +
                    author + "\t" +
                    level + "\t" +
                    str(x[8]) + "\t" +
                    db + "\t" +
                    str(x[-6]) + "\t" +
                    str(x[7]) + "\t" +
                    db + "\t" +
                    str(x[12]) + "\t" +
                    str(x[-2]) + "\t" +
                    str(x[-5]) + "\t" +
                    "These results are produced by the LCA algorithm from eDNAFlow\n"
                )



    def create_taxaFinal(acc, table, db):
        f = open("taxa_final.tsv", "w")
        f.write("seq_id\tdna_sequence\tdomain\tphylum\tclass\torder\tfamily\tgenus\tspecificEpithet\tscientificName\tscientificNameAuthorship\ttaxonRank\ttaxonID\ttaxonID_db\tverbatimIdentification\taccession_id\taccession_id_ref_db\tpercent_match\tpercent_query_cover\tconfidence_score\tidentificationRemarks\n")
        for x in acc:
            if x[6] in table:
                split_line = x[-6].split("authority=(")
                try:
                    author = split_line[1].split(")] [")[0]
                except IndexError:
                    author = "not applicable: authorship info missing"
                if x[5] != '':
                    split_species = x[5].split(" ")
                    if len(split_species) == 1:
                        specificEpithet = split_species[0]
                    else:
                        if split_species[1] == "cf.":
                            specificEpithet = split_species[2]
                        else:
                            specificEpithet = split_species[1]
                else:
                    specificEpithet = x[5]

                if specificEpithet == "dropped":
                    if x[4] == "dropped":
                        if x[3] == "dropped":
                            if x[2] == "dropped":
                                if x[1] == "dropped":
                                    if x[0] == "dropped":
                                        level = "not applicable: taxonomy rank info missing"
                                    else:
                                        level = "phylum"
                                else:
                                    level = "class"
                            else:
                                level = "order"
                        else:
                            level = "family"
                    else:
                        level = "genus"
                else:
                    level = "species"

                f.write(
                    str(x[6]) + "\t" +
                    str(x[-1]) + "\t" +
                    str("NA") + "\t" +
                    str(x[0]) + "\t" +
                    str(x[1]) + "\t" +
                    str(x[2]) + "\t" +
                    str(x[3]) + "\t" +
                    str(x[4]) + "\t" +
                    str(specificEpithet) + "\t" +
                    str(x[5]) + "\t" +
                    author + "\t" +
                    level + "\t" +
                    str(x[8]) + "\t" +
                    db + "\t" +
                    str(x[-6]) + "\t" +
                    str(x[7]) + "\t" +
                    db + "\t" +
                    str(x[12]) + "\t" +
                    str(x[-2]) + "\t" +
                    str(x[-5]) + "\t" +
                    "These results are produced by the LCA algorithm from eDNAFlow\n"
                )



    """ This is to filter blast result file to get only unique hits based on taxonomy id (so if there are few hits to the same taxonomy id, only the 1st one is kept) and then filter them more """


    def filterBlast(filename, diff_lim, qCovThre, pidThre):
        taxidDict = {}  # a dictionary of otu as a key and taxonomy id as the value
        taxId_seen = set()  # keep taxonomy id which already seen
        unq = []  # for keeping the unique hits i.e. unique based on taxonomy id
        filunq = (
            []
        )  # an empty list to store result that pass initial qcov and percentage identity thresholds set by user
        vals = {}  # create a dictionary for otu>>>number of unique hits

        with open(filename, "r") as file:
            for line in file:
                bl = line.strip().split("\t")
                # store the result of the splitFile function in the value
                n = splitFile(bl)
                # To have multiple value for the same key
                taxidDict.setdefault(n["otuid"], []).append(n["staxids"])

                # make a combination for otu/taxid to later check their repetition
                notSeen = n["otuid"], n["staxids"]

                # if the combination above was not seen before, append it to unq, and add that combination to taxId_seen set
                if notSeen not in taxId_seen:
                    unq.append(bl[:])
                    taxId_seen.add(notSeen)

        # making a dictionary to hold the number of unique hits per otu, where key is otu and value is number of unique hit for that
        for otid, taid in list(taxidDict.items()):
            vals[otid] = len(set(taid))

        # if qcov >= user specified threshold for qCovThre and percentage identity >= user specified threshold for pidThre append to filunq
        for i in unq:
            if (round(float(i[20]), 2) >= round(float(qCovThre), 2)) and (
                round(float(i[6]), 2) >= round(float(pidThre), 2)
            ):
                filunq.append(i[:])

        c = 0  # current line in unq
        d = 1  # flag if unq was changed

        while d > 0:
            c = 0
            d = 0
            # This is to compare the first line with the next, and so on
            for x, y in zip(filunq, filunq[1:]):
                otuId_x = x[0]
                otuId_y = y[0]
                pIdent_x = float(x[6])
                pIdent_y = float(y[6])
                qCov_x = float(x[20])
                qCov_y = float(y[20])

                # if otu ids in the two lines are the same
                if otuId_x == otuId_y:
                    # if query coverage in line1 and line2 were equal too
                    if qCov_x == qCov_y:
                        # if absolute value for the difference between %identity of line1 vs line2 is > than the threshold set by user
                        if "{0:.3f}".format(abs(pIdent_x - pIdent_y)) > "{0:.3f}".format(
                            float(diff_lim)
                        ):
                            # % identity of line one is bigger than line two
                            if pIdent_x > pIdent_y:
                                # remove the second line from unq (only keep the best between the two)
                                del filunq[c + 1]
                                d = d + 1
                                break
                            else:
                                # remove the first line from unq (only keep the best between the two)
                                del filunq[c]
                                d = d + 1
                                break

                    elif qCov_x > qCov_y:
                        del filunq[c + 1]
                        d = d + 1
                        break

                    elif qCov_x < qCov_y:
                        del filunq[c]
                        d = d + 1
                        break
                c = c + 1

        return {"unq": filunq, "vals": vals}


    # This function will make a dictionary for taxonomy information of ncbi
    def taxonomy_dictionary(ncbi_taxonomy):
        taxonomy_Dict = {}

        # This will parse the ncbi taxonomy file to get the column of interest
        with open(ncbi_taxonomy, "r") as file:
            for line in file:
                l3 = line.strip().split("|")
                tax_id = l3[0]
                domain = l3[10]
                phylum = l3[7]
                classif = l3[6]
                order = l3[5]
                family = l3[4]
                genus = l3[3]
                species = l3[1]

                if genus == "":
                    genus = species
                    species = ""

                if "tax_id" not in line:
                    taxonomy_Dict[tax_id] = [
                        domain,
                        phylum,
                        classif,
                        order,
                        family,
                        genus,
                        species,
                    ]

        return taxonomy_Dict


    # This function will link filtered blast results with taxonomy information
    # it takes four arguments including the filtering thresholds set by users, and will write the result to an intermediate file
    def link_TaxFilblast(filename, diff_lim, qCovThre, pidThre):
        f = open("interMediate_res.tab", "w")

        # holds the value from filterBlast function. which is a nested list
        filBlast = filterBlast(filename, diff_lim, qCovThre, pidThre)["unq"]
        # a dictionary of taxonomyid and the value is all information available for it
        taxDict = taxonomy_dictionary("rankedlineage_tabRemoved.dmp")

        # if taxonomy id from blast file exist in the dictionary
        for i in filBlast:
            if i[2] in taxDict:
                f.write(str("\t".join(taxDict[i[2]]) + "\t" + "\t".join(i) + "\n"))

        return


    # The link_OTUtable function will store header and values of an OTU table
    def link_OTUtable(OTUtable):
        tableDict = {}
        lableDict = {}

        with open(OTUtable, "r") as file:
            for line in file:
                ll = line.strip().split("\t")
                if "#" in ll[0]:
                    lableDict[ll[0]] = ll[1:]  # storing header in dictionary
                else:
                    # storing abundance values in a dictionary
                    tableDict[ll[0]] = ll[1:]

        return {"tableDict": tableDict, "lableDict": lableDict}
shell_command: |
  bash run_lca.sh
inputs:
- name: table
  type: data
  format:
  - tabular
  label: 'OTU table with #ID header (lca input or LULU curated table)'
- name: blast
  type: data
  format:
  - tabular
  label: BLAST hits (22 columns, source outfmt 6 order)
- name: fasta
  type: data
  format:
  - fasta
  label: ASV/ZOTU sequences
- name: lineage
  type: data
  format:
  - tabular
  - txt
  label: NCBI new_taxdump rankedlineage.dmp
- name: qcov
  type: integer
  value: 90
  label: Minimum query coverage
- name: pid
  type: integer
  value: 90
  label: Minimum percent identity
- name: diff
  type: integer
  value: 1
  label: Percent-identity window for the LCA
- name: db_label
  type: text
  value: blast_db
  label: Reference database label written to taxaRaw/taxaFinal
outputs:
- name: lca_output
  type: data
  format: tabular
  from_work_dir: lca_output.tab
  label: LCA table
- name: intermediate
  type: data
  format: tabular
  from_work_dir: interMediate_res.tab
  label: LCA intermediate
- name: taxa_raw
  type: data
  format: tabular
  from_work_dir: taxa_raw_clean.tsv
  label: taxaRaw (FAIRe)
- name: taxa_final
  type: data
  format: tabular
  from_work_dir: taxa_final_clean.tsv
  label: taxaFinal (FAIRe)
help:
  format: markdown
  content: |
    Port of OceanOmics-amplicon-nf LCA. Embeds bin/runAssign_collapsedTaxonomy.py (taxdump download removed; the ranked lineage comes from the lineage input) and bin/working_function.py.

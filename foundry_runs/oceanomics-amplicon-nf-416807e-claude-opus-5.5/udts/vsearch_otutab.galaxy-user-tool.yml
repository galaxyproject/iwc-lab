class: GalaxyUserTool
id: oceanomics_vsearch_otutab
version: 2.21.1
name: VSEARCH usearch_global ZOTU table
description: map pooled reads to ZOTUs and count per sample
license: MIT
container: quay.io/biocontainers/vsearch:2.21.1--h95f258a_0
shell_command: |
  vsearch --usearch_global '$(inputs.reads.path)' --db '$(inputs.zotus.path)' --id $(inputs.identity) --otutabout zotu_table.tsv --threads \${GALAXY_SLOTS:-1}
inputs:
  - name: reads
    type: data
    format: [fasta]
    label: Pooled reads whose headers are sample names
  - name: zotus
    type: data
    format: [fasta]
    label: ZOTU sequences
  - name: identity
    type: float
    value: 0.97
    label: Minimum identity (--id)
outputs:
  - name: otutab
    type: data
    format: tabular
    from_work_dir: zotu_table.tsv
    label: ZOTU count table (#OTU ID x samples)
help:
  format: markdown
  content: |
    Port of OceanOmics-amplicon-nf VSEARCH_USEARCHGLOBAL (counting part): `vsearch --usearch_global --id X --otutabout`.
    Sample names come from read labels, which relabel_reads set to the sample identifier.

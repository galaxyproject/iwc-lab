class: GalaxyUserTool
id: oceanomics_vsearch_uchime3_denovo
version: 2.21.1
name: VSEARCH uchime3_denovo chimera removal
description: remove de novo chimeras and relabel survivors zotu1..N
license: MIT
container: quay.io/biocontainers/vsearch:2.21.1--h95f258a_0
shell_command: |
  vsearch --uchime3_denovo '$(inputs.centroids.path)' --nonchimeras tmp.fa --relabel zotu &&
  awk '/^>/ {if (seq) print seq; print; seq=""; next} {seq = seq $0} END {if (seq) print seq}' tmp.fa > zotus.fa
inputs:
  - name: centroids
    type: data
    format: [fasta]
    label: Denoised centroids
outputs:
  - name: zotus
    type: data
    format: fasta
    from_work_dir: zotus.fa
    label: ZOTU sequences (single-line FASTA)
help:
  format: markdown
  content: |
    Port of OceanOmics-amplicon-nf VSEARCH_UCHIME3DENOVO: `vsearch --uchime3_denovo --nonchimeras --relabel zotu`,
    then one sequence line per record.

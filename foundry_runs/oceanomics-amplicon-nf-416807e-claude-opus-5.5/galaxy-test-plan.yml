  - workflow_label: reads
    label_status: resolved
    description: per-sample paired reads (index + primer still present)
    collection_shape: list:paired
    datatype: fastqsanger.gz
    fixture:
      storage: remote-url
      location: null
      checksum: null
      provenance: 'conf/test.config input samplesheet (profile:test candidate); identifiers are the samplesheet ''sample'' values (unique per row, both rows paired); per-element URLs and SHA-1s in test-data-refs.json
        elements[] (prep: none at import; reads still carry the fw index before the fw primer, which the non-anchored 5'' cutadapt adapter removes)'

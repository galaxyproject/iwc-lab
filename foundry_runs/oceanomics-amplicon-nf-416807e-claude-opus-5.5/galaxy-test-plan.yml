      location: test-data/sample_metadata.csv
      checksum: SHA-1:d2c670e53a552e847c10d7dbbd3a275879104731
      provenance: 'derived from https://raw.githubusercontent.com/a4000/test_data/main/sample_sheets/test_samplesheet.csv (SHA-1:d4e1ff18413f12a445cd92dbc97f4aa0c89cae63) (prep: header column ''sample''
        renamed to ''samp_name'' (PHYLOSEQ keys metadata rows on samp_name; ledger sample-metadata-samp-name-column))'
  - workflow_label: blast_db
    label_status: resolved
    description: test BLAST v5 database (12S v0.7 + 16S v0.2) as one archive
    collection_shape: null
    datatype: tar
    fixture:
      storage: in-repo
      location: test-data/blast_db.tar
      checksum: SHA-1:05c8f071a385d0cd9d0a6cc4ecaf22a99af33618
      provenance: 'ustar archive of the 9 conf/test.config params.dbfiles volumes https://raw.githubusercontent.com/a4000/test_data/main/old_db/12S.v0.7.16S.v0.2.fasta.ndb, https://raw.githubusercontent.com/a4000/test_data/main/old_db/12S.v0.7.16S.v0.2.fasta.nhr,

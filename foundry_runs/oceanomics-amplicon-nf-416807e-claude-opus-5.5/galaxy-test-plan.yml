unresolved:
- kind: fixture
  description: taxonomy_lineage fixture is the full 401 MB rankedlineage.dmp inside a dated NCBI zip; the test needs it extracted (and ideally subset to the DB's taxids).
  blocking: true
  suggested_resolution: Extract rankedlineage.dmp to test-data/ at staging time; subset with blastdbcmd -entry all -outfmt %T when BLAST+ is available.
- kind: assertion
  description: Outputs depend on denoising 50 simulated read pairs per sample; ASV/ZOTU counts and taxonomy are not predictable without a run, so assertions are structural.
  blocking: false
  suggested_resolution: After a first green run, replace structural checks with has_n_lines / has_line assertions on lca_table and asv_table taken from that run.
omissions:
- target: rv_primer
  reason: conf/test.config sets no rv_primer; the workflow default CGCTGTTATCCCTADRGTAACT does not occur in the test R2 reads (assay-specific reverse primers), so R2 primers stay untrimmed exactly as in
    the source test.
  category: other
- target: phyloseq_object contents
  reason: binary RDS; only size asserted
  category: weak-output
warnings:
- code: no-upstream-expected-outputs
  message: OceanOmics-amplicon-nf defines no nf-test or snapshot; profile:test supplies inputs only.
  path: summary-nextflow.test_candidates[0].outputs
- code: source-test-not-runnable-as-declared
  message: Declared samplesheet fastq URLs 404 and its header fails SAMPLESHEET_CHECK; fixtures were corrected (see test-data-refs provenance).
  path: test-data-refs.json

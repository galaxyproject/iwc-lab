class: GalaxyUserTool
id: cowpy
version: 1.0.0
name: Cowpy ASCII-art banner
description: >
  Writes an ASCII-art cow saying "nf-core rules!" to a text file, reproducing
  the novelty banner produced by the nf-core/demo pipeline's COWPY module.
container: community.wave.seqera.io/library/cowpy:1.1.5--3db457ae1977a273
shell_command: echo "nf-core rules!" | cowpy > cowpy.txt
inputs: []
outputs:
  - name: txt
    type: data
    format: txt
    from_work_dir: cowpy.txt
    label: cowpy.txt — a cow saying nf-core rules!
help:
  format: markdown
  content: |
    Reimplements the nf-core/demo pipeline's COWPY module
    (`echo "nf-core rules!" | cowpy ${args} > cowpy.txt` with `args` empty).
    The output is a plain-text ASCII-art cow. It is a novelty artifact: the
    source pipeline does not feed it into MultiQC or any other step.

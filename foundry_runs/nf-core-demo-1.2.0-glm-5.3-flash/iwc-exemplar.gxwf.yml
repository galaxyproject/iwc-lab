class: GalaxyWorkflow
label: Short-read quality control and trimming
doc: This workflow performs quality control and trimming on paired-end Illumina fastq(.gz) files using fastp and aggregates the quality control reports with MultiQC
inputs:
  - id: Raw reads
    type: collection
    collection_type: list:paired
    optional: false
    fields: null
    column_definitions: null
    doc: Raw reads as paired-end collection
  - id: Adapter to remove on forward reads
    type: string
    optional: true
    doc: Sequence of the adapter to remove from forward reads using fastp
  - id: Adapter to remove on reverse reads
    type: string
    optional: true
    doc: Sequence of the adapter to remove from reverse reads using fastp
  - id: Qualified quality score
    type: int
    optional: true
    default: 15
    doc: The quality value that a base is qualified. Default 15 means a quality score &gt;=Q15 is qualified.
  - id: Minimal read length
    type: int
    optional: true
    default: 15
    doc: Reads shorter than this value will be discarded
outputs:
  - id: fastp JSON report
    outputSource: fastp/report_json
  - id: fastp trimmed reads
    outputSource: fastp/output_paired_coll
  - id: MultiQC HTML report
    outputSource: MultiQC/html_report
steps:
  - id: fastp
    label: fastp
    doc: Quality control and trimming of the raw reads
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/fastp/fastp/1.4.0+galaxy0
    tool_version: 1.4.0+galaxy0
    tool_shed_repository:
      changeset_revision: 4990e6f1348f
      name: fastp
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: filter_options|length_filtering_options|length_required
        source: Minimal read length
      - id: filter_options|quality_filtering_options|qualified_quality_phred
        source: Qualified quality score
      - id: single_paired|adapter_trimming_options|adapter_sequence1
        source: Adapter to remove on forward reads
      - id: single_paired|adapter_trimming_options|adapter_sequence2
        source: Adapter to remove on reverse reads
      - id: single_paired|paired_input
        source: Raw reads
    out:
      - id: report_html
        hide: true
      - id: output_paired_coll
        rename: Trimmed reads
        add_tags:
          - name:Reads
      - id: report_json
        rename: fastp JSON report
    tool_state:
      duplicated_reads:
        handling_options:
          eval_dups: --dont_eval_duplication
          __current_case__: 0
      filter_options:
        quality_filtering_options:
          disable_quality_filtering: false
          qualified_quality_phred:
            __class__: ConnectedValue
          unqualified_percent_limit: null
          n_base_limit: null
        length_filtering_options:
          disable_length_filtering: false
          length_required:
            __class__: ConnectedValue
          length_limit: null
        low_complexity_filter:
          enable_low_complexity_filter: false
          complexity_threshold: null
      output_options:
        report_html: true
        report_json: true
      overrepresented_sequence_analysis:
        overrepresentation_analysis: false
        overrepresentation_sampling: null
      read_mod_options:
        polyg_tail_trimming:
          trimming_select: ""
          __current_case__: 1
          poly_g_min_len: null
        polyx_tail_trimming:
          polyx_trimming_select: ""
          __current_case__: 1
        umi_processing:
          umi: false
          umi_loc: null
          umi_len: null
          umi_prefix: null
        cutting_by_quality_options:
          cut_front_select:
            cut_front: ""
            __current_case__: 1
          cut_tail_select:
            cut_tail: ""
            __current_case__: 1
          cut_right_select:
            cut_right: ""
            __current_case__: 1
        base_correction_options:
          correction: false
      single_paired:
        single_paired_selector: paired_collection
        __current_case__: 1
        paired_input:
          __class__: ConnectedValue
        merge_reads:
          merge: ""
          __current_case__: 1
        adapter_trimming_options:
          disable_adapter_trimming: false
          adapter_sequence1:
            __class__: ConnectedValue
          adapter_sequence2:
            __class__: ConnectedValue
          detect_adapter_for_pe: false
        global_trimming_options:
          trim_front1: null
          trim_tail1: null
          trim_front2: null
          trim_tail2: null
    uuid: e69bddb6-7447-4f42-b721-233bbe9c4d71
  - id: MultiQC
    label: MultiQC
    doc: Aggregation of the quality controls for all samples
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/multiqc/multiqc/1.35+galaxy5
    tool_version: 1.35+galaxy5
    tool_shed_repository:
      changeset_revision: 94b6bea727ae
      name: multiqc
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: results_0|software_cond|input
        source: fastp/report_json
    out:
      - id: stats
        hide: true
      - id: html_report
        rename: MultiQC report
    tool_state:
      comment: ""
      export: false
      flat: false
      image_content_input:
        __class__: RuntimeValue
      png_plots: false
      results:
        - __index__: 0
          software_cond:
            software: fastp
            __current_case__: 8
            input:
              __class__: ConnectedValue
      title: ""
    uuid: cce48d5d-b02d-435e-b466-d4f3eb8b7529
tags:
  - genomics
  - preprocessing
  - transcriptomics
  - bacteria
  - eukaryotes
  - archea

class: GalaxyWorkflow
id: text-uppercase-count
label: Преобразование ASCII-регистра и подсчет строк
doc: "Два последовательных процесса исходного Nextflow: преобразование строчных ASCII-букв в прописные и подсчет записей с точной русской подписью. Оба результата являются публичными выходами. Происхождение: file:source/, sha256:81abf32dc874c8aab7db43ae1a5a7b959a5cb57017b84abc908f3384bee7740d."
inputs:
  - id: text_input
    label: text_input
    type: data
    format:
      - txt
    optional: false
    doc: Один обычный текстовый файл. Пустой файл допустим; отсутствие dataset не допускается.
    position:
      left: 0
      top: 0
outputs:
  - id: uppercase_text
    label: uppercase_text
    type: data
    doc: "Преобразованный текст: изменяются только ASCII a-z, остальные байты и последний перевод строки сохраняются."
    outputSource: uppercase/output
  - id: line_count_summary
    label: line_count_summary
    type: data
    doc: "UTF-8 отчет: Количество строк: <число записей AWK NR> и завершающий перевод строки."
    outputSource: count_lines/outfile
steps:
  - id: uppercase
    label: uppercase
    type: tool
    tool_id: toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/tp_sed_tool/9.5+galaxy3
    position:
      left: 300
      top: 0
    in:
      - id: infile
        source: text_input
    out:
      - id: output
        rename: uppercase.txt
        change_datatype: txt
    tool_version: 9.5+galaxy3
    tool_shed_repository:
      name: text_processing
      owner: bgruening
      changeset_revision: ab83aa685821
      tool_shed: toolshed.g2.bx.psu.edu
    state:
      infile:
        __class__: ConnectedValue
      code: y/abcdefghijklmnopqrstuvwxyz/ABCDEFGHIJKLMNOPQRSTUVWXYZ/
      adv_opts:
        adv_opts_selector: basic
  - id: count_lines
    label: count_lines
    type: tool
    tool_id: toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/tp_awk_tool/9.5+galaxy3
    position:
      left: 600
      top: 0
    in:
      - id: infile
        source: uppercase/output
    out:
      - id: outfile
        rename: summary.txt
        change_datatype: txt
    tool_version: 9.5+galaxy3
    tool_shed_repository:
      name: text_processing
      owner: bgruening
      changeset_revision: ab83aa685821
      tool_shed: toolshed.g2.bx.psu.edu
    state:
      infile:
        __class__: ConnectedValue
      code: 'END { print "\320\232\320\276\320\273\320\270\321\207\320\265\321\201\321\202\320\262\320\276 \321\201\321\202\321\200\320\276\320\272: " NR }'
      variables: []

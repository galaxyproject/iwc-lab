      "decided_by": "nextflow-summary-to-galaxy-template",
      "decision": "Один обязательный одиночный txt-вход text_input, два последовательных tool-шага uppercase и count_lines, два публичных выхода uppercase_text и line_count_summary. Результат первого шага одновременно публикуется и подается второму. Оба шага Deferred до проверки конкретных оберток и параметров.",
      "rationale": "Исходные процессы и оба brief однозначно задают арность и зависимости. Каждый результат вычислим из поданного текста; внешние данные и дополнительные узлы не нужны. IWC подтверждает общий мотив публичного промежуточного dataset, но не точную текстовую семантику.",

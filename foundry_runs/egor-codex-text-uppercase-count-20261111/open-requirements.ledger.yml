      "rationale": "Channel.fromPath получает конкретный путь и передает один текстовый файл в UPPERCASE. Default источника существует локально, но отсутствие файла не является допустимым режимом обработки Galaxy.",
      "evidence": [
        "summary-nextflow.json: params[name=input]",
        "summary-nextflow.json: workflow.channels[name=source]",
        "summary-nextflow.json: test_candidates[id=pipeline-defaults].inputs[role=source_text]"
      ]
    },
    {

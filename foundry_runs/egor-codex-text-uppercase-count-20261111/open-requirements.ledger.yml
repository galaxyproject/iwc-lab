      "decided_by": "nextflow-summary-to-galaxy-interface",
      "decision": "Сохранить оба процесса и публичные выходы uppercase_text и line_count_summary; результат UPPERCASE одновременно является checkpoint и входом COUNT_LINES.",
      "rationale": "Оба файла объявлены процессами и публикуются. Отдельная проверка uppercase_text выявляет ошибку регистра, которую число строк само по себе не обнаружит.",
      "evidence": [

- id: merge_unmapped
  run:
    class: GalaxyUserTool
    id: samtools_merge_three
    version: 1.23.1
    name: samtools merge three alignments
    description: Merge three per-sample BAM/CRAM subsets into one alignment with samtools
      merge.
    container: quay.io/biocontainers/samtools:1.23.1--ha83d96e_0
    license: MIT
    help:
      format: markdown
      content: "Reproduces the nf-core `SAMTOOLS_MERGE` module call used by\n`ALIGNMENT_TO_FASTQ`\
        \ to merge the three unmapped subsets of one sample:\n\n    samtools merge\
        \ --threads N [--reference FASTA] -f out.bam FIRST SECOND THIRD\n\nThree real\
        \ data inputs make Galaxy run one job per sample, which the\nTool Shed `samtools_merge`\
        \ wrapper's multiple-data input does not do (it\nreduces the whole collection\
        \ into one job).\n"
    configfiles:
    - filename: run_merge.sh
      content: "set -o pipefail\nset -e\nREF=\"$(inputs.reference ? \"--reference\
        \ '\" + inputs.reference.path + \"'\" : \"\")\"\nsamtools merge --threads\
        \ \"$GALAXY_SLOTS\" $REF -f out.bam \\\n    '$(inputs.first.path)' '$(inputs.second.path)'\
        \ '$(inputs.third.path)'\n"
    shell_command: bash run_merge.sh
    inputs:
    - name: first
      type: data
      format:
      - bam
      - cram
      label: First alignment subset
    - name: second
      type: data
      format:
      - bam
      - cram
      label: Second alignment subset
    - name: third
      type: data
      format:
      - bam
      - cram
      label: Third alignment subset
    - name: reference
      type: data
      format:
      - fasta
      optional: true
      label: Reference FASTA (required for CRAM)
    outputs:
    - name: output
      type: data
      format: bam
      from_work_dir: out.bam
      label: Merged unmapped alignments
  when: $(inputs.when == 'paired')
  in:
  - id: first
    source: view_unmap_unmap/outputsam
  - id: second
    source: view_unmap_map/outputsam
  - id: third
    source: view_map_unmap/outputsam
  - id: reference
    source: fasta
  - id: when
    source: layout
  out:
  - id: output
- id: fastq_unmapped
  in:
  - id: input
    source: merge_unmapped/output
  - id: reference
    source: fasta
  - id: collate_fast
    source: samtools_collate_fast
  - id: when
    source: layout
  when: $(inputs.when == 'paired')
  out:
  - id: forward
  - id: reverse
  run: &id002
    class: GalaxyUserTool
    id: samtools_collate_fastq
    version: 1.23.1
    name: samtools collate and fastq
    description: Convert BAM/CRAM to FASTQ with samtools collate piped into samtools
      fastq.
    container: quay.io/biocontainers/samtools:1.23.1--ha83d96e_0
    license: MIT
    help:
      format: markdown
      content: "Reproduces the nf-core `SAMTOOLS_COLLATEFASTQ` module shell block:\n\
        \n    samtools collate [-f -r 100000] --threads N [--reference FASTA] -O INPUT\
        \ . |\n    samtools fastq -N --threads N [--reference FASTA] \\\n        -0\
        \ out_other.fq.gz -1 out_1.fq.gz -2 out_2.fq.gz -s out_singleton.fq.gz\n\n\
        The collate stage fixes the read order, so the converted FASTQ is\nbyte-comparable\
        \ with the nf-core pipeline output. Reads are split into the\nmate files (-1/-2),\
        \ the \"other\" file (-0, which also receives single-end\nreads) and singletons\
        \ (-s).\n"
    configfiles:
    - filename: run_collate_fastq.sh
      content: "set -o pipefail\nset -e\nREF=\"$(inputs.reference ? \"--reference\
        \ '\" + inputs.reference.path + \"'\" : \"\")\"\nCOLLATE_FAST=\"$(inputs.collate_fast\
        \ ? \"-f -r 100000\" : \"\")\"\nsamtools collate $COLLATE_FAST --threads \"\
        $GALAXY_SLOTS\" $REF \\\n    -O '$(inputs.input.path)' . |\nsamtools fastq\
        \ -N --threads \"$GALAXY_SLOTS\" $REF \\\n    -0 out_other.fq.gz -1 out_1.fq.gz\
        \ -2 out_2.fq.gz -s out_singleton.fq.gz\n"
    shell_command: bash run_collate_fastq.sh
    inputs:
    - name: input
      type: data
      format:
      - bam
      - cram
      label: Alignments to convert
    - name: reference
      type: data
      format:
      - fasta
      optional: true
      label: Reference FASTA (required for CRAM)
    - name: collate_fast
      type: boolean
      value: false
      label: Use samtools collate -f -r 100000
    outputs:
    - name: forward
      type: data
      format: fastqsanger.gz
      from_work_dir: out_1.fq.gz
      label: Mate 1 FASTQ
    - name: reverse
      type: data
      format: fastqsanger.gz
      from_work_dir: out_2.fq.gz
      label: Mate 2 FASTQ
    - name: other
      type: data
      format: fastqsanger.gz
      from_work_dir: out_other.fq.gz
      label: Other reads (single-end reads land here)
    - name: singleton
      type: data
      format: fastqsanger.gz
      from_work_dir: out_singleton.fq.gz
      label: Singleton reads
- id: fastq_mapped
  in:
  - id: input
    source: view_map_map/outputsam
  - id: reference
    source: fasta
  - id: collate_fast
    source: samtools_collate_fast
  - id: when
    source: layout
  when: $(inputs.when == 'paired')
  out:

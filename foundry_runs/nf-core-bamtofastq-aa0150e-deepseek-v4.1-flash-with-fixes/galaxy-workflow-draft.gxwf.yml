  - id: reverse
  run: *id002
- id: cat_r1
  tool_id: cat1
  when: $(inputs.when == 'paired')
  in:
  - id: input1
    source: fastq_mapped/forward
  - id: queries_0|input2
    source: fastq_unmapped/forward
  - id: when
    source: layout
  out:
  - id: out_file1
  state:
    input1:
      __class__: ConnectedValue
    queries:
    - __index__: 0
      input2:
        __class__: ConnectedValue
- id: cat_r2
  tool_id: cat1
  when: $(inputs.when == 'paired')
  in:
  - id: input1
    source: fastq_mapped/reverse
  - id: queries_0|input2
    source: fastq_unmapped/reverse
  - id: when
    source: layout
  out:
  - id: out_file1
  state:
    input1:
      __class__: ConnectedValue
    queries:
    - __index__: 0
      input2:
        __class__: ConnectedValue
- id: zip_reads_paired
  tool_id: __ZIP_COLLECTION__
  when: $(inputs.when == 'paired')
  in:
  - id: input_forward
    source: cat_r1/out_file1
  - id: input_reverse
    source: cat_r2/out_file1
  - id: when
    source: layout
  out:
  - id: output
  state:
    input_forward:
      __class__: ConnectedValue
    input_reverse:
      __class__: ConnectedValue
- id: fastq_single
  in:
  - id: input
    source: input
  - id: reference
    source: fasta
  - id: collate_fast
    source: samtools_collate_fast
  - id: when
    source: layout
  when: $(inputs.when == 'single')
  out:

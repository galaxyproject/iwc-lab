class: GalaxyWorkflowDraft
label: "nf-core/bamtofastq \u2014 BAM/CRAM to FASTQ"
doc: 'Convert aligned BAM/CRAM files back to FASTQ with samtools, in the layout

  (paired or single end) selected by the `layout` input, and run pre/post

  conversion QC plus MultiQC. Translated from nf-core/bamtofastq @ aa0150e.

  '
inputs:
  input:
    type: collection
    collection_type: list
    optional: false
    doc: 'Alignments to convert, one dataset per sample; the element identifier is

      the sample id. Elements may be BAM or CRAM. CRAM elements require `fasta`.

      '
  fasta:
    type: data
    format: fasta
    optional: true
    doc: Reference FASTA. Required when any input element is CRAM.
  layout:
    type: string
    default: paired
    optional: false
    restrictions:
    - paired
    - single
    doc: Read layout of every sample in `input`. Use `single` only when all samples
      are single end.
  no_read_QC:
    type: boolean
    default: false
    optional: true
    doc: Skip both FastQC steps.
  no_stats:
    type: boolean
    default: false
    optional: true
    doc: Skip samtools flagstat, idxstats and stats.
  samtools_collate_fast:
    type: boolean
    default: false
    optional: true
    doc: Pass `-f -r 100000` to samtools collate.
  multiqc_title:
    type: string
    optional: true
    doc: Optional MultiQC report title.
outputs:
  reads_paired:
    outputSource: zip_reads_paired/output
    doc: Merged R1/R2 FASTQ per sample (paired-end runs).
  reads_single:
    outputSource: fastq_single/other
    doc: Converted FASTQ per sample (single-end runs).
  fastqc_pre_conversion:
    outputSource: fastqc_pre/html_file
    doc: FastQC report on the input BAM files.
  fastqc_post_conversion_paired:
    outputSource: fastqc_post_paired/html_file
    doc: FastQC reports on the converted paired reads.
  fastqc_post_conversion_single:
    outputSource: fastqc_post_single/html_file
    doc: FastQC reports on the converted single-end reads.
  samtools_flagstat:
    outputSource: flagstat/output1
  samtools_idxstats:
    outputSource: idxstats/output
  samtools_stats:
    outputSource: stats/output
  multiqc_report:
    outputSource: multiqc/html_report
steps:
- id: flagstat
  tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_flagstat/samtools_flagstat/2.0.8
  tool_version: 2.0.8
  when: $(inputs.when == false)
  in:
  - id: input1
    source: input
  - id: when
    source: no_stats
  out:
  - id: output1
  state:
    input1: &id001
      __class__: ConnectedValue
    output_fmt: txt
  tool_shed_repository:
    changeset_revision: a0d8e49a018c
    name: samtools_flagstat
    owner: devteam
    tool_shed: toolshed.g2.bx.psu.edu
- id: idxstats
  tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_idxstats/samtools_idxstats/2.0.8
  tool_version: 2.0.8
  when: $(inputs.when == false)
  in:
  - id: input
    source: input
  - id: when
    source: no_stats
  out:
  - id: output
  state:
    input: *id001
  tool_shed_repository:
    changeset_revision: 13aad5cb9be4
    name: samtools_idxstats
    owner: devteam
    tool_shed: toolshed.g2.bx.psu.edu
- id: stats
  tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_stats/samtools_stats/2.0.9
  tool_version: 2.0.9
  when: $(inputs.when == false)
  in:
  - id: input
    source: input
  - id: when
    source: no_stats
  out:
  - id: output
  state:
    addref_cond:
      addref_select: 'no'
      __current_case__: 0
    cond_region:
      select_region: 'no'
      __current_case__: 0
    cov_threshold: null
    coverage_cond:
      coverage_select: 'no'
      __current_case__: 0
    filter_by_flags:
      filter_flags: nofilter
      __current_case__: 1
    gc_depth: null
    input: *id001
    insert_size: null
    most_inserts: null
    read_group: null
    read_length: null
    remove_dups: false
    remove_overlaps: false
    sparse: false
    split_output_cond:
      split_output_selector: 'no'
      __current_case__: 0
    trim_quality: null
  tool_shed_repository:
    changeset_revision: 8fca6e1eac98
    name: samtools_stats
    owner: devteam
    tool_shed: toolshed.g2.bx.psu.edu
- id: fastqc_pre
  tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/0.74+galaxy1
  tool_version: 0.74+galaxy1
  when: $(inputs.when == false)
  in:
  - id: input_file
    source: input
  - id: when
    source: no_read_QC
  out:
  - id: html_file
  - id: text_file
  state:
    input_file:
      __class__: ConnectedValue
    kmers: 7
    min_length: null
    nogroup: false
  tool_shed_repository:
    changeset_revision: 2c64fded1286
    name: fastqc
    owner: devteam
    tool_shed: toolshed.g2.bx.psu.edu

    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/pick_value/pick_value/0.2.0
    tool_version: "0.2.0"
    tool_shed_repository:
      name: pick_value
      owner: iuc
      changeset_revision: b19e21af9c52
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      style_cond|type_cond|pick_from_0|value: samtools_stats_with_ref/output
      style_cond|type_cond|pick_from_1|value: samtools_stats_no_ref/output
    out:
      - data_param
    state:
      style_cond:
        pick_style: first
        type_cond:
          param_type: data
          pick_from:
            - {}
            - {}
    position:
      top: 510
      left: 620

  check_bam_filetype:
    label: check_bam_filetype
    run:
      class: GalaxyUserTool
      id: check_bam_filetype
      version: "1.0.0"
      name: Check BAM alignment format
      description: Emit a non-empty marker dataset when an alignment file is BAM, or an empty marker when CRAM.
      container: community.wave.seqera.io/library/htslib_samtools:1.23.1--5b6bb4ede7e612e5
      shell_command: |
        htsfile '$(inputs.alignment.path)' | sed 's/^.*: //' | awk '/^BAM / { print "bam" }' > bam_marker.txt
      inputs:
        - name: alignment
          type: data
          format:
            - bam
            - cram
          label: Alignment dataset
          help: Input BAM or CRAM dataset checked before pre-conversion FastQC.
      outputs:
        - name: bam_marker
          type: data
          format: txt
          from_work_dir: bam_marker.txt
          label: BAM format marker
    in:
      alignment: input_alignments
      when: gate_run_read_qc/output_param_boolean
    when: $(inputs.when)
    out:
      - bam_marker
    position:
      top: 720
      left: 380

  keep_bam_ids:
    label: keep_bam_ids
    tool_id: __FILTER_EMPTY_DATASETS__
    tool_version: "1.1.0"
    in:
      input: check_bam_filetype/bam_marker
    out:
      - output
    state: {}
    position:
      top: 720
      left: 560

  extract_bam_ids:

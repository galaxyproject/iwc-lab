class: GalaxyWorkflowDraft
label: nf-core/bamtofastq (Galaxy translation)
doc: >
  Galaxy translation draft of nf-core/bamtofastq (commit aa0150e): converts mapped
  or unmapped BAM/CRAM alignments into single-end and paired-end FASTQ reads
  (fastqsanger.gz) with optional chromosome subsetting, samtools alignment stats,
  pre/post FastQC, fastq_info validation, and aggregated MultiQC reporting.

inputs:
  input_alignments:
    type: collection
    collection_type: list
    format:
      - bam
      - cram
    doc: List collection of input BAM/CRAM alignment files keyed by sample identifier.
  reference_fasta:
    type: data
    format: fasta
    optional: true
    doc: Optional reference genome FASTA used for CRAM decoding and samtools stats.
  chr:
    type: string
    optional: true
    doc: Optional region or chromosome string passed to samtools view -hb before conversion.
  no_read_qc:
    type: boolean
    default: false
    doc: Skip pre-conversion BAM FastQC and post-conversion FASTQ FastQC when true.
  no_stats:
    type: boolean
    default: false
    doc: Skip pre-conversion samtools flagstat, idxstats, and stats when true.
  samtools_collate_fast:
    type: boolean
    default: false
    doc: Enable samtools collate fast mode (-f -r reads_in_memory).
  reads_in_memory:
    type: int
    default: 100000
    doc: Number of reads buffered in memory when samtools_collate_fast is enabled.

outputs:
  paired_reads:
    outputSource: pe_zip_reads/output
    type: collection
    collection_type: list:paired
    doc: Merged paired-end FASTQ reads per paired-end sample (fastqsanger.gz).
  single_end_reads:
    outputSource: se_collate_fastq/fastq_other
    type: collection
    collection_type: list
    doc: Extracted single-end FASTQ reads per single-end sample (fastqsanger.gz).
  fastq_info_reports:
    outputSource: merge_fastqinfo/output
    type: collection
    collection_type: list
    doc: Per-sample fastq_info validation reports across paired and single-end samples.
  samtools_flagstat:
    outputSource: samtools_flagstat/output1
    type: collection
    collection_type: list
    doc: Per-sample samtools flagstat reports (skipped when no_stats=true).
  samtools_idxstats:
    outputSource: samtools_idxstats/output
    type: collection
    collection_type: list
    doc: Per-sample samtools idxstats reports (skipped when no_stats=true).
  samtools_stats:
    outputSource: pick_samtools_stats/data_param
    type: collection
    collection_type: list
    doc: Per-sample samtools stats reports (skipped when no_stats=true).
  fastqc_pre_html:
    outputSource: fastqc_pre/html_file
    type: collection
    collection_type: list
    doc: Pre-conversion FastQC HTML reports for BAM inputs (skipped when no_read_qc=true).
  fastqc_pre_data:
    outputSource: fastqc_pre/text_file
    type: collection
    collection_type: list
    doc: Pre-conversion FastQC RawData text reports for BAM inputs (skipped when no_read_qc=true).
  fastqc_post_html:
    outputSource: fastqc_post/html_file
    type: collection
    collection_type: list
    doc: Post-conversion FastQC HTML reports for extracted FASTQ reads (skipped when no_read_qc=true).
  fastqc_post_data:
    outputSource: fastqc_post/text_file
    type: collection
    collection_type: list
    doc: Post-conversion FastQC RawData text reports for extracted FASTQ reads (skipped when no_read_qc=true).
  multiqc_report:
    outputSource: pick_multiqc/data_param
    type: data
    doc: MultiQC HTML summary report aggregating samtools stats and FastQC outputs (when stats or read QC enabled).

comments:
  - type: frame
    title: Conditional Gates & Pre-Conversion QC
    color: blue
    position: [0, 0]
    size: [1100, 950]
    contains_steps:
      - gate_run_stats
      - gate_run_read_qc
      - has_reference
      - no_reference
      - gate_stats_with_ref
      - gate_stats_no_ref
      - samtools_idxstats
      - samtools_flagstat
      - samtools_stats_with_ref
      - samtools_stats_no_ref
      - pick_samtools_stats
      - check_bam_filetype
      - keep_bam_ids
      - extract_bam_ids
      - sync_bam_alignments
      - fastqc_pre
  - type: frame
    title: Optional Region Filter & Paired/Single Split
    color: green
    position: [1200, 0]
    size: [1450, 950]
    contains_steps:
      - gate_run_chr
      - gate_chr_with_ref
      - gate_chr_no_ref
      - samtools_chr_with_ref
      - samtools_chr_no_ref
      - pick_active_alignments
      - check_paired
      - keep_paired_ids
      - extract_paired_ids
      - sync_paired_alignments
      - keep_single_ids
      - extract_single_ids
      - sync_single_alignments
  - type: frame
    title: Single-End FASTQ Conversion
    color: orange
    position: [2750, 0]
    size: [550, 400]
    contains_steps:
      - se_collate_fastq
  - type: frame
    title: Paired-End Subset Merge & FASTQ Conversion
    color: turquoise
    position: [2750, 480]
    size: [2150, 1200]
    contains_steps:
      - pe_view_map_map_with_ref
      - pe_view_map_map_no_ref
      - pick_pe_view_map_map
      - pe_view_map_unmap_with_ref
      - pe_view_map_unmap_no_ref
      - pick_pe_view_map_unmap
      - pe_view_unmap_map_with_ref
      - pe_view_unmap_map_no_ref
      - pick_pe_view_unmap_map
      - pe_view_unmap_unmap_with_ref
      - pe_view_unmap_unmap_no_ref
      - pick_pe_view_unmap_unmap
      - pe_merge_unmap_lists
      - pe_group_unmap_per_sample
      - pe_merge_unmap
      - pe_collate_map
      - pe_collate_unmap
      - pe_cat_r1
      - pe_cat_r2
      - pe_zip_reads
  - type: frame
    title: Post-Conversion QC & MultiQC Reporting
    color: yellow
    position: [4800, 0]
    size: [1450, 950]
    contains_steps:
      - fastqutils_paired
      - fastqutils_single
      - merge_fastqinfo
      - flatten_paired_reads
      - merge_post_reads
      - fastqc_post
      - gate_multiqc_all
      - gate_multiqc_stats_only
      - gate_multiqc_readqc_only
      - multiqc_all
      - multiqc_stats_only
      - multiqc_readqc_only
      - pick_multiqc

steps:
  # --- Frame 1: Conditional Gates & Pre-Conversion QC ---
  gate_run_stats:
    label: gate_run_stats
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/map_param_value/map_param_value/0.2.0
    tool_version: "0.2.0"
    tool_shed_repository:
      name: map_param_value
      owner: iuc
      changeset_revision: 022a635f2283
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input_param_type|input_param: no_stats
    out:
      - output_param_boolean
    state:
      input_param_type:
        type: boolean
        mappings:
          - from: false
            to: "true"
      output_param_type: boolean
      unmapped:
        on_unmapped: default
        default_value: "false"
    position:
      top: 60
      left: 50

  gate_run_read_qc:
    label: gate_run_read_qc
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/map_param_value/map_param_value/0.2.0
    tool_version: "0.2.0"
    tool_shed_repository:
      name: map_param_value
      owner: iuc
      changeset_revision: 022a635f2283
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input_param_type|input_param: no_read_qc
    out:
      - output_param_boolean
    state:
      input_param_type:
        type: boolean
        mappings:
          - from: false
            to: "true"
      output_param_type: boolean
      unmapped:
        on_unmapped: default
        default_value: "false"
    position:
      top: 260
      left: 50

  has_reference:
    label: has_reference
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/map_param_value/map_param_value/0.2.0
    tool_version: "0.2.0"
    tool_shed_repository:
      name: map_param_value
      owner: iuc
      changeset_revision: 022a635f2283
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input_param_type|input_param: reference_fasta
    out:
      - output_param_boolean
    state:
      input_param_type:
        type: data
        mappings: []
      output_param_type: boolean
      unmapped:
        on_unmapped: input
    position:
      top: 460
      left: 50

  no_reference:
    label: no_reference
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/map_param_value/map_param_value/0.2.0
    tool_version: "0.2.0"
    tool_shed_repository:

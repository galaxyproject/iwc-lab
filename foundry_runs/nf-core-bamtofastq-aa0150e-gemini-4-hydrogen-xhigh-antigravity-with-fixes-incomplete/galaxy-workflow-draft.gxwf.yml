  check_paired:
    label: check_paired
    run:
      class: GalaxyUserTool
      id: check_paired
      version: "1.0.0"
      name: Check paired-end alignment status
      description: Sample up to 1000 alignment records with samtools view and emit a paired-end or single-end marker file.
      container: community.wave.seqera.io/library/htslib_samtools:1.23.1--5b6bb4ede7e612e5
      shell_command: |
        REF_PATH="$(inputs.reference ? inputs.reference.path : '')"
        IS_CRAM=0
        if htsfile '$(inputs.alignment.path)' | sed 's/^.*: //' | grep -q '^CRAM '; then
          IS_CRAM=1
        fi
        run_samtools_view() {
          if [ "$IS_CRAM" -eq 1 ] && [ -n "$REF_PATH" ]; then
            samtools view --reference "$REF_PATH" "$@"
          else
            samtools view "$@"
          fi
        }
        THREADS="\${GALAXY_SLOTS:-1}"
        run_samtools_view -H '$(inputs.alignment.path)' > /dev/null
        run_samtools_view '$(inputs.alignment.path)' -@ "$THREADS" | head -n 1000 > sampled_body.sam
        LINES_TO_CHK=\$(wc -l < sampled_body.sam | tr -d ' ')
        if [ "$LINES_TO_CHK" -gt 0 ]; then
          PAIRED_COUNT=\$({ run_samtools_view -H '$(inputs.alignment.path)' -@ "$THREADS"; cat sampled_body.sam; } | run_samtools_view -c -f 1 -@ "$THREADS")
        else
          PAIRED_COUNT=0
        fi
        IS_PAIRED=\$(awk -v p="$PAIRED_COUNT" -v l="$LINES_TO_CHK" 'BEGIN { print (l > 0 && p == l) ? "1" : "0" }')
        if [ "$IS_PAIRED" = "1" ]; then
          echo 1 > paired_marker.txt
          : > single_marker.txt
        else
          : > paired_marker.txt
          echo 1 > single_marker.txt
        fi
      inputs:
        - name: alignment
          type: data
          format:
            - bam
            - cram
          label: Alignment dataset
          help: Input BAM or CRAM dataset to classify as paired-end or single-end.
        - name: reference
          type: data
          format:
            - fasta
          optional: true
          label: Reference FASTA
          help: Optional reference genome FASTA file passed via --reference when decoding CRAM alignments.
      outputs:
        - name: paired_marker
          type: data
          format: txt
          from_work_dir: paired_marker.txt
          label: Paired-end marker
        - name: single_marker
          type: data
          format: txt
          from_work_dir: single_marker.txt
          label: Single-end marker
    in:
      alignment: pick_active_alignments/data_param
      reference: reference_fasta
    out:
      - paired_marker
      - single_marker
    position:
      top: 260
      left: 1850


      when: gate_run_read_qc/output_param_boolean
    when: $(inputs.when)
    out:
      - html_file
      - text_file
    state:
      nogroup: false
      min_length: null
      kmers: 7
    position:
      top: 720
      left: 1100

  # --- Frame 2: Optional Region Filter & Paired/Single Split ---
  gate_run_chr:
    label: gate_run_chr
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/map_param_value/map_param_value/0.2.0
    tool_version: "0.2.0"
    tool_shed_repository:

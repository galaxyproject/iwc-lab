    out:
      - output_param_boolean
    state:
      input_param_type:
        type: boolean
        mappings:
          - from: false
            to: "true"
      output_param_type: boolean
      unmapped:
        on_unmapped: default
        default_value: "false"
    position:
      top: 620
      left: 50

  gate_stats_with_ref:
    label: gate_stats_with_ref
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/combine_boolean_params/combine_boolean_params/0.1.0
    tool_version: "0.1.0"
    tool_shed_repository:
      name: combine_boolean_params
      owner: iuc
      changeset_revision: 597e0235d263
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      booleans_0|value: gate_run_stats/output_param_boolean
      booleans_1|value: has_reference/output_param_boolean
    out:
      - output
    state:
      booleans:
        - {}
        - {}
      operator: "and"
      null_handling: "false"
    position:
      top: 440
      left: 210

  gate_stats_no_ref:
    label: gate_stats_no_ref
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/combine_boolean_params/combine_boolean_params/0.1.0
    tool_version: "0.1.0"
    tool_shed_repository:
      name: combine_boolean_params
      owner: iuc
      changeset_revision: 597e0235d263
      tool_shed: toolshed.g2.bx.psu.edu
    in:

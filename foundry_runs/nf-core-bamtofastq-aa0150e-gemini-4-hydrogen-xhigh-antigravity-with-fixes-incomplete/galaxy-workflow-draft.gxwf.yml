        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            factor: 1.0
            seed: null
        output_options:
          reads_report_type: retained
          complementary_output: false
          adv_output:
            readtags: []
            collapsecigar: false
          output_format:
            oformat: bam
      addref_cond:
        addref_select: "no"
    position:
      top: 240
      left: 1620

  pick_active_alignments:
    label: pick_active_alignments
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/pick_value/pick_value/0.2.0
    tool_version: "0.2.0"
    tool_shed_repository:

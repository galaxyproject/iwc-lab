    state:
      output_fmt: txt
    position:
      top: 280
      left: 380

  samtools_stats_with_ref:
    label: samtools_stats_with_ref
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_stats/samtools_stats/2.0.9
    tool_version: "2.0.9"
    tool_shed_repository:
      name: samtools_stats
      owner: devteam
      changeset_revision: 8fca6e1eac98
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input: input_alignments
      addref_cond|ref: reference_fasta
      when: gate_stats_with_ref/output
    when: $(inputs.when)
    out:
      - output
    state:
      coverage_cond:
        coverage_select: "no"
      remove_dups: false
      split_output_cond:
        split_output_selector: "no"
      filter_by_flags:
        filter_flags: nofilter
      gc_depth: null
      insert_size: null
      read_group: null
      read_length: null
      most_inserts: null
      trim_quality: null
      addref_cond:
        addref_select: history
      cond_region:
        select_region: "no"
      sparse: false
      remove_overlaps: false
      cov_threshold: null
    position:
      top: 440
      left: 380

  samtools_stats_no_ref:
    label: samtools_stats_no_ref
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_stats/samtools_stats/2.0.9
    tool_version: "2.0.9"
    tool_shed_repository:
      name: samtools_stats
      owner: devteam
      changeset_revision: 8fca6e1eac98
      tool_shed: toolshed.g2.bx.psu.edu
    in:

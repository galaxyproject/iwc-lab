    state:
      coverage_cond:
        coverage_select: "no"
      remove_dups: false
      split_output_cond:
        split_output_selector: "no"
      filter_by_flags:
        filter_flags: nofilter
      gc_depth: null
      insert_size: null
      read_group: null
      read_length: null
      most_inserts: null
      trim_quality: null
      addref_cond:
        addref_select: "no"
      cond_region:
        select_region: "no"
      sparse: false
      remove_overlaps: false
      cov_threshold: null
    position:
      top: 580
      left: 380

  pick_samtools_stats:

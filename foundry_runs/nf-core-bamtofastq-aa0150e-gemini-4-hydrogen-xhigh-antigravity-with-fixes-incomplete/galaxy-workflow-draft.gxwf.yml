      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input_param_type|input_param: chr
    out:
      - output_param_boolean
    state:
      input_param_type:
        type: text
        mappings:
          - from: null
            to: "false"
          - from: ""
            to: "false"
      output_param_type: boolean
      unmapped:
        on_unmapped: default
        default_value: "true"
    position:

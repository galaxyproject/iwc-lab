    state: {}
    position:
      top: 720
      left: 740

  sync_bam_alignments:
    label: sync_bam_alignments
    tool_id: __FILTER_FROM_FILE__
    tool_version: "1.1.0"
    in:
      input: input_alignments
      how|filter_source: extract_bam_ids/output
    out:
      - output_filtered
    state:
      how:

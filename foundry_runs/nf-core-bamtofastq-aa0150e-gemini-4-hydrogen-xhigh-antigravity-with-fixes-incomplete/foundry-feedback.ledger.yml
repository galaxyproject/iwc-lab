    what: "foundry summarize-nextflow split multi-line Groovy tuple/list arguments to SAMTOOLS_CHR and MULTIQC on commas, emitting bogus workflow.edges entries such as from='[[:]', from=']]]', from='[', and from='}'."
    expected: "Parse balanced brackets/closures when splitting process/subworkflow call arguments so multi-line Groovy literals do not produce synthetic token edges."
    evidence: "Running foundry summarize-nextflow on nf-core/bamtofastq aa0150e emitted 15 malformed edge fragments in <run>/summary-nextflow.json (cleaned during the LLM pass)."

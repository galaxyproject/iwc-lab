omissions:
  - target: pipeline_info/nf_core_bamtofastq_software_mqc_versions.yml
    reason: nf-core collated versions YAML boilerplate is omitted in Galaxy (tool versions are tracked by Galaxy provenance).
    category: out-of-scope
  - target: multiqc_citations.txt
    reason: iuc/multiqc 1.35+galaxy5 workflow exposes html_report rather than multiqc_data/multiqc_citations.txt.
    category: out-of-scope
  - target: samtools/*.bam (intermediate chr BAM)
    reason: Intermediate samtools_chr BAM is ignored by tests/.nftignore in default profile and kept internal in Galaxy.
    category: out-of-scope
  - target: fastqc_pre_html, fastqc_post_html, multiqc_report exact bytes/md5
    reason: FastQC and MultiQC HTML outputs contain run timestamps and paths (listed in tests/.nftignore); verified via element count and HTML markers instead.
    category: nondeterministic
  - target: succeeded_task_count
    reason: Nextflow runtime task count is non-translatable to Galaxy workflow-test output assertions.
    category: out-of-scope


plan_version: "1"
source:
  kind: nextflow
  name: nf-core/bamtofastq (aa0150e)
  derived_from: test-evidence
  notes: >
    Translated from nf-core/bamtofastq nf-test suites: primary selected case
    tests/default.nf.test::-profile test (default.nf.test.snap), plus secondary eligible
    coverage cases from tests/chr.nf.test (single-end BAM + chr filter), tests/cram.nf.test
    (paired CRAM + BAM-only pre-QC filter), and combined tests/no_stats + tests/collate_fast
    (omitted reference_fasta, no_stats=true, samtools_collate_fast=true) to exercise all
    conditional branches.

workflow:
  title: nf-core/bamtofastq (Galaxy translation)
  label_source: draft
  notes: >
    Labels taken directly from concrete extracted workflow galaxy-workflow.gxwf.yml
    (7 inputs, 11 outputs).

test_cases:
  - id: default_profile_paired_bam

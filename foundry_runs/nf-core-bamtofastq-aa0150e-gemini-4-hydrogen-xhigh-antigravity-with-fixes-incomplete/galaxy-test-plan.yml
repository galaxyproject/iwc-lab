      - workflow_label: input_alignments
        label_status: resolved
        description: List collection with elements test and test2 from test_bam_samplesheet.csv.
        collection_shape: list
        datatype: bam
        fixture:
          storage: remote-url
          location: https://raw.githubusercontent.com/nf-core/test-datasets/refs/heads/bamtofastq/samplesheet/test_bam_samplesheet.csv
          checksum: null
          provenance: "test: 0799f89638bddd570439115c606f425c22d189b1; test2: 522fb037cea05b9d41dd69647f27a644838bf507"
      - workflow_label: reference_fasta
        label_status: resolved
        description: Human reference FASTA from test profile.
        collection_shape: null
        datatype: fasta
        fixture:
          storage: remote-url
          location: https://raw.githubusercontent.com/nf-core/test-datasets/modules/data/genomics/homo_sapiens/genome/genome.fasta
          checksum: SHA-1:56e7a0c035e2fce8ebe497d3704431d7586fd444
          provenance: Declared in tests/default.nf.test params.fasta
      - workflow_label: chr
        label_status: resolved
        description: Optional region filter omitted (null) matching -profile test default.
        collection_shape: null
        datatype: null
        fixture:
          storage: null
          location: null
          checksum: null
          provenance: Unset in tests/default.nf.test
      - workflow_label: no_read_qc
        label_status: resolved
        description: Scalar boolean parameter false (run pre and post FastQC).
        collection_shape: null
        datatype: null
        fixture:
          storage: null
          location: null
          checksum: null
          provenance: Default false in tests/default.nf.test
      - workflow_label: no_stats
        label_status: resolved

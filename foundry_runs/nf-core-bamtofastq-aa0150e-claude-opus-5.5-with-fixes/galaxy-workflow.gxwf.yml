class: GalaxyWorkflow
label: nf-core/bamtofastq (Galaxy translation)
doc: |
  Convert BAM/CRAM alignments to FASTQ with pre- and post-conversion QC.
  Translated from nf-core/bamtofastq @ aa0150e via the Foundry nextflow-to-galaxy pipeline.
license: MIT
inputs:
  alignments:
    type: collection
    collection_type: list
    format:
      - bam
      - cram
    doc: One BAM or CRAM per sample; element identifier = sample id (samplesheet sample_id). Index comes from Galaxy datatype metadata.
  reference_fasta:
    type: data
    format: fasta
    optional: false
    doc: "Reference FASTA. Required in Galaxy: the samtools view/stats wrappers take the reference only as a history dataset inside a conditional, so an optional workflow input cannot feed them. Source: --fasta (optional; needed for CRAM)."
  run_read_qc:
    type: boolean
    default: true
    doc: Run FastQC before and after conversion (inverse of --no_read_QC).
  run_stats:
    type: boolean
    default: true
    doc: Run samtools flagstat/idxstats/stats (inverse of --no_stats).
outputs:
  samtools_flagstat:
    outputSource: flagstat/output1
  samtools_idxstats:
    outputSource: idxstats/output
  samtools_stats:
    outputSource: stats/output
  fastqc_pre_html:
    outputSource: fastqc_pre/html_file
  fastq_paired:
    outputSource: zip_pairs/output
  fastq_single_end:
    outputSource: collate_fastq_single/output
  fastqc_post_paired_html:
    outputSource: fastqc_post_paired/html_file
  fastqc_post_single_html:
    outputSource: fastqc_post_single/html_file
  fastq_info_paired:
    outputSource: fastq_info_paired/output
  fastq_info_single:
    outputSource: fastq_info_single/output
  fastqc_pre_raw:
    outputSource: fastqc_pre/text_file
  fastqc_post_paired_raw:
    outputSource: fastqc_post_paired/text_file
  fastqc_post_single_raw:
    outputSource: fastqc_post_single/text_file
steps:
  flagstat:
    doc: PRE_CONVERSION_QC / SAMTOOLS_FLAGSTAT
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_flagstat/samtools_flagstat/2.0.8
    tool_version: 2.0.8
    tool_shed_repository:
      changeset_revision: a0d8e49a018c
      name: samtools_flagstat
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input1: alignments
      when: run_stats
    when: $(inputs.when)
    out:
      - id: output1
    state:
      output_fmt: txt
  idxstats:
    doc: PRE_CONVERSION_QC / SAMTOOLS_IDXSTATS
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_idxstats/samtools_idxstats/2.0.8
    tool_version: 2.0.8
    tool_shed_repository:
      changeset_revision: 13aad5cb9be4
      name: samtools_idxstats
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input: alignments
      when: run_stats
    when: $(inputs.when)
    out:
      - id: output
    state: {}
  stats:
    doc: PRE_CONVERSION_QC / SAMTOOLS_STATS
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_stats/samtools_stats/2.0.9
    tool_version: 2.0.9
    tool_shed_repository:
      changeset_revision: 8fca6e1eac98
      name: samtools_stats
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input: alignments
      addref_cond|ref: reference_fasta
      when: run_stats
    when: $(inputs.when)
    out:
      - id: output
    state:
      coverage_cond:
        coverage_select: "no"
      remove_dups: false
      split_output_cond:
        split_output_selector: "no"
      filter_by_flags:
        filter_flags: nofilter
      addref_cond:
        addref_select: history
      cond_region:
        select_region: "no"
      sparse: false
      remove_overlaps: false
  classify_alignment:
    doc: CHECKPAIREDEND — classify each alignment as paired/single and bam/cram
    run:
      class: GalaxyUserTool
      id: bamtofastq_check_paired_end
      version: 1.0.0
      name: Check paired-end status of an alignment
      description: Classify a BAM/CRAM as paired- or single-end (nf-core/bamtofastq CHECKPAIREDEND) and report its container format
      license: MIT
      container: community.wave.seqera.io/library/htslib_samtools:1.23.1--5b6bb4ede7e612e5
      requirements:
        - type: resource
          cores_min: 1
      inputs:
        - name: alignment
          type: data
          format:
            - bam
            - cram
          label: Alignment (BAM or CRAM)
        - name: reference
          type: data
          format:
            - fasta
          optional: true
          label: Reference FASTA
          help: Only used for CRAM input, when the CRAM header does not point to an accessible reference.
      outputs:
        - name: classification
          type: data
          format: tabular
          from_work_dir: classification.tsv
          label: Paired-end classification
      configfiles:
        - filename: check_paired.sh
          content: |
            in='$(inputs.alignment.path)'
            ref='$(inputs.reference ? "--reference " + inputs.reference.path : "")'
            # Same rule as nf-core/bamtofastq modules/local/checkpairedend: sample up to the first 1000 records
            # and call the file paired only if every sampled record has flag 0x1.
            if [ "\$(samtools view $ref "$in" | head -n1000 | wc -l)" -lt "1000" ]; then
                lines=\$(samtools view $ref "$in" | wc -l)
            else
                lines=1000
            fi
            frac=\$({ samtools view -H $ref "$in"; samtools view $ref "$in" | head -n "$lines"; } | samtools view $ref -c -f 1 | awk -v lines="$lines" '{print $1/lines}')
            if [ "$frac" = "1" ]; then pairing=paired; else pairing=single; fi
            if [ "\$(head -c 4 "$in")" = "CRAM" ]; then filetype=cram; else filetype=bam; fi
            printf '%s\t%s\n' "$pairing" "$filetype" > classification.tsv
      shell_command: sh check_paired.sh
      help:
        format: markdown
        content: |
          Port of the `CHECKPAIREDEND` process of nf-core/bamtofastq (modules/local/checkpairedend).
          Writes one tab-separated line `<paired|single>\t<bam|cram>`. A file is *paired* when every
          record among the first min(1000, n) records carries SAM flag 0x1. The container format is read
          from the file magic (`CRAM` header) rather than the Galaxy datatype.
    in:
      alignment: alignments
      reference: reference_fasta
    out:
      - id: classification
  collect_classes:
    doc: collapse per-element class lines into one table with element identifier as column 1
    tool_id: toolshed.g2.bx.psu.edu/repos/nml/collapse_collections/collapse_dataset/5.1.0
    tool_version: 5.1.0
    tool_shed_repository:
      changeset_revision: 90981f86000f
      name: collapse_collections
      owner: nml
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input_list: classify_alignment/classification
    out:
      - id: output
    state:
      one_header: false
      filename:
        add_name: true
        place_name: same_multiple
  paired_ids:
    doc: identifiers of paired-end samples
    tool_id: toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/tp_awk_tool/9.11+galaxy0
    tool_version: 9.11+galaxy0
    tool_shed_repository:
      changeset_revision: 30b60202d990
      name: text_processing
      owner: bgruening
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      infile: collect_classes/output
    out:
      - id: outfile
    state:
      code: $2=="paired"{print $1}
      variables: []
  bam_ids:
    doc: identifiers of BAM (not CRAM) samples for pre-conversion FastQC
    tool_id: toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/tp_awk_tool/9.11+galaxy0
    tool_version: 9.11+galaxy0
    tool_shed_repository:
      changeset_revision: 30b60202d990
      name: text_processing
      owner: bgruening
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      infile: collect_classes/output
    out:
      - id: outfile
    state:
      code: $3=="bam"{print $1}
      variables: []
  split_by_pairing:
    doc: split alignments into paired (kept) and single-end (discarded) lists
    tool_id: __FILTER_FROM_FILE__
    tool_version: 1.1.0
    in:
      input: alignments
      how|filter_source: paired_ids/outfile
    out:
      - id: output_filtered
      - id: output_discarded
    state:
      how:
        how_filter: remove_if_absent
  bam_only:
    doc: keep BAM elements only (source runs FASTQC_PRE_CONVERSION on bam rows only)
    tool_id: __FILTER_FROM_FILE__
    tool_version: 1.1.0
    in:
      input: alignments
      how|filter_source: bam_ids/outfile
    out:
      - id: output_filtered
      - id: output_discarded
        hide: true
    state:
      how:
        how_filter: remove_if_absent
  fastqc_pre:
    doc: PRE_CONVERSION_QC / FASTQC_PRE_CONVERSION
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc/0.74+galaxy1
    tool_version: 0.74+galaxy1
    tool_shed_repository:
      changeset_revision: 2c64fded1286
      name: fastqc
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      input_file: bam_only/output_filtered
      when: run_read_qc
    when: $(inputs.when)
    out:
      - id: html_file
      - id: text_file
    state:
      nogroup: false
      kmers: 7
  view_map_map:
    doc: ALIGNMENT_TO_FASTQ / SAMTOOLS_VIEW_MAP_MAP (both mates mapped)
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      changeset_revision: 5cf9fcc93508
      name: samtools_view
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:

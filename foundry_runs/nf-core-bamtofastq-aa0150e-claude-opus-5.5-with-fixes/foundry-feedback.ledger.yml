  - id: test-authoring-run-green-duplicates-run-phase
    raised_by: implement-galaxy-workflow-test
    observed_in:
      mold: implement-galaxy-workflow-test
      path: content/molds/implement-galaxy-workflow-test/index.md
      revision: 11
      content_hash: 34855691581889d36265e00178088b8a52a51ee72119329261bca186f7cb480e
      foundry_head: df991d0d789b0a29618cbcdbe7eb6d9508f1f062
    subject:
      kind: pipeline
      label: nextflow-to-galaxy pipeline ordering
      locator: content/pipelines/nextflow-to-galaxy/index.md
    kind: friction
    severity: minor
    what: implement-galaxy-workflow-test says to bootstrap the test from a real invocation (workflow_test_init --from_invocation) and to run planemo green, but in this pipeline it runs at phase 10, before validate-galaxy-workflow (11) and run-workflow-test (12); no invocation exists yet, and running planemo here duplicates phase 12.
    expected: State in the pipeline (or the Mold) that inside nextflow-to-galaxy phase 10 authors from the plan and stops at the static gates, leaving planemo execution and invocation-based iteration to phases 12-13.
    evidence: 'bamtofastq run: authored from galaxy-test-plan.yml, static gates only; planemo deferred to phase 12.'
    status: open
    issue: null
  - id: multiple-data-input-reduces-mapped-list
    raised_by: implement-galaxy-tool-step
    observed_in:
      mold: implement-galaxy-tool-step
      path: content/molds/implement-galaxy-tool-step/index.md
      revision: 15
      content_hash: 2009d579cf2a68f8b31d1a69dd751f3f4d80fe3f19f3606f8cac2dda37aa343b
      foundry_head: 61da115975d155a36face0e83d5c28f638da7fca
    subject:
      kind: mold
      label: implement-galaxy-tool-step
      locator: content/molds/implement-galaxy-tool-step/index.md
    kind: gap
    severity: major
    what: 'Step 3 says to preserve collection mapping and reduction semantics, but neither the Mold nor its checks flag connecting a mapped list to a wrapper input declared multiple="true": it silently reduces instead of mapping. draft-validate --concrete --strict-state and gxwf validate both passed; the bug showed only at runtime (cat_r1 ran 1 job instead of 2).'
    expected: 'Add an explicit check: when the plan says per-element (map-over) and the chosen port is multiple=true, either pick a single-data-input wrapper or bundle per element (list:list) first; ideally have gxwf report reduction vs map-over per connection.'
    evidence: bamtofastq tp_cat 9.11+galaxy0 `inputs` multiple=true; planemo attempt 1 output_problems; fixed by switching to cat1.
    status: open
    issue: null

    subject:
      kind: research
      label: nextflow-snapshot-to-galaxy-assertions
      locator: content/research/nextflow-snapshot-to-galaxy-assertions/index.md
      content_hash: 491c751e1f6466a1fc5daf879bd840163bb80b9c27e886f3c611c15b6546164f
    kind: defect
    severity: minor
    what: Section 7 says SnapshotFixture does not parse the .snap JSON and a Mold must re-read the sidecar, but the summary emitted by the current summarize-nextflow carries snapshot.parsed_content with per-file basename+md5 tokens.
    expected: Update section 7 to point at snapshot.parsed_content and say when the sidecar still needs reading.
    evidence: summary-nextflow.json test_candidates[default].snapshot.parsed_content lists test.flagstat md5 a53f3d26...; I read it there and only opened the .snap to confirm.

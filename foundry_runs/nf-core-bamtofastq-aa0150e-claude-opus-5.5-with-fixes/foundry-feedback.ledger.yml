entries:
  - id: summarize-nextflow-edges-split-multiline-call-args
    raised_by: summarize-nextflow
    observed_in:
      mold: summarize-nextflow
      path: content/molds/summarize-nextflow/index.md
      revision: 21
      content_hash: 12fda0aa7f41e1899f921f4c9970af864e0022b25610e8f4fb6b4eba0a62d499
      foundry_head: df991d0d789b0a29618cbcdbe7eb6d9508f1f062
    subject:
      kind: implementation
      label: summarize-nextflow workflow edge extractor
      locator: packages/summarize-nextflow
    kind: defect
    severity: minor
    what: 'The deterministic edge extractor splits multi-line / literal call arguments into separate bogus edges: e.g. from "[[:]", "[]]", "[]" to SAMTOOLS_CHR and 14 fragment edges ("[", "}", ": file(...)") to MULTIQC; also misses every edge inside local subworkflows (ALIGNMENT_TO_FASTQ, PREPARE_INDICES).'
    expected: Parse call argument lists with bracket/closure depth tracking so literal placeholders are not edges, and emit (or explicitly warn about) subworkflow-internal edges.
    evidence: 'nf-core/bamtofastq@aa0150e workflows/bamtofastq.nf: SAMTOOLS_CHR(ch_input_new, ch_fasta_fai, [[:], []], [[:], []], []) and a multi-line MULTIQC(ch_multiqc_files...map{...}) call; edges had to be rewritten by hand in the LLM pass.'
    status: open
    issue: null
  - id: getgenomeattribute-in-main-nf-not-surfaced
    raised_by: nextflow-summary-to-galaxy-reference-data
    observed_in:
      mold: nextflow-summary-to-galaxy-reference-data
      path: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
      revision: 5
      content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
      foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
    subject:
      kind: implementation
      label: summarize-nextflow param source_kind detection
      locator: packages/summarize-nextflow
    kind: gap
    severity: minor
    what: 'params.fasta / params.fasta_fai are assigned via `params.fasta ?: getGenomeAttribute("fasta")` in main.nf, but summary params[] and reference_assets[] report source_kind nextflow_schema, so the key-expanded-bundle signal the reference-data Mold keys on is absent.'
    expected: Detect getGenomeAttribute fallbacks in main.nf (not only conf/igenomes.config) and record source_kind getGenomeAttribute with source_expression.
    evidence: nf-core/bamtofastq@aa0150e main.nf:37-38; summary reference_assets[].source_kind == nextflow_schema.
    status: open
    issue: null
  - id: sample-sheet-index-sidecar-columns-unaddressed
    raised_by: nextflow-summary-to-galaxy-interface
    observed_in:
      mold: nextflow-summary-to-galaxy-interface
      path: content/molds/nextflow-summary-to-galaxy-interface/index.md
      revision: 6
      content_hash: 43966773391578490688098c9333f6eb2eaa94574755f5b6554e7f9b72a605c0
      foundry_head: 61da115975d155a36face0e83d5c28f638da7fca
    subject:
      kind: research
      label: galaxy-sample-sheet-collections
      locator: content/research/galaxy-sample-sheet-collections/index.md
      content_hash: 98736fdcd0c4f4698af4e0cd4c539b33e3d0db872de1e10487556b21033030ec
    kind: gap
    severity: minor
    what: 'The mapping table sends every samplesheetToList param to a sample_sheet* variant and every extra path column to sample_sheet:record, but says nothing about index sidecar columns (bai/crai/tbi) that Galaxy carries as datatype metadata, nor about enum columns that duplicate the element datatype (file_type: bam|cram).'
    expected: 'Add a row: index sidecar path columns for bam/cram/vcf_bgzip map to datatype metadata, not a record slot; a column equal to the datatype extension can be dropped; if no metadata column remains, a plain list is sufficient.'
    evidence: nf-core/bamtofastq assets/schema_input.json (sample_id, mapped, index, file_type); I had to decide list vs sample_sheet:record without guidance.
    status: open
    issue: null
  - id: per-element-branch-recipe-missing
    raised_by: nextflow-summary-to-galaxy-data-flow
    observed_in:
      mold: nextflow-summary-to-galaxy-data-flow
      path: content/molds/nextflow-summary-to-galaxy-data-flow/index.md
      revision: 8
      content_hash: f71cc2b4ceb115d7d93c3dd2e622cbfafb8b9f338f1dd450ee5773f3c0a0e247
      foundry_head: 61da115975d155a36face0e83d5c28f638da7fca
    subject:
      kind: research
      label: nextflow-operators-to-galaxy-collection-recipes
      locator: content/research/nextflow-operators-to-galaxy-collection-recipes/index.md
      content_hash: 59d97f05e7839f78cb7f42e17299fe6bc373bde8a32eca506238633a3dff9282
    kind: gap
    severity: minor
    what: The branch row says per-element routing 'usually needs explicit filters/classifiers' and the TODOs list 'consider a dedicated pattern for per-element branch', but no recipe is given; the channel-shape note offers per-element when + pick_value instead. The two notes point different ways for a classifier-driven branch whose branches have different collection shapes.
    expected: 'Add a concrete per-element branch recipe: classifier mapped step -> collapse with identifiers -> id list per class -> __FILTER_FROM_FILE__ (kept/discarded), and state when to prefer it over per-element when/pick_value (branches that end in different collection shapes).'
    evidence: nf-core/bamtofastq CHECKPAIREDEND + branch{single_end} routing; I designed the filter recipe without a packaged pattern.
    status: open
    issue: null
  - id: tool-summary-lacks-command-template
    raised_by: summarize-galaxy-tool
    observed_in:
      mold: summarize-galaxy-tool
      path: content/molds/summarize-galaxy-tool/index.md
      revision: 8
      content_hash: a53a303bff1d7ace3b44fb12af329b12695bfcd165933634b8fb6484c0c306f7
      foundry_head: f0515353aec7d57e89f60cac678c80907cf91e4c
    subject:
      kind: related-project
      label: galaxy-tool-util galaxy-tool-cache summarize / ParsedTool
      locator: https://github.com/jmchilton/galaxy-tool-util-ts
    kind: gap
    severity: major
    what: 'The summarize-galaxy-tool procedure says to preserve the command template, strict-shell and stdio behaviour, but the emitted manifest parsed_tool has no command/requirements/stdio fields, so binding-relevant behaviour is invisible: iuc samtools_fastx silently runs `samtools sort -n` first (no collate options), and bgruening fastq_info passes exit codes 1/3 as success.'
    expected: Expose the wrapper command template (or at least requirements, stdio/detect_errors and command text) in the summary manifest, or have the Mold state that raw XML must be fetched and how.
    evidence: 'summaries/fastx and fastq_info manifests: parsed_tool keys = id, version, name, description, inputs, outputs, citations, license, profile, edam_*, xrefs, help. Behaviour only learned from an installed copy of the XML; Tool Shed raw-file returned 403.'
    status: open
    issue: null
  - id: per-step-pin-and-summary-filenames-collide
    raised_by: advance-galaxy-draft-step
    observed_in:
      mold: advance-galaxy-draft-step
      path: content/molds/advance-galaxy-draft-step/index.md
      revision: 12
      content_hash: 12f242ddbbfee7d9fe4ef8b6a2d701beceb71e4885cd19872c51041b04e08b27
      foundry_head: db8801f2f0a31746e35cf399dd96cdbb8aa36dcf
    subject:
      kind: mold
      label: advance-galaxy-draft-step
      locator: content/molds/advance-galaxy-draft-step/index.md
    kind: friction
    severity: minor
    what: The loop runs discover-shed-tool / summarize-galaxy-tool / author-galaxy-tool-wrapper once per step, but each declares a single fixed artifact filename (galaxy-tool-pin.json, galaxy-tool-summary.json, galaxy-user-tool.yml) in the run directory, so iteration k overwrites iteration k-1 and the run record cannot list per-step artifacts.
    expected: Specify a per-step naming convention (e.g. pins/<step>.galaxy-tool-pin.json, summaries/<step>.galaxy-tool-summary.json) in the loop Mold and the harness run-record rules.
    evidence: 26-step bamtofastq loop; I had to invent pins/ and summaries/ subdirectories.
    status: open
    issue: null
  - id: optional-reference-vs-required-wrapper-param
    raised_by: advance-galaxy-draft-step
    observed_in:
      mold: advance-galaxy-draft-step
      path: content/molds/advance-galaxy-draft-step/index.md
      revision: 12
      content_hash: 12f242ddbbfee7d9fe4ef8b6a2d701beceb71e4885cd19872c51041b04e08b27
      foundry_head: db8801f2f0a31746e35cf399dd96cdbb8aa36dcf
    subject:
      kind: research
      label: nextflow-to-galaxy-reference-data-mapping
      locator: content/research/nextflow-to-galaxy-reference-data-mapping/index.md
      content_hash: 4676cdf3de4bcec6161b6102c9e842efa7b3c953f9c2f2787b4debea48e4a7eb
    kind: gap
    severity: minor
    what: The v1 posture says 'explicit optional inputs' for reference assets, but common wrappers (iuc samtools_view, devteam samtools_stats) only accept a history reference as a required data param inside an addref_cond conditional, so an optional workflow input cannot be wired without failing when absent. The note gives no fallback.
    expected: 'State the fallback: make the input required when every consuming wrapper needs it under a conditional, or gate the reference-using variant with when/pick_value; and flag it at reference-data design time.'
    evidence: bamtofastq reference_fasta had to become required in phase 7.
    status: open
    issue: null
  - id: snapshot-note-says-snap-unparsed
    raised_by: nextflow-test-to-galaxy-test-plan
    observed_in:
      mold: nextflow-test-to-galaxy-test-plan
      path: content/molds/nextflow-test-to-galaxy-test-plan/index.md
      revision: 8
      content_hash: fa769216f621ef25470c9fb907df1278635c0a1e022b647b9462ff7b92469291

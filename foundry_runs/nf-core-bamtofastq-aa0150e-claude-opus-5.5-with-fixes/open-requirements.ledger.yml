  because: 'confirmed at template tier: carrying it needs (a) a gate on an optional text input (params.chr) feeding both a samtools view region step and an un-filtered pass-through, (b) a collection-level pick_value rejoin in front of the classifier, and (c) an identifier relabel step (source renames ids to file.baseName = <id>.<chr list joined by _>). tests/chr.nf.test is not the selected test; tests/default.nf.test does not exercise it.'
  unmet: extract reads on selected chromosomes before conversion
  missing: no Galaxy input/step

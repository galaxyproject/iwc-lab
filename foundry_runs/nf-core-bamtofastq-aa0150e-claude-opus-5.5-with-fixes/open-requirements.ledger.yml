  because: workflows/bamtofastq.nf feeds MULTIQC only softwareVersionsToYAML(topic versions) + paramsSummaryMultiqc + methodsDescriptionText; the QC mix is commented out ("TEMPORARILY DISABLED BY ASP"). Nextflow topic channels / params summary have no Galaxy counterpart.

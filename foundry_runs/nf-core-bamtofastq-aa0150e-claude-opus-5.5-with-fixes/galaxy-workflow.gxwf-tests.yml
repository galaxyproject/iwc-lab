- doc: 'nf-core/bamtofastq -profile test: two paired-end BAMs (test, test2) + genome.fasta; defaults (run_read_qc and run_stats true). Translated from nf-core/bamtofastq tests/default.nf.test; see galaxy-test-plan.yml for evidence per assertion.'
  job:
    alignments:
      class: Collection
      collection_type: list
      elements:
      - class: File
        identifier: test
        location: https://github.com/nf-core/test-datasets/raw/bamtofastq/test-datasets/data/genomics/homo_sapiens/illumina/bam/test.paired_end.sorted.bam
        filetype: bam
        hashes:
        - hash_function: SHA-1
          hash_value: 0799f89638bddd570439115c606f425c22d189b1
      - class: File
        identifier: test2
        location: https://github.com/nf-core/test-datasets/raw/bamtofastq/test-datasets/data/genomics/homo_sapiens/illumina/bam/test2.paired_end.sorted.bam
        filetype: bam
        hashes:
        - hash_function: SHA-1
          hash_value: 522fb037cea05b9d41dd69647f27a644838bf507
    reference_fasta:
      class: File
      location: https://raw.githubusercontent.com/nf-core/test-datasets/refs/heads/modules/data/genomics/homo_sapiens/genome/genome.fasta
      filetype: fasta
      hashes:
      - hash_function: SHA-1
        hash_value: 56e7a0c035e2fce8ebe497d3704431d7586fd444
    run_read_qc: true
    run_stats: true
  outputs:
    samtools_flagstat:
      class: Collection
      collection_type: list
      element_count: 2
      element_tests:
        test:
          checksum: md5$a53f3d26e2e9851f7d528442bbfe9781
        test2:
          checksum: md5$acbd95030a362a7e6491faa87d1b9c2c
    samtools_idxstats:
      class: Collection
      collection_type: list
      element_count: 2
      element_tests:
        test:
          checksum: md5$e179601fa7b8ebce81ac3765206f6c15
        test2:
          checksum: md5$90f01313bc89c7fd096aad051cd71b66
    samtools_stats:
      class: Collection
      collection_type: list
      element_count: 2
      element_tests:
        test:
          asserts:
          - that: has_text
            text: "raw total sequences:\t5642"
        test2:
          asserts:
          - that: has_text
            text: "raw total sequences:\t5436"
    fastq_paired:
      class: Collection
      collection_type: list:paired
      element_count: 2
      element_tests:
        test:
          class: Collection
          count: 2
          element_tests:
            forward:
              asserts:
              - that: has_n_lines
                n: 11284
              - that: has_line_matching
                expression: ^@.+/1$
              decompress: true
            reverse:
              asserts:
              - that: has_n_lines
                n: 11284
              decompress: true
        test2:
          class: Collection
          count: 2
          element_tests:
            forward:
              asserts:
              - that: has_n_lines
                n: 10872
              - that: has_line_matching
                expression: ^@.+/1$
              decompress: true
            reverse:
              asserts:
              - that: has_n_lines
                n: 10872
              decompress: true
    fastq_info_paired:
      class: Collection
      collection_type: list
      element_count: 2
      element_tests:
        test:
          asserts:
          - that: has_line
            line: OK
          - that: has_line
            line: 'Number of reads: 2821'
        test2:
          asserts:
          - that: has_line
            line: OK
          - that: has_line
            line: 'Number of reads: 2718'
    fastqc_post_paired_raw:
      class: Collection
      collection_type: list:paired
      element_count: 2
      element_tests:
        test:
          class: Collection
          count: 2
          element_tests:
            forward:
              asserts:
              - that: has_text
                text: "Total Sequences\t2821"
            reverse:
              asserts:
              - that: has_text
                text: "Total Sequences\t2821"
        test2:
          class: Collection
          count: 2
          element_tests:
            forward:
              asserts:
              - that: has_text
                text: "Total Sequences\t2718"
            reverse:
              asserts:
              - that: has_text
                text: "Total Sequences\t2718"
    fastqc_pre_raw:
      class: Collection
      collection_type: list
      element_count: 2
      element_tests:
        test:
          asserts:
          - that: has_text
            text: '##FastQC'
        test2:
          asserts:
          - that: has_text
            text: '##FastQC'
    fastqc_pre_html:
      class: Collection
      collection_type: list
      element_count: 2
      element_tests:
        test:
          asserts:
          - that: has_text
            text: FastQC Report
        test2:
          asserts:
          - that: has_text
            text: FastQC Report
    fastqc_post_paired_html:
      class: Collection
      collection_type: list:paired
      element_count: 2
      element_tests:
        test:
          class: Collection
          count: 2
          element_tests:
            forward:
              asserts:
              - that: has_text
                text: FastQC Report
        test2:
          class: Collection
          count: 2
          element_tests:
            forward:
              asserts:
              - that: has_text
                text: FastQC Report

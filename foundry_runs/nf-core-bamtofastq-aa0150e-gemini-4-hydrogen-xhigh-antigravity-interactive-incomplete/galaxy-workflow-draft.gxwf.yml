class: GalaxyWorkflowDraft
label: bamtofastq
doc: >
  Convert BAM/CRAM alignment collections into single-end and paired-end FASTQ reads
  with pre- and post-conversion alignment and read QC, FASTQ integrity verification,
  and MultiQC reporting. Translated from nf-core/bamtofastq (commit aa0150e).
tags:
  - bamtofastq
  - bam
  - cram
  - fastq
  - qc
  - nf-core

inputs:
  alignments:
    type: collection
    collection_type: list
    optional: false
    format:
      - bam
      - cram
    doc: >
      Collection (list) of BAM and/or CRAM alignment datasets keyed by sample identifier
      (maps nf-core samplesheet sample_id + mapped + file_type; index metadata .bai/.crai
      managed natively by Galaxy).
  fasta:
    type: data
    format: fasta
    optional: true
    doc: >
      Optional reference FASTA file required for CRAM decoding and CRAM alignment QC.
  chr:
    type: string
    optional: true
    default: null
    doc: >
      Optional chromosome/region filter passed to samtools view when non-empty.
  no_read_qc:
    type: boolean
    optional: true
    default: false
    doc: >
      Skip pre-conversion (BAM) and post-conversion (FASTQ) FastQC steps when true
      (maps nf-core params.no_read_QC).
  no_stats:
    type: boolean
    optional: true
    default: false
    doc: >
      Skip pre-conversion samtools flagstat, idxstats, and stats steps when true.
  samtools_collate_fast:
    type: boolean
    optional: true
    default: false
    doc: >
      Use samtools collate fast mode (-f) during alignment-to-FASTQ extraction.
  reads_in_memory:
    type: int
    optional: true
    default: 100000
    doc: >
      Number of temporary reads buffered in memory (-r) when samtools_collate_fast is enabled.
  multiqc_title:
    type: string
    optional: true
    default: ""
    doc: >
      Optional report title passed to MultiQC.

outputs:
  paired_reads:
    outputSource: cat_paired_fastq/TODO_merged_paired_fastq
    doc: Paired-end converted FASTQ reads (list:paired of fastqsanger.gz).
  single_end_reads:
    outputSource: samtools_collatefastq_single/fastq_other
    doc: Single-end converted FASTQ reads (list of fastqsanger.gz; empty when all inputs are paired-end).
  fastqutils_info:
    outputSource: merge_fastqutils_info/TODO_merged_collection
    doc: Per-sample fastq_info integrity verification reports (list of txt).
  samtools_flagstat:
    outputSource: samtools_flagstat/output1
    doc: Pre-conversion samtools flagstat reports (list of txt, skipped when no_stats=true).
  samtools_idxstats:
    outputSource: samtools_idxstats/output
    doc: Pre-conversion samtools idxstats reports (list of tabular, skipped when no_stats=true).
  samtools_stats:
    outputSource: select_samtools_stats/output
    doc: Pre-conversion samtools stats reports (list of txt, skipped when no_stats=true).
  fastqc_pre_conversion_html:
    outputSource: fastqc_pre_conversion/html_file
    doc: Pre-conversion FastQC HTML reports on BAM inputs (skipped when no_read_qc=true).
  fastqc_pre_conversion_zip:
    outputSource: fastqc_pre_conversion/text_file
    doc: Pre-conversion FastQC raw data reports on BAM inputs (skipped when no_read_qc=true).
  fastqc_post_conversion_html:
    outputSource: fastqc_post_conversion/TODO_html_report
    doc: Post-conversion FastQC HTML reports across converted FASTQs (skipped when no_read_qc=true).
  fastqc_post_conversion_zip:
    outputSource: fastqc_post_conversion/TODO_qc_data
    doc: Post-conversion FastQC raw data / ZIP reports across converted FASTQs (skipped when no_read_qc=true).
  multiqc_report:
    outputSource: multiqc/TODO_html_report
    doc: Aggregated MultiQC HTML report (skipped only when both no_read_qc and no_stats are true).

steps:
  samtools_flagstat:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_flagstat/samtools_flagstat
    tool_version: "2.0.8"
    tool_shed_repository:
      name: samtools_flagstat
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
      changeset_revision: a0d8e49a018c
    label: samtools_flagstat
    doc: Pre-conversion samtools flagstat on all BAM/CRAM inputs.
    when: "$(!inputs.no_stats)"
    state:
      output_fmt: txt
    in:
      input1: alignments
      no_stats: no_stats
    out:
      - id: output1

  samtools_idxstats:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_idxstats/samtools_idxstats
    tool_version: "2.0.8"
    tool_shed_repository:
      name: samtools_idxstats
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
      changeset_revision: 13aad5cb9be4
    label: samtools_idxstats
    doc: Pre-conversion samtools idxstats on all BAM/CRAM inputs.
    when: "$(!inputs.no_stats)"
    state: {}
    in:
      input: alignments
      no_stats: no_stats
    out:
      - id: output

  samtools_stats:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_stats/samtools_stats
    tool_version: "2.0.9"
    tool_shed_repository:
      name: samtools_stats
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
      changeset_revision: 8fca6e1eac98
    label: samtools_stats
    doc: Pre-conversion samtools stats on all BAM/CRAM inputs when reference FASTA is omitted.
    when: "$(!inputs.no_stats && inputs.fasta == null)"
    state:
      addref_cond:
        addref_select: "no"
    in:
      input: alignments
      fasta: fasta
      no_stats: no_stats
    out:
      - id: output
        hide: true

  samtools_stats_with_fasta:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_stats/samtools_stats
    tool_version: "2.0.9"
    tool_shed_repository:
      name: samtools_stats
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
      changeset_revision: 8fca6e1eac98
    label: samtools_stats_with_fasta
    doc: Pre-conversion samtools stats on all BAM/CRAM inputs when optional reference `fasta` is supplied.
    when: "$(!inputs.no_stats && inputs.fasta != null)"
    state:
      addref_cond:
        addref_select: history
        ref:
          __class__: ConnectedValue
    in:
      input: alignments
      "addref_cond|ref": fasta
      fasta: fasta
      no_stats: no_stats
    out:
      - id: output
        hide: true

  select_samtools_stats:
    type: pick_value
    label: select_samtools_stats
    doc: Select samtools stats report from either reference-free or reference-FASTA branch (or emit skipped sentinel when no_stats=true).
    state:
      mode: first_or_skip
    in:
      input_0: samtools_stats/output
      input_1: samtools_stats_with_fasta/output
    out:
      - id: output

  detect_bam_alignments:
    label: detect_bam_alignments
    doc: Emit non-empty marker only for BAM elements so CRAM elements do not enter pre-conversion FastQC.
    when: "$(!inputs.no_read_qc)"
    run:
      class: GalaxyUserTool
      id: bamtofastq_detect_bam_alignments
      version: "0.1.0"
      name: Detect BAM alignments
      description: Emit a non-empty text marker for BAM files and an empty file for CRAM files so CRAM inputs can be excluded from BAM-only FastQC.
      container: community.wave.seqera.io/library/coreutils_grep_gzip_lbzip2_pruned:838ba80435a629f8
      shell_command: |
        set -e
        magic=\$(od -N 4 -An -tx1 '$(inputs.alignment.path)' | tr -d ' \t\n\r')
        case "$magic" in
          4352414d|"")
            : > marker.txt
            ;;
          *)
            printf 'bam\n' > marker.txt
            ;;
        esac
      inputs:
        - name: alignment
          type: data
          format:
            - bam
            - cram
          label: Alignment dataset
          help: BAM or CRAM alignment dataset to inspect for BAM vs CRAM format.
      outputs:
        - name: bam_marker
          type: data
          format: txt
          label: BAM marker
          from_work_dir: marker.txt
    in:
      alignment: alignments
      no_read_qc: no_read_qc
    out:
      - id: bam_marker
        hide: true

  filter_empty_bam_markers:
    tool_id: __FILTER_EMPTY_DATASETS__
    tool_version: "1.1.0"
    label: filter_empty_bam_markers
    doc: Remove empty markers corresponding to CRAM datasets.
    when: "$(!inputs.no_read_qc)"
    state: {}
    in:
      input: detect_bam_alignments/bam_marker
      no_read_qc: no_read_qc
    out:
      - id: output
        hide: true

  extract_bam_identifiers:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/collection_element_identifiers/collection_element_identifiers
    tool_version: "0.0.3"
    tool_shed_repository:
      name: collection_element_identifiers
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
      changeset_revision: 3e27acfa4830
    label: extract_bam_identifiers
    doc: Extract surviving BAM element identifiers into a text list for collection filtering.
    when: "$(!inputs.no_read_qc)"
    state: {}
    in:
      input_collection: filter_empty_bam_markers/output
      no_read_qc: no_read_qc
    out:
      - id: output
        hide: true

  filter_bam_alignments:
    tool_id: __FILTER_FROM_FILE__
    tool_version: "1.1.0"
    label: filter_bam_alignments
    doc: Subset `alignments` to BAM-only datasets using surviving identifiers.
    when: "$(!inputs.no_read_qc)"
    state:
      how:
        how_filter: remove_if_absent
        filter_source:
          __class__: ConnectedValue
    in:
      input: alignments
      "how|filter_source": extract_bam_identifiers/output
      no_read_qc: no_read_qc
    out:
      - id: output_filtered
        hide: true

  fastqc_pre_conversion:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc
    tool_version: "0.74+galaxy1"
    tool_shed_repository:
      name: fastqc
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
      changeset_revision: 2c64fded1286
    label: fastqc_pre_conversion
    doc: Run FastQC pre-conversion QC on BAM inputs only.
    when: "$(!inputs.no_read_qc)"
    state: {}
    in:
      input_file: filter_bam_alignments/output_filtered
      no_read_qc: no_read_qc
    out:
      - id: html_file
      - id: text_file

  samtools_chr:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      name: samtools_view
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
      changeset_revision: 5cf9fcc93508
    label: samtools_chr
    doc: Optional region filtering of input alignments when `chr` is supplied without reference FASTA.
    when: "$(inputs.chr != null && inputs.chr !== '' && inputs.fasta == null)"
    state:
      addref_cond:
        addref_select: "no"
      mode:
        outtype: selected_reads
        filter_config:
          cond_region:
            select_region: text
            regions:
              __class__: ConnectedValue
          cond_rg:
            select_rg: "no"
          cond_expr:
            select_expr: "no"
        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            factor: 1
        output_options:
          reads_report_type: retained
          complementary_output: false
          adv_output:
            readtags: []
            collapsecigar: false
          output_format:
            oformat: bam
    in:
      input: alignments
      "mode|filter_config|cond_region|regions": chr
      chr: chr
      fasta: fasta
    out:
      - id: outputsam
        hide: true

  samtools_chr_with_fasta:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      name: samtools_view
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
      changeset_revision: 5cf9fcc93508
    label: samtools_chr_with_fasta
    doc: Optional region filtering of input alignments when `chr` and reference `fasta` are both supplied.
    when: "$(inputs.chr != null && inputs.chr !== '' && inputs.fasta != null)"
    state:
      addref_cond:
        addref_select: history
        ref:
          __class__: ConnectedValue
      mode:
        outtype: selected_reads
        filter_config:
          cond_region:
            select_region: text
            regions:
              __class__: ConnectedValue
          cond_rg:
            select_rg: "no"
          cond_expr:
            select_expr: "no"
        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            factor: 1
        output_options:
          reads_report_type: retained
          complementary_output: false
          adv_output:
            readtags: []
            collapsecigar: false
          output_format:
            oformat: bam
    in:
      input: alignments
      "addref_cond|ref": fasta
      "mode|filter_config|cond_region|regions": chr
      chr: chr
      fasta: fasta
    out:
      - id: outputsam
        hide: true

  select_effective_alignments:
    type: pick_value
    label: select_effective_alignments
    doc: Choose region-filtered alignments when either `samtools_chr` branch ran, otherwise pass through `alignments`.
    state:
      mode: first_non_null
    in:
      input_0: samtools_chr/outputsam
      input_1: samtools_chr_with_fasta/outputsam
      input_2: alignments
    out:
      - id: output
        hide: true

  check_paired_end:
    label: check_paired_end
    doc: Classify each sample alignment as paired-end or single-end by inspecting up to 1000 reads.
    run:
      class: GalaxyUserTool
      id: bamtofastq_check_paired_end
      version: "0.1.0"
      name: Check paired-end alignment reads
      description: Inspect up to 1000 alignment records with samtools view to classify a BAM/CRAM dataset as paired-end or single-end and emit complementary non-empty/empty marker files.
      container: community.wave.seqera.io/library/htslib_samtools:1.23.1--5b6bb4ede7e612e5
      shell_command: |
        set -e
        ref_path='$(inputs.fasta ? inputs.fasta.path : "")'
        if [ -n "$ref_path" ]; then
          ln -sf "$ref_path" ref.fa
          samtools faidx ref.fa
          samtools view -H --reference ref.fa '$(inputs.input.path)' > header.sam
          samtools view --reference ref.fa '$(inputs.input.path)' | head -n 1000 > first1k.sam
        else
          samtools view -H '$(inputs.input.path)' > header.sam
          samtools view '$(inputs.input.path)' | head -n 1000 > first1k.sam
        fi
        lines_to_chk=\$(wc -l < first1k.sam | tr -d ' \t\n\r')
        : > paired.txt
        : > single.txt
        if [ "$lines_to_chk" -gt 0 ]; then
          paired_count=\$(cat header.sam first1k.sam | samtools view -c -f 1 - | tr -d ' \t\n\r')
          if [ "$paired_count" = "$lines_to_chk" ]; then
            printf 'paired_end\n' > paired.txt
          else
            printf 'single_end\n' > single.txt
          fi
        else
          printf 'single_end\n' > single.txt
        fi
      inputs:
        - name: input
          type: data
          format:
            - bam
            - cram
          label: Alignment dataset
          help: BAM or CRAM alignment dataset to inspect for paired-end flags (-f 1).
        - name: fasta
          type: data
          optional: true
          format:
            - fasta
          label: Reference FASTA (optional)
          help: Optional reference FASTA required for decoding CRAM alignments when reference sequences are not cached.
      outputs:
        - name: paired_marker
          type: data
          format: txt
          label: Paired-end marker
          from_work_dir: paired.txt
        - name: single_marker
          type: data
          format: txt
          label: Single-end marker
          from_work_dir: single.txt
    in:
      input: select_effective_alignments/output
      fasta: fasta
    out:
      - id: paired_marker
        hide: true
      - id: single_marker
        hide: true

  filter_empty_paired_markers:
    tool_id: __FILTER_EMPTY_DATASETS__
    tool_version: "1.1.0"
    label: filter_empty_paired_markers
    doc: Drop empty paired-end markers for single-end samples.
    state: {}
    in:
      input: check_paired_end/paired_marker
    out:
      - id: output
        hide: true

  extract_paired_identifiers:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/collection_element_identifiers/collection_element_identifiers
    tool_version: "0.0.3"
    tool_shed_repository:
      name: collection_element_identifiers
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
      changeset_revision: 3e27acfa4830
    label: extract_paired_identifiers
    doc: Extract paired-end sample identifiers into a text file.
    state: {}
    in:
      input_collection: filter_empty_paired_markers/output
    out:
      - id: output
        hide: true

  filter_paired_alignments:
    tool_id: __FILTER_FROM_FILE__
    tool_version: "1.1.0"
    label: filter_paired_alignments
    doc: Subset effective alignments to paired-end samples only.
    state:
      how:
        how_filter: remove_if_absent
        filter_source:
          __class__: ConnectedValue
    in:
      input: select_effective_alignments/output
      "how|filter_source": extract_paired_identifiers/output
    out:
      - id: output_filtered
        hide: true

  filter_empty_single_markers:
    tool_id: __FILTER_EMPTY_DATASETS__
    tool_version: "1.1.0"
    label: filter_empty_single_markers
    doc: Drop empty single-end markers for paired-end samples.
    state: {}
    in:
      input: check_paired_end/single_marker
    out:
      - id: output
        hide: true

  extract_single_identifiers:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/collection_element_identifiers/collection_element_identifiers
    tool_version: "0.0.3"
    tool_shed_repository:
      name: collection_element_identifiers
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
      changeset_revision: 3e27acfa4830
    label: extract_single_identifiers
    doc: Extract single-end sample identifiers into a text file.
    state: {}
    in:
      input_collection: filter_empty_single_markers/output
    out:
      - id: output
        hide: true

  filter_single_alignments:
    tool_id: __FILTER_FROM_FILE__
    tool_version: "1.1.0"
    label: filter_single_alignments
    doc: Subset effective alignments to single-end samples only.
    state:
      how:
        how_filter: remove_if_absent
        filter_source:
          __class__: ConnectedValue
    in:
      input: select_effective_alignments/output
      "how|filter_source": extract_single_identifiers/output
    out:
      - id: output_filtered
        hide: true

  samtools_collatefastq_single:
    label: samtools_collatefastq_single
    doc: Name-collate and extract gzipped single-end FASTQ reads via samtools collate + fastq.
    run:
      class: GalaxyUserTool
      id: bamtofastq_samtools_collatefastq_single
      version: "0.1.0"
      name: Samtools collate and extract single-end FASTQ
      description: Name-collate alignment records with optional fast mode (-f -r) and extract gzipped single-end FASTQ (-0) via samtools collate and samtools fastq.
      container: community.wave.seqera.io/library/htslib_samtools:1.23.1--5b6bb4ede7e612e5
      shell_command: |
        set -e
        ref_path='$(inputs.fasta ? inputs.fasta.path : "")'
        collate_fast='$(inputs.collate_fast ? "true" : "false")'
        reads_in_mem='$(inputs.reads_in_memory !== null && inputs.reads_in_memory !== undefined ? inputs.reads_in_memory : 100000)'
        ref_arg=""
        if [ -n "$ref_path" ]; then
          ln -sf "$ref_path" ref.fa
          samtools faidx ref.fa
          ref_arg="--reference ref.fa"
        fi
        collate_args=""
        if [ "$collate_fast" = "true" ]; then
          collate_args="-f -r $reads_in_mem"
        fi
        samtools collate $collate_args --threads "\${GALAXY_SLOTS:-1}" $ref_arg -O '$(inputs.input.path)' . \
          | samtools fastq -N --threads "\${GALAXY_SLOTS:-1}" $ref_arg -0 output_other.fq.gz -1 tmp_1.fq.gz -s tmp_singleton.fq.gz
      inputs:
        - name: input
          type: data
          format:
            - bam
            - cram
          label: Single-end alignment dataset
          help: BAM or CRAM alignment dataset for a single-end sample.
        - name: fasta
          type: data
          optional: true
          format:
            - fasta
          label: Reference FASTA (optional)
          help: Optional reference FASTA required for decoding CRAM alignments.
        - name: collate_fast
          type: boolean
          optional: true
          value: false
          label: Fast collation mode (-f)
          help: Process primary alignments only using samtools collate -f -r.
        - name: reads_in_memory
          type: integer
          optional: true
          value: 100000
          label: Reads stored in memory (-r)
          help: Number of temporary reads buffered in memory when fast collation mode is enabled.
      outputs:
        - name: fastq_other
          type: data
          format: fastqsanger.gz
          label: Single-end FASTQ reads
          from_work_dir: output_other.fq.gz
    state: {}
    in:
      input: filter_single_alignments/output_filtered
      fasta: fasta
      collate_fast: samtools_collate_fast
      reads_in_memory: reads_in_memory
    out:
      - id: fastq_other

  samtools_view_map_map:
    tool_id: TODO
    tool_version: TODO
    label: samtools_view_map_map
    doc: Extract read-mapped and mate-mapped paired alignments (-b -f1 -F12).
    in:
      TODO_input: filter_paired_alignments/output_filtered
      TODO_fasta: fasta
    out:
      - id: TODO_bam
        hide: true
    _plan_state: |
      Run `samtools view` outputting BAM (`-b`), requiring flag 1 (`0x1` paired), excluding flags 12 (`0x4 | 0x8`, both mapped). Pass optional `fasta` if supplied.
    _plan_context: |
      upstream: nf-core ALIGNMENT_TO_FASTQ -> SAMTOOLS_VIEW_MAP_MAP (nf-core/samtools/view).
      ext.args: `-b -f1 -F12`
      container: community.wave.seqera.io/library/htslib_samtools:1.23.1--5b6bb4ede7e612e5
    _plan_in: |
      `TODO_input` -> `filter_paired_alignments/TODO_filtered_collection` (`list`).
      `TODO_fasta` -> optional `fasta`.
    _plan_out: |
      `TODO_bam` -> `list` `bam` consumed by `collate_fastq_map`.

  samtools_view_unmap_unmap:
    tool_id: TODO
    tool_version: TODO
    label: samtools_view_unmap_unmap
    doc: Extract read-unmapped and mate-unmapped paired alignments (-b -f12 -F256).
    in:
      TODO_input: filter_paired_alignments/output_filtered
      TODO_fasta: fasta
    out:
      - id: TODO_bam
        hide: true
    _plan_state: |
      Run `samtools view` outputting BAM (`-b`), requiring flags 12 (`0x4 | 0x8`), excluding secondary flag 256 (`0x100`). Pass optional `fasta` if supplied.
    _plan_context: |
      upstream: nf-core ALIGNMENT_TO_FASTQ -> SAMTOOLS_VIEW_UNMAP_UNMAP (nf-core/samtools/view).
      ext.args: `-b -f12 -F256`
      container: community.wave.seqera.io/library/htslib_samtools:1.23.1--5b6bb4ede7e612e5
    _plan_in: |
      `TODO_input` -> `filter_paired_alignments/TODO_filtered_collection` (`list`).
      `TODO_fasta` -> optional `fasta`.
    _plan_out: |
      `TODO_bam` -> `list` `bam` consumed by `samtools_merge_unmap`.

  samtools_view_unmap_map:
    tool_id: TODO
    tool_version: TODO
    label: samtools_view_unmap_map
    doc: Extract read-unmapped and mate-mapped paired alignments (-b -f4 -F264).
    in:

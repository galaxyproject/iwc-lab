plan_version: '1'
source:
  kind: nextflow
  name: nf-core/bamtofastq 2.2.1 @ aa0150e
  derived_from: test-evidence
  notes: 'Translated from the selected nf-test candidate tests/default.nf.test::-profile test (snapshot
    tests/default.nf.test.snap, 2 paired-end BAM samples test/test2). Snapshot captures: succeeded_task_count
    (dropped, invocation-level), versions yml (dropped, Galaxy provenance), stable_names (maps to the
    workflow''s labeled outputs), stable_paths (md5 tokens translated per-output below). The nf-test also
    sets params.fasta; the reference FASTA input is not carried by the Galaxy translation (cram-support-dropped),
    so that fixture has no job entry.'
workflow:
  title: nf-core/bamtofastq (Galaxy translation)
  label_source: draft
  notes: 'Labels read from galaxy-workflow.gxwf.yml (inputs: alignments, chr, no_stats, no_read_qc, samtools_collate_fast,
    reads_in_memory; outputs: reads, flagstat, idxstats, stats, fastqc_pre_html, fastqc_pre_data, fastqc_post_html,
    fastqc_post_data, fastqutils_info).'
test_cases:
- id: default-paired-end-bam
  doc: 'Whole-pipeline default test: two paired-end BAM samples through index-free stats/flagstat/ idxstats,
    pre-conversion FastQC, endedness detection, paired conversion (view x4, merge, collate x2, cat), reads
    assembly, post-conversion FastQC and fastq_utils.'
  derived_from: test-evidence
  provenance: tests/default.nf.test::-profile test (nf-test snapshot tests/default.nf.test.snap)
  job_inputs:
  - workflow_label: alignments
    label_status: resolved
    description: Two paired-end BAM elements from the upstream samplesheet (test, test2), fetched from
      nf-core/test-datasets refs/heads/bamtofastq.
    collection_shape: list
    datatype: bam
    fixture:
      storage: remote-url
      location: https://raw.githubusercontent.com/nf-core/test-datasets/refs/heads/bamtofastq/test-datasets/data/genomics/homo_sapiens/illumina/bam/
      checksum: null
      provenance: test-data-refs.json elements (SHA-1s recorded there); local copies staged as test-data/test.paired_end.sorted.bam
        and test-data/test2.paired_end.sorted.bam
  - workflow_label: chr
    label_status: resolved
    description: Left unset in the selected test; region-filter branch skipped.
    collection_shape: null
    datatype: null
    fixture:
      storage: generated-toy
      location: null
      checksum: null
      provenance: unset
  - workflow_label: no_stats
    label_status: resolved
    description: Pipeline default false; stats steps run.
    collection_shape: null
    datatype: null
    fixture:
      storage: generated-toy
      location: null
      checksum: null
      provenance: pipeline default
  - workflow_label: no_read_qc
    label_status: resolved
    description: Pipeline default false; FastQC steps run.
    collection_shape: null
    datatype: null
    fixture:
      storage: generated-toy
      location: null
      checksum: null
      provenance: pipeline default
  - workflow_label: samtools_collate_fast
    label_status: resolved
    description: Pipeline default false; collate without -f -r.
    collection_shape: null
    datatype: null
    fixture:
      storage: generated-toy
      location: null
      checksum: null
      provenance: pipeline default
  - workflow_label: reads_in_memory
    label_status: resolved
    description: Pipeline default 100000; irrelevant with collate_fast false.
    collection_shape: null
    datatype: null
    fixture:
      storage: generated-toy
      location: null
      checksum: null
      provenance: pipeline default
  expected_outputs:
  - workflow_label: flagstat
    label_status: resolved
    description: samtools flagstat per sample; upstream snapshot records md5s.
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: checksum
      intent: Snapshot parity per sample (uncompressed tabular output; checksum hashes stored bytes, matching
        the nf-test token semantics).
      expected_value: md5$a53f3d26e2e9851f7d528442bbfe9781
      tolerance: null
      element_identifier: test
      evidence: test-evidence
      confidence: medium
    - family: checksum
      intent: Snapshot parity per sample.
      expected_value: md5$acbd95030a362a7e6491faa87d1b9c2c
      tolerance: null
      element_identifier: test2
      evidence: test-evidence
      confidence: medium
  - workflow_label: idxstats
    label_status: resolved
    description: samtools idxstats per sample; upstream snapshot records md5s.
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: checksum
      intent: Snapshot parity per sample.
      expected_value: md5$e179601fa7b8ebce81ac3765206f6c15
      tolerance: null
      element_identifier: test
      evidence: test-evidence
      confidence: medium
    - family: checksum
      intent: Snapshot parity per sample.
      expected_value: md5$90f01313bc89c7fd096aad051cd71b66
      tolerance: null
      element_identifier: test2
      evidence: test-evidence
      confidence: medium
  - workflow_label: stats
    label_status: resolved
    description: samtools stats per sample. The raw output embeds the command line in its header, so the
      snapshot md5 cannot translate to a byte-equality check; assert stable SN summary lines instead,
      with values measured from the source command run on the fixtures.
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: has_text
      intent: Assert the raw-total-sequences SN line for sample test; expected value measured by running
        the source module command (samtools stats) on test.paired_end.sorted.bam in the source container
        (decompress not needed; tabular output).
      expected_value: null
      tolerance: null
      element_identifier: test
      evidence: fixture-derived
      confidence: medium
    - family: has_text
      intent: Same SN-line assertion for sample test2.
      expected_value: null
      tolerance: null
      element_identifier: test2
      evidence: fixture-derived
      confidence: medium
  - workflow_label: reads
    label_status: resolved
    description: Converted reads (fastqsanger.gz, stored compressed). The snapshot md5 tokens hash DECOMPRESSED
      content, so checksum can never match; materialize expected files by running the exact source module
      commands (collate|fastq, cat) on the fixtures and compare with decompress.
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: file
      intent: 'Compare test_1 element against the source-command-derived expected file with compare:diff
        and decompress: true (the .gz token rule); expected file materialized in phase 10 from the fixtures
        via the source pipeline''s own commands.'
      expected_value: test-data/expected_test_1.merged.fastq.gz
      tolerance: null
      element_identifier: test_1
      evidence: fixture-derived
      confidence: medium
    - family: file
      intent: Same for test_2 element.
      expected_value: test-data/expected_test_2.merged.fastq.gz
      tolerance: null
      element_identifier: test_2
      evidence: fixture-derived
      confidence: medium
    - family: file
      intent: Same for test2_1 element.
      expected_value: test-data/expected_test2_1.merged.fastq.gz
      tolerance: null
      element_identifier: test2_1
      evidence: fixture-derived
      confidence: medium
    - family: file
      intent: Same for test2_2 element.
      expected_value: test-data/expected_test2_2.merged.fastq.gz
      tolerance: null
      element_identifier: test2_2
      evidence: fixture-derived
      confidence: medium
  - workflow_label: fastqc_pre_html
    label_status: resolved
    description: Pre-conversion FastQC html per sample; no upstream expected content (.nftignore).
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: element_count
      intent: One html element per sample (2).
      expected_value: 2
      tolerance: null
      element_identifier: null
      evidence: intent
      confidence: high
  - workflow_label: fastqc_pre_data
    label_status: resolved
    description: Pre-conversion FastQC raw-data txt per sample; smoke only.
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: element_count
      intent: One data element per sample (2).
      expected_value: 2
      tolerance: null
      element_identifier: null
      evidence: intent
      confidence: high
  - workflow_label: fastqc_post_html
    label_status: resolved
    description: Post-conversion FastQC html per read file; smoke only.
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: element_count
      intent: One html element per converted read (4).
      expected_value: 4
      tolerance: null
      element_identifier: null
      evidence: intent
      confidence: medium
  - workflow_label: fastqc_post_data
    label_status: resolved
    description: Post-conversion FastQC raw-data txt per read file; smoke only.
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: element_count
      intent: One data element per converted read (4).
      expected_value: 4
      tolerance: null
      element_identifier: null
      evidence: intent
      confidence: medium
  - workflow_label: fastqutils_info
    label_status: resolved
    description: 'fastq_utils confirmation txt per read file. The snapshot md5 cannot translate: the file
      content embeds the staged input filename, which differs between nf and Galaxy staging. Assert the
      stable message fragment instead.'
    output_kind: collection
    collection_shape: list
    assertion_intent:
    - family: has_text
      intent: Each read element's txt contains the no-issues confirmation text.
      expected_value: ran and found no issues
      tolerance: null
      element_identifier: null
      evidence: intent
      confidence: high
unresolved:
- kind: assertion
  description: Exact SN summary line values for the stats has_text assertions; measure by running samtools
    stats on the staged fixtures in the source container during implementation.
  blocking: false
  suggested_resolution: Run the source samtools stats command on test-data/test.paired_end.sorted.bam
    and test2.paired_end.sorted.bam and copy the raw-total-sequences SN lines as expected values.
- kind: assertion
  description: The staged basename Galaxy passes to the fastq_utils UDT is not predictable from static
    evidence; the md5 downgrade to has_text absorbs it.
  blocking: false
  suggested_resolution: None needed; has_text fragment is stable across staged names.
omissions:
- target: multiqc_report output
  reason: The MULTIQC step is not carried by the Galaxy translation (at this source commit it aggregates
    only dropped nf-core boilerplate; see run ledger multiqc-step-dropped).
  category: out-of-scope
- target: pipeline_info outputs (versions yml, execution reports)
  reason: Galaxy provenance subsumes them (run ledger pipeline-info-outputs-dropped).
  category: out-of-scope
- target: stats md5 checksum
  reason: samtools stats embeds the command line in its header, so byte-equality with the snapshot md5
    is unreachable; replaced with SN-line content assertions.
  category: nondeterministic
- target: single-end conversion path coverage
  reason: The selected upstream test covers only paired-end samples; the single-end branch is wired but
    untested, matching the upstream suite which has no single-end whole-pipeline case.
  category: out-of-scope
- target: chr region-filter branch coverage
  reason: The upstream chr.nf.test was not the selected candidate; the branch is wired but untested.
  category: out-of-scope
warnings:
- code: untranslatable-snapshot
  message: reads .gz snapshot tokens hash decompressed content; Galaxy stores fastqsanger.gz compressed,
    so checksum can never match (galaxy#24808); downgraded to file-compare with decompress intent.
  path: tests/default.nf.test.snap stable_paths *.merged.fastq.gz tokens
- code: untranslatable-snapshot
  message: fastqutils test.txt md5 embeds the staged input filename, which differs under Galaxy staging;
    downgraded to has_text.
  path: tests/default.nf.test.snap test.txt:md5,db31682c36cde02f1e8567d130537cac
- code: assertion-risk
  message: devteam flagstat/idxstats wrappers run samtools 1.22 while the upstream snapshot was produced
    with samtools 1.23.1; output formats are stable across these versions but checksums are marked medium
    confidence.
  path: galaxy-workflow.gxwf.yml samtools_flagstat/samtools_idxstats steps
- code: no-upstream-expected-outputs
  message: FastQC html/data outputs have no upstream expected content (.nftignore); element_count smoke
    assertions only.
  path: tests/.nftignore fastqc entries

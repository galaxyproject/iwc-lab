plan_version: "1"
source:
  kind: nextflow
  name: nf-core/bamtofastq 2.2.1
  derived_from: test-evidence
  notes: Selected `tests/default.nf.test::-profile test` is the canonical primary real-execution case. Expected text checksums and version assertions come from `tests/default.nf.test.snap`, with `.nftignore` semantics represented through promoted outputs rather than path lists.
workflow:

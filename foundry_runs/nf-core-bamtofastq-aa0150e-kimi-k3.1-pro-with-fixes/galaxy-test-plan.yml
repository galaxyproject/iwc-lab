          storage: remote-url
          location: https://raw.githubusercontent.com/nf-core/test-datasets/refs/heads/bamtofastq/samplesheet/test_bam_samplesheet.csv
          checksum: SHA-1:5fbc0e5a22296a4491a07b46fd53a4bd509ad5b8

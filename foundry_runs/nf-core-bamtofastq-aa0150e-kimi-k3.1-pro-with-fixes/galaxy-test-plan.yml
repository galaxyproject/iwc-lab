omissions:
  - target: exact converted FASTQ snapshot checksums (test_1/2.merged.fastq.gz and test2_1/2.merged.fastq.gz)
    reason: nf-test hashes decompressed gzip content, while Galaxy checksum hashes stored compressed bytes. Only structural/nonempty checks are planned; no Galaxy-generated digest is substituted.
    category: other
  - target: literal stable_name/stable_path publication list and succeeded_task_count
    reason: Output labels/members carry the equivalent existence contract; invocation success is not a per-output assertion.
    category: other
  - target: FastQC pre/post ZIP archives and raw-file checksum parity
    reason: devteam wrapper supplies HTML and raw text but no ZIP; archive-format feature dropped. Only output presence/count is checked.
    category: weak-output
  - target: full multiqc_data directory and multiqc_citations.txt checksum
    reason: Wrapper exposes general statistics rather than the complete directory; source path has no equivalent checksum target.
    category: weak-output
  - target: source version records for FastQC and samtools utilities outside the custom conversion container
    reason: Wrapper ParsedTool evidence does not prove all package versions. Null values are retained rather than fabricated, so exact snapshot assertions for those utilities are omitted.
    category: other
  - target: single-end fastq_info validation and all non-default whole-pipeline candidates
    reason: fastq_info wrapper requires a static paired/single selector that cannot vary per mixed element; only default paired validation is covered. CRAM, chromosome, collate_fast, missing-index and skip-mode candidates remain explicit additional test scope, not silent coverage.
    category: out-of-scope
  - target: literal CSV sample_sheet:record launch interface and iGenomes nickname lookup
    reason: Converted interface uses native BAM list plus explicit FASTA/FAI. These are interface substitutions, not test failures.
    category: out-of-scope
warnings:
  - code: untranslatable-snapshot
    message: The four `.fastq.gz` snapshot tokens hash decompressed bytes, unlike Galaxy's compressed-byte checksum. Those exact checks are intentionally not converted; type/count/nonempty checks are only smoke tests.
    path: tests/default.nf.test.snap entries for test_1.merged.fastq.gz, test_2.merged.fastq.gz, test2_1.merged.fastq.gz, test2_2.merged.fastq.gz
  - code: wrapper-version-evidence-missing
    message: Exact package versions were not established for several wrapper-based QC/stat steps. Those version assertions are omitted rather than claiming source-version parity from wrapper IDs.
    path: software_versions expected-output intent
  - code: snapshot-format-and-coverage-limits
    message: ZIP archive output and full MultiQC data/config aggregation are unavailable. Single-end validation and all eight non-default source test cases are unexecuted scope; checksum-validated text outputs do not establish complete feature parity.
    path: omissions and test case default-paired-bam-with-fasta

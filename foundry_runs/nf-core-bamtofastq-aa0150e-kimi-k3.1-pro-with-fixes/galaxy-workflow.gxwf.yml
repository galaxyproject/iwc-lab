  - id: Format FASTQ validation report
    label: Format FASTQ validation report
    run:
      class: GalaxyUserTool
      id: format_fastq_validation
      version: 1.0.0
      name: Format FASTQ validation result
      description: Run fastq_info once per single or paired sample and emit the nf-core FASTQUTILS_INFO success echo only after successful validation.
      container: quay.io/biocontainers/fastq_utils:0.25.3--ha9dfd29_0
      shell_command: |
        set -euo pipefail
        SAMPLE='$(inputs.reads.name)'
        FORWARD='$(inputs.reads.elements.forward ? inputs.reads.elements.forward.path : "")'
        REVERSE='$(inputs.reads.elements.reverse ? inputs.reads.elements.reverse.path : "")'
        UNPAIRED='$(inputs.reads.elements.unpaired ? inputs.reads.elements.unpaired.path : "")'
        mkdir -p work
        if [ -n "$FORWARD" ]; then
            ln -s "$FORWARD" "work/\${SAMPLE}_1.merged.fastq.gz"
            ln -s "$REVERSE" "work/\${SAMPLE}_2.merged.fastq.gz"
            fastq_info "work/\${SAMPLE}_1.merged.fastq.gz" "work/\${SAMPLE}_2.merged.fastq.gz"
            printf "fastq_utils fastq_info ran and found no issues with \${SAMPLE}_1.merged.fastq.gz \${SAMPLE}_2.merged.fastq.gz\n" > validation.txt
        else
            ln -s "$UNPAIRED" "work/\${SAMPLE}_other.fq.gz"
            fastq_info "work/\${SAMPLE}_other.fq.gz"
            printf "fastq_utils fastq_info ran and found no issues with \${SAMPLE}_other.fq.gz\n" > validation.txt
        fi
      inputs:
        - name: reads
          type: data_collection
          collection_type: paired_or_unpaired
          format:
            - fastqsanger.gz
          label: Converted reads
          help: Original reads provide sample identifier and single/paired context for source-compatible filenames.
      outputs:
        - name: info
          type: data
          format: txt
          from_work_dir: validation.txt
          label: Source-compatible FASTQ validation report
      help:
        format: markdown
        content: |
          Runs fastq_info without additional arguments, matching FASTQUTILS_INFO. The source success text is written only when validation exits successfully. Paired files are named sample_1.merged.fastq.gz and sample_2.merged.fastq.gz; single-end files are named sample_other.fq.gz. A nonzero validation exit fails the job and suppresses the success text.
    in:
      - id: reads
        source: Convert BAM and CRAM to FASTQ/reads
    out: []
    tool_state: null
    position:
      top: 250
      left: 250

class: GalaxyWorkflow
label: nf-core/bamtofastq 2.2.1
doc: Convert BAM/CRAM alignments to validated FASTQ reads with optional reference handling, region selection, FastQC, samtools statistics and MultiQC. Converted from commit aa0150e34a159fa9f3d0ff62128cafeaa2e5fe78.
inputs:
  - id: alignment_samples
    type: collection
    collection_type: list
    format:
      - bam
      - cram
    doc: BAM/CRAM datasets keyed by sample identifier. Missing BAI/CRAI indices are built; Galaxy's native datatype and index metadata replace the source sample-sheet projection.
    position:
      top: 0
      left: 0
  - id: chromosome
    type: string
    optional: true
    default: ""
    doc: Optional source-compatible chromosome/region expression; empty converts all reads.
    position:
      top: 10
      left: 10
  - id: skip_read_qc
    type: boolean
    optional: true
    default: false
    position:
      top: 20
      left: 20
  - id: alignment_stats_mode
    type: string
    optional: true
    default: with_reference
    doc: "Statistics mode: with_reference, without_reference, or skip."
    position:
      top: 30
      left: 30
  - id: fast_collate
    type: boolean
    optional: true
    default: false
    position:
      top: 40
      left: 40
  - id: reads_in_memory
    type: int
    optional: true
    default: 100000
    min: 1
    position:
      top: 50
      left: 50
  - id: reference_fasta
    type: data
    optional: true
    format:
      - fasta
    doc: Required for reference-requiring CRAM operations.
    position:
      top: 60
      left: 60
  - id: reference_fai
    type: data
    optional: true
    format:
      - fai
    doc: Built from FASTA when absent; must match the reference.
    position:
      top: 70
      left: 70
  - id: multiqc_title
    type: string
    optional: true
    default: ""
    position:
      top: 80
      left: 80
  - id: multiqc_logo
    type: data
    optional: true
    position:
      top: 90
      left: 90
  - id: reference_mode
    type: string
    optional: true
    default: build_fai
    doc: "Reference/FAI mode: build_fai, supplied_fai, or no_reference."
    position:
      top: 260
      left: 260
outputs:
  - id: pre_conversion_fastqc_html
    outputSource: Pre-conversion FastQC/html_file
  - id: pre_conversion_fastqc_data
    outputSource: Pre-conversion FastQC/text_file
  - id: pre_conversion_fastqc_zip
    outputSource: Pre-conversion FastQC/zip_file
  - id: alignment_flagstat
    outputSource: Alignment flagstat/output1
  - id: alignment_idxstats
    outputSource: Alignment idxstats
  - id: alignment_stats
    outputSource: Select reference-mode alignment statistics/data_param
  - id: converted_reads
    outputSource: Convert BAM and CRAM to FASTQ/reads
  - id: post_conversion_fastqc_html
    outputSource: Post-conversion FastQC/html_file
  - id: post_conversion_fastqc_data
    outputSource: Post-conversion FastQC/text_file
  - id: post_conversion_fastqc_zip
    outputSource: Post-conversion FastQC/zip_file
  - id: software_versions
    outputSource: Aggregate software versions/versions
  - id: multiqc_report
    outputSource: Aggregate QC with MultiQC/html_report
  - id: multiqc_data
    outputSource: Aggregate QC with MultiQC/stats
  - id: fastq_validation
    outputSource: Format FASTQ validation report/info
steps:
  - id: Build reference FAI when absent
    label: Build reference FAI when absent
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_faidx/samtools_faidx/1.22+galaxy1
    tool_version: 1.22+galaxy1
    tool_shed_repository:
      name: samtools_faidx
      owner: iuc
      changeset_revision: 78d6d62d4ce4
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input
        source: reference_fasta
      - id: when
        source: reference_mode
    out: []
    tool_state: null
    position:
      top: 100
      left: 100
    when: $(inputs.when == "build_fai")
  - id: Select supplied or rebuilt reference FAI
    label: Select supplied or rebuilt reference FAI
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/pick_value/pick_value/0.2.0
    tool_version: 0.2.0
    tool_shed_repository:
      name: pick_value
      owner: iuc
      changeset_revision: b19e21af9c52
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: style_cond|type_cond|pick_from_0|value
        source: reference_fai
      - id: style_cond|type_cond|pick_from_1|value
        source: Build reference FAI when absent
    out: []
    state:
      style_cond:
        pick_style: first
        type_cond:
          param_type: data
          pick_from:
            - {}
            - {}
    tool_state: null
    position:
      top: 110
      left: 110
  - id: Prepare alignment indices
    label: Prepare alignment indices
    tool_id: toolshed.g2.bx.psu.edu/repos/jackcurragh/ribogalaxy_samtools_index/samtools_index/2.0.4
    tool_version: 2.0.4
    tool_shed_repository:
      name: ribogalaxy_samtools_index
      owner: jackcurragh
      changeset_revision: d90d874e1d9e
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input1
        source: alignment_samples
    out: []
    state:
      prim_key_cond:
        prim_key_select: -b
    tool_state: null
    position:
      top: 120
      left: 120
  - id: Pre-conversion FastQC
    label: Pre-conversion FastQC
    run:
      class: GalaxyUserTool
      id: bamtofastq_fastqc
      version: 1.0.0
      name: FastQC for BAM and FASTQ reads
      description: Run native FastQC with quiet threading and extract HTML, ZIP, and raw data for BAM/CRAM or FASTQ inputs.
      container: quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0
      shell_command: |
        SAMPLE='$(inputs.reads.element_identifier)'
        MODE='$(inputs.mode)'
        EXT='$(inputs.mode == "post_conversion" ? "fastq.gz" : inputs.reads.format)'
        mkdir -p fastqc_out work
        ln -s '$(inputs.reads.path)' "work/\${SAMPLE}.\${MODE}.$EXT"
        fastqc --quiet --threads "$GALAXY_SLOTS" --extract --outdir fastqc_out "work/\${SAMPLE}.\${MODE}.$EXT"
        ln -s "fastqc_out/\${SAMPLE}.\${MODE}_fastqc.html" report.html
        ln -s "fastqc_out/\${SAMPLE}.\${MODE}_fastqc.zip" report.zip
        unzip -p "fastqc_out/\${SAMPLE}.\${MODE}_fastqc.zip" '*/fastqc_data.txt' > fastqc_data.txt
      inputs:
        - name: reads
          type: data
          format:
            - bam
            - sam
            - cram
            - fastq
            - fastqsanger
            - fastq.gz
            - fastqsanger.gz
          label: Alignment or FASTQ dataset
          help: BAM/CRAM input for pre-conversion QC, or converted FASTQ(.gz) input for post-conversion QC.
        - name: mode
          type: select
          label: Conversion stage
          options:
            - label: Pre-conversion
              value: pre_conversion
              selected: true
            - label: Post-conversion
              value: post_conversion
          help: Controls the source-compatible basename prefix for reports.
      outputs:
        - name: html_file
          type: data
          format: html
          from_work_dir: report.html
          label: FastQC HTML report
        - name: text_file
          type: data
          format: txt
          from_work_dir: fastqc_data.txt
          label: Raw FastQC data
        - name: zip_file
          type: data
          format: zip
          from_work_dir: report.zip
          label: Native FastQC ZIP archive
      help:
        format: markdown
        content: |
          Runs native FastQC 0.12.1 rather than forcing FASTQ mode. Input identifiers and pre_conversion/post_conversion preserve the source module's report naming conventions. The archive contains fastqc_data.txt for MultiQC aggregation.
    in:
      - id: reads
        source: alignment_samples
      - id: when
        source: skip_read_qc
    out: []
    tool_state:
      mode: pre_conversion
    position:
      top: 140
      left: 140
    when: $(!inputs.when)
  - id: Alignment flagstat
    label: Alignment flagstat
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_flagstat/samtools_flagstat/2.0.8
    tool_version: 2.0.8
    tool_shed_repository:
      name: samtools_flagstat
      owner: devteam
      changeset_revision: a0d8e49a018c
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input1
        source: alignment_samples
      - id: when
        source: alignment_stats_mode
    out: []
    tool_state:
      output_fmt: txt
    position:
      top: 150
      left: 150
    when: $(inputs.when != "skip")
  - id: Alignment idxstats
    label: Alignment idxstats
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_idxstats/samtools_idxstats/2.0.8
    tool_version: 2.0.8
    tool_shed_repository:
      name: samtools_idxstats
      owner: devteam
      changeset_revision: 13aad5cb9be4
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input
        source: alignment_samples
      - id: when
        source: alignment_stats_mode
    out: []
    tool_state: null
    position:
      top: 160
      left: 160
    when: $(inputs.when != "skip")
  - id: Alignment statistics with reference
    label: Alignment statistics with reference
    run:
      class: GalaxyUserTool
      id: bamtofastq_samtools_stats
      version: 1.0.0
      name: Samtools alignment statistics
      description: Run the source samtools stats command with its pinned runtime and original input basenames.
      container: community.wave.seqera.io/library/htslib_samtools:1.23.1--5b6bb4ede7e612e5
      shell_command: |
        set -eu
        BAM='$(inputs.alignment.basename)'
        REF='$(inputs.fasta ? inputs.fasta.basename : "")'
        FASTA=$(inputs.fasta ? "'" + inputs.fasta.path + "'" : "''")
        FAI=$(inputs.fai ? "'" + inputs.fai.path + "'" : "''")
        ln -s '$(inputs.alignment.path)' "$BAM"
        if [ -n "$FASTA" ]; then
            ln -s "$FASTA" "$REF"
            if [ -n "$FAI" ]; then
                ln -s "$FAI" "$REF.fai"
            fi
            samtools stats --threads 1 --reference "$REF" "$BAM" > alignment.stats
        else
            samtools stats --threads 1 "$BAM" > alignment.stats
        fi
      inputs:
        - name: alignment
          type: data
          format:
            - bam
            - cram
          label: Indexed alignment
        - name: fasta
          type: data
          format:
            - fasta
          optional: true
          label: Reference FASTA
        - name: fai
          type: data
          format:
            - fai
          optional: true
          label: Matching reference FAI
      outputs:
        - name: output
          type: data
          format: tabular
          from_work_dir: alignment.stats
          label: Samtools statistics
      help:
        format: markdown
        content: |
          Reproduces SAMTOOLS_STATS with samtools 1.23.1, one thread (the source process_single resource setting), optional --reference, and original FASTA/alignment basenames. The latter two details are retained because samtools records its version and complete command line in the stats file, and the source nf-test snapshot compares those bytes exactly.
    in:
      - id: when
        source: alignment_stats_mode
      - id: alignment
        source: alignment_samples
      - id: fasta
        source: reference_fasta
      - id: fai
        source: Select supplied or rebuilt reference FAI/data_param
    out: []
    tool_state: null
    position:
      top: 170
      left: 170
    when: $(inputs.when == "with_reference")
  - id: Alignment statistics without reference
    label: Alignment statistics without reference
    run:
      class: GalaxyUserTool
      id: bamtofastq_samtools_stats
      version: 1.0.0
      name: Samtools alignment statistics
      description: Run the source samtools stats command with its pinned runtime and original input basenames.
      container: community.wave.seqera.io/library/htslib_samtools:1.23.1--5b6bb4ede7e612e5
      shell_command: |
        set -eu
        BAM='$(inputs.alignment.basename)'
        REF='$(inputs.fasta ? inputs.fasta.basename : "")'
        FASTA=$(inputs.fasta ? "'" + inputs.fasta.path + "'" : "''")
        FAI=$(inputs.fai ? "'" + inputs.fai.path + "'" : "''")
        ln -s '$(inputs.alignment.path)' "$BAM"
        if [ -n "$FASTA" ]; then
            ln -s "$FASTA" "$REF"
            if [ -n "$FAI" ]; then
                ln -s "$FAI" "$REF.fai"
            fi
            samtools stats --threads 1 --reference "$REF" "$BAM" > alignment.stats
        else
            samtools stats --threads 1 "$BAM" > alignment.stats
        fi
      inputs:
        - name: alignment
          type: data
          format:
            - bam
            - cram
          label: Indexed alignment
        - name: fasta
          type: data
          format:
            - fasta
          optional: true
          label: Reference FASTA
        - name: fai
          type: data
          format:
            - fai
          optional: true
          label: Matching reference FAI
      outputs:
        - name: output
          type: data
          format: tabular
          from_work_dir: alignment.stats
          label: Samtools statistics
      help:
        format: markdown
        content: |
          Reproduces SAMTOOLS_STATS with samtools 1.23.1, one thread (the source process_single resource setting), optional --reference, and original FASTA/alignment basenames. The latter two details are retained because samtools records its version and complete command line in the stats file, and the source nf-test snapshot compares those bytes exactly.
    in:
      - id: when
        source: alignment_stats_mode
      - id: alignment
        source: alignment_samples
    out: []
    tool_state: null
    position:
      top: 180
      left: 180
    when: $(inputs.when == "without_reference")
  - id: Select reference-mode alignment statistics
    label: Select reference-mode alignment statistics
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/pick_value/pick_value/0.2.0
    tool_version: 0.2.0
    tool_shed_repository:
      name: pick_value
      owner: iuc
      changeset_revision: b19e21af9c52
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: style_cond|type_cond|pick_from_0|value
        source: Alignment statistics without reference
      - id: style_cond|type_cond|pick_from_1|value
        source: Alignment statistics with reference
    out: []
    state:
      style_cond:
        pick_style: first
        type_cond:
          param_type: data
          pick_from:
            - {}
            - {}
    tool_state: null
    position:
      top: 190
      left: 190
  - id: Convert BAM and CRAM to FASTQ
    label: Convert BAM and CRAM to FASTQ
    run:
      class: GalaxyUserTool
      id: bamtofastq_convert
      version: 1.0.0
      name: Convert alignment to FASTQ reads
      description: Reproduce nf-core/bamtofastq single-end and four-flag-class paired conversion with optional region, reference and fast collate settings.
      container: community.wave.seqera.io/library/htslib_samtools:1.23.1--5b6bb4ede7e612e5
      shell_command: bash convert_alignment.sh
      configfiles:
        - filename: convert_alignment.sh
          content: |
            set -euo pipefail
            INPUT='$(inputs.alignment.path)'
            EXT='$(inputs.alignment.format)'
            SAMPLE='$(inputs.alignment.element_identifier)'
            FASTA='$(inputs.fasta ? inputs.fasta.path : "")'
            FAI='$(inputs.fai ? inputs.fai.path : "")'
            CHR='$(inputs.chr)'
            FAST='$(inputs.fast)'
            READS_IN_MEMORY='$(inputs.reads_in_memory)'
            THREADS="$GALAXY_SLOTS"
            mkdir -p reads work
            if [ "$EXT" = 'cram' ] && [ -z "$FASTA" ]; then
                echo "CRAM input requires its reference FASTA" >&2
                exit 1
            fi
            ln -s "$INPUT" "work/input.$EXT"
            samtools index -@ "$THREADS" "work/input.$EXT"
            LOCAL="work/input.$EXT"
            ref_args=()
            if [ -n "$FASTA" ]; then
                ln -s "$FASTA" work/reference.fasta
                if [ -n "$FAI" ]; then
                    ln -s "$FAI" work/reference.fasta.fai
                else
                    samtools faidx work/reference.fasta
                fi
                ref_args=(--reference "$PWD/work/reference.fasta")
            fi
            if [ "\$( samtools view "\${ref_args[@]}" "$LOCAL" -@"$THREADS" | head -n1000 | wc -l)" -lt "1000" ]; then
                LINES_TO_CHK=\$( samtools view "\${ref_args[@]}" "$LOCAL" -@"$THREADS" | wc -l)
            else
                LINES_TO_CHK=1000
            fi
            if [ -n "$CHR" ]; then
                samtools view --threads "$THREADS" "\${ref_args[@]}" -hb -o "work/chr.$EXT" "$LOCAL" "$CHR"
                samtools index -@ "$THREADS" "work/chr.$EXT"
                LOCAL="work/chr.$EXT"
            fi
            collate_args=()
            if [ "$FAST" = 'true' ]; then
                collate_args=(-f -r "$READS_IN_MEMORY")
            fi
            if [ "\$( { samtools view -H "\${ref_args[@]}" "$LOCAL" -@"$THREADS"; samtools view "\${ref_args[@]}" "$LOCAL" -@"$THREADS" | head -n"$LINES_TO_CHK"; } | samtools view "\${ref_args[@]}" -c -f 1 -@"$THREADS" | awk -v lines="$LINES_TO_CHK" '{print $1/lines}')" = '1' ]; then
                samtools view --threads "$THREADS" "\${ref_args[@]}" -b -f1 -F12 -o work/map_map.$EXT "$LOCAL"
                samtools view --threads "$THREADS" "\${ref_args[@]}" -b -f12 -F256 -o work/unmap_unmap.$EXT "$LOCAL"
                samtools view --threads "$THREADS" "\${ref_args[@]}" -b -f4 -F264 -o work/unmap_map.$EXT "$LOCAL"
                samtools view --threads "$THREADS" "\${ref_args[@]}" -b -f8 -F260 -o work/map_unmap.$EXT "$LOCAL"
                samtools merge --threads "$THREADS" "\${ref_args[@]}" -f "work/unmapped.$EXT" work/unmap_unmap.$EXT work/unmap_map.$EXT work/map_unmap.$EXT
                samtools collate "\${collate_args[@]}" --threads "$THREADS" "\${ref_args[@]}" -O work/map_map.$EXT . | samtools fastq "\${ref_args[@]}" --threads "$THREADS" -N -0 work/mapped_other.fq.gz -1 work/mapped_1.fq.gz -2 work/mapped_2.fq.gz -s work/mapped_singleton.fq.gz
                samtools collate "\${collate_args[@]}" --threads "$THREADS" "\${ref_args[@]}" -O "work/unmapped.$EXT" . | samtools fastq "\${ref_args[@]}" --threads "$THREADS" -N -0 work/unmapped_other.fq.gz -1 work/unmapped_1.fq.gz -2 work/unmapped_2.fq.gz -s work/unmapped_singleton.fq.gz
                cat work/mapped_1.fq.gz work/unmapped_1.fq.gz > "reads/\${SAMPLE}_1.merged.fastq.gz"
                cat work/mapped_2.fq.gz work/unmapped_2.fq.gz > "reads/\${SAMPLE}_2.merged.fastq.gz"
                ln -s "\${SAMPLE}_1.merged.fastq.gz" "reads/\${SAMPLE}_forward.fastq.gz"
                ln -s "\${SAMPLE}_2.merged.fastq.gz" "reads/\${SAMPLE}_reverse.fastq.gz"
                MODE=paired
            else
                samtools collate "\${collate_args[@]}" --threads "$THREADS" "\${ref_args[@]}" -O "$LOCAL" . | samtools fastq "\${ref_args[@]}" --threads "$THREADS" -N -0 "reads/\${SAMPLE}_other.fq.gz" -1 work/single_1.fq.gz -s work/single_singleton.fq.gz
                ln -s "\${SAMPLE}_other.fq.gz" "reads/\${SAMPLE}_unpaired.fastq.gz"
                MODE=single_end
            fi
            SAMTOOLS_VERSION=\$( samtools version | sed '1!d;s/.* //')
            CAT_VERSION=\$( cat --version 2>&1 | head -n 1 | sed 's/^.*coreutils) //; s/ .*//')
            {
                printf 'conversion_mode: %s\n' "$MODE"
                printf 'chromosome: %s\n' "\${CHR:-all}"
                printf 'fast_collate: %s\n' "$FAST"
                printf 'CHECKPAIREDEND:\n  samtools: %s\n' "$SAMTOOLS_VERSION"
                printf 'SAMTOOLS_COLLATEFASTQ_SINGLE_END:\n  samtools: %s\n' "$SAMTOOLS_VERSION"
                printf 'COLLATE_FASTQ_MAP:\n  samtools: %s\n' "$SAMTOOLS_VERSION"
                printf 'COLLATE_FASTQ_UNMAP:\n  samtools: %s\n' "$SAMTOOLS_VERSION"
                printf 'CAT_FASTQ:\n  cat: %s\n' "$CAT_VERSION"
            } > conversion_log.yml
      inputs:
        - name: alignment
          type: data
          format:
            - bam
            - cram
          label: Indexed BAM or CRAM alignment
          help: One sample per mapped invocation; the element identifier is preserved as the output sample key.
        - name: fasta
          type: data
          format:
            - fasta
          label: Reference FASTA
          optional: true
          help: Required when CRAM decoding needs a reference; optional for BAM.
        - name: fai
          type: data
          format:
            - fai
          label: Matching reference FAI
          optional: true
          help: Supplied or workflow-built FASTA index used by samtools where needed.
        - name: chr
          type: text
          label: Chromosome or region
          value: ""
          optional: true
          help: Optional source-compatible chromosome/region expression; empty converts all reads.
        - name: fast
          type: boolean
          label: Use fast samtools collate mode
          value: false
          help: Enable collate -f -r with reads_in_memory.
        - name: reads_in_memory
          type: integer
          label: Reads in memory for fast collate
          value: 100000
          help: Number of reads buffered when fast collate is enabled.
      outputs:
        - name: reads
          type: collection
          collection_type: paired_or_unpaired
          format: fastqsanger.gz
          label: Converted reads
          discover_datasets:
            - discover_via: pattern
              pattern: .*_(?P<designation>forward|reverse)\.fastq\.gz
              directory: reads
            - discover_via: pattern
              pattern: .*_(?P<designation>unpaired)\.fastq\.gz
              directory: reads
        - name: conversion_log
          type: data
          format: yaml
          from_work_dir: conversion_log.yml
          label: Conversion mode and software versions
      help:
        format: markdown
        content: |
          Groups the tightly coupled nf-core CHECKPAIREDEND, optional SAMTOOLS_CHR/index, SAMTOOLS_VIEW_MAP_MAP, SAMTOOLS_VIEW_UNMAP_UNMAP, SAMTOOLS_VIEW_UNMAP_MAP, SAMTOOLS_VIEW_MAP_UNMAP, SAMTOOLS_MERGE_UNMAP, COLLATE_FASTQ_MAP/UNMAP, SAMTOOLS_COLLATEFASTQ_SINGLE_END and CAT_FASTQ operations. Uses samtools 1.23.1 and preserves paired/unpaired structure and source output basenames. The additional forward/reverse links provide Galaxy-native pair identifiers.
    in:
      - id: alignment
        source: alignment_samples
      - id: fasta
        source: reference_fasta
      - id: fai
        source: Select supplied or rebuilt reference FAI/data_param
      - id: chr
        source: chromosome
      - id: fast
        source: fast_collate
      - id: reads_in_memory
        source: reads_in_memory
    out: []
    tool_state: null
    position:
      top: 200
      left: 200
  - id: Post-conversion FastQC
    label: Post-conversion FastQC
    run:
      class: GalaxyUserTool
      id: bamtofastq_fastqc_collection
      version: 1.0.0
      name: FastQC for converted FASTQ samples
      description: Run FastQC once per converted single or paired sample and preserve sample and mate identifiers in HTML, ZIP, and raw-data outputs.
      container: quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0
      shell_command: |
        set -euo pipefail
        SAMPLE='$(inputs.reads.name)'
        FORWARD='$(inputs.reads.elements.forward ? inputs.reads.elements.forward.path : "")'
        REVERSE='$(inputs.reads.elements.reverse ? inputs.reads.elements.reverse.path : "")'
        UNPAIRED='$(inputs.reads.elements.unpaired ? inputs.reads.elements.unpaired.path : "")'
        mkdir -p fastqc_out work
        if [ -n "$FORWARD" ]; then
            ln -s "$FORWARD" "work/\${SAMPLE}.post_conversion_1.fastq.gz"
            ln -s "$REVERSE" "work/\${SAMPLE}.post_conversion_2.fastq.gz"
            fastqc --quiet --threads "$GALAXY_SLOTS" --extract --outdir fastqc_out "work/\${SAMPLE}.post_conversion_1.fastq.gz" "work/\${SAMPLE}.post_conversion_2.fastq.gz"
            for MATE in 1 2; do
                if [ "$MATE" = '1' ]; then DESIGNATION=forward; else DESIGNATION=reverse; fi
                ln -s "fastqc_out/\${SAMPLE}.post_conversion_\${MATE}_fastqc.html" "report_\${DESIGNATION}.html"
                ln -s "fastqc_out/\${SAMPLE}.post_conversion_\${MATE}_fastqc.zip" "report_\${DESIGNATION}.zip"
                unzip -p "fastqc_out/\${SAMPLE}.post_conversion_\${MATE}_fastqc.zip" '*/fastqc_data.txt' > "report_\${DESIGNATION}.txt"
            done
        else
            ln -s "$UNPAIRED" "work/\${SAMPLE}.post_conversion.fastq.gz"
            fastqc --quiet --threads "$GALAXY_SLOTS" --extract --outdir fastqc_out "work/\${SAMPLE}.post_conversion.fastq.gz"
            ln -s "fastqc_out/\${SAMPLE}.post_conversion_fastqc.html" report_unpaired.html
            ln -s "fastqc_out/\${SAMPLE}.post_conversion_fastqc.zip" report_unpaired.zip
            unzip -p "fastqc_out/\${SAMPLE}.post_conversion_fastqc.zip" '*/fastqc_data.txt' > report_unpaired.txt
        fi
      inputs:
        - name: reads
          type: data_collection
          collection_type: paired_or_unpaired
          format:
            - fastqsanger.gz
          label: Converted reads
          help: One converted sample; paired members are passed to the same FastQC invocation as in the source module.
      outputs:
        - name: html_file
          type: collection
          collection_type: paired_or_unpaired
          format: html
          label: Per-sample FastQC HTML reports
          discover_datasets:
            - discover_via: pattern
              pattern: report_(?P<designation>forward|reverse)\.html
            - discover_via: pattern
              pattern: report_(?P<designation>unpaired)\.html
        - name: text_file
          type: collection
          collection_type: paired_or_unpaired
          format: txt
          label: Per-sample raw FastQC data
          discover_datasets:
            - discover_via: pattern
              pattern: report_(?P<designation>forward|reverse)\.txt
            - discover_via: pattern
              pattern: report_(?P<designation>unpaired)\.txt
        - name: zip_file
          type: collection
          collection_type: paired_or_unpaired
          format: zip
          label: Per-sample native FastQC ZIP archives
          discover_datasets:
            - discover_via: pattern
              pattern: report_(?P<designation>forward|reverse)\.zip
            - discover_via: pattern
              pattern: report_(?P<designation>unpaired)\.zip
      help:
        format: markdown
        content: |
          Runs FastQC once per sample with both mates for paired data and one input for single-end data, matching the source FASTQC module. Source-compatible names are sample.post_conversion_1/2.fastq.gz for paired reads and sample.post_conversion.fastq.gz for unpaired reads. HTML, ZIP, and raw fastqc_data outputs remain keyed by sample and forward/reverse/unpaired designation.
    in:
      - id: reads
        source: Convert BAM and CRAM to FASTQ/reads
      - id: when
        source: skip_read_qc
    out: []
    tool_state: null
    position:
      top: 210

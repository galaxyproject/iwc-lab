  - id: Aggregate software versions
    label: Aggregate software versions
    run:
      class: GalaxyUserTool
      id: aggregate_software_versions
      version: 1.0.0
      name: Aggregate verified software versions
      description: Reduce mapped conversion logs to one manifest and record only evidenced package versions.
      container: community.wave.seqera.io/library/htslib_samtools:1.23.1--5b6bb4ede7e612e5
      shell_command: |
        set -eu
        cp '$(inputs.conversion_logs.elements[0].path)' software_versions.yml
        printf '%s\n' 'FASTQC_PRE_CONVERSION:' '  fastqc: 0.12.1' 'FASTQC_POST_CONVERSION:' '  fastqc: 0.12.1' 'FASTQUTILS_INFO:' '  fastqutils: 0.25.3' 'MULTIQC:' '  multiqc: 1.34' 'SAMTOOLS_FAIDX:' '  samtools: null' 'SAMTOOLS_FLAGSTAT:' '  samtools: null' 'SAMTOOLS_IDXSTATS:' '  samtools: null' 'SAMTOOLS_STATS:' '  samtools: 1.23.1' 'wrapper_resolution:' '  fastqc: native FastQC 0.12.1 UDT' '  samtools_faidx: iuc/samtools_faidx 1.22+galaxy1' '  samtools_flagstat: devteam/samtools_flagstat 2.0.8' '  samtools_idxstats: devteam/samtools_idxstats 2.0.8' '  samtools_stats: native samtools 1.23.1 UDT' '  fastqutils: native fastqutils 0.25.3 UDT' '  multiqc: iuc/multiqc 1.34+galaxy0' >> software_versions.yml
      inputs:
        - name: conversion_logs
          type: data_collection
          collection_type: list
          format:
            - yaml
          label: Per-sample conversion and version logs
          help: Mapped logs from bamtofastq_convert; the first log supplies runtime versions shared by every sample in the same pinned container.
      outputs:
        - name: versions
          type: data
          format: yaml
          from_work_dir: software_versions.yml
          label: Aggregated software versions and wrapper identities
      help:
        format: markdown
        content: |
          Reduces all mapped conversion logs to one dataset by using the shared container-version evidence from the first sample. Preserves exact direct-runtime versions and records unresolved wrapper packages as nulls rather than fabricating values.
    in:
      - id: conversion_logs
        source: Convert BAM and CRAM to FASTQ/conversion_log

      name: dada2_plotqualityprofile
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: batch_cond|paired_cond|reads
        source: Sort samples
    out: []
    tool_state:
      batch_cond:
        batch_select: joint
        __current_case__: 0
        paired_cond:
          paired_select: paired
          __current_case__: 0
          reads:
            __class__: ConnectedValue
        aggregate: true
      "n": "10000000"
    uuid: 4186778f-e4dd-4253-afca-28da14e20bd8

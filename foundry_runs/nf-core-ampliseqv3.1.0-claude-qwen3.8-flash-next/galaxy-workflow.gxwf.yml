          from_work_dir: ASV_seqs.ssu.fasta
          label: Filtered ASV sequences
        - name: table
          type: data
          format: tsv
          from_work_dir: ASV_table.ssu.tsv
          label: Filtered ASV abundance table
        - name: stats
          type: data
          format: tsv
          from_work_dir: stats.ssu.tsv
          label: Per-sample input/output read counts
        - name: result
          type: data
          format: tsv
          from_work_dir: result.tsv
          label: Per-ASV best kingdom
      configfiles:
        - filename: ssu_filter.py
          content: |
            #!/usr/bin/env python3
            import sys
            kingdom, fasta_p, table_p, g_bac, g_arc, g_mito, g_euk = sys.argv[1:8]
            TIE = [('mito', 'mito_eval'), ('euk', 'euk_eval'), ('arc', 'arc_eval'), ('bac', 'bac_eval')]
            evalues, method, order = {}, {}, []
            for org, path in [('bac', g_bac), ('arc', g_arc), ('mito', g_mito), ('euk', g_euk)]:
                key = org + '_eval'
                for row in open(path):
                    if row.startswith('#') or not row.strip():
                        continue
                    f = row.split()
                    asv = f[0]
                    if asv not in evalues:
                        evalues[asv] = {}
                        method[asv] = f[1]
                        order.append(asv)
                    ev = float(f[5])
                    if key not in evalues[asv] or ev < float(evalues[asv][key]):
                        evalues[asv][key] = f[5]
            result = {}
            with open('result.tsv', 'w') as w:
                w.write('ASV_ID\tmito_eval\teuk_eval\tarc_eval\tbac_eval\tresult\n')
                for asv in order:
                    vals = [float(evalues[asv].get(k, 1)) if k in evalues[asv] else 1.0 for _, k in TIE]
                    best = TIE[vals.index(min(vals))][0]
                    result[asv] = best
                    w.write('\t'.join([asv] + [evalues[asv].get(k, 'NA') for _, k in TIE] + [best]) + '\n')
            keep = set(kingdom.split(','))
            kept = sorted(a for a in order if result[a] in keep)
            if not kept:
                sys.exit('Chosen kingdom(s) by --filter_ssu has no matches. Please choose a different kingdom (domain) or omit filtering.')
            seqs = {}
            cid = None
            for line in open(fasta_p):
                if line.startswith('>'):
                    cid = line[1:].split()[0]
                    seqs[cid] = []
                elif cid:
                    seqs[cid].append(line.strip())
            seqs = {k: ''.join(v) for k, v in seqs.items()}
            rows = [l.rstrip('\n').split('\t') for l in open(table_p) if l.strip()]
            header, body = rows[0][1:], {r[0]: r[1:] for r in rows[1:]}
            with open('ASV_table.ssu.tsv', 'w') as w:
                w.write('\t'.join([''] + header) + '\n')
                for a in kept:
                    if a not in body:
                        sys.exit('ERROR: Some ASV_IDs are not being merged with sequences, please check ' + a)
                    w.write('\t'.join([a] + body[a]) + '\n')
            with open('ASV_seqs.ssu.fasta', 'w') as w:
                for a in kept:
                    if a not in seqs:
                        sys.exit('ERROR: Some ASV_IDs are not being merged with sequences, please check ' + a)
                    w.write('>%s\n%s\n' % (a, seqs[a]))
            def sums(cols_idx_rows):
                out = []
                for i in range(len(header)):
                    t = 0
                    for r in cols_idx_rows:
                        try:
                            t += float(r[i])
                        except ValueError:
                            pass
                    out.append(int(t))
                return out
            all_s = sums(list(body.values()))
            kept_s = sums([body[a] for a in kept])
            with open('stats.ssu.tsv', 'w') as w:
                w.write('ssufilter_input\tssufilter_output\tsample\n')
                for i, s in enumerate(header):
                    w.write('%d\t%d\t%s\n' % (all_s[i], kept_s[i], s))
      shell_command: python3 ssu_filter.py $(inputs.kingdom.value) $(inputs.fasta.path) $(inputs.table.path) $(inputs.gff_bac.path) $(inputs.gff_arc.path) $(inputs.gff_mito.path) $(inputs.gff_euk.path)
  its_extract_itsx:
    label: its_extract_itsx
    doc: ITSX_CUTASV (engine itsx) - ITS region extraction when cut_its != none and its_extractor=itsx (authored UDT ampliseq_itsx_cutasv; shed bgruening/itsx exists but cannot do the source's parameter-driven outfile selection; twin of its_extract_itsxrust, merged by its_extract_pick).
    when: $(inputs.cut_its) != 'none' && $(inputs.its_extractor) == 'itsx'
    in:
      fasta: ssu_filter/fasta
      cut_its: cut_its
      its_partial: its_partial
    out:
      - id: fasta
      - id: summary
    run:
      class: GalaxyUserTool
      id: ampliseq_itsx_cutasv
      version: 1.0.0
      name: ITSx ITS-region extractor
      description: Cut ITS regions from ASVs with ITSx (ITSX_CUTASV replica, engine itsx)
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Reproduces nf-core/ampliseq `ITSX_CUTASV` verbatim: ITSx -t all --preserve T --date F --positions F --graphical F plus --save_regions ITS1/ITS2 (cut_its) and --partial N (its_partial != 0), --cpu 1, prefix ASV_ITS_seqs; the source's empty-output stop() is kept; the region file chosen by cut_its x its_partial (full / full_and_partial / ITS1 / ITS2 .fasta) is copied to the fixed Galaxy output name ASV_ITS_final.fasta (Galaxy outputs cannot be named from runtime parameters). Authored because the shed bgruening/itsx 1.1.3 wrapper has fixed output sets and cannot perform the source's parameter-driven outfile selection."
      container: quay.io/biocontainers/itsx:1.1.3--hdfd78af_1
      inputs:
        - name: fasta
          type: data
          format:
            - fasta
          label: ASV sequences
        - name: cut_its
          type: text
          value: full
          label: Region
          help: full|its1|its2 - which ITS region the output should be.
        - name: its_partial
          type: integer
          value: 0
          label: Partial threshold
          help: 0 disables --partial; >0 passes ITSx --partial N and selects full_and_partial outputs.
      outputs:
        - name: fasta
          type: data
          format: fasta
          from_work_dir: ASV_ITS_final.fasta
          label: Extracted ITS sequences
        - name: summary
          type: data
          format: txt
          from_work_dir: ASV_ITS_seqs.summary.txt
          label: ITSx summary
      shell_command: 'C="$(inputs.cut_its.value)"; IP=$(inputs.its_partial.value); SR="--save_regions none"; [ "$C" = "its1" ] && SR="--save_regions ITS1"; [ "$C" = "its2" ] && SR="--save_regions ITS2"; P=""; [ "$IP" != "0" ] && P="--partial $IP"; ITSx -i $(inputs.fasta.path) -t all --preserve T --date F --positions F --graphical F $SR $P --cpu 1 -o ASV_ITS_seqs; OUT="ASV_ITS_seqs.ITS1.fasta"; [ "$C" = "its2" ] && OUT="ASV_ITS_seqs.ITS2.fasta"; [ "$C" = "full" ] && OUT="ASV_ITS_seqs.full.fasta"; if [ "$IP" != "0" ]; then case "$C" in full) OUT="ASV_ITS_seqs.full_and_partial.fasta";; its1) OUT="ASV_ITS_seqs.ITS1.full_and_partial.fasta";; its2) OUT="ASV_ITS_seqs.ITS2.full_and_partial.fasta";; esac; fi; if [ ! -s "$OUT" ]; then echo "ERROR: No ITS regions found by ITSx. You might want to modify --cut_its and/or --its_partial" >&2; exit 1; fi; cp "$OUT" ASV_ITS_final.fasta'
  its_extract_itsxrust:
    label: its_extract_itsxrust
    doc: ITSXRUST_CUTASV (engine itsxrust) - ITS region extraction when cut_its != none and its_extractor=itsxrust (authored UDT ampliseq_itsxrust_cutasv; no shed ITSxRust; mutually exclusive twin of its_extract_itsx).
    when: $(inputs.cut_its) != 'none' && $(inputs.its_extractor) == 'itsxrust'
    in:
      fasta: ssu_filter/fasta
      cut_its: cut_its
      its_partial: its_partial
    out:
      - id: fasta
      - id: summary
    run:
      class: GalaxyUserTool
      id: ampliseq_itsxrust_cutasv
      version: 1.0.0
      name: ITSxRust ITS-region extractor
      description: Cut ITS regions from ASVs with ITSxRust (ITSXRUST_CUTASV replica, engine itsxrust)
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Reproduces nf-core/ampliseq `ITSXRUST_CUTASV` verbatim: itsxrust extract --region all with the module's HMM path (${CONDA_PREFIX:-/usr/local}/share/itsxrust/hmm/F.hmm) and preset args left to the caller-free v1 default, the module's its1/its2->ITS1/ITS2 renames, full_and_partial copies for its_partial!=0, coordinate-annotation header stripping, and the QC-JSON-derived summary; the empty-output stop() is kept. The region file chosen by cut_its x its_partial is copied to ASV_ITS_final.fasta (Galaxy outputs cannot be named from runtime parameters). Authored: no Tool Shed ITSxRust wrapper; sibling twin of its_extract_itsx, merged by its_extract_pick."
      container: quay.io/biocontainers/itsxrust:0.3.0--h70df5c0_0
      inputs:
        - name: fasta
          type: data
          format:
            - fasta
          label: ASV sequences
        - name: cut_its
          type: text
          value: full
          label: Region
          help: full|its1|its2 - which ITS region the output should be.
        - name: its_partial
          type: integer
          value: 0
          label: Partial threshold
          help: 0 disables; >0 selects the full_and_partial files (ITSxRust includes partials by default).
      outputs:
        - name: fasta
          type: data
          format: fasta
          from_work_dir: ASV_ITS_final.fasta
          label: Extracted ITS sequences
        - name: summary
          type: data
          format: txt
          from_work_dir: ASV_ITS_seqs.summary.txt
          label: Extraction summary
      shell_command: "HMM=\"${CONDA_PREFIX:-/usr/local}/share/itsxrust/hmm/F.hmm\"; itsxrust extract --input $(inputs.fasta.path) --hmm \"$HMM\" --hmmer-cpu 1 --output ASV_ITS_seqs --region all --output-format fasta --qc-json itsxrust_qc.json; if [ -f ASV_ITS_seqs.its1.fasta ]; then cp ASV_ITS_seqs.its1.fasta ASV_ITS_seqs.ITS1.tmp && mv ASV_ITS_seqs.ITS1.tmp ASV_ITS_seqs.ITS1.fasta && rm -f ASV_ITS_seqs.its1.fasta; fi; if [ -f ASV_ITS_seqs.its2.fasta ]; then cp ASV_ITS_seqs.its2.fasta ASV_ITS_seqs.ITS2.tmp && mv ASV_ITS_seqs.ITS2.tmp ASV_ITS_seqs.ITS2.fasta && rm -f ASV_ITS_seqs.its2.fasta; fi; C=\"$(inputs.cut_its.value)\"; IP=$(inputs.its_partial.value); if [ \"$IP\" != \"0\" ]; then [ -f ASV_ITS_seqs.full.fasta ] && cp ASV_ITS_seqs.full.fasta ASV_ITS_seqs.full_and_partial.fasta; [ -f ASV_ITS_seqs.ITS1.fasta ] && cp ASV_ITS_seqs.ITS1.fasta ASV_ITS_seqs.ITS1.full_and_partial.fasta; [ -f ASV_ITS_seqs.ITS2.fasta ] && cp ASV_ITS_seqs.ITS2.fasta ASV_ITS_seqs.ITS2.full_and_partial.fasta; fi; for f in ASV_ITS_seqs.*.fasta; do [ -f \"$f\" ] && sed -i \"s/|[a-z]*[0-9]*:[0-9]*-[0-9]*//\" \"$f\"; done; if [ -f itsxrust_qc.json ]; then total=$(grep -o '\"total_reads\":[0-9]*' itsxrust_qc.json | grep -o '[0-9]*'); kept=$(grep -o '\"kept\":[0-9]*' itsxrust_qc.json | grep -o '[0-9]*'); skipped=$(grep -o '\"skipped\":[0-9]*' itsxrust_qc.json | grep -o '[0-9]*'); echo \"ITSxRust extraction summary\" > ASV_ITS_seqs.summary.txt; echo \"Number of sequences in input file: ${total:-0}\" >> ASV_ITS_seqs.summary.txt; echo \"Sequences detected as ITS by ITSx: ${kept:-0}\" >> ASV_ITS_seqs.summary.txt; echo \"Number of sequences skipped: ${skipped:-0}\" >> ASV_ITS_seqs.summary.txt; else echo \"ITSxRust: QC JSON not available\" > ASV_ITS_seqs.summary.txt; fi; OUT=\"ASV_ITS_seqs.ITS1.fasta\"; [ \"$C\" = \"its2\" ] && OUT=\"ASV_ITS_seqs.ITS2.fasta\"; [ \"$C\" = \"full\" ] && OUT=\"ASV_ITS_seqs.full.fasta\"; if [ \"$IP\" != \"0\" ]; then case \"$C\" in full) OUT=\"ASV_ITS_seqs.full_and_partial.fasta\";; its1) OUT=\"ASV_ITS_seqs.ITS1.full_and_partial.fasta\";; its2) OUT=\"ASV_ITS_seqs.ITS2.full_and_partial.fasta\";; esac; fi; if [ ! -s \"$OUT\" ]; then echo \"ERROR: No ITS regions found by ITSxRust. You might want to modify --cut_its, --its_partial, or --its_extractor options\" >&2; exit 1; fi; cp \"$OUT\" ASV_ITS_final.fasta"
  its_extract_pick:

    tool_version: 1.38.0+galaxy2
    label: mergepairs
    doc: "DADA2_MERGE standard branch - single-data dadaF/dadaR inputs matched by identifier against the per-sample data_collection lists and the unzip lists give the per-sample map-over (exemplar wiring: dadaF/dadaR from the dada steps' data_collection, derepF/R from UNZIP; its dadaF|__identifier__ pins are dead residue, not copied). Deviation: strategy=consensus has no wrapper knob and runs as standard merge here; concatenate runs the twin mergepairs_concat step."

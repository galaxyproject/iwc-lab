    doc: "MULTIQC report (pin = dominant recent corpus pin for the source's MultiQC 1.35). v1 feeds the two statistics TSVs as custom_content generalstats repeat entries; title from multiqc_title. Deviations vs source report contents, forced by this wrapper surface (parsed evidence): the fastqc port is single-data (a collection there means per-dataset map-over jobs), cutadapt expects its own log format not the wrapper's HTML report, and 1.35+galaxy5 exposes no config-file port - so fastqc/cutadapt/quality-plot artifacts are NOT fed here (they are workflow outputs in their own right) and the multiqc_config interface input was dropped with this correction."

steps:
  fastqc:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/fastqc/fastqc
    tool_version: 0.74+galaxy1
    label: fastqc
    doc: |
      FASTQC - raw read QC per element (Galaxy map-over over the sheet collection).
      Wrapper FastQC 0.74 vs source-pinned 0.12.1: accepted divergence - QC-only step,
      report lands in the same MultiQC module; 0.74+galaxy1 is what TRS, both public
      panels and 41/42 IWC pins actually resolve (newer changesets are not TRS-listed).
    when: "!$(inputs.skip_fastqc)"
    in:
      input_file: input
    out:
      - id: html_file
  cutadapt:
    tool_id: toolshed.g2.bx.psu.edu/repos/lparsons/cutadapt/cutadapt
    tool_version: 5.2+galaxy2
    label: cutadapt
    doc: |
      CUTADAPT_* - primer removal (single region from scalar primers; multiregion dropped).
      5' front adapters = source -g/-G (nf-core cutadapt_5prime). illumina_pe_readthrough and
      retain_untrimmed are not carried (revcomp / multiple_output wrapper variants) - fixed
      report-only posture; cut_its handled downstream. paired_collection assumes PE elements;
      SE sheets would need the single case (v1 default illumina_pe). Whole-collection single
      job yields ONE report, not per-element stats (cutadapt_summary normalizes it).
      Identity corrected at loop iteration 3: the shed hosts this wrapper as
      repos/lparsons/cutadapt/cutadapt (5.2+galaxy2 = source-pinned cutadapt 5.2); the
      iuc/cutadapt TRS versions endpoint 500s - do not re-try it.
    when: "!$(inputs.skip_cutadapt)"
    in:
      library|input_1: input
      library|r1|front_adapters_0|adapter_source|adapter: primer_fwd
      library|r2|front_adapters2_0|adapter_source|adapter: primer_rev
      adapter_options|error_rate: cutadapt_max_error_rate
      adapter_options|overlap: cutadapt_min_overlap
      filter_options|discard_untrimmed: double_primer
    out:
      - id: out_pairs
      - id: report
    state:
      library:
        type: paired_collection
        r1:
          front_adapters:
            - adapter_source:
                adapter_source_list: user
        r2:
          front_adapters2:
            - adapter_source:
                adapter_source_list: user
      adapter_options:
        action: trim
      output_selector:
        - report
  reads_route:
    type: pick_value
    label: reads_route
    doc: rejoin optional-trim cascade - first non-skipped (trimmed when trim ran, raw when skipped)
    state:
      style_cond:
        pick_style: first_or_skip
        type_cond:
          param_type: data
    in:
      pick_from_0|value: cutadapt/out_pairs
      pick_from_1|value: input
    out:
      - id: data_param
  quality_plots:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/dada2_plotqualityprofile/dada2_plotQualityProfile
    tool_version: 1.38.0+galaxy2
    label: quality_plots
    doc: |
      DADA2_QUALITY1+2 - joint pooled quality profiles (exemplar batch_select joint +
      aggregate:true idiom). Collapsed from the planned fw/rv pair: the wrapper consumes
      the PAIRED collection directly and emits output.pdf + output_fwd.pdf + output_rev.pdf
      in one job. Outputs are PDF-only - the wrapper exposes no profile table, so the
      truncation-length derivation reads the fastqs directly (trunclen_compute).
    when: "!$(inputs.skip_dada_quality)"
    in:
      batch_cond|paired_cond|reads: reads_route/data_param
    out:
      - id: output
      - id: output_fwd
      - id: output_rev
    state:
      batch_cond:
        batch_select: joint
        paired_cond:
          paired_select: paired
        aggregate: true
  trunclen_compute:
    label: trunclen_compute
    doc: "DADA2_TRUNCLEN - derive truncation length from the reads when trunclenf unset (workflows/ampliseq.nf:160-164, conf/modules.config TRUNCLEN ext.args). Authored GalaxyUserTool (no Tool Shed wrapper computes truncation lengths; discovery searched 'quality profile'/'trunclen'): reproduces modules/local/dada2_quality (plotQualityProfile per-cycle count/median) + bin/trunclen.py rule (min of first cycle median < trunc_qmin, first cycle count < max_count * trunc_rmin). Deviation recorded in the tool help: one pooled cutoff, not per-direction FW/RV pair (downstream Galaxy filterAndTrim takes a single truncLen anyway)."
    when: $(inputs.trunclenf) == null && !$(inputs.skip_dada_quality)
    run:
      class: GalaxyUserTool
      id: ampliseq_trunclen_compute
      version: 1.0.0
      name: DADA2 Truncation Length Calculator
      description: Derive the DADA2 read truncation length from pooled FASTQ quality profiles when no explicit truncation length was given
      license: GPL-3.0-or-later
      container: quay.io/biocontainers/bioconductor-dada2:1.38.0--r45ha27e39d_0
      inputs:
        - name: reads
          type: data
          format:
            - fastq
            - fastq.gz
          multiple: true
          label: Sequenced reads (FASTQ)
          help: All reads of one group, pooled for the quality profile (both mates of a paired collection are accepted and profiled together).
        - name: qmin
          type: integer
          value: 25
          label: Quality minimum
          help: Truncate before the per-cycle median quality drops below this value (source default 25, from --trunc_qmin).
        - name: rmin
          type: float
          value: 0.75
          label: Read fraction minimum
          help: The chosen cutoff must still retain at least this fraction of the reads; when it would not, a shorter truncation supersedes the quality cutoff (source default 0.75, from --trunc_rmin).
      outputs:
        - name: trunc_len_table
          type: data
          format: tsv
          from_work_dir: trunc_len.tsv
          label: Computed truncation length
      configfiles:
        - filename: trunclen_profile.R
          content: |
            #!/usr/bin/env Rscript
            # Pooled per-cycle quality profile (dada2::plotQualityProfile) +
            # nf-core/ampliseq bin/trunclen.py selection rule.
            suppressPackageStartupMessages(library(dada2))
            readfiles <- commandArgs(trailingOnly = TRUE)
            qmin <- $(inputs.qmin)
            rmin <- $(inputs.rmin)

            plot <- plotQualityProfile(readfiles)
            data <- plot$data

            # per-cycle Count (sum) and Median (median of Score repeated by Count),
            # replicating modules/local/dada2_quality/main.nf
            cycles <- sort(unique(data$Cycle))
            counts <- numeric(length(cycles))
            medians <- numeric(length(cycles))
            for (i in seq_along(cycles)) {
                sub <- data[data[["Cycle"]] == cycles[i], ]
                score <- unlist(rep(sub[["Score"]], sub[["Count"]]))
                counts[i] <- sum(sub[["Count"]])
                medians[i] <- median(score)
            }

            # bin/trunclen.py: first index (0-based) below each cutoff, else full length
            function_find <- function(values, cutoff) {
                hits <- which(values < cutoff)
                if (length(hits) == 0) return(length(values))
                return(hits[1] - 1)
            }
            trunc_median <- function_find(medians, qmin)
            trunc_reads <- function_find(counts, max(counts) * rmin)
            trunc <- min(trunc_median, trunc_reads)

            write.table(data.frame(Direction = "pooled", TruncLen = trunc),
                        file = "trunc_len.tsv", sep = "\t", quote = FALSE, row.names = FALSE)
      shell_command: Rscript trunclen_profile.R $(inputs.reads.map((input) => `'${input.path}'`).join(" "))
    in:
      reads: reads_route/data_param
      qmin: trunc_qmin
      rmin: trunc_rmin
    out:
      - id: trunc_len_table
  trunclen_knot:
    label: trunclen_knot
    doc: "Resolve the single truncation length: explicit trunclenf/trunclenr win (min if both), else the computed table value, else 0 = no truncation (source params.trunclenf ?: 0). Authored GalaxyUserTool; runs unconditionally - the table input is optional because trunclen_compute is when-gated."
    run:
      class: GalaxyUserTool
      id: ampliseq_trunclen_resolve
      version: 1.0.0
      name: DADA2 Truncation Length Resolver
      description: Resolve the single DADA2 truncation length from explicit workflow values, falling back to the computed quality-profile value
      license: GPL-3.0-or-later
      container: quay.io/biocontainers/python:3.13
      inputs:
        - name: table
          type: data
          format:
            - tsv
          optional: true
          label: Computed truncation length table
          help: Single-value TSV produced by the DADA2 Truncation Length Calculator; leave empty when truncation lengths were set explicitly or quality calculation was skipped.
        - name: trunclenf
          type: integer
          value: 0
          label: Forward truncation length
          help: Explicit --trunclenf value; 0 means not set (source treats unset as 0 = no truncation).
        - name: trunclenr
          type: integer
          value: 0
          label: Reverse truncation length
          help: Explicit --trunclenr value; 0 means not set. When both mates are set, the smaller value is used (single truncLen downstream).
      outputs:
        - name: trunc_len_table
          type: data
          format: tsv
          from_work_dir: trunc_len.tsv
          label: Resolved truncation length
      configfiles:
        - filename: trunclen_resolve.py
          content: |
            import os
            import sys

            path = sys.argv[1]
            f = int(sys.argv[2])
            r = int(sys.argv[3])

            if f > 0 and r > 0:
                v = min(f, r)
            elif f > 0:
                v = f
            elif r > 0:
                v = r
            elif path != "EMPTY" and os.path.exists(path):
                v = int(open(path).read().strip())
            else:
                v = 0

            with open("trunc_len.tsv", "w") as fh:
                fh.write(str(v) + "\n")
      shell_command: "python3 trunclen_resolve.py $(inputs.table ? `'${inputs.table.path}'` : 'EMPTY') $(inputs.trunclenf) $(inputs.trunclenr)"
    in:
      table: trunclen_compute/trunc_len_table
      trunclenf: trunclenf
      trunclenr: trunclenr
    out:
      - id: trunc_len_table
  trunc_len_param:
    tool_id: param_value_from_file
    tool_version: 0.1.0
    label: trunc_len_param
    doc: "Stock dataset-to-parameter bridge: feeds the resolved truncation length into the DADA2 wrappers' integer truncLen ports (corpus idiom: capheine-core-and-compare uses the same tool with param_type/remove_newlines state)."
    in:
      input1: trunclen_knot/trunc_len_table
    out:

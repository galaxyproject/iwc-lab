  filter_fw:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/dada2_filterandtrim/dada2_filterAndTrim
    tool_version: 1.38.0+galaxy2
    label: filter_fw
    doc: |
      DADA2_FILTNTRIM - quality filtering + truncation over the whole paired collection.
      Recorded wrapper deviations vs source (modules/local/dada2_filtrunclen.nf): maxEE is a
      single value here (source per-direction c(max_ee, max_ee_r ?: max_ee) - distinct
      max_ee_r values not carried); truncLen is a single value (trunclen_knot resolves one

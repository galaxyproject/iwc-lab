          Mirrors nf-core/ampliseq `QIIME2_PREPTAX` (fit-classifier path) +
          `QIIME2_INSEQ` + `QIIME2_CLASSIFY` in the pipeline's own qiime-CLI
          modules: import the reference FASTA as FeatureData[Sequence] and the

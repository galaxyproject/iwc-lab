  sequencing_type:
    type: string
    restrictions:
      - illumina_pe
      - illumina_se
    default: illumina_pe
    doc: non-illumina platforms not carried (ledger non-illumina-platforms-not-carried)
  asv_calling:
    type: string
    restrictions:
      - auto
      - dada2
    default: auto
    doc: auto resolves to dada2 for illumina
  sample_inference:

      pick_from_0|value: its_extract_itsx/fasta
      pick_from_1|value: its_extract_itsxrust/fasta
    out:
      - id: data_param
  asv_filters:
    label: asv_filters
    doc: "v1 central fusion of FILTER_LEN_ASV (modules/local/filter_len/main.nf: length window over the full-length ASV fasta, table joined on ASV id) and the QIIME2_TABLEFILTERTAXA path (modules/local/qiime2_tablefiltertaxa/main.nf: taxa filter-table contains-mode + feature-table filter-features min-frequency/min-samples, which the source runs on the MAIN path - its condition is true by default since exclude_taxa defaults to mitochondria,chloroplast, workflows/ampliseq.nf:1209-1228). No when-guard: all-defaults = pass-through. Fasta input corrected vs the draft: the source filters the full-length ASV fasta BEFORE ITSx (:790) and the taxa/prevalence filter never touches sequences, so its_extract_pick must not feed this step - ssu_filter/fasta does. Taxonomy comes from tax_table_knot (the source ch_tax single table); with no classifier ran the knot is null, reproduced as the source's silently-skipped taxa filter (stderr warning). Deviations: the source filter-stats rows (stats.len.tsv, FILTER_STATS/MERGE_STATS_FILTERTAXA into ch_stats) are not emitted here, and the filters apply to the single promoted table rather than only to the QIIME2-import consumers."
    in:
      table: merge_tables/asv_table
      fasta: ssu_filter/fasta
      tax: tax_table_knot/data_param
      min_len_asv: min_len_asv
      max_len_asv: max_len_asv
      exclude_taxa: exclude_taxa
      min_frequency: min_frequency
      min_samples: min_samples
    out:
      - id: table
      - id: fasta
    run:
      class: GalaxyUserTool
      id: ampliseq_asv_filters
      version: 1.0.0
      name: ASV filter chain (ampliseq)
      description: Length, taxa-exclusion, min-frequency and min-samples filtering of the ASV table and fasta
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy v1 fusion of two source filters into one central step: FILTER_LEN_ASV (modules/local/filter_len/main.nf - keep ASVs whose sequence length lies in min_len_asv..max_len_asv, table rows kept by join on the ASV id) and the QIIME2_TABLEFILTERTAXA path (modules/local/qiime2_tablefiltertaxa/main.nf - qiime taxa filter-table --p-exclude <csv> --p-mode contains, then qiime feature-table filter-features --p-min-frequency --p-min-samples, which run unconditionally on the main path because exclude_taxa defaults to mitochondria,chloroplast). Reimplemented over plain tsv/fasta instead of qza so no QIIME2 import round-trip is needed; contains-mode matching is the same substring test over the per-ASV concatenated rank string (or the Taxon column when the picked taxonomy table is the raw QIIME2 export shape from the tax_table_knot). The fasta input is the FULL-LENGTH ASV fasta - in the source the length filter runs before ITSx (ch_asv_fasta at workflows/ampliseq.nf:790-796) and the taxa/prevalence filter never touches sequences (:1209-1228), so ITS-extracted sequences must not feed this step. The taxonomy input is optional: with no classifier ran, the source's empty ch_tax channel silently prevents the taxa filter from firing, reproduced here as a stderr warning + skip. Deviations: the source's stats.len.tsv / filter-stats rows (FILTER_LEN_ASV + FILTER_STATS/MERGE_STATS_FILTERTAXA into ch_stats) are not emitted, and min_frequency/min_samples/exclude_taxa apply to the promoted table centrally rather than only on branches that consume the QIIME2-filtered table."
      container: quay.io/biocontainers/python:3.9--1
      inputs:
        - name: table
          type: data
          format:
            - tabular
            - tsv
          label: ASV count table
          help: Merged ASV table; first column holds the ASV sequences (dada2 write.table col.names=NA shape).
        - name: fasta
          type: data
          format:
            - fasta
          label: Full-length ASV sequences
          help: Post-ssu-filter ASV fasta (not the ITS-extracted subset).
        - name: tax
          type: data
          format:
            - tabular
            - tsv
            - txt
          optional: true
          label: ASV taxonomy table
          help: Consolidated-or-branch taxonomy table (ASV_ID + ranks, or feature-id + Taxon); required only when exclude_taxa is not none.
        - name: min_len_asv
          type: integer
          label: Minimum ASV length
          value: 0
          help: "0 = off (source: unset)."
        - name: max_len_asv
          type: integer
          label: Maximum ASV length
          value: 0
          help: "0 = off (source: unset)."
        - name: exclude_taxa
          type: text
          label: Excluded taxa
          value: mitochondria,chloroplast
          help: Comma-separated taxon substrings (qiime taxa filter-table contains mode); none = disabled.
        - name: min_frequency
          type: integer
          label: Minimum total frequency
          value: 1
          help: Drop ASVs whose summed counts are below this (qiime feature-table filter-features).
        - name: min_samples
          type: integer
          label: Minimum sample presence
          value: 1
          help: Drop ASVs present (count > 0) in fewer samples than this.
      outputs:
        - name: table
          type: data
          format: tsv
          from_work_dir: ASV_table.filtered.tsv
          label: Filtered ASV count table
        - name: fasta
          type: data
          format: fasta
          from_work_dir: ASV_seqs.filtered.fasta
          label: Filtered ASV sequences
      configfiles:
        - filename: asv_filters.py
          content: |
            #!/usr/bin/env python3
            # ampliseq v1 fusion of FILTER_LEN (modules/local/filter_len/main.nf) and the
            # QIIME2_TABLEFILTERTAXA taxa + prevalence filters over plain tsv/fasta.
            import sys

            table_p, tax_p, fasta_p, out_table, out_fasta, min_len, max_len, excl, min_freq, min_samples = sys.argv[1:11]
            min_len = int(min_len) or 1
            max_len = int(max_len) or 10**9
            min_freq, min_samples = int(min_freq), int(min_samples)

            seqs = []           # (id, sequence) in fasta order
            by_seq = {}         # sequence -> id (first occurrence wins)
            name, chunks = None, []
            for line in open(fasta_p):
                line = line.rstrip("\n")
                if line.startswith(">"):
                    if name is not None:
                        s = "".join(chunks)
                        seqs.append((name, s)); by_seq.setdefault(s, name)
                    name, chunks = line[1:].split()[0], []
                elif name is not None:
                    chunks.append(line.strip())
            if name is not None:
                s = "".join(chunks)
                seqs.append((name, s)); by_seq.setdefault(s, name)

            with open(table_p) as fh:
                header = fh.readline().rstrip("\n").split("\t")
                rows = []
                for line in fh:
                    if not line.strip():
                        continue
                    f = line.rstrip("\n").split("\t")
                    rows.append((f[0], [int(x) if x not in ("", "NA") else 0 for x in f[1:]]))

            def keep_row(seq, counts):
                ids = by_seq.get(seq)
                if ids is None:
                    return False                      # FILTER_LEN keeps only ids present in both
                if not (min_len <= len(seq) <= max_len):
                    return False
                if sum(counts) < min_freq:
                    return False
                if sum(1 for c in counts if c > 0) < min_samples:
                    return False
                return True

            excl_tokens = [t for t in excl.split(",") if t.strip()] if excl and excl != "none" else []
            excl_tokens = [t.strip() for t in excl_tokens]
            taxstr = {}
            if excl_tokens:
                if not tax_p or tax_p == "-":
                    sys.stderr.write("WARNING: exclude_taxa set but no taxonomy table supplied (no classifier ran?) - taxa filter skipped\n")
                    excl_tokens = []
                else:
                    with open(tax_p) as fh:
                        th = fh.readline().rstrip("\n").split("\t")
                        meta = {"ASV_ID", "confidence", "sequence", "classifier", "database", "SH", "BOLD_bin", "Taxon"}
                        rank_i = [i for i, c in enumerate(th) if c not in meta]
                        taxon_i = th.index("Taxon") if "Taxon" in th else None
                        for line in fh:
                            f = line.rstrip("\n").split("\t")
                            if not f or not f[0]:
                                continue
                            taxstr[f[0]] = f[taxon_i] if taxon_i is not None and len(f) > taxon_i else ";".join(f[i] for i in rank_i if i < len(f))

            kept = []
            for seq, counts in rows:
                if not keep_row(seq, counts):
                    continue
                if excl_tokens:
                    rid = by_seq.get(seq)
                    t = taxstr.get(rid, "")
                    if any(tok in t for tok in excl_tokens):
                        continue
                kept.append((seq, counts))
            if not kept:
                sys.stderr.write("ERROR: ASV filtering removed all sequences - adjust min_len_asv/max_len_asv/min_frequency/min_samples/exclude_taxa\n")
                sys.exit(1)

            kept_ids = {by_seq[seq] for seq, _ in kept}
            with open(out_table, "w") as out:
                out.write("\t".join(header) + "\n")
                for seq, counts in kept:
                    out.write("\t".join([seq] + [str(c) for c in counts]) + "\n")
            with open(out_fasta, "w") as out:
                for name, seq in seqs:
                    if name in kept_ids:
                        out.write(">%s\n%s\n" % (name, seq))
      shell_command: |
        TAXARG="$(inputs.tax.path)"; [ -f "$TAXARG" ] || TAXARG="-";
        python3 asv_filters.py $(inputs.table.path) "$TAXARG" $(inputs.fasta.path) ASV_table.filtered.tsv ASV_seqs.filtered.fasta $(inputs.min_len_asv.value) $(inputs.max_len_asv.value) "$(inputs.exclude_taxa.value)" $(inputs.min_frequency.value) $(inputs.min_samples.value)
  codon_filter:
    label: codon_filter
    doc: FILTER_CODONS replica - filt_codons.py drop of ASVs with stop codons in the orf_start..orf_end frame (modules/local/filter_codons/main.nf + conf/modules.config:542-546 arg assembly + utils validation :395-398 + all-removed error :812-814, all folded into the tool). Table lookup adapted from the source's sequence-as-id keying to the merged-table shape (rows keyed by sequence, fasta ids ASV_N) - see tool help; single-line FASTA required (all upstream producers emit it). orf_end 0 = unset, matching the source leaving -e off; -s is always passed because the schema default orf_start=1 makes it truthy in the source. Stats/list outputs of the source are not surfaced (same stats-chain deviation as asv_filters).
    when: $(inputs.filter_codons)
    in:
      fasta: asv_filters/fasta
      table: asv_filters/table
      orf_start: orf_start
      orf_end: orf_end
      stop_codons: stop_codons
    out:
      - id: table
      - id: fasta
    run:
      class: GalaxyUserTool
      id: ampliseq_codon_filter
      version: 1.0.0
      name: Codon-frame ASV filter (ampliseq)
      description: Drop ASVs carrying stop codons (or a non-multiple-of-3 span) in the configured reading frame
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy replica of nf-core/ampliseq FILTER_CODONS (modules/local/filter_codons/main.nf, biocontainers/pandas:1.1.5 pin kept): runs bin/filt_codons.py to drop ASVs containing a stop codon in the reading frame orf_start..orf_end, plus the pipeline-initialisation validation \"(orf_end + 1 - orf_start) % 3 != 0 => error\" (subworkflows/local/utils_nfcore_ampliseq_pipeline/main.nf:395-398) and the empty-output guard the source runs via channel.subscribe (:812-814). Two adaptations, both recorded: (1) the count table is keyed by the ASV SEQUENCE (the merged ASV table shape) while the fasta ids are ASV_N labels, so the table lookup uses the sequence line - in the source fasta ids and table row names are both the sequences, and its ASV ids are sequences; sequences must therefore be single-line FASTA (all upstream ampliseq producers emit that). (2) orf_end = 0 means unset (the source leaves -e off; the script's begin=0 default that would mis-slice is unreachable in the source because schema default orf_start=1 makes -s always present, and this tool always passes -s). The source's ASV_codon_filtered.list and the filt_codon_stats.py stats row into ch_stats are not emitted (same stats-chain deviation as ampliseq_asv_filters)."
      container: quay.io/biocontainers/pandas:1.1.5
      inputs:
        - name: fasta
          type: data
          format:
            - fasta
          label: ASV sequences
          help: Single-line-per-sequence ASV fasta.
        - name: table
          type: data
          format:
            - tabular
            - tsv
          label: ASV count table
          help: ASV table keyed by sequence in its first column.
        - name: orf_start
          type: integer
          label: ORF start position
          value: 1
          help: 1-based position where codon triplets begin (source schema default 1).
        - name: orf_end
          type: integer
          label: ORF end position
          value: 0
          help: "0 = check to the end of each sequence (source: unset)."
        - name: stop_codons
          type: text
          label: Stop codons
          value: TAA,TAG
          help: Comma-separated codons that disqualify an ASV.
      outputs:
        - name: table
          type: data
          format: tsv
          from_work_dir: ASV_codon_filtered.table.tsv
          label: Codon-filtered ASV count table
        - name: fasta
          type: data
          format: fasta
          from_work_dir: ASV_codon_filtered.fna
          label: Codon-filtered ASV sequences
      configfiles:
        - filename: filt_codons.py
          content: |
            #!/usr/bin/env python3
            ##### Program description #######
            #
            # Title: Filtering ASVs with stop codons
            #
            # Author(s): Lokeshwaran Manoharan
            #
            #
            #
            # Description: The ASVs are filtered if they contain stop codons in the reading frame specified.
            #
            # List of subroutines:
            #
            #
            #
            # Overall procedure: using functions and dictionaries in python
            #
            # Usage: filt_codons.py [-h] -f <Seq_file> -t <ASV_table> [-s BEGIN] [-e END] -p <output_basename>
            #
            ##################################

            import re
            import sys
            import copy
            import argparse

            usage = """This program filters ASVs that contains any stop codon or if the length from the position is not a multiple of 3 in the right reading frame."""

            parser = argparse.ArgumentParser(description=usage)

            parser.add_argument(
                "-f",
                "--fasta",
                dest="fasta",
                type=argparse.FileType("r"),
                help="Fasta file of the ASVs from the AmpliSeq pipeline",
                required=True,
            )

            parser.add_argument(
                "-t",
                "--count-table",
                dest="count",
                type=argparse.FileType("r"),
                help="Count table file of the ASVs from the AmpliSeq pipeline",
                required=False,
            )

            parser.add_argument(
                "-s",
                "--start-position",
                dest="begin",
                type=int,
                help="Specific position of the ASV where to start checking for codons. By default it starts from position 1",
                required=False,
                default=0,
            )

            parser.add_argument(
                "-e",
                "--end-position",
                dest="end",
                type=int,
                help="Specific position of the ASV where to stop checking for codons. By default it checks until the end of the sequence",
                required=False,
            )

            parser.add_argument(
                "-x",
                "--stop-codons",
                dest="stopcodon",
                type=str,
                help='Specific stop codons to look for. Specify multiple codons with in a comma separated list like: "TAA,TAG". By default TAA and TAG are being looked for.',
                required=False,
                default="TAA,TAG",
            )

            parser.add_argument(
                "-p",
                "--out-prefix",
                dest="prefix",
                type=str,
                help="Prefix of the output files with filtered ASVs and the corresponding count table. The output files will be in *<prefix>_filtered.* format",
                required=True,
            )


            args = parser.parse_args()

            if args.begin is not None:
                begin = args.begin
            else:
                begin = 1

            if args.stopcodon is not None:
                stopcodon = args.stopcodon
            else:
                stopcodon = "TAA,TAG"

            stop_list = [item.strip() for item in stopcodon.split(",")]


            def check_asv(seq, start, stop):
                sub_seq = seq[start - 1 : stop]
                sub_list = []
                for x in range(0, len(sub_seq), 3):
                    sub_list.append(sub_seq[x : x + 3])
                if not len(sub_seq) % 3 == 0:
                    return False
                elif any(x in sub_list for x in stop_list):
                    return False
                else:
                    return True


            Out_Seq = open(args.prefix + "_filtered.fna", "w")
            Out_list = open(args.prefix + "_filtered.list", "w")
            if args.count is not None:
                Out_table = open(args.prefix + "_filtered.table.tsv", "w")
            else:
                Out_table = open("empty_" + args.prefix + "_filtered.table.tsv", "w")

            count_dict = {}
            p1 = re.compile("\t")
            p2 = re.compile(">")

            if args.count is not None:
                count = 0
                for line in args.count:
                    line = line.rstrip("\n")
                    if count == 0:
                        print(line, file=Out_table)
                        count += 1
                    else:
                        tmp_list = re.split(p1, line)
                        count_dict[tmp_list[0]] = line

            for line in args.fasta:
                line = line.rstrip("\n")
                if re.match(p2, line) is not None:
                    bin_head = re.sub(p2, "", line)
                else:
                    if args.end is not None:
                        end = args.end
                    else:
                        end = len(line)
                    if check_asv(line, begin, end):
                        print(">", bin_head, "\n", line, file=Out_Seq, sep="")
                        print(bin_head, file=Out_list)
                        if args.count is not None:
                            # adaptation for the Galaxy shape: the merged ASV table is keyed by the
                            # sequence itself while fasta ids are ASV_N labels (the source keys both
                            # by sequence); look the row up by the sequence line.
                            if line in count_dict:
                                print(count_dict[line], file=Out_table)
                            else:
                                sys.stderr.write("WARNING: no count-table row for %s\n" % bin_head)

            if args.count is not None:
                args.count.close()
            args.fasta.close()
            Out_Seq.close()
            Out_list.close()
            Out_table.close()
      shell_command: |
        ARGS="-x $(inputs.stop_codons.value)";
        if [ "$(inputs.orf_end.value)" -gt 0 ]; then
          SPAN=$(( $(inputs.orf_end.value) + 1 - $(inputs.orf_start.value) ));
          if [ $(( SPAN % 3 )) -ne 0 ]; then echo "Incompatible parameters: The difference of --orf_end and --orf_start must be a multiple of 3." >&2; exit 1; fi;
          ARGS="$ARGS -e $(inputs.orf_end.value)";
        fi;
        python3 filt_codons.py -f $(inputs.fasta.path) -t $(inputs.table.path) -s $(inputs.orf_start.value) $ARGS -p ASV_codon;
        if [ ! -s ASV_codon_filtered.fna ]; then echo "ASV codon filtering activated by 'filter_codons' removed all ASVs, please adjust settings." >&2; exit 1; fi
  vsearch_cluster:
    label: vsearch_cluster
    doc: VSEARCH_CLUSTER - optional OTU-style reclustering of ASVs with vsearch --cluster_smallmem at the vsearch_cluster_id identity (--usersort --qmask none, per conf/modules.config:750-754). Emits one FASTA file per cluster as a list collection; headers are ASV sequences, restored to ASV_N labels by filter_clusters. Split from the template's fused step because the source runs vsearch (samtools+vsearch wave container, no python) and the table remap (pandas:1.1.5) in two containers.
    when: $(inputs.vsearch_cluster)
    in:
      fasta: codon_filter/fasta
      cluster_id: vsearch_cluster_id
    out:
      - id: clusters
    run:
      class: GalaxyUserTool
      id: ampliseq_vsearch_cluster
      version: 1.0.0
      name: ASV post-clustering with VSEARCH (ampliseq)
      description: Re-cluster ASVs into OTU-style clusters at a fixed pairwise identity with vsearch --cluster_smallmem
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: Galaxy replica of the nf-core VSEARCH_CLUSTER module (modules/nf-core/vsearch/cluster/main.nf) as invoked by nf-core/ampliseq (workflows/ampliseq.nf:698-706), where conf/modules.config:750-754 set args="--id <vsearch_cluster_id> --usersort --qmask none", args2="--cluster_smallmem" and args3="--clusters". Two recorded deviations. (1) The source's wave container is samtools+vsearch; samtools only serves the --samout branch this invocation never takes, so the pinned BioContainers vsearch image of the same vsearch 2.31.0 build is used. (2) FASTA headers are temporarily relabelled to the sequences before clustering (the awk pass below), so cluster-file headers key on ASV sequences exactly as in the source, where dada2 ASV ids ARE the sequences; ampliseq_filter_clusters maps them back to the ASV_N labels this draft's FASTA convention uses. vsearch writes one numbered FASTA per cluster (the module globs *.clusters.fasta*[0-9]); those files are published uncompressed as a list collection (the source gzips each and its filt_clusters.py gzip-opens the list).
      container: quay.io/biocontainers/vsearch:2.31.0--hd2be7a0_0
      inputs:
        - name: fasta
          type: data
          format:
            - fasta
          label: ASV sequences
          help: ASV fasta, one sequence per record (single-line sequences).
        - name: cluster_id
          type: float
          label: Pairwise identity threshold
          value: 0.97
          help: Clustering identity passed to vsearch --id (source vsearch_cluster_id, default 0.97).
      outputs:
        - name: clusters
          type: collection
          collection_type: list
          format: fasta
          label: Cluster files (one per cluster, first record is the centroid; headers are sequences)
          discover_datasets:
            - discover_via: pattern
              pattern: ASV_post_clustering.clusters.fasta*
      shell_command: |
        awk '/^>/{if(seq){print ">" seq; print seq} seq=""; next} {seq=seq $0} END{if(seq){print ">" seq; print seq}}' "$(inputs.fasta.path)" > relabeled.fasta;
        vsearch --cluster_smallmem relabeled.fasta --clusters ASV_post_clustering.clusters.fasta --threads 1 --id "$(inputs.cluster_id.value)" --usersort --qmask none
  filter_clusters:
    label: filter_clusters
    doc: "FILTER_CLUSTERS - collapse the ASV count table and FASTA onto cluster centroids: member rows are summed into their centroid row and dropped, centroids keep table order, centroid headers are restored to ASV_N labels. Replica of bin/filt_clusters.py (see embedded tool help for the four adaptations). Guarded by the same vsearch_cluster switch as its producer."
    when: $(inputs.vsearch_cluster)
    in:
      clusters: vsearch_cluster/clusters
      table: codon_filter/table
      fasta: codon_filter/fasta
    out:
      - id: table
      - id: fasta
    run:
      class: GalaxyUserTool
      id: ampliseq_filter_clusters
      version: 1.0.0
      name: Cluster-representative ASV table remap (ampliseq)
      description: Keep one row per cluster centroid, summing member abundances, after VSEARCH post-clustering
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy replica of nf-core/ampliseq FILTER_CLUSTERS (modules/local/filter_clusters/main.nf, biocontainers/pandas:1.1.5 pin kept): runs bin/filt_clusters.py to collapse the ASV count table onto VSEARCH cluster centroids (member rows summed into the centroid row and dropped, centroid rows kept in place; one FASTA file per cluster, first record is the centroid - same space-separated list on stdin as the source's echo '${clusters}' | ... -c -). Four recorded adaptations. (1) Cluster files are read as plain text; the source gzips the VSEARCH output at publish time and gzip-opens each file. (2) Output FASTA headers are mapped back to the ASV_N labels of this draft's ASV convention via the original ASV FASTA (-f); the source needs no such step because its dada2 ids are the sequences (ampliseq_vsearch_cluster clustered a sequence-labelled copy). A sequence missing from the label map keeps its sequence header with a warning. (3) The centroid records are buffered to apply that relabel after parsing; ordering (file order, first record first) is unchanged. (4) The ASVs_before/after_clustering stats table is not emitted (same stats-chain deviation as ampliseq_asv_filters / ampliseq_codon_filter)."
      container: quay.io/biocontainers/pandas:1.1.5
      inputs:
        - name: clusters
          type: data
          format:
            - fasta
          multiple: true
          label: Cluster files (one per cluster)
          help: Output of ampliseq_vsearch_cluster; first record of each file is that cluster's centroid.
        - name: table
          type: data
          format:
            - tabular
            - tsv
          label: ASV count table
          help: ASV table keyed by sequence in its first column.
        - name: fasta
          type: data
          format:
            - fasta
          label: Original ASV fasta (label map)
          help: The pre-clustering ASV fasta, used to restore ASV_N headers on the centroid output.
      outputs:
        - name: table
          type: data
          format: tsv
          from_work_dir: ASV_post_clustering_filtered.table.tsv
          label: Centroid-collapsed ASV count table
        - name: fasta
          type: data
          format: fasta
          from_work_dir: ASV_post_clustering_filtered.fna
          label: Cluster centroid ASV sequences
      configfiles:
        - filename: filt_clusters.py
          content: |
            #!/usr/bin/env python3
            # Replica of nf-core/ampliseq bin/filt_clusters.py with the adaptations stated in
            # the tool help: plain-text cluster files, ASV_N header restoration from the
            # original fasta (buffered centroid records), no stats table.
            import argparse
            import sys

            import pandas as pd

            usage = """This program filters ASVs that aren't centroids after post-clustering."""

            parser = argparse.ArgumentParser(description=usage)

            parser.add_argument(
                "-t",
                "--count-table",
                dest="count",
                type=argparse.FileType("r"),
                help="Count table file of the ASVs from the AmpliSeq pipeline",
                required=True,
            )

            parser.add_argument(
                "-p",
                "--prefix",
                dest="prefix",
                type=str,
                help="Prefix of the output files",
                required=True,
            )

            parser.add_argument(
                "-c",
                "--cluster-fastas",
                dest="cluster_fastas",
                type=argparse.FileType("r"),
                default=sys.stdin,
                help="Space separated list of fasta files of the clusters. First read of the cluster should be the centroid of that cluster.",
                required=True,
            )

            parser.add_argument(
                "-f",
                "--asv-fasta",
                dest="asv_fasta",
                type=argparse.FileType("r"),
                help="Original ASV fasta used to map centroid sequence headers back to ASV labels",
                required=False,
            )

            count = parser.parse_args().count
            prefix = parser.parse_args().prefix

            # sequence -> original label map (single-line-per-sequence convention, tolerant of
            # wrapped sequences by joining continuation lines)
            label_by_seq = {}
            if parser.parse_args().asv_fasta is not None:
                seq = None
                name = None
                for line in parser.parse_args().asv_fasta:
                    line = line.rstrip("\n")
                    if line.startswith(">"):
                        if seq is not None:
                            label_by_seq[seq] = name
                        name = line[1:]
                        seq = ""
                    elif seq is not None:
                        seq += line
                if seq is not None:
                    label_by_seq[seq] = name

            # This dictionary will store the centroid ASVs as keys, and the values will be the ASVs clustered to that centroid
            cluster_dict = {}
            centroid_order = []
            centroid_seq = {}

            # Loop though list of cluster fasta files to populate cluster_dict
            # adaptation (1): plain open - the Galaxy-side cluster files are not gzipped
            cluster_fastas = parser.parse_args().cluster_fastas.read().rstrip().split(" ")
            for cluster_fasta in cluster_fastas:
                read_num = 0

                with open(cluster_fasta, "rt") as in_fasta:
                    for line in in_fasta:
                        line = line.rstrip("\n")

                        # If the line is not a sequence
                        if line.startswith(">"):
                            read_num += 1
                            asv_name = line[1:]

                            # If the read is the centroid
                            if read_num == 1:
                                centroid_name = asv_name
                                cluster_dict[centroid_name] = []
                                centroid_order.append(centroid_name)
                                centroid_seq[centroid_name] = ""

                            # If the read is not the centroid
                            else:
                                cluster_dict[centroid_name].append(asv_name)

                        # If the line is a sequence
                        else:
                            # If the read is the centroid
                            if read_num == 1:
                                centroid_seq[centroid_name] += line

            # This count_df will have ASVs as the index, and samples as the header
            count_df = pd.read_table(count, delimiter="\t", index_col=0, header=0)

            # Loop through centroids
            for centroid in cluster_dict.keys():
                # If the current centroid has ASVs clustered to it
                if cluster_dict[centroid] != []:
                    # Get a list of all ASVs in the cluster (including the centroid)
                    cluster_list = cluster_dict[centroid].copy()
                    cluster_list.append(centroid)

                    # Sum all rows in the cluster
                    summed_row = count_df.loc[cluster_list].sum()

                    # Assign summed row to centroid row and drop non-centroid rows
                    count_df.loc[centroid] = summed_row
                    count_df.drop(cluster_dict[centroid], inplace=True)

            # Output filtered count tsv
            count_df.to_csv(prefix + "_filtered.table.tsv", sep="\t")

            # adaptations (2)+(3): centroid fasta written after parsing, headers restored to the
            # original ASV labels (file order, centroid first, as the source streamed them)
            with open(prefix + "_filtered.fna", "w") as out_fasta:
                for centroid in centroid_order:
                    label = label_by_seq.get(centroid)
                    if label is None:
                        sys.stderr.write("WARNING: centroid sequence not found in the ASV fasta, keeping sequence header\n")
                        label = centroid
                    out_fasta.write(">" + label + "\n" + centroid_seq[centroid] + "\n")
      shell_command: |
        echo $(inputs.clusters.map((input) => `'${input.path}'`).join(" ")) | python3 filt_clusters.py -t "$(inputs.table.path)" -f "$(inputs.fasta.path)" -p ASV_post_clustering -c -

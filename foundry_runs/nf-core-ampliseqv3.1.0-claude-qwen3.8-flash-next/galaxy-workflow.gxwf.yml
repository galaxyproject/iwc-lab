      description: Import ASVs and classify them with a pre-trained QIIME2 sk-learn classifier, exporting the taxonomy table
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: |
          Mirrors nf-core/ampliseq `QIIME2_INSEQ` + `QIIME2_CLASSIFY` (the
          pipeline's own qiime-CLI modules, container qiime2/qiime2:2026.4):
          `qiime tools import` the ASV fasta as FeatureData[Sequence],
          `qiime feature-classifier classify-sklearn`, then `qiime tools export`
          to taxonomy.tsv. The .qzv visualization of the module is skipped. Used
          when the user supplies a pre-trained classifier (source

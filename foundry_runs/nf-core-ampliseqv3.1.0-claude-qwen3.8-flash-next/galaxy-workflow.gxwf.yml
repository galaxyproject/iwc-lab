    doc: DECONTAM - contaminant removal using control/quant_reading metadata columns (isContaminant for decontaminate, prevalence-only isNotContaminant for notcontaminant, mode from the decontam switch), fused with the source's FILTER_SEQUENCES_ABUNDANCES FASTA rebind and the workflow's empty-result errors (:723, :737). Step id decontam_run because the bare interface input 'decontam' (wired to the mode port) would resolve to a step named decontam. The source's collectFile sheet-metadata bridge (ampliseq.nf:260-267) rides the metadata workflow input - sample-sheet column values do not reach tool inputs in Galaxy v1; details/counts/log publications are not emitted.

  core_metrics:
    label: core_metrics
    doc: "QIIME2_DIVERSITY_CORE as embedded UDT (qiime2/qiime2:2026.4): sampling depth = minimum per-sample count (awk column sums over the wide ASV table - same minimum as count_table_minmax_reads.py over the filter-taxon stats table, taxa filtering drops features not samples) raised to the diversity_rarefaction_depth floor, then qiime diversity core-metrics-phylogenetic --output-dir with --p-n-jobs-or-threads 1. Publishes the shannon alpha-group-significance qzv (DIVERSITY_ALPHA module pattern) as div_plots and the weighted UniFrac matrix as distance_matrix for adonis (source flattens ALL four matrices; single-port v1 choice - tool help). metadata = filtered metadata (ch_metadata rebind at workflows/ampliseq.nf:1145; shared metadata != null guard closes the last raw-metadata QIIME2 consumer)."
    when: "!$(inputs.skip_diversity_indices) && $(inputs.metadata) != null"
    in:
      table: import_table/qza
      phylogeny: qiime2_tree/rooted_tree
      metadata: filter_samples/metadata
      stats: asv_table_knot/data_param
      min_depth: diversity_rarefaction_depth
    out:
      - id: div_plots
      - id: distance_matrix
    run:
      class: GalaxyUserTool
      id: ampliseq_core_metrics
      version: 1.0.0
      name: QIIME2 diversity core metrics (ampliseq)
      description: Rarefy at the derived sampling depth and compute phylogenetic diversity core metrics, publishing an alpha significance plot and the weighted UniFrac distance matrix
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy replica of the nf-core/ampliseq QIIME2_DIVERSITY_CORE process (modules/local/qiime2_diversity_core/main.nf, container qiime2/qiime2:2026.4 kept, the draft's standing qiime2 pin). Command core verbatim: UNIFRAC_USE_GPU=N and the XDG/MPL/NUMBA exports, sampling depth = minimum per-sample count raised to the diversity_rarefaction_depth floor (the module's count_table_minmax_reads.py minimum vs params.diversity_rarefaction_depth rule; awk column sums over the wide count table give the same minimum - taxa filtering drops features, never samples), then qiime diversity core-metrics-phylogenetic --output-dir with --p-n-jobs-or-threads 1 (Galaxy single-core; upstream ${task.cpus}). Galaxy adaptations. (1) Published outputs: the module emits all vectors/matrices/pcoa qzas; this tool publishes ONE alpha visualization - alpha-group-significance on the shannon vector (the QIIME2_DIVERSITY_ALPHA module's pattern, ${baseName}-vis.qzv with a fixed name) - as div_plots, and ONE distance matrix - weighted_unifrac copied to a fixed name - as distance_matrix for the adonis step (upstream flattens ALL four matrices into beta-group-significance/adonis; the draft has single ports and weighted UniFrac is the standard primary metric - v1 choice). The remaining diversity_core artifacts stay in the working directory. (2) The rarefaction-depth WARNING display files (log.warn echo upstream) and versions.yml are dropped (precedent). (3) The beta and ordination visualizers (QIIME2_DIVERSITY_BETA/BETAORD per metacolumn) have no counterpart - no equivalent draft step."
      container: quay.io/qiime2/qiime2:2026.4
      inputs:
        - name: table
          type: data
          label: Feature table artifact
          help: QIIME2 FeatureTable[Frequency] qza (import_table).
        - name: phylogeny
          type: data
          label: Rooted phylogeny artifact
          help: QIIME2 rooted tree qza (qiime2_tree).
        - name: metadata
          type: data
          format:
            - tabular
            - tsv
          label: Sample metadata
          help: Tab-separated sample metadata (filtered metadata, source ch_metadata rebind).
        - name: stats
          type: data
          format:
            - tabular
            - tsv
          label: Wide count table (depth derivation)
          help: ASV x sample counts (asv_table_knot) - minimum per-sample column sum derives --p-sampling-depth.
        - name: min_depth
          type: integer
          label: Sampling depth floor
          value: 500
          help: Floor for the derived minimum (params.diversity_rarefaction_depth; the module raises the sample minimum to this when smaller).
      outputs:
        - name: div_plots
          type: data
          from_work_dir: alpha-shannon.qzv
          label: Shannon diversity group significance (qzv)
        - name: distance_matrix
          type: data
          from_work_dir: weighted-unifrac-distance-matrix.qza
          label: Weighted UniFrac distance matrix (qza)
      shell_command: |
        export UNIFRAC_USE_GPU=N
        export XDG_CONFIG_HOME="./xdgconfig"
        export XDG_CACHE_HOME="./xqcache"
        export MPLCONFIGDIR="./mplconfigdir"
        export NUMBA_CACHE_DIR="./numbacache"
        mindepth=$(awk -F'\t' 'NR>1 {for (i=2; i<=NF; i++) s[i]+=$i} END {m=""; for (i in s) if (m=="" || s[i]<m) m=s[i]; printf "%d", m}' "$(inputs.stats.path)")
        if [ "$mindepth" -lt "$(inputs.min_depth)" ]; then mindepth="$(inputs.min_depth)"; fi
        qiime diversity core-metrics-phylogenetic \
            --m-metadata-file "$(inputs.metadata.path)" \
            --i-phylogeny "$(inputs.phylogeny.path)" \
            --i-table "$(inputs.table.path)" \
            --p-sampling-depth "$mindepth" \
            --output-dir diversity_core \
            --p-n-jobs-or-threads 1 \
            --verbose
        qiime diversity alpha-group-significance \
            --i-alpha-diversity diversity_core/shannon_vector.qza \
            --m-metadata-file "$(inputs.metadata.path)" \
            --o-visualization alpha-shannon.qzv
        cp diversity_core/weighted_unifrac_distance_matrix.qza weighted-unifrac-distance-matrix.qza
  alpha_rarefaction:
    label: alpha_rarefaction
    doc: "QIIME2_ALPHARAREFACTION - module command block verbatim on qiime2/qiime2:2026.4; --p-max-depth auto-derived by awk column sums over the knot count table (equal to the module's minmax-reads over the filter-taxon stats table: taxa filtering drops features, never samples; the draft has no q2 filter-taxon step), qzv export-folder unpack and versions dropped (tool help). metadata is the FILTERED metadata (source ch_metadata rebind, ledger filter-samples carry-forward; filter_samples shares this step's metadata != null guard). New workflow output publishes the qzv (the source publishes the visualization; the simplified report has no rarefaction section)."
    when: "!$(inputs.skip_alpha_rarefaction) && $(inputs.metadata) != null"
    in:
      table: import_table/qza
      phylogeny: qiime2_tree/rooted_tree
      metadata: filter_samples/metadata
      stats: asv_table_knot/data_param
    out:
      - id: plot
    run:
      class: GalaxyUserTool
      id: ampliseq_alpha_rarefaction
      version: 1.0.0
      name: QIIME2 alpha rarefaction (ampliseq)
      description: Rarefy the feature table across auto-derived depth/steps and visualize alpha diversity rarefaction profiles
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy replica of the nf-core/ampliseq QIIME2_ALPHARAREFACTION process (modules/local/qiime2_alphararefaction/main.nf, container qiime2/qiime2:2026.4 kept verbatim, the same pin as the draft's other QIIME2 UDTs). The command block is the module's: the four XDG/MPL/NUMBA cache exports, the module's max-depth rule - maximum per-sample count, capped at 75000, steps = 250 when maxdepth > 5000 else maxdepth/20 - then qiime diversity alpha-rarefaction --p-iterations 10 producing alpha-rarefaction.qzv. Galaxy adaptations. (1) Max-depth source: the module runs bin/count_table_minmax_reads.py over the QIIME2 filter-taxon stats table (which this draft has no step for); the same per-sample maximum is computed with awk column sums over the wide ASV count table wired in as stats - the sums are identical because filter-taxon drops FEATURES (rows), never samples (columns). (2) The qiime tools export of the qzv into the alpha-rarefaction/ folder is dropped: it feeds the full source summary report's embedded rarefaction plots, which this draft's simplified report does not render; the qzv itself is the emitted visualization. (3) versions.yml dropped (pipeline_info precedent). Note: params.diversity_rarefaction_depth does NOT govern this step upstream - the subworkflow passes it only to QIIME2_DIVERSITY_CORE; rarefaction depth is always auto-derived."
      container: quay.io/qiime2/qiime2:2026.4
      inputs:
        - name: table
          type: data
          label: Feature table artifact
          help: QIIME2 FeatureTable[Frequency] qza (import_table).
        - name: phylogeny
          type: data
          label: Rooted phylogeny artifact
          help: QIIME2 rooted tree qza (qiime2_tree).
        - name: metadata
          type: data
          format:
            - tabular
            - tsv
          label: Sample metadata
          help: Tab-separated sample metadata (filtered metadata, source ch_metadata rebind).
        - name: stats
          type: data
          format:
            - tabular
            - tsv
          label: Wide count table (depth derivation)
          help: ASV x sample counts (asv_table_knot) - per-sample column sums derive --p-max-depth.
      outputs:
        - name: plot
          type: data
          from_work_dir: alpha-rarefaction.qzv
          label: Alpha rarefaction visualization (qzv)
      shell_command: |
        export XDG_CONFIG_HOME="./xdgconfig"
        export XDG_CACHE_HOME="./xqcache"
        export MPLCONFIGDIR="./mplconfigdir"
        export NUMBA_CACHE_DIR="./numbacache"
        maxdepth=$(awk -F'\t' 'NR>1 {for (i=2; i<=NF; i++) s[i]+=$i} END {m=0; for (i in s) if (s[i]>m) m=s[i]; printf "%d", m}' "$(inputs.stats.path)")
        if [ "$maxdepth" -gt "75000" ]; then maxdepth="75000"; fi
        if [ "$maxdepth" -gt "5000" ]; then maxsteps="250"; else maxsteps=$((maxdepth/20)); fi
        qiime diversity alpha-rarefaction \
            --i-table "$(inputs.table.path)" \
            --i-phylogeny "$(inputs.phylogeny.path)" \
            --p-max-depth "$maxdepth" \
            --m-metadata-file "$(inputs.metadata.path)" \
            --p-steps "$maxsteps" \
            --p-iterations 10 \
            --o-visualization alpha-rarefaction.qzv
  barplots:
    label: barplots
    doc: "QIIME2_BARPLOTAVG fused to one job (qiime2/qiime2:2026.4): relative-frequency, the featuretable_group where-filter + group --p-mode sum on the chosen metadata_category_barplot, taxa barplot on the consolidated taxonomy qza - module commands verbatim; the biom-tsv round-trip/re-import of the relative table collapses (identity inside the job), single category in v1, exported svg folder dropped and taxa-bar-plots.qzv published instead (tool help). metadata = filtered metadata (ch_metadata rebind; shared metadata != null guard)."
    when: "!$(inputs.skip_barplot) && $(inputs.metadata_category_barplot) != null && $(inputs.metadata) != null"
    in:
      table: import_table/qza
      taxonomy: import_taxonomy/qza
      metadata: filter_samples/metadata
      category: metadata_category_barplot
    out:
      - id: barplots
    run:
      class: GalaxyUserTool
      id: ampliseq_barplots
      version: 1.0.0
      name: QIIME2 grouped taxonomic barplots (ampliseq)
      description: Relativize the ASV table, group samples by a metadata category and render taxonomic average-abundance barplots
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy replica of the nf-core/ampliseq QIIME2_BARPLOTAVG subworkflow (subworkflows/local/qiime2_barplotavg + modules qiime2_export_relasv, qiime2_inasv, qiime2_featuretable_group, qiime2_barplot - all pinned to qiime2/qiime2:2026.4, kept). Command chain is the modules': feature-table relative-frequency; feature-table filter-samples --p-where \"cat\"<>'' (the featuretable_group module drops samples lacking the category); feature-table group --p-axis sample --m-metadata-column cat --p-mode sum; taxa barplot --i-table grouped --i-taxonomy tax --o-visualization (the average call passes NO metadata document, since grouping already collapsed samples by category). Galaxy adaptations. (1) The source round-trips the relative table to biom-tsv (qiime2_export_relasv) and re-imports it (QIIME2_INASV_BPAVG) only because rel_tsv is also a standalone artifact; inside this tool the qza feeds forward directly - identical abundances, no re-import. (2) One category: upstream tokenizes params.metadata_category_barplot by comma and runs per category; v1 treats the input as a single metadata column (ancom single-category precedent). (3) The exported barplot folder (svg/pngs for the full summary report) is dropped; the taxa-bar-plots.qzv is the emitted result, fixed name (static from_work_dir). (4) Taxonomic levels tax_agglom_min/max do NOT touch this path upstream (barplotavg passes the consolidated tax qza unagglomerated; the levels feed ANCOM_TAX) - nothing to reproduce. (5) versions.yml dropped (pipeline_info precedent)."
      container: quay.io/qiime2/qiime2:2026.4
      inputs:
        - name: table
          type: data
          label: Feature table artifact
          help: QIIME2 FeatureTable[Frequency] qza (import_table).
        - name: taxonomy
          type: data
          label: Taxonomy artifact
          help: QIIME2 taxonomy qza (import_taxonomy).
        - name: metadata
          type: data
          format:
            - tabular
            - tsv
          label: Sample metadata
          help: Tab-separated sample metadata (filtered metadata, source ch_metadata rebind).
        - name: category
          type: text
          label: Barplot metadata category
          help: Metadata column to group samples by (params.metadata_category_barplot, single category in v1).
      outputs:
        - name: barplots
          type: data
          from_work_dir: taxa-bar-plots.qzv
          label: Taxonomic barplots (qzv)
      shell_command: |
        export XDG_CONFIG_HOME="./xdgconfig"
        export XDG_CACHE_HOME="./xqcache"
        export MPLCONFIGDIR="./mplconfigdir"
        export NUMBA_CACHE_DIR="./numbacache"
        mcat="$(inputs.category)"
        qiime feature-table relative-frequency \
            --i-table "$(inputs.table.path)" \
            --o-relative-frequency-table rel.qza
        qiime feature-table filter-samples \
            --i-table rel.qza \
            --m-metadata-file "$(inputs.metadata.path)" \
            --p-where "\"$mcat\"<>''" \
            --o-filtered-table filtered.qza
        qiime feature-table group \
            --i-table filtered.qza \
            --p-axis 'sample' \
            --m-metadata-file "$(inputs.metadata.path)" \
            --m-metadata-column "$mcat" \
            --p-mode 'sum' \
            --o-grouped-table grouped.qza
        qiime taxa barplot \
            --i-table grouped.qza \
            --i-taxonomy "$(inputs.taxonomy.path)" \
            --o-visualization taxa-bar-plots.qzv \
            --verbose
  ancom:
    label: ancom
    doc: "QIIME2_ANCOM (ASV branch) for the single chosen metadata_category: the qiime2_filtersamples where-clause (category<>\"\") + add-pseudocount + composition ancom command sequence on qiime2:2026.4, fused into one job. Source's per-column / per-rank fan-outs collapsed to the interface's metadata_category (v1, step plan); ancom_sample_min_count is dead upstream (no consumer - no port invented). metadata is the filtered metadata (ch_metadata rebind; shared metadata != null guard)."
    when: $(inputs.ancom) && $(inputs.metadata) != null && $(inputs.metadata_category) != null
    in:
      table: import_table/qza
      metadata: filter_samples/metadata
      category: metadata_category
    out:
      - id: result
    run:
      class: GalaxyUserTool
      id: ampliseq_ancom
      version: 1.0.0
      name: QIIME2 ANCOM differential abundance (ampliseq)
      description: Filter samples missing a metadata category, add pseudocounts, and run QIIME2 ANCOM for one metadata column
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy replica of the nf-core/ampliseq QIIME2_ANCOM subworkflow ASV branch (subworkflows/local/qiime2_ancom + modules/local/qiime2_filtersamples + qiime2_ancom_asv, container qiime2/qiime2:2026.4 kept verbatim) fused into one job. The command sequence is the modules': XDG/MPL/NUMBA exports, feature-table filter-samples --p-where '<category><>\"\"' (drop samples without a category value - the filtersamples module's default args), composition add-pseudocount, composition ancom --m-metadata-column <category>. Collapsing to one category: the source fans out over EVERY metadata column (METADATA_ALL) and every taxonomic rank (tax_agglom_min..max via ANCOM_TAX); the draft interface offers one chosen category (metadata_category) on the ASV table only - v1 scope, per the step plan. The column identifier is double-quoted inside the where clause (the module interpolates it bare; quoting only widens the set of legal column names). Deviations. (1) params.ancom_sample_min_count is captured in the pipeline parameter defaults but NO source code consumes it (main.nf:190 is its only occurrence); no tool input was invented for it. (2) The qzv export folders (ancom/Category-...-ASV, consumed by the full summary report and the publish dir) are dropped; the visualization qzv is the emitted result. (3) versions.yml dropped (pipeline_info precedent). (4) The WARNING-emitting empty-result guard the subworkflow logs on (fewer valid samples than q2 needs) is not replicated as a warning channel; q2's own error surfaces instead."
      container: quay.io/qiime2/qiime2:2026.4
      inputs:
        - name: table
          type: data
          label: Feature table artifact
          help: QIIME2 FeatureTable[Frequency] qza (import_table).
        - name: metadata
          type: data
          format:
            - tabular
            - tsv
          label: Sample metadata
          help: Tab-separated sample metadata (filtered metadata, source ch_metadata rebind).
        - name: category
          type: text
          label: Metadata category
          help: Metadata column to test (--m-metadata-column; params.metadata_category passthrough).
      outputs:
        - name: result
          type: data
          from_work_dir: ancom.qzv
          label: ANCOM results visualization (qzv)
      shell_command: |
        export XDG_CONFIG_HOME="./xdgconfig"
        export XDG_CACHE_HOME="./xqcache"
        export MPLCONFIGDIR="./mplconfigdir"
        export NUMBA_CACHE_DIR="./numbacache"
        qiime feature-table filter-samples \
            --i-table "$(inputs.table.path)" \
            --m-metadata-file "$(inputs.metadata.path)" \
            --p-where '"$(inputs.category)"<>""' \
            --o-filtered-table ancom-filtered.qza
        qiime composition add-pseudocount \
            --i-table ancom-filtered.qza \
            --o-composition-table comp-table.qza
        qiime composition ancom \
            --i-table comp-table.qza \
            --m-metadata-file "$(inputs.metadata.path)" \
            --m-metadata-column "$(inputs.category)" \
            --o-visualization ancom.qzv
  ancombc:
    label: ancombc
    doc: "QIIME2_ANCOMBC_ASV / QIIME2_ANCOMBC2_ASV (both qiime2/qiime2:2026.4 - ancombc2 is in q2-composition 2026.4, no miyabi plugin): branch switch on the ancombc2 flag, category where-filter first (source runs the filtersamples per-category product through), ancombc --p-formula / ancombc2 --p-fixed-effects-formula, tabulate -> published qzv. Empty formula falls back to the category (upstream baseName of the per-category filtered table IS the category), then the table basename. Export folders, da-barplot/visualizer/volcano extras and versions dropped (tool help)."
    when: ($(inputs.ancombc) || $(inputs.ancombc2)) && $(inputs.metadata) != null
    in:
      table: import_table/qza
      metadata: filter_samples/metadata
      category: metadata_category
      formula1: ancombc_formula
      formula2: ancombc2_formula
      use_ancombc2: ancombc2
    out:
      - id: result
    run:
      class: GalaxyUserTool
      id: ampliseq_ancombc
      version: 1.0.0
      name: QIIME2 ANCOM-BC / ANCOM-BC2 (ampliseq)
      description: Run QIIME2 ANCOM-BC or ANCOM-BC2 differential abundance on the ASV table for one metadata category or formula
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy replica of the nf-core/ampliseq QIIME2_ANCOMBC_ASV / QIIME2_ANCOMBC2_ASV modules (both pinned to container qiime2/qiime2:2026.4 - ancombc2 ships in q2-composition 2026.4, no q2-miyabi plugin needed), one tool covering both branches via the use_ancombc2 switch. Command cores are the modules': XDG/MPL/NUMBA exports, composition ancombc --p-formula <f> --o-differentials / miyabi-free composition ancombc2 --p-fixed-effects-formula <f> --o-ancombc2-output, then composition tabulate -> qzv (the emitted result). v1 simplifications (draft step plan: single category/formula, flags folded into one step). (1) Default formula: upstream an empty formula falls back to the table qza's baseName, which for the per-category filter-samples products IS the metadata category (qiime2_filtersamples writes ${category}.qza); here the empty formula resolves to the category input, and an empty category leaves the basename as last resort. (2) Category where-filter (upstream filtersamples with ''<category><>\"\"'' per column) is applied first when a category is given - same clause as the ancom tool. (3) Fixed output names replace formula-templated ones (differentials.qza / result.qzv) - static from_work_dir constraint. (4) Dropped: qza/qzv tools-export folders (full-report inputs), da-barplot + ancombc2-visualizer qzvs and the ancombc_volcanoplot.r volcano (per-branch extra visualizations with formula-named outputs; the draft publishes one result), --p-num-processes ${task.cpus} runs at 1, versions.yml (pipeline_info precedent), the error_ignore-label warning echo (q2 errors surface). Booleans render True/False in text ports; the switch matches either case."
      container: quay.io/qiime2/qiime2:2026.4
      inputs:
        - name: table
          type: data
          label: Feature table artifact
          help: QIIME2 FeatureTable[Frequency] qza (import_table).
        - name: metadata
          type: data
          format:
            - tabular
            - tsv
          label: Sample metadata
          help: Tab-separated sample metadata (filtered metadata, source ch_metadata rebind).
        - name: category
          type: text
          label: Metadata category
          value: ""
          help: Metadata column used for the sample where-filter and as the default formula (params.metadata_category).
        - name: formula1
          type: text
          label: ANCOM-BC formula
          value: ""
          help: Fixed-effects formula for the ancombc branch (params.ancombc_formula; empty falls back to the category).
        - name: formula2
          type: text
          label: ANCOM-BC2 formula
          value: ""
          help: Fixed-effects formula for the ancombc2 branch (params.ancombc2_formula; empty falls back to the category).
        - name: use_ancombc2
          type: text
          label: Use ANCOM-BC2
          value: "false"
          help: Set to the ancombc2 boolean to run composition ancombc2 instead of composition ancombc.
      outputs:
        - name: result
          type: data
          from_work_dir: result.qzv
          label: ANCOM-BC differentials tabulation (qzv)
      shell_command: |
        export XDG_CONFIG_HOME="./xdgconfig"
        export XDG_CACHE_HOME="./xqcache"
        export MPLCONFIGDIR="./mplconfigdir"
        export NUMBA_CACHE_DIR="./numbacache"
        case "$(inputs.use_ancombc2)" in [Tt]rue) mode=2 ;; *) mode=1 ;; esac
        if [ "$mode" = "2" ]; then formula="$(inputs.formula2)"; else formula="$(inputs.formula1)"; fi
        category="$(inputs.category)"
        [ -z "$formula" ] && formula="$category"
        [ -z "$formula" ] && formula=$(basename "$(inputs.table.path)" .qza)
        if [ -n "$category" ]; then
          qiime feature-table filter-samples \
              --i-table "$(inputs.table.path)" \
              --m-metadata-file "$(inputs.metadata.path)" \
              --p-where "\"$category\"<>\"\"" \
              --o-filtered-table filtered.qza
          table=filtered.qza
        else
          table="$(inputs.table.path)"
        fi
        if [ "$mode" = "2" ]; then
          qiime composition ancombc2 \
              --i-table "$table" \
              --m-metadata-file "$(inputs.metadata.path)" \
              --p-fixed-effects-formula "$formula" \
              --o-ancombc2-output differentials.qza \
              --p-num-processes 1 \
              --verbose
        else
          qiime composition ancombc \
              --i-table "$table" \
              --m-metadata-file "$(inputs.metadata.path)" \
              --p-formula "$formula" \
              --o-differentials differentials.qza \
              --verbose
        fi
        qiime composition tabulate \
            --i-data differentials.qza \
            --o-visualization result.qzv

  pplace_align:
    label: pplace_align
    doc: "PPLACE standard branch part 1/6 (source FASTA_NEWICK_EPANG_GAPPA, nf-core subworkflow fasta_newick_epang_gappa): profile-align ASVs onto the user reference alignment. v1 implements ONLY the single-reference clustalo path enabled by pplace_tree+pplace_aln (ledger pplace-standard-clustalo-v1): the pplace_sheet multi-reference variant and its hmmer/mafft rows are dropped (ledger pplace-sheet-file-refs), so inputs pplace_sheet/run_pplace/pplace_alnmethod were removed from the interface."
    when: $(inputs.pplace_tree) != null && $(inputs.pplace_aln) != null
    in:

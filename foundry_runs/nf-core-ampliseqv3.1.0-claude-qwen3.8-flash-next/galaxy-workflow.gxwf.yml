      - bac,arc,mito,euk
      - bac
      - arc
      - mito
      - euk
      - bac,arc
      - bac,mito
      - bac,euk
      - arc,mito
      - arc,euk
      - mito,euk
      - bac,arc,mito
      - bac,mito,euk
      - arc,mito,euk
    doc: keep only ASVs matching these SSU kingdoms (barrnap-based); empty/null disables
  consolidate_taxonomies:
    type: string
    restrictions:

o this draft's conventions: the table is keyed by sequence while FASTA ids are ASV_N labels, so the join matches FASTA sequences to table keys and keeps the original labels (the source joins ASV_ID = sequence = fasta id). Both source sorts (by sequence) are kept. The seed reproduces the source's set.seed(params.seed) ext (conf/modules.config:497); isContaminant args are detailed=TRUE, normalize=TRUE (modules.config:498)."
      container: quay.io/biocontainers/bioconductor-decontam:1.30.0--r45hdfd78af_1
      inputs:
        - name: table
          type: data
          format:
            - tabular

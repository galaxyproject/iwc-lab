            - tar.gz
            - tgz
          label: Kraken2 database archive
          help: Prebuilt Kraken2 database packed as tar.gz / tgz (contains hash.k2d).
        - name: confidence
          type: float
          label: Confidence threshold
          help: Minimum confidence score (kraken2 --confidence); 0 disables the threshold.
      outputs:
        - name: report
          type: data
          format: tabular
          from_work_dir: kraken2_report.txt
          label: Kraken2 report
        - name: classified_reads_assignment
          type: data
          format: txt
          from_work_dir: kraken2_classifiedreads.txt
          label: Per-read assignments
      shell_command: mkdir -p db && tar -xf $(inputs.db.path) -C db && DBDIR=$(dirname "$(find db -name hash.k2d | head -n1)") && kraken2 --db "$DBDIR" --threads 1 --use-names --confidence $(inputs.confidence) --report kraken2_report.txt --output kraken2_classifiedreads.txt $(inputs.reads.path)
  tax_kraken2_format:
    label: tax_kraken2_format
    doc: FORMAT_TAXRESULTS_KRAKEN2 - rank decomposition of the kraken2 report + per-read assignments into the four source tables (authored UDT ampliseq_kraken2_format, verbatim R replica on the source's r-base:4.2.1 pin; pipeline-internal R, no shed coverage). qiime2_tsv feeds consolidation, tax_tsv the tool-tables bundle and the table knot (source workflows/ampliseq.nf:914-920,1471).
    when: $(inputs.kraken2_ref_tax_custom) != null && !$(inputs.skip_taxonomy)
    in:
      report: tax_kraken2/report
      reads_assign: tax_kraken2/classified_reads_assignment
      taxlevels: kraken2_assign_taxlevels
    out:
      - id: keys_tsv
      - id: complete_tsv
      - id: tax_tsv
      - id: qiime2_tsv
    run:
      class: GalaxyUserTool
      id: ampliseq_kraken2_format
      version: 1.0.0
      name: Kraken2 taxonomy formatter
      description: Normalize a kraken2 report and per-read assignment into rank-decomposed ASV taxonomy tables (FORMAT_TAXRESULTS_KRAKEN2 replica)
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: |
          Verbatim R replica of nf-core/ampliseq `FORMAT_TAXRESULTS_KRAKEN2`
          (inline Rscript in the module, base R only; container pin r-base:4.2.1
          kept). Authored because the formatter is pipeline-internal R with no shed
          coverage. Reads the kraken2 report (indentation-encodes lineage) plus the
          classified_reads_assignment lines, builds rank__taxon lineage strings,
          splits them into the requested standard ranks (taxlevels, default
          D,P,C,O,F,G,S), and emits the four source tables (keys, complete, kraken2
          tsv, into-qiime2 tsv) with fixed prefix ASV_tax_kraken2 (v1 single
          group). The source's stop() when assignment taxon labels are missing from
          the report is kept.
      container: quay.io/biocontainers/r-base:4.2.1
      inputs:
        - name: report
          type: data
          format:
            - txt
            - tabular
          label: Kraken2 report
        - name: reads_assign
          type: data
          format:
            - txt
            - tabular
          label: Per-read assignments
        - name: taxlevels
          type: text
          value: D,P,C,O,F,G,S
          label: Taxonomic levels
          help: Comma-separated rank codes; empty falls back to D,P,C,O,F,G,S.
      configfiles:
        - filename: kraken2_format.R
          content: |
            #!/usr/bin/env Rscript
            args <- commandArgs(trailingOnly = TRUE)
            report_f <- args[1]; creads_f <- args[2]; taxlevels <- args[3]
            prefix <- "ASV_tax_kraken2"
            ## report
            report <- read.table(file = report_f, header = FALSE, sep = "\t")
            colnames(report) <- c("percent","fragments_total","fragments","rank","taxid","taxon")
            taxonomy_standard_labels <- unlist(strsplit(taxlevels,","))
            headers <- c("rank","taxid","taxon","taxonomy_rank","taxonomy_standard")
            headers <- c(headers, taxonomy_standard_labels)
            df = data.frame(matrix(nrow = 0, ncol = length(headers)))
            colnames(df) = headers
            taxonomy_rank <- c("root")
            for (i in 1:nrow(report)) {
                tax <- report$taxon[i]
                taxnospaces <- gsub("^ *", "", tax)
                nspaces = nchar(tax)- nchar(taxnospaces)
                indent = nspaces/2 +1
                if ( indent > length(taxonomy_rank) ) {
                    taxonomy_rank <- c(taxonomy_rank,paste0(report$rank[i],"__",taxnospaces))
                } else {
                    taxonomy_rank <- taxonomy_rank[1:indent-1]
                    taxonomy_rank <- c(taxonomy_rank,paste0(report$rank[i],"__",taxnospaces))
                }
                taxonomy_rank_string <- paste(taxonomy_rank,collapse=";")
                taxonomy_standard = list()
                taxonomy_ranks = gsub( "__.*", "", taxonomy_rank )
                for (x in taxonomy_standard_labels) {
                    taxonomy_ranks_match <- match(x, taxonomy_ranks)
                    if ( !is.na(taxonomy_ranks_match) ) {
                        taxonomy_clean <- gsub( ".*__", "", taxonomy_rank[taxonomy_ranks_match] )
                        taxonomy_standard <- c(taxonomy_standard,taxonomy_clean)
                    } else {
                        taxonomy_standard <- c(taxonomy_standard,"")
                    }
                }
                taxonomy_standard_string <- paste(taxonomy_standard,collapse=";")
                names(taxonomy_standard) <- taxonomy_standard_labels
                results <- c(
                    rank=report$rank[i],
                    taxid=report$taxid[i],
                    taxon=taxnospaces,
                    taxonomy_rank=taxonomy_rank_string,
                    taxonomy_standard=taxonomy_standard_string,
                    taxonomy_standard)
                df <- rbind(df, results)
            }
            df$taxon_taxid <- paste0(df$taxon," (taxid ",df$taxid,")")
            write.table(df, file = paste0(prefix,".kraken2.keys.tsv"), row.names=FALSE, quote=FALSE, sep="\t")
            creads <- read.table(file = creads_f, header = FALSE, sep = "\t")
            colnames(creads) <- c("classified","ASV_ID","taxonomy","ASV_length","kmer_LCA")
            if ( !all( creads$taxonomy %in% df$taxon_taxid ) ) { stop(paste(creads_f,"and",report_f,"dont share all IDs, exit"), call.=FALSE) }
            merged <- merge(creads, df, by.x="taxonomy", by.y="taxon_taxid", all.x=TRUE, all.y=FALSE)
            write.table(merged, file = paste0(prefix,".kraken2.complete.tsv"), row.names=FALSE, quote=FALSE, sep="\t")
            merged_reduced <- subset(merged, select = c("ASV_ID",taxonomy_standard_labels,"taxonomy"))
            colnames(merged_reduced) <- c("ASV_ID",taxonomy_standard_labels,"lowest_match")
            write.table(merged_reduced, file = paste0(prefix,".kraken2.tsv"), row.names=FALSE, quote=FALSE, sep="\t")
            qiime <- merged[c("ASV_ID", "taxonomy_standard")]
            colnames(qiime) <- c("ASV_ID", "taxonomy")
            write.table(qiime, file = paste0(prefix,".kraken2.into-qiime2.tsv"), row.names=FALSE, quote=FALSE, sep="\t")
      outputs:
        - name: keys_tsv
          type: data
          format: tsv
          from_work_dir: ASV_tax_kraken2.kraken2.keys.tsv
          label: Rank lookup table
        - name: complete_tsv
          type: data
          format: tsv
          from_work_dir: ASV_tax_kraken2.kraken2.complete.tsv
          label: Full merged table
        - name: tax_tsv
          type: data
          format: tsv
          from_work_dir: ASV_tax_kraken2.kraken2.tsv
          label: ASV taxonomy by rank
        - name: qiime2_tsv
          type: data
          format: tsv
          from_work_dir: ASV_tax_kraken2.kraken2.into-qiime2.tsv
          label: QIIME2-compatible ASV taxonomy
      shell_command: TL="$(inputs.taxlevels.value)"; [ -n "$TL" ] || TL="D,P,C,O,F,G,S"; Rscript kraken2_format.R $(inputs.report.path) $(inputs.reads_assign.path) "$TL"
  tax_sidle:
    label: tax_sidle
    doc: "SIDLE_WF (single-region) - SIDLE database-reconstruction classification of ASVs. Authored UDT: no Tool Shed SIDLE wrapper exists (panel q=sidle empty); the tool collapses the source SIDLE_* qiime CLI module set (pipesidle image) into one job. Reference alignment/tree inputs dropped and multi-region/tablereseq/seqrecon/treerecon skipped per ledger sidle-single-region-v1."
    when: $(inputs.sidle_ref_tax_custom) != null && $(inputs.sidle_ref_seq_custom) != null && $(inputs.sidle_region) != null && $(inputs.sidle_region_length) != null && $(inputs.sidle_primer_fwd) != null && $(inputs.sidle_primer_rev) != null && !$(inputs.skip_taxonomy)
    in:
      seqs: merge_tables/asv_fasta
      table: merge_tables/asv_table
      db_seq: sidle_ref_seq_custom
      db_tax: sidle_ref_tax_custom
      region: sidle_region
      region_length: sidle_region_length
      primer_fwd: sidle_primer_fwd
      primer_rev: sidle_primer_rev
      num_degenerates: sidle_num_degenerates
      db_cleaning: sidle_ref_cleaning
    out:
      - id: taxonomy
    run:
      class: GalaxyUserTool
      id: ampliseq_sidle_classify
      version: 1.0.0
      name: SIDLE single-region taxonomy reconstruction
      description: Classify ASVs by SIDLE database reconstruction (trim, regional extraction, kmer alignment, database and taxonomy reconstruction) in one q2-sidle run
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: |
          Collapses nf-core/ampliseq's SIDLE module set (SIDLE_IN, SIDLE_TRIM,
          SIDLE_INDB, SIDLE_DBFILT, SIDLE_DBEXTRACT, SIDLE_ALIGN, SIDLE_DBRECON,
          SIDLE_TAXRECON, SIDLE_FILTTAX - all qiime CLI calls in the source's
          nf-core/pipesidle image) into one job for the single-region case:
          import ASV fasta + ASV table (row order must match the fasta; ids are
          taken from the fasta), `qiime sidle trim-dada2-posthoc`, prepare the
          reference database (import seq/tax, `rescript cull-seqs`,
          `taxa filter-seqs` excluding mitochondria/chloroplast),
          `feature-classifier extract-reads --p-identity 2` +
          `sidle prepare-extracted-region` with the region primers and trim
          length, `sidle align-regional-kmers`, `sidle reconstruct-database`,
          `sidle reconstruct-taxonomy --p-database <cleaning>`, export and filter
          the taxonomy to the input ASV ids (SIDLE_FILTTAX semantics).
          Deviations (v1 single-region posture, ledger sidle-single-region-v1):
          multi-region reconstruction, SIDLE_TABLERECON / SIDLE_SEQRECON /
          SIDLE_TREERECON (abundance, sequence and tree reconstruction) and the
          reference alignment / tree inputs are not carried; ASVs missing from the
          alignment map cannot be distinguished from absent features.
      container: nf-core/pipesidle:0.1.0-beta
      inputs:
        - name: seqs
          type: data
          format:
            - fasta
          label: ASV sequences
        - name: table
          type: data
          format:
            - tsv
          label: ASV abundance table
          help: Rows in the same order as the ASV fasta; first column holds the ASV sequences (R row-names export).
        - name: db_seq
          type: data
          format:
            - fasta
          label: Reference sequences
        - name: db_tax
          type: data
          format:
            - txt
            - tsv
          label: Reference taxonomy
          help: Headerless taxonomy table for the reference sequences.
        - name: region
          type: text
          label: Region name
          help: Passed to the sidle --p-region arguments.
        - name: region_length
          type: integer
          label: Region trim length
          help: Trim length for trim-dada2-posthoc and prepare-extracted-region.
        - name: primer_fwd
          type: text
          label: Forward primer
        - name: primer_rev
          type: text
          label: Reverse primer
        - name: num_degenerates
          type: integer
          value: 5
          label: Max degenerate positions
          help: rescript cull-seqs --p-num-degenerates.
        - name: db_cleaning
          type: text
          value: silva
          label: Taxonomy cleaning style
          help: reconstruct-taxonomy --p-database value (source custom default silva).
      outputs:
        - name: taxonomy
          type: data
          format: tsv
          from_work_dir: reconstructed_taxonomy.tsv
          label: Reconstructed ASV taxonomy
      configfiles:
        - filename: prep_table.py
          content: |
            #!/usr/bin/env python3
            import sys
            table, fasta, out = sys.argv[1:4]
            ids = [l[1:].split()[0] for l in open(fasta) if l.startswith('>')]
            rows = [l.rstrip('\n').split('\t') for l in open(table) if l.strip()]
            header, rows = rows[0][1:], rows[1:]
            assert len(rows) == len(ids), f"table rows {len(rows)} != fasta ids {len(ids)}"
            with open(out, 'w') as w:
                w.write('\t'.join(['#OTU ID'] + header) + '\n')
                for i, rid in enumerate(ids):
                    w.write('\t'.join([rid] + rows[i][1:]) + '\n')
        - filename: filttax_filter.py
          content: |
            #!/usr/bin/env python3
            import sys
            tax_tsv, fasta, out = sys.argv[1:4]
            keep = {l[1:].split()[0] for l in open(fasta) if l.startswith('>')}
            with open(tax_tsv) as f, open(out, 'w') as w:
                w.write(next(f))
                for line in f:
                    if line.split('\t', 1)[0].strip() in keep:
                        w.write(line)
      shell_command: export XDG_CONFIG_HOME=./xdgconfig XDG_CACHE_HOME=./xqcache MPLCONFIGDIR=./mplconfigdir NUMBA_CACHE_DIR=./numbacache && python3 prep_table.py $(inputs.table.path) $(inputs.seqs.path) otu.tsv && biom convert -i otu.tsv -o table.biom --table-type="OTU table" --to-hdf5 && qiime tools import --input-path $(inputs.seqs.path) --type 'FeatureData[Sequence]' --output-path rep-seqs.qza && qiime tools import --input-path table.biom --type 'FeatureTable[Frequency]' --input-format BIOMV210Format --output-path table.qza && qiime sidle trim-dada2-posthoc --i-table table.qza --i-representative-sequences rep-seqs.qza --p-trim-length $(inputs.region_length) --o-trimmed-table trimmed_table.qza --o-trimmed-representative-sequences trimmed_seqs.qza && qiime tools import --input-path $(inputs.db_seq.path) --output-path db_sequences.qza --type 'FeatureData[Sequence]' && qiime tools import --input-path $(inputs.db_tax.path) --output-path db_taxonomy.qza --type 'FeatureData[Taxonomy]' --input-format HeaderlessTSVTaxonomyFormat && qiime rescript cull-seqs --p-n-jobs 1 --i-sequences db_sequences.qza --p-num-degenerates $(inputs.num_degenerates) --o-clean-sequences db_filtered_sequences.qza && qiime taxa filter-seqs --i-sequences db_filtered_sequences.qza --i-taxonomy db_taxonomy.qza --p-exclude mitochondria,chloroplast --p-mode contains --o-filtered-sequences db_filtered_tax.qza && qiime feature-classifier extract-reads --p-n-jobs 1 --i-sequences db_filtered_tax.qza --p-identity 2 --p-f-primer $(inputs.primer_fwd) --p-r-primer $(inputs.primer_rev) --o-reads db_region.qza && qiime sidle prepare-extracted-region --p-n-workers 1 --i-sequences db_region.qza --p-region $(inputs.region) --p-fwd-primer $(inputs.primer_fwd) --p-rev-primer $(inputs.primer_rev) --p-trim-length $(inputs.region_length) --o-collapsed-kmers db_kmers.qza --o-kmer-map db_map.qza && qiime sidle align-regional-kmers --p-n-workers 1 --i-kmers db_kmers.qza --i-rep-seq trimmed_seqs.qza --p-region $(inputs.region) --o-regional-alignment align_map.qza && qiime sidle reconstruct-database --p-n-workers 1 --p-region $(inputs.region) --i-kmer-map db_map.qza --i-regional-alignment align_map.qza --o-database-map reconstruction_map.qza --o-database-summary reconstruction_summary.qza && qiime sidle reconstruct-taxonomy --i-reconstruction-map reconstruction_map.qza --i-taxonomy db_taxonomy.qza --p-database $(inputs.db_cleaning) --o-reconstructed-taxonomy recon_tax.qza && qiime tools export --input-path recon_tax.qza --output-path exported && python3 filttax_filter.py exported/taxonomy.tsv $(inputs.seqs.path) reconstructed_taxonomy.tsv
  tax_consolidate:
    label: tax_consolidate
    doc: "CONSOLIDATE_TAXONOMY(_TOOLS) replica - one taxonomy per ASV across all present branch tables, method most-specific|score. v1 deviations (tool help carries the detail): consolidates all six branches, while the source only consolidates DADA2/SINTAX/VSEARCH-LCA across classifiers and extends the classifier tiebreak order accordingly; a single present table passes through with classifier/database provenance added (source skips consolidation then); the source's six multi-database taxlevels derivations collapse to the standard seven-rank default. 'first' is gated out here so tax_table_knot falls back to the first live branch table - the source's take-first-DB behavior. Skipped-branch sentinel tolerance of the optional ports = carried ledger question consolidate-taxonomy-optional-fanin (phase-11 check)."
    when: "!$(inputs.skip_taxonomy) && $(inputs.consolidate_taxonomies) != 'first' && ( $(inputs.dada_ref_tax_custom) != null || $(inputs.qiime_ref_tax_custom) != null || $(inputs.sintax_ref_tax_custom) != null || $(inputs.vsearch_lca_ref_tax_custom) != null || $(inputs.kraken2_ref_tax_custom) != null || $(inputs.sidle_ref_tax_custom) != null )"
    in:
      tax_dada: tax_dada_format/tsv
      tax_qiime: tax_qiime2_classify_pick/data_param
      tax_sintax: tax_sintax_format/tsv
      tax_vlca: tax_vsearch_lca_format/tsv
      tax_k2: tax_kraken2_format/qiime2_tsv
      tax_sidle: tax_sidle/taxonomy
      method: consolidate_taxonomies
    out:
      - id: table
    run:
      class: GalaxyUserTool
      id: ampliseq_consolidate_taxonomy
      version: 1.0.0
      name: Taxonomy consolidator (ampliseq)
      description: Pick one taxonomy per ASV across all present classifier tables (most-specific or score method)
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy adaptation of nf-core/ampliseq `CONSOLIDATE_TAXONOMY` (modules/local/consolidate_taxonomy/main.nf, inline Rscript - no shed wrapper exists for a pipeline-internal consolidation script). The R body is a verbatim replica: rank harmonization (Domain/Kingdom and Division/Phylum synonym slots), rbind alignment to the column union, per-ASV winner pick by `most-specific` (most slots filled, tie to earliest source) or `score` (deepest shared rank with max bootstrap), provenance columns classifier/database, confidence-scalar guard across mixed classifiers. The source feeds N staged files plus a \"classifier:database\" source string built from whichever branches ran; Galaxy has no N-way staged input, so this tool takes the six branch tables as optional datasets in the source's tiebreak priority order (DADA2, QIIME2, SINTAX, VSEARCH-LCA, KRAKEN2, SIDLE - the source only consolidates its first three; the extras extend the same order, ledger qiime/k2/sidle deviation noted on the draft step doc). Databases are always \"user_supplied\" (v1 custom-ref posture, same as the formatters' dbversion). The shell skips ports whose substitution came through empty or non-file (skipped-branch sentinel tolerance, carried ledger question consolidate-taxonomy-optional-fanin). `first` never reaches this tool - the workflow gates it out and falls back to a pick_value over the branch tables, matching the source's `!= 'first'` gate. Target ranks default to the source's standard seven; unlike the source (which derives taxlevels from the active classifier's taxlevels param) this v1 does not re-derive them per branch."
      container: quay.io/biocontainers/r-base:4.2.1
      inputs:
        - name: tax_dada
          type: data
          format:
            - tabular
            - tsv
            - txt
          optional: true
          label: DADA2 formatted taxonomy
        - name: tax_qiime
          type: data
          format:
            - tabular
            - tsv
            - txt
          optional: true
          label: QIIME2 taxonomy table
        - name: tax_sintax
          type: data
          format:
            - tabular
            - tsv
            - txt
          optional: true
          label: SINTAX formatted taxonomy
        - name: tax_vlca
          type: data
          format:
            - tabular
            - tsv
            - txt
          optional: true
          label: VSEARCH-LCA formatted taxonomy
        - name: tax_k2
          type: data
          format:
            - tabular
            - tsv
            - txt
          optional: true
          label: Kraken2 taxonomy table
        - name: tax_sidle
          type: data
          format:
            - tabular
            - tsv
            - txt
          optional: true
          label: SIDLE taxonomy table
        - name: method
          type: text
          label: Consolidation method
          value: most-specific
          help: most-specific (fill most ranks, ties to earliest source) or score (deepest shared rank, highest bootstrap). The source's 'first' never reaches this tool - the workflow guard and a pick_value handle it.
        - name: taxlevels
          type: text
          label: Target taxonomic levels
          value: ""
          help: Comma-separated rank names the output must carry; empty = Kingdom,Phylum,Class,Order,Family,Genus,Species (source default).
      outputs:
        - name: table
          type: data
          format: tsv
          from_work_dir: ASV_tax.consolidated.tsv
          label: Consolidated ASV taxonomy
      configfiles:
        - filename: consolidate_taxonomy.R
          content: |
            #!/usr/bin/env Rscript
            # Verbatim replica of the nf-core/ampliseq CONSOLIDATE_TAXONOMY inline Rscript
            # (modules/local/consolidate_taxonomy/main.nf), adapted so the five template
            # variables arrive as command-line arguments instead of Nextflow substitution.
            # The versions.yml write is dropped (Galaxy records provenance elsewhere).
            args <- commandArgs(trailingOnly = TRUE)
            method <- args[1]
            taxlevels_input <- args[2]
            files <- strsplit(args[3], ",", fixed = TRUE)[[1]]
            sources <- strsplit(args[4], ",", fixed = TRUE)[[1]]
            outfile <- args[5]

            if (nzchar(taxlevels_input)) {
                target_ranks <- strsplit(taxlevels_input, ",", fixed = TRUE)[[1]]
            } else {
                target_ranks <- c("Kingdom", "Phylum", "Class", "Order", "Family", "Genus", "Species")
            }

            source_classifier <- sub(":.*$", "", sources)
            source_database <- sub("^[^:]*:", "", sources)
            stopifnot(length(sources) == length(files))

            # the consolidated table feeds every downstream consumer that expects one taxonomy per ASV
            # (QIIME2 import, phyloseq/TSE), all of which read ranks positionally or by name -- so the
            # output carries exactly these ranks, whichever database won a given ASV.

            # everything that isn't one of these occupies a rank position. SH and BOLD_bin are
            # identifiers rather than ranks, the same distinction bin/parse_dada2_taxonomy.r makes.
            is_meta <- function(cols) cols %in% c("ASV_ID", "confidence", "sequence", "classifier", "database", "SH", "BOLD_bin") | grepl("_confidence$|_exact$", cols)

            # rank vocabulary differs by database: a database roots at Domain or at Kingdom depending on
            # what it holds, and PR2 puts Supergroup,Division,Subdivision ahead of Class where the others
            # have Phylum. Domain fills the same slot as Kingdom and Division the same slot as Phylum, so
            # those are renamed into whichever of the pair target_ranks uses; Supergroup and Subdivision
            # have no counterpart and are dropped. See docs/usage.md for the full rationale.
            rank_synonyms <- c(Domain = "Kingdom", Kingdom = "Domain", Division = "Phylum", Phylum = "Division")

            harmonize <- function(df) {
                cols <- colnames(df)
                ranks <- cols[!is_meta(cols)]
                mapped <- ifelse(ranks %in% target_ranks, ranks, rank_synonyms[ranks])
                names(mapped) <- ranks
                # a synonym fills its slot only when no column of that name exists, so a database
                # holding both Domain and Kingdom keeps the one the target uses and drops the other
                mapped[!(ranks %in% target_ranks) & mapped %in% ranks] <- NA
                mapped <- mapped[!is.na(mapped) & mapped %in% target_ranks]
                # a rank without a slot in target_ranks takes its bootstrap column with it
                dropped <- setdiff(ranks, names(mapped))
                from <- setdiff(cols, c(dropped, paste0(tolower(dropped), "_confidence")))
                to <- from
                to[match(names(mapped), from)] <- unname(mapped)
                conf_from <- paste0(tolower(names(mapped)), "_confidence")
                renamed_conf <- conf_from %in% from
                to[match(conf_from[renamed_conf], from)] <- paste0(tolower(unname(mapped)), "_confidence")[renamed_conf]
                df <- df[, from, drop = FALSE]
                colnames(df) <- to
                df
            }

            tables <- lapply(seq_along(files), function(i) {
                f <- files[i]
                # character, so a rank that happens to be only "F" or "T" is not read as logical
                df <- read.delim(f, sep = "\t", header = TRUE, na.strings = "", colClasses = "character", check.names = FALSE)
                conf_cols <- grep("^confidence$|_confidence$", colnames(df), value = TRUE)
                df[conf_cols] <- lapply(df[conf_cols], as.numeric)
                own_ranks <- colnames(df)[!is_meta(colnames(df))]
                df <- harmonize(df)
                if (!any(colnames(df) %in% target_ranks)) {
                    stop(paste0("None of the ranks of ", sources[i], " (", paste(own_ranks, collapse = ","), ") are among the taxonomic levels used for consolidation (", paste(target_ranks, collapse = ","), "). All consolidated tables need the same rank names."))
                }
                df$classifier <- source_classifier[i]
                df$database <- source_database[i]
                df$source_index <- i
                df
            })

            # a database whose reference taxonomy never reaches species level for this data won't have a
            # "Species"/"species_confidence" column at all -- align every table to the union of columns
            # seen across all of them before binding, so rbind() doesn't choke on a column-count mismatch.
            all_cols <- Reduce(union, lapply(tables, colnames))
            tables <- lapply(tables, function(df) {
                missing_cols <- setdiff(all_cols, colnames(df))
                df[missing_cols] <- NA
                df[, all_cols]
            })
            combined <- do.call(rbind, tables)

            rank_cols <- intersect(target_ranks, colnames(combined))

            if (!(method %in% c("most-specific", "score"))) {
                stop(paste0("Unknown consolidation method: ", method))
            }

            # Domain/Kingdom and Division/Phylum are two names for one slot (see rank_synonyms), and
            # target_ranks can carry both, so a pair counts as one rank.
            # SH and BOLD_bin are identifiers, not ranks.
            score_cols <- setdiff(rank_cols, c("SH", "BOLD_bin"))
            slots <- unique(lapply(score_cols, function(r) sort(intersect(c(r, rank_synonyms[r]), score_cols))))
            assigned <- matrix(FALSE, nrow = nrow(combined), ncol = length(slots))
            slot_conf <- matrix(NA_real_, nrow = nrow(combined), ncol = length(slots))
            for (i in seq_along(slots)) {
                assigned[, i] <- rowSums(!is.na(combined[, slots[[i]], drop = FALSE])) > 0
                conf_cols <- intersect(paste0(tolower(slots[[i]]), "_confidence"), colnames(combined))
                if (length(conf_cols) > 0) {
                    slot_conf[, i] <- suppressWarnings(apply(combined[, conf_cols, drop = FALSE], 1, max, na.rm = TRUE))
                }
            }
            # DADA2 reports a bootstrap for unassigned ranks too; only assigned ranks are compared
            slot_conf[!assigned | is.infinite(slot_conf)] <- NA
            comparable <- assigned & !is.na(slot_conf)
            depth <- apply(assigned, 1, function(x) if (any(x)) max(which(x)) else 0)
            tiebreak <- combined$source_index
            combined$source_index <- NULL

            # bootstraps only fall with depth, so each database's own deepest rank would favour shallow
            # assignments; compare at the deepest rank that all remaining candidates assigned instead
            pick_by_score <- function(rows) {
                cand <- rows[depth[rows] > 0]
                if (length(cand) == 0) cand <- rows
                previous <- 0
                while (length(cand) > 1) {
                    shared <- which(colSums(!comparable[cand, , drop = FALSE]) == 0)
                    if (length(shared) == 0 || max(shared) <= previous) break
                    previous <- max(shared)
                    conf <- slot_conf[cand, previous]
                    cand <- cand[conf == max(conf)]
                    deeper <- cand[depth[cand] > previous]
                    if (length(deeper) == 0) break
                    cand <- deeper
                }
                cand <- cand[depth[cand] == max(depth[cand])]
                cand[which.min(tiebreak[cand])]
            }

            rows_by_asv <- split(seq_len(nrow(combined)), combined$ASV_ID)
            if (method == "score") {
                winner_rows <- vapply(rows_by_asv, pick_by_score, integer(1))
            } else {
                # most slots filled first, tie broken by earliest source (priority order)
                winner_rows <- vapply(rows_by_asv, function(rows) rows[order(-rowSums(assigned[rows, , drop = FALSE]), tiebreak[rows])][1], integer(1))
            }
            winners <- combined[winner_rows, ]
            # an ASV without any rank was classified by nobody, whichever source came first
            winners[rowSums(assigned[winner_rows, , drop = FALSE]) == 0, c("classifier", "database")] <- NA
            # DADA2 bootstraps (0-100) and SINTAX probabilities (0-1) must not share one column
            if (length(unique(source_classifier)) > 1 && "confidence" %in% colnames(winners)) winners$confidence <- NA

            # same column order as a single-database dada2_taxonomy.nf table, with any identifier column
            # (SH, BOLD_bin, Species_exact) kept after the ranks and the new provenance column last
            tail_cols <- c("confidence", paste0(tolower(rank_cols), "_confidence"), "sequence", "classifier", "database")
            extras <- setdiff(colnames(winners), c("ASV_ID", rank_cols, tail_cols))
            winners <- winners[ , c("ASV_ID", rank_cols, extras, intersect(tail_cols, colnames(winners))) ]

            write.table(winners, file = outfile, sep = "\t", row.names = FALSE, col.names = TRUE, quote = FALSE, na = '')
      shell_command: |
        FILES=""; SOURCES="";
        add() { if [ -n "$1" ] && [ -f "$1" ]; then FILES="${FILES:+${FILES},}$1"; SOURCES="${SOURCES:+${SOURCES},}$2"; fi; };
        add "$(inputs.tax_dada.path)" "DADA2:user_supplied";
        add "$(inputs.tax_qiime.path)" "QIIME2:user_supplied";
        add "$(inputs.tax_sintax.path)" "SINTAX:user_supplied";
        add "$(inputs.tax_vlca.path)" "VSEARCH-LCA:user_supplied";
        add "$(inputs.tax_k2.path)" "KRAKEN2:user_supplied";
        add "$(inputs.tax_sidle.path)" "SIDLE:user_supplied";
        if [ -z "$FILES" ]; then echo "ampliseq_consolidate_taxonomy: no taxonomy tables supplied" >&2; exit 1; fi;
        Rscript consolidate_taxonomy.R "$(inputs.method.value)" "$(inputs.taxlevels.value)" "$FILES" "$SOURCES" ASV_tax.consolidated.tsv

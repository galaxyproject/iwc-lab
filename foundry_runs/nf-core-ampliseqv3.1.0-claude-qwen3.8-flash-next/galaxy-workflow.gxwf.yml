    doc: "TREESUMMARIZEDEXPERIMENT export - module R body verbatim (TreeSummarizedExperiment 2.10.0 image), tuple vars -> positional args, sam/tree optional ports realize the source's ifEmpty('EMPTY') file.exists branches, fixed TreeSummarizedExperiment.rds output name (source prefix = classifier id; single consolidated knot upstream - same deviation as phyloseq). Template hinted three inputs on the module's qza tree port; realized on the module's actual four-port tuple: sam: metadata added (the source ch_meta.ifEmpty channel, as in phyloseq) and tree rewired to export_tree/tree_nwk (module reads Newick via ape::read.tree)."
    when: "!$(inputs.skip_tse)"
    in:
      otu: asv_table_knot/data_param
      tax: tax_table_knot/data_param
      sam: metadata
      tree: export_tree/tree_nwk
    out:
      - id: rds
    run:
      class: GalaxyUserTool
      id: ampliseq_tse
      version: 1.0.0
      name: TreeSummarizedExperiment builder (ampliseq)
      description: Build and save the TreeSummarizedExperiment RDS from the ASV table, taxonomy, optional metadata and optional Newick tree
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: Galaxy replica of the nf-core/ampliseq TREESUMMARIZEDEXPERIMENT process (modules/local/treesummarizedexperiment/main.nf, container bioconductor-treesummarizedexperiment:2.10.0--r43hdfd78af_0 kept; conda env bioconductor-treesummarizedexperiment=2.10.0 + r-base=4.3.2 matches, tag verified on quay). The R body is the module's inline script verbatim - counts assay from the ASV table (integer cast), rowData from the taxonomy table with the module's own *_confidence / classifier / database column drop, rownames match to the abundance matrix, sequence column (if present) moved to the referenceSeq slot, optional colData and rowTree behind the file.exists guards, saveRDS at the end. Galaxy adaptations. (1) The Nextflow tuple path variables become positional args (otu, tax, sam, tree - the module's tuple is tax,otu; only the binding order changes); the versions.yml writeLines block (which embeds task.process) is dropped (pipeline_info artifacts dropped precedent). (2) The optional metadata and tree ports reproduce the source's .ifEmpty('EMPTY') staging (subworkflows/local/robject_workflow/main.nf:30-43) - a skipped optional input substitutes empty and file.exists("") is FALSE, exactly the EMPTY-path branch. (3) The source prefix (classifier name, one rds per classifier channel) collapses to the fixed output name TreeSummarizedExperiment.rds since the draft consolidates a single taxonomy table upstream - same deviation as ampliseq_phyloseq. (4) The tree arrives as Newick (ape::read.tree) - the draft's tree producer is a QIIME2 qza exported by ampliseq_export_tree, mirroring the source where the tree channel reaching ROBJECT_WORKFLOW is already tree_nwk.
      container: quay.io/biocontainers/bioconductor-treesummarizedexperiment:2.10.0--r43hdfd78af_0
      inputs:
        - name: otu
          type: data
          format:
            - tabular
            - tsv
          label: ASV count table
          help: Tab-separated counts keyed by ASV sequence in the first column (asv_table_knot).
        - name: tax
          type: data
          format:
            - tabular
            - tsv
          label: ASV taxonomy table
          help: Tab-separated taxonomy keyed by ASV sequence in the first column (tax_table_knot; the module drops _confidence/classifier/database columns and matches rows to the count table itself).
        - name: sam
          type: data
          format:
            - tabular
            - tsv
          optional: true
          label: Sample metadata
          help: Optional sample-keyed metadata tsv merged as colData (source ch_meta.ifEmpty('EMPTY')).
        - name: tree
          type: data
          format:
            - newick
          optional: true
          label: Rooted tree (Newick)
          help: Optional Newick tree set as rowTree (source ch_robject_intree.ifEmpty('EMPTY')).
      outputs:
        - name: rds
          type: data
          format: rdata
          from_work_dir: TreeSummarizedExperiment.rds
          label: TreeSummarizedExperiment object (RDS)
      configfiles:
        - filename: tse.R
          content: |
            #!/usr/bin/env Rscript
            # Verbatim modules/local/treesummarizedexperiment/main.nf script body (tuple vars ->
            # positional args; versions.yml writeLines block dropped - deviations in the tool help).
            suppressPackageStartupMessages(library(TreeSummarizedExperiment))

            a <- commandArgs(trailingOnly = TRUE)
            otu_tsv <- a[1]; tax_tsv <- a[2]; sam_tsv <- a[3]; tree <- a[4]

            # Read otu table. It must be in a SimpleList as a matrix where rows
            # represent taxa and columns samples.
            otu_mat  <- read.table(otu_tsv, sep="\t", header=TRUE, row.names=1)
            otu_mat <- as.matrix(otu_mat)
            storage.mode(otu_mat) <- "integer"
            assays <- SimpleList(counts = otu_mat)
            # Read taxonomy table. Correct format for it is DataFrame.
            taxonomy_table  <- read.table(tax_tsv, sep="\t", header=TRUE, row.names=1, comment.char = "")
            # per-rank confidences and the source classifier and database are not ranks
            taxonomy_table  <- taxonomy_table[, !grepl("_confidence$", colnames(taxonomy_table)) & !colnames(taxonomy_table) %in% c("classifier", "database"), drop=FALSE]
            taxonomy_table <- DataFrame(taxonomy_table)

            # Match rownames between taxonomy table and abundance matrix.
            taxonomy_table <- taxonomy_table[match(rownames(otu_mat), rownames(taxonomy_table)), ]

            # Create TreeSE object.
            tse <- TreeSummarizedExperiment(
                assays = assays,
                rowData = taxonomy_table
            )

            # If taxonomy table contains sequences, move them to referenceSeq slot
            if (!is.null(rowData(tse)[["sequence"]])) {
                referenceSeq(tse) <- DNAStringSet( rowData(tse)[["sequence"]] )
                rowData(tse)[["sequence"]] <- NULL
            }

            # If provided, we add sample metadata as DataFrame object. rownames of
            # sample metadata must match with colnames of abundance matrix.
            if (file.exists(sam_tsv)) {
                sample_meta  <- read.table(sam_tsv, sep="\t", header=TRUE, row.names=1)
                sample_meta <- sample_meta[match(colnames(tse), rownames(sample_meta)), ]
                sample_meta  <- DataFrame(sample_meta)
                colData(tse) <- sample_meta
            }

            # If provided, we add phylogeny. The rownames in abundance matrix must match
            # with node labels in phylogeny.
            if (file.exists(tree)) {
                phylogeny <- ape::read.tree(tree)
                rowTree(tse) <- phylogeny
            }

            saveRDS(tse, file = "TreeSummarizedExperiment.rds")
      shell_command: |
        Rscript tse.R "$(inputs.otu.path)" "$(inputs.tax.path)" "$(inputs.sam.path)" "$(inputs.tree.path)"
  parquet_tables:
    label: parquet_tables
    doc: "DUCKDB_TABLE2PARQUET on the long counts summary table (ampliseq.counts.tsv.gz; the module's wave duckdb-cli image pinned, SQL verbatim). Split from the template's two-port single step: the module converts ONE table per job (source maps it over the summary-table collection), so the taxonomy summary gets its own step (parquet_taxonomy) and static from_work_dir names the fixed table.parquet - workflow-output labels carry the identity. Gated by BOTH source conditions: the parquet branch and the presence of the counts table (skip_abundance_tables removes it from the mapped collection upstream)."
    when: "!$(inputs.skip_parquet_summary) && !$(inputs.skip_abundance_tables)"
    in:
      table: summary_counts/tsv
    out:
      - id: table_parquet
    run:
      class: GalaxyUserTool
      id: ampliseq_duckdb_table2parquet
      version: 1.0.0
      name: Table to Parquet converter (ampliseq, duckdb)
      description: Convert one delimited summary table to Parquet with duckdb COPY read_csv
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy replica of the nf-core DUCKDB_TABLE2PARQUET process (modules/nf-core/duckdb/table2parquet), one table per job like the module, pinning its exact community wave image community.wave.seqera.io/library/duckdb-cli:1.5.5--9c6d18d9f687a45d (registry manifest probe: anonymously pullable; conda env duckdb=1.5.5). The SQL is the module's: COPY (SELECT * FROM read_csv(path, delim, header=true)) TO parquet (FORMAT PARQUET). Galaxy adaptations. (1) The output file name: the module derives the parquet stem from the input filename (prefix = meta.id / filename stem), but a user-tool output must be declared statically, so the file is the fixed name table.parquet and the consuming step/workflow-output labels carry the identity. (2) The delimiter derivation from the filename suffix (.tsv -> tab, .csv -> comma, error otherwise) is fixed to tab: both draft consumers feed .tsv/.tsv.gz tables, for which the module's derivation always yields tab; duckdb's read_csv auto-decompresses .gz inputs. (3) The SET threads / SET memory_limit lines (from task.cpus / task.memory, no Galaxy equivalent) are dropped; SET temp_directory='.' is kept. (4) The task.ext.args/args2 extension points and the versions topic line (eval duckdb --version) are dropped (pipeline_info precedent). SQL string literals escape an embedded single quote by doubling; paths are inlined as-is, safe for dataset file names."
      container: community.wave.seqera.io/library/duckdb-cli:1.5.5--9c6d18d9f687a45d
      inputs:
        - name: table
          type: data
          format:
            - tabular
            - tsv
          label: Delimited summary table
          help: Tab-separated table (optionally gzipped) to convert, header row required.
      outputs:
        - name: table_parquet
          type: data
          format: data
          from_work_dir: table.parquet
          label: Parquet table
      shell_command: |
        duckdb -c "SET temp_directory='.'; COPY (SELECT * FROM read_csv('$(inputs.table.path)', delim='\t', header=true)) TO 'table.parquet' (FORMAT PARQUET);"

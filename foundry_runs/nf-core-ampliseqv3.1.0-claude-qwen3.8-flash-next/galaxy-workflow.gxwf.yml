  merge_tables:
    label: merge_tables
    doc: "DADA2_MERGE (source modules/local/dada2_merge.nf): merge per-group DADA2 sequence tables on shared ASV rows and export ASV fasta. Authored GalaxyUserTool over bioconductor-dada2 - the tables are RDS objects, invisible to tabular tools; input is a multiple collection (exemplar whole-collection idiom), which in v1 carries the single group's table."
    run:
      class: GalaxyUserTool
      id: ampliseq_asv_merge
      version: 1.0.0
      name: ASV Table Merger and FASTA Exporter
      description: Merge DADA2 sequence tables into one ASV count table and export the ASV sequences as FASTA
      license: GPL-3.0-or-later
      container: quay.io/biocontainers/bioconductor-dada2:1.38.0--r45ha27e39d_0
      inputs:
        - name: seqtabs
          type: data
          format:
            - dada2_sequencetable
          multiple: true
          label: DADA2 sequence table(s)
          help: "One table per denoising group (v1: exactly one)."
      outputs:
        - name: asv_table
          type: data
          format: tsv
          from_work_dir: asv_table.tsv
          label: Merged ASV count table
        - name: asv_fasta
          type: data
          format: fasta
          from_work_dir: asv_sequences.fasta
          label: ASV sequences
      configfiles:
        - filename: asv_merge.R
          content: |
            #!/usr/bin/env Rscript
            suppressPackageStartupMessages(library(dada2))
            files <- commandArgs(trailingOnly = TRUE)
            tables <- lapply(files, readRDS)
            merged <- if (length(tables) == 1) tables[[1]] else mergeTables(tables)
            write.table(merged, "asv_table.tsv", sep = "\t", quote = FALSE, col.names = NA)
            dna <- rownames(merged)
            writeLines(paste0(">ASV_", seq_along(dna), "\n", dna), "asv_sequences.fasta")
      shell_command: Rscript asv_merge.R $(inputs.seqtabs.map((input) => `'${input.path}'`).join(' '))
    in:
      seqtabs: rmchimera/stable_sequencetable
    out:
      - id: asv_table
      - id: asv_fasta
  stats_merge:
    label: stats_merge
    doc: "MERGE_STATS_* (source modules/local/merge_stats_dada2.nf): stack filtntrim + mergemates stage tables with stage/source columns into per_sample_stats. Authored GalaxyUserTool - the exemplar's seqCounts repeat-port fan-in is fixed-N and cannot carry runtime-variable per-sample details collections; stage labels fixed per port (source passes them on a value channel)."
    run:
      class: GalaxyUserTool
      id: ampliseq_stats_merge
      version: 1.0.0
      name: Per-Stage Statistics Merger
      description: Stack per-stage DADA2 statistics tables into one long table with stage and source columns
      license: GPL-3.0-or-later
      container: quay.io/biocontainers/python:3.13
      inputs:
        - name: filtntrim
          type: data
          format:
            - tabular
            - tsv
          optional: true
          label: filterAndTrim statistics
          help: Statistics table from the DADA2 filterAndTrim step.
        - name: mergemates
          type: data
          format:
            - tabular
            - tsv
          multiple: true
          optional: true
          label: mergePairs per-sample details
          help: mergePairs details tables (one per sample) from the DADA2 merge stage.
      outputs:
        - name: stats_tsv
          type: data
          format: tsv
          from_work_dir: stats_merged.tsv
          label: Merged per-sample statistics
      configfiles:
        - filename: merge_stats.py
          content: |
            import os
            import sys

            def arg_to_pairs(arg, stage):
                if arg == "EMPTY":
                    return []
                return [(stage, p) for p in arg.split(",") if p]

            pairs = arg_to_pairs(sys.argv[1], "filtntrim") + arg_to_pairs(sys.argv[2], "mergemates")

            rows = []
            width = 0
            for stage, path in pairs:
                with open(path) as fh:
                    lines = [ln.rstrip("\n") for ln in fh if ln.strip()]
                if len(lines) < 2:
                    continue
                head = lines[0].split("\t")
                body = lines[1:] if len(head) > 1 else lines
                src = os.path.splitext(os.path.basename(path))[0]
                for ln in body:
                    parts = ln.split("\t")
                    rows.append([stage, src] + parts)
                    width = max(width, len(parts))
            header = ["stage", "source"] + ["col_%d" % (i + 1) for i in range(width)]
            with open("stats_merged.tsv", "w") as out:
                out.write("\t".join(header) + "\n")
                for r in rows:
                    r = r + ["NA"] * (len(header) - len(r))
                    out.write("\t".join(r) + "\n")
      shell_command: "python3 merge_stats.py $(inputs.filtntrim ? `'${inputs.filtntrim.path}'` : 'EMPTY') $(inputs.mergemates.length ? inputs.mergemates.map((input) => input.path).join(',') : 'EMPTY')"
    in:
      mergemates: details_pick/data_param
      filtntrim: filter_fw/outtab
    out:
      - id: stats_tsv

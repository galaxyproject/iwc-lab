    doc: "KRAKEN2_TAXONOMY_WF - classify ASVs against the user database archive. Authored UDT: the shed iuc/kraken2 2.17.1 wrapper only accepts admin-installed databases through a select, so a user tar.gz DB has no port there; this tool reproduces the source UNTAR + KRAKEN2_KRAKEN2 (ext.args --use-names --confidence, single-end; source conda kraken2=2.1.6 pinned in the container)."
    when: $(inputs.kraken2_ref_tax_custom) != null && !$(inputs.skip_taxonomy)
    in:
      reads: merge_tables/asv_fasta
      db: kraken2_ref_tax_custom
      confidence: kraken2_confidence
    out:
      - id: report
      - id: classified_reads_assignment
    run:
      class: GalaxyUserTool
      id: ampliseq_kraken2_classify
      version: 1.0.0
      name: Kraken2 Classifier (custom database archive)
      description: Classify ASV sequences against a user-supplied Kraken2 database archive, producing the kraken2 report and per-read assignment
      license: BSD-3-Clause
      help:
        format: markdown
        content: |
          Mirrors nf-core/ampliseq `KRAKEN2_TAXONOMY_WF`: unpacks the supplied
          database archive (tar.gz / tgz, located via hash.k2d), then runs
          `kraken2 --db <dir> --report ... --output ... --use-names
          --confidence <conf> <ASV fasta>` (single-end; `--use-names` is required
          by the downstream formatter). Authored because the Tool Shed
          `iuc/kraken2` wrapper accepts only admin-installed databases from a
          select list - a user-supplied archive has no port. Container matches the
          source module's conda pin (kraken2 2.1.6); `tar` is the base image's GNU
          tar.
      container: quay.io/biocontainers/kraken2:2.1.6--pl5321h077b44d_0
      inputs:
        - name: reads
          type: data
          format:
            - fasta
          label: Query sequences
          help: ASV FASTA used as single-end queries.
        - name: db

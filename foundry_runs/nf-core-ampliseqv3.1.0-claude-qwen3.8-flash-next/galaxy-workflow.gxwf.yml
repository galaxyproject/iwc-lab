  filtntrim_filter_empty:
    tool_id: __FILTER_EMPTY_DATASETS__
    tool_version: 1.0.0
    label: filtntrim_filter_empty
    doc: drop elements emptied by filtering (drop-not-error; source error() semantics not carried - ledger sample-failure-error-semantics). Stock operation tool, version pinned from live server metadata (ModelClass FilterEmptyDatasetsTool v1.0.0); corpus-wide drop idiom (mgnify 20x).
    in:
      input: filter_fw/paired_output
    out:
      - id: output
  filtntrim_report:
    label: filtntrim_report
    doc: "Failed-sample report from filterAndTrim statistics (source min_read_counts branch in dada2_preprocessing; v1 always drops-and-reports instead of error() - ledger sample-failure-error-semantics). Authored GalaxyUserTool: existing tabular tools cannot do header-aware column detection plus a reason column."
    run:
      class: GalaxyUserTool
      id: ampliseq_filtntrim_failed_report
      version: 1.0.0
      name: filterAndTrim Failed-Sample Reporter
      description: Collect samples that fell below the minimum surviving-read count from DADA2 filterAndTrim statistics tables
      license: GPL-3.0-or-later
      container: quay.io/biocontainers/python:3.13
      inputs:
        - name: stats
          type: data
          format:
            - tabular
            - tsv
          multiple: true
          label: filterAndTrim statistics table(s)
          help: Per-sample statistics emitted by the DADA2 filterAndTrim wrapper.
        - name: min_read_counts
          type: integer
          value: 1
          label: Minimum surviving reads
          help: Samples with fewer surviving reads after filtering are reported (source --min_read_counts, default 1).
      outputs:
        - name: failed_tsv
          type: data
          format: tsv
          from_work_dir: failed_samples.tsv
          label: Failed samples report
      configfiles:
        - filename: failed_report.py
          content: |
            import sys

            min_reads = int(sys.argv[1])
            paths = sys.argv[2:]
            rows = []
            for path in paths:
                with open(path) as fh:
                    lines = [ln.rstrip("\n") for ln in fh if ln.strip()]
                if not lines:
                    continue
                header = lines[0].split("\t")
                col = None
                for idx, name in enumerate(header[1:], start=1):
                    if "filter" in name.lower():
                        col = idx
                        break
                if col is None:
                    for idx, name in enumerate(header[1:], start=1):
                        try:
                            float(lines[1].split("\t")[idx])
                            col = idx
                            break
                        except (ValueError, IndexError):
                            continue
                if col is None:
                    sys.exit("Could not identify the surviving-reads column in " + path)
                for ln in lines[1:]:
                    parts = ln.split("\t")
                    try:
                        kept = int(float(parts[col]))
                    except (ValueError, IndexError):
                        continue
                    if kept < min_reads:
                        rows.append((parts[0], "surviving reads %d < min_read_counts %d" % (kept, min_reads)))
            with open("failed_samples.tsv", "w") as out:
                out.write("sample\treason\n")
                for sample, reason in rows:
                    out.write("%s\t%s\n" % (sample, reason))
      shell_command: python3 failed_report.py $(inputs.min_read_counts) $(inputs.stats.map((input) => `'${input.path}'`).join(' '))
    in:
      stats: filter_fw/outtab
      min_read_counts: min_read_counts
    out:
      - id: failed_tsv

    optional: true
    doc: validation truth - expected abundances
  expected_profile:
    type: tsv
    optional: true
    doc: validation truth - expected taxonomic profile
  multiqc_logo:
    type: data
    optional: true
  multiqc_methods_description:
    type: data
    optional: true
  report_abstract:
    type: data
    optional: true

class: GalaxyWorkflow
label: nf-core/ampliseq 3.1.0 -> Galaxy (draft)
doc: |
  gxformat2 draft translated from nf-core/ampliseq 3.1.0 (b9bd579) per
  nextflow-galaxy-interface.md / nextflow-galaxy-data-flow.md / iwc-comparison-notes.md.
  Topology settled here; wrapper tier deferred per step via TODO + _plan_* (nearest IWC
  exemplar amplicon/dada2/dada2_paired supplies identity pins for the DADA2 spine,
  tool_version left TODO per galaxy-workflow-draft-format).
  Design decisions:
  - Element identifier = the `sample` column ONLY (loop correction, iteration 2): Galaxy
    builds sample_sheet collection elements at input-form time, so no workflow step can
    re-key identifiers - the data-flow's sample[__run] fold is inexpressible (ledger
    multirun-sheet-inexpressible-v1). Multi-run sheets fail input validation; v1 carries
    the single-run scenario (fixture Samplesheet_v3.tsv is sample-unique). The planned
    derive_identifiers step was removed and consumers wired directly to `input`.
  - FLAT step set, no nested subworkflows. v1 taxonomy branches are 1-3 steps each
    (multi-DB fan-out dropped with the catalog), so inline `when:` gating per branch is
    the conditionals-MOC-correct primitive; the data-flow's subworkflow-when shape is
    superseded by ledger decision taxonomy-branches-inline-gated. Stage narrative lives
    in the `comments:` frames.
  - Guards are direct ES5.1 `when:` expressions over workflow inputs ($(x) != null,
    !$(x), == 'lit', &&/|| conjunctions), same engine notes as the mag run; compound-gate
    import behavior remains a carried runtime question.
  - Reads routing after optional trimming uses pick_value(first_or_skip) - skipped
    producers yield the engine sentinel the primitive detects.
  - Taxonomy consolidation fans in all PRESENT branch tables (N varies with supplied
    custom refs). tax_consolidate runs when consolidate_taxonomies != 'first' and >=1
    branch is enabled, reducing to a pass-through for one table (documented deviations
    from the source's >1 gate and its classifier subset); method 'first' is gated out of
    the step so the knot alone realizes it; the promoted taxonomy_table comes from a
    first_or_skip pick over [consolidate, each branch], never pick_value(select-one). Sentinel tolerance of the merge steps is the
    carried ledger question consolidate-taxonomy-optional-fanin (phase-11 validation).
  - counts_table comes straight from the ASV table (long-melt), not the source's
    SUMMARY_TABLE_TAXONOMY reshape path; parquet summaries keep their own duckdb step.
  - Chimera removal stays per-group before the cross-group table merge (source order);
    the exemplar's merge-then-rmchimera order is recorded on rmchimera._plan_context as
    the fallback if wrappers force it.
  - v1 scope carries the interface restrictions: illumina only, no multiregion input
    (ledger multiregion-fanout-no-recipe), selectors/catalog not exposed, ~55 tuning
    scalars fixed as design constants inside wrapper state.
tags:
  - amplicon
  - 16S
  - ITS
  - ASV
  - DADA2
  - taxonomy
  - microbiome
license: MIT
inputs:
  input:
    type: collection
    collection_type: sample_sheet:paired_or_unpaired
    format:
      - fastqsanger.gz
    optional: false
    doc: |
      amplicon sample sheet (assets/schema_input.json). fastq_2 empty => single-end element.
      Element identifier = `sample`; uniqueness is enforced when Galaxy builds this
      collection, so sheets reusing a sample across runs are not expressible in v1
      (ledger multirun-sheet-inexpressible-v1). `run` survives only in the sheet tabular
      (re-attachable by identifier join); with sample-unique rows grouping is trivial.
    column_definitions:
      - name: sample
        type: element_identifier
        optional: false
        validators:
          - type: regex
            expression: ^[a-zA-Z][a-zA-Z0-9_]+$
      - name: run
        type: string
        optional: true
        validators:
          - type: regex
            expression: ^\S+$
      - name: control
        type: string
        optional: true
        restrictions:
          - control
          - sample
      - name: quant_reading
        type: string
        optional: true
  dada_ref_tax_custom:
    type: data
    optional: true
    doc: DADA2 RDP-style training FASTA (pair with _sp for addspecies)
  dada_ref_tax_custom_sp:
    type: data
    optional: true
    doc: DADA2 species-level training FASTA
  qiime_ref_tax_custom:
    type: data
    optional: true
    doc: QIIME2 training reference sequences (FASTA; source tarball/dir form unpacked outside the workflow
    primer trimming dropped): null
  qiime_ref_tax_custom_2:
    type: data
    optional: true
    doc: paired reference taxonomy table (.tax
    headerless TSV) for training: null
  qiime_classifier:
    type: data
    optional: true
    doc: pre-trained sk-learn classifier .qza (alternative to custom training; requires the qza datatype)
  kraken2_ref_tax_custom:
    type: data
    optional: true
    doc: Kraken2 database archive (tar.gz)
  sintax_ref_tax_custom:
    type: fasta
    optional: true
    doc: SINTAX reference FASTA (headers with taxonomy)
  vsearch_lca_ref_tax_custom:
    type: fasta
    optional: true
    doc: vsearch LCA reference FASTA
  sidle_ref_tax_custom:
    type: data
    optional: true
    doc: SIDLE reference taxonomy (headerless TSV/txt paired with the reference FASTA)
  sidle_ref_seq_custom:
    type: fasta
    optional: true
    doc: SIDLE reference sequences
  sidle_region:
    type: string
    optional: true
    doc: SIDLE region name (e.g. V4-V5); source takes it from the multi-region sheet - v1 exposes it as a scalar (ledger sidle-single-region-v1)
  sidle_region_length:
    type: integer
    optional: true
    doc: SIDLE region trim length (source multi-region sheet column region_length)
  sidle_primer_fwd:
    type: string
    optional: true
    doc: SIDLE region forward primer (extract-reads --p-f-primer)
  sidle_primer_rev:
    type: string
    optional: true
    doc: SIDLE region reverse primer (extract-reads --p-r-primer)
  sidle_num_degenerates:
    type: integer
    default: 5
    doc: max degenerate positions (SIDLE_DBFILT --p-num-degenerates
    schema default 5): null
  sidle_ref_cleaning:
    type: string
    default: silva
    doc: SIDLE_TAXRECON --p-database cleaning style (source custom default silva)
  pplace_tree:
    type: newick
    optional: true
    doc: reference tree for phylogenetic placement
  pplace_aln:
    type: fasta
    optional: true
    doc: reference alignment for placement
  pplace_taxonomy:
    type: tsv
    optional: true
  metadata:
    type: tsv
    optional: true
    doc: sample metadata keyed by sample; gates FILTER_SAMPLES/METADATA_*/decontam/diversity-by-category
  expected_sequences:
    type: fasta
    optional: true
    doc: validation truth - expected ASV sequences
  expected_abundances:

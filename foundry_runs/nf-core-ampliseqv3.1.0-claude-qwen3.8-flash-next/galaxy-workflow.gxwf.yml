    default: all
  primer_fwd:
    type: string
    optional: true
    doc: 5' primer; required in practice for illumina
  primer_rev:
    type: string
    optional: true
  trunclenf:
    type: int
    optional: true
    doc: forward truncation; null => computed from quality profiles

      query: merge_tables/asv_fasta
    out:
      - id: fullaln
    run:
      class: GalaxyUserTool
      id: ampliseq_clustalo_profile
      version: 1.0.0
      name: Clustal Omega Profile Aligner (reference MSA plus queries)
      description: Profile-align unaligned query sequences onto a reference alignment with Clustal Omega (EPA-NG/GAPPA placement pre-step)
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: |
          Mirrors nf-core/ampliseq `CLUSTALO_ALIGN` inside the
          `fasta_newick_epang_gappa` subworkflow: `clustalo -i <query>
          --profile1=<reference alignment>` producing one merged alignment that
          `epa-ng --split` later partitions back into reference and query parts.
          The Tool Shed `ngphylogeny/clustalo` wrapper exposes no profile port,
          hence this tool. Source container is a mulled image; this tool pins the
          equivalent biocontainer build.
      container: quay.io/biocontainers/clustalo:1.2.4--h503566f_10
      inputs:
        - name: ref
          type: data
          format:
            - fasta
          label: Reference alignment
          help: Aligned reference sequences (aligned FASTA).
        - name: query
          type: data
          format:
            - fasta
          label: Query sequences
          help: Unaligned query sequences (ASVs) profile-aligned onto the reference.
      outputs:
        - name: fullaln
          type: data
          format: fasta
          from_work_dir: pplace_fullaln.fasta
          label: Merged profile alignment
      shell_command: clustalo -i $(inputs.query.path) --profile1=$(inputs.ref.path) --threads=1 -o pplace_fullaln.fasta
  pplace_split:
    label: pplace_split
    doc: "PPLACE part 2/6: epa-ng --split recovers the aligned reference rows and the gap-stripped query rows from the merged profile alignment (source EPANG_SPLIT; the shed epa_ng wrapper has no split mode)."
    when: $(inputs.pplace_tree) != null && $(inputs.pplace_aln) != null
    in:
      refaln: pplace_aln
      fullaln: pplace_align/fullaln
    out:
      - id: query
      - id: reference
    run:
      class: GalaxyUserTool
      id: ampliseq_epa_split
      version: 1.0.0
      name: EPA-NG Alignment Splitter (reference and query parts)
      description: Split a merged profile alignment into the aligned reference part and the unaligned query part using epa-ng --split
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: |
          Mirrors nf-core/ampliseq `EPANG_SPLIT`: runs `epa-ng --split
          <reference alignment> <merged alignment>`, which writes `query.fasta`
          (query rows with gaps stripped) and `reference.fasta` (reference rows
          kept aligned) into the working directory. The Tool Shed `iuc/epa_ng`
          wrapper only exposes placement mode, not `--split`, hence this tool.
          Container build differs from the source module pin (`0.3.8--h9a82719_1`
          is no longer an active biocontainer tag); same epa-ng version.
      container: quay.io/biocontainers/epa-ng:0.3.8--h077b44d_7
      inputs:
        - name: refaln
          type: data
          format:
            - fasta
          label: Reference alignment
          help: Aligned reference sequences used to decide which merged-alignment rows are reference.
        - name: fullaln
          type: data
          format:
            - fasta
          label: Merged alignment
          help: Profile alignment containing reference and query rows (e.g. from clustalo --profile1).
      outputs:
        - name: query
          type: data
          format: fasta
          from_work_dir: split_query.fasta
          label: Unaligned query sequences
        - name: reference
          type: data
          format: fasta
          from_work_dir: split_reference.fasta
          label: Reference alignment (rows of the merged alignment)
      shell_command: epa-ng --split $(inputs.refaln.path) $(inputs.fullaln.path) && mv query.fasta split_query.fasta && mv reference.fasta split_reference.fasta
  pplace_epa:

    label: tax_tables_merge
    doc: ch_tax_tsv bundle - the present per-branch formatted tables as one named list collection (element ids dada, qiime2, sintax, vsearch_lca, kraken2, sidle), feeding the tool_taxonomy_tables output. gxformat2 cannot gather when-gated step outputs into a list input and __BUILD_LIST__ needs a collection it cannot get, so an optional-ports UDT plays the merge role; sentinel tolerance = carried ledger question consolidate-taxonomy-optional-fanin (phase-11 check). Source database-name provenance collapses to branch names in the v1 custom-ref posture.
    when: "!$(inputs.skip_taxonomy) && ( $(inputs.dada_ref_tax_custom) != null || $(inputs.qiime_ref_tax_custom) != null || $(inputs.sintax_ref_tax_custom) != null || $(inputs.vsearch_lca_ref_tax_custom) != null || $(inputs.kraken2_ref_tax_custom) != null || $(inputs.sidle_ref_tax_custom) != null )"
    in:
      tax_dada: tax_dada_format/tsv
      tax_qiime: tax_qiime2_classify_pick/data_param
      tax_sintax: tax_sintax_format/tsv
      tax_vlca: tax_vsearch_lca_format/tsv
      tax_k2: tax_kraken2_format/tax_tsv
      tax_sidle: tax_sidle/taxonomy
    out:
      - id: tax_list
    run:
      class: GalaxyUserTool
      id: ampliseq_merge_tax_tables
      version: 1.0.0
      name: Taxonomy table bundle (ampliseq)
      description: Bundle the present per-branch taxonomy tables into one named list collection
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy realization of the nf-core/ampliseq ch_tax_tsv channel - the list of [classifier:database, file] pairs collected from whichever taxonomy branches ran (workflows/ampliseq.nf ch_tax_tsv.mix blocks), exposed as the tool_taxonomy_tables workflow output and consumed by the robject/summary steps. Galaxy gxformat2 has no implicit \"gather N when-gated step outputs into a list\" step input, and the __BUILD_LIST__ collection operation needs a collection input it cannot get here, so this tool plays the bundle role: the six branch tables arrive as optional datasets (same skipped-branch sentinel tolerance as ampliseq_consolidate_taxonomy - empty or non-file substitution is skipped, carried ledger question consolidate-taxonomy-optional-fanin) and the present subset is emitted as a list collection whose element identifiers name the branch (dada, qiime2, sintax, vsearch_lca, kraken2, sidle). The source pairs each file with a database name; in the v1 custom-ref posture every branch holds a user-supplied database, so the branch name alone carries the provenance the source's val(sources) role provided. Fails loudly when no branch table arrived (the workflow guard makes that unreachable)."
      container: quay.io/biocontainers/python:3.9--1
      inputs:
        - name: tax_dada
          type: data
          format:
            - tabular
            - tsv
            - txt
          optional: true
          label: DADA2 formatted taxonomy
        - name: tax_qiime
          type: data
          format:
            - tabular
            - tsv
            - txt
          optional: true
          label: QIIME2 taxonomy table
        - name: tax_sintax
          type: data
          format:
            - tabular
            - tsv
            - txt
          optional: true
          label: SINTAX formatted taxonomy
        - name: tax_vlca
          type: data
          format:
            - tabular
            - tsv
            - txt
          optional: true
          label: VSEARCH-LCA formatted taxonomy
        - name: tax_k2
          type: data
          format:
            - tabular
            - tsv
            - txt
          optional: true
          label: Kraken2 taxonomy table
        - name: tax_sidle
          type: data
          format:
            - tabular
            - tsv
            - txt
          optional: true
          label: SIDLE taxonomy table
      outputs:
        - name: tax_list
          type: collection
          collection_type: list
          label: Present per-branch taxonomy tables
          discover_datasets:
            - discover_via: pattern
              pattern: __name__
              directory: merged
      shell_command: |
        mkdir -p merged;
        add() { if [ -n "$1" ] && [ -f "$1" ]; then cp "$1" "merged/$2.tsv"; fi; };
        add "$(inputs.tax_dada.path)" dada;
        add "$(inputs.tax_qiime.path)" qiime2;
        add "$(inputs.tax_sintax.path)" sintax;
        add "$(inputs.tax_vlca.path)" vsearch_lca;
        add "$(inputs.tax_k2.path)" kraken2;
        add "$(inputs.tax_sidle.path)" sidle;
        if [ -z "$(ls -A merged)" ]; then echo "ampliseq_merge_tax_tables: no taxonomy tables supplied" >&2; exit 1; fi

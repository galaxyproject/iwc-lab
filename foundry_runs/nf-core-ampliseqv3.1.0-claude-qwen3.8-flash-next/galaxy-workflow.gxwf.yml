    run:
      class: GalaxyUserTool
      id: ampliseq_sintax
      version: 1.0.0
      name: VSEARCH SINTAX classifier
      description: Assign taxonomy to ASV sequences with vsearch --sintax against a SINTAX-formatted reference FASTA
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: |
          Reproduces nf-core/ampliseq `VSEARCH_SINTAX` (modules/nf-core/vsearch/
          sintax, container pin kept): `vsearch --sintax <query> --db <ref>
          --gzip_decompress --sintax_cutoff <cutoff> --randseed <seed>
          --tabbedout <tsv>`. Authored because no Tool Shed wrapper exposes SINTAX:
          the installed `iuc/vsearch` family is 2.8.3.x (predates SINTAX, added in
          vsearch 2.12) and probes for `vsearch_sintax` at 2.8.3/2.22.1/2.31.x all
          miss on the shed. `--gzip_decompress` is kept from the source ext.args
          (the source feeds a gzipped reference); it is a no-op on plain FASTA.
          Deviation: the source marks the tsv output optional (zero-hit runs emit
          none); here an empty tsv is produced instead so the step always yields a
          dataset, and a non-zero vsearch exit still fails the job.
      container: quay.io/biocontainers/vsearch:2.31.0--hd2be7a0_0
      inputs:
        - name: query
          type: data
          format:
            - fasta
          label: Query sequences
          help: ASV FASTA to classify.
        - name: db
          type: data
          format:
            - fasta
            - gz
          label: SINTAX reference database
          help: Reference FASTA with SINTAX taxonomy in headers (>id;taxonomy=d__Bacteria;...), plain or gzipped.
        - name: sintax_cutoff
          type: float
          value: 0.8
          label: Confidence cutoff
          help: vsearch --sintax_cutoff; higher values require higher confidence to assign a rank.
        - name: seed
          type: integer
          value: 100
          label: Random seed
          help: vsearch --randseed (source passes params.seed for tie-breaking reproducibility).
      outputs:
        - name: tax
          type: data
          format: tsv
          from_work_dir: sintax.tsv
          label: SINTAX tabbed output (one line per query per hit rank)
      shell_command: vsearch --sintax $(inputs.query.path) --db $(inputs.db.path) --threads 1 --gzip_decompress --sintax_cutoff $(inputs.sintax_cutoff) --randseed $(inputs.seed) --tabbedout sintax.tsv; rc=$?; [ $rc -eq 0 ] || exit $rc; touch sintax.tsv
  tax_sintax_format:
    label: tax_sintax_format
    doc: "FORMAT_TAXRESULTS_SINTAX - rank-column decomposition of the SINTAX tabbed output (authored UDT ampliseq_sintax_format: verbatim bin/convert_sintax_output.py on the source python:3.9 image; pipeline-internal script, no shed coverage; dbversion fixed user_supplied per custom-path-only v1)."
    when: $(inputs.sintax_ref_tax_custom) != null && !$(inputs.skip_taxonomy)
    in:
      tax: tax_sintax/tax
      fasta: merge_tables/asv_fasta
      taxlevels: sintax_assign_taxlevels
    out:
      - id: tsv
    run:
      class: GalaxyUserTool
      id: ampliseq_sintax_format
      version: 1.0.0
      name: SINTAX output formatter
      description: Convert vsearch SINTAX tabbed output to the ampliseq DADA2-like taxonomy tsv (FORMAT_TAXRESULTS_SINTAX replica)
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Verbatim replica of nf-core/ampliseq `FORMAT_TAXRESULTS_SINTAX`: runs bin/convert_sintax_output.py unchanged (python:3.9 image, the source's container family). Splits the SINTAX annotation string into the requested rank columns (taxlevels, default Kingdom,Phylum,Class,Order,Family,Genus,Species), extracts per-rank confidences, appends the ASV sequence, and handles UNITE sh_ species suffixes. dbversion is fixed to user_supplied (v1 is custom-reference only, ledger expose-custom-path-inputs-not-catalog), so the UNITE branch triggers only if a user types an alternative level list matching UNITE - kept faithful. Output prefix fixed to ASV_tax_sintax (single-group v1). Pipeline-internal script, no shed coverage - authored."
      container: quay.io/biocontainers/python:3.9--1
      inputs:
        - name: tax
          type: data
          format:
            - tsv
            - txt
          label: SINTAX tabbed output
          help: vsearch --tabbedout table.
        - name: fasta
          type: data
          format:
            - fasta
          label: ASV sequences
          help: Used to append the sequence column.
        - name: taxlevels
          type: text
          value: Kingdom,Phylum,Class,Order,Family,Genus,Species
          label: Taxonomic levels
          help: Comma-separated rank column names; empty falls back to the source default.
      outputs:
        - name: tsv
          type: data
          format: tsv
          from_work_dir: ASV_tax_sintax.tsv
          label: Formatted ASV taxonomy
      configfiles:
        - filename: convert_sintax_output.py
          content: |
            #!/usr/bin/env python3
            ##### Program description #######
            #
            # Title: Convert sintax output to DADA2-like tsv format
            #
            # Author(s): Lokeshwaran Manoharan, Jeanette Tångrot
            #
            # Description:
            #
            # List of subroutines:
            #
            # Usage: convert_sintax_output.py -i <sintax_results.tsv> -f <fastafile> -o <output_filename> -t <taxlevels> -d <db_version>
            ##################################

            import re
            import argparse

            usage = """This program takes the output of SINTAX and creates taxonomy file in a format suitable for the ampliseq pipeline"""

            parser = argparse.ArgumentParser(description=usage)

            parser.add_argument(
                "-i",
                "--infile",
                dest="infile",
                metavar="INFILE",
                type=argparse.FileType("r"),
                help="SINTAX output",
                required=True,
            )

            parser.add_argument(
                "-f",
                "--fasta",
                dest="fastafile",
                metavar="FASTAFILE",
                type=argparse.FileType("r"),
                help="FASTA file with sequences",
                required=True,
            )

            parser.add_argument(
                "-o",
                "--outfile",
                dest="outfile",
                metavar="OUTFILE",
                type=argparse.FileType("w"),
                help="Final Taxonomy in tsv format",
                default="sintax_taxonomy.tsv",
            )

            parser.add_argument(
                "-t",
                "--taxlevels",
                dest="taxlevels",
                metavar="TAXLEVELS",
                help="Taxonomy levels to use, comma separated list",
                default="",
            )

            parser.add_argument(
                "-d",
                "--dbversion",
                dest="db",
                metavar="DBVERSION",
                help="Taxonomy database name",
                default="",
            )

            args = parser.parse_args()


            def complete_list(some_list, target_len):
                return some_list[:target_len] + [""] * (target_len - len(some_list))


            # Find out if taxonomies contain SH groups
            dbtype = "default"
            if "UNITE" in args.db:
                dbtype = "UNITE"

            # Read fasta file and store as dictionary
            # If multiple sequences have the same name only the first will be stored
            seqs = dict()
            seq = ""
            name = ""
            for line in args.fastafile:
                if line.startswith(">"):
                    if seq != "" and name != "":
                        if name not in seqs:
                            seqs[name] = seq
                    seq = ""
                    name = line.lstrip(">").rstrip()
                else:
                    seq = seq + line.rstrip("\n")
            if seq != "" and name != "" and name not in seqs:
                seqs[name] = seq

            # Print header to outfile
            if args.taxlevels != "":
                if dbtype == "UNITE":
                    header = ["ASV_ID"] + args.taxlevels.split(",") + ["SH", "confidence", "sequence"]
                else:
                    header = ["ASV_ID"] + args.taxlevels.split(",") + ["confidence", "sequence"]
            else:
                header = ["ASV_ID", "confidence", "sequence"]
            num_taxa = len(header) - 3
            num_cols = num_taxa
            if dbtype == "UNITE":
                num_taxa = num_taxa - 1
            print("\t".join(header), file=args.outfile)

            # Read sintax file, parse results, and write taxonomies together with sequence to outfile
            for line in args.infile:
                line = line.rstrip("\n")
                tmp_list = line.split("\t")
                sequence = seqs[tmp_list[0]] if tmp_list[0] in seqs else ""
                if tmp_list[3] != "":
                    annot = re.sub("(^|,)[dkpcofgst]:", r"\1", tmp_list[3])
                    annot_list = annot.split(",")
                    raw_annot = re.sub("(^|,)[dkpcofgst]:", r"\1", tmp_list[1])
                    raw_annot_list = raw_annot.split(",")
                    confidence = raw_annot_list[len(annot_list) - 1].split("(")[1]
                    confidence = confidence[:-1]
                    if len(annot_list) != num_taxa:
                        annot_list = complete_list(annot_list, num_cols)
                        print(tmp_list[0], "\t".join(annot_list), confidence, sequence, sep="\t", file=args.outfile)
                    else:
                        if dbtype == "UNITE":
                            (species, sh) = annot_list[num_taxa - 1].rsplit("_", 1)
                            annot_list[num_taxa - 1] = species
                            annot_list.append(sh)
                        print(tmp_list[0], "\t".join(annot_list), confidence, sequence, sep="\t", file=args.outfile)
                else:
                    print(tmp_list[0], "\t".join([""] * num_cols), "", sequence, sep="\t", file=args.outfile)


            args.outfile.close()
            args.infile.close()
      shell_command: TL="$(inputs.taxlevels.value)"; [ -n "$TL" ] || TL="Kingdom,Phylum,Class,Order,Family,Genus,Species"; python3 convert_sintax_output.py -i $(inputs.tax.path) -f $(inputs.fasta.path) -o ASV_tax_sintax.tsv -t "$TL" -d user_supplied

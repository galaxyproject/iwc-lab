      outputs:
        - name: table
          type: data
          format: tsv
          from_work_dir: decontam_table.tsv
          label: Decontam-filtered ASV count table
        - name: fasta
          type: data
          format: fasta
          from_work_dir: filtered_sequences.fasta
          label: ASV sequences present in the filtered table
      configfiles:
        - filename: decontam.R
          content: |
            #!/usr/bin/env Rscript
            # Replica of modules/local/decontam/main.nf's script block fused with the
            # FILTER_SEQUENCES_ABUNDANCES rebind (modules/local/filter_sequences_abundances/main.nf)
            # and the workflow guards of workflows/ampliseq.nf:717-741. Deviations in the tool help.
            suppressPackageStartupMessages(library(decontam))
            suppressPackageStartupMessages(library(Biostrings))

            a <- commandArgs(trailingOnly = TRUE)
            mode <- a[1]; method <- a[2]
            threshold <- as.numeric(a[3]); threshold_nc <- as.numeric(a[4]); seed <- a[5]
            table_file <- a[6]; metadata_file <- a[7]; fasta_file <- a[8]

            set.seed(seed) # Initialize random number generator for reproducibility

            # get controls and concentrations
            metadata <- read.csv(metadata_file, header = TRUE, sep = "\t")
            metadata <- metadata[order(metadata[,1]),] # make sure samples in metadata and abundances are in same order
            if ("quant_reading" %in% colnames(metadata)) {
                concentrations <- metadata$quant_reading
            } else { concentrations <- list() }
            if ("control" %in% colnames(metadata)) {
                negative_controls <- metadata$control == 'control'
            } else { negative_controls <- list() }

            # get abundance table
            abundances_tsv <- read.csv(table_file, header = TRUE, sep = "\t")
            abundances <- abundances_tsv[,-1]
            rownames(abundances) <- abundances_tsv[,1]
            abundances <- t(abundances)
            abundances <- abundances[order(rownames(abundances)),] # make sure samples in metadata and abundances are in same order

            # make sure that the metadata doesnt contain more samples than the abundance table (samples might have been lost before)
            metadata <- metadata[metadata[,1] %in% rownames(abundances),]

            if (mode == "decontaminate") {
                # find contaminants: null hypothesis is that sequences are NOT contaminants.
                if (length(negative_controls) > 0 && length(concentrations) > 0) {
                    contam_table <- isContaminant(as.matrix(abundances), conc = concentrations, neg = negative_controls, threshold = threshold, method = method, detailed = TRUE, normalize = TRUE)
                } else if (length(concentrations) > 0) {
                    contam_table <- isContaminant(as.matrix(abundances), conc = concentrations, threshold = threshold, method = method, detailed = TRUE, normalize = TRUE)
                } else if (length(negative_controls) > 0) {
                    contam_table <- isContaminant(as.matrix(abundances), neg = negative_controls, threshold = threshold, method = method, detailed = TRUE, normalize = TRUE)
                } else { stop("Neither negative controls nor concentration values were provided.") }
                contam_table <- cbind(ID = rownames(contam_table), contam_table)
                rownames(contam_table)[1] <- colnames(abundances_tsv)[1]

                iscontaminant_id <- contam_table[!(contam_table$contaminant),][,1]
                abundances_filtered <- abundances_tsv[abundances_tsv[,1] %in% iscontaminant_id,]
                if (nrow(abundances_filtered) == 0) {
                    stop("Decontamination removed all features, please adjust settings.")
                }
                write.table(abundances_filtered, file = "decontam_table.tsv", sep = "\t", row.names = FALSE, col.names = TRUE, quote = FALSE, na = '')
            } else if (mode == "notcontaminant") {
                if (length(negative_controls) == 0) {
                    stop("No non-contaminant features were identified, please check control samples (column 'control' in samplesheet).")
                }
                notcontam_table <- isNotContaminant(as.matrix(abundances), neg = negative_controls, threshold = threshold_nc, method = 'prevalence', detailed = TRUE, normalize = TRUE)
                notcontam_table <- cbind(ID = rownames(notcontam_table), notcontam_table)
                rownames(notcontam_table)[1] <- colnames(abundances_tsv)[1]

                isnotcontaminant_id <- notcontam_table[notcontam_table$not.contaminant,][,1]
                abundances_filtered <- abundances_tsv[abundances_tsv[,1] %in% isnotcontaminant_id,]
                if (nrow(abundances_filtered) == 0) {
                    stop("No non-contaminant features were identified, please check control samples (column 'control' in samplesheet).")
                }
                write.table(abundances_filtered, file = "decontam_table.tsv", sep = "\t", row.names = FALSE, col.names = TRUE, quote = FALSE, na = '')
            } else {
                stop(paste("Unknown decontam mode:", mode))
            }

            # FILTER_SEQUENCES_ABUNDANCES rebind (fasta side only - the source does not rebind
            # ch_asv_table here). Adaptation: table keys are sequences, fasta ids are labels.
            table2 <- read.table(file = "decontam_table.tsv", sep = "\t", comment.char = "", header = TRUE)
            colnames(table2)[1] <- "ASV_ID"
            seq <- readDNAStringSet(fasta_file)
            seq <- data.frame(ID = names(seq), sequence = paste(seq))

            filtered_table <- table2[table2$ASV_ID %in% seq$sequence,]
            filtered_seq <- seq[seq$sequence %in% table2$ASV_ID,]

            filtered_table <- filtered_table[order(filtered_table$ASV_ID),]
            filtered_seq <- filtered_seq[order(filtered_seq$sequence),]

            write.table(data.frame(s = sprintf(">%s\n%s", filtered_seq$ID, filtered_seq$sequence)),
                        file = "filtered_sequences.fasta", col.names = FALSE, row.names = FALSE, quote = FALSE, na = '')
      shell_command: |
        TABLE="$(inputs.table.path)";
        CTABLE="$(inputs.table_clustered.path)";
        if [ -n "$CTABLE" ] && [ -f "$CTABLE" ]; then TABLE="$CTABLE"; fi;
        FASTA="$(inputs.fasta_base.path)";
        CFASTA="$(inputs.fasta_clustered.path)";
        if [ -n "$CFASTA" ] && [ -f "$CFASTA" ]; then FASTA="$CFASTA"; fi;
        Rscript decontam.R "$(inputs.mode.value)" "$(inputs.method.value)" "$(inputs.threshold.value)" "$(inputs.threshold_nc.value)" "$(inputs.seed.value)" "$TABLE" "$(inputs.sheet.path)" "$FASTA"
  asv_table_knot:
    type: pick_value
    label: asv_table_knot
    doc: master post-filter ASV table - decontam result when decontam!=none, else cluster centroids when vsearch_cluster, else the codon-filtered table (the source's ch_asv_table rebind chain collapsed)
    state:
      style_cond:
        pick_style: first_or_skip
        type_cond:
          param_type: data
    in:
      pick_from_0|value: decontam_run/table
      pick_from_1|value: filter_clusters/table
      pick_from_2|value: codon_filter/table
    out:
      - id: data_param
  asv_fasta_knot:
    type: pick_value
    label: asv_fasta_knot
    doc: master post-filter ASV fasta - mirrors asv_table_knot on the sequence channel (ch_asv_fasta rebind chain)
    state:
      style_cond:
        pick_style: first_or_skip
        type_cond:
          param_type: data
    in:
      pick_from_0|value: decontam_run/fasta
      pick_from_1|value: filter_clusters/fasta
      pick_from_2|value: codon_filter/fasta
    out:
      - id: data_param
  expected_alignment:
    label: expected_alignment
    doc: ASV-to-expected global alignment - VSEARCH_USEARCHGLOBAL (comparison_wf:24-30, similarity 0.80 fixed there, BM args from conf/modules.config, --output_no_hits so unmatched ASVs get target "*" rows).
    when: $(inputs.expected_sequences) != null
    in:
      query: asv_fasta_knot/data_param
      db: expected_sequences
    out:
      - id: tsv
    run:
      class: GalaxyUserTool
      id: ampliseq_usearch_global_compare
      version: 1.0.0
      name: Observed-vs-expected global alignment (ampliseq comparison)
      description: Globally align observed ASVs against expected sequences with vsearch --usearch_global, emitting the userfields table the comparison scripts consume
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy replica of the nf-core VSEARCH_USEARCHGLOBAL module (modules/nf-core/vsearch/usearchglobal/main.nf) as invoked by nf-core/ampliseq subworkflows/local/comparison_wf/main.nf:24-30 with outoption 'userout', user_columns query+target+ql+tl+qilo+qihi+tilo+tihi+gaps+mism+qstrand and similarity threshold \"0.80\", plus the conf/modules.config batch-mode args \"--strand both --maxaccepts 0 --maxrejects 0 --dbmask none --qmask none --output_no_hits\" and prefix \"vsearch_usearchglobal\". --output_no_hits is essential - unmatched queries get target \"*\" rows that the comparison scripts count as absent expected sequences. Recorded deviations. (1) --threads 1 fixed (source $task.cpus; Galaxy UDTs are single-cpu). (2) The module's other output formats (aln/biom/lca/...) are never taken by this invocation (outoption is hardcoded 'userout'), so only the tsv is published. (3) The tag meta [id: val_md5sum_version] wrapping is a pipeline_info linkage device and is not carried."
      container: quay.io/biocontainers/vsearch:2.31.0--hd2be7a0_0
      inputs:
        - name: query
          type: data
          format:
            - fasta
          label: Observed ASV sequences
          help: Query fasta (the post-filter ASV sequences).
        - name: db
          type: data
          format:
            - fasta
          label: Expected sequences
          help: Reference fasta of expected sequences (params.expected_sequences in the source).
        - name: id
          type: float
          label: Similarity threshold
          value: 0.8
          help: vsearch --id cutoff; the source hardcodes "0.80" in comparison_wf (similarity_threshold).
      outputs:
        - name: tsv
          type: data
          format: tsv
          from_work_dir: vsearch_usearchglobal.tsv
          label: Userfields alignment table (query,target,ql,tl,qilo,qihi,tilo,tihi,gaps,mism,qstrand)
      shell_command: |
        vsearch --usearch_global "$(inputs.query.path)" --db "$(inputs.db.path)" --id "$(inputs.id.value)" --threads 1 --strand both --maxaccepts 0 --maxrejects 0 --dbmask none --qmask none --output_no_hits --userfields query+target+ql+tl+qilo+qihi+tilo+tihi+gaps+mism+qstrand --userout vsearch_usearchglobal.tsv
  compare_expected_sequences:
    label: compare_expected_sequences
    doc: EXPECTED_SEQUENCES comparison - COMPARE_SEQUENCES over the alignment above (bin/compare_sequences.r verbatim; region from expected_sequences_region, similarity 0.80). Emits the matches table consumed by compare_expected_abundances plus per-sample mismatch barplots. The optional expected_abundances input reproduces the source's ifEmpty([]) staging (absent - compare against all sequences).
    when: $(inputs.expected_sequences) != null
    in:
      alignment: expected_alignment/tsv
      observed: asv_table_knot/data_param
      expabund: expected_abundances
      region: expected_sequences_region
    out:
      - id: matches
      - id: matches_per_sample
      - id: svg
      - id: png
    run:
      class: GalaxyUserTool
      id: ampliseq_compare_sequences
      version: 1.0.0
      name: Nucleotide-difference comparison to expected sequences (ampliseq)
      description: Derive per-ASV mismatch counts from the observed-vs-expected alignment and per-sample mismatch barplots
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy replica of the nf-core/ampliseq COMPARE_SEQUENCES process (modules/local/compare_sequences/main.nf) as invoked by subworkflows/local/comparison_wf/main.nf:33-41 with similarity_threshold \"0.80\" and query_or_target = params.expected_sequences_region (schema enum alignment|observed|expected, default observed - exactly the values compare_sequences.r accepts). The R script bin/compare_sequences.r is embedded verbatim as a configfile; the command line mirrors the module script block (blast6 table, observed abundance table, expected abundance table, empty prefix, threshold, region). The optional expected-abundance input reproduces the source's ch_expected_abundances.ifEmpty([]) staging - when it is absent the substitution is empty, file.exists(\"\") is FALSE in R and the script compares against all sequences, which is the source behavior. FASTA/table key note - this draft's tables are keyed by ASV sequence, matching the source (dada2 ids are sequences), so the alignment 'query' column joins the table 'ID' column directly. Recorded deviations: the nucleotide-differences.log, Warnings.txt and md5sum_version.txt publications are not emitted (log/stderr stays in the job output; pipeline_info artifacts dropped precedent); per-sample barplots and per-sample tables are published as list collections instead of Nextflow .collect() fan-in."
      container: quay.io/biocontainers/r-base:4.2.1
      inputs:
        - name: alignment
          type: data
          format:
            - tabular
            - tsv
          label: Alignment table (userfields)
          help: vsearch --userout table with columns query,target,ql,tl,qilo,qihi,tilo,tihi,gaps,mism,qstrand (no header).
        - name: observed
          type: data
          format:
            - tabular
            - tsv
          label: Observed ASV count table
          help: ASV table keyed by sequence, first column then one column per sample.
        - name: expabund
          type: data
          format:
            - tabular
            - tsv
          optional: true
          label: Expected abundance table
          help: Optional expected-abundance tsv; when absent the script compares against all sequences (source ifEmpty([]) staging).
        - name: similarity
          type: float
          label: Similarity threshold
          value: 0.8
          help: Alignment similarity used by the alignment step; only affects the ">=20%" mismatch bucket label (source 0.80).
        - name: region
          type: text
          label: Mismatch region
          value: observed
          help: Whose mismatches to count - observed, expected or alignment (params.expected_sequences_region).
      outputs:
        - name: matches
          type: data
          format: tsv
          from_work_dir: nucleotide-differences.tsv
          label: Alignment table with mismatch_final column (COMPARE_SEQUENCES matches)
        - name: matches_per_sample
          type: collection
          collection_type: list
          format: tsv
          label: Per-sample mismatch counts
          discover_datasets:
            - discover_via: pattern
              pattern: "*_nucleotide-differences_per-sample.tsv"
        - name: svg
          type: collection
          collection_type: list
          format: svg
          label: Per-sample nucleotide-distance barplots (svg)
          discover_datasets:
            - discover_via: pattern
              pattern: "*_nucleotide-differences_barplot.svg"
        - name: png
          type: collection
          collection_type: list
          format: png
          label: Per-sample nucleotide-distance barplots (png)
          discover_datasets:
            - discover_via: pattern
              pattern: "*_nucleotide-differences_barplot.png"
      configfiles:
        - filename: compare_sequences.R
          content: |
            #!/usr/bin/env Rscript

            # compare_sequences.r

            # Get params and files from the command line
            args            <- commandArgs(trailingOnly=TRUE)
            alignmentFILE   <- args[1] # expected columns: "query+target+ql+tl+qilo+qihi+tilo+tihi+gaps+mism+qstrand", see https://torognes.github.io/vsearch/misc/vsearch-userfields.7.html
            obsabundFILE    <- args[2] # observed abundance*
            expabundFILE    <- args[3] # expected abundance*
            prefix          <- args[4] # prefix string for output files
            similarity_threshold <- as.numeric(args[5]) # similarity threshold for alignmentFILE
            query_or_target <- args[6] # use mismatches to query or to target?
            # tab-separated file with header: first column with sequences name, following one or many columns (=samples) with numeric values (=abundance), only presence (>0)/absence are used here

            # Input
            if (file.exists(expabundFILE)) {
            	print(paste("Compare",obsabundFILE,"to",expabundFILE))
            } else {
            	print(paste("Compare",obsabundFILE,"to all sequences"))
            }

            # PREPARE

            # Read sequence alignment table
            alignment = read.table( alignmentFILE, header = FALSE, sep = "\t", stringsAsFactors = FALSE, check.names = FALSE, strip.white = TRUE)
            colnames(alignment) <- c("query","target","ql","tl","qilo","qihi","tilo","tihi","gaps","mism","qstrand")

            # Read pipeline's ASV abundance table (either from QIIME2 [skipping first line] or from previous steps)
            if (grepl("^# Constructed from biom file", readLines(obsabundFILE, n = 1))) {
            	observed = read.table( obsabundFILE, header = TRUE, sep = "\t", stringsAsFactors = FALSE, check.names = FALSE, strip.white = TRUE, comment.char = "", skip=1 )
            } else {
            	observed = read.table( obsabundFILE, header = TRUE, sep = "\t", stringsAsFactors = FALSE, check.names = FALSE, strip.white = TRUE, comment.char = "" )
            }
            colnames(observed)[1] <- "ID"

            # select available samples
            observed_samples <- colnames(observed)[2:ncol(observed)]
            print(paste( "Observed samples:", paste(observed_samples,collapse=",")))
            SAMPLES <- observed_samples

            # Read expected abundance table if it exists
            if (file.exists(expabundFILE)) {
            	if (grepl("^# Constructed from biom file", readLines(expabundFILE, n = 1))) {
            		exp = read.table( expabundFILE, header = TRUE, sep = "\t", stringsAsFactors = FALSE, check.names = FALSE, strip.white = TRUE, comment.char = "", skip=1 )
            	} else {
            		exp = read.table( expabundFILE, header = TRUE, sep = "\t", stringsAsFactors = FALSE, check.names = FALSE, strip.white = TRUE, comment.char = "" )
            	}
            	colnames(exp)[1] <- "ID"
            	# extract samples to analyse
            	exp_samples <- colnames(exp)[2:ncol(exp)]
            	print(paste( "Expected samples:", paste( exp_samples ,collapse=",")))
            	SAMPLES <- exp_samples[exp_samples %in% observed_samples]
            	print(paste( "Investigate samples:", paste( SAMPLES ,collapse=",")))
            	# warn if samples are missing due to incomplete overlap
            	if ( !all(observed_samples %in% SAMPLES) ) {
            		print(paste("WARN - sample(s) not expected (file:",expabundFILE,") and omitted:",paste(observed_samples[!observed_samples %in% SAMPLES], collapse="," )))
            	}
            	if ( !all(exp_samples %in% SAMPLES) ) {
            		print(paste("WARN - sample(s) not observed and omitted:",paste(exp_samples[!exp_samples %in% SAMPLES], collapse="," )))
            	}
            	# warn about missing sequences
            	alignment_target <- alignment$target[alignment$target != "*"]
            	if( !all(alignment_target %in% exp$ID) ) {
            		print(paste("WARN - Some expected sequences in alignment results are not in",expabundFILE,". The following are missing:",paste( unique(alignment_target[!alignment_target %in% exp$ID]),collapse=",")))
            	}
            	if( !all(exp$ID %in% alignment$target) ) {
            		print(paste("WARN - Some expected sequences of",expabundFILE,"are not in the alignment results. The following are missing:",paste( unique(exp$ID[!exp$ID %in% alignment$target]),collapse=",")))
            	}
            }

            # check if there are any samples to analyse
            if (length(SAMPLES) == 0) {
            	stop( paste0("ERROR - Found no samples to investigate. Observed samples (via sequencing data input): ", paste(observed_samples, collapse=","), ". Samples in ", expabundFILE, ": ", paste(exp_samples, collapse=",")) )
            }

            # Investigate alignment, required columns: query,target,ql,tl,qilo,qihi,tilo,tihi,gaps,mism
            alignment$qterminalgaps <- alignment$ql - (abs(alignment$qihi-alignment$qilo)+1)
            alignment$qmism <- alignment$gaps + alignment$qterminalgaps + alignment$mism
            alignment$tterminalgaps <- alignment$tl - (abs(alignment$tihi-alignment$tilo)+1)
            alignment$tmism <- alignment$gaps + alignment$tterminalgaps + alignment$mism
            if( query_or_target=="observed" ) {
            	alignment$mismatch_final <- alignment$qmism
            } else if( query_or_target=="expected" ) {
            	alignment$mismatch_final <- alignment$tmism
            } else if( query_or_target=="alignment" ) {
            	alignment$mismatch_final <- alignment$gaps + alignment$mism
            } else {
            	stop( paste("ERROR -",query_or_target,"is not valid (valid: observed,expected,alignment)") )
            }

            # order for reproducibility
            alignment <- alignment[order(alignment$query, alignment$target),]

            # write file
            outfile <- paste0(prefix,"nucleotide-differences.tsv")
            print(paste("write",outfile))
            write.table(alignment, file = outfile, row.names = FALSE, col.names = TRUE, quote = FALSE, na = '', sep="\t")

            # ANALYSE

            # select matches above threshold
            matches_above_threshold <- alignment[alignment$target !="*",]

            for (sample in SAMPLES) {
            	if( file.exists(expabundFILE) ) {
            		# filter expected sequences in that sample (matches_above_threshold$target) with expected abundances (abundance > 0) of exp$ID
            		keep_cols <- c("ID",sample)
            		print(paste("Found",nrow(exp),"expected sequences overall in",expabundFILE))
            		s_exp <- subset(exp, select = keep_cols)
            		s_exp = s_exp[s_exp[,2] > 0,]
            		print(paste("Found",nrow(s_exp),"expected sequences in sample", sample,"in",expabundFILE))
            		s_matches <- matches_above_threshold[matches_above_threshold$target %in% s_exp$ID,]
            	} else {
            		s_matches <- matches_above_threshold
            	}

            	# sample will be skipped if s_matches has no data
            	if( nrow(s_matches)==0 ) {
            		print(paste("WARN - Skipping sample",sample,"because found no matches to expected sequences"))
            		next
            	} else {
            		print(paste("Found",length(unique(s_matches$query)),"to be expected sequences of",length(unique(matches_above_threshold$query)),"in sample",sample))
            		print(paste("Found",length(unique(s_matches$target)),"matches of",length(unique(matches_above_threshold$target)),"total in sample",sample))
            	}

            	# filter for ASVs in that sample
            	keep_cols <- c("ID",sample)
            	s_observed <- subset(observed, select = keep_cols)
            	# keep only observed entries in that sample (abundance > 0)
            	s_observed = s_observed[s_observed[,2] > 0,]
            	print(paste("Found",nrow(s_observed),"of",nrow(observed),"observed sequences in sample",sample))

            	# filter alignment result by observed
            	s_matches <- s_matches[s_matches$query %in% s_observed$ID,]
            	print(paste("Found",nrow(s_matches),"observed sequences with match in sample",sample))

            	# select best match (sort by mismatches and retain only first unique entry)
            	s_matches <- s_matches[order(s_matches$mismatch_final, as.numeric(s_matches$mismatch_final)), ]
            	s_matches <- s_matches[!duplicated(s_matches$query), ]
            	print(paste("Found",length(unique(s_matches$target)),"best matches of",length(unique(matches_above_threshold$target)),"total in sample",sample))

            	# record numbers below threshold
            	s_below_threshold <- s_observed[!s_observed$ID %in% s_matches$query,]
            	print(paste("Found",nrow(s_below_threshold),"observed sequences without match in sample",sample))

            	# make barplot
            	df <- as.data.frame( table(s_matches$mismatch_final) )
            	df <- rbind(df, data.frame(Var1 = paste0(">=",(1-similarity_threshold)*100,"%"), Freq = length(unique(s_below_threshold$ID))))
            	colnames(df) <- c("Mismatches to expected sequences","Number of sequences")

            	outfile <- paste0(prefix,sample,"_nucleotide-distance_barplot.svg")
            	print(paste("write",outfile))
            	svg(outfile, height = 4, width = 5)
            	barplot(df[,2],
            		names.arg=df[,1],
            		main=paste("Sample",sample,"with",length(unique(s_observed$ID)),"observed sequences\n(",length(unique(s_matches$query)),"sequences above",similarity_threshold*100,"% similarity)"),
            		xlab="Mismatches to expected sequences",
            		ylab="Number of sequences")
            	invisible(dev.off())

            	outfile <- paste0(prefix,sample,"_nucleotide-distance_barplot.png")
            	print(paste("write",outfile))
            	png(outfile, height = 400, width = 500)
            	barplot(df[,2],
            		names.arg=df[,1],
            		main=paste("Sample",sample,"with",length(unique(s_observed$ID)),"observed sequences\n(",length(unique(s_matches$query)),"sequences above",similarity_threshold*100,"% similarity)"),
            		xlab="Mismatches to expected sequences",
            		ylab="Number of sequences")
            	invisible(dev.off())

            	# write file
            	outfile <- paste0(prefix,sample,"_nucleotide-differences_per-sample.tsv")
            	print(paste("write",outfile))
            	write.table(df, file = outfile, row.names = FALSE, col.names = TRUE, quote = FALSE, na = '', sep="\t")
            }
      shell_command: |
        Rscript compare_sequences.R "$(inputs.alignment.path)" "$(inputs.observed.path)" "$(inputs.expabund.path)" "" "$(inputs.similarity.value)" "$(inputs.region.value)" > nucleotide-differences.log
  compare_expected_abundances:
    label: compare_expected_abundances
    doc: "EXPECTED_ABUNDANCES comparison - COMPARE_PERFORMANCE (bin/compare_performance.r verbatim) over the sequence-comparison matches table; fbeta 2 and mismatch threshold 0 fixed (source ext values / schema default, no interface input), merge mode from expected_sequences_merge. Guarded on BOTH expected inputs: the source fires this task only when the matches producer ran (expected_sequences) AND the expected-abundance channel is non-empty. The val_md5sum_version tag column is a constant here (pipeline_info artifacts dropped precedent)."
    when: $(inputs.expected_sequences) != null && $(inputs.expected_abundances) != null
    in:
      alignment: compare_expected_sequences/matches
      observed: asv_table_knot/data_param
      expabund: expected_abundances
      merge: expected_sequences_merge
    out:
      - id: performance
      - id: performance_per_sample
      - id: abundance_table_per_sample
      - id: svg
      - id: png
    run:
      class: GalaxyUserTool
      id: ampliseq_compare_performance
      version: 1.0.0
      name: Expected-vs-observed performance metrics (ampliseq)
      description: Per-sample absence/presence (precision, recall, F-beta, ...) and abundance-error metrics from the matches table
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy replica of the nf-core/ampliseq COMPARE_PERFORMANCE process (modules/local/compare_performance/main.nf) as invoked by subworkflows/local/comparison_wf/main.nf:47-51 on COMPARE_SEQUENCES.out.matches. The R script bin/compare_performance.r is embedded verbatim as a configfile. Arguments follow the module script block; fbeta=2 and mismatch_threshold=0 are the source values (conf/modules.config ext.fbeta = 2; ext.mismatch_threshold = params.expected_sequences_mismatches, schema default 0, and this draft has no interface input for mismatches - fixed, recorded). merge_mode maps to the expected_sequences_merge interface input (enum all|observed|expected|none, default all). The source fires this process only when the expected-abundance channel is non-empty (an empty path input never triggers the task); here the step carries a when guard over both expected inputs instead. Deviations: the first script argument tag is the source's val_md5sum_version (md5 of params + pipeline version) used only as a constant column in the tsv outputs - here it is a constant text input (pipeline_info artifacts dropped precedent); performance.log and Warnings.txt are not published (stderr stays in the job output); per-sample svgs and the boxplots are published as list collections."
      container: quay.io/biocontainers/r-base:4.2.1
      inputs:
        - name: alignment
          type: data
          format:
            - tabular
            - tsv
          label: Matches table with mismatch_final
          help: The nucleotide-differences.tsv emitted by ampliseq_compare_sequences (header included).
        - name: observed
          type: data
          format:
            - tabular
            - tsv
          label: Observed ASV count table
          help: ASV table keyed by sequence, first column then one column per sample.
        - name: expabund
          type: data
          format:
            - tabular
            - tsv
          optional: true
          label: Expected abundance table
          help: Expected-abundance tsv; required in practice (the step when-guard mirrors the source channel gating).
        - name: tag
          type: text
          label: Run tag column
          value: ampliseq
          help: Constant written to the tag column of the tsv outputs (source val_md5sum_version, dropped with pipeline_info).
        - name: merge
          type: text
          label: Merge mode
          value: all
          help: Aggregate matched observed/expected IDs before stats - all, observed, expected or none (params.expected_sequences_merge).
      outputs:
        - name: performance
          type: data
          format: tsv
          from_work_dir: performance_summary.tsv
          label: Performance summary (median/mean/min/max per metric)
        - name: performance_per_sample
          type: data
          format: tsv
          from_work_dir: performance_per-sample.tsv
          label: Per-sample performance metrics
        - name: abundance_table_per_sample
          type: data
          format: tsv
          from_work_dir: abundances_per-sample.tsv
          label: Per-sample merged expected/observed abundances
        - name: svg
          type: collection
          collection_type: list
          format: svg
          label: Abundance barplots, scatter and rank-abundance svgs (per sample + boxplot)
          discover_datasets:
            - discover_via: pattern
              pattern: "*.svg"
        - name: png
          type: collection
          collection_type: list
          format: png
          label: Performance boxplots (png)
          discover_datasets:
            - discover_via: pattern
              pattern: "*.png"
      configfiles:
        - filename: compare_performance.R
          content: |
            #!/usr/bin/env Rscript

            # compare_sequences.r

            # Get params and files from the command line
            args            <- commandArgs(trailingOnly=TRUE)
            tag             <- args[1] # tag for each sample
            alignmentFILE   <- args[2] # alignment file; expected columns: query, target, mismatches_final
            obsabundFILE    <- args[3] # observed abundance*
            expabundFILE    <- args[4] # expected abundance*
            fbeta           <- if (length(args) >= 5) as.numeric(args[5]) else 2 # Fbeta weight, default 2; 1=precision and recall equally weighted (=F1 score), 2=weighs recall higher than precision, 0.5=weighs recall lower than precision.
            mismatch_threshold <- if (length(args) >= 6) as.numeric(args[6]) else 0
            merge_mode      <- if (length(args) >= 7) args[7] else "none" # merge query=observed or target=expected IDs based on matches? Allowed: all,observed,expected,none
            # tab-separated file with header: first column with sequences name, following one or many columns (=samples) with numeric values (=abundance), only presence (>0)/absence are used here

            if( !merge_mode %in% c("all","observed","expected","none") ) {
            	stop( paste("ERROR -",merge_mode,"is not valid (valid: all,observed,expected,none)") )
            }

            # function to produce statistics
            get_stats <- function(i_exp,i_obs,df,sample) {
            	# if none are expected, skip!
            	if( length(i_exp)==0 ) {
            		print( paste("No expected seq in sample",sample, "- skipping") ); return(df)
            	} else {
            		print( paste(length(i_exp),"expected seq in sample",sample) )
            	}
            	# stats
            	TP <- intersect(i_exp, i_obs)
            	FN <- setdiff(i_exp, i_obs)
            	FP <- setdiff(i_obs, i_exp)
            	if ( length(TP) > 0 ) {
            		Fone <- ( 2 * length(TP)/length(i_obs) * length(TP)/length(i_exp) ) / ( length(TP)/length(i_obs) + length(TP)/length(i_exp) )
            		Fbeta <- ( (1+fbeta^2) * length(TP)/length(i_obs) * length(TP)/length(i_exp) ) / ( (fbeta^2) * length(TP)/length(i_obs) + length(TP)/length(i_exp) )
            	} else {
            		Fone <- 0
            		Fbeta <- 0
            	}
            	# save
            	types <- c(
            		"observed",
            		"expected",
            		"TP",
            		"FN",
            		"FP",
            		"recall",
            		"precision",
            		"F1",
            		"Fbeta",
            		"fdr",
            		"jaccard",
            		"TPs_exp",
            		"FNs_exp",
            		"FPs_obs"
                )
            	values <- c(
            		length(i_obs),
            		length(i_exp),
            		length(TP),
            		length(FN),
            		length(FP),
            		length(TP)/length(i_exp),
            		length(TP)/length(i_obs),
            		Fone,
            		Fbeta,
            		length(FP)/(length(i_obs)),
            		length(TP)/(length(i_obs)+length(FN)),
            		paste(head(TP, n=100), collapse=','),
            		paste(head(FN, n=100), collapse=','),
            		paste(head(FP, n=100), collapse=',')
            	)
            	# prepare output
            	ids <- rep(sample, length(types))
            	df_append <- data.frame(
            		sample=ids,
            		type= types,
            		value= values,
            		stringsAsFactors=FALSE)
            	df <- rbind( df, df_append )
            	return(df)
            }

            # function to produce distances based on complete abundance statistics (incl. FN & FP)
            get_stats_distances <- function(expected_abund,observed_abund,df,sample) {
            	if( length(expected_abund)==0 ) { return(df) }
            	# stats
            	jensen_shannon <- function(p, q) {
            		# KL divergence function (with pseudocount to handle zeros)
            		kl_div <- function(x, y, pseudocount = 1e-10) {
            			x <- x + pseudocount
            			y <- y + pseudocount
            			x <- x / sum(x)  # normalize
            			y <- y / sum(y)  # normalize
            			sum(x * log(x / y))
            		}
            		# Midpoint distribution
            		m <- (p + q) / 2
            		# Jensen-Shannon is the square root of the average of two KL divergences
            		sqrt(0.5 * kl_div(p, m) + 0.5 * kl_div(q, m))
            	}
            	# save
            	types <- c(
            		"bray-curtis",
            		"hellinger",
            		"jensen-shannon"
            	)
            	values <- c(
            		1 - (2 * sum(pmin(observed_abund, expected_abund))) / (sum(observed_abund) + sum(expected_abund)), # Bray-Curtis Dissimilarity
            		sqrt(sum((sqrt(observed_abund) - sqrt(expected_abund))^2)), # Hellinger Distance
            		jensen_shannon(observed_abund, expected_abund) # Jensen-Shannon Divergence
            	)
            	# prepare output
            	ids <- rep(sample, length(types))
            	df_append <- data.frame(
            		sample=ids,
            		type=types,
            		value=values,
            		stringsAsFactors=FALSE)
            	df <- rbind( df, df_append )
            	return(df)
            }

            # function to produce abundance statistics based on filtered abundance statistics (excl. FN & FP)
            get_stats_abundance <- function(expected_abund,observed_abund,df,sample) {
            	if( length(expected_abund)==0 ) { return(df) }
            	# stats
            	pearson_cor <- NA
            	spearman_rho <- NA
            	if (length(expected_abund)>2) {
            		pearson_cor <- cor.test(expected_abund, observed_abund, method = "pearson")
            		pearson_cor <- as.list(pearson_cor$estimate)[[1]]
            		spearman_rho <- cor.test(expected_abund, observed_abund, method = "spearman")
            		spearman_rho <- as.list(spearman_rho$estimate)[[1]]
            	}
            	percent_dev <- abs((observed_abund - expected_abund) / expected_abund) * 100
            	# save
            	types <- c(
            		"pearson_cor",
            		"spearman_rho",
            		"deviation",
            		"mae",
            		"rmse",
            		"ps"
            	)
            	values <- c(
            		pearson_cor, # Pearson's Correlation (cor)
            		spearman_rho, # Spearman's Rank Correlation (rho)
            		median(percent_dev, na.rm = TRUE), # Median Percent Abundance Deviation
            		mean(abs(observed_abund - expected_abund), na.rm = TRUE), # Mean Absolute Error (MAE)
            		sqrt(mean((observed_abund - expected_abund)^2, na.rm = TRUE)), # Root Mean Square Error (RMSE)
            		sum(pmin(observed_abund, expected_abund)) / sum(expected_abund) # Proportional Similarity (PS)
            	)
            	# prepare output
            	ids <- rep(sample, length(types))
            	df_append <- data.frame(
            		sample=ids,
            		type=types,
            		value=values,
            		stringsAsFactors=FALSE)
            	df <- rbind( df, df_append )
            	return(df)
            }

            # (A) PREPARE INPUT

            # Read sequence alignment table
            alignment = read.table( alignmentFILE, header = TRUE, sep = "\t", stringsAsFactors = FALSE, check.names = FALSE, strip.white = TRUE)
            alignment <- alignment[alignment$target !="*" & alignment$mismatch_final <= mismatch_threshold,]

            # Read pipeline's ASV abundance table (either from QIIME2 [skipping first line] or from previous steps)
            if (grepl("^# Constructed from biom file", readLines(obsabundFILE, n = 1))) {
            	observed = read.table( obsabundFILE, header = TRUE, sep = "\t", stringsAsFactors = FALSE, check.names = FALSE, strip.white = TRUE, comment.char = "", skip=1 )
            } else {
            	observed = read.table( obsabundFILE, header = TRUE, sep = "\t", stringsAsFactors = FALSE, check.names = FALSE, strip.white = TRUE, comment.char = "" )
            }
            colnames(observed)[1] <- "ID"

            # select available samples
            observed_samples <- colnames(observed)[2:ncol(observed)]
            print(paste( "Observed samples:", paste(observed_samples,collapse=",")))

            # Read expected abundance table
            if (grepl("^# Constructed from biom file", readLines(expabundFILE, n = 1))) {
            	exp = read.table( expabundFILE, header = TRUE, sep = "\t", stringsAsFactors = FALSE, check.names = FALSE, strip.white = TRUE, comment.char = "", skip=1 )
            } else {
            	exp = read.table( expabundFILE, header = TRUE, sep = "\t", stringsAsFactors = FALSE, check.names = FALSE, strip.white = TRUE, comment.char = "" )
            }
            colnames(exp)[1] <- "ID"
            # extract samples to analyse
            exp_samples <- colnames(exp)[2:ncol(exp)]
            print(paste( "Expected samples:", paste( exp_samples ,collapse=",")))
            SAMPLES <- exp_samples[exp_samples %in% observed_samples]
            print(paste( "Investigate samples:", paste( SAMPLES ,collapse=",")))

            # check if there are any samples to analyse
            if (length(SAMPLES) == 0) {
            	stop( paste0("ERROR - Found no samples to investigate. Observed samples (via sequencing data input): ", paste(observed_samples, collapse=","), ". Samples in ", expabundFILE, ": ", paste(exp_samples, collapse=",")) )
            }

            # (B) ANALYSE

            # Initialize dataframes
            df <- data.frame(
            	sample=character(),
            	type=character(),
            	value=character(),
            	stringsAsFactors=FALSE)
            abundances <- data.frame(
            	sample=character(),
            	ID=character(),
            	query=character(),
            	target=character(),
            	observed_abund=numeric(),
            	expected_abund=numeric(),
            	stringsAsFactors=FALSE)

            # for each sample
            for (sample in SAMPLES) {

            	# (1) FILTER - for presence/absence in that sample
            	# keep only non-empty columns and sample abundances
            	keep_cols <- c("ID",sample)
            	s_exp <- subset(exp, select = keep_cols)
            	s_obs <- subset(observed, select = keep_cols)
            	# keep only observed (abundance > 0)
            	s_exp = s_exp[s_exp[,2] > 0,]
            	s_obs = s_obs[s_obs[,2] > 0,]
            	# keep only alignments where both, query and target are present
            	s_alignment <- alignment[alignment$query %in% s_obs$ID & alignment$target %in% s_exp$ID,]
            	# make relative abundances
            	colnames(s_exp) <- c("ID","expected_abund")
            	colnames(s_obs) <- c("ID","observed_abund")
            	s_exp$expected_abund <- s_exp$expected_abund/sum(s_exp$expected_abund,na.rm=TRUE)
            	s_obs$observed_abund <- s_obs$observed_abund/sum(s_obs$observed_abund,na.rm=TRUE)
            	# merge data
            	s_alignment <- subset(s_alignment, select = c("query","target"))
            	merged <- merge(s_alignment, s_exp, by.x="target", by.y="ID", all=TRUE)
            	merged <- merge(merged, s_obs, by.x="query", by.y="ID", all=TRUE)
            	merged <- unique(merged)
            	# retain exp without query & obs without target
            	nomatch_exp <- merged[is.na(merged$query),]
            	nomatch_obs <- merged[is.na(merged$target),]

            	# (2) AGGREGATE - combine IDs and abundance if multiple query or targets match each other
            	# without any match there is nothing to aggregate, and aggregate() fails on zero rows
            	sample_merge_mode <- if ( any(!is.na(merged$query) & !is.na(merged$target)) ) merge_mode else "none"
            	if ( sample_merge_mode == "none" ) {
            		# dont aggregate anything
            		result <- merged[order(merged$query), ]
            		# add ID list
            		ID_list <- ifelse(is.na(result$target), result$query, ifelse(is.na(result$query), result$target, paste0(result$query,"-",result$target) ) )
            		result$ID <- factor(ID_list, levels = ID_list)
            	} else if ( sample_merge_mode == "observed" ) {
            		# (2a) AGGREGATE query
            		print("- Aggregating observed sequences -")
            		# aggregate query by target (obs without target is lost)
            		merged <- merged[order(merged$query), ]
            		merged_obs <- aggregate(query ~ target, merged, paste, collapse = "+")
            		merged_obs_abund <- aggregate(observed_abund ~ target, merged, sum)
            		result <- merge(merged_obs, merged_obs_abund, by="target", all=TRUE)
            		# add exp abundance
            		data_exp_abund <- subset(merged, select=c("target","expected_abund"))
            		data_exp_abund <- unique(data_exp_abund[!is.na(data_exp_abund$target),])
            		result <- merge(result, data_exp_abund, by="target", all=TRUE)
            		# re-add obs without target
            		result <- rbind(result, nomatch_obs)
            		# add ID list
            		ID_list <- ifelse(is.na(result$target), result$query, ifelse(is.na(result$query), result$target, paste0(result$query,"-",result$target) ) )
            		result$ID <- factor(ID_list, levels = ID_list)
            	} else if ( sample_merge_mode == "expected" ) {
            		# (2b) AGGREGATE target
            		print("- Aggregating expected sequences -")
            		# aggregate target by query (exp without query is lost)
            		merged <- merged[order(merged$target), ]
            		merged_exp <- aggregate(target ~ query, merged, paste, collapse = "+")
            		merged_exp_abund <- aggregate(expected_abund ~ query, merged, sum)
            		data_exp <- merge(merged_exp, merged_exp_abund, by.x="query", by.y="query", all=TRUE)
            		result <- unique( merge(data_exp, s_obs, by.x="query", by.y="ID", all=TRUE) )
            		# re-add exp without query
            		result <- rbind(result, nomatch_exp)
            		print(result)
            		# add ID list
            		ID_list <- ifelse(is.na(result$target), result$query, ifelse(is.na(result$query), result$target, paste0(result$query,"-",result$target) ) )
            		result$ID <- factor(ID_list, levels = ID_list)
            	} else if ( sample_merge_mode == "all" ) {
            		# (2c) AGGREGATE ALL
            		print("- Aggregating all sequences -")
            		# aggregate target by query (exp without query is lost)
            		merged <- merged[order(merged$target), ]
            		merged_exp <- aggregate(target ~ query, merged, paste, collapse = "+")
            		merged_exp_abund <- aggregate(expected_abund ~ query, merged, sum)
            		data_exp <- merge(merged_exp, merged_exp_abund, by.x="query", by.y="query", all=TRUE)
            		data_exp <- unique( merge(data_exp, s_obs, by.x="query", by.y="ID", all=TRUE) )
            		# aggregate query by target (obs without target is lost)
            		data_exp <- data_exp[order(data_exp$query), ]
            		merged_obs <- aggregate(query ~ target, data_exp, paste, collapse = "+")
            		merged_obs_abund <- aggregate(observed_abund ~ target, data_exp, sum)
            		result <- merge(merged_obs, merged_obs_abund, by="target", all=TRUE)
            		# add exp abundance
            		data_exp_abund <- subset(data_exp, select=c("target","expected_abund"))
            		data_exp_abund <- unique(data_exp_abund[!is.na(data_exp_abund$target),])
            		result <- merge(result, data_exp_abund, by="target", all=TRUE)
            		# re-add exp without query & obs without target
            		result <- rbind(result, nomatch_obs)
            		result <- rbind(result, nomatch_exp)
            		# add ID list
            		ID_list <- ifelse(is.na(result$target), result$query, result$target)
            		result$ID <- factor(ID_list, levels = ID_list)
            	}
            	result$expected_abund[is.na(result$expected_abund)] <- 0
            	result$observed_abund[is.na(result$observed_abund)] <- 0
            	# Sort by expected abundance
            	result <- result[order(result$expected_abund, decreasing = TRUE), ]
            	# append sample data to table
            	result$sample <- rep(sample, nrow(result))
            	result <- result[, c("sample", "ID", "query", "target", "observed_abund", "expected_abund")]
            	abundances <- rbind( abundances, result )
            	if ( nrow(result) == 0 ) {
            		print(paste("WARN - Skipping sample",sample,"because it has no expected and no observed sequences"))
            		next
            	}

            	# (3) STATISTICS

            	# calculate absence/presence stats
            	expIDs <- result$ID[!is.na(result$target)]
            	obsIDs <- result$ID[!is.na(result$query)]
            	df <- get_stats( expIDs, obsIDs, df, sample)

            	# Calculate distance metrics, this *includes* non-matching sequences (FP & FN)
            	df <- get_stats_distances( result$expected_abund, result$observed_abund, df, sample)

            	# Calculate relationship and abundance error, this *excludes* non-matching sequences (FP & FN)
            	data_matches <- result[result$observed_abund >0 & result$expected_abund >0,] # only on matched observed to expected
            	df <- get_stats_abundance( data_matches$expected_abund, data_matches$observed_abund, df, sample)

            	# (4) PLOTS - pairwise comparisons

            	# Side-by-Side Bar Plots
            	outfile <- paste0(sample,"_abundance_barplot.svg")
            	print(paste("write",outfile))
            	svg(outfile, height = 8, width = 10)
            	barplot(
            		rbind(result$expected_abund, result$observed_abund),
            		beside = TRUE,
            		names.arg = result$ID,
            		col = c("skyblue", "salmon"),
            		legend.text = c("Expected", "Observed"),
            		ylab = "Abundance",
            		xlab = "Taxon",
            		main = "Side-by-Side Bar Plot: Expected vs. Observed Abundance",
            		cex.names = 0.7,
            		las = 2
            	)
            	invisible(dev.off())

            	# Scatter plot: Observed vs. Expected Abundance (log-log)
            	outfile <- paste0(sample,"_scatter_loglog")
            	print(paste("write",outfile))
            	svg(paste0(outfile,".svg"), width = 8, height = 6)
            	if ( nrow(data_matches) > 0 ) {
            		plot(
            			log10(data_matches$expected_abund),
            			log10(data_matches$observed_abund),
            			xlab = "log10(Expected Abundance)",
            			ylab = "log10(Observed Abundance)",
            			main = "Scatter Plot: Observed vs. Expected Abundance (log-log)",
            			pch = 19,
            			col = "blue"
            		)
            		abline(a = 0, b = 1, col = "red", lty = 2)
            	} else {
            		plot.new()
            		title(main = "Scatter Plot: Observed vs. Expected Abundance (log-log)")
            		text(0.5, 0.5, "No observed sequence matches an expected sequence")
            	}
            	invisible(dev.off())

            	# Rank Abundance Curves
            	outfile <- paste0(sample,"_rank_abundance_curve")
            	print(paste("write",outfile))
            	svg(paste0(outfile,".svg"), width = 8, height = 6)
            	plot(
            		1:nrow(result),
            		sort(result$expected_abund, decreasing = TRUE),
            		type = "l",
            		col = "blue",
            		lwd = 2,
            		xlab = "Rank",
            		ylab = "Abundance",
            		main = "Rank Abundance Curves",
            		ylim = c(0, max(result$expected_abund, result$observed_abund))
            	)
            	lines(
            		1:nrow(result),
            		sort(result$observed_abund, decreasing = TRUE),
            		col = "red",
            		lwd = 2
            	)
            	legend(
            		"topright",
            		legend = c("Expected", "Observed"),
            		col = c("blue", "red"),
            		lwd = 2
            	)
            	invisible(dev.off())
            }

            # (5) TABLES - metrics overall

            # write table
            outfile <- "abundances_per-sample.tsv"
            abundances$tag <- rep(tag, nrow(abundances))
            print(paste("write",outfile))
            write.table(abundances, file = outfile, row.names = FALSE, col.names = TRUE, quote = FALSE, na = '', sep="\t")

            # Write detailed output
            outfile <- "performance_per-sample.tsv"
            df$tag <- rep(tag, nrow(df))
            print(paste("write",outfile))
            write.table(df, file = outfile, row.names = FALSE, col.names = TRUE, quote = FALSE, na = '', sep="\t")
            # Make & write summary output
            outfile <- "performance_summary.tsv"
            df_sum <- data.frame(type=character(), median=numeric(), mean=numeric(), min=numeric(), max=numeric(), count=numeric(), stringsAsFactors=FALSE)
            print("Warnings are expected at that point:")
            for (type in unique(df$type)) {
            	df_subset <- df[df$type == type, ]
            	MEDIAN <- median( as.numeric(df_subset$value) )
            	MEAN <- mean( as.numeric(df_subset$value) )
            	MIN <- min( as.numeric(df_subset$value) )
            	MAX <- max( as.numeric(df_subset$value) )
            	COUNT <- length( as.numeric(df_subset$value) )
            	df_sum[nrow(df_sum) + 1,] <- list(type, MEDIAN, MEAN, MIN, MAX, COUNT)
            }
            df_sum$tag <- rep(tag, nrow(df_sum))
            print(paste("write",outfile))
            write.table(df_sum, file = outfile, row.names = FALSE, col.names = TRUE, quote = FALSE, na = '', sep="\t")

            # (6) PLOT - selected metrics, overall
            boxplot_type <- c("recall","precision","F1","Fbeta","fdr","jaccard","bray-curtis","hellinger","jensen-shannon","pearson_cor","spearman_rho","mae","rmse","ps")
            df_subset <- subset(df, type %in% boxplot_type)
            df_subset$type <- factor(df_subset$type, levels = boxplot_type)
            df_subset$value <- as.numeric(df_subset$value)
            outfile <- "performance_boxplot.svg"
            print(paste("write",outfile))
            svg(outfile, height = 8, width = 12)
            par(mar=c(8, 4, 4, 2))
            boxplot(value~type, data=df_subset, xlab="Type", ylab="Value", ylim = c(0, 1), las=2)
            invisible(dev.off())
            outfile <- "performance_boxplot.png"
            print(paste("write",outfile))
            png(outfile, height = 400, width = 600)
            par(mar=c(8, 4, 4, 2)) #First value (8): Bottom margin (increase this if labels are still cut off); Second value (4): Left margin; Third value (4): Top margin; Fourth value (2): Right margin
            boxplot(value~type, data=df_subset, xlab="Type", ylab="Value", ylim = c(0, 1), las=2)
            invisible(dev.off())
      shell_command: |
        Rscript compare_performance.R "$(inputs.tag.value)" "$(inputs.alignment.path)" "$(inputs.observed.path)" "$(inputs.expabund.path)" 2 0 "$(inputs.merge.value)" > performance.log
  compare_expected_profile:
    label: compare_expected_profile
    doc: EXPECTED_PROFILE comparison - COMPARE_PROFILE (bin/compare_profile.r verbatim, ext.mode=level and ext.fbeta=2 from conf/modules.config:1322-1324) of the expected profile against the taxonomy-derived observed profile. The source supplies an observed profile only on the run_qiime2 && !skip_abundance_tables branch (QIIME2_EXPORT rel_tax max-level slice); here the main-path tax_table_knot + asv_table_knot build it (shape adjudication shared with import_taxonomy; tool help carries the adaptation). A null knot - no classifier ran - leaves the required input unsatisfied and Galaxy skips the step, like the source's empty channel.
    when: $(inputs.expected_profile) != null
    in:
      tax: tax_table_knot/data_param
      table: asv_table_knot/data_param
      expected: expected_profile
    out:
      - id: performance
      - id: performance_per_sample
      - id: svg
      - id: png
    run:
      class: GalaxyUserTool
      id: ampliseq_compare_profile
      version: 1.0.0
      name: Observed-vs-expected taxonomic profile comparison (ampliseq)
      description: Per-level profile classification/distance/correlation metrics comparing the pipeline taxonomy profile to an expected profile
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy replica of the nf-core/ampliseq COMPARE_PROFILE process (modules/local/compare_profile/main.nf, r-base:4.2.1 container pin matched) as invoked by subworkflows/local/comparison_wf/main.nf:54-59 with ext.mode=level and ext.fbeta=2 (conf/modules.config:1322-1324). bin/compare_profile.r is embedded verbatim; the profile summary/per-sample tsv and the lineplot svg/png are published, profile.log is not (stderr stays in the job output; log/warnings dropped precedent). The source's observed input is the max-level QIIME2_EXPORT rel-table-<level>.tsv, which the source only produces on the run_qiime2 && !skip_abundance_tables input branch - on the main branch the channel is empty and this process never runs. This v1 realization instead derives the observed profile from the main-path taxonomy and abundance tables (tax_table_knot + asv_table_knot, the template's wiring): the import_taxonomy-identical shape adjudication (adjudicate.py + verbatim bin/parse_dada2_taxonomy.r, or header-strip/passthrough) normalizes the knot table to sequence+lineage, and build_profile.R joins it to the abundance table and aggregates raw abundances per lineage string. Lineage labels are trimmed and rejoined with '; ' to match the QIIME2 rel_tax style the source's expected files are written against; passing full-depth lineage is equivalent-or-better than the source's max-level slice because compare_profile.r evaluates every level 1..max_lev from the lineage strings either way. ASVs without a taxonomy row are skipped with a warning (a null knot - no classifier ran - leaves the required tax input unsatisfied and Galaxy skips the step, the import_taxonomy precedent, mirroring the source's absent-observed-channel behavior). fbeta=2 and mode=level are fixed shell literals (source ext values, no interface params); the tag column is a constant (val_md5sum_version dropped with pipeline_info, precedent)."
      container: quay.io/biocontainers/r-base:4.2.1
      inputs:
        - name: tax
          type: data
          format:
            - tabular
            - tsv
            - txt
          label: ASV taxonomy table (branch knot)
          help: The one taxonomy table chosen by tax_table_knot (wide ASV_ID+ranks, Feature ID/Taxon, or headerless two-column).
        - name: table
          type: data
          format:
            - tabular
            - tsv
          label: ASV count table
          help: Abundance table keyed by ASV sequence (asv_table_knot), first column then one column per sample.
        - name: expected
          type: data
          format:
            - tabular
            - tsv
          label: Expected taxonomic profile
          help: Expected profile tsv (taxon lineage in column one, one abundance column per sample; params.expected_profile).
        - name: tag
          type: text
          label: Run tag column
          value: ampliseq
          help: Constant written to the tag column of the tsv outputs (source val_md5sum_version, dropped with pipeline_info).
      outputs:
        - name: performance
          type: data
          format: tsv
          from_work_dir: profile_summary.tsv
          label: Profile summary per level and metric
        - name: performance_per_sample
          type: data
          format: tsv
          from_work_dir: profile_per-sample.tsv
          label: Per-sample per-level profile metrics
        - name: svg
          type: data
          format: svg
          from_work_dir: profile_lineplot.svg
          label: Profile metrics lineplot (svg)
        - name: png
          type: data
          format: png
          from_work_dir: profile_lineplot.png
          label: Profile metrics lineplot (png)
      configfiles:
        - filename: adjudicate.py
          content: |
            #!/usr/bin/env python3
            # Decide which QIIME2_INTAX pre-processing path the knot-carried table needs.
            import sys

            with open(sys.argv[1]) as fh:
                first = fh.readline().rstrip("\n").split("\t")
                second = fh.readline()

            if first and first[0] == "ASV_ID":
                mode = "parse"                 # wide table: source parse_dada2_taxonomy.r path
            elif len(first) == 2 and first[1] == "Taxon":
                mode = "strip_header"          # raw QIIME2 export: Feature ID<TAB>Taxon
            elif len(first) >= 2 and second and len(second.rstrip("\n").split("\t")) == len(first):
                # headerless two-column (SIDLE filttax): first row is data, not header
                mode = "passthrough"
            else:
                mode = "parse"
            print(mode)
        - filename: parse_dada2_taxonomy.r
          content: |
            #!/usr/bin/env Rscript

            args = commandArgs(trailingOnly=TRUE)

            if(length(args) != 1){
                stop("Usage: parse_dada2_taxonomy.r <ASV_tax_species.tsv>")
            }

            tax_file <- args[1]

            OUT="tax.tsv"

            # read required files
            # Read as character throughout: a rank that is empty for every ASV is otherwise typed logical and
            # renders as the literal string "NA" in the taxonomy below. Emptying na.strings keeps an empty
            # field empty instead of turning it into NA again.
            tax = read.table(tax_file, header = TRUE, sep = "\t", stringsAsFactors = FALSE, comment.char = '', quote = '', colClasses = "character", na.strings = character(0))

            # Join the taxonomy rank columns only, excluding known non-rank columns. Matched by suffix
            # pattern where possible ("_confidence", "_exact") rather than by literal name, so a future
            # added metadata column doesn't silently leak into the taxonomy string as a bogus extra rank.
            # SH and BOLD_bin are sequence-cluster identifiers rather than ranks, although databases declare
            # them in taxlevels: joined in, they become a spurious extra level in every rank-collapsed
            # QIIME2 output.
            non_rank_cols <- colnames(tax) %in% c('ASV_ID', 'sequence', 'confidence', 'classifier', 'database', 'SH', 'BOLD_bin') |
                grepl('_confidence$|_exact$', colnames(tax))
            r <- colnames(tax)[!non_rank_cols]
            tax$taxonomy <- do.call(paste, c(tax[r], sep = ';'))

            #write
            print (paste("write",OUT))
            write.table(tax[,c('ASV_ID', 'taxonomy')], file = OUT, quote=FALSE, col.names=FALSE, row.names=FALSE, sep="\t")
        - filename: build_profile.R
          content: |
            #!/usr/bin/env Rscript
            # Build the observed taxonomic profile table (taxon x sample) that the source's
            # QIIME2_EXPORT rel_tax / rel-table-<level>.tsv supplies on its QIIME2-input branch.
            # tax.tsv is the normalized two-column table (ASV sequence, lineage string) produced by
            # the import_taxonomy-identical adjudication; the abundance table is keyed by ASV sequence.
            # Lineage labels are trimmed and rejoined with "; " to match the QIIME2 rel_tax style the
            # source compares against (its observed side is a QIIME2-exported rel-table).
            args <- commandArgs(trailingOnly = TRUE)
            tax <- read.table(args[1], sep = "\t", header = FALSE, stringsAsFactors = FALSE, quote = "", comment.char = "")
            abund <- read.table(args[2], sep = "\t", header = TRUE, stringsAsFactors = FALSE, check.names = FALSE, comment.char = "", quote = "")
            for (i in 2:ncol(abund)) { abund[[i]] <- suppressWarnings(as.numeric(abund[[i]])) }
            abund[[1]] <- as.character(abund[[1]])
            colnames(abund)[1] <- "ID"

            lineage <- vapply(tax$V2, function(x) paste(trimws(strsplit(x, ";")[[1]]), collapse = "; "), character(1))
            names(lineage) <- tax$V1

            keep <- abund$ID %in% names(lineage)
            if (!all(keep)) {
            	print(paste("WARN -", sum(!keep), "observed sequences have no taxonomy entry and are omitted from the profile:", paste(abund$ID[!keep], collapse = ",")))
            }
            d <- abund[keep, ]
            lab <- lineage[d$ID]

            m <- as.matrix(d[, -1, drop = FALSE])
            storage.mode(m) <- "numeric"
            rs <- rowsum(m, factor(lab))
            out <- data.frame(taxon = rownames(rs), rs, check.names = FALSE)
            write.table(out, "observed_profile.tsv", sep = "\t", quote = FALSE, row.names = FALSE, na = "")
        - filename: compare_profile.r
          content: |
            #!/usr/bin/env Rscript

            # Get params and files from the command line
            args <- commandArgs(trailingOnly=TRUE)
            if (length(args) < 3) {
            	stop("Usage: Rscript compare_profile.r <tag> <obsFILE> <expFILE> [fbeta_val] [mode]")
            }
            tag <- args[1] # tag for each sample
            obsFILE <- args[2] # observed abundance*, e.g. "abs-abund-table-3.tsv"
            expFILE <- args[3] # expected abundance*, e.g. "expected_taxonomy.tsv"
            fbeta_val <- if (length(args) >= 4) as.numeric(args[4]) else 2 # Fbeta weight, default 2; 1=precision and recall equally weighted (=F1 score), 2=weighs recall higher than precision, 0.5=weighs recall lower than precision.
            mode <- if (length(args) >= 5) args[5] else "complete" # mode: "complete" for full taxonomic string, "level" for only the label at the given level

            # Args check
            if (!(mode %in% c("complete", "level"))) {
            	stop(paste("Invalid mode:", mode, ". Must be either 'complete' or 'level'."))
            }

            # Load data frames from TSV files - with potential biom header
            print(paste("Loading observed taxonomies from",obsFILE))
            if (grepl("^# Constructed from biom file", readLines(obsFILE, n = 1))) {
            	observed_taxonomy <- read.table(obsFILE, header = TRUE, sep = "\t", skip = 1, comment.char = "", check.names = FALSE)
            } else {
            	observed_taxonomy <- read.table(obsFILE, header = TRUE, sep = "\t", skip = 0, comment.char = "", check.names = FALSE)
            }
            print(paste("Loading expected taxonomies from",expFILE))
            if (grepl("^# Constructed from biom file", readLines(expFILE, n = 1))) {
            	expected_taxonomy <- read.table(expFILE, header = TRUE, sep = "\t", skip = 1, comment.char = "", check.names = FALSE)
            } else {
            	expected_taxonomy <- read.table(expFILE, header = TRUE, sep = "\t", skip = 0, comment.char = "", check.names = FALSE)
            }

            # Determine common samples
            common_samples <- intersect(colnames(observed_taxonomy)[-1], colnames(expected_taxonomy)[-1])
            if (length(common_samples) == 0) {
            	stop("ERROR: No common samples found between observed and expected taxonomy files.")
            }
            print(paste("Processing", length(common_samples), "common samples:",paste(common_samples,collapse=",")))

            # Function to get taxonomic levels based on mode (e.g., complete: L1: x1, L2: x1;x2; level: L1: x1, L2: x2)
            get_taxa_by_mode <- function(taxa_vec, level, mode) {
            	s <- strsplit(as.character(taxa_vec), ";")
            	sapply(s, function(x) {
            		if (length(x) >= level && !is.na(x[level]) && x[level] != "") {
            			if (mode == "complete") {
            				if (all(x[1:level] != "" & !is.na(x[1:level]))) {
            					return(paste(x[1:level], collapse = ";"))
            				}
            			} else if (mode == "level") {
            				return(x[level])
            			}
            		}
            		NA
            	})
            }

            # Function for classification metrics
            calculate_classification_metrics <- function(tp, fp, fn, fbeta_val) {
            	recall <- if ((tp + fn) > 0) tp / (tp + fn) else NA
            	precision <- if ((tp + fp) > 0) tp / (tp + fp) else NA
            	f1 <- if (!is.na(precision) && !is.na(recall) && (precision + recall) > 0) 2 * (precision * recall) / (precision + recall) else NA
            	fbeta_res <- if (!is.na(precision) && !is.na(recall) && (fbeta_val^2 * precision + recall) > 0) (1 + fbeta_val^2) * precision * recall / (fbeta_val^2 * precision + recall) else NA
            	fdr <- if ((tp + fp) > 0) fp / (tp + fp) else NA
            	jaccard <- if ((tp + fp + fn) > 0) tp / (tp + fp + fn) else NA
            	return(list(recall=recall, precision=precision, f1=f1, fbeta=fbeta_res, fdr=fdr, jaccard=jaccard))
            }

            # Function for correlation metrics
            calculate_correlation_metrics <- function(tp_set, obs_taxa_all_lev, exp_taxa_all_lev, obs_vec, exp_vec) {
            	p_cor <- NA
            	s_rho <- NA
            	if (length(tp_set) > 1) {
            		obs_aggregated <- tapply(obs_vec, obs_taxa_all_lev, sum, na.rm=TRUE)
            		exp_aggregated <- tapply(exp_vec, exp_taxa_all_lev, sum, na.rm=TRUE)
            		obs_vals <- obs_aggregated[tp_set]
            		exp_vals <- exp_aggregated[tp_set]
            		if (sd(obs_vals, na.rm=TRUE) > 0 && sd(exp_vals, na.rm=TRUE) > 0) {
            			p_cor <- cor(obs_vals, exp_vals, method = "pearson")
            			s_rho <- cor(obs_vals, exp_vals, method = "spearman")
            		}
            	}
            	return(list(pearson_cor=p_cor, spearman_rho=s_rho))
            }

            # Function for distance metrics
            calculate_distance_metrics <- function(obs_taxa_at_lev, exp_taxa_at_lev, obs_taxa_all_lev, obs_vec, exp_vec) {
            	all_taxa <- union(obs_taxa_at_lev, exp_taxa_at_lev)
            	res <- list(bray_curtis=NA, hellinger=NA, jensen_shannon=NA, deviation=NA, mae=NA, rmse=NA, ps=NA)

            	if (length(all_taxa) > 0) {
            		obs_all_vals <- tapply(obs_vec, obs_taxa_all_lev, sum, na.rm=TRUE)[all_taxa]
            		exp_all_vals <- tapply(exp_vec, exp_taxa_all_lev, sum, na.rm=TRUE)[all_taxa]
            		obs_all_vals[is.na(obs_all_vals)] <- 0
            		exp_all_vals[is.na(exp_all_vals)] <- 0

            		sum_obs <- sum(obs_all_vals)
            		sum_exp <- sum(exp_all_vals)

            		if (sum_obs > 0 && sum_exp > 0) {
            			obs_rel <- obs_all_vals / sum_obs
            			exp_rel <- exp_all_vals / sum_exp

            			res$bray_curtis <- sum(abs(obs_rel - exp_rel)) / 2
            			res$hellinger <- sqrt(sum((sqrt(obs_rel) - sqrt(exp_rel))^2))

            			kl_div <- function(x, y, pseudocount = 1e-10) {
            				x <- x + pseudocount
            				y <- y + pseudocount
            				x <- x / sum(x)
            				y <- y / sum(y)
            				sum(x * log(x / y))
            			}
            			m <- 0.5 * (obs_rel + exp_rel)
            			res$jensen_shannon <- sqrt(0.5 * kl_div(obs_rel, m) + 0.5 * kl_div(exp_rel, m))

            			res$ps <- sum(pmin(obs_rel, exp_rel)) / sum(exp_rel)

            			valid_exp_rel <- exp_rel > 0
            			if (any(valid_exp_rel)) {
            				perc_dev <- abs((obs_rel[valid_exp_rel] - exp_rel[valid_exp_rel]) / exp_rel[valid_exp_rel]) * 100
            				res$deviation <- median(perc_dev, na.rm = TRUE)
            			}
            			res$mae <- mean(abs(obs_rel - exp_rel))
            			res$rmse <- sqrt(mean((obs_rel - exp_rel)^2))
            		}
            	}
            	return(res)
            }

            # Determine max taxonomic depth across both files
            max_obs_lev <- max(sapply(strsplit(as.character(observed_taxonomy[, 1]), ";"), length))
            max_exp_lev <- max(sapply(strsplit(as.character(expected_taxonomy[, 1]), ";"), length))
            max_lev <- max(max_obs_lev, max_exp_lev)
            print(paste("Processing", max_lev, "taxonomic levels"))

            # Use a list to store results
            results_list <- list()
            res_counter <- 1

            for (s in common_samples) {
            	idx_obs <- which(colnames(observed_taxonomy) == s)
            	idx_exp <- which(colnames(expected_taxonomy) == s)

            	for (l in 1:max_lev) {
            		level_name <- paste0("L", l)

            		# Taxon strings for this level for all entries based on the specified mode
            		obs_taxa_all_lev <- get_taxa_by_mode(observed_taxonomy[, 1], l, mode)
            		exp_taxa_all_lev <- get_taxa_by_mode(expected_taxonomy[, 1], l, mode)

            		# Observed taxa present in this sample at this level
            		obs_taxa_at_lev <- unique(obs_taxa_all_lev[observed_taxonomy[, idx_obs] > 0])
            		obs_taxa_at_lev <- obs_taxa_at_lev[!is.na(obs_taxa_at_lev) & obs_taxa_at_lev != ""]

            		# Expected taxa present in this sample at this level
            		exp_taxa_at_lev <- unique(exp_taxa_all_lev[expected_taxonomy[, idx_exp] > 0])
            		exp_taxa_at_lev <- exp_taxa_at_lev[!is.na(exp_taxa_at_lev) & exp_taxa_at_lev != ""]

            		# Calculate sets
            		tp_set <- intersect(obs_taxa_at_lev, exp_taxa_at_lev)
            		fp_set <- setdiff(obs_taxa_at_lev, exp_taxa_at_lev)
            		fn_set <- setdiff(exp_taxa_at_lev, obs_taxa_at_lev)

            		# Calculate counts
            		tp <- length(tp_set)
            		fp <- length(fp_set)
            		fn <- length(fn_set)
            		exp_count <- length(exp_taxa_at_lev)
            		obs_count <- length(obs_taxa_at_lev)

            		# Classification metrics - based on counts
            		metrics_class <- calculate_classification_metrics(tp, fp, fn, fbeta_val)

            		# Correlation calculations
            		metrics_corr <- calculate_correlation_metrics(tp_set, obs_taxa_all_lev, exp_taxa_all_lev, observed_taxonomy[, idx_obs], expected_taxonomy[, idx_exp])

            		# Distance and Error metrics
            		metrics_dist <- calculate_distance_metrics(obs_taxa_at_lev, exp_taxa_at_lev, obs_taxa_all_lev, observed_taxonomy[, idx_obs], expected_taxonomy[, idx_exp])

            		# Sequence of metrics as requested
            		metrics_seq <- list(
            			list(type = "exp", value = exp_count),
            			list(type = "obs", value = obs_count),
            			list(type = "TP",	value = tp),
            			list(type = "FN",	value = fn),
            			list(type = "FP",	value = fp),
            			list(type = "recall", value = metrics_class$recall),
            			list(type = "precision", value = metrics_class$precision),
            			list(type = "F1", value = metrics_class$f1),
            			list(type = "Fbeta", value = metrics_class$fbeta),
            			list(type = "fdr", value = metrics_class$fdr),
            			list(type = "jaccard", value = metrics_class$jaccard),
            			list(type = "TPs_exp", value = paste(head(tp_set, 100), collapse = ",")),
            			list(type = "FNs_exp", value = paste(head(fn_set, 100), collapse = ",")),
            			list(type = "FPs_obs", value = paste(head(fp_set, 100), collapse = ",")),
            			list(type = "bray-curtis", value = metrics_dist$bray_curtis),
            			list(type = "hellinger", value = metrics_dist$hellinger),
            			list(type = "jensen-shannon", value = metrics_dist$jensen_shannon),
            			list(type = "pearson_cor", value = metrics_corr$pearson_cor),
            			list(type = "spearman_rho", value = metrics_corr$spearman_rho),
            			list(type = "deviation", value = metrics_dist$deviation),
            			list(type = "mae", value = metrics_dist$mae),
            			list(type = "rmse", value = metrics_dist$rmse),
            			list(type = "ps", value = metrics_dist$ps)
            		)
            			for (m in metrics_seq) {
            			results_list[[res_counter]] <- data.frame(
            				sample = s,
            				level = level_name,
            				type = m$type,
            				value = as.character(m$value),
            				stringsAsFactors = FALSE
            			)
            			res_counter <- res_counter + 1
            		}
            	}
            }

            # Write detailed output
            results <- do.call(rbind, results_list)
            results$tag <- rep(tag, nrow(results))
            outfile <- "profile_per-sample.tsv"
            print(paste("Writing detailed output to:", outfile))
            write.table(results, outfile, sep = "\t", row.names = FALSE, quote = FALSE)

            # SUMMARY TABLE
            outfile <- "profile_summary.tsv"
            print(paste("Writing summary table to:", outfile))
            df_sum <- data.frame(level=character(), type=character(), median=numeric(), mean=numeric(), standard_error=numeric(), min=numeric(), max=numeric(), count=numeric(), stringsAsFactors=FALSE)

            # Convert values to numeric for summary
            results_num <- results
            results_num$value <- as.numeric(results_num$value)

            for (lev in unique(results_num$level)) {
            	for (type in unique(results_num$type)) {
            		if (type %in% c("TPs_exp","FNs_exp","FPs_obs")) next #exclude non-helpful entries
            		df_subset <- results_num[results_num$level == lev & results_num$type == type, ]
            		if (nrow(df_subset) == 0) next
            		COUNT <- sum( !is.na(df_subset$value) ) # counts all non-na values
            		MEDIAN <- median( df_subset$value, na.rm = TRUE )
            		MEAN <- mean( df_subset$value, na.rm = TRUE )
            		SE <- sd( df_subset$value, na.rm = TRUE ) / sqrt(length(df_subset$value))
            		MIN <- ifelse(COUNT==0, NA, min( df_subset$value, na.rm = TRUE ) ) # avoid -Inf when there are no values
            		MAX <- ifelse(COUNT==0, NA, max( df_subset$value, na.rm = TRUE ) ) # avoid Inf when there are no values
            		df_sum[nrow(df_sum) + 1,] <- list(lev, type, MEDIAN, MEAN, SE, MIN, MAX, COUNT)
            	}
            }
            df_sum$tag <- rep(tag, nrow(df_sum))
            write.table(df_sum, outfile, sep = "\t", row.names = FALSE, quote = FALSE)

            # LINE PLOT PER LEVEL
            plot_metrics <- c("F1", "recall", "precision")
            metric_colors <- c("F1" = "black", "recall" = "red", "precision" = "blue")

            all_levels <- unique(df_sum$level)
            levels_num <- 1:length(all_levels)

            draw_line_plot <- function() {
            	plot(NULL, xlim = c(1, length(all_levels)), ylim = c(0, 1),
            		xaxt = "n", xlab = "Level", ylab = "Median",
            		main = "Profile Summary Metrics")
            	axis(1, at = levels_num, labels = all_levels)

            	for (m in plot_metrics) {
            		subset_df <- subset(df_sum, type == m)
            		if (nrow(subset_df) > 0) {
            			y <- subset_df$median # alternative: subset_df$mean
            			se <- subset_df$standard_error
            			x <- 1:nrow(subset_df)
            			lines(x, y, col = metric_colors[m], lwd = 2, type = "b", pch = 19)
            			segments(x, y - se, x, y + se, col = metric_colors[m])
            		}
            	}
            	legend("bottomleft", legend = names(metric_colors), col = metric_colors, lty = 1, pch = 19, lwd = 2)
            }

            # Plot SVG
            outfile_svg <- "profile_lineplot.svg"
            print(paste("Writing lineplot SVG to:", outfile_svg))
            svg(outfile_svg, height = 8, width = 12)
            draw_line_plot()
            invisible(dev.off())

            # Plot PNG
            outfile_png <- "profile_lineplot.png"
            print(paste("Writing lineplot PNG to:", outfile_png))
            png(outfile_png, height = 400, width = 600)
            draw_line_plot()
            invisible(dev.off())
      shell_command: |
        MODE="$(python3 adjudicate.py $(inputs.tax.path))";
        echo "input taxonomy shape: $MODE" >&2;
        if [ "$MODE" = "strip_header" ]; then
          tail -n +2 "$(inputs.tax.path)" > tax.tsv
        elif [ "$MODE" = "passthrough" ]; then
          cp "$(inputs.tax.path)" tax.tsv
        else
          Rscript parse_dada2_taxonomy.r "$(inputs.tax.path)"
        fi;
        Rscript build_profile.R tax.tsv "$(inputs.table.path)";
        Rscript compare_profile.r "$(inputs.tag.value)" observed_profile.tsv "$(inputs.expected.path)" 2 level > profile.log
  summary_counts:
    label: summary_counts
    doc: SUMMARY_TABLE_COUNTS - long-format counts checkpoint (asv_id, sample, count > 0, gzipped tsv; module R body and wave container verbatim; first column renamed positionally - the draft's tables are keyed by sequence with non-standardized headers, the source renamed the literal ASV_ID header).
    when: "!$(inputs.skip_abundance_tables)"
    in:
      table: asv_table_knot/data_param
    out:
      - id: tsv
    run:
      class: GalaxyUserTool
      id: ampliseq_summary_counts
      version: 1.0.0
      name: Long-format counts summarizer (ampliseq)
      description: Melt the ASV x sample count table to long (asv_id, sample, count) keeping count > 0 rows, gzipped
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy replica of the nf-core/ampliseq SUMMARY_TABLE_COUNTS process (modules/local/summary_table_counts/main.nf). The R body is the module's inline script and the container is its exact community.wave.seqera.io image (registry manifest probe: anonymously pullable OCI manifest; conda env r-base=4.3.1 + r-dplyr/r-tidyr/r-readr). Two adaptations. (1) rename(asv_id = ASV_ID) becomes a positional rename of the first column: the source's count tables always carry the literal ASV_ID header from the DADA2 biom chain, while this draft's tables are keyed by ASV sequence under headers the producers do not standardize. (2) The versions.yml writeLines block (which embeds task.process) is dropped (pipeline_info artifacts dropped precedent). The module's stub branch is translation-irrelevant. Output stays gzipped per the source's ampliseq.counts.tsv.gz name; readr gzips by extension and Galaxy sniffs the compression."
      container: community.wave.seqera.io/library/r-base_r-data.table_r-dplyr_r-dtplyr_pruned:a6608bc81b0e6546
      inputs:
        - name: table
          type: data
          format:
            - tabular
            - tsv
          label: ASV count table
          help: Tab-separated ASV x sample counts, ASV id in the first column (asv_table_knot).
      outputs:
        - name: tsv
          type: data
          format: tabular
          from_work_dir: ampliseq.counts.tsv.gz
          label: Long-format counts (asv_id, sample, count; count > 0)
      configfiles:
        - filename: summary_counts.R
          content: |
            #!/usr/bin/env Rscript
            # Verbatim modules/local/summary_table_counts/main.nf script body
            # (positional first-column rename + versions.yml drop - see tool help).
            suppressPackageStartupMessages({
                library(dplyr)
                library(tidyr)
                library(readr)
            })

            a <- commandArgs(trailingOnly = TRUE)
            asv_table <- a[1]

            counts <- read_tsv(asv_table, show_col_types = FALSE) |>
                rename_with(~"asv_id", 1) |>
                pivot_longer(-asv_id, names_to = "sample", values_to = "count") |>
                filter(count > 0)

            write_tsv(counts, "ampliseq.counts.tsv.gz")
      shell_command: |
        Rscript summary_counts.R "$(inputs.table.path)"
  import_table:
    label: import_table
    doc: QIIME2 import of the (filtered) feature table - QIIME2_INASV verbatim (biom header sed + biom convert + qiime tools import FeatureTable[Frequency] on qiime2/qiime2:2026.4). Identity corrected from the pinned q2d2 qiime2_core__tools__import - that wrapper cannot do the tsv-to-biom pre-conversion (import_taxonomy precedent); the plain ASV-sequence-keyed table is a valid simple BIOM text table for biom-format's load_table.
    in:
      table: asv_table_for_import/data_param
    out:
      - id: qza
    run:
      class: GalaxyUserTool
      id: ampliseq_import_table
      version: 1.0.0
      name: QIIME2 feature-table importer (ampliseq)
      description: Convert the pipeline ASV count table to BIOM and import it as FeatureTable[Frequency]
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy replica of nf-core/ampliseq QIIME2_INASV (modules/local/qiime2_inasv/main.nf, container qiime2/qiime2:2026.4 kept as quay.io/qiime2/qiime2:2026.4): the sed header strip, biom convert --table-type=\"OTU table\" --to-hdf5 and the verbatim qiime tools import command (FeatureTable[Frequency], BIOMV210Format) are the source script lines; the XDG/MPL/NUMBA cache exports match the source and the sibling import_taxonomy UDT. The pinned q2d2 qiime2_core__tools__import cannot perform the tsv-to-biom pre-conversion (same identity correction as import_taxonomy). Adaptation: the source's ch_asv_table is DADA2 biom text (hence the \"# Constructed from biom file\" sed, kept for header-carrying inputs), while this draft's ASV tables are plain tab-separated with the ASV sequence in the first column - biom-format's load_table accepts that as a simple BIOM text table, so no pre-conversion is needed. Deviation: versions.yml is not published (pipeline_info artifacts dropped precedent)."
      container: quay.io/qiime2/qiime2:2026.4
      inputs:
        - name: table
          type: data
          format:
            - tabular
            - tsv
          label: ASV count table
          help: Tab-separated table keyed by ASV sequence, first column then one column per sample (biom-text headers tolerated).
      outputs:
        - name: qza
          type: data
          from_work_dir: table.qza
          label: QIIME2 feature table artifact
      shell_command: |
        export XDG_CONFIG_HOME="./xdgconfig";
        export XDG_CACHE_HOME="./xqcache";
        export MPLCONFIGDIR="./mplconfigdir";
        export NUMBA_CACHE_DIR="./numbacache";
        sed '/^# Constructed from biom file/d' "$(inputs.table.path)" > biom-table.txt;
        biom convert -i biom-table.txt -o table.biom --table-type="OTU table" --to-hdf5;
        qiime tools import --input-path table.biom --type 'FeatureTable[Frequency]' --input-format BIOMV210Format --output-path table.qza
  import_taxonomy:
    label: import_taxonomy
    doc: "QIIME2_INTAX replica - normalize the knot-carried single taxonomy table (wide ASV_ID+ranks via the verbatim bin/parse_dada2_taxonomy.r join, raw Feature ID/Taxon export via header strip, headerless SIDLE table via passthrough) and import as FeatureData[Taxonomy] with the source's verbatim qiime tools import command. Identity corrected from the pinned q2d2 qiime2_core__tools__import - that wrapper cannot perform the rank-joining pre-conversion this source always applies. No when-guard mirrors the source: a null knot (no classifier ran) leaves the required input unsatisfied and Galaxy skips the step, like the empty ch_tax channel."
    in:
      tax: tax_table_knot/data_param
    out:
      - id: qza
    run:
      class: GalaxyUserTool
      id: ampliseq_import_taxonomy
      version: 1.0.0
      name: QIIME2 taxonomy importer (ampliseq)
      description: Normalize any ampliseq branch taxonomy table and import it as FeatureData[Taxonomy]
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy replica of nf-core/ampliseq QIIME2_INTAX (modules/local/qiime2_intax/main.nf, qiime2/qiime2:2026.4): the source pre-processes the single chosen taxonomy table with bin/parse_dada2_taxonomy.r (rank columns joined into one ;-separated taxon string, non-rank columns excluded by name and _confidence/_exact suffix) and imports it as HeaderlessTSVTaxonomyFormat. Here the pre-selection is the same verbatim R parser (configfile), and an adjudicator picks it per input shape because the upstream tax_table_knot may carry any branch's table: a Feature ID/Taxon headered table (raw QIIME2 export - header stripped, no parse), an ASV_ID-headered table (parse path, the source behavior - the knot is expected to carry the kraken2 branch's two-column into-qiime2 table here, exactly like the source ch_kraken2_tax, because the wide kraken2 table would join its lowest_match redundancy into the taxon string), or a headerless two-column table (SIDLE filttax output - passed through). The q2d2 qiime2_core__tools__import wrapper the template pinned cannot do the rank-joining pre-conversion, so the identity was corrected to this authored tool; the import command itself is the source's verbatim."
      container: quay.io/qiime2/qiime2:2026.4
      inputs:
        - name: tax
          type: data
          format:
            - tabular
            - tsv
            - txt
          label: Single ASV taxonomy table
          help: The one taxonomy table chosen by the branch knot (wide ASV_ID+ranks, Feature ID/Taxon, or headerless two-column).
      outputs:
        - name: qza
          type: data
          from_work_dir: taxonomy.qza
          label: QIIME2 taxonomy artifact
      configfiles:
        - filename: parse_dada2_taxonomy.r
          content: |
            #!/usr/bin/env Rscript
            # verbatim bin/parse_dada2_taxonomy.r from nf-core/ampliseq (output name fixed to tax.tsv)
            args = commandArgs(trailingOnly=TRUE)

            if(length(args) != 1){
                stop("Usage: parse_dada2_taxonomy.r <ASV_tax_species.tsv>")
            }

            tax_file <- args[1]

            OUT="tax.tsv"

            # read required files
            # Read as character throughout: a rank that is empty for every ASV is otherwise typed logical and
            # renders as the literal string "NA" in the taxonomy below. Emptying na.strings keeps an empty
            # field empty instead of turning it into NA again.
            tax = read.table(tax_file, header = TRUE, sep = "\t", stringsAsFactors = FALSE, comment.char = '', quote = '', colClasses = "character", na.strings = character(0))

            # Join the taxonomy rank columns only, excluding known non-rank columns. Matched by suffix
            # pattern where possible ("_confidence", "_exact") rather than by literal name, so a future
            # added metadata column doesn't silently leak into the taxonomy string as a bogus extra rank.
            # SH and BOLD_bin are sequence-cluster identifiers rather than ranks, although databases declare
            # them in taxlevels: joined in, they become a spurious extra level in every rank-collapsed
            # QIIME2 output.
            non_rank_cols <- colnames(tax) %in% c('ASV_ID', 'sequence', 'confidence', 'classifier', 'database', 'SH', 'BOLD_bin') |
                grepl('_confidence$|_exact$', colnames(tax))
            r <- colnames(tax)[!non_rank_cols]
            tax$taxonomy <- do.call(paste, c(tax[r], sep = ';'))

            #write
            print (paste("write",OUT))
            write.table(tax[,c('ASV_ID', 'taxonomy')], file = OUT, quote=FALSE, col.names=FALSE, row.names=FALSE, sep="\t")
        - filename: adjudicate.py
          content: |
            #!/usr/bin/env python3
            # Decide which QIIME2_INTAX pre-processing path the knot-carried table needs.
            import sys

            with open(sys.argv[1]) as fh:
                first = fh.readline().rstrip("\n").split("\t")
                second = fh.readline()

            if first and first[0] == "ASV_ID":
                mode = "parse"                 # wide table: source parse_dada2_taxonomy.r path
            elif len(first) == 2 and first[1] == "Taxon":
                mode = "strip_header"          # raw QIIME2 export: Feature ID<TAB>Taxon
            elif len(first) >= 2 and second and len(second.rstrip("\n").split("\t")) == len(first):
                # headerless two-column (SIDLE filttax): first row is data, not header
                mode = "passthrough"
            else:
                mode = "parse"
            print(mode)
      shell_command: |
        export XDG_CONFIG_HOME="./xdgconfig";
        export XDG_CACHE_HOME="./xqcache";
        export MPLCONFIGDIR="./mplconfigdir";
        export NUMBA_CACHE_DIR="./numbacache";
        MODE="$(python3 adjudicate.py $(inputs.tax.path))";
        echo "input taxonomy shape: $MODE" >&2;
        if [ "$MODE" = "strip_header" ]; then
          tail -n +2 $(inputs.tax.path) > tax.tsv
        elif [ "$MODE" = "passthrough" ]; then
          cp $(inputs.tax.path) tax.tsv
        else
          Rscript parse_dada2_taxonomy.r $(inputs.tax.path)
        fi;
        qiime tools import --type 'FeatureData[Taxonomy]' --input-format HeaderlessTSVTaxonomyFormat --input-path tax.tsv --output-path taxonomy.qza
  qiime2_tree:
    tool_id: toolshed.g2.bx.psu.edu/repos/q2d2/qiime2__phylogeny__align_to_tree_mafft_fasttree/qiime2__phylogeny__align_to_tree_mafft_fasttree
    tool_version: 2026.1.0+q2galaxy.2026.1.0
    label: qiime2_tree
    doc: "QIIME2_TREE replica - the source module (modules/local/qiime2_tree/main.nf) chains qiime alignment mafft | alignment mask | phylogeny fasttree | midpoint-root | export nwk; this q2d2 plugin tool IS that four-command chain, so the template's split mafft_align+fasttree_tree pair is collapsed here (collapse pre-authorized in fasttree_tree._plan_context; the pinned toolshed iuc/mafft identity was corrected - no iuc/mafft wrapper exists on any panel, only rnateam/rbc_mafft and the q2d2 family). Input corrected vs the draft: the source builds the tree from the FULL-LENGTH ASV fasta (ch_seq = QIIME2_INSEQ over ch_full_fasta = ch_asv_fasta, workflows/ampliseq.nf:1225), not from ITS-extracted sequences. Deviations: source produces this tree only when metadata is present and no pplace/sidle tree was supplied (produce_tree, subworkflows/local/qiime2_diversity/main.nf:30-33) - metadata presence is not when-portable and the pplace-tree alternative is left to the consuming steps; the nwk export for R objects happens inside the robject consumers on the qza."
    when: "!$(inputs.skip_diversity_indices) || !$(inputs.skip_alpha_rarefaction)"
    in:
      sequences: merge_tables/asv_fasta
    out:
      - id: rooted_tree
  filter_samples:
    label: filter_samples
    doc: "FILTER_SAMPLES - mutual sample intersect of metadata rows and abundance columns (modules/local/filter_samples, base R on r-base:4.2.1 - NOT q2 feature-table filter-samples: the q2d2 wrapper is a no-op without --p-where and cannot compute the intersect, identity corrected from the pinned id, import_table precedent). Realized at the source's position BEFORE QIIME2_INASV: the filtered table rebinds the import feed via asv_table_for_import (ch_asv_table reassignment workflows/ampliseq.nf: 1144-1146); the filtered metadata output feeds the QIIME2 metadata consumers in their own iterations. Display-only *.log drops documented in the tool help."
    when: $(inputs.metadata) != null
    in:
      meta: metadata
      table: asv_table_knot/data_param
    out:
      - id: metadata
      - id: table
    run:
      class: GalaxyUserTool
      id: ampliseq_filter_samples
      version: 1.0.0
      name: Metadata/abundance sample intersect (ampliseq)
      description: Intersect the sample metadata rows and the abundance table columns so both cover exactly the shared samples, failing when the intersection is empty
      license: GPL-3.0-or-later
      help:
        format: markdown
        content: "Galaxy replica of the nf-core/ampliseq FILTER_SAMPLES process (modules/local/filter_samples/main.nf - NOT the nf-core qiime2/filter/samples module; the template's expected q2d2 qiime2__feature_table__filter_samples id was corrected from source: q2 filter-samples is a no-op without --p-where and cannot compute this mutual metadata/abundance sample intersect). Container biocontainers/r-base:4.2.1 kept (conda env conda-forge::r-base=4.2.1, base R only). The R body is the module's inline script verbatim - meta[,1] %in% abundance sample columns, abundance columns %in% meta sample ids, both rewrites with quote=FALSE na='', and the stop() when the intersection is empty (samples that are in one file only are dropped from both). Galaxy adaptations. (1) The staged path variables become positional args; the versions.yml writeLines block (which embeds task.process) is dropped (pipeline_info artifacts dropped precedent). (2) The module's two informational .log files are dropped: their file names are the messages themselves (paste0(log_message, \".log\")), they exist only to be echoed via log.warn at the workflow level (a display channel with no Galaxy consumer), and an undecidable-name output cannot be declared - the empty-intersection stop() (the fatal path) is kept."
      container: quay.io/biocontainers/r-base:4.2.1
      inputs:
        - name: meta
          type: data
          format:
            - tabular
            - tsv
          label: Sample metadata
          help: Tab-separated sample metadata, first column = sample id.
        - name: table
          type: data
          format:
            - tabular
            - tsv
          label: ASV count table
          help: Tab-separated ASV x sample counts, first column = ASV id, remaining column headers = sample ids.
      outputs:
        - name: metadata
          type: data
          format: tabular
          from_work_dir: metadata.tsv
          label: Metadata restricted to samples present in the abundance table
        - name: table
          type: data
          format: tabular
          from_work_dir: table.tsv
          label: Abundance table restricted to samples present in the metadata
      configfiles:
        - filename: filter_samples.R
          content: |
            #!/usr/bin/env Rscript
            # Verbatim modules/local/filter_samples/main.nf script body (staged path vars ->
            # positional args; versions.yml and the display-only *.log writes dropped - tool help).
            a <- commandArgs(trailingOnly = TRUE)
            meta_file <- a[1]; abund_file <- a[2]

            # first column in meta has sample id
            meta <- read.table( meta_file, header = TRUE, sep = "\t", stringsAsFactors = FALSE)
            # column names are sample ids, but first column is asv id
            abund <- read.table( abund_file, header = TRUE, sep = "\t", stringsAsFactors = FALSE)

            # samples that arent in both files are dropped
            meta_filtered <- meta[meta[,1] %in% colnames(abund)[2:length(colnames(abund))],]
            abund_filtered <- abund[,colnames(abund) %in% c( colnames(abund)[1], meta[,1] ) ]

            # write filtered data
            write.table(meta_filtered, file = "metadata.tsv", row.names = FALSE, col.names = TRUE, quote = FALSE, na = '', sep = "\t")
            write.table(abund_filtered, file = "table.tsv", row.names = FALSE, col.names = TRUE, quote = FALSE, na = '', sep = "\t")

            # error in case all samples were removed
            if ( nrow(meta_filtered) == 0 ) {
                stop("All samples were removed. That means no overlap between the metadata sample IDs and the abundance table sample IDs was found. Make sure that sample IDs match.")
            }
      shell_command: |
        Rscript filter_samples.R "$(inputs.meta.path)" "$(inputs.table.path)"

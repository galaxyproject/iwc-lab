      help:
        format: markdown
        content: Galaxy adaptation of nf-core/ampliseq `FORMAT_TAXRESULTS` (bin/add_full_sequence_to_taxfile.py, pandas:1.1.5 pin kept). The shed wrapper writes write.table(row.names = T) so rows are keyed by the ASV sequence, while the source's own intermediate carried ASV_ID + sequence columns; this tool recovers ASV_ID by exact sequence match against the ASV fasta (same source, so all rows should match; unmatched rows keep an empty ASV_ID with a stderr warning) and emits the source's final column layout ASV_ID, ranks..., sequence. The source's taxlevels header renaming stays unavailable (wrapper taxLevels not connectable - ledger dada-assign-taxlevels-dropped).
      container: quay.io/biocontainers/pandas:1.1.5
      inputs:
        - name: tax_raw
          type: data
          format:
            - tabular
            - tsv
            - txt
          label: DADA2 taxonomy table
          help: Output of dada2 assignTaxonomy(+addSpecies) wrapper.
        - name: fasta
          type: data
          format:
            - fasta
          label: ASV sequences
          help: ASV fasta used to recover ASV_IDs by sequence.
      outputs:
        - name: tsv
          type: data
          format: tsv
          from_work_dir: ASV_tax_dada.tsv
          label: Formatted ASV taxonomy
      configfiles:
        - filename: dada_format.py
          content: |
            #!/usr/bin/env python3
            # ampliseq FORMAT_TAXRESULTS adaptation: the iuc dada2 wrapper writes its taxonomy
            # table with row.names = sequences (write.table(..., row.names = T, col.names = NA));
            # the source's own pipeline intermediate instead carried ASV_ID + sequence columns.
            # Normalize to the source's final shape: ASV_ID, <rank columns...>, sequence.
            import sys, pandas as pd
            tax_p, fasta_p, out_p = sys.argv[1:4]
            tax = pd.read_csv(tax_p, sep="\t", header=0, index_col=0)
            tax = tax.rename_axis("sequence").reset_index()
            tax["sequence"] = tax["sequence"].astype(str).str.strip()
            seqs, name, chunks = {}, None, []
            for line in open(fasta_p):
                line = line.rstrip("\n")
                if line.startswith(">"):
                    if name is not None:
                        seqs.setdefault(name, "".join(chunks))
                    name, chunks = line[1:].split()[0], []
                elif name is not None:
                    chunks.append(line.strip())
            if name is not None:
                seqs.setdefault(name, "".join(chunks))
            by_seq = {s: i for i, s in seqs.items()}
            tax.insert(0, "ASV_ID", tax["sequence"].map(by_seq).fillna(""))
            missing = (tax["ASV_ID"] == "").sum()
            if missing:
                sys.stderr.write("WARNING: %d taxonomy rows did not match an ASV sequence exactly; ASV_ID left empty\n" % missing)
            cols = ["ASV_ID"] + [c for c in tax.columns if c not in ("ASV_ID", "sequence")] + ["sequence"]
            tax[cols].to_csv(out_p, sep="\t", index=False, na_rep="")
      shell_command: python3 dada_format.py $(inputs.tax_raw.path) $(inputs.fasta.path) ASV_tax_dada.tsv

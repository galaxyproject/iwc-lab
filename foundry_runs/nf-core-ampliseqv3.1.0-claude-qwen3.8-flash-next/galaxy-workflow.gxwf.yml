  tax_dada_format:
    label: tax_dada_format
    doc: FORMAT_TAXRESULTS (DADA2) - normalize the assignTaxonomy pick (sequence-keyed wrapper table) to ASV_ID + ranks + sequence (authored UDT ampliseq_dada_format, pandas:1.1.5 source pin; adaptation documented in the tool help).

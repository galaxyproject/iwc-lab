class: GalaxyWorkflow
label: MGnify's amplicon pipeline v5.0
doc: MGnify's amplicon pipeline v5.0. Including the Quality control for single-end and paired-end reads, rRNA-prediction, and ITS sub-WFs.
inputs:
  - id: SRA accession list
    type: data
    optional: false
    doc: List of SRA accession IDs, one per line.
  - id: Clan information file
    type: data
    optional: false
    doc: Clan information file.
  - id: Trimmomatic sliding window number of bases to average across
    type: int
    optional: true
    default: 4
    doc: Number of bases to average across.
  - id: Trimmomatic sliding window average quality
    type: int
    optional: true
    default: 15
    doc: Average quality required.
  - id: PE fastp - Enable base correction
    type: boolean
    optional: true
    default: false
    doc: Enable base correction in overlapped regions. (Paired-end)
  - id: Trimmomatic leading
    type: int
    optional: true
    default: 3
    doc: Cut bases off the start of a read, if below a threshold quality.
  - id: PE fastp - Qualified quality phred
    type: int
    optional: true
    default: 20
    doc: The quality value that a base is qualified. (Paired-end)
  - id: Trimmomatic trailing
    type: int
    optional: true
    default: 3
    doc: Cut bases off the end of a read, if below a threshold quality.
  - id: "PE fastp - Unqualified percent limit "
    type: int
    optional: true
    default: 20
    doc: How many percents of bases are allowed to be unqualified (0~100). (Paired-end)
  - id: Trimmomatic min length
    type: int
    optional: true
    default: 100
    doc: Minimum length of reads to be kept.
  - id: PE fastp - Length required
    type: int
    optional: true
    default: 70
    doc: Reads shorter than this value will be discarded. (Paired-end)
  - id: Length filtering minimum size
    type: int
    optional: true
    default: 100
    doc: Minimum sequence length.
  - id: Ambiguity filtering maximal N percentage threshold to conserve sequences
    type: int
    optional: true
    default: 10
    doc: Maximal N percentage threshold to conserve sequences.
  - id: SSU taxonomic abundance summary table name
    type: string
    optional: true
    default: SSU taxonomic abundance summary table
  - id: SSU phylum level taxonomic abundance summary table name
    type: string
    optional: true
    default: SSU phylum level taxonomic abundance summary table
  - id: LSU taxonomic abundance summary table name
    type: string
    optional: true
    default: LSU taxonomic abundance summary table
  - id: LSU phylum level taxonomic abundance summary table name
    type: string
    optional: true
    default: LSU phylum level taxonomic abundance summary table
  - id: ITSoneDB taxonomic abundance summary table name
    type: string
    optional: true
    default: ITSoneDB taxonomic abundance summary table
  - id: ITSoneDB phylum level taxonomic abundance summary table name
    type: string
    optional: true
    default: ITSoneDB phylum level taxonomic abundance summary table
  - id: ITS UNITE DB taxonomic abundance summary table name
    type: string
    optional: true
    default: ITS UNITE DB taxonomic abundance summary table
  - id: ITS UNITE DB phylum level taxonomic abundance summary table name
    type: string
    optional: true
    default: ITS UNITE DB phylum level taxonomic abundance summary table
outputs:
  - id: _anonymous_output_1
    outputSource: Trimmomatic sliding window number of bases to average across
  - id: _anonymous_output_2
    outputSource: Trimmomatic sliding window average quality

            code: |-
              NR > 2 { 
                      split($3, taxa, ";");
                      merged = "";
                      levels = 3; # We need sk__, k__, and p__ levels
                      for (i = 1; i <= levels; i++) {
                          if (i <= length(taxa) && taxa[i] ~ /__/) {
                              split(taxa[i], parts, "__");
                              if (parts[2] != "") {
                                  value = parts[2];
                              } else {
                                  value = "unassigned";
                              }
                          } else {
                              value = "unassigned";
                          }
                          merged = merged (merged ? ";" : "") value;
                      }
                      print merged "\t" $2;
                  }

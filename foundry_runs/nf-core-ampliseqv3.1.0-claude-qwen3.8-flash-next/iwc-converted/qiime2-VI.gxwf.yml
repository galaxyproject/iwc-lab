class: GalaxyWorkflow
label: "QIIME2 VI: Diversity metrics and estimations"
doc: The first step in hypothesis testing in microbial ecology is typically to look at within- (alpha) and between-sample (beta) diversity. We can calculate diversity metrics, apply appropriate statistical tests, and visualize the data using the q2-diversity plugin.
inputs:
  - id: Sampling depth
    type: int
    optional: false
    doc: |-
      This value is based on the DADA2 table features.
      Note: the choice of the value is prioritising either the inclusion of all the samples or a higher feature retention.
  - id: Metadata
    type: data
    optional: false
    format:
      - qiime2.tabular
    doc: The tab separated file for the metadata
  - id: Feature table
    type: data
    optional: false
    format:
      - qza
    doc: For instance the dada2_table from DADA2
  - id: Rooted tree
    type: data
    optional: false
    format:
      - qza
    doc: Rooted phylogenetic tree
  - id: Target metadata parameter (for beta diversity)
    type: string
    optional: false
    doc: Type in the name of the parameter which would be used for beta diversity estimation
outputs:
  - id: Alpha diversity - Pielou's evenness
    outputSource: Alpha diversity metrics - Pielou's evenness/visualization
  - id: Alpha diversity - Observed features
    outputSource: Alpha diversity metrics - Observed features/visualization
  - id: Alpha diversity - Shannon's diversity index
    outputSource: Alpha diversity metrics - Shannon's diversity index/visualization
  - id: Beta diversity - Jaccard distance metrics
    outputSource: Beta diversity - Jaccard distance matrix/visualization
  - id: Beta diversity - Bray-Curtis distance metrics
    outputSource: Beta diversity - Bray-Curtis distance matrix/visualization
  - id: Emperor plot collection
    outputSource: Emperor plot collection
  - id: Beta diversity - weighted UniFrac distance metrics
    outputSource: Beta diversity - weighted UniFrac distance matrix/visualization
  - id: PCoA collection
    outputSource: PCoA collection
  - id: Distance matrix collection
    outputSource: Distance matrix collection
  - id: Richness and evenness collection
    outputSource: Richness and evenness collection

entries:
- id: taxonomy-selector-catalog-no-carrier
  status: open
  kind: gap
  raised_by: nextflow-summary-to-galaxy-reference-data
  unmet: User-facing picks among ~144 curated taxonomy DB names (dada/qiime/sintax/vsearch_lca/kraken2/sidle _ref_taxonomy
    selectors) resolve to download URLs + taxref_reformat_*.sh + citation/license metadata at config-load time.
  missing: 'No portable Galaxy carrier: v1 posture rules out dbkey/.loc data tables, workflow files cannot bundle
    payloads, and the DBs are not derivable from any supplied input (no in-tool rebuild possible). v1 exposes only
    the *_ref_tax_custom path inputs; the catalog tier is unrepresented.'
  resolved_by: null
  supersedes: null
  note: 'Interface Mold confirmed: selectors not exposed as inputs.'
- id: ref-taxonomy-storage-cache-no-galaxy-carrier
  status: open
  kind: gap
  raised_by: nextflow-summary-to-galaxy-reference-data
  unmet: params.ref_taxonomy_storage acts as a cross-run download cache for the 7 DOWNLOAD_REFERENCE_* builders.
  missing: Stateless Galaxy workflow inputs have no cross-run writable cache; a translated workflow either re-acquires
    per run or (v1 choice) does not acquire at all. Downstream Molds must not wire any step to a storage directory.
  resolved_by: null
  supersedes: null
  note: 'Data-flow brief honors this: no step is wired to a storage dir; branch enablement is input-supplied only.'
- id: coordinated-reference-bundles-grouping
  status: open
  kind: gap
  raised_by: nextflow-summary-to-galaxy-reference-data
  unmet: 'Three coupled asset groups must be supplied coherently: pplace set (tree+aln+model[+taxonomy, +pplace_sheet]),
    SIDLE quartet (tax_txt+seq+aln+tree qza), DADA2-custom pair (custom + custom_sp).'
  missing: 'Galaxy required-when-conditional input affordance is weak and the mapping note records no worked >=4-coupled-inputs
    shape; v1 uses separate optional inputs plus when: guards, leaving no structural enforcement of co-supply.'
  resolved_by: null
  supersedes: null
  note: Data-flow keeps the when:-guard form (branch gated on its required member inputs); SIDLE quartet and DADA2
    pair enforcement remains documentary.
- id: qiime-ref-tax-custom-two-path-affordance
  status: resolved
  kind: gap
  raised_by: nextflow-summary-to-galaxy-reference-data
  unmet: --qiime_ref_tax_custom accepts a tarball/dir OR two comma-separated paths (workflows/ampliseq.nf:388-396).
  missing: A Galaxy data input is one dataset; the comma-string form has no affordance. Interface Mold must either
    split into two optional inputs or restrict to the single-archive form and record the narrowing.
  resolved_by: nextflow-summary-to-galaxy-interface
  supersedes: null
  note: Split into qiime_ref_tax_custom + optional qiime_ref_tax_custom_2 inputs; pair semantics documented in the
    interface brief.
- id: pplace-enablement-keyed-on-selector
  status: resolved
  kind: gap
  raised_by: nextflow-summary-to-galaxy-reference-data
  unmet: Source enables phylogenetic placement from run_pplace plus 'reference trees specified by the selected --dada_ref_taxonomy'
    (the catalog key carries the tree URL).
  missing: 'With selectors not exposed (taxonomy-selector-catalog-no-carrier), the guard''s source of truth is gone;
    template must re-key the pplace when: on the supplied pplace_tree/pplace_aln inputs. Must be reflected in the
    data-flow brief.'
  resolved_by: nextflow-summary-to-galaxy-data-flow
  supersedes: null
  note: Data-flow conditional-disposition table carries pplace as a subworkflow-when gated on run_pplace && pplace_tree
    && pplace_aln inputs. Residual hmmer-row file refs stay open as pplace-sheet-file-refs.
- id: either-of-input-interface-loss
  status: open
  kind: gap
  raised_by: nextflow-summary-to-galaxy-interface
  unmet: Source requires exactly one of --input (samplesheet) or --input_fasta (ASV fasta bypass) at runtime (workflows/ampliseq.nf:205);
    nf-schema itself requires only outdir.
  missing: 'gxformat2 cannot express exactly-one-of over two optional inputs. v1: input is the de-facto required
    primary, input_fasta optional alternate with doc warning; supplying both or neither fails (or misbehaves) at
    step level rather than at form validation.'
  resolved_by: null
  supersedes: null
  note: Data-flow brief scopes the DAG to the input-sheet scenario; the input_fasta bypass keeps only its downstream
    join point (FORMAT_FASTAINPUT analogue) as an alternate feed at stage 11's consumer edge.
- id: pplace-sheet-file-refs
  status: resolved
  kind: gap
  raised_by: nextflow-summary-to-galaxy-interface
  unmet: pplace_sheet rows name reference files (hmm, extract_hmm, refseqfile, refphylogeny columns) that the source
    resolves from the downloaded reference tier.
  missing: With the catalog/download tier dropped (expose-custom-path-inputs-not-catalog), sheet rows using alignmethod=hmmer
    reference files no workflow input supplies. clustalo-default rows are unaffected; template must gate hmmer rows
    or document the loss.
  resolved_by: advance-galaxy-draft-step
  supersedes: null
  note: ''
- id: consolidate-taxonomy-optional-fanin
  status: open
  kind: gap
  raised_by: nextflow-summary-to-galaxy-data-flow
  unmet: 'CONSOLIDATE_TAXONOMY consumes path(tax_files, stageAs: ''tax_*.tsv'') + val(sources) - a 0..N sized collection
    of taxonomy tables contributed only by whichever when-gated branches ran, with per-contributor provenance (source
    DB/tool) alongside each table.'
  missing: 'No packaged recipe for an N-way present-only fan-in: collection construction from when-gated outputs
    under skipped-step sentinel semantics is assumed but unverified (flagged for phase-11), and the sources provenance
    label per table has no worked Galaxy carrier (element identifier vs parallel label collection).'
  resolved_by: null
  supersedes: null
  note: 'Data-flow prescribes list-collection + multiple=true reduce (stage 14, Medium); single-branch case bypasses
    consolidate via twin-input wiring. IWC pass: corpus fan-in families are fixed-N repeat ports (dada2_seqCounts
    inrep) and whole-collection tool inputs (makeSequenceTable) - neither varies N with optional-branch presence,
    so the obligation stands (see discoveries iwc-fanin-families).'
- id: multirun-sheet-inexpressible-v1
  status: open
  kind: gap
  raised_by: advance-galaxy-draft-step
  unmet: source identifier fold sample[__run] for sheets where one sample recurs across runs (data-flow stage 1,
    RENAME_RAW_DATA_FILES analogue).
  missing: Galaxy constructs a sample_sheet collection's elements (and their identifiers) at input-form time; no
    workflow step can run before it to re-key, and duplicate element identifiers are rejected at construction. The
    planned derive_identifiers step was therefore deleted at loop iteration 2; consumers wire directly to `input`.
  resolved_by: null
  supersedes: null
  note: v1 carries the single-run scenario (fixture Samplesheet_v3.tsv is sample-unique); multi-run sheets fail
    input validation with a clear error rather than silently mis-joining. Grouping by `run` (stage 6) remains expressible
    via a __SAMPLE_SHEET_TO_TABULAR__ join, trivial when sample-unique.
- id: sample-failure-error-semantics
  status: open
  kind: gap
  raised_by: nextflow-summary-to-galaxy-data-flow
  unmet: DADA2_FILTNTRIM/FILTER failures terminate the Nextflow run via error() unless ignore_failed_trimming/ignore_failed_filtering;
    the branch otherwise drops the sample with a log.
  missing: Galaxy map-over + filter-non-empty drops failing samples silently; no in-workflow affordance for fail-the-run-on-fan-element
    or a first-class per-run validation error listing dropped samples. v1 = silent drop + collected failed-sample
    list output; the source's default strictness is not carried.
  resolved_by: null
  supersedes: null
  note: 'ignore_failed_* stay exposed as scalars (interface) but can only gate whether the drop list is tolerated
    downstream, not reproduce error(). IWC pass corroborates the drop posture: __FILTER_EMPTY_DATASETS__ is the
    corpus idiom (mgnify-complete uses it 20x); no corpus workflow fails the run on a bad fan element.'
- id: non-illumina-platforms-not-carried
  status: open
  kind: dropped
  raised_by: nextflow-summary-to-galaxy-interface
  units: 'sequencing_type values iontorrent, pacbio, nanopore and their subgraphs: PORECHOP_ABI, CHOPPER, SAVONT_ASV/SAVONT_EXPORT
    and savont_options, skip_porechop_abi, skip_chopper; asv_calling value savont'
  because: 'sequencing_type restricts to [illumina_pe, illumina_se]: the selected test candidate (tests/default.nf.test
    -profile test) exercises illumina only (conf/test.config), and the ONT/PacBio/ION processes are gated on the
    other enum values (summary process guards). v1 scope follows the carried test scenario.'
  unmet: the pipeline's ONT/PacBio/iontorrent entry paths
  missing: the carried spine is Illumina amplicon only; platform switch is not offered as a Galaxy input
  note: ''
- id: param-surface-tuning-scalars
  status: open
  kind: dropped
  raised_by: nextflow-summary-to-galaxy-interface
  units: '~55 per-tool fine-tuning scalars fixed at source defaults: mergepairs_consensus_* (6), vsearch_lca_* tuning
    (5), ancombc*/ancombc2* formula_reflvl/effect_size/significance (6), dada_assign_chunksize, sidle_ref_degenerates,
    sidle_ref_cleaning, raise_filter_stacksize, expected_sequences_mismatches, remaining kraken2_/sintax_ tuning,
    savont_options (also platform-dropped)'
  because: nextflow-params-to-galaxy-inputs sanctions resolving control params 'to a fixed Galaxy design default';
    Galaxy workflow parameter forms carry no grouping affordance, and exposing all 178 source params (interface
    brief exposes ~85 + 27 data inputs) makes the run form unusable. Full kept/dropped split is enumerated in nextflow-galaxy-interface.md.
  unmet: per-run tunability of those tool knobs
  missing: they become compile-time constants in the draft; a user wanting them must edit the workflow
  note: ''
- id: multiregion-fanout-no-recipe
  status: open
  kind: dropped
  raised_by: nextflow-summary-to-galaxy-data-flow
  units: multiregion tsv input (assets/schema_multiregion.json), the per-element primer cross-product feeding CUTADAPT_MULTIREGION
    (region-specific FW/RV per sample), DADA2_SPLITREGIONS groupTuple (workflows/ampliseq.nf:674), multiregion branch
    of the trimming subworkflow
  because: Per-element primers require an unkeyed cross-product of samples x regions - nextflow-operators-to-galaxy-collection-recipes
    classifies unkeyed combine as a review trigger with no Galaxy collection recipe, and no pattern page carries
    per-element primer parameters; the alternative (primers as tabular side-data joined per element) has no worked
    recipe either. v1 runs a single region from the primers scalars.
  unmet: simultaneous multi-region amplicon processing from one sample sheet
  missing: the multiregion fan-out path; users run the workflow once per region instead
  note: ''
discoveries:
- id: taxonomy-custom-overrides-selector
  raised_by: nextflow-summary-to-galaxy-reference-data
  evidence: workflows/ampliseq.nf:314-317,388-396,412-452 - each branch resolves as if (<tool>_ref_tax_custom) {
    fromPath(custom) } else if (<tool>_ref_taxonomy) { selector -> catalog download }.
  impact: One optional data input per branch fully replaces the source's reference resolution when selectors are
    dropped; custom presence is also the correct when:-guard for branch enablement.
- id: taxonomy-rebuilds-are-downloads-not-rebuilds
  raised_by: nextflow-summary-to-galaxy-reference-data
  evidence: All 7 reference_rebuilds[] guards are positive-form '<selector> set && params.ref_taxonomy_storage';
    builders download catalog files and run taxref_reformat_*.sh; no builder consumes a user-supplied asset.
  impact: The mapping note's in-tool-rebuild posture does not apply to any ampliseq asset; branch enablement is
    'input supplied', never 'rebuild on absence'.
- id: summary-used-by-attribution-incomplete
  raised_by: nextflow-summary-to-galaxy-reference-data
  evidence: 17 of 20 reference_assets[] entries have empty used_by; consuming-branch attribution was recovered by
    re-reading workflows/ampliseq.nf branch guards.
  impact: Downstream Molds should not trust used_by==[] as 'unused' for this run's summary; use the branch table
    in nextflow-galaxy-reference-data.md.
- id: either-or-input-is-runtime-only
  raised_by: nextflow-summary-to-galaxy-interface
  evidence: nextflow_schema.json root required list covers only outdir (input_output_options group); the either-of
    error is a runtime check at workflows/ampliseq.nf:205.
  impact: No param in this pipeline is schema-required; requiredness in the interface brief is semantic and must
    be re-derived from guards, not from nextflow_schema.
- id: publishdir-is-centralized-in-modules-config
  raised_by: nextflow-summary-to-galaxy-interface
  evidence: 'All publishing lives in conf/modules.config process{ withName: X { publishDir = [...] } }; summary
    processes[].publish_dir is empty for all 126 processes.'
  impact: Output-side (user-visible dataset) evidence must be read from conf/modules.config; the interface output
    table was derived there. Template/test-plan should treat that file, not per-process publishDir, as output-intent
    ground truth for this source.
- id: group-unit-identifier-carries-sample-list
  raised_by: nextflow-summary-to-galaxy-data-flow
  evidence: 'subworkflows/local/dada2_preprocessing/main.nf:146-158 - groupTuple(by: 0) over meta with id/sample
    stripped, then re-added as [id: ids.flatten().sort(), sample: samples.flatten().sort()]; the group element''s
    identity is the (run, region) key while membership is a list value.'
  impact: Galaxy group elements must be keyed by a deterministic join of the grouping fields (e.g. run__region);
    member-sample membership cannot live in the element identifier and must ride as tabular side data. Identifier-keyed
    steps after DADA2_ERR cannot recover per-sample keys from the identifier alone.
- id: iwc-fanin-families
  raised_by: compare-against-iwc-exemplar
  evidence: 'amplicon/dada2/dada2_paired converted view: dada2_seqCounts uses a named repeat port (inrep_0..5 +
    inrep state list) for its 6-stage counts table; dada2_makesequencetable takes samples: <whole collection> as
    one multiple input.'
  impact: 'Two corpus fan-in families: fixed-N compile-time repeats (fits stage-10 named stats merge) and whole-collection
    tool inputs (fits stage-11 gather); neither adapts to variable presence of when-gated branches, leaving consolidate
    (stage 14) on the list-collection+multiple posture.'
- id: iwc-optional-ref-via-tool-conditional
  raised_by: compare-against-iwc-exemplar
  evidence: 'dada2_assignTaxonomyAddspecies state reference_cond {reference_select: builtin | custom refFasta ConnectedValue};
    mgnify uses the same conditional-port shape for optional inputs.'
  impact: 'For the dada2 taxonomy branch, ''custom reference supplied'' can ride the wrapper''s conditional port
    instead of a workflow when:; subworkflow when: stays for whole-branch gating (skip_taxonomy, and branches with
    no builtin reference like sintax/kraken/sidle).'
decisions:
- id: expose-custom-path-inputs-not-catalog
  decided_by: nextflow-summary-to-galaxy-reference-data
  basis: agent
  decision: v1 exposes the six *_ref_tax_custom asset groups (plus pplace set and expected_* truth files as interface
    inputs) as explicit optional data inputs; the *_ref_taxonomy selectors, the 144-key catalog, and ref_taxonomy_storage
    are not translated.
  rationale: 'v1 posture of nextflow-to-galaxy-reference-data-mapping: no admin-managed data tables, no bundled
    payloads, workflows portable on stock Galaxy; catalog resolution requires download+reformat infrastructure with
    no Galaxy carrier.'
  evidence:
  - taxonomy-custom-overrides-selector
  - taxonomy-rebuilds-are-downloads-not-rebuilds
- id: input-collection-shape
  decided_by: nextflow-summary-to-galaxy-interface
  basis: agent
  decision: input becomes a sample_sheet:paired_or_unpaired collection with columns sample(req string), run(opt),
    control(opt, restrictions [control,sample]), quant_reading(opt); element datatypes fastqsanger.gz; element identifier
    sample[__run] with uniqueness derivation owned by data-flow.
  rationale: 'schema_input.json: fastq_2 optional over fastq path columns; nf-schema enum on control maps to restrictions;
    sample repeats across runs so identifier must fold in run.'
  evidence:
  - either-or-input-is-runtime-only
- id: input-identifier-sample-only
  decided_by: advance-galaxy-draft-step
  basis: agent
  supersedes: input-collection-shape
  decision: 'Clause supersession (identifiers only; the rest of input-collection-shape stands): the input collection''s
    element identifier is the `sample` column alone and no derivation step exists - fastqc/cutadapt/reads_route
    consume `input` directly.'
  rationale: Galaxy sample_sheet collections fix element identifiers at input-form time; duplicate identifiers fail
    construction, so the data-flow's sample[__run] fold can never exist as a workflow step (gap multirun-sheet-inexpressible-v1).
    The RENAME_RAW_DATA_FILES analogue has no in-workflow carrier and was removed from the draft.
  evidence:
  - multirun-sheet-inexpressible-v1
- id: single-group-denoising-v1
  decided_by: advance-galaxy-draft-step
  basis: agent
  decision: group_reads is removed from the draft; the surviving paired collection feeds __UNZIP_COLLECTION__ directly
    and the pooled err/dada steps operate on the single whole-run group.
  rationale: The source groupTuple keys on (run, region); v1 identifiers are sample-only (input-identifier-sample-only)
    and multi-run sheets are rejected at input construction (multirun-sheet-inexpressible-v1), leaving exactly one
    group, so the reshape is the identity. Group membership in v1 is the input sheet's sample list; per-sample attribution
    survives on element identifiers through map-overs, addressing the group-unit-identifier-carries-sample-list
    impact clause for v1.
  evidence:
  - input-identifier-sample-only
  - multirun-sheet-inexpressible-v1
  - group-unit-identifier-carries-sample-list
- id: restrict-illumina-platforms
  decided_by: nextflow-summary-to-galaxy-interface
  basis: agent
  confidence: low
  decision: sequencing_type restricted to illumina_pe/illumina_se; asv_calling to [auto, dada2]; ONT/PacBio/ION
    subgraphs not carried (see non-illumina-platforms-not-carried).
  rationale: Scope follows the selected test scenario (-profile test, illumina); the harness runs no non-illumina
    fixture.
  evidence:
  - non-illumina-platforms-not-carried
- id: promote-stable-tables-as-checkpoints
  decided_by: nextflow-summary-to-galaxy-interface
  basis: agent
  decision: Public outputs include asv_sequences (fasta), counts_table (tsv), taxonomy_table (tsv) as content-checkable
    checkpoints, plus per-stage plots, parquet summaries, multiqc html and summary_report; qza/qzv intermediates
    not promoted (save_intermediates resolved to fixed default false).
  rationale: 'galaxy-workflow-testability-design: promote stable count/summary/table results a test can assert on,
    not only final artifacts; the source publishes exactly these as its summary tables (SUMMARY_TABLE_COUNTS/TAXONOMY).'
  evidence:
  - publishdir-is-centralized-in-modules-config
- id: scatter-gather-granularity
  decided_by: nextflow-summary-to-galaxy-data-flow
  basis: agent
  decision: Per-sample map-overs for stages 1-3 and 5 (rename/fastqc/cutadapt/filtntrim keyed sample[__run]); one
    reshape into a flat group collection keyed (run,region) for DADA2_ERR/DENOISING/RMCHIMERA/STATS (no list:list);
    explicit collection reductions for per-direction quality pools, stats merges, and the DADA2_MERGE final single-table
    gather.
  rationale: Mirrors the source's own scatter/gather (per-sample modules -> groupTuple by (run,region) -> collect()
    into DADA2_MERGE); group unit matches the source's job unit, keeping step granularity justified by source structure
    rather than tool guesses.
  evidence:
  - group-unit-identifier-carries-sample-list
- id: taxonomy-branches-as-subworkflow-when
  decided_by: nextflow-summary-to-galaxy-data-flow
  basis: agent
  decision: 'Each taxonomy branch (dada2/sintax/vsearch_lca/kraken2/qiime2/sidle/addsh) is a subworkflow carrying
    when: gated on its custom reference input(s) plus skip flags, interface ASV-fasta-in/tax-tsv-out; branch tables
    merge through a multi-present list-collection fan-in into CONSOLIDATE (not pick_value), and a single present
    branch bypasses consolidate by direct wiring.'
  rationale: Source already groups these cascades in *_TAXONOMY_WF subworkflows with narrow typed interfaces (conditional-when
    note's subworkflow-vs-inline criteria); consolidation semantics are all-present merge (stageAs 'tax_*.tsv' +
    sources), which pick_value's select-one modes mis-model.
  evidence:
  - taxonomy-custom-overrides-selector
  - consolidate-taxonomy-optional-fanin
  superseded_by: taxonomy-branches-inline-gated
- id: taxonomy-branches-inline-gated
  decided_by: nextflow-summary-to-galaxy-template
  basis: agent
  supersedes: taxonomy-branches-as-subworkflow-when
  decision: The emitted draft realizes each taxonomy branch as a flat cluster of when-gated inline steps (1-3 per
    branch) instead of nested subworkflows; multi-present fan-in into tax_consolidate and the first_or_skip taxonomy_table
    knot are unchanged.
  rationale: 'With the multi-DB catalog fan-out dropped, a v1 branch is 1-3 steps, where the conditional-when note
    treats subworkflow-vs-inline as aesthetic; in gxformat2 a nested subworkflow''s inner when:/in: cannot address
    parent workflow inputs without runtime_inputs forwarding of every guard scalar, so inline gating keeps guards
    directly over workflow inputs with zero plumbing. Whole-pipeline narrative preserved via the comments: stage
    frames.'
  evidence:
  - taxonomy-custom-overrides-selector
  - consolidate-taxonomy-optional-fanin
- id: pplace-standard-clustalo-v1
  decided_by: advance-galaxy-draft-step
  basis: agent
  decision: the pplace stub expands to the six-step standard-branch chain (pplace_align, pplace_split, pplace_epa,
    pplace_graft, pplace_assign, pplace_heat) gated on pplace_tree + pplace_aln; the pplace_sheet multi-reference
    variant (hmmer/mafft rows, HMMEXTRACT) is not implemented and pplace_sheet / run_pplace / pplace_alnmethod are
    removed from the interface; pplace_model gains default GTR+G.
  rationale: the shed covers epa-ng placement and all three gappa examine modes (iuc/epa_ng 0.3.8, iuc/gappa_graft
    / gappa_assign / gappa_heat_tree 0.9.0, matching the source module tool versions 0.3.8 / 0.9.0); profile alignment
    and epa-ng --split have no shed ports, so two UDTs reproduce the module commands verbatim. hmmer rows are inexpressible
    (no catalog carrier), mafft rows were never promised; outputs stay un-promoted per the interface brief, so FORMAT_PPLACETAX
    (which only feeds taxonomy merging) is not implemented.
  evidence:
  - pplace-sheet-file-refs
  - pplace-enablement-keyed-on-selector
  - expose-custom-path-inputs-not-catalog
- id: dada-assign-taxlevels-dropped
  decided_by: advance-galaxy-draft-step
  basis: agent
  decision: workflow input dada_assign_taxlevels is removed; iuc/dada2_assigntaxonomyaddspecies runs with its default
    rank names (DADA2 default Kingdom..Species) in all three twins.
  rationale: gxwf step connections cannot target the wrapper's optional case-level taxLevels text parameter ("No
    parameter definition matching connection key reference_cond|taxLevels" in both plain and case-qualified forms),
    and a conditional selector is static in a workflow step, so rank names are not dynamic through this wrapper;
    the catalog branches that auto-derived levels per database are already dropped (expose-custom-path-inputs-not-catalog).
    Custom references with non-standard rank hierarchies need an authored assignTaxonomy wrapper - surfaced here
    rather than silently mislabeling ranks.
  evidence:
  - expose-custom-path-inputs-not-catalog
  - param-surface-tuning-scalars
- id: sidle-single-region-v1
  decided_by: advance-galaxy-draft-step
  basis: source-evidence + panel-miss
  decision: SIDLE branch implemented as one authored UDT (ampliseq_sidle_classify, embedded in tax_sidle) covering
    the single-region taxonomy-only chain; multi-region reconstruction, SIDLE_TABLERECON/SEQRECON/TREERECON and
    the sidle_ref_aln_custom/sidle_ref_tree_custom inputs are dropped from v1; region, region_length and both primers
    become plain optional workflow inputs (sidle_region, sidle_region_length, sidle_primer_fwd, sidle_primer_rev)
    required alongside the two DB inputs by the when-guard; num_degenerates (default 5) and ref_cleaning (default
    silva) expose the source ext.args.
  rationale: 'No Tool Shed SIDLE wrapper exists (usegalaxy.eu api q=sidle returns []); every source module is a
    qiime CLI call in the nf-core/pipesidle:0.1.0-beta image, so replicating the CLI sequence in one container job
    is the faithful unit. The source gates SIDLE_WF on multi-region mode + dada2 and sources region/primers from
    the multi-region sheet, consistent with the earlier multiregion-fanout decision that v1 is single-region; the
    ASV table row order matches the ASV fasta (both from merge_tables), which the UDT exploits to rebuild the biom
    table with ASV ids. Deviation: ASVs absent from the alignment map are filtered like SIDLE_FILTTAX and cannot
    be distinguished from absent features.'
  evidence:
  - curl https://usegalaxy.eu/api/tools?q=sidle -> []
  - 'modules/local/sidle_*/main.nf: all container nf-core/pipesidle:0.1.0-beta; qiime sidle/rescript/feature-classifier
    CLI calls'
  - 'conf/modules.config: SIDLE_DBFILT ext.args custom --p-num-degenerates 5 + --p-exclude mitochondria,chloroplast
    --p-mode contains; SIDLE_DBEXTRACT --p-identity 2; SIDLE_TAXRECON custom --p-database silva'
  - nextflow_schema.json sidle_ref_degenerates default 5
  - 'workflows/ampliseq.nf SIDLE block: gated on multi-region + dada2; region fields from multi-region sheet'
- id: vsearch-sintax-authored
  decided_by: advance-galaxy-draft-step
  basis: panel-miss + shed-probe-miss
  decision: 'Identity pin corrected: toolshed.../iuc/vsearch/vsearch_sintax does not exist. tax_sintax implemented
    as authored UDT ampliseq_sintax (embedded) reproducing modules/nf-core/vsearch/sintax (vsearch --sintax --db
    --gzip_decompress --sintax_cutoff --randseed --tabbedout), container pin kept (quay vsearch 2.31.0--hd2be7a0_0);

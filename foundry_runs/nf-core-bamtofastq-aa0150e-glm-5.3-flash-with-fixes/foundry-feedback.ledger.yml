entries:
- id: rebuild-threshold-counts-ambiguous
  raised_by: nextflow-summary-to-galaxy-reference-data
  observed_in:
    mold: nextflow-summary-to-galaxy-reference-data
    path: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
    revision: 5
    content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
    foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
  subject:
    kind: research
    label: nextflow-to-galaxy-reference-data-mapping
    locator: content/research/nextflow-to-galaxy-reference-data-mapping/index.md
    content_hash: 4676cdf3de4bcec6161b6102c9e842efa7b3c953f9c2f2787b4debea48e4a7eb
  kind: friction
  severity: minor
  what: The 'when to deviate from in-tool rebuild' threshold says 'rebuild more than ~3 times' but its
    example counts consumer steps (a bwa-mem2 index used by 200 alignment steps); for compute-if-missing
    pipelines like bamtofastq the source rebuilds the .fai exactly once and then consumes it in ~7 downstream
    samtools calls, so 'rebuild count' (1) and 'consumption count' (7) give opposite answers at the threshold.
  expected: State whether the threshold counts rebuild invocations or consumer steps, or say 'index shared
    by many consumer steps should be built once at workflow tier even if the source rebuilds it once'.
  evidence: Reference-data brief had to reason past the note to choose between a workflow-tier samtools
    faidx step and in-tool rebuild for a single-rebuild/many-consumer asset.
  status: open
  issue: null
- id: sample-sheet-record-exemplar-gap
  raised_by: nextflow-summary-to-galaxy-interface
  observed_in:
    mold: nextflow-summary-to-galaxy-interface
    path: content/molds/nextflow-summary-to-galaxy-interface/index.md
    revision: 5
    content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
    foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
  subject:
    kind: research
    label: galaxy-sample-sheet-collections
    locator: content/research/galaxy-sample-sheet-collections/index.md
    content_hash: 8558b5c48e994b1be0f39a09c887b4ad
  kind: gap
  severity: minor
  what: The note documents the sample_sheet:record variant and its mapping rules but gives no worked example
    of a record-shaped alignment input (bam+cram+index per row), and no guidance on how slots unzip into
    per-tool inputs; the interface Mold had to invent the slot layout and flag tool-side consumption as
    unverified.
  expected: Add a record-variant worked example including how data-flow unzips record slots (Apply Rules
    / __UNZIP_COLLECTION__) and which built-in tools accept sample_sheet:record inputs.
  evidence: bamtofastq's samplesheet (mapped bam/cram + optional index) is a natural record case; the
    brief had to mark slot consumption confidence medium with no corpus anchor.
  status: open
  issue: null
- id: conditional-note-lacks-null-exposing-outputs-guidance
  raised_by: nextflow-summary-to-galaxy-data-flow
  observed_in:
    mold: nextflow-summary-to-galaxy-data-flow
    path: content/molds/nextflow-summary-to-galaxy-data-flow/index.md
    revision: 5
    content_hash: 5f8e3a24de4b2f6e2c02c09d3c5f1a7e
    foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
  subject:
    kind: research
    label: nextflow-conditional-to-galaxy-subworkflow-when
    locator: content/research/nextflow-conditional-to-galaxy-subworkflow-when/index.md
    content_hash: 2c9e9d7e
  kind: gap
  severity: minor
  what: 'The note covers when-gating and pick_value rejoin for consumed outputs but never says what happens
    when a when-gated step''s output is itself a workflow output (QC toggles like no_stats/params.no_read_QC):
    the typed null sentinel is surfaced to the user, and the brief had to decide to expose skipped-step
    outputs as nulls with no guidance.'
  expected: Add a short section on exposing when-gated steps' outputs as workflow outputs (null sentinel
    behavior, user-facing consequence, alternatives).
  evidence: bamtofastq has three when-gated QC/stats step groups whose outputs are the pipeline's main
    published files; the rejoin machinery did not apply and the note was silent on this case.
  status: open
  issue: null
- id: gxwf-convert-fails-without-tool-cache
  raised_by: compare-against-iwc-exemplar
  observed_in:
    mold: compare-against-iwc-exemplar
    path: content/molds/compare-against-iwc-exemplar/index.md
    revision: 5
    content_hash: 3f5e2c8a
    foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
  subject:
    kind: related-project
    label: galaxy-tool-util-ts gxwf convert
    locator: https://github.com/jmchilton/galaxy-tool-util-ts/tree/main/packages/cli
  kind: friction
  severity: minor
  what: gxwf convert --to format2 --compact exits 1 (after writing the output file) when any tool is not
    in its local tool cache ('toolshed.g2.bx.psu.edu/... not in cache'), even though the conversion output
    is usable for structural comparison; 4/7 steps fell back to unknown_tool.
  expected: gxwf convert should treat uncacheable tools as a warning and exit 0 when the output file was
    still produced, or document the cache dependency; the output written despite exit 1 is easy to miss.
  evidence: 'IWC host-or-contamination-removal-on-short-reads.ga conversion: ''Stateful conversion: 3/7
    steps converted, 4 fell back'', exit 1, but a 290-line valid YAML written to stdout.'
  status: open
  issue: null
- id: shed-install-rejects-changesets-not-in-install-api
  raised_by: run-workflow-test
  observed_in:
    mold: run-workflow-test
    path: content/molds/run-workflow-test/index.md
    revision: 5
    foundry_head: f99f830e5cca9a46c3c02b7eb34e43f516702f11
  subject:
    kind: related-project
    label: Galaxy Tool Shed install API changeset gating
    locator: https://github.com/galaxyproject/galaxy (lib/galaxy/tool_shed install, err 400008)
  kind: friction
  severity: major
  what: Workflow tool_shed_repository pins carrying changeset revisions that the install API does not
    expose are rejected at planemo's install_shed_repos step with err 400008 'No information is available
    for the requested repository revision'. Two of the draft's pins (samtools_merge 1.22+galaxy2 @ 088f43b55525,
    samtools_fastx 1.22+galaxy2 @ e3de92741d60) were non-installable changesets; TRS tool-revisions listed
    the installable ones (37c8eb55315d, 4bde991b8037) that the install API accepts.
  expected: discover-shed-tool resolves pins via TRS tool-revisions --latest, but that surface can disagree
    with what the install API exposes; the skill's caveat list (component-tool-shed-search) should name
    err 400008 and the recovery (re-resolve via TRS tool-revisions, not repo lineage browse), and validate-galaxy-workflow
    could optionally probe pin installability.
  evidence: 'Attempts 2-3: planemo install_shed_repos raised ''Failed to install one or more repositories'';
    --no_cleanup Galaxy log showed the three 400008 errors naming the exact bad changesets.'
  status: open
  issue: null
- id: shed-tool-id-unequal-repo-name-invisible-in-search
  raised_by: run-workflow-test
  observed_in:
    mold: run-workflow-test
    path: content/molds/run-workflow-test/index.md
    revision: 5
    foundry_head: f99f830e5cca9a46c3c02b7eb34e43f516702f11
  subject:
    kind: related-project
    label: Tool Shed repo-name vs tool-id mismatch
    locator: https://toolshed.g2.bx.psu.edu/view/jackcurragh/ribogalaxy_samtools_index
  kind: friction
  severity: major
  what: A wrapper's XML tool id can differ from its repository name (samtools_index lives in repo ribogalaxy_samtools_index),
    and gxwf tool-search hits surface the repo name but not this divergence; a draft pin written as owner/repo/samtools_index
    fails install with err 400008 because the repo does not exist. Repo search (api/repositories?q=samtools_index)
    found the real repo, but nothing in the search output hinted the mismatch.
  expected: discover-shed-tool should surface the (owner, repo, tool_id) triple explicitly per hit and
    warn when tool_id != repo name, so downstream pin authoring does not silently substitute one for the
    other.
  evidence: Attempt 3 root cause for the samtools_index install error; fixed by renaming the repo to ribogalaxy_samtools_index
    in 2 steps' tool_shed_repository blocks.
  status: open
  issue: null
- id: versionless-shed-guid-incompatible-require-exact-versions
  raised_by: run-workflow-test
  observed_in:
    mold: run-workflow-test
    path: content/molds/run-workflow-test/index.md
    revision: 5
    foundry_head: f99f830e5cca9a46c3c02b7eb34e43f516702f11
  subject:
    kind: related-project
    label: Galaxy get_tool(exact=True) vs versionless shed GUIDs
    locator: https://github.com/galaxyproject/galaxy (lib/galaxy/tool_util/toolbox/base.py get_tool; bioblend
      invoke_workflow require_exact_tool_versions default True)
  kind: friction
  severity: major
  what: 'gxformat2 drafts whose shed-tool steps carry a versionless tool_id (e.g. toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view)
    install and validate fine, but planemo''s invocation fails with ''the following required tools are
    not installed'' when bioblend''s require_exact_tool_versions=True (its default) reaches Galaxy get_tool(exact=True):
    _tools_by_id keys are full versioned GUIDs, the exact branch has no lineage fallback (elif exact:
    continue), so the versionless GUID resolves to nothing. Every versioned step passes, which makes the
    error read as ''nothing installed'' when in fact only the versionless ids are unresolvable.'
  expected: Either Galaxy should resolve versionless shed GUIDs under exact=True via the tool lineage,
    or planemo/bioblend should downgrade to non-exact matching with a warning; short of that, advance-galaxy-draft-step
    or validate-galaxy-workflow should flag versionless shed tool_ids as invocation-fatal under planemo
    (draft-validate passes them silently today).
  evidence: 'Attempts 4-5: all 11 shed tools ''not installed'' per the 400 response; DB showed all repos
    Installed; versioned pick_value steps were absent from the error, isolating the cause. Fixed by rewriting
    all 19 versionless tool_ids to full GUIDs <shed>/repos/<owner>/<repo>/<tool_id>/<version>.'
  status: open
  issue: null
- id: when-on-optional-input-yields-nonetype
  raised_by: run-workflow-test
  observed_in:
    mold: run-workflow-test
    path: content/molds/run-workflow-test/index.md
    revision: 5
    foundry_head: f99f830e5cca9a46c3c02b7eb34e43f516702f11
  subject:
    kind: related-project
    label: Galaxy evaluate_when requires boolean
    locator: https://github.com/galaxyproject/galaxy (lib/galaxy/workflow/modules.py evaluate_when; when_not_boolean)
  kind: friction
  severity: major
  what: 'A gxformat2 ''when:'' clause written as $(inputs.chr) over an optional text workflow input evaluates
    to None when the input is unset, and Galaxy''s evaluate_when raises when_not_boolean (''Type is: NoneType'')
    at scheduling, failing the whole invocation. The conditional/when notes document when-gating but not
    that the expression must itself coerce to a boolean for optional inputs.'
  expected: 'The conditional-pattern note (or draft-validate) should state that when: expressions over
    optional inputs must be explicit boolean coercions, e.g. $(inputs.chr != null), and ideally draft-validate
    should flag identity when-expressions over optional inputs.'
  evidence: 'Attempt 6: invocation failed at the first chr-gated step with when_not_boolean Type is: NoneType;
    fixed by rewriting both chr-gated steps'' when to $(inputs.chr != null).'
  status: open
  issue: null

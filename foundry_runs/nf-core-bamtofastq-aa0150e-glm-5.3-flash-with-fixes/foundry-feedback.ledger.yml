  subject:
    kind: research
    label: nextflow-to-galaxy-reference-data-mapping
    locator: content/research/nextflow-to-galaxy-reference-data-mapping/index.md
  kind: friction
  severity: minor
  what: The reference-data brief's compute-if-missing classification drove a planned index thread into
    idxstats ('the wrapper needs the alignment index — bind the wired index dataset there'), but the actual

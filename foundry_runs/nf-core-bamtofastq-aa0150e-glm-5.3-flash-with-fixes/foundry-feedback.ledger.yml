- id: samtools-fastx-internal-sort-defeats-upstream-collate-order
  raised_by: debug-galaxy-workflow-output
  observed_in:
    mold: debug-galaxy-workflow-output
    path: content/molds/debug-galaxy-workflow-output/index.md
    revision: 5
    foundry_head: f99f830e5cca9a46c3c02b7eb34e43f516702f11
  subject:
    kind: related-project
    label: iuc samtools_fastx wrapper internal samtools sort -n
    locator: toolshed.g2.bx.psu.edu/repos/iuc/samtools_fastx changeset 4bde991b8037 (samtools_fastx.xml command block)
  kind: friction
  severity: major
  what: 'The samtools_fastx wrapper silently prepends `samtools sort -n` unless its input dataset is
    typed qname_sorted.bam or qname_input_sorted.bam. A workflow chaining samtools_collate (which
    declares output unsorted.bam, header SO:unsorted) directly into samtools_fastx to reproduce a
    `collate -O | fastq` source chain gets numeric name-sorted order instead of collate hash order —
    a silent read-ordering divergence that changes FASTQ content md5s while leaving counts identical.
    No packaged reference covers wrapper-internal reordering: it looks like a collection/mapping issue
    but is neither, and the fix (output-level change_datatype to qname_input_sorted.bam, which never
    sniffs and whose grooming check passes for SO:unsorted) is non-obvious.'
  expected: A debugging reference on "wrapper-internal preprocessing vs upstream step ordering" —
    tools that run their own sort/grooming based on input datatype — listing the is_of_type-gated
    wrappers (fastx) and the change_datatype post-job-action remedy with its gxformat2 output-level
    `change_datatype:` spelling.
  evidence: attempt-11 forward md5 29e442f7 vs expected 9b0c0886 with identical read counts; collate
    output header SO:unsorted GO:query; fastx.xml `#if not $input.is_of_type(...)` guard. (Correction
    03:30: the "local replication reproduces the snapshot md5s exactly" claim was false — none of the
    local chains produced the snapshot values; the real explanation is content-md5 semantics, see
    nftest-md5-tokens-are-content-md5s below.)
  status: open
  issue: null
- id: samtools-bamnative-not-bam-subclass-triggers-auto-converter
  raised_by: debug-galaxy-workflow-output
  observed_in:
    mold: debug-galaxy-workflow-output
    path: content/molds/debug-galaxy-workflow-output/index.md
    revision: 5
    foundry_head: f99f830e5cca9a46c3c02b7eb34e43f516702f11
  subject:
    kind: related-project
    label: Galaxy datatype registry auto-converter insertion on BamNative/Bam class gap
    locator: lib/galaxy/datatypes/binary.py (BamNative 630, Bam 902), data.py matches_any 1027, registry.py find_conversion_destination 965
  kind: friction
  severity: major
  what: 'samtools_collate declares its output unsorted.bam (class BamNative) while samtools_fastx
    declares its input format sam,bam,cram (class Bam). In Galaxy''s datatype hierarchy `class Bam(BamNative)`
    makes BamNative the PARENT of Bam, so the isinstance-based matches_any check fails for every collate
    output, and Galaxy silently inserts a CONVERTER_bam_to_coodinate_sorted_bam job (a coordinate sort)
    between the two steps, destroying the collate order before the wrapper ever runs. The downstream
    remedy (output change_datatype to qname_input_sorted.bam) cannot prevent this — the converter runs
    on the pre-PJA dataset — and the wrapper-side remedy is a catch-22 (plain bam typing re-enables the
    wrapper''s internal sort -n; qname typing still triggers the converter). Diagnosis required reading
    Galaxy source; the wrapper-level symptom (identical wrong md5s with identical counts) looks exactly
    like a collection-ordering bug and no packaged reference names auto-converter insertion as a debug
    surface.'
  expected: A debugging reference on "Galaxy-inserted converter jobs" — how to spot them in planemo logs
    (CONVERTER_* job entries), the matches_any/isinstance datatype-class gap as a cause (BamNative vs Bam,
    and generally any parent-class-declared output feeding a child-class-declared input), and the UDT
    remedy (declare the parent/alternate datatypes in the consuming tool''s accepted format list).
  evidence: attempt-11 and attempt-12 planemo logs both show 4 CONVERTER_bam_to_coodinate_sorted_bam jobs;
    converter command samtools sort --no-PG -O bam; fix (embedded UDT accepting unsorted.bam) removes them.
  status: open
  issue: null

- id: nftest-md5-tokens-are-content-md5s
  raised_by: run-workflow-test / debug-galaxy-workflow-output
  observed_in:
    mold: nextflow-test-to-galaxy-test-plan
    path: content/molds/nextflow-test-to-galaxy-test-plan/index.md
    revision: 5
    foundry_head: f99f830e5cca9a46c3c02b7eb34e43f516702f11
  subject:
    kind: research
    label: packaged snapshot-translation note does not state that nf-test md5 tokens for compressed files are content md5s
  kind: gap
  severity: major
  what: 'The packaged note nextflow-snapshot-to-galaxy-assertions was used to translate nf-test snapshot
    `path:md5,<value>` tokens into Galaxy `checksum: md5$<value>` assertions, but for compressed outputs
    (merged.fastq.gz) the nf-test token is the md5 of the DECOMPRESSED content, not of the file bytes
    (nf-test hashes logical content for compressed formats, the same family as bam(...).readsMD5). The
    resulting Galaxy checksum assertion compared gzip file bytes against content md5s and failed
    spuriously across attempts 10-13, launching a wrong hunt for an ordering divergence that did not
    exist. Ground truth: a local source-pipeline run produced file md5s 15ab79e3/2c2dbdf1/d0fd4034/bcb8df2c
    and content md5s 9b0c0886/40e17982/a4984fb5/bde23801 = exactly the four snapshot values.'
  expected: The snapshot-translation note should state the semantics of `md5,` tokens for compressed
    files (content, not container bytes) and the Galaxy-side remedy: stage the source-produced file in
    test-data and assert with `file:` + `compare: diff` + `decompress: true` (tests-format schema) instead
    of a file-byte checksum.
  evidence: zcat of the source pipeline's four merged fastq.gz outputs gives exactly the snapshot md5s;
    their file md5s differ; nf-core CI snapshot at c07661c (2026-11-12) carries identical FASTQ values.
  status: open
  issue: null

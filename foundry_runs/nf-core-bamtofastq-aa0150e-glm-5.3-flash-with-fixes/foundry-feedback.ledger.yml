feedback:
- id: fb-001
  phase: 1
  subject: cast/skills/summarize-nextflow
  observation: The skill says "summarize each process script_excerpt in one line into script_summary"
    but also allows omitting it in deterministic runs; the schema requires no script_summary field at
    all (Process.script_summary is optional, not in required list) yet the skill text says "Deterministic
    runs omit script_summary" - we chose to emit LLM-written script_summary for all 13 processes since
    the harness runs the skill itself. No conflict resolved by docs; ambiguity logged.
  status: drafted
- id: fb-006
  phase: 6
  subject: cast/skills/nextflow-summary-to-galaxy-template
  observation: The data-flow brief carries the authoritative input amendments (sample_sheet:record ->
    plain list, fasta_fai dropped, collate_fast dropped, single-end path dropped), but nothing in the
    template skill's procedure tells the templating agent to re-read the interface brief against the data-flow
    amendments before emitting workflow inputs; the interface brief's I1 `sample_sheet:record` shape was
    superseded but never annotated as such, so the superseded artifact still reads as authoritative for
    the input shape.
  expected: Template skill should state explicitly that data-flow-brief input amendments supersede the
    interface brief where they conflict, and the interface brief template should require an amendment
    banner.
  status: drafted
- id: fb-007
  phase: 6
  subject: cast/skills/nextflow-summary-to-galaxy-template
  observation: 'The conditionals pattern page says steps ''receive a boolean through an input named when
    and declare when: $(inputs.when)'' — i.e. the boolean arrives via a connected step output. The IWC
    exemplar confirms this (when fed from map_param_value/output_param_boolean). Gating directly on a
    workflow-level boolean input with `when: $(inputs.chr)` is the natural translation for already-boolean
    params (no map_param_value indirection needed), but no pattern page or exemplar shows that direct
    form, so the template had to record a fallback (_plan_context: insert map_param_value if direct workflow-input
    when fails at runtime).'
  expected: A pattern page or note covering when-gating directly on workflow boolean inputs (and whether
    the runtime supports it), so the template tier does not have to hedge.
  status: drafted
- id: fb-008
  phase: 6
  subject: cast/skills/nextflow-summary-to-galaxy-template
  observation: The per-tool-step _plan_* families are free text; nothing constrains them to cover the
    things the per-step loop actually needs (wrapper-port names, filter-flag binding for samtools view's
    -f/-F, multiple-input merge linkage). Two drafts would plausibly record the same intent in disjoint
    vocabulary. Open-work note in the draft-format doc admits this; surfaced here because this run wrote
    18 _plan_state/_plan_context blocks by hand and the vocab drifted (e.g. 'TODO_input' vs 'TODO_input_1'
    vs 'TODO_index' for the same semantic 'alignment index' role).
  expected: A suggested _plan_in/_plan_out vocabulary (the draft-format doc's open-work candidates) so
    _plan_* blocks are comparable across drafts.
  status: drafted
- id: conditional-state-grammar-undocumented
  raised_by: advance-galaxy-draft-step
  observed_in:
    mold: advance-galaxy-draft-step
    path: content/molds/advance-galaxy-draft-step/index.md
    revision: 5
    foundry_head: f99f830e5cca9a46c3c02b7eb34e43f516702f11
  subject:
    kind: related-project
    label: galaxy-tool-util-ts gxwf draft-validate connection keys
    locator: https://github.com/jmchilton/galaxy-tool-util-ts/tree/main/packages/cli
  kind: gap
  severity: major
  what: 'The connection-key grammar for nested conditionals is nowhere documented: state and connection
    keys must be FLAT within a conditional (branch params are siblings of the test parameter; case names
    never appear), sections DO appear in the path, repeats get a _N suffix. I burned ~1h and 5 wrong spellings
    (mode|selected_reads|filter_config|cond_region|regions etc.) before reading the validator source (schema/dist/workflow/walker.js,
    state-merge.js) to derive it. The pick_value precedent (style_cond|type_cond|pick_from_0|value) misleadingly
    suggests case names are skipped AND sections are skipped, but sections are in fact included — the
    two examples share only the coincidence that both end in a leaf reached through conditionals/repeats.'
  expected: 'The draft-format note or the advance skill should state the grammar explicitly (conditional:
    flat sibling state; section: named in path; repeat: _N suffix) with a nested conditional+section worked
    example (samtools_view is the canonical one).'
  evidence: 'samtools_view_chr regions connection: 4 wrong spellings rejected with ''No parameter definition
    matching connection key''; the correct mode|filter_config|cond_region|regions only fell out after
    reading walker.js selectWhichWhen (case names are never in state).'
  status: open
  issue: null
- id: wrapper-selects-use-individual-flag-bits
  raised_by: advance-galaxy-draft-step
  observed_in:
    mold: advance-galaxy-draft-step
    path: content/molds/advance-galaxy-draft-step/index.md
    revision: 5
    foundry_head: f99f830e5cca9a46c3c02b7eb34e43f516702f11
  subject:
    kind: research
    label: galaxy-tool-job-failure-reference
    locator: content/research/galaxy-tool-job-failure-reference/index.md
  kind: gap
  severity: minor
  what: Samtools wrapper filter selects (samtools_view inclusive/exclusive_filter, samtools_fastx inclusive/exclusive_filter)
    are multi-selects of INDIVIDUAL flag bits (1,2,4,8,...), not numeric masks; a _plan_state carrying
    the source's combined ext.args masks (-F12, -F264) drafts a state the validator rejects element-wise
    ('Expected "1", actual "12"'). Nothing in the skill or notes warns that ext.args flag masks must be
    bit-decomposed for Galaxy multi-selects.
  expected: 'A note in the implement skill or job-failure reference: decompose samtools -f/-F masks into
    individual bits for the wrappers'' multi-select ports (12 -> [4,8], 264 -> [4,256], etc.).'
  evidence: Four view-split steps plus samtools_view_chr all needed bit-decomposition; first validation
    failed with per-element 'Expected <bit>, actual <mask>' errors.
  status: open
  issue: null

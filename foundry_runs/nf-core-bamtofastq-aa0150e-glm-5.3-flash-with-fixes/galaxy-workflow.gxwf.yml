        input_type: paired
  multiqc:
    label: MultiQC report
    doc: Aggregate the post-conversion FastQC reports into a MultiQC report. DEVIATION from source (source
      MultiQC consumes only versions/params YAML); gated by read_qc (nothing to aggregate when FastQC
      is skipped).
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/multiqc/multiqc/1.35+galaxy5
    tool_version: 1.35+galaxy5
    tool_shed_repository:
      changeset_revision: 94b6bea727ae
      name: multiqc
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    when: $(inputs.when)
    in:
      results_0|software_cond|output_0|input: FastQC on converted reads/text_file
      title: multiqc_title
      when: read_qc
    out:
    - id: html_report
    state:
      results:
      - software_cond:
          software: fastqc
          output:
          - type: data
      title: null

      - id: output_unaligned_reads_r
        hide: true
      - id: mapping_stats
        rename: Bowtie2 mapping statistics
      - id: output_unaligned_read_pairs
        rename: Reads without host or contaminant reads
    tool_state:
      analysis_type:
        analysis_type_selector: simple
        __current_case__: 0
        presets: no_presets
      library:
        type: paired_collection
        __current_case__: 1
        input_1:
          __class__: ConnectedValue
        unaligned_file: true
        aligned_file: false
        paired_options:
          paired_options_selector: "no"
          __current_case__: 1
      reference_genome:
        source: history
        __current_case__: 1
        own_file:
          __class__: ConnectedValue
      rg:
        rg_selector: do_not_set
        __current_case__: 3
      sam_options:
        sam_options_selector: "no"
        __current_case__: 1
      save_mapping_stats: true
    when: $(inputs.when)
    uuid: 8e9b9cb7-d3ab-47a0-87df-097406cc901c
  - id: _unlabeled_step_9
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/pick_value/pick_value/0.2.0
    tool_version: 0.2.0
    tool_shed_repository:
      changeset_revision: b19e21af9c52
      name: pick_value
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: style_cond|type_cond|pick_from_0|value
        source: Bowtie2-map reads against a built in reference genome/mapping_stats
      - id: style_cond|type_cond|pick_from_1|value
        source: Bowtie2-map reads against a reference genome in the history/mapping_stats
    out: []
    state:
      style_cond:
        pick_style: first
        type_cond:
          param_type: data
          pick_from:
            - {}
            - {}
    tool_state: null
    uuid: 3c8028f2-744c-4276-a733-c4f3cb2b4b2b
  - id: MultiQC
    label: MultiQC
    doc: Aggregation of the mapping statistics for all samples
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/multiqc/multiqc/1.35+galaxy5
    tool_version: 1.35+galaxy5
    tool_shed_repository:

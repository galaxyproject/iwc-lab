class: GalaxyWorkflow
label: Host or Contamination Removal on Short-Reads
doc: This workflow takes paired-end Illumina fastq(.gz) files and runs Bowtie to map the reads against a reference genome (human, by default) and keep only the reads that do not align. MultiQC is used to aggregate the mapping reports.
inputs:
  - id: Choose Reference Genome
    type: string
    optional: false
    restrictions:
      - Use a built-in genome index
      - Use a reference genome from the history
    doc: Choose a reference genome from a built in list or from the history
  - id: Short-reads
    type: collection
    collection_type: list:paired
    optional: false
    fields: null
    column_definitions: null
    doc: Short-reads as a paired-end collection of fastqsanger(.gz) files
  - id: Host/Contaminant Reference Genome
    type: string
    optional: false
    restrictOnConnections: true
    doc: Reads not mapping to this reference genome will be kept
  - id: Reference genome file
    type: data
    optional: true
    doc: Select a reference genome from the history
outputs:
  - id: Contamination Filtered Reads from Local Index
    outputSource: Bowtie2-map reads against a built in reference genome/output_unaligned_read_pairs
  - id: Bowtie2 Mapping Statistics from Local Index
    outputSource: Bowtie2-map reads against a built in reference genome/mapping_stats
  - id: Contamination Filtered Reads from Reference Input
    outputSource: Bowtie2-map reads against a reference genome in the history/output_unaligned_read_pairs
  - id: Bowtie2 Mapping Statistics from Reference Input
    outputSource: Bowtie2-map reads against a reference genome in the history/mapping_stats
  - id: MultiQC HTML Report
    outputSource: MultiQC/html_report
steps:
  - id: _unlabeled_step_4
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/map_param_value/map_param_value/0.2.0
    tool_version: 0.2.0
    tool_shed_repository:
      changeset_revision: 022a635f2283
      name: map_param_value
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input_param_type|input_param
        source: Choose Reference Genome
    out: []
    tool_state:
      input_param_type:
        type: text
        __current_case__: 0
        input_param:
          __class__: ConnectedValue
        mappings:
          - __index__: 0
            from: Use a built-in genome index
            to: "True"
      output_param_type: boolean
      unmapped:
        on_unmapped: default
        __current_case__: 2
        default_value: "False"
    uuid: ec5ec63e-3814-4ea1-80c2-1f026514be8c
  - id: _unlabeled_step_5
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/map_param_value/map_param_value/0.2.0
    tool_version: 0.2.0
    tool_shed_repository:
      changeset_revision: 022a635f2283
      name: map_param_value
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: input_param_type|input_param
        source: Choose Reference Genome
    out: []
    tool_state:
      input_param_type:
        type: text
        __current_case__: 0
        input_param:
          __class__: ConnectedValue
        mappings:
          - __index__: 0
            from: Use a reference genome from the history
            to: "True"
      output_param_type: boolean
      unmapped:
        on_unmapped: default
        __current_case__: 2
        default_value: "False"
    uuid: 6ca71f29-0c73-43b5-9852-519094b0288a
  - id: _unlabeled_step_6
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/pick_value/pick_value/0.2.0
    tool_version: 0.2.0
    tool_shed_repository:
      changeset_revision: b19e21af9c52
      name: pick_value
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: style_cond|type_cond|pick_from_0|value
        source: Reference genome file
    out: []
    state:
      style_cond:
        pick_style: first
        type_cond:
          param_type: data
          pick_from:
            - {}
    tool_state: null
    uuid: 37595bb0-b106-4101-a6a8-d979aee71350
  - id: Bowtie2-map reads against a built in reference genome
    label: Bowtie2-map reads against a built in reference genome
    doc: Map the reads against a reference genome and output the ones not mapping the reference genome
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/bowtie2/bowtie2/2.5.5+galaxy0
    tool_version: 2.5.5+galaxy0
    tool_shed_repository:
      changeset_revision: a470b376503d
      name: bowtie2
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    in:
      - id: library|input_1
        source: Short-reads
      - id: reference_genome|index
        source: Host/Contaminant Reference Genome
      - id: when
        source: _unlabeled_step_4/output_param_boolean
    out:
      - id: output
        hide: true
      - id: output_unaligned_reads_l
        hide: true
      - id: output_unaligned_reads_r
        hide: true
      - id: mapping_stats
        rename: Bowtie2 mapping statistics
      - id: output_unaligned_read_pairs
        rename: Reads without host or contaminant reads
    tool_state:
      analysis_type:
        analysis_type_selector: simple
        __current_case__: 0
        presets: no_presets
      library:
        type: paired_collection
        __current_case__: 1
        input_1:
          __class__: ConnectedValue
        unaligned_file: true
        aligned_file: false
        paired_options:
          paired_options_selector: "no"
          __current_case__: 1
      reference_genome:
        source: indexed
        __current_case__: 0
        index:
          __class__: ConnectedValue
      rg:
        rg_selector: do_not_set
        __current_case__: 3
      sam_options:
        sam_options_selector: "no"
        __current_case__: 1
      save_mapping_stats: true
    when: $(inputs.when)
    uuid: 4f0ed86e-4ab8-4737-a980-41405a6c5295
  - id: Bowtie2-map reads against a reference genome in the history
    label: Bowtie2-map reads against a reference genome in the history
    doc: Map the reads against a reference genome and output the ones not mapping the reference genome
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/bowtie2/bowtie2/2.5.5+galaxy0
    tool_version: 2.5.5+galaxy0
    tool_shed_repository:
      changeset_revision: a470b376503d

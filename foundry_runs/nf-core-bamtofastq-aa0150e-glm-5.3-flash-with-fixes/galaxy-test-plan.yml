unresolved:
- kind: assertion
  description: 'fastq_info md5s are upstream test-evidence, but the Galaxy fastq_info wrapper writes its
    report per pair over an unzipped list:paired input; whether the element identifiers arrive as the
    pair ids (test/test2) and whether the report bytes match the source''s per-sample txt (wrapper may
    emit per-mate or combined format) is unverified until planemo.

    '
  blocking: false
  suggested_resolution: 'Run planemo first with the element-level md5 assertions; if the wrapper output
    shape differs, downgrade to has_text on a stable marker line and record the delta in the debug ledger.

    '
- kind: assertion
  description: 'Galaxy collection element identifiers for paired_reads come from __ZIP_COLLECTION__ (forward
    id of each pair). Expected test/test2 assumes zip forwards input1 ids; verify at planemo before trusting
    element-addressed checksums.

    '
  blocking: false
  suggested_resolution: Assert element_count first; add element-addressed checksums once ids confirmed.
omissions:
- target: multiqc_report content
  reason: 'The upstream snapshot checks only the path name (stable_name) of multiqc/multiqc_report.html
    — no content checksum; the HTML embeds timestamps and is not byte-stable. Existence only.

    '
  category: nondeterministic
- target: fastqc_pre_html / fastqc_pre_zip / fastqc_post_html / fastqc_post_zip content
  reason: 'Upstream snapshot lists these only by name (stable_name capture, no md5); FastQC HTML/zip embed
    run metadata. Asserted as existence/count only.

    '
  category: nondeterministic
- target: multiqc_data/ auxiliary files (log, parquet, citations, json)
  reason: 'The Galaxy MultiQC wrapper exposes only html_report (and stats); the auxiliary multiqc_data/*
    files are internal to the source pipeline''s published directory and are not workflow outputs. multiqc_citations.txt
    has an upstream md5 but no Galaxy output to bind it to.

    '
  category: no-stable-checkpoint
- target: pipeline_info/ software versions yml
  reason: Source-pipeline bookkeeping artifact (Nextflow-side versions.yml); no Galaxy counterpart.
  category: out-of-scope
- target: chr test case (tests/chr.nf.test)
  reason: 'The chr variant exercises region subsetting AND the single-end conversion path (test3.single_end
    BAM, SAMTOOLS_COLLATEFASTQ_SINGLE_END), which the Galaxy translation dropped (ledger single-end-path-dropped).
    Its input samplesheet uses a single-end BAM that cannot run through the list:paired build. Deferred:
    a paired-input chr case could be authored later if the single-end path is restored.

    '
  category: out-of-scope
warnings:
- code: no-upstream-expected-outputs
  message: 'fastqc_post_html and fastqc_pre_html carry no assertions: the upstream snapshot has no content
    checksums for FastQC outputs. The test case still has checksum-bearing outputs (paired_reads, flagstat,
    idxstats, stats, fastq_info), so the case is not assertion-free.

    '
  path: tests/default.nf.test.snap stable_name capture
- code: untranslatable-snapshot
  message: 'The snapshot''s versions.yml capture (per-process tool versions) and workflow.trace.succeeded().size()
    have no Galaxy workflow-test counterpart; tool versions are pinned by the workflow''s tool_shed_repository
    entries instead.

    '
  path: tests/default.nf.test content[0], content[1]
- code: untranslatable-snapshot
  message: 'The chr.nf.test candidate is not translated: it runs the single-end conversion path that the
    Galaxy workflow dropped. Recorded as an omission (out-of-scope) rather than an assertion.

    '
  path: tests/chr.nf.test::-profile test --input test_chr_samplesheet.csv

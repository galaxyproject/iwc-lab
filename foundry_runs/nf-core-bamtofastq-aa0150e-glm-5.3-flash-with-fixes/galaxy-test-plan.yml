plan_version: '1'
source:
  kind: nextflow
  name: nf-core/bamtofastq
  derived_from: test-evidence
  notes: 'Translated from tests/default.nf.test (-profile test), the candidate selected by summarize-nextflow.
    The nf-test snapshot (tests/default.nf.test.snap) carries per-file md5 tokens for the merged FASTQs,
    samtools flagstat/idxstats/stats, fastqutils info reports and multiqc_citations.txt; FastQC html/zip
    and the multiqc report appear only in the stable_name capture (paths, no content). The chr.nf.test
    candidate additionally exercises the single-end conversion path, which the Galaxy translation dropped
    (ledger single-end-path-dropped); it is recorded as out-of-scope rather than translated.

    '
workflow:
  title: BAM/CRAM to FASTQ conversion (nf-core/bamtofastq)
  label_source: draft
  notes: 'Labels read from the concrete galaxy-workflow.gxwf.yml draft (23 steps, extracted at loop endstate);
    labels are verifiable.

    '
test_cases:
- id: default_test_profile
  doc: 'Whole-pipeline conversion of two paired-end sorted BAMs (test, test2) with reference FASTA, read
    QC and stats enabled. Asserts the md5 of every converted FASTQ, the samtools flagstat/idxstats/stats
    reports and the fastq-utils info reports, plus collection shapes and existence of the FastQC and MultiQC
    outputs.

    '
  derived_from: test-evidence
  provenance: tests/default.nf.test::-profile test (nf-test snapshot tests/default.nf.test.snap)
  job_inputs:
  - workflow_label: alignments
    label_status: resolved
    description: 'Two-element list collection of sorted paired-end BAMs, element ids test and test2. Element
      fixtures (remote-url, SHA-1 verified 2026-11-12): test -> https://github.com/nf-core/test-datasets/raw/bamtofastq/test-datasets/data/genomics/homo_sapiens/illumina/bam/test.paired_end.sorted.bam
      (SHA-1:0799f89638bddd570439115c606f425c22d189b1); test2 -> https://github.com/nf-core/test-datasets/raw/bamtofastq/test-datasets/data/genomics/homo_sapiens/illumina/bam/test2.paired_end.sorted.bam
      (SHA-1:522fb037cea05b9d41dd69647f27a644838bf507). Source: test_bam_samplesheet.csv rows; the published
      samplesheet names test2.paired_end.recalibrated.bam which 404s — sorted variant is the live row
      content.'
    collection_shape: list
    datatype: bam
    fixture:
      storage: remote-url
      location: null
      checksum: null
      provenance: test-data-refs.json alignments ref (test_bam_samplesheet.csv rows; element fixtures
        carry their own URLs+SHA-1)
  - workflow_label: fasta
    label_status: resolved
    description: Reference FASTA (chr22 toy genome) from the source test params.
    collection_shape: null
    datatype: fasta
    fixture:
      storage: remote-url
      location: https://raw.githubusercontent.com/nf-core/test-datasets/modules/data/genomics/homo_sapiens/genome/genome.fasta
      checksum: SHA-1:56e7a0c035e2fce8ebe497d3704431d7586fd444
      provenance: params.fasta of tests/default.nf.test
  - workflow_label: read_qc
    label_status: resolved
    description: Boolean control; the test case runs read QC — workflow default true covers it.
    collection_shape: null
    datatype: null
    fixture:
      storage: null
      location: null
      checksum: null
      provenance: workflow default true matches the source test
  - workflow_label: stats
    label_status: resolved
    description: Boolean control; the test case runs stats — workflow default true covers it.
    collection_shape: null
    datatype: null

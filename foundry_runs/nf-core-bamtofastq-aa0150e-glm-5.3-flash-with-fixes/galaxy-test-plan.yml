  - workflow_label: chr
    label_status: resolved
    description: Region string left unset (chr branch off in the selected test case).
    collection_shape: null
    datatype: null
    fixture:
      storage: null
      location: null
      checksum: null
      provenance: unset in tests/default.nf.test
  - workflow_label: multiqc_title
    label_status: resolved
    description: MultiQC report title; left at workflow default.
    collection_shape: null
    datatype: null
    fixture:
      storage: null
      location: null
      checksum: null
      provenance: no upstream declaration; workflow default
  - workflow_label: multiqc_config
    label_status: resolved
    description: Optional MultiQC config; unset in the selected test case.
    collection_shape: null
    datatype: yaml
    fixture:
      storage: null
      location: null
      checksum: null
      provenance: unset in tests/default.nf.test
  expected_outputs:
  - workflow_label: paired_reads
    label_status: resolved
    description: list:paired collection of merged converted FASTQs (mapped + unmapped concatenated per
      mate), one pair per sample.
    output_kind: collection
    collection_shape: list:paired
    assertion_intent:
    - family: element_count
      intent: Collection has one pair per sample (test, test2).
      expected_value: 2
      tolerance: null
      element_identifier: null
      evidence: fixture-derived
      confidence: high
    - family: checksum
      intent: md5 of merged mate-1 FASTQ for sample test (source reads/test_1.merged.fastq.gz).
      expected_value: md5:9b0c08862a5e47e842a485ddad31b871
      tolerance: null
      element_identifier: test/forward
      evidence: test-evidence
      confidence: high
    - family: checksum

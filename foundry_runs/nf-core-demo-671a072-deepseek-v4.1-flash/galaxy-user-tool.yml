class: GalaxyUserTool
id: cowpy
version: 1.1.5
name: cowpy ASCII art generator
description: Generates a cow-themed ASCII art message (nf-core/demo local module).
container: community.wave.seqera.io/library/cowpy:1.1.5--3db457ae1977a273
shell_command: echo "nf-core rules!" | cowpy > cowpy.txt
inputs: []
outputs:
  - name: cowpy_txt
    type: data
    format: txt
    from_work_dir: cowpy.txt
    label: cowpy output text
help:
  format: markdown
  content: |
    Runs the nf-core/demo `COWPY` step: pipes the fixed message
    `nf-core rules!` into `cowpy` and writes the ASCII-art result to
    `cowpy.txt`. The step takes no inputs and has no parameters.

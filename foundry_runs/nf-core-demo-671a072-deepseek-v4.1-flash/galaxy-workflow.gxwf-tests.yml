- doc: 'nf-core/demo test profile: two paired-end samples and one single-end sample (6 FASTQ files total) through FastQC, seqtk trimming, MultiQC and cowpy. Input is a flat per-file list; the nf-core samplesheet rows are flattened at import. Translated from tests/default.nf.test::-profile test.'

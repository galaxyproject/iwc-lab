entries:
- id: index-sample-wrapper-no-index-dataset
  status: resolved
  kind: gap
  blocking: true
  raised_by: implement-galaxy-tool-step
  step: index_sample
  unmet: index_sample must produce a separate BAM or CRAM index dataset per sample (TODO_index), which classify_layout, flagstat, idxstats, stats, chr_extract, the four select steps and pick_bai consume
  missing: the only Tool Shed wrapper that indexes a file is jackcurragh/ribogalaxy_samtools_index samtools_index 2.0.4 (changeset d90d874e1d9e; weak; its citations and description confirm it runs samtools index). Its parsed_tool declares one output, output1 of format bam, with no discover_datasets, so no separate index dataset can be bound to TODO_index
  resolved_by: repair-galaxy-draft-topology
  supersedes: null
  note: 'Closed by repair-galaxy-draft-topology: remove-step index_sample, chr_index and pick_bai; rewire the consumers to the sample BAM collection (index no longer a separate dataset). The index dependencies of idxstats and chr_extract are recorded as plain entries. Decision index-datasets-removed-bam-metadata.'

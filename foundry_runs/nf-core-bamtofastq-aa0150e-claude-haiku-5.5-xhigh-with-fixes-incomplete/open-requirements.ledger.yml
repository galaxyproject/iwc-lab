  supersedes: null
  note: Not blocking. Verify at the first concrete run with a mixed BAM (the no_bai test sheet).
- id: select-uu-um-mu-unconsumed
  status: open
  kind: gap
  raised_by: repair-galaxy-draft-topology
  step: select_uu
  unmet: select_uu, select_um and select_mu (realized, bound to iuc samtools_view 1.22+galaxy2) no longer feed any step after the union selection
  missing: implementation cannot remove realized steps, so they still run and their outputs are unused
  resolved_by: null
  supersedes: null
  note: Not blocking. Remove them in a later edit that is allowed to remove realized steps, or keep as labelled waste.
decisions:
- id: reference-inputs-explicit-optional-data
  decided_by: nextflow-summary-to-galaxy-reference-data
  decision: Expose fasta (data, format fasta, optional) and fasta_fai (data, format fai, optional) as explicit workflow inputs. No genome key, no data tables.
  rationale: 'v1 posture from the mapping note: explicit optional inputs with in-tool rebuild. Both params are curated path params with identical used_by attribution.'
  evidence:
  - summary reference_assets[] (fasta, fasta_fai)
  - source/workflows/bamtofastq.nf fasta_fai channel
- id: genome-key-not-carried
  decided_by: nextflow-summary-to-galaxy-reference-data
  decision: Do not carry the genome key, conf/igenomes.config genomes map, igenomes_base, or igenomes_ignore into the Galaxy surface.
  rationale: Recorded as the dropped entry genome-key-no-galaxy-data-table. The igenomes controls are infrastructure, not data (params note, runtime-control exclusion).
  evidence:
  - nextflow-params-to-galaxy-inputs.md (Reference data)
  - source/main.nf:37-38
- id: fai-rebuild-in-tool
  decided_by: nextflow-summary-to-galaxy-reference-data
  decision: When fasta_fai is absent, the consuming Galaxy tool builds the index in-tool. No workflow-level indexing step.
  rationale: 'Mapping note: in-tool is preferred below about three rebuilds. The .fai is built once per run and used by several consumers, but only as a per-run cost; no sharing requirement is documented.'
  evidence:
  - nextflow-to-galaxy-reference-data-mapping.md (Why in-tool rebuild)
  - source/subworkflows/local/prepare_indices/main.nf
- id: input-as-sample-sheet
  decided_by: nextflow-summary-to-galaxy-interface
  decision: Model input as a sample_sheet collection (one bam or cram dataset per row) with column_definitions sample_id (string, required, regex ^\S+$) and file_type (string, required, restrictions bam and cram).
  rationale: sample_id names outputs and file_type drives --reference; sample_sheet is the only variant that maps over per-row datasets; index is dropped (entry sample-index-column-not-carried).
  evidence:
  - source/assets/schema_input.json
  - summary sample_sheets[0] (discovered_via nf-schema)
  - galaxy-sample-sheet-collections.md (Variants; Mapping rules)
- id: reads-split-by-layout
  decided_by: nextflow-summary-to-galaxy-interface
  decision: Expose paired_reads (list:paired, fastqsanger.gz) and single_reads (list, fastqsanger.gz) as two outputs, not one mixed collection.
  rationale: The source has two producers selected per sample by CHECKPAIREDEND; the channel-shape note marks paired_or_unpaired as medium confidence.
  evidence:
  - source/workflows/bamtofastq.nf (conversion_input.ch_single and ch_paired)
  - nextflow-to-galaxy-channel-shape-mapping.md (Mixed single-end and paired-end reads)
- id: samtools-reports-checkpoint-gated-by-no-stats
  decided_by: nextflow-summary-to-galaxy-interface
  decision: Expose samtools_flagstat, samtools_idxstats and samtools_stats as outputs gated by no_stats. samtools_flagstat is the test checkpoint.
  rationale: All three are published user-facing reports (conf/modules.config); flagstat content is stable and tied to input record counts (galaxy-workflow-testability-design.md).
  evidence:
  - source/conf/modules.config (SAMTOOLS_FLAGSTAT, SAMTOOLS_IDXSTATS, SAMTOOLS_STATS publishDir)
- id: control-flags-kept
  decided_by: nextflow-summary-to-galaxy-interface
  decision: Keep chr, no_stats, samtools_collate_fast and reads_in_memory as scalar inputs. Exclude the publish, notification, CLI and institutional params listed in the interface brief.
  rationale: Each kept flag changes a step or a command argument; each excluded param has a recorded class and assessment in the brief.
  evidence:
  - nextflow-params-to-galaxy-inputs.md (Control params)
  - summary params[] and workflow.conditionals[]
- id: multiqc-customisation-kept
  decided_by: nextflow-summary-to-galaxy-interface
  decision: Keep multiqc_title as a string and multiqc_config, multiqc_logo and multiqc_methods_description as optional data inputs with no format.
  rationale: 'Each changes a user-visible report. Format omitted: no registry-backed extension for these files (datatype note, Registry constraint).'
  evidence:
  - source/conf/modules.config (MULTIQC ext.args)
  - nextflow-path-glob-to-galaxy-datatype.md (Registry constraint)
- id: fai-and-sample-index-workflow-tier
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: Build the FASTA index (fai) and the per-sample BAM/CRAM indexes as workflow-tier steps, not inside each consuming tool. The fai step runs only when fasta is given and fasta_fai is absent.
  rationale: 'The source builds both in PREPARE_INDICES as workflow-level steps. Each index feeds about ten steps per sample, and the mapping note''s threshold (more than about three rebuilds: workflow tier) applies.'
  evidence:
  - source/subworkflows/local/prepare_indices/main.nf
  - nextflow-to-galaxy-reference-data-mapping.md (Heavy indexes, repeated use)
  supersedes: fai-rebuild-in-tool
- id: per-element-layout-routing
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: Route each sample to the paired or the single path with a per-sample boolean (nodes N6, N7) read by mapped when gates on both paths, then drop null elements. Do not run both paths for every sample.
  rationale: The source branches each sample on its layout. A per-element boolean with mapped when gates is the verified Galaxy route, and running the paired path on single-end data would not match the source.
  evidence:
  - source/workflows/bamtofastq.nf (conversion_input branch)
  - galaxy-sample-sheet-collections.md (per-element when, verified)
- id: chr-inline-when-with-pick-fanin
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: Gate the two chr steps inline on chr; fan the original and the region collections into one with pick_value (mode the_only_non_null). Low confidence, flagged.
  rationale: 'Two steps and a rebinding: the cascade is short, so inline when rather than a subworkflow (conditional-note heuristics). The alternatives are mutually exclusive by construction, so the_only_non_null.'
  evidence:
  - nextflow-conditional-to-galaxy-subworkflow-when.md
  - source/workflows/bamtofastq.nf (if params.chr)
- id: samtools-reports-inline-when
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: Gate the three samtools report steps inline on not no_stats. No subworkflow boundary.
  rationale: The three steps are independent (none chains into another), and the conditional note favours inline when for short independent cascades.
  evidence:
  - source/conf/modules.config (ext.when = !params.no_stats)
- id: versions-node-internal-to-multiqc
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: Keep the software-versions input as an internal node feeding MultiQC, and do not publish it. The gap multiqc-versions-input-no-galaxy-source stays open.
  rationale: The source consumes the versions file in MULTIQC (ch_multiqc_files), so the drop of the published copy does not remove the input.
  evidence:
  - source/workflows/bamtofastq.nf (ch_collated_versions mixed into ch_multiqc_files)
- id: cram-reference-passed-always
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: Pass the reference to every conversion and view step. Do not carry file_type as a per-element tool parameter; the element datatype (bam or cram) carries the format.
  rationale: The source passes --reference only for CRAM rows (meta.filetype). Whether passing a reference for BAM rows is harmless to samtools is not verified.
  evidence:
  - source/modules/local/checkpairedend/main.nf (meta.filetype == cram)
  - nextflow-galaxy-interface.md (file_type column)
- id: no-high-or-medium-iwc-exemplar
  decided_by: compare-against-iwc-exemplar
  decision: Report no High or Medium nearest exemplar for this pipeline. Use data-fetching/sra-manifest-to-concatenated-fastqs as a Low-confidence pattern excerpt only. Do not write the iwc-exemplar sibling file.
  rationale: No IWC workflow converts BAM or CRAM to FASTQ. The sra-manifest workflow shares topology and output shape but not the analysis (read acquisition). The procedure writes the sibling file only for High or Medium exemplars.
  evidence:
  - iwc-comparison-notes.md (Result; Candidates ranked)
  - IWC c07557f, 133 .ga workflows, grep for conversion tools: zero matches
- id: iwc-sra-manifest-pattern-excerpt-only
  decided_by: compare-against-iwc-exemplar
  decision: Use the converted sra-manifest concatenation steps only as a labelled pattern excerpt in the comparison notes. Do not adopt its fetch tool, its relabel tool or its manifest input.
  rationale: Low-confidence cross-domain matches may surface a short excerpt for pattern comparison, labelled as such. The fetch and relabel tools belong to the per-step loop.
  evidence:
  - iwc-comparison-notes.md (Labeled excerpt)
- id: chr-fanin-first-non-null
  decided_by: nextflow-summary-to-galaxy-template
  decision: Fan the region BAM and region index into the sample collections with pick_value in mode first_non_null, region first and original second, not the_only_non_null.
  rationale: The original collection is always non-null, so the_only_non_null fails whenever a region is extracted. first_non_null picks the region when chromosome_filter is set and the original otherwise.
  evidence:
  - galaxy-workflow-draft.gxwf.yml (pick_bam, pick_bai)
  - nextflow-conditional-to-galaxy-subworkflow-when.md (the_only_non_null is for branches exclusive by construction)
  supersedes: chr-inline-when-with-pick-fanin
- id: multiqc-fed-by-samtools-reports
  decided_by: nextflow-summary-to-galaxy-template
  decision: MultiQC takes the three samtools report collections, plus the config, logo, methods description and title. The source's MultiQC inputs are not all wired.
  rationale: The source's inputs (versions, workflow summary, methods description) carry no sample data, so a tool step with a required data input has nothing to reduce. IWC rnaseq-pe aggregates the workflow's own QC into MultiQC. This departs from the source and is proposed as a brief change for expert confirmation.
  evidence:
  - workflows/bamtofastq.nf (MULTIQC inputs)
  - iwc-comparison-notes.md (rnaseq-pe pattern evidence)
- id: multiqc-versions-not-fed
  decided_by: nextflow-summary-to-galaxy-template
  decision: MultiQC has no software-versions input. The versions gap stays a recorded gap, not a tool need.
  rationale: Galaxy keeps no workflow file of per-tool versions (open entry multiqc-versions-input-no-galaxy-source). Leaving the input out keeps the topology closed without a fabricated versions step.
  evidence:
  - galaxy-workflow-draft.gxwf.yml (multiqc)
- id: wrapper-tiers-identity-pinned-from-iwc
  decided_by: nextflow-summary-to-galaxy-template
  decision: Identity-pin a tool step only when a local IWC workflow uses the same wrapper for the same operation; defer the rest. No step is Resolved.
  rationale: 'No step has a full evidence set for wrapper, parameters and port names: the tool cache is empty, so built-in and wrapper state keys cannot be checked. Identity-pinned steps keep tool_version TODO and carry _plan_state.'
  evidence:
  - iwc-tool-ids-counts (discovery)
- id: sibling-pairing-positional
  decided_by: nextflow-summary-to-galaxy-template
  decision: Pair sibling collections by position in the draft. Identifier synchronisation is not a separate node.
  rationale: Siblings derived from one element set under the same per-element booleans have the same order and membership. An identifier join would need a key Galaxy cannot reconstruct after the chromosome rename.
  evidence:
  - draft-positional-sibling-pairing (ledger entry)
  - nextflow-galaxy-data-flow.md (open question 1, chromosome re-keying)
- id: index-datasets-removed-bam-metadata
  decided_by: repair-galaxy-draft-topology
  decision: Remove index_sample, chr_index and pick_bai. Consumers read the sample BAM collection (classify_layout, flagstat, idxstats, stats, chr_extract, select_mm, select_uu, select_um, select_mu). The index is carried by the BAM dataset metadata.
  rationale: The only indexing wrapper produces no index dataset. Only idxstats and the region query need an index; flag-based views, collate, CHECKPAIREDEND and flagstat/stats read the file record by record (source command blocks). Preserves every label and checkpoint.
  evidence:
  - tool-summary-samtools_index.json (parsed_tool.outputs)
  - source/modules/local/checkpairedend/main.nf (samtools view on ${input})
  - source/conf/modules.config SAMTOOLS_VIEW_* ext.args (flag filters, no region)
- id: name-collate-before-paired-conversion
  decided_by: repair-galaxy-draft-topology
  decision: Insert a name-collate step before each paired FASTQ conversion (collate_mapped and collate_unmapped), gated by gate_paired, at draft tier.
  rationale: The source runs samtools collate before samtools fastq, and the FASTQ pairs need adjacent mates; the bound converter alone cannot pair them.
  evidence:
  - source/modules/nf-core/samtools/collatefastq/main.nf (collate line 37, fastq line 45)
  - open-requirements entry collate-mapped-needs-name-collate-producer
- id: name-union-selection-replaces-merge
  decided_by: repair-galaxy-draft-topology
  decision: Select the unmapped union in one samtools_view pass with an expression filter (draft tier), feeding collate_unmapped_records directly; remove the merge.
  rationale: The merge takes one multiple input per job and the sibling selections cannot be grouped per sample with stock collection operations; the union is one set in the source flags.
  evidence:
  - source/conf/modules.config (SAMTOOLS_VIEW_UNMAP_UNMAP, SAMTOOLS_VIEW_UNMAP_MAP, SAMTOOLS_VIEW_MAP_UNMAP ext.args)
  - tool-summary-merge_unmapped.json (bamfiles)
  - tool-summary-chr_extract.json (filter_config cond_expr)
discoveries:
- id: summary-getgenomeattribute-defaults-missed
  raised_by: nextflow-summary-to-galaxy-reference-data
  evidence: 'main.nf:37-38 sets params.fasta and params.fasta_fai from getGenomeAttribute through ?: fallbacks. The summary lists both as nextflow_schema params with source_expression null and empty reference_assets evidence.'
  impact: The key-expanded classification was verified from source. Logged as feedback summarize-nextflow-getgenomeattribute-defaults-missed.
- id: summary-channel-branch-rebuild-missed
  raised_by: nextflow-summary-to-galaxy-reference-data
  evidence: PREPARE_INDICES routes the fasta_fai channel on meta.index; index == false goes to SAMTOOLS_FAIDX. reference_rebuilds[] is empty.
  impact: The compute-if-missing class was verified from source. Logged as feedback summarize-nextflow-channel-branch-rebuild-missed.
- id: schema-help-text-copied-from-alignment-template
  raised_by: nextflow-summary-to-galaxy-reference-data
  evidence: 'nextflow_schema.json help_text for fasta and fasta_fai: ''mandatory if --genome is not specified'', ''BWA index will be generated''. This pipeline builds no BWA index.'
  impact: Requiredness is taken from source, not from help text.
- id: sample-index-compute-if-missing
  raised_by: nextflow-summary-to-galaxy-reference-data
  evidence: PREPARE_INDICES sends samples with index == false to SAMTOOLS_INDEX; the sample sheet's index column is optional data.
  impact: Per-sample, out of reference scope. Handed to interface and data-flow Molds as an in-tool samtools index rebuild.
- id: fastqc-outputs-unpublished-unconsumed
  raised_by: nextflow-summary-to-galaxy-interface
  evidence: conf/modules.config defines no publishDir for FASTQC_PRE_CONVERSION, FASTQC_POST_CONVERSION or FASTQUTILS_INFO; workflows/bamtofastq.nf does not consume their outputs (the FastQC mix is commented out).
  impact: The source computes these outputs and drops them. The data-flow Mold must not expose them as outputs unless it decides otherwise.
- id: chr-rebinds-meta-id
  raised_by: nextflow-summary-to-galaxy-interface
  evidence: 'workflows/bamtofastq.nf: ch_input_new = ch_input_chr.map { ... new_id = file.baseName ... }.'
  impact: Output identifiers change with chr. Recorded as gap chr-changes-output-identifiers.
- id: samtools-reports-describe-input-not-reads
  raised_by: nextflow-summary-to-galaxy-interface
  evidence: PRE_CONVERSION_QC runs SAMTOOLS_FLAGSTAT, _IDXSTATS and _STATS on the input BAM/CRAM (ch_input), before conversion.
  impact: The checkpoint describes input records, not output reads. The test plan must not compare them with read counts without a conversion-aware rule.
- id: summary-sample-sheet-index-columns
  raised_by: nextflow-summary-to-galaxy-interface
  evidence: 'sample_sheets[0].columns: sample_id (meta), mapped (data, required), index (data, optional), file_type (meta, enum bam/cram).'
  impact: The row has one required element dataset and one optional companion dataset. Only the first is carried in v1 (decision input-as-sample-sheet).
- id: source-branch-on-layout-not-in-conditionals
  raised_by: nextflow-summary-to-galaxy-data-flow
  evidence: workflow.conditionals[] holds three parameter guards (params.chr, !no_read_QC, !no_stats). The layout branch (conversion_input = ch_input_new.branch on meta.single_end) is driven by channel content from CHECKPAIREDEND, not by a parameter, and is absent from conditionals[].
  impact: The data-flow step had to find the per-sample routing in the edges and the workflow source. Logged as feedback summarize-nextflow-conditionals-omit-data-driven-branch.
- id: test-sheets-layout-mix
  raised_by: nextflow-summary-to-galaxy-data-flow
  evidence: test_bam_samplesheet_no_bai.csv has two paired rows and one single-end row (test3). test_chr_samplesheet.csv has one single-end row. Both CRAM sheets are all paired.
  impact: The no_bai test exercises mixed routing; the CRAM tests exercise an empty single-end path.
- id: join-keys-on-whole-meta
  raised_by: nextflow-summary-to-galaxy-data-flow
  evidence: 'ALIGNMENT_TO_FASTQ: COLLATE_FASTQ_MAP.out.fastq.join(COLLATE_FASTQ_UNMAP.out.fastq) joins on the full meta map (id, filetype, single_end).'
  impact: The effective key is sample_id only when sample_id is unique.
- id: samtools-chr-prefix-identifiers
  raised_by: nextflow-summary-to-galaxy-data-flow
  evidence: conf/modules.config SAMTOOLS_CHR ext.prefix = ${meta.id}.${params.chr} (dots and spaces become underscores); workflows/bamtofastq.nf rebinds meta.id to file.baseName.
  impact: Chromosome-branch identifiers are sample.chr. Recorded as gap chr-layout-flag-rekeying.
- id: versions-yaml-feeds-multiqc
  raised_by: nextflow-summary-to-galaxy-data-flow
  evidence: 'workflows/bamtofastq.nf: ch_collated_versions = softwareVersionsToYAML(...).mix(...).collectFile(storeDir: outdir/pipeline_info); then ch_multiqc_files = ch_multiqc_files.mix(ch_collated_versions).'
  impact: The interface drop of the published versions file does not remove the input to MultiQC. Recorded as gap multiqc-versions-input-no-galaxy-source.
- id: multiqc-inputs-exclude-qc
  raised_by: nextflow-summary-to-galaxy-data-flow
  evidence: 'MULTIQC inputs in workflows/bamtofastq.nf: versions, workflow summary, methods description. PRE_CONVERSION_QC outputs are not mixed in; the ALIGNMENT_TO_FASTQ zip line is commented out.'
  impact: The faithful report has little QC content. Recorded as gap multiqc-report-without-qc-content.
- id: iwc-sra-manifest-outputs-split-by-layout
  raised_by: compare-against-iwc-exemplar
  evidence: data-fetching/sra-manifest-to-concatenated-fastqs exposes paired_output (list:paired) and single_output (list) as separate outputs, relabelling the single and paired collections separately.
  impact: Corroborates the reads-split-by-layout decision (interface and data-flow briefs). No change to the decision.
- id: iwc-relabel-from-table-candidate-mechanism
  raised_by: compare-against-iwc-exemplar
  evidence: The sra-manifest exemplar relabels collections with __RELABEL_FROM_FILE__ and a label table generated in the workflow (SRA plus sample identifiers).
  impact: 'A candidate mechanism for chr-layout-flag-rekeying. It is not a resolution: the table still needs a rule that recovers the sample id from a chromosome-named element.'
- id: iwc-pick-value-dataset-level-only
  raised_by: compare-against-iwc-exemplar
  evidence: transcriptomics/rnaseq-pe uses pick_value on MultiQC report and stats datasets (style_cond pick_from_0 and pick_from_1). No corpus workflow uses it on collections in the workflows reviewed.
  impact: Corpus evidence does not show pick_value over collections. chr-fan-in-pick-value-collections stays open.
- id: iwc-rnaseq-multiqc-fed-by-workflow-qc
  raised_by: compare-against-iwc-exemplar
  evidence: 'transcriptomics/rnaseq-pe: the MultiQC inputs are the workflow''s own trimming, alignment and counting outputs, with or without extra QC chosen by pick_value.'
  impact: Corpus precedent for a MultiQC report that aggregates the workflow's QC. Bears on multiqc-report-without-qc-content (expert decision); does not settle it.
- id: iwc-sra-manifest-tests-size-only
  raised_by: compare-against-iwc-exemplar
  evidence: data-fetching/sra-manifest-to-concatenated-fastqs-tests.yml asserts has_size (with delta) on each FASTQ element; no content or count assertions.
  impact: A weaker test style than the counts preferred in the testability note. Routed to the test-plan skill.
- id: iwc-tool-ids-counts
  raised_by: nextflow-summary-to-galaxy-template
  evidence: 'IWC c07557f .ga tool ids and step counts: samtools_view 1.22+galaxy2 (17); samtools_merge 1.22+galaxy2 (3); devteam samtools_stats 2.0.9 (11); devteam samtools_idxstats 2.0.8 (1); iuc multiqc 1.35+galaxy4 and 5 (42); artbio cat_multi_datasets 1.4.3 (9); iuc pick_value 0.2.0 (105); param_value_from_file 0.1.0 (61); __UNZIP_COLLECTION__ 1.0.0 (11); __ZIP_COLLECTION__ 1.0.0 (2); __BUILD_LIST__ 1.2.0 (10). Zero uses: samtools index, faidx, flagstat, collate, fastq; __FILTER_NULL__; cat1.'
  impact: Basis for the identity-pinned and deferred tiers. It shows the wrapper is used elsewhere, not that its parameters or port names match this pipeline.
brief_change_recommendations:
- id: multiqc-report-aggregates-samtools-reports
  raised_by: nextflow-summary-to-galaxy-template
  proposed_change: State that multiqc_report aggregates the samtools flagstat, idxstats and stats reports as well as the methods description and config (a departure from the source's MultiQC inputs).
  reason: The source's MultiQC inputs carry no sample data, so the step has nothing to reduce as a tool step. The draft feeds the samtools reports (IWC rnaseq-pe precedent).
  evidence:
  - decision multiqc-fed-by-samtools-reports
  - iwc-comparison-notes.md
  status: proposed

entries:
- id: summarize-nextflow-subworkflow-kind-utility-not-applied
  raised_by: summarize-nextflow
  observed_in:
    mold: summarize-nextflow
    path: content/molds/summarize-nextflow/index.md
    revision: 21
    content_hash: 12fda0aa7f41e1899f921f4c9970af864e0022b25610e8f4fb6b4eba0a62d499
    foundry_head: df991d0d789b0a29618cbcdbe7eb6d9508f1f062
  subject:
    kind: mold
    label: summarize-nextflow
    locator: content/molds/summarize-nextflow/index.md
    content_hash: 12fda0aa7f41e1899f921f4c9970af864e0022b25610e8f4fb6b4eba0a62d499
  kind: defect
  severity: major
  what: The deterministic output marked PIPELINE_INITIALISATION, PIPELINE_COMPLETION and UTILS_NFSCHEMA_PLUGIN as kind 'pipeline' and gave them non-empty calls, although the procedure names PIPELINE_INITIALISATION and PIPELINE_COMPLETION as utility and says utility subworkflows have empty calls.
  expected: Classify subworkflows that invoke no pipeline processes as utility with empty calls in the deterministic pass. If the LLM pass is meant to do this, the procedure should say so.
  evidence: 'summary subworkflows[]: those three were kind pipeline; UTILS_NEXTFLOW_PIPELINE and UTILS_NFCORE_PIPELINE were utility. Corrected by hand and recorded in the summary warnings. The cast history lists the utility-vs-pipeline split as a rev-2 change.'
  status: open
  issue: null
- id: summarize-nextflow-workflow-edges-include-operator-fragments
  raised_by: summarize-nextflow
  observed_in:
    mold: summarize-nextflow
    path: content/molds/summarize-nextflow/index.md
    revision: 21
    content_hash: 12fda0aa7f41e1899f921f4c9970af864e0022b25610e8f4fb6b4eba0a62d499
    foundry_head: df991d0d789b0a29618cbcdbe7eb6d9508f1f062
  subject:
    kind: mold
    label: summarize-nextflow
    locator: content/molds/summarize-nextflow/index.md
    content_hash: 12fda0aa7f41e1899f921f4c9970af864e0022b25610e8f4fb6b4eba0a62d499
  kind: gap
  severity: major
  what: The deterministic workflow.edges list uses operator-chain fragments as endpoints (for example from '[[:]', '[]', ']' and '}' into SAMTOOLS_CHR and MULTIQC), with no marker separating them from real edges. The output is still schema-valid.
  expected: Mark unreconciled edges (for example in notes, or with an explicit status) or leave them out, and have the validator flag endpoints that are neither a channel nor a process output.
  evidence: About 16 of the 33 deterministic edges had non-name endpoints; the tool also printed 'workflow graph extraction is intentionally partial in resolver v1'. Rebuilt 24 edges by reading workflows/bamtofastq.nf and subworkflows/local/*. Validation passed both before and after the rebuild.
  status: open
  issue: null
- id: summarize-nextflow-ternary-channel-factory-not-emitted
  raised_by: summarize-nextflow
  observed_in:
    mold: summarize-nextflow
    path: content/molds/summarize-nextflow/index.md
    revision: 21
    content_hash: 12fda0aa7f41e1899f921f4c9970af864e0022b25610e8f4fb6b4eba0a62d499
    foundry_head: df991d0d789b0a29618cbcdbe7eb6d9508f1f062
  subject:
    kind: mold
    label: summarize-nextflow
    locator: content/molds/summarize-nextflow/index.md
    content_hash: 12fda0aa7f41e1899f921f4c9970af864e0022b25610e8f4fb6b4eba0a62d499
  kind: gap
  severity: minor
  what: 'A workflow channel built by a ternary on a parameter (params.fasta ? channel.fromPath(params.fasta)... : channel.value(...)) is missing from workflow.channels, so the fasta input has no from_param link in the channel inventory.'
  expected: Emit channels whose construction is a ternary over factories, with construct taken from the factory in either branch and from_param set when a branch references params.X. Otherwise state in the procedure that ternaries are out of scope.
  evidence: workflows/bamtofastq.nf defines fasta_fai with that ternary; channels[] held 16 entries without it. Added by hand as fasta_fai (from_param fasta). reference_assets still records fasta and fasta_fai.
  status: open
  issue: null
- id: summarize-nextflow-getgenomeattribute-defaults-missed
  raised_by: nextflow-summary-to-galaxy-reference-data
  observed_in:
    mold: nextflow-summary-to-galaxy-reference-data
    path: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
    revision: 5
    content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
    foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
  subject:
    kind: mold
    label: summarize-nextflow
    locator: content/molds/summarize-nextflow/index.md
    content_hash: 12fda0aa7f41e1899f921f4c9970af864e0022b25610e8f4fb6b4eba0a62d499
  kind: defect
  severity: major
  what: 'The summary lists fasta and fasta_fai as nextflow_schema params with source_expression null. main.nf:37-38 sets both from getGenomeAttribute through ?: fallbacks (params.fasta = params.fasta ?: getGenomeAttribute(''fasta'')). The key-expanded signal the reference-data classification depends on is therefore missing from params[] and from reference_assets[] evidence.'
  expected: Record config-time getGenomeAttribute defaults in the entry script with source_kind getGenomeAttribute and the verbatim source_expression, as the summarize-nextflow procedure (section 3) already asks for this exact case.
  evidence: 'summary-nextflow.json reference_assets[] for fasta and fasta_fai: source_kind nextflow_schema, evidence []. The reference-data brief classified the bundle from main.nf directly.'
  status: open
  issue: null
- id: summarize-nextflow-channel-branch-rebuild-missed
  raised_by: nextflow-summary-to-galaxy-reference-data
  observed_in:
    mold: nextflow-summary-to-galaxy-reference-data
    path: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
    revision: 5
    content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
    foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
  subject:
    kind: mold
    label: summarize-nextflow
    locator: content/molds/summarize-nextflow/index.md
    content_hash: 12fda0aa7f41e1899f921f4c9970af864e0022b25610e8f4fb6b4eba0a62d499
  kind: gap
  severity: major
  what: reference_rebuilds[] is empty although PREPARE_INDICES runs SAMTOOLS_FAIDX on the index == false branch of the fasta_fai channel, which rebuilds the .fai when it is absent. The idiom is a channel branch on a metadata flag, not an if-guard on a param, and the reference-data mold's stated known gaps cover only positive-form if/else rebuilds.
  expected: Detect a compute-if-missing rebuild when a builder consumes the not-provided branch of a channel split on a metadata flag derived from a param, and emit a reference_rebuilds entry; otherwise name the idiom as a stated gap.
  evidence: 'subworkflows/local/prepare_indices/main.nf: fasta_branch.to_index feeds SAMTOOLS_FAIDX; ch_fasta_fai = fasta_branch.is_fasta_indexed.mix(fasta_newly_indexed).first(). summary reference_rebuilds: [].'
  status: open
  issue: null
- id: nextflow-summary-to-galaxy-reference-data-no-route-for-wrong-summary
  raised_by: nextflow-summary-to-galaxy-reference-data
  observed_in:
    mold: nextflow-summary-to-galaxy-reference-data
    path: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
    revision: 5
    content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
    foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
  subject:
    kind: mold
    label: nextflow-summary-to-galaxy-reference-data
    locator: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
    content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
  kind: gap
  severity: minor
  what: The Reading the summary section says to flag a missing signal as rebuild-unverified rather than re-parse source files, but gives no route when the summary is wrong rather than missing. Here the summary labels fasta and fasta_fai as plain schema params while main.nf defines them through getGenomeAttribute. Classifying from the summary alone would have dropped the key-expanded class; checking the source was not covered by the procedure.
  expected: State whether a summary-versus-source conflict on a reference asset is verified against source and recorded in the brief, or flagged and classified from the summary alone.
  evidence: The brief's Evidence section records the source check (main.nf:37-38, 106-115) and the summary discrepancy; the open ledger discoveries cite it.
  status: open
  issue: null
- id: galaxy-sample-sheet-collections-record-vs-implicit-mapping
  raised_by: nextflow-summary-to-galaxy-interface
  observed_in:
    mold: nextflow-summary-to-galaxy-interface
    path: content/molds/nextflow-summary-to-galaxy-interface/index.md
    revision: 6
    content_hash: 43966773391578490688098c9333f6eb2eaa94574755f5b6554e7f9b72a605c0
    foundry_head: 61da115975d155a36face0e83d5c28f638da7fca
  subject:
    kind: research
    label: galaxy-sample-sheet-collections
    locator: content/research/galaxy-sample-sheet-collections/index.md
    content_hash: 98736fdcd0c4f4698af4e0cd4c539b33e3d0db872de1e10487556b21033030ec
  kind: defect
  severity: major
  what: The note recommends sample_sheet:record for several heterogeneous path columns per row (Mapping from Nextflow sample sheets table; the params note repeats it), but its own Mapping rules say allow_implicit_mapping is True for everything except record. The note does not say how a record-variant input reaches mapped tools, and it has no rule for an optional companion path column (for example index), so for a row with one required data column and one optional companion data column the note gives no consistent Galaxy shape.
  expected: 'Reconcile the table with the mapping rules: state that record inputs cannot be mapped over, and give a shape for an optional companion dataset per row, or state that it is out of scope.'
  evidence: The interface step ruled out sample_sheet:record only by reading the mapping rules, not the table, and dropped the index column as a recorded loss (ledger entry sample-index-column-not-carried). Brief section Interface decisions 1 and Open questions 6.
  status: open
  issue: null
- id: summarize-nextflow-conditionals-omit-data-driven-branch
  raised_by: nextflow-summary-to-galaxy-data-flow
  observed_in:
    mold: nextflow-summary-to-galaxy-data-flow
    path: content/molds/nextflow-summary-to-galaxy-data-flow/index.md
    revision: 8
    content_hash: f71cc2b4ceb115d7d93c3dd2e622cbfafb8b9f338f1dd450ee5773f3c0a0e247
    foundry_head: 61da115975d155a36face0e83d5c28f638da7fca
  subject:
    kind: mold
    label: summarize-nextflow
    locator: content/molds/summarize-nextflow/index.md
    content_hash: 12fda0aa7f41e1899f921f4c9970af864e0022b25610e8f4fb6b4eba0a62d499
  kind: gap
  severity: minor
  what: 'workflow.conditionals[] holds only parameter-guarded branches (three entries: params.chr, !params.no_read_QC, !params.no_stats). The per-sample routing that sends each sample to the single-end or the paired-end path (conversion_input = ch_input_new.branch on meta.single_end, fed by CHECKPAIREDEND) is driven by channel content and is absent, so a consumer that reads conditionals[] alone misses it.'
  expected: Record channel-level branch predicates (a branch or filter on channel content) in conditionals[] or a sibling field, naming the producing process; or state that data-driven routing is outside the schema.
  evidence: summary workflow.conditionals[] has the three guards above; workflows/bamtofastq.nf has the conversion_input branch. The data-flow brief reconstructed the routing from edges and the source.
  status: open
  issue: null
- id: nextflow-summary-to-galaxy-data-flow-no-rule-for-remote-test-rows
  raised_by: nextflow-summary-to-galaxy-data-flow
  observed_in:
    mold: nextflow-summary-to-galaxy-data-flow
    path: content/molds/nextflow-summary-to-galaxy-data-flow/index.md
    revision: 8
    content_hash: f71cc2b4ceb115d7d93c3dd2e622cbfafb8b9f338f1dd450ee5773f3c0a0e247
    foundry_head: 61da115975d155a36face0e83d5c28f638da7fca
  subject:
    kind: mold
    label: nextflow-summary-to-galaxy-data-flow
    locator: content/molds/nextflow-summary-to-galaxy-data-flow/index.md
    content_hash: f71cc2b4ceb115d7d93c3dd2e622cbfafb8b9f338f1dd450ee5773f3c0a0e247
  kind: gap
  severity: minor
  what: The procedure asks that element identifiers be checked against the source test's rows. The summary holds only URLs for test rows (test_candidates[].inputs), and the mold says nothing about fetching remote fixtures. The check needed five public sample sheets downloaded from those URLs.
  expected: State whether remote test rows may be fetched for this check. If yes, name the fetch rule; if no, name the fallback (for example, rows recorded in the summary, or an unverified flag).
  evidence: The five test sheets were fetched from the nf-core/test-datasets URLs named in the summary; identifiers were unique in all five. The fetch is recorded in the brief's test rows table.
  status: open
  issue: null
- id: gxwf-convert-exit-1-on-fallback-with-output
  raised_by: compare-against-iwc-exemplar
  observed_in:
    mold: compare-against-iwc-exemplar
    path: content/molds/compare-against-iwc-exemplar/index.md
    revision: 12
    content_hash: 84abb427cbcbae5616ae22e4a7fa803f14350605c246638575b3a32c5ad9c6fb
    foundry_head: 94ce4ea20107680b467d03e8889b63689774e325
  subject:
    kind: related-project
    label: gxwf convert (@galaxy-tool-util/cli)
    locator: https://github.com/jmchilton/galaxy-tool-util-ts/tree/main/packages/cli
  kind: friction
  severity: minor
  what: gxwf convert --to format2 --compact wrote the complete converted workflow, but exited 1 because 7 of 13 steps fell back (unknown_tool, with the tool cache empty). A harness reading the exit code would treat a usable conversion as failed. The packaged convert reference covers the tool cache only for stateful re-encoding; it does not describe fallbacks or the exit code.
  expected: Exit 0 when the output is complete and only fallbacks occurred, or document the exit code; and document the fallback path and its cause in the convert reference.
  evidence: 'Conversion of data-fetching/sra-manifest-to-concatenated-fastqs.ga reported ''6/13 steps converted, 7 fell back'' with ''fallback breakdown: unknown_tool=7'', exit=1; the output (391 lines) was written.'
  status: open
  issue: null
- id: compare-against-iwc-exemplar-confidence-no-grade-for-same-data-different-analysis
  raised_by: compare-against-iwc-exemplar
  observed_in:
    mold: compare-against-iwc-exemplar
    path: content/molds/compare-against-iwc-exemplar/index.md
    revision: 12
    content_hash: 84abb427cbcbae5616ae22e4a7fa803f14350605c246638575b3a32c5ad9c6fb
    foundry_head: 94ce4ea20107680b467d03e8889b63689774e325
  subject:
    kind: mold
    label: compare-against-iwc-exemplar
    locator: content/molds/compare-against-iwc-exemplar/index.md
    content_hash: 84abb427cbcbae5616ae22e4a7fa803f14350605c246638575b3a32c5ad9c6fb
  kind: gap
  severity: minor
  what: The Confidence Levels table grades High and Medium by domain and subdomain, and grades 'No nearest exemplar' by the absence of domain or topology alignment. It does not say how to grade a candidate that matches the topology and data types but not the analysis (here, read acquisition versus BAM-to-FASTQ conversion). I graded it Low on the cross-domain row, which is a judgment call.
  expected: 'Add a row or rule for same-data-type, same-topology, different-analysis candidates: their grade, and whether a labelled pattern excerpt is allowed.'
  evidence: data-fetching/sra-manifest-to-concatenated-fastqs was graded Low and used only for a labelled pattern excerpt; the sibling file was not written. The grade decides whether the sibling exists.
  status: open
  issue: null

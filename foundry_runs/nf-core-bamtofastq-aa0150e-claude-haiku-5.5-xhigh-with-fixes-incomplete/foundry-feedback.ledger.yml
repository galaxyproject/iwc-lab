- id: nextflow-summary-to-galaxy-template-identity-pin-tool-id-form
  raised_by: nextflow-summary-to-galaxy-template
  observed_in:
    mold: nextflow-summary-to-galaxy-template
    path: content/molds/nextflow-summary-to-galaxy-template/index.md
    revision: 10
    content_hash: 77f885d640900cca7dac4a3bbb33308d4d8065e871c919c672487db61caf93ab

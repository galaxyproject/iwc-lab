- id: galaxy-workflow-draft-format-no-index-as-metadata-case
  raised_by: repair-galaxy-draft-topology
  observed_in:
    mold: repair-galaxy-draft-topology
    path: content/molds/repair-galaxy-draft-topology/index.md
    revision: 7
    content_hash: 692708480037be9680eda6be70c7fa2fd93604037432f7d94b6363266a6ca25e
    foundry_head: db8801f2f0a31746e35cf399dd96cdbb8aa36dcf
  subject:
    kind: research
    label: galaxy-workflow-draft-format
    locator: content/research/galaxy-workflow-draft-format/index.md
    content_hash: 8bb5cad935b261021277487ef21ae0d2cfc6739908886e88d9a2fcf4acf05597
  kind: gap
  severity: minor
  what: The draft format, the implement procedure and the repair procedure treat a tool's index as a separate dataset that one step outputs and a consumer takes as an input. The packaged notes do not say what to do when a wrapper keeps the index as dataset metadata. The samtools index wrapper declares one bam output and no discover_datasets, so the repair had to choose between a separate index path and consuming the indexed BAM, with no stated rule for the choice.
  expected: State how an index that is dataset metadata is represented in the draft, and when removing an index-producing step is allowed (for example, when no consumer needs the index).
  evidence: 'tool-summary-samtools_index.json parsed_tool.outputs: one output1 of format bam, discover_datasets []. The repair removed index_sample, chr_index and pick_bai (decision index-datasets-removed-bam-metadata) and kept the index dependencies as plain entries.'
  status: open
  issue: null
- id: nextflow-summary-to-galaxy-template-two-tool-module-modelled-as-one-node
  raised_by: implement-galaxy-tool-step
  observed_in:
    mold: nextflow-summary-to-galaxy-template
    path: content/molds/nextflow-summary-to-galaxy-template/index.md
    revision: 10
    content_hash: 77f885d640900cca7dac4a3bbb33308d4d8065e871c919c672487db61caf93ab
    foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
  subject:
    kind: mold
    label: nextflow-summary-to-galaxy-template
    locator: content/molds/nextflow-summary-to-galaxy-template/index.md
    content_hash: 77f885d640900cca7dac4a3bbb33308d4d8065e871c919c672487db61caf93ab
  kind: gap
  severity: major
  what: The draft models the source's paired-end conversion (COLLATE_FASTQ_MAP / COLLATE_FASTQ_UNMAP, which run samtools collate then samtools fastq) as one node with one tool. No Tool Shed wrapper covers both operations as one, so the chain surfaced only at implementation as a blocking gap (collate-mapped-needs-name-collate-producer), and a repair had to add two collate steps.
  expected: Where a source module chains two tools, the template should model the chain as tool needs (name-collate, then convert) rather than one node.
  evidence: source/modules/nf-core/samtools/collatefastq/main.nf (collate at line 37, fastq at line 45); the draft's collate_mapped and collate_unmapped nodes; the repair entry collate-mapped-needs-name-collate-producer.
  status: open
  issue: null
- id: nextflow-summary-to-galaxy-data-flow-sibling-fan-in-into-one-multiple-input-not-flagged
  raised_by: implement-galaxy-tool-step

    content_hash: 8bb5cad935b261021277487ef21ae0d2cfc6739908886e88d9a2fcf4acf05597
  kind: gap
  severity: minor
  what: The format note defines Identity-pinned as a concrete tool_id with tool_version TODO, but does not say whether tool_id keeps the version suffix that IWC .ga files carry (for example .../samtools_view/1.22+galaxy2) or uses the unversioned id. The draft uses the unversioned id.

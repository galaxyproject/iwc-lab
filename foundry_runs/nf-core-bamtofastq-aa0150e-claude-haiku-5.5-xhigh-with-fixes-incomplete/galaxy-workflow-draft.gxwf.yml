    state:
      input: &id004
        __class__: ConnectedValue
      mode:
        outtype: selected_reads
        filter_config:
          cond_region:
            select_region: 'no'
          cond_rg:
            select_rg: 'no'
          cond_expr:
            select_expr: 'no'
          inclusive_filter:
          - '1'
          exclusive_filter:
          - '4'
          - '8'
          exclusive_filter_all: []
        output_options:
          reads_report_type: retained
          complementary_output: false
          adv_output:
            readtags: []
            collapsecigar: false
          output_format:
            oformat: bam
      addref_cond:
        addref_select: history
        ref: *id004
  select_uu:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      changeset_revision: 5cf9fcc93508
      name: samtools_view
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    label: select unmapped-unmapped records
    when: $(inputs.when)
    in:
      when: gate_paired/boolean_param
      input: pick_bam/data_param
      addref_cond|ref: pick_fai/data_param
    out:
    - id: outputsam
    state:
      input: *id004
      mode:
        outtype: selected_reads
        filter_config:
          cond_region:

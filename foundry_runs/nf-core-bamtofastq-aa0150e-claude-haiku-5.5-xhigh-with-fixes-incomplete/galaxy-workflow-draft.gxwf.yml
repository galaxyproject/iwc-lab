  unzip_mapped:
    tool_id: __UNZIP_COLLECTION__
    tool_version: TODO
    label: split mapped pairs into read 1 and read 2
    in:
      TODO_input: filter_mapped/TODO_pair
    out:
    - id: TODO_forward
    - id: TODO_reverse
    _plan_state: |
      No parameters.
    _plan_context: |
      Built-in collection operation. Corpus: __UNZIP_COLLECTION__ 1.0.0 in 11 IWC steps.
    _plan_in: |
      TODO_input: list:paired from filter_mapped.
    _plan_out: |
      TODO_forward, TODO_reverse: list collections of read 1 and read 2 (mapped).
  unzip_unmapped:
    tool_id: __UNZIP_COLLECTION__
    tool_version: TODO
    label: split unmapped pairs into read 1 and read 2
    in:
      TODO_input: filter_unmapped/TODO_pair
    out:
    - id: TODO_forward
    - id: TODO_reverse
    _plan_state: |
      No parameters.
    _plan_context: |
      As unzip_mapped.
    _plan_in: |
      TODO_input: list:paired from filter_unmapped.
    _plan_out: |
      TODO_forward, TODO_reverse: list collections of read 1 and read 2 (unmapped).
  nest_fwd:
    tool_id: TODO
    tool_version: TODO
    label: pair mapped and unmapped read 1 per sample
    in:
      TODO_first: unzip_mapped/TODO_forward
      TODO_second: unzip_unmapped/TODO_forward
    out:
    - id: TODO_nested
    _plan_state: |
      Per sample, a list of two datasets in the order mapped then unmapped (matches source concatenation order: mapped R1 then unmapped R1).
    _plan_context: |
      Shape change from two sibling lists to one per-element list of two datasets, required as input to a multi-dataset concatenation. The sibling pairing is positional; identifier synchronisation is the open point (see open-requirements). Candidate: apply-rules or build-list per element.
    _plan_in: |
      TODO_first: mapped read 1 list; TODO_second: unmapped read 1 list.
    _plan_out: |
      TODO_nested: per sample a two-dataset list, ready for concat.
  nest_rev:
    tool_id: TODO
    tool_version: TODO
    label: pair mapped and unmapped read 2 per sample
    in:
      TODO_first: unzip_mapped/TODO_reverse
      TODO_second: unzip_unmapped/TODO_reverse
    out:
    - id: TODO_nested
    _plan_state: |
      As nest_fwd for read 2.
    _plan_context: |
      As nest_fwd.
    _plan_in: |
      TODO_first: mapped read 2 list; TODO_second: unmapped read 2 list.
    _plan_out: |
      TODO_nested: per sample two-dataset list for read 2.
  concat_fwd:
    tool_id: toolshed.g2.bx.psu.edu/repos/artbio/concatenate_multiple_datasets/cat_multi_datasets
    tool_version: TODO
    label: concatenate read 1 (mapped then unmapped)
    in:
      TODO_input: nest_fwd/TODO_nested
    out:
    - id: TODO_out
    _plan_state: |
      No parameters beyond the input list.
    _plan_context: |
      Source: CAT_FASTQ (reads_to_concat, read 1 side). Corpus: cat_multi_datasets 1.4.3 in 9 IWC steps (the sra-manifest exemplar concatenates per sample this way).
    _plan_in: |
      TODO_input: per-sample two-dataset list for read 1.
    _plan_out: |
      TODO_out: concatenated read 1 per sample.
  concat_rev:
    tool_id: toolshed.g2.bx.psu.edu/repos/artbio/concatenate_multiple_datasets/cat_multi_datasets
    tool_version: TODO
    label: concatenate read 2 (mapped then unmapped)
    in:

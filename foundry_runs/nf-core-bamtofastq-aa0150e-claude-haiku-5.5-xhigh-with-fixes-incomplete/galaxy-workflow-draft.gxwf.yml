          exclusive_filter:
          - '256'
          exclusive_filter_all: []
        output_options:
          reads_report_type: retained
          complementary_output: false
          adv_output:
            readtags: []
            collapsecigar: false
          output_format:
            oformat: bam
      addref_cond:
        addref_select: history

      TODO_fasta: pick_fai/data_param
    out:
    - id: TODO_pair
    _plan_state: |
      As collate_mapped, with the same collate settings.
    _plan_context: |
      Source: COLLATE_FASTQ_UNMAP. Deferred for the same reason as collate_mapped.
    _plan_in: |
      TODO_input: collate_unmapped_records output; TODO_fasta: reference.
    _plan_out: |
      TODO_pair: paired FASTQ per sample (list:paired). Unmapped side of the join.
  filter_mapped:
    tool_id: TODO
    tool_version: TODO
    label: drop skipped mapped elements
    in:
      TODO_input: collate_mapped/TODO_pair
    out:
    - id: TODO_pair
    _plan_state: |
      Remove null elements produced by the per-element when-guard.
    _plan_context: |
      Galaxy null/empty element filter, applied after a mapped step with skipped elements (collection-cleanup pattern). Not used in IWC at this pin (__FILTER_NULL__ has no corpus use); deferred.
    _plan_in: |
      TODO_input: collate_mapped output (list:paired with nulls).
    _plan_out: |
      TODO_pair: list:paired without the skipped samples. Positional pairing with filter_unmapped is then the same element set.

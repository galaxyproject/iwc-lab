  collate_mapped:
    tool_id: TODO
    tool_version: TODO
    label: collate and convert mapped records to paired FASTQ
    when: $(inputs.when)
    in:
      when: gate_paired/boolean_param
      TODO_input: collate_mapped_records/output_file
      TODO_fasta: pick_fai/data_param
    out:
    - id: TODO_pair
    _plan_state: |
      Paired output (read 1 and read 2). Collate arguments from source (-f -r reads_in_memory when collate_fast is set; -N in ext.args2). Output as a paired collection.
    _plan_context: |
      Source: COLLATE_FASTQ_MAP (samtools collatefastq, interleave false, publishDir disabled). No IWC exemplar uses samtools collate or fastq at this pin. Deferred.
    _plan_in: |
      TODO_input: collate_mapped_records output (mapped records); TODO_fasta: reference.
    _plan_out: |
      TODO_pair: paired FASTQ per sample (list:paired). Mapped side of the join.
  collate_unmapped:

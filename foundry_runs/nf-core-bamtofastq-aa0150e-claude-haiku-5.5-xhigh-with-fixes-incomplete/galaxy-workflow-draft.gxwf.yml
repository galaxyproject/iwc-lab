class: GalaxyWorkflowDraft
label: nf-core/bamtofastq (Galaxy draft from aa0150e)
doc: |
  Draft of the Galaxy workflow for nf-core/bamtofastq at aa0150e. Topology is settled here
  (inputs, outputs, steps, edges, when-guards). Wrapper-tier items are TODO or identity-pinned
  (tool_version TODO); see _plan_* on each step. Source: summary-nextflow.json (reconciled),
  nextflow-galaxy-reference-data.md, nextflow-galaxy-interface.md, nextflow-galaxy-data-flow.md.
inputs:
  samples:
    type: collection
    collection_type: sample_sheet
    label: samples
    format:
    - bam
    - cram
    column_definitions:
    - name: sample_id
      type: string
      optional: false
      validators:
      - type: regex
        expression: ^\S+$
    - name: file_type
      type: string
      optional: false
      restrictions:
      - bam
      - cram
    doc: One row per BAM or CRAM. sample_id must be unique per row (source does not enforce it). The index column is not carried (see open-requirements).
  reference_fasta:
    type: data
    label: reference_fasta
    format: fasta
    optional: true
    doc: Reference FASTA. Optional for BAM rows; required for CRAM rows (not enforced by the source).
  reference_fasta_index:
    type: data
    label: reference_fasta_index
    format: fai
    optional: true
    doc: FASTA index. If absent it is built from reference_fasta by a workflow-tier step.
  chromosome_filter:
    type: string
    label: chromosome_filter
    optional: true
    doc: Region filter (source params.chr). Changes output element identifiers to <sample>.<chr>.
  skip_samtools_reports:
    type: boolean
    label: skip_samtools_reports
    default: false
    doc: Source no_stats. When true, the three samtools report outputs are skipped.
  collate_fast:
    type: boolean
    label: collate_fast
    default: false
    doc: Source samtools_collate_fast. Changes collate arguments.
  reads_in_memory:
    type: int
    label: reads_in_memory
    default: 100000
    doc: Source reads_in_memory. Used only when collate_fast is true.
  multiqc_title:
    type: string
    label: multiqc_title
    optional: true
  multiqc_config:
    type: data
    label: multiqc_config
    optional: true
  multiqc_logo:
    type: data
    label: multiqc_logo
    optional: true
  multiqc_methods_description:
    type: data
    label: multiqc_methods_description
    optional: true
outputs:
  paired_reads:
    outputSource: filter_paired/TODO_pair
    label: paired_reads
  single_reads:
    outputSource: filter_single/output
    label: single_reads
  multiqc_report:
    outputSource: multiqc/html_report
    label: multiqc_report
  samtools_flagstat:
    outputSource: flagstat/output1
    label: samtools_flagstat
  samtools_idxstats:
    outputSource: idxstats/output
    label: samtools_idxstats
  samtools_stats:
    outputSource: stats/output
    label: samtools_stats
steps:
  index_fasta:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_faidx/samtools_faidx/1.22+galaxy1
    tool_version: 1.22+galaxy1
    tool_shed_repository:
      changeset_revision: 78d6d62d4ce4
      name: samtools_faidx
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    label: build FASTA index when reference_fasta is given
    when: $(inputs.when !== null)
    in:
      when: reference_fasta
      input: reference_fasta
    out:
    - id: output
    state:
      input:
        __class__: ConnectedValue
  pick_fai:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/pick_value/pick_value/0.2.0
    tool_version: 0.2.0
    tool_shed_repository:
      changeset_revision: b19e21af9c52
      name: pick_value
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    label: FASTA index (supplied or built)
    in:
      style_cond|type_cond|pick_from_0|value: reference_fasta_index
      style_cond|type_cond|pick_from_1|value: index_fasta/output
    out:
    - id: data_param
    state:
      style_cond:
        pick_style: first
        type_cond:
          param_type: data
          pick_from:
          - value:
              __class__: ConnectedValue
          - value:
              __class__: ConnectedValue
  classify_layout:
    label: classify each sample as single-end or paired-end
    run:
      class: GalaxyUserTool
      id: samtools_paired_layout_check
      version: 1.0.0
      name: Paired-end layout check (samtools)
      description: Decides whether a BAM or CRAM holds paired-end or single-end reads, from its first 1000 records.
      container: community.wave.seqera.io/library/htslib_samtools:1.23.1--5b6bb4ede7e612e5
      help:
        format: markdown
        content: |
          Samples the first 1000 records of a SAM, BAM or CRAM file and counts the records with the paired flag (0x1).
          The file counts as paired-end when every sampled record has that flag; otherwise it is single-end.
          Two text outputs hold `true` or `false`: `is_single` and `is_paired`.
          CRAM input needs the reference FASTA. This reproduces the CHECKPAIREDEND rule of nf-core/bamtofastq at aa0150e.
      configfiles:
      - filename: classify_layout.sh
        content: |
          #!/bin/sh
          set -e
          IN="$1"
          REF="$2"
          REF_ARGS=""
          if [ -n "$REF" ]; then
              REF_ARGS="--reference $REF"
          fi
          samtools view $REF_ARGS "$IN" > all.sam
          head -n 1000 all.sam > sample.sam
          samtools view -c sample.sam > total.txt
          samtools view -c -f 1 sample.sam > paired.txt
          awk 'NR==1{p=$1} NR==2{t=$1} END { if (t>0 && p==t) { ip="true"; isg="false" } else { ip="false"; isg="true" }; print isg > "is_single.txt"; print ip > "is_paired.txt" }' paired.txt total.txt
          rm -f all.sam sample.sam
      shell_command: |
        sh classify_layout.sh '$(inputs.input.path)' '$(inputs.reference ? inputs.reference.path : "")'
      inputs:
      - name: input
        type: data
        format:
        - sam
        - bam
        - cram
        label: Alignment file
        help: One SAM, BAM or CRAM file (one sample).
      - name: reference
        type: data
        format:
        - fasta
        optional: true
        label: Reference FASTA (CRAM only)
        help: Needed to decode CRAM. Leave empty for SAM or BAM input.
      outputs:
      - name: is_single
        type: data
        format: txt
        from_work_dir: is_single.txt
        label: Single-end (true or false)
      - name: is_paired
        type: data
        format: txt
        from_work_dir: is_paired.txt
        label: Paired-end (true or false)
    in:
      input: samples
      reference: pick_fai/data_param
    out:
    - id: is_single
    - id: is_paired
  gate_single:
    tool_id: param_value_from_file
    tool_version: 0.1.0
    label: per-sample single-end gate
    in:
      input1: classify_layout/is_single
    out:
    - id: boolean_param
    state:
      input1: &id001
        __class__: ConnectedValue
      param_type: boolean
      remove_newlines: true
  gate_paired:
    tool_id: param_value_from_file
    tool_version: 0.1.0
    label: per-sample paired-end gate
    in:
      input1: classify_layout/is_paired
    out:
    - id: boolean_param
    state:
      input1: *id001
      param_type: boolean
      remove_newlines: true
  flagstat:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_flagstat/samtools_flagstat/2.0.8
    tool_version: 2.0.8
    tool_shed_repository:
      changeset_revision: a0d8e49a018c
      name: samtools_flagstat
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    label: samtools flagstat on the input files
    when: $(!inputs.when)
    in:
      when: skip_samtools_reports
      input1: samples
    out:
    - id: output1
    state:
      input1:
        __class__: ConnectedValue
      output_fmt: txt
  idxstats:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_idxstats/samtools_idxstats/2.0.8
    tool_version: 2.0.8
    tool_shed_repository:
      changeset_revision: 13aad5cb9be4
      name: samtools_idxstats
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    label: samtools idxstats on the input files
    when: $(!inputs.when)
    in:
      when: skip_samtools_reports
      input: samples
    out:
    - id: output
    state:
      input:
        __class__: ConnectedValue
  stats:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/samtools_stats/samtools_stats/2.0.9
    tool_version: 2.0.9
    tool_shed_repository:
      changeset_revision: 8fca6e1eac98
      name: samtools_stats
      owner: devteam
      tool_shed: toolshed.g2.bx.psu.edu
    label: samtools stats on the input files
    when: $(!inputs.when)
    in:
      when: skip_samtools_reports
      input: samples
      addref_cond|ref: pick_fai/data_param
    out:
    - id: output
    state:
      input: &id002
        __class__: ConnectedValue
      coverage_cond:
        coverage_select: 'no'
      filter_by_flags:
        filter_flags: nofilter
      addref_cond:
        addref_select: history
        ref: *id002
      remove_dups: false
      sparse: false
      remove_overlaps: false
  chr_extract:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    tool_version: 1.22+galaxy2
    tool_shed_repository:
      changeset_revision: 5cf9fcc93508
      name: samtools_view
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu

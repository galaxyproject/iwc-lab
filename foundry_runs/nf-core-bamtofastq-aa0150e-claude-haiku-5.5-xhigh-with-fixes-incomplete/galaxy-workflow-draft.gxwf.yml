      when: chromosome_filter
      input: samples
      mode|filter_config|cond_region|regions: chromosome_filter
      addref_cond|ref: pick_fai/data_param
    out:
    - id: outputsam
    state:
      input: &id003
        __class__: ConnectedValue
      mode:
        outtype: selected_reads
        filter_config:
          cond_region:
            select_region: text
            regions: *id003
          cond_rg:
            select_rg: 'no'
          cond_expr:
            select_expr: 'no'
        output_options:
          reads_report_type: retained
          complementary_output: false
          adv_output:
            readtags: []
            collapsecigar: false
          output_format:
            oformat: bam
      addref_cond:
        addref_select: history
        ref: *id003
  pick_bam:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/pick_value/pick_value/0.2.0
    tool_version: 0.2.0
    tool_shed_repository:
      changeset_revision: b19e21af9c52
      name: pick_value
      owner: iuc
      tool_shed: toolshed.g2.bx.psu.edu
    label: sample BAM after the chromosome branch
    in:
      style_cond|type_cond|pick_from_0|value: chr_extract/outputsam
      style_cond|type_cond|pick_from_1|value: samples
    out:

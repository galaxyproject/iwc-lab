    _plan_context: |
      As concat_fwd.
    _plan_in: |
      TODO_input: per-sample two-dataset list for read 2.
    _plan_out: |
      TODO_out: concatenated read 2 per sample.
  zip_pairs:
    tool_id: __ZIP_COLLECTION__
    tool_version: TODO
    label: zip read 1 and read 2 into paired reads
    in:
      TODO_forward: concat_fwd/TODO_out
      TODO_reverse: concat_rev/TODO_out
    out:
    - id: TODO_pair
    _plan_state: |
      No parameters. Pair forward and reverse by element.
    _plan_context: |
      Built-in collection operation. Corpus: __ZIP_COLLECTION__ 1.0.0 in 2 IWC steps.
    _plan_in: |
      TODO_forward, TODO_reverse: the concatenated read collections (positional).
    _plan_out: |
      TODO_pair: list:paired per sample.
  filter_paired:
    tool_id: TODO

      load-bearing rather than theoretical.

      Phase 4 pins where the answer has to land in the graph: each of the eleven assets sits in front
      of a pick_value-style node whose inputs are the workflow input and the gated rebuild step, so the
      rebuild is either a step in its own right or nothing - it cannot be hidden inside the consumer's
      wrapper without deleting that node, and deleting it turns "optional input" into "required input".

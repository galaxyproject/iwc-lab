      be raised here rather than met at the per-step loop. Three ways out, all someone else's
      call: (a) accept the thinner report, which is the draft's posture and the same surface
      as the held brief_change_recommendations/versions-output-has-no-producer; (b) a MultiQC-
      side config asset, which the workflow cannot express and which decisions/multiqc-config-
      assets-omitted-by-default already declines; (c) an aggregation step for which no recipe
      exists. Recorded with the step, the uncomputable outputs and the missing evidence, per
      the ledger contract. Related to entries/multiqc-receives-no-lane-results-unlike-corpus-
      idiom, which is the *lane* half of the same thin report and which this phase
      deliberately did not extend.

  - id: no-step-reached-resolved-tier
    status: open
    kind: gap
    raised_by: nextflow-summary-to-galaxy-template
    unmet: >-
      The tier this mold expects for an operation a pattern page or a corpus exemplar covers:
      Resolved, with concrete tool_id, state and port names and no _plan_* fields.
    missing: >-
      The evidence this run could read stops short of authored state. The corpus excerpt in
      iwc-exemplar.gxwf.yml shows the *shape* of a pick_value cascade and of MultiQC's nested
      results_N|software_cond|input slots, and probe drafts established which expressions and
      sentinel forms gxformat2 accepts, but it does not show the __current_case__ index values
      a concrete `state:` block needs, and the collection and tabular pattern pages the recipe
      names in this draft's notes link to are not in the bundle (filed at phases 4 and 5).
    resolved_by: null
    supersedes: null
    note: >-
      Honest count for the record: 0 Resolved, 23 identity-pinned (9 outer, 14 inner), 108
      Deferred, out of 133 steps in 95 outer + 38 inner + 2 subworkflow containers. Every
      identity-pinned step carries a _plan_state that says what the state must *do* and no
      literal values, which is what identity-pinned means here. This is not a defect of the
      draft - it is the boundary of what the run directory attests - but it does mean the
      phase 7 loop starts with 505 TODO sentinels and no step that can be copied verbatim from
      a corpus file.

decisions:
  - id: no-galaxy-reference-data-tables
    decided_by: nextflow-summary-to-galaxy-reference-data
    decision: "No dbkey-keyed and no from_data_table/.loc reference tables anywhere in the translated workflow."
    rationale: >-
      Both kinds need an admin install plus tool_data_table_conf.xml and .loc files, which breaks
      the portability-first posture the mapping note pins for v1; a translated workflow must run on
      a stock Galaxy with user-uploaded inputs.

  - id: dbs-are-optional-explicit-inputs
    decided_by: nextflow-summary-to-galaxy-reference-data
    decision: >-
      One optional, not-required workflow input per reference database (11 total), named after its
      source param, with no data-table fallback.
    rationale: >-
      Mirrors the source's own if (params.X_db) { use } else { build } shape exactly, so the
      translated interface neither adds nor hides a choice the Nextflow user already had.
    evidence:
      - funcscan-pulls-every-db-from-the-network

  - id: per-sample-consumers-take-an-explicit-db-input
    decided_by: nextflow-summary-to-galaxy-reference-data
    confidence: medium
    decision: >-
      For the ten per-sample database consumers the database is supplied explicitly, or built once
      by a single workflow-tier step; the design must not rely on each job's wrapper rebuilding it.
    rationale: >-
      The mapping note deviates from in-tool rebuild above roughly three rebuilds, and a Galaxy step
      mapping over a sample collection is one wrapper invocation per sample. The source itself hoists
      every download into a standalone process and first()-s the result for the same reason.
    evidence:
      - ten-of-eleven-db-consumers-run-per-sample

  - id: bigslice-keeps-one-shot-rebuild
    decided_by: nextflow-summary-to-galaxy-reference-data
    decision: "bgc_bigslice_db keeps the in-tool / single-invocation rebuild default."
    rationale: >-
      BIGSLICE_BIGSLICE is the only consumer whose input is collected first, so it runs once per
      workflow and stays under the note's rebuild threshold.
    evidence:
      - ten-of-eleven-db-consumers-run-per-sample

  - id: db-selectors-are-select-options
    decided_by: nextflow-summary-to-galaxy-reference-data
    decision: >-
      amp_ampcombi_db_id, annotation_bakta_db_downloadtype, arg_abricate_db_id,
      arg_fargene_hmmmodel, arg_rgi_data, arg_deeparg_model and amp_ampir_model become
      select/multi-select parameters, not data inputs.
    rationale: >-
      Each is a closed (or near-closed) string enum the tool consumes; three of them are filed as
      tool_reference_database in reference_assets[] purely because of their names. Enumerating them
      as options is the mapping note's "if a reference table is only ever keyed on a single input,
      make the columns direct inputs" instruction applied here.
    evidence:
      - funcscan-declares-almost-no-path-types

  - id: db-inputs-as-uploaded-archives
    decided_by: nextflow-summary-to-galaxy-reference-data
    confidence: low
    decision: >-
      Provisional shape for each database input: one uploaded archive dataset (tarball/zip as the
      user holds it), documented as upload-as-is.
    rationale: >-
      It is the shape the source's own builders produce and consume (tarballs and unpacked
      directories), and it is the only one of the three candidate shapes a user can create without
      admin rights. Marked low confidence and carried as entries/db-directory-input-shape-unsettled
      because no packaged note or cited exemplar supports it.
    evidence:
      - funcscan-declares-almost-no-path-types

  - id: multiqc-config-assets-omitted-by-default
    decided_by: nextflow-summary-to-galaxy-reference-data
    decision: >-
      multiqc_config, multiqc_logo and multiqc_methods_description are not reference data and are
      not exposed by default; the wrapper's bundled config stands in.
    rationale: >-
      The pipeline itself falls back to assets/multiqc_config.yml and
      assets/methods_description_template.yml inside the repo when they are unset, so the
      equivalent Galaxy fallback is a bundled default, not a user input. Phase 3 keeps multiqc_title
      as an optional text input - it is a plain string the report consumes, not a bundled asset -
      and excludes max_multiqc_email_size as email transport.

  - id: input-fans-out-to-parallel-sample-sheets
    decided_by: nextflow-summary-to-galaxy-interface
    confidence: medium
    decision: >-
      params.input becomes four sample_sheet collection inputs - required input_fasta plus optional
      input_protein, input_gbk and input_gff - all keyed by element_identifier, with gff_type a
      restricted string column on the GFF sheet only.
    rationale: >-
      Three of the four path columns are per-row optional and the row shape therefore varies, which
      sample_sheet:record cannot express; record is also the one variant with
      allow_implicit_mapping False, which would force a slot extraction in front of every mapped
      step. The source already splits the row into fastas|faas|gffs|gbks via multiMap and hands each
      consumer only the slot stream it needs, so parallel collections mirror the existing structure.
      gff_type rides with the file it describes because it is passed as val(gff_type) into
      RUNDBCAN_EASYCGC and RUNDBCAN_EASYSUBSTRATE.
    evidence:
      - samplesheet-per-row-optional-slots

  - id: gating-by-when-not-by-requiredness
    decided_by: nextflow-summary-to-galaxy-interface
    decision: >-
      Every database, model and tool-branch input stays optional and the real gating lives in when:
      expressions on the steps; requiredness expresses only the one unconditional requirement
      (input_fasta).
    rationale: >-
      Galaxy has no required-only-when-X affordance, and the source's own semantics are
      "meaningful under this toggle", not "always required". Marking an input required would break
      runs that leave its branch off, which is the common case: all six run_* stage switches
      default to false.
    evidence:
      - hmm-models-required-when-branch-enabled

  - id: save-flags-kept-only-when-they-change-command-output
    decided_by: nextflow-summary-to-galaxy-interface
    decision: >-
      Of the 14 *_save* params, the 8 that change a command or its file set are exposed as booleans
      (six hmmsearch write_* flags and the two mmseqs *_savetmp flags that toggle
      --remove-tmp-files); save_db, save_annotations, bgc_savefilteredcontigs, arg_rgi_savejson,
      arg_rgi_savetmpfiles and arg_fargene_savetmpfiles are excluded as publish-only.
    rationale: >-
      The params note's effect test: a save_ name is not enough, keep it only if it changes which
      files a command creates. A flag whose whole effect is publishDir enabled has no Galaxy
      analogue, because step outputs are in the history whether or not anything publishes them - so
      its effect is already the Galaxy default, and what it gated becomes a promotion decision
      instead (entries/published-only-results-need-explicit-promotion).
    evidence:
      - funcscan-publishes-through-config-not-emits

  - id: per-collection-mapping-replaces-split-and-reassemble
    decided_by: nextflow-summary-to-galaxy-data-flow
    confidence: high
    decision: >-
      The transpose / groupTuple / extension-sniffing cycle at funcscan.nf:70-96, the seven
      multiMap{} fan-outs, and 13 of the 15 joins get no Galaxy node at all: each slot keeps its own
      identifier-aligned collection from the input sheet to the consuming step, and a consumer binds
      the several slot collections it needs as several inputs of one step.
    rationale: >-
      The reshape exists in the source only because Nextflow flattens the row into per-slot streams
      and then has to put it back together; under four aligned collections membership is the slot
      label, so there is nothing to reassemble. Justified from the source's own structure, not from
      tool availability: the split at :70-71 and the reassembly at :83-96 are the two halves of one
      round trip. Secondary gain: the extension tests at :86-89 are ambiguous when a filename appears
      in two columns, and per-collection mapping removes the ambiguity rather than reproducing it.
    evidence:
      - most-of-the-edge-list-is-a-split-then-reassemble-cycle

  - id: optional-inputs-replace-empty-channel-idiom
    decided_by: nextflow-summary-to-galaxy-data-flow
    confidence: high
    decision: >-
      Each of the 25 channel.empty() sites and each [meta, []] else-arm becomes an optional input on
      the consuming step, not a step and not an empty dataset. In particular AMP's taxonomy and
      interproscan inputs, ARG's annotations input and ANNOTATION's prokka/bakta slots must be declared
      optional typed inputs.
    rationale: >-
      The idiom's whole purpose in the source is to satisfy a take: that the caller does not want to
      fill; the sibling arm that fabricates one empty file per sample (:225-227) exists only because
      Nextflow offers nothing else. Galaxy already has the affordance. Translating it literally would
      add steps that produce empty datasets for their own sake, and would then need the emptiness
      filters of discoveries/emptiness-is-tested-per-consumer-and-the-warning-dies-there to undo them.
    evidence:
      - emptiness-is-tested-per-consumer-and-the-warning-dies-there

  - id: taxa-conditional-pairs-collapse-to-three-gates
    decided_by: nextflow-summary-to-galaxy-data-flow
    confidence: high
    decision: >-
      The six workflow.conditionals[] rows that pair each screening stage with and without
      run_taxa_classification (AMP :238/:253, ARG :277/:299, BGC :335/:354) become three when: gates on
      run_amp_screening, run_arg_screening and run_bgc_screening, with run_taxa_classification moved to
      the optional taxonomy input of the three merge_taxonomy_* steps and to which table a promoted
      summary label binds to.
    rationale: >-
      Verified arm by arm: the two arms of each pair invoke the same subworkflow with the same
      arguments, and differ only by whether the taxonomy channel arrives filtered for emptiness. One
      if/else-if pair in Nextflow is not a branch in the data-flow sense, and duplicating three
      subworkflows to mirror it would triple the step count of the three heaviest lanes to express a
      filter. Phase 3 section 5 read those pairs as branches; the correction is recorded in the
      interface's favour too, because it removes work rather than adding it.
    evidence:
      - most-of-the-edge-list-is-a-split-then-reassemble-cycle

  - id: annotation-instantiated-per-contig-variant
    decided_by: nextflow-summary-to-galaxy-data-flow
    confidence: medium
    decision: >-
      The full-FASTA and long-contig annotation streams become two invocations of one ANNOTATION
      subworkflow (one additionally gated on run_bgc_screening), each keyed by the plain sample id,
      rather than one invocation over a relabelled union or a list:list.
    rationale: >-
      funcscan.nf:106-115 puts the same sample into the annotation stream twice under one id, and
      :140/:166 separate the two copies again for different consumers, so something has to distinguish
      them - and a Galaxy element identifier cannot hold two elements. Relabelling to {sample}_long
      matches what the source already writes into filenames (ext.prefix = "${meta.id}_long") but leaks
      into every promoted BGC output and forces a strip-back relabel on each; a list:list whose outer
      axis is the category degenerates to a single member whenever run_bgc_screening is off and has no
      valid partition, because pre-annotated rows belong to both streams. Two subworkflow instances
      cost a step, not a body - which is the source's own granularity argument: ANNOTATION is already a
      subworkflow boundary with a narrow four-slot interface. Confidence medium only because it assumes
      one subworkflow may be invoked as two steps, which no packaged note states.
    evidence:
      - two-gating-decisions-are-channel-level-not-process-level

  - id: fargene-class-axis-becomes-a-tool-parameter
    decided_by: nextflow-summary-to-galaxy-data-flow
    confidence: medium-high
    decision: >-
      The .combine(ch_fargene_classes) fan-out at arg.nf:71 and the .transpose() that undoes it at
      :87 become one fARGene step per sample carrying the selected classes as a tool parameter; no
      collection axis is created. The two HMM-file cross-products (amp.nf:86, bgc.nf:168) keep a real
      second axis.
    rationale: >-
      arg_fargene_hmmmodel is a comma-joined string of ten class names
      (channel.fromList(params.arg_fargene_hmmmodel.tokenize(','))), i.e. a value list, not a set of
      uploaded files, and phase 3 already exposes it as a multi-select input - so the fan-out is a
      per-(sample,class) job explosion that the source performs only to call one tool ten times. Telling
      the two shapes of .combine() apart is exactly what the summary's operator-name-only via[] list
      cannot do, which is why the decision is recorded against the site and not the operator.
    evidence:
      - most-of-the-edge-list-is-a-split-then-reassemble-cycle

  - id: gz-inputs-kept-with-pass-through-unpack-steps
    decided_by: nextflow-summary-to-galaxy-data-flow
    confidence: medium
    decision: >-
      The four sample-sheet columns keep their optional .gz suffix and the workflow pays four
      unconditional inflate-or-pass-through steps (N1-N4), instead of narrowing the column patterns to
      uncompressed types and asking the user to decompress first.
    rationale: >-
      It preserves the accepted input set the source ships (every path column allows an optional .gz
      suffix), and puts the complexity in one wrapper whose behaviour is testable, rather than in a
      form field that rejects files a Nextflow user can submit today. Narrowing the pattern would
      delete four steps and change the interface for every user to spare the workflow four steps, which
      is the wrong direction of cost. Revisit per tool at advance-galaxy-draft-step: any wrapper that
      reads a registered .gz datatype natively makes its step redundant, and if that turns out to be
      the common case this decision reverts at zero cost to the interface.
    evidence:
      - per-element-branch-has-no-galaxy-carrier

  - id: heterogeneous-fan-in-uses-named-optional-slots-plus-pick-value
    decided_by: compare-against-iwc-exemplar
    confidence: medium
    decision: >-
      Where a step must gather results from lanes the user may switch off, prefer the corpus's shape -
      one consuming step with fixed named optional inputs, plus a pick_value cascade where a value has to
      fall through from a gated producer to a fallback - and reserve collapse_dataset for genuinely
      homogeneous contributors, rather than the relabel-and-__MERGE_COLLECTIONS__ zip the data-flow brief
      listed first.
    rationale: >-
      It is the only one of phase 4's three candidates that a corpus workflow demonstrably runs at
      comparable heterogeneity: the exemplar's gated subworkflow takes five named inputs of three
      different shapes, two of them produced by steps a gate can skip, and its MultiQC takes seven
      optional slots. collapse_dataset appears in 29 workflows but always over a single collection, and
      the Apply-Rules/zip candidate appears nowhere with a defined behaviour for a skipped input.
      Confidence medium, not high, because fixed slots reintroduce the fixed input count that variable
      arity was meant to avoid - a lane added later is an edit to the consuming step - and no corpus
      example carries a per-sample collection axis through the fan-in, which is this run's actual case.
    evidence:
      - corpus-gates-live-in-parameter-space

  - id: reference-fork-resolved-inside-consumer-wrappers
    decided_by: nextflow-summary-to-galaxy-template
    confidence: medium
    decision: >-
      Settle every database-or-rebuild fork inside the consuming wrapper: one optional
      uploaded-database input per asset, no builder steps, no pick_*_db fan-in slots and no
      db_echo_* outputs, so the fork is a wrapper obligation rather than workflow topology.
    rationale: >-
      `when:` cannot test whether an optional input arrived (entries/db-or-rebuild-fork-
      cannot-gate), the corpus has no dataset-derived gate at all, and the v1 reference-data
      posture is explicitly "optional input plus in-tool rebuild". The alternative costs at
      least twelve extra steps and the interface brief has no budget for them. Confidence
      medium because it trades a topology problem for a capability problem the run cannot
      verify: entries/wrapper-rebuild-capability-unverified becomes load-bearing for twelve
      steps the moment this is chosen.
    evidence:
      - db-or-rebuild-fork-cannot-gate
      - wrapper-rebuild-capability-unverified
      - input-datatype-cannot-gate-a-step

  - id: variable-arity-fan-in-materialised-as-a-reshape-quartet
    decided_by: nextflow-summary-to-galaxy-template
    confidence: low
    decision: >-
      Materialise merge points M1 (AMPcombi2 parsetables) and M3 (comBGC calls) as four
      placeholder steps each - relabel to {sample}__{tool}, __MERGE_COLLECTIONS__, split the
      identifier, nest into list:list, merging rather than zipping - and M2/M4 as one named
      bundle step each.
    rationale: >-
      Source evidence pins the target shape (discoveries/ampcombi2-parsetables-takes-a-six-
      argument-tuple) and rules out the flat `multiple: true` option for AMPcombi2, while the
      corpus-attested alternatives do not carry a per-sample collection axis: collapse_dataset
      always collapses one collection and collection_column_join merges tables, not axes. So
      the construction is the one the data-flow brief listed first, now drawn as steps.
      Confidence low: the four steps name recipes (P2 collection-cleanup-after-mapover-
      failure, P6 collection-flatten-after-fanout, collection-split-identifier-via-rules,
      collection-build-named-bundle) whose pages are not packaged, so each is Deferred with a
      recipe name in _plan_context and no attested tool.
      [Correction added after phase 6: the statement above that the pages are not packaged was overstated. See phase6-progress.md section 6. The two overview pages are packaged and name tools, their operation pages are dead links, and galaxy-sequence-patterns is absent.]
    evidence:
      - variable-arity-fan-in-has-no-attested-galaxy-recipe
      - nested-collection-dot-product-unattested

  - id: annotation-instantiated-as-two-draft-subworkflow-steps
    decided_by: nextflow-summary-to-galaxy-template
    confidence: medium
    decision: >-
      Emit ANNOTATION once as a body of 19 inner steps and instantiate it twice as `type:
      subworkflow` steps with `run: {class: GalaxyWorkflowDraft, ...}` - annotation_full over
      the whole FASTA and annotation_long over the long-contig variant - rather than
      duplicating 38 tool steps at the top level.
    rationale: >-
      The source calls the subworkflow twice (funcscan.nf:127 over a channel that already
      mixes the two contig variants), and a draft subworkflow step is legal: a probe in
      /tmp/gxy-scratch confirmed gxwf draft-validate accepts nested `when:` over inner inputs
      and that gxwf draft-next-step returns a nested path like [container, deep], so nesting
      does not hide the 38 inner steps from the phase 7 loop. Confidence medium on the
      remaining half: this is two steps carrying a copy of the body text, not one body invoked
      twice, so a repair to the annotation logic has to be applied twice until the workflow is
      concrete.
    evidence:
      - annotation-instantiated-per-contig-variant

  - id: draft-steps-carry-id-and-no-label
    decided_by: nextflow-summary-to-galaxy-template
    confidence: high
    decision: >-
      Give every step an `id` and no `label`, and put the intended UI label in the first line
      of each _plan_context instead.
    rationale: >-
      Measured rule: in list form gxformat2 addresses a labelled step by its label, so a draft
      that mixes ids and labels silently misroutes every edge that names the id. With 232
      edges in this file the failure would be invisible until a real import. The cost is
      cosmetic and belongs to phase 7: the UI shows snake_case ids until labels are set, and
      the label text is already written down per step.
    evidence:
      - no-step-reached-resolved-tier

  - id: when-expressions-limited-to-the-probe-verified-operator-set
    decided_by: nextflow-summary-to-galaxy-template
    confidence: high
    decision: >-
      Emit only `&&`, `||`, parentheses, `== "string"`, `== false` and bare `$(inputs.x)`
      truthiness in `when:`, writing every negation as `== false` or expanding it by De
      Morgan, and never `!`.
    rationale: >-
      Those operators are what probe drafts in this run showed draft-validate accepts; `!` was
      never in the probe set, and a rejected guard would silently un-gate a step. The cost is
      legibility: funcscan's inverted skip_* knobs appear as `$(inputs.bgc_skip_antismash) ==
      false` in eleven guards, which is the shape discoveries/the-multiqc-guard-is-not-the-
      annotation-guard and the corpus measurement (no gate in 133 workflows is written as a
      negation) both point at.
    evidence:
      - corpus-gates-live-in-parameter-space

  - id: input-fasta-unpacked-promoted-and-versions-still-not
    decided_by: nextflow-summary-to-galaxy-template
    confidence: medium
    decision: >-
      Promote input_fasta_unpacked, which the interface brief left open, and keep `versions`
      out of the promoted set pending the operator's held decision, giving 14 promoted outputs
      against the brief's 13 plus versions.
    rationale: >-
      The unpack step is the cheapest thing in the trunk to get wrong and the only place a
      test can see a gzipped-input bug, so promoting it buys a checkpoint for one edge. The
      versions row has no producer at all (brief_change_recommendations/versions-output-has-
      no-producer, still held-for-operator-decision), and promoting a step's own versions
      output per step would multiply one row across the pipeline. The promoted set is
      therefore the brief's list with those two edits, and both are stated in the draft's own
      doc block rather than buried.
    evidence:
      - published-only-results-need-explicit-promotion
      - versions-output-has-no-producer

brief_change_recommendations:
  # Held, not applied. Phase 4 (data flow) found four places where the phase 3 interface brief is
  # wrong or incomplete. The operator is reviewing that brief by hand and asked (2026-11-10) that it
  # not be amended until they have decided, so nothing below has been written into
  # nextflow-galaxy-interface.md and phase 5 is deliberately not started. Full reasoning lives in
  # nextflow-galaxy-data-flow.md sections 14, 15 and 17.
  - id: versions-output-has-no-producer
    target: nextflow-galaxy-interface.md
    target_section: "10.2 promoted outputs"
    raised_by: nextflow-summary-to-galaxy-data-flow
    status: held-for-operator-decision
    found: >-
      The versions row of the promoted-output list cannot be wired. The source builds that file from
      70 ch_versions.mix() sites through softwareVersionsToYAML(...).collectFile(storeDir:
      "${outdir}/pipeline_info", ...) at funcscan.nf:414-421, i.e. a workflow-level versions channel
      fed by every module. Galaxy keeps versions per job, has no such channel, and the same
      funcscan.nf:397-402 site also mixes file paths with (process, tool, version) triples and routes
      them by instanceof - a distinction that exists only because the Nextflow helper accepts both.
    options: >-
      (a) drop versions from the promoted set and say so in the brief; (b) promote the per-step
      versions outputs, which multiplies that row by the number of steps that have one; (c) add one
      custom "collect versions" step, for which no packaged recipe exists. Recommendation is (a) or
      (b); (c) should not be chosen without seeing what advance-galaxy-draft-step can actually build.
    evidence:
      - versions-collation-and-parameter-summary-have-no-galaxy-producer

  - id: promote-bgc-mincontiglength
    target: nextflow-galaxy-interface.md
    target_section: "5/6 shape controls and the pinned set"
    raised_by: nextflow-summary-to-galaxy-data-flow
    status: held-for-operator-decision
    found: >-
      bgc_mincontiglength is one of the 133 pinned tool knobs, which is correct under the brief's
      effect test as written - it adds no input, no output and no step. But it is consumed as
      ext.args = "--min-len ${params.bgc_mincontiglength}" (conf/modules.config:103-105) and decides
      which contigs survive into the long-contig variant, hence which samples have any element in the
      BGC lane at all: funcscan.nf:109-114 then drops a sample with no long contigs entirely. That is a
      branch-membership effect, which is the brief's own criterion for exposing a control.
    options: >-
      Promote it as a numeric input carrying the nextflow.config default (61 inputs becomes 62, 133
      pinned becomes 132), and widen the promotion rule from "adds an input, output or step" to
      "changes what runs, what data is needed, or which samples a lane covers". The sibling flag
      bgc_savefilteredcontigs stays out, because its only effect is publishDir enabled.
    evidence:
      - bgc-mincontiglength-affects-lane-membership

  - id: interproscan-table-binds-to-the-rewrite-step
    target: nextflow-galaxy-interface.md
    target_section: "10.2 promoted outputs"
    raised_by: nextflow-summary-to-galaxy-data-flow
    status: held-for-operator-decision
    found: >-
      The interproscan_table row names INTERPROSCAN / tsv as its producer, which is the wrong step.
      protein_annotation.nf:37-44 reads the tool's tsv back with new File(tsv_path).readLines() and
      appends two literal NA fields to every line, because (source comment) "INTERPROSCAN 5.72-103.0
      only includes 13 columns and not 15 which ampcombi expects", and it is the rewritten file the
      subworkflow emits. Promoting the tool's own output would publish a table that AMPcombi rejects.
    options: >-
      Rebind the row to the rewrite step (N16 in the data-flow brief). Worth noting for the test plan:

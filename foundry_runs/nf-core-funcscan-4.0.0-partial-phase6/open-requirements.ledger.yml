  - id: annotation-tool-override-belongs-on-the-form
    target: nextflow-galaxy-interface.md
    target_section: "4/5 annotation_tool"
    raised_by: nextflow-summary-to-galaxy-data-flow
    status: held-for-operator-decision
    found: >-
      annotation.nf:29 computes a gate the user did not choose - annotation_tool == "pyrodigal", or
      prodigal with BGC screening and any of the three BGC sub-screens on, or prodigal with AMP
      screening - and :32-37 announces the override in a log.warn. Keeping that test in the workflow
      means re-typing it on every gated step: 12 when: strings per ANNOTATION instance (6 pyrodigal
      steps carry it, 6 prodigal steps carry its negation conjoined with the equality test), 24 across
      the two instances the data-flow brief recommends.
    options: >-
      Three, in ascending order of honesty cost: repeat the expression on all 24 steps; hoist it into
      the interface (drop prodigal from the enum, or state on annotation_tool that it runs as pyrodigal
      during BGC/AMP screening) so no gate encodes it; or leave the switch alone and accept a derived
      gate whose construction the packaged notes do not attest. The interface route loses the
      log.warn, which is the same loss the data-flow brief already records for 23 other warnings. This
      one is the only recommendation of the four that changes what the user sees.
    evidence:

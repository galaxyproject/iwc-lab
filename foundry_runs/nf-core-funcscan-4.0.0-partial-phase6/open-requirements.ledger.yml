  - id: per-element-branch-has-no-galaxy-carrier
    status: open
    kind: gap
    raised_by: nextflow-summary-to-galaxy-data-flow
    unmet: >-
      Per-element routing of the four input sheets' datasets by whether each is gzipped - branch {
      compressed: it[1].toString().endsWith('.gz'); uncompressed: true } at funcscan.nf:72-75, feeding
      GUNZIP_INPUT_PREP
    missing: >-
      Galaxy has no per-element branch: a mapped step either consumes the datatype or it does not, and
      whether a given tool step can read a registered auto-compressed datatype (fasta.gz, gff3.gz are
      legal per nextflow-path-glob-to-galaxy-datatype's compression rules) is a fact about the chosen
      wrapper that no packaged note carries. The source's accepted input set is
      ^\\S+\\.(fasta|fas|fna|fa)(\\.gz)?$ per column, so this is a real per-element set, not an
      either/or at the interface.
    resolved_by: null
    supersedes: null
    note: >-
      Data-flow brief section 4.2 chose the cheapest faithful option: one unconditional
      inflate-if-gzipped-else-pass-through step per sheet (4 nodes), i.e. the corpus
      conditional-transform-or-pass-through shape moved from values to files. Decided at
      advance-galaxy-draft-step per tool, because it depends on what each wrapper accepts; if a
      wrapper reads .gz natively its step is deleted, and the interface's (\\.gz)? then costs nothing.

      Phase 5 narrows this to routing. __FILTER_EMPTY_DATASETS__ appears in 8 workflows: a per-element
      conditional *drop* with no branching, which is the shape the 18 emptiness filters need and gives the
      inflate-if-gzipped step's pass-through half corpus backing (the same idiom as a pick_value default_value
      firing when its connected input is absent). What stays unattested, with zero examples in 133 workflows,
      is sending different elements to different steps because of a property of the element. The brief's
      one-unconditional-step-per-sheet answer is therefore still the faithful one.


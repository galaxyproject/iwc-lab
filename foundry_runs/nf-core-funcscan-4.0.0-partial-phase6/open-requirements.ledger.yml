  - id: preannotated-rows-must-say-whether-they-are-re-annotated
    target: nextflow-galaxy-interface.md
    target_section: 4 the four parallel sample-sheet inputs
    raised_by: nextflow-summary-to-galaxy-template
    status: held-for-operator-decision
    found: >-
      The four-sheet shape the interface brief settled on cannot express which rows are
      already annotated. funcscan.nf:97-100 splits rows on gff/gbk being non-empty, and
      whether the second label (`fastas: true`) also carries those rows depends on Nextflow
      branch semantics that readings of the source disagree about (discoveries/branch-label-
      readings-conflict-for-preannotated-rows). The draft implements the complement reading -
      a row in the GBK or GFF sheet is not annotated - which is a user-visible promise the
      brief never makes.
    options: >-
      (a) State it on the sheet inputs: "a sample listed in input_gbk is used as-is and is not
      re-annotated", which costs one help-text line and makes the draft's behaviour the
      documented one; (b) follow the non-exclusive reading instead, which needs a collapse
      step per lane before the four unions because Galaxy cannot hold the resulting duplicate
      identifiers, and reopens the topology; (c) ask nf-core upstream which reading the pre-
      annotated profiles intend. Recommendation (a) now, with (c) as a separate issue, and a
      fixture row carrying fasta+protein+gbk in the test plan to keep the two readings
      observable.
    evidence:
      - preannotated-complement-reading-diverges-from-source

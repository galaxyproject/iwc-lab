      different shapes. That discharges "no attested recipe" as written: phase 4's three candidates can now be
      ranked against the corpus instead of invented, and its third option has real precedent in (c).
      Remaining risk, carried rather than buried: (a) collapses into one collection, which serves AMPcombi's

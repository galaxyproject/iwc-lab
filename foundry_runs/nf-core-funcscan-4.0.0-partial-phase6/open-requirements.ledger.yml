  - id: variable-arity-fan-in-has-no-attested-galaxy-recipe
    status: resolved
    kind: gap
    raised_by: nextflow-summary-to-galaxy-data-flow
    unmet: >-
      "For each sample, the files the N tools I enabled produced" as an input to one per-sample job,
      where N varies with the shape-control inputs: AMPcombi2 parsetables over 1-4 hit producers
      (amp.nf:105-115) plus per-sample faa/gbk/interpro, and comBGC over 1-3 BGC callers
      (bgc.nf:70,88,106,182)
    missing: >-
      The natural primitives - zip, or an Apply-Rules build over N collections - all assume a fixed
      input count, and a when:-skipped step yields a typed null whose behaviour inside a zip or a
      dot-product is stated nowhere in the packaged notes. The source gets variable arity for free
      because a skipped producer's channel stays channel.empty() and groupTuple simply sees fewer
      files. Data-flow brief section 9 lists three candidate constructions (relabel to

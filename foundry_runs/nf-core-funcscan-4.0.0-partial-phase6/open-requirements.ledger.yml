ledger_version: 1
pipeline: nextflow-to-galaxy
run_slug: funcscan-run1
started_by: nextflow-summary-to-galaxy-reference-data
updated_by: nextflow-summary-to-galaxy-template
note: >-
  Started at phase 2: phase 1 (summarize-nextflow) is a source-summary Mold and does not carry
  this ledger, so no upstream ledger was supplied. topology_repair is absent until the first
  escalation from the phase 7 loop. Phase 3 (interface) added three discoveries, six gaps and one
  dropped entry, updated the notes on three entries it narrowed, and changed no status: nothing
  phase 2 opened is discharged by an interface brief alone - the DB input shape, the wrapper
  rebuild capability and the pick-list exemplar all need compare-against-iwc-exemplar.

  Phase 4 (data flow) added eight discoveries, nine gaps (all kind: gap) and six decisions, narrowed
  the notes on seven entries it inherited, and closed nothing. Two of the nine gaps are blocking for
  phase 5:
  entries/variable-arity-fan-in-has-no-attested-galaxy-recipe and
  entries/db-directory-input-shape-unsettled (which phase 4 narrowed further but cannot close - the
  antiSMASH untar-versus-directory choice now has to be made at authoring time, see
  entries/input-datatype-cannot-gate-a-step). Two entries phase 2 and phase 3 opened are now
  narrower rather than settled: the four-sheet input shape has a concrete cost attached (identifier
  sync, P1) and the conditional-producer output problem has a recommended shape (one label per
  producer port). No entry is closed because nothing this phase wrote is verified against a real
  Galaxy workflow; the six new decisions carry that as confidence, not as prose.

  Phase 5 (IWC comparison) added three discoveries, five gaps and one decision, annotated six inherited
  entries, and resolved two - the first status changes this ledger has had, since all 25 entries it
  inherited carried status: open and the two that read as dropped do so through kind: dropped while
  staying open. The status it introduces, status: resolved with resolved_by, is one the ledger's own
  contract names: the artifact is specified as holding "the run's open, resolved, and surrendered
  entries", and the entry schema already carries resolved_by and supersedes. The two resolved are
  entries/multi-db-pick-list-no-galaxy-exemplar and
  entries/variable-arity-fan-in-has-no-attested-galaxy-recipe, both resolved by cited corpus idiom
  recorded in iwc-comparison-notes.md section 3.4 rather than by a built workflow, so each carries its
  scope limit and its reopen condition in its own note. The six annotated entries gained corpus
  measurements and stayed open, including both entries phase 4 marked blocking for this phase: one is
  resolved, the other (entries/db-directory-input-shape-unsettled) the corpus cannot answer. Nothing
  phase 2, 3 or 4 wrote was edited, and the four held-for-operator-decision recommendations are
  untouched; two of them are promoted-output questions that phase 5 found the corpus has an opinion
  about, and that is reported in the notes rather than acted on here.

  Phase 6 (template) added four discoveries, six entries, six decisions and two brief-change
  recommendations; it appended a phase-6 paragraph to the notes of seven entries it inherited
  and changed no status. The reason nothing closes: the artifact this phase wrote is a draft,
  so every question an entry poses that a real wrapper or a real Galaxy run answers is still
  open - the entry that phase 5 said the corpus could not answer (entries/db-directory-input-
  shape-unsettled) is now carried in the user-facing form as sixteen `type: data` inputs with
  no `format`, which narrows it but does not answer it. Three of the six new entries are
  blocking for advance-galaxy-draft-step: the DB-or-rebuild fork now lives inside twelve
  consumer wrappers (entries/db-or-rebuild-fork-cannot-gate), MultiQC's three non-dataset
  inputs have no producer in this workflow (entries/multiqc-input-fragments-have-no-producer),
  and the promoted summary tables vary their datatype with run_taxa_classification
  (entries/arg-summary-producer-is-input-dependent). One is blocking for the test phases
  instead and is the one that can still change the topology: entries/preannotated-complement-
  reading-diverges-from-source. Both new recommendations are held, not applied, so the phase-3
  brief and the four recommendations the operator is still reviewing are byte-unchanged.

discoveries:
  - id: funcscan-pulls-every-db-from-the-network
    raised_by: nextflow-summary-to-galaxy-reference-data
    evidence: >-
      All eleven reference_rebuilds[] builders are network pulls: bakta_db download,
      amrfinder_update, deeparg downloaddata, download-antismash-databases, deepbgc download,
      run_dbcan database --aws_s3, mmseqs databases, download_bigslice_hmmdb,
      bin/ampcombi_download.py, curl of protein_annotation_interproscan_db_url, and a
      hard-coded https://card.mcmaster.ca/latest/data fetch at arg.nf:97.

  - id: ten-of-eleven-db-consumers-run-per-sample
    raised_by: nextflow-summary-to-galaxy-reference-data
    evidence: >-
      AMPCOMBI2_PARSETABLES, BAKTA_BAKTA, AMRFINDERPLUS_RUN, RGI_MAIN, DEEPARG_PREDICT,
      ANTISMASH_ANTISMASH, DEEPBGC_PIPELINE, RUNDBCAN_CAZYMEANNOTATION, INTERPROSCAN and
      MMSEQS_TAXONOMY each take a per-sample channel alongside the database; only
      BIGSLICE_BIGSLICE takes a .collect()-ed input (bgc.nf:135-148). The source deliberately
      hoists each download into its own process and first()-s the result so it runs once.
    impact: >-
      A Galaxy wrapper that rebuilds on absence would re-pull a full public database once per
      sample, so the mapping note's ~3-rebuild threshold rules out in-tool rebuild for these.

  - id: several-tools-carry-their-db-inside-the-env
    raised_by: nextflow-summary-to-galaxy-reference-data
    evidence: >-
      AMPlify, ampir, Macrel, GECCO, argNorm, ABRicate's default databases and fARGene expose
      no database param - only *_skip_* flags - so their reference data is installed inside the
      conda env / container their modules declare. Nothing in reference_assets[] can show this.
    impact: >-
      The Galaxy wrapper must ship the same environment, or data the Nextflow user never had to
      supply becomes a Galaxy input.

  - id: funcscan-declares-almost-no-path-types
    raised_by: nextflow-summary-to-galaxy-reference-data
    evidence: >-
      Only input, outdir and multiqc_config carry a format keyword across 220 params; every
      database param is a bare type=string. Asset path-ness in the summary is name- and
      usage-derived (reference_assets[] confidence medium), and asset_kind carries no
      format_hint for them.
    impact: >-
      Datatype choice for the Galaxy inputs cannot be read off the source; it has to be argued
      per asset (brief section 7), and the interface deliberately leaves format unset for the
      nine directory-shaped database inputs rather than guess.

  - id: funcscan-publishes-through-config-not-emits
    raised_by: nextflow-summary-to-galaxy-interface
    evidence: >-
      NFCORE_FUNCSCAN emits one channel (multiqc_report); FUNCSCAN emits multiqc_report plus
      versions. Everything else reaches the user through 61 publishDir declarations, all of them
      withName: selectors in conf/modules.config and none inline in a process - processes[].
      publish_dir is null for all 55 processes, so only publish_dir_matches carries them.
      25 of the 61 are conditional (params.save_db x13, params.save_annotations x4, plus
      run_taxa_classification, run_protein_annotation, bgc_savefilteredcontigs,
      arg_rgi_savejson, arg_rgi_savetmpfiles, arg_fargene_savetmpfiles) and GUNZIP's is
      enabled: false (13 + 4 + 2 + 6 = 25).
    impact: >-
      Galaxy has no publishing step, so none of those 61 result sets becomes a workflow output
      unless the interface asks for it explicitly; conversely the 36 unconditional ones need no
      work at all, because step outputs already land in the history.

  - id: headline-summary-tables-are-published-by-a-bgzip-step
    raised_by: nextflow-summary-to-galaxy-interface
    evidence: >-
      MERGE_TAXONOMY_AMPCOMBI, MERGE_TAXONOMY_HAMRONIZATION and MERGE_TAXONOMY_COMBGC each carry
      a publishDir whose saveAs is { _ -> null }, i.e. deliberately voided, and the file the user
      receives is the output of the aliased AMP_/ARG_/BGC_TABIX_BGZIP steps (canonical
      TABIX_BGZIP, output + gzi ports, ext.prefix set to hamronization_complete_summary_taxonomy
      in conf/modules.config). HAMRONIZATION_SUMMARIZE's own publishDir carries
      saveAs: { params.run_taxa_classification == false ? it : null }, so the combined ARG report
      is hamronization_combined_report.tsv when taxa classification is off and
      hamronization_complete_summary_taxonomy.tsv.gz when it is on.
    impact: >-
      A promoted output must name the bgzip step, not the computing step, and is conditional on
      run_taxa_classification with two different producing ports and two formats.

  - id: three-quarters-of-the-param-surface-is-plain-tool-knobs
    raised_by: nextflow-summary-to-galaxy-interface
    evidence: >-
      Bucketing all 220 params: 1 sample sheet, 15 reference/annotation data params, 9 reference
      selectors, 27 workflow-shape controls, 4 MultiQC report-config params, 23 runtime/publish/
      CLI/report-transport params, and 141 tool knobs (annotation_* 40, bgc_* 40, arg_* 27,
      amp_* 22, taxa_classification_* 10, protein_annotation_* 2). Of the 141, 69 are booleans
      and 8 carry closed enums; none appears in a workflow.conditionals[] guard, none is a path,
      and only 8 change which files a command writes.
    impact: >-
      Exposing the whole surface would put 199 fields on one Galaxy form to reach the 58 params
      that decide what runs and what data is needed; the interface pins 133 of them at their
      nextflow.config defaults instead (entries/tool-surface-pinned-at-source-defaults).

  - id: annotation-tool-switch-changes-the-step-count
    raised_by: nextflow-summary-to-galaxy-interface
    evidence: >-
      params.annotation_tool selects among prodigal / pyrodigal / prokka / bakta, and the branches
      are not one-for-one swaps: annotation.nf:39-44 runs the Pyrodigal module twice under two
      include aliases (PYRODIGAL_GBK with "gbk", PYRODIGAL_GFF with "gff") and then four GUNZIP
      aliases over its outputs, while BAKTA_BAKTA yields 10 result ports (+versions) and PROKKA 12
      (+versions) from a single call.
    impact: >-
      A single promoted annotation output cannot follow the switch, and the data-flow brief has to
      wire a different number of steps per branch; see entries/conditional-output-producer-unexpressible.

  - id: four-of-seven-screening-subworkflows-are-data-sinks
    raised_by: nextflow-summary-to-galaxy-data-flow
    evidence: >-
      At the top level only ANNOTATION (faa, gff, gbk, multiqc_files, versions), TAXA_CLASS
      (sample_taxonomy, versions) and PROTEIN_ANNOTATION (tsv, versions) carry data onward. AMP,
      ARG, BGC and CAZYME contribute versions and nothing else (funcscan.nf:251,271,297,329,352,376),
      and CAZYME declares no emit: block at all (cazyme.nf:11-75). ANNOTATION.out.fna and
      AMP.out.{ampcombi_summaries, ampcombi_summary_count} are emitted and never read.
    impact: >-
      Four of the seven lanes have no outgoing Galaxy edge, so nothing downstream can notice that
      they produced nothing, and their whole scientific payload reaches the user through publishDir
      alone - which is why phase 3's promotion list is load-bearing rather than cosmetic, and why a
      test plan cannot assert on those lanes through any downstream step.

  - id: most-of-the-edge-list-is-a-split-then-reassemble-cycle
    raised_by: nextflow-summary-to-galaxy-data-flow
    evidence: >-
      Over workflows/funcscan.nf plus the seven local subworkflows (8 files): 15 .join(), 7
      .multiMap{}, 6 .groupTuple(), 2 .transpose(), 29 non-versions .mix() and 18
      .filter{...isEmpty()} sites. funcscan.nf:70-96 is the archetype - each row's four slots are
      flattened into tagged events, transposed, gunzipped, groupTuple()d back together and then
      re-split by filename-extension sniffing (files.find { it.toString().tokenize('.').last()
      .matches('fasta|fas|fna|fa') } at :86), with [] filling any slot the row did not carry.
    impact: >-
      Under the four aligned sample_sheet collections the slot label is membership, so the split and
      the reassembly both disappear (decisions/per-collection-mapping-replaces-split-and-reassemble).
      The corollary is the real risk: nothing in the summary's edge list says which joins are
      load-bearing reshape and which are plumbing, so a translator working from edges alone builds
      reshape steps for plumbing.

  - id: emptiness-is-tested-per-consumer-and-the-warning-dies-there
    raised_by: nextflow-summary-to-galaxy-data-flow
    evidence: >-
      18 .filter { file != [] && file.isEmpty() } sites, distributed per consumer rather than once
      per collection - faa before InterProScan, AMP, ARG, BGC and CAZYME, gbk before AMP and BGC,
      taxonomy tsv before AMP/ARG/BGC, harmonised tsv before argnorm - each with its own log.warn
      ("... will not be processed by ..."), 23 log.warn sites in total across the 8 wiring files.
      Three distinct states are conflated by that one idiom: slot not supplied ([]), file present but
      0 bytes (Path.isEmpty()), and file present but carrying no records
      (AMPCOMBI2_COMPLETE.out.tsv.filter { tsv -> tsv.countLines() > 1 } at amp.nf:138).
    impact: >-
      A faithful translation repeats the filter at each consumer (~18 filter steps, not one), and
      Galaxy has no user-visible per-element skip notice, so a sample that silently disappears from
      one lane's output is unexplained. See entries/per-element-skip-warnings-have-no-galaxy-surface.

  - id: interproscan-output-is-rewritten-by-groovy-before-anyone-uses-it
    raised_by: nextflow-summary-to-galaxy-data-flow
    evidence: >-
      protein_annotation.nf:37-44 reads the InterProScan tsv back with new File(tsv_path).readLines()
      and appends two literal 'NA' fields to every line, writing
      ${workflow.workDir}/tmp/${meta.id}_interproscan.faa.tsv, then emits the rewritten file as the
      subworkflow's tsv. The source comment gives the reason: "INTERPROSCAN 5.72-103.0 only includes
      13 columns and not 15 which ampcombi expects".
    impact: >-
      This is the only Groovy closure in the pipeline that transforms file bytes, it is invisible in
      summary-nextflow.json (subworkflow Groovy is not a process, so no script_excerpt carries it),
      and the promoted interproscan_table must bind to the rewritten table and not to the tool's own
      output - promoting the tool output would publish a table that AMPcombi rejects.

  - id: dead-wiring-in-the-bgc-warning-block
    raised_by: nextflow-summary-to-galaxy-data-flow
    evidence: >-
      bgc.nf:182-189 joins ch_bgcresults_for_combgc to fastas with remainder: true and filters the
      result to emit a log.warn for samples with no BGC results; the filtered channel is never read
      and COMBGC is invoked on the unfiltered channel at bgc.nf:191.
    impact: >-
      Zero Galaxy nodes. Recorded so that the phase 6 template does not materialise a join and a
      filter that the source itself discards, and so the missing "no BGC hits for sample X" notice is
      attributed to the same gap as the other 22 warnings rather than mistaken for lost wiring.

  - id: multiqc-report-carries-no-screening-results
    raised_by: nextflow-summary-to-galaxy-data-flow
    evidence: >-
      ch_multiqc_files starts empty at funcscan.nf:60 and receives exactly four things: the collated
      versions YAML (:426), workflow_summary_mqc.yaml (:429), methods_description_mqc.yaml (:434)
      and, under the wider guard at :436, ANNOTATION.out.multiqc_files. No per-tool multiqc output
      port is collected anywhere - grep for "out.multiqc" across subworkflows/local/ returns only
      that ANNOTATION edge. MultiQC's only argument is --title from multiqc_title
      (conf/modules.config:21-28).
    impact: >-
      The one workflow output funcscan emits describes software versions, the parameter summary, a
      methods blurb and Prokka/Bakta statistics - and says nothing about AMP, ARG, BGC, CAZYME or
      taxa results. Phase 9 must not treat multiqc_report.html as a scientific checkpoint, and this
      is the concrete reason phase 3 declined to judge a run by it.

  - id: versions-collation-and-parameter-summary-have-no-galaxy-producer
    raised_by: nextflow-summary-to-galaxy-data-flow
    evidence: >-
      70 ch_versions.mix() sites feed softwareVersionsToYAML(...).collectFile(storeDir:
      "${outdir}/pipeline_info", name: 'nf_core_funcscan_software_mqc_versions.yml', sort: true) at
      funcscan.nf:414-421; paramsSummaryMap(workflow, parameters_schema: ...) ->
      paramsSummaryMultiqc(...) -> collectFile('workflow_summary_mqc.yaml') at :427-429; and
      methodsDescriptionText(...) -> collectFile at :430-434. All three are nf-core helper functions
      over the live workflow object, and the versions channel also mixes Path values with
      (process, tool, version) triples, separated by branch { versions_file: entry instanceof Path }
      at :397-402.
    impact: >-
      Galaxy keeps versions per job and has no workflow-level versions channel, no heterogeneous
      channel to split by type, and no step that can read the resolved parameter set and run
      metadata. So the promoted versions output that interface brief section 10.2 lists has no
      producer node as specified - an interface delta (data-flow brief section 17.1), not a wiring
      problem the template can solve.

  - id: two-gating-decisions-are-channel-level-not-process-level
    raised_by: nextflow-summary-to-galaxy-data-flow
    evidence: >-
      funcscan.nf:143 (stamp gff_type: 'prodigal' onto newly-annotated samples when
      run_cazyme_screening && !cazyme_skip_dbcan && (!dbcan_skip_cgc || !dbcan_skip_substrate)) and
      funcscan.nf:163 (build ch_prepped_input_long only when run_bgc_screening) are parameter guards
      that change a metadata field and a channel respectively; neither appears among the 13
      workflow.conditionals[] rows in summary-nextflow.json, which are attributed to process names
      in affects[] and so have nowhere to record a guard that invokes no process.
    impact: >-
      A translator working from the summary alone drops both: the CAZYME lane loses the gff_type
      value it hard-requires (cazyme.nf:44 skips a sample whose meta.gff_type is missing), and the
      long-contig branch loses its own gate. Both are re-added in the data-flow brief section 10; the
      detector gap itself is filed in the feedback ledger.

  - id: corpus-gates-live-in-parameter-space
    raised_by: compare-against-iwc-exemplar
    evidence: >-
      125 gated steps across 29 of 133 IWC workflows. Every one spells its guard as the literal
      when: $(inputs.when) and carries the value's provenance in its when input connection, resolved to
      {id, output_name} in the legacy JSON; 42 are fed directly by a workflow input and 83 by a computed
      step - map_param_value 47, a gated subworkflow's own when 32, param_value_from_file 2, pick_value
      2. Legacy type: conditional steps: 0 in the whole corpus, and 0 negated when: expressions.
    impact: >-
      Settles the construction question the data-flow brief could only infer. A Galaxy gate is a
      connected boolean plus a self-reference, it may be fed by another step's output, and chaining gates
      through a helper step is the majority case rather than the exception - which is the construction
      entries/data-derived-gate-needs-nonemptiness-threshold said no note described. It also bounds that
      inference: every computed gate in the corpus is derived from a *value*, never from a *dataset*.

  - id: corpus-inverts-gates-in-step-space-with-two-pick-values
    raised_by: compare-against-iwc-exemplar
    evidence: >-
      The exemplar expresses "run the ARG-specific clustering only when the full-catalogue flag is
      false" as two pick_value steps: a gated step whose state is pick_style first_or_default with
      pick_from [false] and default_value true, feeding an ungated step whose pick_from value is a
      ConnectedValue and whose default_value is likewise true; that second step's boolean_param then
      feeds two gated tool steps and one gated subworkflow. No gate in 133 workflows is written as a
      negated expression, and 24 workflows pair pick_value with at least one gated step.
    impact: >-
      funcscan's skip_* params (arg_skip_deeparg, dbcan_skip_cgc, cazyme_skip_dbcan, ...) are inverted
      guards, so each costs this two-step chain rather than one when: string - a step-count effect the
      data-flow brief's 11-gate count does not include. It also bears on the held
      brief_change_recommendations/annotation-tool-override-belongs-on-the-form: the corpus never puts a
      derived value of any kind into a gate, let alone a tool identity chosen by another input.

  - id: multiqc-wrapper-offers-fixed-numbered-result-slots
    raised_by: compare-against-iwc-exemplar
    evidence: >-
      The exemplar's multiqc 1.35+galaxy4 step exposes seven independent optional slots,
      results_0..results_6, each a nested software_cond group holding an input plus an optional software
      label, wired to five different producers including a collapse_dataset output and an argNorm report.
      In bacterial_genomics/amr_gene_detection the producers are tooldistillator and
      tooldistillator_summarize, and both of those results are promoted as well.
    impact: >-
      Gives the report lane a hard number to design against: one MultiQC step takes a fixed small number
      of separately-labelled inputs, so funcscan's 61 result sets cannot be reported per-lane without an
      aggregation step (the corpus's Tooldistillator route) or several MultiQC steps. The slot count is
      wrapper-version-specific, so the count for whatever phase 7 picks must be read from the wrapper.

  - id: ampcombi2-parsetables-takes-a-six-argument-tuple
    raised_by: nextflow-summary-to-galaxy-template
    evidence: >-
      subworkflows/local/amp.nf:96-103 invokes AMPCOMBI2_PARSETABLES(input, faa, gbk,
      params.amp_ampcombi_db_id, params.amp_ampcombi_db, interpro): six positional ports,
      which the module declares as amp_input, faa_input, gbk_input, opt_amp_db, opt_amp_db_dir
      and opt_interproscan. The hits side reaches the one `amp_input` port through
      groupTuple().join(faa).join(gbk).join(interpro).multiMap, so an element carries 1-4 hit
      files for one sample, while the two database ports are workflow values, not per-sample
      data.
    impact: >-
      Settles the shape the data-flow brief left as a candidate list for merge point M1: the
      AMPcombi2 fan-in is one four-axis bundle per sample (sample x {hits} aligned with faa,
      gbk and interpro), so the flat `multiple: true` reading is out for this consumer and the
      two database ports must stay outside the collection. comBGC is unaffected - its
      ext.prefix shows it re-deriving the sample from the filename - so the flat option stays
      live there.

  - id: annotation-gunzips-two-arms-and-only-two-arms-emit-multiqc-inputs
    raised_by: nextflow-summary-to-galaxy-template
    evidence: >-
      subworkflows/local/annotation.nf:41-44 gunzips PYRODIGAL_GBK.out.faa, .fna, .annotations
      and PYRODIGAL_GFF.out.annotations; :60-63 mirrors that for the prodigal arm
      (amino_acid_fasta, nucleotide_fasta, gene_annotations). Of the four annotation tools,
      only prokka (out.txt) and bakta emit a file MultiQC consumes.
    impact: >-
      Sizes the subworkflow this phase had to instantiate: 19 inner steps, 8 of them gunzip,
      and a report contribution that is a two-slot pick (prokka, bakta) per instance. A
      pyrodigal-only or prodigal-only run therefore contributes nothing to the MultiQC report
      even though it runs the heaviest stage, which is the second reason the report lane is
      thin (the first is entries/multiqc-input-fragments-have-no-producer).

  - id: the-multiqc-guard-is-not-the-annotation-guard
    raised_by: nextflow-summary-to-galaxy-template
    evidence: >-
      funcscan.nf:126 gates ANNOTATION on (run_arg_screening && !arg_skip_deeparg) ||
      run_amp_screening || run_bgc_screening || run_cazyme_screening. funcscan.nf:436 gates
      the ANNOTATION-to-MultiQC connection on (run_arg_screening && !arg_skip_deeparg) ||
      (run_amp_screening && (amp_run_hmmsearch || !amp_skip_amplify || !amp_skip_ampir)) ||
      run_bgc_screening.
    impact: >-
      One logical question, two different predicates 310 lines apart, so the template cannot
      write one `when:` string for both: 12 gated steps carry the ANNOTATION gate and the
      report lane carries the MultiQC one. The difference is observable, not cosmetic - the
      MultiQC guard is false where the ANNOTATION guard is true in two cases, a cazyme-only
      run (no cazyme term) and an AMP run with hmmsearch off and both amplify and ampir
      skipped (three extra sub-conditions). The draft reproduces both rather than merging
      them.

  - id: branch-label-readings-conflict-for-preannotated-rows
    raised_by: nextflow-summary-to-galaxy-template
    evidence: >-
      funcscan.nf:97-100 is `branch { preannotated: gff != [] || gbk != []; fastas: true }`.
      :106 and :118 feed ch_input_for_annotation from `.fastas`; :154-155 and :167 then
      `.mix(ch_intermediate_input.preannotated)` back in, under the comment at :139 "Mix back
      the preannotated samples with the newly annotated ones". assets/schema_input.json
      requires sample and fasta on every row and adds only dependentRequired protein<->gbk,
      gff->protein, so a pre-annotated row always carries a FASTA.
    impact: >-
      Whether the map form's `fastas: true` is a catch-all or an always-true condition decides
      whether a pre-annotated sample is annotated once (complement reading, matching the
      comment) or reaches every lane twice under one identifier (non-exclusive reading,
      matching the operator's documented semantics, which could not be executed in this run).
      The two readings are not interchangeable in Galaxy, where a collection cannot hold two
      elements with the same id, so the fix under the non-exclusive reading is an extra
      collapse step per lane and not a flipped predicate. See entries/preannotated-complement-
      reading-diverges-from-source.

entries:
  - id: db-directory-input-shape-unsettled
    status: open
    kind: gap
    raised_by: nextflow-summary-to-galaxy-reference-data
    unmet: "A Galaxy input shape for the eleven multi-file reference databases/directories"
    missing: >-
      Neither packaged note picks between a directory-typed input, one uploaded archive dataset
      unpacked by a first step, and a multiple:true file list for reference data; no IWC
      exemplar is cited. Provisional default recorded as decisions/db-inputs-as-uploaded-archives,
      confidence low.
    resolved_by: null
    supersedes: null
    note: >-
      Close at compare-against-iwc-exemplar / discover-shed-tool by citing a wrapped tool that
      takes a database argument, and stating the shape its wrapper accepts. Phase 3 narrowed but
      did not close this: it left format unset on all nine directory-shaped DB inputs rather than
      hard-code a low-confidence choice into the user-facing form, so the shape question now
      blocks the template's inputs: block, not just the brief.

      Phase 4 narrowed it a second time and still cannot close it. Two of the eleven assets turn out

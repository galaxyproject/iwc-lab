entries:
  - id: foundry-cli-bootstrap-install-cannot-satisfy-schema-pin
    raised_by: summarize-nextflow
    observed_in:
      mold: summarize-nextflow
      path: content/molds/summarize-nextflow/index.md
      revision: 20
      content_hash: d8e6759095994ad000fb8b78018da070761a5abfb8cf0a80c6c59b550a272501
      foundry_head: 871b5e6deadfd56aeb5e2ba92eb8f6f50c8449ee
    subject:
      kind: cli-tool
      label: foundry
      locator: content/cli/foundry/index.md
      content_hash: 85505b02785fea8bfb0429ac78224dfef0dce63c933140f087f7257a04e52a86
    kind: defect
    severity: blocker
    what: >-
      The documented bootstrap install (npm install -g @galaxy-foundry/gxwf-foundry,
      no version pin) resolves to 0.4.0, whose bundled
      @galaxy-foundry/summarize-nextflow schema is stale: $defs.Process carries 15
      properties and omits publish_dir_matches, resolved_args, and template, all three
      of which the Mold's procedure section 4 mandates emitting and all three of which
      fall under additionalProperties: false. No published release satisfies the cast's
      own version gate: 0.4.0 reports its summary-nextflow schema as sha256
      839e11b1892af74df3158377027e7d340a67dafdb9b5965d79e9715a1a109d54 against the
      pinned 1b8872152de9be50634b3ec73cfd5963ae0ec19a95ccb99f6fe734f42656d80d and exits
      4, while 0.1.2, 0.2.0 and 0.3.0 reject --schema-sha256 with "unknown option".
      Foundry main carries a summary-nextflow schema structurally identical to the
      cast's 284-path copy, so the cast pin is current and only the npm publish lags.
    expected: >-
      Pin the bootstrap to a gxwf-foundry release that carries the cast's
      summary-nextflow schema (or publish one, since main already has it), and say in
      the CLI note that `latest` must be verified against the --schema-sha256 gate
      before a run starts rather than assuming a clean install is a usable validator.
    evidence: >-
      On a freshly installed toolchain, foundry validate-summary-nextflow
      --schema-sha256 1b887... exited 4 with "schema skew" and validated nothing.
      Structural diff of the installed dist/schema/summary-nextflow.schema.json against
      the bundle's packaged copy gave 266 common paths, 0 changed paths, 0 paths new in
      the validator, and 18 paths present only in the bundle ($defs.PublishDirMatch,
      $defs.ResolvedArg, $defs.ProcessTemplate and their Process fields). Diffing Foundry
      main's packages/summarize-nextflow/src/schema/summary-nextflow.schema.json against
      the bundle copy showed 284/284 paths identical and no textual difference modulo
      key order and whitespace. Phase 1 halted at its pre-flight gate and wrote no
      artifact.
    status: open
    issue: null
  - id: summarize-nextflow-validation-gate-has-documented-failure-but-no-recovery-path
    raised_by: summarize-nextflow
    observed_in:
      mold: summarize-nextflow
      path: content/molds/summarize-nextflow/index.md
      revision: 20
      content_hash: d8e6759095994ad000fb8b78018da070761a5abfb8cf0a80c6c59b550a272501
      foundry_head: 871b5e6deadfd56aeb5e2ba92eb8f6f50c8449ee
    subject:
      kind: mold
      label: summarize-nextflow
      locator: content/molds/summarize-nextflow/index.md
      content_hash: d8e6759095994ad000fb8b78018da070761a5abfb8cf0a80c6c59b550a272501
    kind: gap
    severity: major
    what: >-
      The Validation section states what exit 4 means and orders the run to stop, but says
      nothing about what to do next, and the Mold's own bundle already carries the exact
      schema the gate asks for. The cast has no documented way to finish a summary once the
      installed validator lags, so every run that hits the skew either dies at phase 1 or
      improvises a substitute validator with no guidance on whether that is admissible.
    expected: >-
      State the recovery path in the Mold: the bundle's
      references/schemas/summary-nextflow.schema.json is hash-identical to the value passed
      to --schema-sha256, so when the installed validator is out of step, validate the
      emitted artifact against that packaged copy with any Draft-07 validator, record the
      substitution in Summary.warnings[], and link the skew entry. Also say explicitly that
      dropping schema-mandated Process fields to satisfy a stale validator is not a permitted
      workaround, since that is the tempting wrong answer.
    evidence: >-
      After the exit-4 gate this run could neither proceed nor stop usefully: Foundry main
      carried the pinned schema, npm 0.4.0 did not, and no published release had both
      --schema-sha256 and a matching schema. Resolution required inspecting the installed
      package layout and diffing three schema copies by hand before choosing to validate
      against the bundle's own copy.
    status: open
    issue: null
  - id: reference-rebuild-asset-param-fk-is-prose-only-so-a-fabricated-binding-validates
    raised_by: nextflow-summary-to-galaxy-reference-data
    observed_in:
      mold: nextflow-summary-to-galaxy-reference-data
      path: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
      revision: 5
      content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
      foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
    subject:
      kind: schema
      label: summary-nextflow
      locator: "package://@galaxy-foundry/summarize-nextflow#summaryNextflowSchema"
      content_hash: 1b8872152de9be50634b3ec73cfd5963ae0ec19a95ccb99f6fe734f42656d80d
    kind: gap
    severity: major
    what: >-
      ReferenceRebuildRule.asset_param is described as "FK into `params[].name`" and
      guard_params as param names, but nothing enforces either: the def checks only that
      the strings are present. Phase 1 of this run emitted all ten rebuild rules with
      invented asset_param names and prose guards, and the artifact still validated with
      zero errors. The Mold makes the field load-bearing - reference-data is told to read
      reference_rebuilds[] as the primary classification input and that a non-empty list
      means compute-if-missing applies to those asset_param values - so a downstream brief
      inherits a fabricated param name with no signal, and the pipeline only finds out when
      someone happens to grep the source tree.
    expected: >-
      Make the bindings checkable rather than advisory: have validate-summary-nextflow
      assert asset_param resolves to a params[].name entry, builder resolves to a
      processes[].name or subworkflows[].name entry, and every guard_params entry appears
      in params[].name, as a cross-field pass alongside the schema check. State in the
      summarize-nextflow Mold that these bindings must be derived from the branch pairing
      and never written by hand, and that a binding the detector cannot recover is omitted
      with a Summary.warnings[] row, not filled with a plausible-looking name.
    evidence: >-
      The pre-fix artifact listed interproscan_download_db, amp_download_databases,
      taxa_classification_mmseqs_download_db, arg_amrfinderplus_download_db,
      bgc_antismash_download_db, annotation_bakta_download_db, bgc_bigslice_download_db,
      arg_deeparg_download_data, bgc_deepbgc_download_db and cazyme_dbcan_download_db: none
      of the ten exists in params[], and every guard read "invoked unconditionally within
      its screening subworkflow when the parent screening stage is enabled". Both the bad
      and the corrected artifact reported 0 schema errors. Re-derived from source, the real
      pairs are amp_ampcombi_db <- AMP_DATABASE_DOWNLOAD (amp.nf:119), annotation_bakta_db
      <- BAKTA_BAKTADBDOWNLOAD (annotation.nf:89), arg_amrfinderplus_db <-
      AMRFINDERPLUS_UPDATE (arg.nf:42), arg_deeparg_db <- DEEPARG_DOWNLOADDATA (arg.nf:131),
      bgc_antismash_db <- ANTISMASH_ANTISMASHDOWNLOADDATABASES (bgc.nf:44), bgc_deepbgc_db
      <- DEEPBGC_DOWNLOAD (bgc.nf:78), bgc_bigslice_db <- BIGSLICE_DOWNLOADDB (bgc.nf:141),
      cazyme_dbcan_db <- RUNDBCAN_DATABASE (cazyme.nf:27),
      protein_annotation_interproscan_db <- INTERPROSCAN_DATABASE (protein_annotation.nf:24)
      and taxa_classification_mmseqs_db <- MMSEQS_DATABASES (taxa_class.nf:27).
    status: open
    issue: null
  - id: rebuild-guard-field-has-no-way-to-say-derived-or-absent
    raised_by: nextflow-summary-to-galaxy-reference-data
    observed_in:
      mold: nextflow-summary-to-galaxy-reference-data
      path: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
      revision: 5
      content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
      foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
    subject:
      kind: schema
      label: summary-nextflow
      locator: "package://@galaxy-foundry/summarize-nextflow#summaryNextflowSchema"
      content_hash: 1b8872152de9be50634b3ec73cfd5963ae0ec19a95ccb99f6fe734f42656d80d
    kind: gap
    severity: minor
    what: >-
      ReferenceRebuildRule.guard is typed as a required string and documented as the
      "verbatim guard expression", but four of this pipeline's ten rebuild branches are a
      bare `else`, which has no condition to copy. The field forces the run to put
      something in: either a derived negation that looks verbatim, or prose that pretends
      to be a condition, which is what phase 1 did.
    expected: >-
      Widen the field to record provenance, e.g. an optional guard_kind of
      verbatim | derived_negation | branch_else plus the enclosing stage guard, or make
      guard nullable with the enclosing chain conditions carried alongside. Downstream
      needs to know which param decides the rebuild, and right now it cannot tell a copied
      condition from a paraphrase.
    evidence: >-
      funcscan's rebuild sites pair a consuming branch with a bare else at amp.nf:118,
      annotation.nf:87, bgc.nf:39-46, bgc.nf:75, bgc.nf:140, protein_annotation.nf:22 and
      taxa_class.nf:25, and use `else if` at arg.nf:44, arg.nf:133 and cazyme.nf:29. Only
      the latter three have a guard string to copy; the rest needed a derived
      "! ( cond ) && ! ( cond )" form whose status had to be smuggled into
      evidence.evidence[]. The stage guard that actually gates the rebuild
      (!params.bgc_skip_antismash, params.bgc_run_bigslice, params.annotation_tool ==
      "bakta", ...) has no field at all.
    status: open
    issue: null
  - id: rebuild-detector-blind-to-aliased-multistep-and-url-sourced-builders
    raised_by: nextflow-summary-to-galaxy-reference-data
    observed_in:
      mold: nextflow-summary-to-galaxy-reference-data
      path: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
      revision: 5
      content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
      foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
    subject:
      kind: research
      label: nextflow-reference-data-classification
      locator: content/research/nextflow-reference-data-classification/index.md
      content_hash: 2b33f3bddb635c9d700e506784b4bf16f8c387369bc66194a15cb75be9ad8a1f
    kind: gap
    severity: major
    what: >-
      The compute-if-missing section resolves detection entirely into "any non-empty
      reference_rebuilds[] entry" and, for the positive form the detector misses, tells the
      brief to mark the asset rebuild-unverified. On nf-core/funcscan that instruction
      produces an empty rebuild surface and eleven unverified flags, because the pipeline's
      rebuilds are not only positive-form: they are also invoked through an include alias,
      chained over two processes, and in one case sourced from a hard-coded URL with no
      param behind it. None of the three is named as a known gap, so a run following the
      note cannot distinguish "no rebuild exists" from "the detector could not see it", and
      the fallback advice quietly turns eleven load-bearing database builds into unknowns.
    expected: >-
      Add the three blind spots to the Known gap list beside the positive form: builders
      invoked under an `include { X as Y }` alias (match aliases as well as canonical process
      names), rebuilds needing more than one process (name the producer, carry the follow-on
      steps), and builders whose source is a literal URL passed as a val rather than a
      param-derived path. Make the fallback advice conditional too - "rebuild unverified" is
      honest only after someone has checked the branch pairing, so say that a run holding the
      source tree should confirm by hand before flagging.
    evidence: >-
      Deriving reference_rebuilds[] from the subworkflow sources by hand gave 11 rules where
      the documented detector yields none. arg.nf:93 fetches CARD with
      UNTAR_CARD([[], file('https://card.mcmaster.ca/latest/data', checkIfExists: true)]) -
      an alias of the generic UNTAR module, so a canonical-name process set skips the download
      outright - and RGI_CARDANNOTATION then converts it, making it a two-process rebuild; a
      first attempt matching canonical names alone reported RGI_CARDANNOTATION as the builder
      and lost the fetch. The other 10 pair a fromPath(params.X) branch against a bare else
      or else-if that invokes a *_DOWNLOAD / *_DATABASE / *_UPDATE process, the shape the
      note does not claim to cover.
    status: open
    issue: null
  - id: reference-asset-kind-is-free-form-while-the-mold-documents-a-closed-list
    raised_by: nextflow-summary-to-galaxy-reference-data
    observed_in:
      mold: nextflow-summary-to-galaxy-reference-data
      path: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
      revision: 5
      content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
      foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
    subject:
      kind: mold
      label: nextflow-summary-to-galaxy-reference-data
      locator: content/molds/nextflow-summary-to-galaxy-reference-data/index.md
      content_hash: b49bae31e3b8918b45f852b8f50e1101e71837380b97f8e8ec237a5dd2955f7f
    kind: gap
    severity: minor
    what: >-
      The Mold's "Reading the summary" section presents asset_kind as a closed 12-value list
      (fasta, fasta_index, sequence_dictionary, bwa_index, tabix_index, gtf, gff, bed, vcf,
      database, other), but the schema declares it a free-form string with a different
      example list that adds bwamem2_index and reference_sheet. Nothing agrees, so a
      reference-data brief cannot branch on asset_kind safely, and this run's phase 1 emitted
      four vocabulary entries that appear in neither list.
    expected: >-
      Pick one: constrain asset_kind to an enum in the schema, or state in the Mold that it
      is open-vocabulary and list the values the summarizing Mold is expected to emit -
      including the two this pipeline needed, a "tool ships its own database in the
      container/conda env" kind and a "closed enum naming a database rather than locating
      one" kind, neither of which the current vocabulary expresses.
    evidence: >-
      This run's reference_assets[] uses tool_reference_database, database_selector,
      reference_file and pipeline_config_asset. The closed list forced genuinely different
      things together: arg_rgi_data (enum NA/wgs/plasmid/chromosome), arg_deeparg_model (LS /
      SS) and amp_ampir_model (precursor / mature) are curated select options and landed in
      the same bucket as real database paths, while the AST-community tools whose databases
      ride inside their conda env (AMPlify, ampir, Macrel, GECCO, argNorm, ABRicate defaults,
      fARGene) have no kind at all and fell out of reference_assets[] entirely.
    status: open
    issue: null
  - id: params-default-has-no-resolution-rule-when-the-schema-omits-it
    raised_by: nextflow-summary-to-galaxy-interface
    observed_in:
      mold: nextflow-summary-to-galaxy-interface
      path: content/molds/nextflow-summary-to-galaxy-interface/index.md
      revision: 6
      content_hash: 43966773391578490688098c9333f6eb2eaa94574755f5b6554e7f9b72a605c0
      foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
    subject:
      kind: mold
      label: summarize-nextflow
      locator: content/molds/summarize-nextflow/index.md
      content_hash: d8e6759095994ad000fb8b78018da070761a5abfb8cf0a80c6c59b550a272501
    kind: gap
    severity: major
    what: >-
      Procedure section 3 says to read the nextflow.config params block for defaults and, when
      nextflow_schema.json exists, to "prefer it as the source of truth for type, description, and
      required". Default is deliberately absent from that list, but nothing states where default
      comes from when the two sources disagree - and for an nf-core pipeline they always disagree,
      because the generated schema omits default for params whose value lives only in config. A run
      that reads default off the schema and finds nothing records "no default" for params that do
      have one, and nothing downstream can tell the two apart, because null means both "unset in
      the source" and "not written into the schema". This run emitted exactly that: 129 of 220
      params with default null, including 99 of 102 booleans whose config value is false.
    expected: >-
      State the resolution rule in section 3: params[].default is the value nextflow.config assigns
      at runtime, the schema's default is used only for params config does not assign, and a null
      means config assigns null. Add the nf-core specifics that make the trap easy to fall into -
      nf-core omits default from the schema for most booleans, so schema-only extraction loses
      every false - and say what to do with a templated config value (record the flattened form or
      skip it, but do not emit an unresolved Groovy string as a value).
    evidence: >-
      funcscan 4.0.0: nextflow.config assigns all 220 params explicitly; nextflow_schema.json
      carries a default for 91 of them, 3 of the 102 booleans. Merging config values into the
      artifact recovered 101 defaults, produced 0 conflicts with the schema, left 28 params null
      because config assigns null, and needed one special case (custom_config_base, whose config
      value is a template over custom_config_version). The interface brief needed real defaults to
      write 61 input fields, so the fix could not be deferred; it is recorded in
      <run>/foundry-run.yml under phase 1. The artifact's own Summary.warnings[] now carries the
      rule, but that is this run improvising a policy the Mold does not state.
    status: open
    issue: null
  - id: sample-sheet-note-recommends-record-without-flagging-implicit-mapping
    raised_by: nextflow-summary-to-galaxy-interface
    observed_in:
      mold: nextflow-summary-to-galaxy-interface
      path: content/molds/nextflow-summary-to-galaxy-interface/index.md
      revision: 6
      content_hash: 43966773391578490688098c9333f6eb2eaa94574755f5b6554e7f9b72a605c0
      foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
    subject:
      kind: research
      label: galaxy-sample-sheet-collections
      locator: content/research/galaxy-sample-sheet-collections/index.md
      content_hash: 98736fdcd0c4f4698af4e0cd4c539b33e3d0db872de1e10487556b21033030ec
    kind: gap
    severity: major
    what: >-
      The "Mapping from Nextflow sample sheets" table sends "heterogeneous typed per-row artifacts"
      to sample_sheet:record, and the params note repeats that recommendation as "Multiple
      heterogeneous path columns per row". Neither entry mentions the constraint the same note
      states five sections earlier: allow_implicit_mapping is True for everything except record. So
      the variant the note tells a run to pick is the one variant that cannot be mapped over
      implicitly, which is the whole point of a per-sample workflow input, and the brief has to
      discover the collision between two sections of one note with no guidance on which way to
      resolve it. Worse, record cannot express per-row-optional datasets at all - a record has a
      fixed named member set for every element - so the pipeline whose rows genuinely vary in which
      datasets they carry has no variant offered for it, and no row of the mapping table names that
      case.
    expected: >-
      Add the implicit-mapping consequence to the record row of both tables, and add a row for
      "path columns that are optional per row" naming the fallback (one sample_sheet collection per
      slot, aligned by element_identifier, with identifier sync replacing schema validation) so a
      run is not choosing between two silent losses on its own. If the intended answer is
      placeholder datasets inside a record, say that explicitly.
    evidence: >-
      funcscan's assets/schema_input.json requires only sample and fasta, with dependentRequired
      {protein: [gbk], gbk: [protein], gff: [protein]}, so valid rows come in three shapes and the
      fasta-only row is the common case; sample_sheet:record would force all four datasets on every
      row. The source itself splits the row with a multiMap into fastas|faas|gffs|gbks and gives
      each consumer only the slot stream it needs, which is why four parallel sample_sheet inputs
      were chosen in <run>/nextflow-galaxy-interface.md section 2.1, at the cost of moving row
      validation to identifier alignment (carried as entries/samplesheet-per-row-optional-slots).
    status: open
    issue: null
  - id: datatype-note-has-no-genbank-or-hmm-row
    raised_by: nextflow-summary-to-galaxy-interface
    observed_in:
      mold: nextflow-summary-to-galaxy-interface
      path: content/molds/nextflow-summary-to-galaxy-interface/index.md
      revision: 6
      content_hash: 43966773391578490688098c9333f6eb2eaa94574755f5b6554e7f9b72a605c0
      foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
    subject:
      kind: research
      label: nextflow-path-glob-to-galaxy-datatype
      locator: content/research/nextflow-path-glob-to-galaxy-datatype/index.md
      content_hash: 04d728aef2d113ff01cd00789cc7980cb808d5bc51bdf9752ef7ee53af486419
    kind: gap
    severity: minor
    what: >-
      The core datatype table covers some thirty extensions but has no GenBank/EMBL row and no HMM
      profile row, while its confidence ladder offers no rung for the actual situation - an
      extension that is a registered Galaxy datatype yet absent from this note. The note is the
      Mold's declared authority for choosing format, so the run must either omit format for a
      first-class sequence format or assert one the note cannot back, and the second option's
      confidence has no defined label.
    expected: >-
      Add gbk/gbff/embl -> genbank and hmm/hmm3 -> hmm3 rows with confidence, or add one line to
      the confidence ladder saying what to do when the registry knows a datatype and the table does
      not: cite galaxy-datatypes-conf, mark it medium, and name it as unchecked against the note.
      Silent omission is the worse default, because a wrong format on an input slot is visible to
      users, not just to the run.
    evidence: >-
      funcscan takes .gbk/.gbff as a sample-sheet column (pattern ^\\S+\\.(gbk|gbff)(\\.gz)?$) and
      produces GenBank from PROKKA (*.gbk), BAKTA_BAKTA (*.gbff), the pyrodigal annotations port
      (*.gbk.gz) and GECCO's convert-format option; the HMM inputs amp_hmmsearch_models,
      bgc_hmmsearch_models and annotation_bakta_hmms have no row either. This run asserted genbank
      at low confidence and recorded entries/gbk-slot-datatype-unconfirmed; the reference-data Mold
      had already asserted hmm3 in phase 2 for the same reason, so one gap bit two phases.
    status: open
    issue: null
  - id: ledger-kind-cannot-record-a-param-pinned-at-a-fixed-default
    raised_by: nextflow-summary-to-galaxy-interface
    observed_in:
      mold: nextflow-summary-to-galaxy-interface
      path: content/molds/nextflow-summary-to-galaxy-interface/index.md
      revision: 6
      content_hash: 43966773391578490688098c9333f6eb2eaa94574755f5b6554e7f9b72a605c0
      foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
    subject:
      kind: research
      label: open-requirements-ledger
      locator: content/research/open-requirements-ledger/index.md
      content_hash: d3d36d558ae5a58de46a0eb869a5f5966be6b02fdb569476e4f77ce1cc1ddf7d
    kind: gap
    severity: minor
    what: >-
      nextflow-params-to-galaxy-inputs gives a Mold three outcomes for a control param: promote it
      to a scalar input, "resolve to a fixed Galaxy design default", or record a validation loss.
      The ledger's kind enum has only gap and dropped, so the middle outcome has nowhere to go -
      dropped is defined as "source work it decided not to carry", but a pinned param is still in
      the workflow, carrying its source value, with no user lever. Filing it as dropped asserts a
      cut that did not happen, which is the mirror image of the warning the note already gives about
      recording a cut as a gap. The note's own open question about totalling drops makes the cost
      concrete: one entry here stands for 133 params.
    expected: >-
      Either add a kind for work carried at a fixed value (pinned or carried-fixed) with units plus
      the value's source, or say in the params note that pinning is filed as dropped with the fixed
      value and its provenance in because, so readers know the params are present but not editable.
      Either way, keep the three vocabularies - promoted, pinned, dropped - distinguishable, since
      the interface decision that matters downstream is which of the three a param got.
    evidence: >-
      funcscan: of 220 params, 58 became 61 Galaxy inputs, 136 are pinned at their nextflow.config

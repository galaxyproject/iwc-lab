      model for the repeat-the-expression fallback plus the sanctioned way to express a shared
      condition (an input the workflow documents as derived, a validation-style first step, or
      duplication with a comment). Naming which of the three is corpus-practice would settle more than
      the subworkflow-vs-inline question for any pipeline whose branches are chosen by computed
      predicates, which is most of them - funcscan's annotation_tool override is only the loudest case.
    evidence: >-
      funcscan's annotation switch annotation.nf:29 is

      revision: 2
      content_hash: f38341565d0927321248b67a9d99ce9533cc89ef4e543cbf80378260e7025f7e
    kind: gap
    severity: major
    what: >-
      The note's worked idiom is when: $(inputs.when) - a boolean that arrives as a workflow input -
      and its engine evidence covers how a skipped step behaves, how when_values cascade into a
      subworkflow, and how pick_value fans outputs back in. What it never addresses is a guard the
      workflow must compute itself: a predicate over several inputs, or over a step's result. Those are
      two different translations and the note gives neither, so a Mold facing one has to choose between
      repeating the whole expression on every gated step, inventing an upstream boolean-producing step
      whose output type and legality in when: are unattested, or hoisting the decision to the user (an
      interface change, not a data-flow one) - and the note's own decision rubric (subworkflow when: vs
      inline when:) is silent on all three because it presumes the guard already exists as a value.

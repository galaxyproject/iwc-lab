  - id: sample-sheet-note-never-states-that-element-identifiers-must-be-unique
    raised_by: nextflow-summary-to-galaxy-data-flow
    observed_in:
      mold: nextflow-summary-to-galaxy-data-flow
      path: content/molds/nextflow-summary-to-galaxy-data-flow/index.md
      revision: 8
      content_hash: f71cc2b4ceb115d7d93c3dd2e622cbfafb8b9f338f1dd450ee5773f3c0a0e247
      foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
    subject:
      kind: research
      label: galaxy-sample-sheet-collections
      locator: content/research/galaxy-sample-sheet-collections/index.md
      revision: 2
      content_hash: 98736fdcd0c4f4698af4e0cd4c539b33e3d0db872de1e10487556b21033030ec
    kind: gap
    severity: minor
    what: >-
      The note is detailed about column types, restrictions, validators, the record variant's
      allow_implicit_mapping, and map-over propagation of column_definitions, but it never states the
      one property the whole element_identifier design depends on: whether element identifiers within
      one sample_sheet collection must be distinct, and what happens to a sheet with two rows sharing
      one value in the identifier column. That is the first question a translation hits, because the
      note's advice is to key every element on the sheet's sample column and then align collections by
      identifier - advice that is only safe if that column is unique, which is a property of the source's
      schema rather than of Galaxy, and which the note never tells the reader to go check.
    expected: >-
      A sentence in the note stating the constraint (and whether the collision is a validation error, a
      silent overwrite, or a runtime failure), plus an instruction to compare the source sheet's key
      against it - the same way the note already tells the reader to carry column metadata forward
      explicitly. The data-flow mold's own procedure already demands "say what makes an element unique";
      it would be cheaper if the note it loads on demand said what the target requires.
    evidence: >-
      funcscan is the counter-example the note does not cover: assets/schema_input.json puts
      uniqueItems: true on the array of row objects, not on the sample column, so two rows sharing a
      sample are valid input today - they are merged by groupTuple() at funcscan.nf:84 and then
      files.find { ... } at :86-89 keeps only the first file matching each slot's extension test,
      discarding the rest with no message. The fixture sheet cannot expose this (tests/*.snap show
      sample_1, sample_2, sample_3 with one row each). So the key column is assumed unique by the
      interface design and is not enforced by the source; the translation turns a silent data-loss case
      into a rejected upload, which is an improvement that has to be documented as such. Carried as
      entries/sample-column-uniqueness-assumed-not-enforced in <run>/open-requirements.ledger.yml.
    status: open
    issue: null

  - id: conditionals-detector-attributes-only-to-processes-so-channel-guards-vanish
    raised_by: nextflow-summary-to-galaxy-data-flow
    observed_in:
      mold: nextflow-summary-to-galaxy-data-flow
      path: content/molds/nextflow-summary-to-galaxy-data-flow/index.md
      revision: 8
      content_hash: f71cc2b4ceb115d7d93c3dd2e622cbfafb8b9f338f1dd450ee5773f3c0a0e247
      foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
    subject:
      kind: schema
      label: summary-nextflow
      locator: package://@galaxy-foundry/summarize-nextflow#summaryNextflowSchema
      content_hash: 1b8872152de9be50634b3ec73cfd5963ae0ec19a95ccb99f6fe734f42656d80d
    kind: gap
    severity: minor
    what: >-
      workflow.conditionals[] is {guard, branch, affects[]}, and affects[] names processes. A parameter
      guard that invokes no process - one that builds a channel conditionally, or stamps a metadata
      field that a later process reads - therefore has nowhere to be recorded, and the omission is
      silent: no warnings[] row, no placeholder, nothing a downstream Mold can see. These are not
      exotic shapes; they are how nf-core pipelines annotate meta per branch, and how they build
      optional per-variant input channels, and both change which elements exist downstream.
    expected: >-
      Either allow a channel name (or a <channel, field> pair) in affects[] alongside process names, or
      emit a warnings[] row for every parameter guard that resolves to no process in the primary
      workflow, so the omission is at least visible to the Mold that has to translate it. The second is
      the cheaper fix and matches the schema's existing practice of surfacing detector blind spots as
      warnings rather than as silent gaps.
    evidence: >-
      funcscan's primary workflow has 32 if/else-if blocks - 16 whose condition reads params, 16 whose
      condition reads data. The 13 conditionals[] rows cover 14 of the 16 param-level blocks (:278 and
      :300 are the same guard in two arms and share one row); 2 were dropped for lack of a process to
      attribute them to. funcscan.nf:163 builds
      ch_prepped_input_long only when run_bgc_screening, and funcscan.nf:143 stamps
      meta + [gff_type: 'prodigal'] under a 5-input guard - the value RUNDBCAN_EASYCGC and
      RUNDBCAN_EASYSUBSTRATE take per element, and whose absence makes cazyme.nf:44 skip the sample
      entirely. Both were recovered here by reading workflows/funcscan.nf directly, which is
      affordable for one workflow and not for a loop; a run working only from the summary would have
      translated neither. Re-emerged as discoveries/two-gating-decisions-are-channel-level-not-process-level
      in <run>/open-requirements.ledger.yml, where both are back as gates.
    status: open
    issue: null
  - id: iwc-corpus-legacy-ga-shapes-are-documented-nowhere-in-the-bundle
    raised_by: compare-against-iwc-exemplar
    observed_in:
      mold: compare-against-iwc-exemplar
      path: content/molds/compare-against-iwc-exemplar/index.md
      revision: 12
      content_hash: 84abb427cbcbae5616ae22e4a7fa803f14350605c246638575b3a32c5ad9c6fb
      foundry_head: 94ce4ea20107680b467d03e8889b63689774e325
    subject:
      kind: mold
      label: compare-against-iwc-exemplar
      locator: content/molds/compare-against-iwc-exemplar/index.md
      revision: 12
      content_hash: 84abb427cbcbae5616ae22e4a7fa803f14350605c246638575b3a32c5ad9c6fb
    kind: defect
    severity: major
    what: >-
      The Mold says to normalize candidate workflows with convert as needed for structural comparison and
      says nothing else about what is on disk. In this corpus the consequences of measuring the native
      format anyway - cheaper than converting 133 files - are silent and quantitative: tool_state is a
      JSON *string* inside each step; a gated step's when is the literal string "$(inputs.when)" with the
      real provenance in input_connections.when = {id, output_name}; top-level inputs and outputs are
      *lists* keyed by id, not maps; a step's in is a list of {id, source}; an embedded subworkflow is
      nested whole inside one step; and steps are a dict keyed "0".."N". Three of my first-pass
      measurements were wrong because of this and each looked like a corpus fact: 0 sample-sheet inputs
      (true, by luck), 0 text-valued database params (false - 44 exist; the probe had tested the raw JSON
      instead of the escaped tool_state), and 0 gates whose provenance can be resolved (false - all 125
      resolve once the legacy connection shape is known). Three files
      (VGP-assembly-v2/Assembly-Hifi-HiC-phasing-VGP4, -Trio-phasing-VGP5, -Hifi-only-VGP3) additionally
      carry step entries that are not objects and crash a straightforward parser, so the ranking covers
      130 of 133.
    expected: >-
      State the corpus's serialization once - legacy .ga, format-version 0.1, tool_state as an embedded
      JSON string, when: as a literal with provenance in the input connection - and say to convert first
      and measure the converted form, or to parse tool_state when measuring natively. A three-line shape
      note would have kept three wrong numbers out of a run artifact; they were caught only because the
      results were implausible ("nobody in IWC gates a step" is not believable) and were re-derived from
      parsed values. Also worth one line: some files do not parse cleanly.
    evidence: >-
      Verified on the operator-supplied corpus under bioHackthon/iwc/workflows: 133 .ga files, all with
      format-version 0.1 and release/uuid/readme keys; 125 gated steps across 29 files, every one carrying
      the literal when string. Corrected figures reproduced by /tmp/gxy-scratch/iwcidioms.py and
      iwcgates.py (run with -I) after iwcscan.py's first version failed on the dict-shaped steps.
    status: open
    issue: null

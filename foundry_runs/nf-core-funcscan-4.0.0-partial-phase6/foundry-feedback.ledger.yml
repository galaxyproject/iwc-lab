      (!bgc_skip_antismash || !bgc_skip_deepbgc || !bgc_skip_gecco)) || (annotation_tool == "prodigal"
      && run_amp_screening) - an OR over 6 inputs that also silently overrides the user's own
      annotation_tool value with a log.warn at :32-37. Under the inputs-only reading this becomes 12
      repeated when: strings per ANNOTATION instance (6 pyrodigal steps carry it, 6 prodigal steps
      carry its negation conjoined with the equality test) and 24 across the two instances this brief
      recommends, from 8 distinct expressions; the same reading puts the workflow at about 26
      step-level strings and 12 distinct expressions in total. Recorded with the count rather than a
      fix because the count is the argument - and it evaporates if when: does accept step outputs, which

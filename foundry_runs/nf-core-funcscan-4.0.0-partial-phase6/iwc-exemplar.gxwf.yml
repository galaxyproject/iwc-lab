  fields: null
  column_definitions: null
  doc: Input for this workflow is a paired collection from metagenomics trimmed reads
- id: AMR genes detection database
  type: string
  optional: false
  restrictOnConnections: true
  doc: Select the database to identify AMR genes with AMRFinderPlus.
- id: Full genes catalogue
  type: boolean
  optional: false
  default: false
  doc: Set it to Yes if you want to have the full gene catalogue. Functionnal and taxonomical annotation are made
    on full clustered CDS
- id: Virulence genes detection database
  type: string
  optional: false
  restrictOnConnections: true
  doc: Select the database to identify virulence genes with ABRicate.
- id: starAMR database
  type: string
  optional: false

# Dependency-closed relevant subgraph of the IWC workflow
#   microbiome/metagenomic-genes-catalogue/metagenomic-genes-catalogue.ga (release 1.6)
# Obtained with: gxwf convert --to format2 --compact, then pruned to 22 of 36 steps that
# carry the structural motifs iwc-comparison-notes.md compares (gated steps, pick_value
# gate values and twin cascades, the screening fan-out, collapse/argNorm fan-in, and the
# gated embedded subworkflow) plus their transitive dependencies and the workflow inputs
# they read. The MultiQC tail and the taxonomy branch that only fed it are outside the
# slice and are quoted in the notes instead. Nothing was rewired, relabelled or hand-edited.
class: GalaxyWorkflow
name: metagenomic-genes-catalogue - relevant subgraph
doc: Metagenomic analysis, from raw reads to gene catalog. Uses Megahit to assemble contigs and Prodgial to predict
  CDSs on contigs to provide the gene catalog. Finally, functional, taxonomic, and antimicrobial resistance information
  is provided.
license: GPL-3.0-or-later
release: '1.6'
tags:
- Metagenomics
- fastq
- ABRomics
- genes-collection
- paired-collection(s)
uuid: 5b5917c3-40e0-4046-903c-ff85d7c44c96

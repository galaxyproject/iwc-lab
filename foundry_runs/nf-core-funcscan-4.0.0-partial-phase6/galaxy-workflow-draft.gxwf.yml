steps:
- id: unpack_fasta
  tool_id: TODO
  in:
  - id: TODO_records
    source: input_fasta
  out:
  - id: TODO_inflated
  _plan_context: |-
    Galaxy step label: unpack fasta.
    element datatype fasta / fasta.gz. Transform-or-pass-through over files: inflate a gzipped dataset, otherwise copy it, so the source's accepted input set is preserved and no per-element branch is needed (per-element-branch-has-no-galaxy-carrier).
    source process: GUNZIP_INPUT_PREP (alias of GUNZIP)
    module aliases present in this pipeline: AMP_GUNZIP_HMMER_HMMSEARCH, GUNZIP_INPUT_PREP, GUNZIP_MACREL_PRED, GUNZIP_PRODIGAL_FAA, GUNZIP_PRODIGAL_FNA, GUNZIP_PRODIGAL_GBK, GUNZIP_PRODIGAL_GFF, GUNZIP_PYRODIGAL_FAA, GUNZIP_PYRODIGAL_FNA, GUNZIP_PYRODIGAL_GBK, GUNZIP_PYRODIGAL_GFF
    module: modules/nf-core/gunzip/main.nf
    process when: task.ext.when == null || task.ext.when
    publishDir (GUNZIP): [ enabled: false ]
    command excerpt: def args = task.ext.args ?: '' def extension = (archive.toString() - '.gz').tokenize('.')[-1] def name = archive.toString() - '.gz' - ".${extension}" def prefix = task.ext.prefix ?: name gunzip = prefix + ".${extension}" """ # Not calling gunzip itself because it creates files # with the original group ownership rather than the # default one for that user / the work directory gzip \\ -cd \\ ${args
  _plan_state: one step per sheet, unconditional
  _plan_in: '- archive: tuple val(meta), path(archive)'
  _plan_out: |-
    - gunzip: tuple val(meta), path("${gunzip}")
    - versions: path "versions.yml"

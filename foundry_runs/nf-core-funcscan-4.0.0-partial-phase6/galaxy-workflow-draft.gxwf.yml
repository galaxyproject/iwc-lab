class: GalaxyWorkflowDraft
label: nf-core/funcscan 4.0.0 - functional profiling of (meta)genomes
doc: |-
  Draft translation of nf-core/funcscan 4.0.0 (git aee3dc9) into a Galaxy workflow.

  Topology is settled here, not deferred: 62 workflow inputs, 14 promoted outputs, 95 outer steps
  (38 of them inside the two embedded ANNOTATION bodies), 94 gated steps, and every producer->consumer
  edge named. Wrapper resolution is evidence-gated and honest about the boundary this run could read:
  NO step is Resolved, because the only wrapper whose authored state is attested inside this run
  directory (pick_value) needs `__current_case__` indices the excerpt does not show. 23 steps are
  identity-pinned (concrete tool_id quoted verbatim in iwc-exemplar.gxwf.yml or
  iwc-comparison-notes.md, tool_version TODO, no state); the rest are Deferred and carry the source
  process, pinned tool version, container, ext.args, publishDir and the source's own declared channel
  ports in _plan_context / _plan_in / _plan_out.

  Steps carry `id` only, never `label`: in list form gxformat2 addresses a labelled step by its
  label, which would silently break every edge in this file. Each _plan_context opens with the UI
  label the implementation step should give it.

  `versions` is deliberately NOT promoted - nothing in this pipeline produces a versions bundle
  (open-requirements: versions-output-has-no-producer, held for operator decision). The MultiQC
  report therefore carries only what this workflow can really feed it; see the blocking entries in
  open-requirements.ledger.yml for the three fragments it is missing.

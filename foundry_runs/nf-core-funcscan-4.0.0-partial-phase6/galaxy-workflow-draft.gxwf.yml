inputs:
- id: input_fasta
  type: collection
  collection_type: sample_sheet
  format:
  - fasta
  - fasta.gz
  label: Nucleotide sequences (samplesheet FASTA column)
  optional: false
  doc: one row per sample; the only required sheet. Rows must stay aligned with input_protein / input_gbk
    / input_gff by sample id - nothing enforces it.
  column_definitions:
  - name: sample
    type: element_identifier
    optional: false
- id: input_protein
  type: collection
  collection_type: sample_sheet
  format:
  - fasta
  - fasta.gz
  label: Pre-annotated protein FASTA (protein column)
  optional: true
  doc: optional; nf-schema couples protein<->gbk, which four parallel collections cannot express, so supply
    both or neither.
  column_definitions:
  - name: sample
    type: element_identifier
    optional: false
- id: input_gbk
  type: collection
  collection_type: sample_sheet
  format:
  - genbank
  - gbk
  label: Pre-annotated GenBank (gbk column)
  optional: true
  doc: membership of this sheet is also the 'arrived already annotated' predicate that keeps a sample
    out of the annotation steps.
  column_definitions:
  - name: sample
    type: element_identifier
    optional: false
- id: input_gff
  type: collection
  collection_type: sample_sheet
  format:
  - gff3
  - gff3.gz
  label: Pre-annotated GFF (gff column)
  optional: true
  doc: gff_type travels here because it describes the GFF; dbCAN's EasyCGC needs it per element and it
    does not survive map-over, so it is re-attached by the carry_gff_type / stamp_gff_type steps.
  column_definitions:
  - name: sample
    type: element_identifier
    optional: false
  - name: gff_type
    type: string
    optional: true
    restrictions:
    - NCBI_prok
    - prodigal
    - NCBI_euk

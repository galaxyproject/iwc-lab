  when: ( ( ( $(inputs.run_arg_screening) && $(inputs.arg_skip_deeparg) == false ) || $(inputs.run_amp_screening)
    || $(inputs.run_bgc_screening) || $(inputs.run_cazyme_screening) ) && $(inputs.run_bgc_screening)
    )
  in:
  - id: records
    source: select_to_annotate_long/TODO_records
  - id: annotation_tool
    source: annotation_tool
  - id: run_amp_screening
    source: run_amp_screening
  - id: run_bgc_screening
    source: run_bgc_screening
  - id: bgc_skip_antismash
    source: bgc_skip_antismash
  - id: bgc_skip_deepbgc
    source: bgc_skip_deepbgc
  - id: bgc_skip_gecco
    source: bgc_skip_gecco
  - id: annotation_bakta_db
    source: annotation_bakta_db
  - id: annotation_bakta_db_downloadtype
    source: annotation_bakta_db_downloadtype
  - id: annotation_bakta_hmms
    source: annotation_bakta_hmms
  out:
  - id: faa
  - id: fna
  - id: gbk
  - id: gff
  - id: mqc
  run:
    class: GalaxyWorkflowDraft
    label: ANNOTATION body
    inputs:
    - id: records
      type: collection
      collection_type: list
      label: Sequences to annotate
      format:
      - fasta
      - genbank
      - fasta.gz
    - id: annotation_tool
      type: text
      default: pyrodigal
      label: Annotation tool
    - id: run_amp_screening
      type: boolean
      default: false
      label: Run AMP screening
    - id: run_bgc_screening
      type: boolean
      default: false
      label: Run BGC screening
    - id: bgc_skip_antismash
      type: boolean
      default: false
      label: skip antiSMASH
    - id: bgc_skip_deepbgc
      type: boolean
      default: false
      label: skip DeepBGC
    - id: bgc_skip_gecco
      type: boolean
      default: false
      label: skip GECCO
    - id: annotation_bakta_db
      type: data
      optional: true
      label: Bakta DB archive
    - id: annotation_bakta_db_downloadtype
      type: text
      default: full
      label: Bakta DB download flavour
    - id: annotation_bakta_hmms
      type: data
      optional: true
      label: Bakta HMM files
    outputs:
    - id: faa
      outputSource: pick_faa/data_param
    - id: fna
      outputSource: pick_fna/data_param
    - id: gbk
      outputSource: pick_gbk/data_param
    - id: gff
      outputSource: pick_gff/data_param
    - id: mqc
      outputSource: pick_mqc/data_param
    steps:
    - id: pyrodigal_gbk
      tool_id: TODO
      when: ( $(inputs.annotation_tool) == "pyrodigal" || ( $(inputs.annotation_tool) == "prodigal" &&
        $(inputs.run_bgc_screening) && ( $(inputs.bgc_skip_antismash) == false || $(inputs.bgc_skip_deepbgc)
        == false || $(inputs.bgc_skip_gecco) == false ) ) || ( $(inputs.annotation_tool) == "prodigal"
        && $(inputs.run_amp_screening) ) )
      in:
      - id: TODO_fasta
        source: records
      out:
      - id: TODO_annotations
      - id: TODO_faa
      - id: TODO_fna
      - id: TODO_score
      _plan_context: |-
        Galaxy step label: pyrodigal gbk.
        source process: PYRODIGAL_GBK (alias of PYRODIGAL)
        module aliases present in this pipeline: PYRODIGAL_GBK, PYRODIGAL_GFF
        module: modules/nf-core/pyrodigal/main.nf
        pinned tool: pyrodigal 3.6.3 | bioconda::pyrodigal=3.6.3 | -
        process when: task.ext.when == null || task.ext.when
        ext.args (PYRODIGAL): [

  - code: element-identifier-divergence
    message: "Galaxy identifiers differ from source names. Read elements are forward and reverse sub-elements of reads_paired and <sample>_forward and <sample>_reverse after __FLATTEN__ (join_identifier _). Source names are _1 and _2 for reads and post_conversion_1 and _2 for FastQC. The single-end element is named by sample id (test3), against test3_other. Element assertions use the Galaxy identifiers."
    path: "fastqc_post_conversion_html; reads_paired; reads_single"
  - code: gating-semantics-unverified
    message: "paired_name_sort and paired_fastx run when paired_count > 0; single_collate and single_fastx when paired_count === 0. paired_count is a per-sample integer, a collection-valued when input. Whether Galaxy evaluates that per element is unverified (ledger draft-when-null-semantics-unverified, per-element-classifier-gating-no-corpus-precedent)."
    path: "galaxy-workflow.gxwf.yml steps paired_name_sort, paired_fastx, single_collate, single_fastx"

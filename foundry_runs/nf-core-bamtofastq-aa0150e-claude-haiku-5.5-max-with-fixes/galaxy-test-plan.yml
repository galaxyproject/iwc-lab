plan_version: "1"

source:
  kind: nextflow
  name: "nf-core/bamtofastq @ aa0150e"
  derived_from: test-evidence
  notes: >-
    Translated from the pinned nf-test snapshots in source/tests/. The selected candidate
    (summary-nextflow test_selection) is tests/default.nf.test::-profile test, and it stays the
    primary case. tests/no_bai.nf.test::-profile test --input test_bam_samplesheet_no_bai.csv is a
    second, supplementary case: it is the only pinned case with a single-end sample (test3) and no
    index column, which matches the v1 interface (no index input). Snapshot md5 tokens are upstream
    expectations; no value comes from a Galaxy run. Values marked fixture-derived are counted from
    the fixture BAM bytes in test-data/, not from nf-core outputs.

workflow:
  title: "nf-core-bamtofastq (aa0150e) draft"
  label_source: draft
  notes: >-
    galaxy-workflow.gxwf.yml: class GalaxyWorkflow, 20 tool steps, no subworkflows. Four steps carry
    per-sample when gates (see warnings). Inputs: alignments (list of BAM, element identifier =
    sample id) and multiqc_title (optional text). Outputs asserted: reads_paired, reads_single,
    multiqc_report, fastqc_pre_conversion_html, fastqc_post_conversion_html, samtools_flagstat,
    samtools_idxstats, samtools_stats, fastqutils_info.

test_cases:
  - id: default-paired
    doc: >-
      Selected candidate tests/default.nf.test::-profile test (primary). Samples test and test2 are
      both fully paired-end by the fixture bytes: test has 2821 complete pairs (its 2 secondary
      records are excluded by the 256 filter), test2 has 2718. Expected: reads_paired has two sample
      elements, each with forward and reverse sub-elements of equal size; reads_single is empty.
      Assertions: flagstat and idxstats checksums (test-evidence); has_n_lines on reads and a raw
      total sequences check for test2 (fixture-derived); presence and count checks (intent).
      Type or count only, logged: element-count 2 on reads_paired; element-count 0 on reads_single;
      output-present on multiqc_report (existence only); element-present on every collection element
      (identity only). The stable_name directory entries (fastqc/, reads/, samtools/, fastqutils/,
      multiqc/) are not assertions.
    provenance: "tests/default.nf.test::-profile test; source/tests/default.nf.test.snap; fixtures from test-data-refs.json elements test and test2"
    derived_from: mixed
    job_inputs:
      - workflow_label: alignments
        label_status: resolved
        description: "list of 2 paired-end BAM elements, identifier = sample id: test, test2"
        collection_shape: list
        datatype: bam
        fixture:
          storage: remote-url
          location: "test-data-refs.json: alignments elements test, test2"
          checksum: null
          provenance: "SHA-1 per element, computed by nextflow-to-test-data (the source publishes none): test SHA-1:0799f89638bddd570439115c606f425c22d189b1; test2 SHA-1:522fb037cea05b9d41dd69647f27a644838bf507. The samplesheet's bai column is not carried (v1)."

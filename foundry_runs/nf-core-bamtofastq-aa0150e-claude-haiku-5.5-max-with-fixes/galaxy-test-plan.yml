unresolved:
  - kind: fixture
    description: "No BAM index is staged for any element. The default candidate's .bai files are not carried in v1, and the no_bai candidate has none. samtools_idxstats depends on the wrapper indexing internally, which is untested."
    blocking: false
    suggested_resolution: "Decide at phase 12 from the run result. Do not pre-drop samtools_idxstats. If it fails for a missing index, record the failure as a finding. Staging per-sample .bai files would be a v1 scope change."
  - kind: assertion
    description: "samtools_stats for sample test has no content check. The fixture has 5644 records, 2 of them secondary, so raw total sequences is 5644 if it counts all records or 5642 if it counts primary records only. samtools is not installed locally, so this cannot be checked here."
    blocking: false
    suggested_resolution: "Settle the samtools stats semantics from its documentation, not from a Galaxy run. Add the raw total check for test then. Presence only until then."
  - kind: assertion
    description: "Failure rule. A snapshot checksum (flagstat or idxstats) that fails at phase 12 is a finding. The expected value stays the upstream token and is never changed to match Galaxy output."
    blocking: false
    suggested_resolution: "Phase 13 classifies the cause (tool, wrapper, template or assertion) and records it. This plan is not edited to match output."
  - kind: assertion
    description: "Per-sample gating. paired_name_sort and paired_fastx run when paired_count > 0; single_collate and single_fastx run when paired_count === 0. The expectations assume reads_paired holds test and test2 and reads_single holds test3 (no_bai-mixed). Whether Galaxy applies these collection-valued gates per element is unverified."
    blocking: false
    suggested_resolution: "A missing or extra element in reads_paired or reads_single at phase 12 is a finding against the expectations above. It is not a reason to change them."
  - kind: assertion
    description: "No pinned case has only single-end samples, so the zero-paired-element path (paired chain empty for every sample) is not covered by any test."
    blocking: false
    suggested_resolution: "Add a job with only test3, from the same fixture, if the mixed case cannot show that the paired chain is skipped cleanly. Not added here: no upstream evidence."

omissions:
  - target: "workflow.trace.succeeded().size(): 32 (default), 43 (no_bai)"
    reason: "Nextflow task count is an engine measure. The Galaxy job graph differs by design (no collate, merge or per-chromosome tasks), so the count has no Galaxy equivalent."
    category: out-of-scope
  - target: "pipeline_info versions map (removeFromYamlMap of nf_core_bamtofastq_software_mqc_versions.yml) and the methods text"
    reason: "Software versions and methods text are not workflow outputs in v1 (ledger software-versions-yaml-not-exposed, software-versions-and-methods-text-dropped-v1). The source tool versions (samtools 1.23.1, fastqc 0.12.1, fastqutils 0.25.3) are not the pinned Galaxy wrapper versions, so the map is not asserted."
    category: out-of-scope
  - target: "multiqc/multiqc_data/* (multiqc_citations.txt checksum, multiqc_data.json, multiqc.parquet, multiqc.log, multiqc_sources.txt, multiqc_software_versions.txt, llms-full.txt)"
    reason: "MultiQC data directory not exposed (ledger multiqc-data-directory-not-exposed). The Galaxy multiqc step exposes the HTML report and stats only."
    category: out-of-scope
  - target: "reads/*.merged.fastq.gz checksum tokens (test_1, test_2, test2_1, test2_2 in both snapshots; test3_other.fq.gz in no_bai)"
    reason: "Each token hashes decompressed FASTQ, and Galaxy stores fastqsanger.gz, so no checksum can match. Replaced by has_n_lines from the fixture BAMs, which checks record counts (size), not content. Decompressed content is not compared."
    category: weak-output
  - target: "samtools/*.stats checksum tokens (test, test2 in default; test, test2, test3 in no_bai)"
    reason: "The source runs SAMTOOLS_STATS with a reference (source/subworkflows/local/pre_conversion_qc/main.nf:23) and samtools 1.23.1. The stats header records that command line and version, and the Galaxy step has no reference input (v1), so the token cannot match. Replaced by raw total sequences content for test2 and test3; test is presence only (ambiguous count)."
    category: other
  - target: "fastqutils/*.txt checksum tokens (test.txt, test2.txt, test3.txt)"
    reason: "The source writes one text per sample; Galaxy fastq_info runs per read file (ledger fastq-info-per-file-granularity). No Galaxy element is the same artifact, so no checksum is emitted. Identity only."
    category: other
  - target: "No BAM files / No CRAM files captures"
    reason: "The Galaxy workflow declares no BAM or CRAM output, so the property holds by construction. tests-format has no absence assertion."
    category: other
  - target: "CRAM input and reference (tests/cram, tests/no_crai candidates; genome.fasta in every candidate)"
    reason: "cram-input-not-supported-v1 and reference-dropped-with-cram: v1 takes BAM only, with no reference input."
    category: out-of-scope
  - target: "chr extraction (tests/chr candidate; chr_alignments, chr_alignments_index)"
    reason: "chr-extraction-not-built-v1: not built in v1, not on the test path."
    category: out-of-scope
  - target: "user-supplied BAM index (samplesheet bai column) and index steps (default candidate's bai rows)"
    reason: "user-index-column-not-carried and index-dropped-wrappers-index-internally: v1 takes no index input. The idxstats dependence is an unresolved item, not an assertion."
    category: out-of-scope
  - target: "collate options (samtools_collate_fast, reads_in_memory) and the collate path (tests/collate_fast candidate)"
    reason: "collate-options-not-carried. Name-order sort (samtools_sort -n) replaces collate (decision samtools-sort-name-order-replaces-collate)."
    category: out-of-scope
  - target: "no_read_QC and no_stats switches (tests/no_qc, tests/no_stats candidates)"
    reason: "no-read-qc-and-no-stats-switches-not-carried. flagstat also feeds layout detection, so it cannot be gated."
    category: out-of-scope
  - target: "multiqc_config and multiqc_logo inputs"
    reason: "multiqc-config-logo-not-carried: the pinned MultiQC wrapper (1.35+galaxy5) has no port for them."
    category: out-of-scope
  - target: "genome key, iGenomes loader controls and fasta_fai (tests/fai candidate)"
    reason: "genome-key-expansion-not-carried, igenomes-loader-controls-not-carried, reference-dropped-with-cram. The pinned wrappers take no index port (fai-ports-absent-on-pinned-wrappers)."
    category: out-of-scope
  - target: "tests/chr, tests/cram, tests/no_crai, tests/collate_fast, tests/fai, tests/no_qc, tests/no_stats candidates (not translated)"
    reason: "Each depends on a dropped feature listed above. They are not translated or run."
    category: out-of-scope


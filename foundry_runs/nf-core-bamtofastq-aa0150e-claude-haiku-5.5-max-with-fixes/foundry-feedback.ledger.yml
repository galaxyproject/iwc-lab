entries:
  - id: test-data-procedure-resolved-by-contradicts-schema
    raised_by: nextflow-to-test-data
    observed_in:
      mold: nextflow-to-test-data
      path: content/molds/nextflow-to-test-data/index.md
      revision: 4
      content_hash: 842e097edfb5bfbc37b62a35d5870ee2087df33919212a7965fd70dae799b189
      foundry_head: 871b5e6deadfd56aeb5e2ba92eb8f6f50c8449ee
    subject:
      kind: mold
      label: "nextflow-to-test-data"
      locator: content/molds/nextflow-to-test-data/index.md
      content_hash: 842e097edfb5bfbc37b62a35d5870ee2087df33919212a7965fd70dae799b189
    kind: defect
    severity: minor
    what: "Sequence step 4 says every entry carries resolved_by: nextflow-to-test-data, and step 5 sends an input with no declared fixture to find-test-data as resolved: false. The test-data-refs schema requires resolved_by to be null while an entry is unresolved, so following step 4 literally fails validation for the gap."
    expected: "State that resolved_by is nextflow-to-test-data for resolved entries and null for unresolved ones, as the schema requires."
    evidence: "Phase 8, multiqc_title (optional text parameter, unresolved): foundry validate-test-data-refs --schema-sha256 534dcb... reported '/refs/1/resolved_by: must be null (type)' and 'must match then schema' until resolved_by was set to null. The file then validated."
    status: open
    issue: null
  - id: test-data-procedure-silent-on-non-selected-candidate-fixtures
    raised_by: nextflow-to-test-data
    observed_in:
      mold: nextflow-to-test-data
      path: content/molds/nextflow-to-test-data/index.md
      revision: 4
      content_hash: 842e097edfb5bfbc37b62a35d5870ee2087df33919212a7965fd70dae799b189
      foundry_head: 871b5e6deadfd56aeb5e2ba92eb8f6f50c8449ee
    subject:
      kind: mold
      label: "nextflow-to-test-data"
      locator: content/molds/nextflow-to-test-data/index.md
      content_hash: 842e097edfb5bfbc37b62a35d5870ee2087df33919212a7965fd70dae799b189
    kind: gap
    severity: minor
    what: "The procedure maps the selected candidate's declared inputs onto the interface inputs, but it does not say whether an input may take elements from another candidate's declared fixtures, or whether a checksum may be computed from a fetched declared URL when the source publishes none."
    expected: "State the rule: for example, elements may come from another declared candidate when the shape needs them and provenance names the candidate, and a computed checksum is labelled as computed."
    evidence: "Phase 8: the selected candidate declares two BAM rows (test, test2, both paired). The single-end branch needed test3, declared only by tests/no_bai. The source publishes no sha1 (null in the summary), so the checksums were computed from the fetched files and labelled as computed."
    status: open
    issue: null
  - id: template-wires-unchecked-against-pinned-ports
    raised_by: nextflow-summary-to-galaxy-template
    observed_in:
      mold: nextflow-summary-to-galaxy-template
      path: content/molds/nextflow-summary-to-galaxy-template/index.md
      revision: 10
      content_hash: 77f885d640900cca7dac4a3bbb33308d4d8065e871c919c672487db61caf93ab
      foundry_head: 77425ce07f69da2bdda1de21faea3abc4600ae00
    subject:
      kind: mold
      label: "nextflow-summary-to-galaxy-template"
      locator: content/molds/nextflow-summary-to-galaxy-template/index.md
      content_hash: 77f885d640900cca7dac4a3bbb33308d4d8065e871c919c672487db61caf93ab
    kind: gap
    severity: major
    what: "The template wired consumers to ports that the pinned wrappers do not have: index inputs on the samtools steps, a FASTA index input on samtools view and stats, MultiQC config and logo inputs, and a merged collection feeding one MultiQC input. draft-validate accepted each wire. The loop found them in phase 7, after the template had finished."
    expected: "The template's computability review checks each consumer port against the cached tool summary of its pinned wrapper, and records a port with no wrapper counterpart as a blocking entry, so the loop does not have to spend escalations on it."
    evidence: "Run nf-core-bamtofastq-haiku-max-fixed, phase 7: repair 1 closed index-ports-absent-on-pinned-wrappers, fai-ports-absent-on-pinned-wrappers and qc-merge-of-mixed-collections; repair 5 closed multiqc-config-logo-no-port. All five escalations were used (cap 5)."
    status: open
    issue: null
  - id: summarize-manifest-omits-command-block
    raised_by: advance-galaxy-draft-step
    observed_in:
      mold: advance-galaxy-draft-step
      path: content/molds/advance-galaxy-draft-step/index.md
      revision: 12
      content_hash: 12f242ddbbfee7d9fe4ef8b6a2d701beceb71e4885cd19872c51041b04e08b27
      foundry_head: db8801f2f0a31746e35cf399dd96cdbb8aa36dcf
    subject:
      kind: cli-command
      label: "galaxy-tool-cache summarize"
      locator: "https://github.com/jmchilton/galaxy-tool-util-ts"
      content_hash: null
    kind: wish
    severity: minor
    what: "The manifest from galaxy-tool-cache summarize has no command block and no wrapper source, so whether a wrapper sorts or collates internally cannot be read offline."
    expected: "Include the wrapper command block, or its source location, in the summary, or document how to read it offline."
    evidence: "Phase 7, samtools_fastx 1.22+galaxy2: the summary's help is a one-paragraph description, and galaxy-tool-cache info reports source api. The raw GitHub path for the samtools_fastx XML returned 404, and gh api on the same path returned Not Found. The name-sort question was settled from the output options instead."
    status: open
    issue: null
  - id: repair-procedure-realized-step-undefined
    raised_by: repair-galaxy-draft-topology
    observed_in:
      mold: repair-galaxy-draft-topology
      path: content/molds/repair-galaxy-draft-topology/index.md
      revision: 7
      content_hash: 692708480037be9680eda6be70c7fa2fd93604037432f7d94b6363266a6ca25e

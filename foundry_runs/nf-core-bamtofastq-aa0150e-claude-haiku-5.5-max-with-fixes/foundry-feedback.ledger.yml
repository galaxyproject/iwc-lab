      content_hash: 692708480037be9680eda6be70c7fa2fd93604037432f7d94b6363266a6ca25e
    kind: gap
    severity: minor
    what: "add-step lands at draft tier with a wrapper-tier TODO tool_id. advance-galaxy-draft-step step 2 treats a built-in or stock id as the wrapper identity and skips discovery. The repair mold does not say which rule applies to a built-in added step."
    expected: "State the add-step rule for built-in and stock ids: a concrete bare id with tool_version TODO, as advance-galaxy-draft-step step 2 describes."
    evidence: "Phase 7 repair 1 added paired_r1_filter, paired_r2_filter and paired_zip with bare built-in ids and tool_version TODO, matching the template's existing single_filter_null. The Tool Shed candidates (samtools_sort, samtools_fastx) took TODO tool_id, as the rule states."

      content_hash: 692708480037be9680eda6be70c7fa2fd93604037432f7d94b6363266a6ca25e
    kind: gap
    severity: minor
    what: "The procedure forbids removing a realized step and asks for draft-validate --concrete --strict-state when an edit touches one, but realized is not defined in the mold or in its packaged notes."
    expected: "Define realized, for example as a step whose tool_id and tool_version were set by implement-galaxy-tool-step, or any step with no TODO sentinel. State whether template-resolved built-in steps (pick_value, __RELABEL_FROM_FILE__) count."
    evidence: "Phase 7 repair 1 removed three concrete pick_value steps (fai_effective, index_select, pick_index) that carry no TODO sentinel, as feeding-only steps. Under the other reading they were realized and could not be removed. The packaged galaxy-workflow-draft-format note does not define realized."
    status: open
    issue: null

decisions:
- id: genome-key-not-carried
  decided_by: nextflow-summary-to-galaxy-reference-data
  decision: The genome key is not carried. fasta and fasta_fai become explicit optional inputs.
  rationale: The v1 posture forbids admin data tables, and the iGenomes paths are not Galaxy datasets. The explicit fasta carries the same reference.
  evidence:
  - genome-key-expansion-not-carried
- id: fasta-fai-built-once-per-invocation
  decided_by: nextflow-summary-to-galaxy-reference-data
  decision: When fasta is given and fasta_fai is absent, one workflow-tier samtools faidx step builds the index once per invocation. Consumers
    do not rebuild it.
  rationale: The source builds the index once per run (.first() in prepare_indices). Under in-tool rebuild, the per-sample consumers would rebuild
    it many times, past the mapping note's ~3-rebuild threshold for repeated use. This is a documented deviation from the v1 in-tool posture.
  evidence:
  - faidx-precursor-wrapper-not-yet-discovered
- id: fasta-optional-with-cram-note
  decided_by: nextflow-summary-to-galaxy-reference-data
  decision: fasta is an optional input. The interface carries a note that CRAM rows need it.
  rationale: 'nf-schema has required false, the BAM-path uses of fasta are guarded, and the classification note''s example says FASTA is needed
    only for CRAM. Against this: the no-FASTA faidx behaviour is unverified.'
  evidence:
  - absent-fasta-source-behavior-unverified
  - fasta-required-for-cram-not-expressible
- id: samplesheet-as-sample-sheet-record
  decided_by: nextflow-summary-to-galaxy-interface
  decision: 'The input is sample_sheet:record: element identifier sample_id, record slots mapped (bam or cram) and optional index (bai or crai),
    and the column file_type with restrictions.'
  rationale: Each source row can carry a companion index, which sample_sheet would drop. sample_sheet:paired does not fit one alignment per row.
  evidence:
  - samplesheet-record-optional-index-slot
  - samplesheet-duplicate-sample-ids
- id: reads-as-list-paired-or-unpaired
  decided_by: nextflow-summary-to-galaxy-interface
  decision: The reads output is one list:paired_or_unpaired collection, not split by read type.
  rationale: The source merges paired and single outputs into one channel (ch_reads_post_qc). A split would need a routing step, which is harder
    to test.
  evidence:
  - reads-mixed-collection-type
- id: checkpoints-promoted-for-tests
  decided_by: nextflow-summary-to-galaxy-interface
  decision: Promote reads, the samtools flagstat, stats and idxstats tables, and the fastq_info check as public checkpoints. MultiQC and FastQC
    HTML are smoke checks only.
  rationale: The testability note favours stable content. The count and summary tables are stable; the HTML reports vary between runs.
  evidence: []
- id: publish-and-report-controls-excluded
  decided_by: nextflow-summary-to-galaxy-interface
  decision: Publish, notification, logging, CLI and institutional-config parameters are excluded from the interface, each with a recorded assessment.
  rationale: Galaxy owns outputs and notifications. The nextflow-params-to-galaxy-inputs exclusion classes apply, and none of these changes a
    scientific output.
  evidence: []
- id: scalar-analysis-gates-kept
  decided_by: nextflow-summary-to-galaxy-interface
  decision: chr, no_read_QC, no_stats, samtools_collate_fast and reads_in_memory stay as scalar inputs.
  rationale: Each changes which steps run or which command arguments are used. Dropping any of them would remove a source parameter surface.
  evidence: []
- id: reference-broadcast-and-pick
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: The reference is one broadcast dataset per run. fai_effective is chosen by pick_value first_non_null, with the user fai first.
  rationale: In the source the reference is a single value, not a per-sample item. Broadcast matches it.
  evidence: []
- id: index-strategy-fallback-until-carrier
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: 'Target: index only rows without an index. Until the record-slot carrier is verified, index every row and keep the user index per
    element.'
  rationale: Same outputs as the source. The fallback adds indexing work, but needs no unverified carrier.
  evidence:
  - record-split-and-index-presence-carrier
- id: chr-inline-gate-with-pick-rejoin
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: Chromosome extraction is inline, with when gates on its two steps. A per-element pick at N15 rejoins it with the original input.
  rationale: Two steps, no source subworkflow, one rejoin point. The mapped pick pattern is verified.
  evidence:
  - chr-relabel-and-rekey-recipe
- id: qc-gates-inline-keep-pre-conversion-subworkflow
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: The QC gates are inline when gates on the steps. PRE_CONVERSION_QC stays a subworkflow boundary, ungated.
  rationale: The source keeps that boundary, with a narrow interface. Its gates sit on steps, not on the boundary.
  evidence: []
- id: per-element-single-paired-gates
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: 'Single and paired branches are per element: each step carries a per-element when from the single_end boolean. The branches rejoin
    at N25.'
  rationale: A subworkflow when cannot gate one element. The per-element boolean route is verified.
  evidence:
  - reads-rejoin-mixed-types
- id: alignment-chain-subworkflow-with-inline-gates
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: The paired chain stays a subworkflow boundary (ALIGNMENT_TO_FASTQ). The per-element gates sit inside it. There is no subworkflow-level
    when.
  rationale: 'The source boundary is clean: a sample collection and a fai in, paired reads out.'
  evidence:
  - per-element-gate-on-subworkflow
- id: flat-per-file-qc-lists-with-mate-identifiers
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: FastQC and fastq_info run on a flat list of read files. Identifiers are <sample_id>_1 and <sample_id>_2 for paired samples, and <sample_id>
    for single-end samples.
  rationale: This avoids multi-input tools on paired elements. Mate suffixes appear only for paired samples, as the source's own output names
    show.
  evidence:
  - paired-element-to-multi-input-tool
  - fastq-info-per-file-granularity
- id: multiqc-faithful-metadata-only
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: MultiQC gets the config, logo, title and collated text only, as in the source. Sample QC is not mixed in.
  rationale: Faithful to the source. Mixing sample QC in would be a divergence, which is an expert decision.
  evidence:
  - versions-topic-collation-no-recipe
- id: workflow-summary-dropped
  decided_by: nextflow-summary-to-galaxy-data-flow
  decision: The workflow parameter summary (ch_workflow_summary) is dropped.
  rationale: Galaxy records invocation parameters, and no sample data depends on the summary.
  evidence: []
- id: flat-draft-no-subworkflows
  decided_by: nextflow-summary-to-galaxy-template
  decision: The draft has one level and no nested subworkflows. The paired chain (ALIGNMENT_TO_FASTQ) and PRE_CONVERSION_QC are flattened into
    steps with inline when gates. Stage frames (comments) carry the narrative. Supersedes alignment-chain-subworkflow-with-inline-gates and qc-gates-inline-keep-pre-conversion-subworkflow.
  rationale: A subworkflow when gates a whole invocation, not one element (subworkflow-when-cannot-gate-per-element). Per-sample branches need
    gates on steps, so the boundary buys nothing.
  evidence:
  - per-element-gate-on-subworkflow
  - subworkflow-when-cannot-gate-per-element
- id: reads-split-into-paired-and-single-outputs
  decided_by: nextflow-summary-to-galaxy-template
  decision: The draft exposes reads_paired (list:paired, from paired_cat) and reads_single (list, from single_filter_null). Supersedes reads-as-list-paired-or-unpaired.
    BC-1 (split-reads-into-paired-and-single-outputs) stays proposed for expert review.
  rationale: The nearest IWC exemplar exposes two outputs and never mixes read types (iwc-exemplar-sra-manifest-structure). No verified recipe
    rejoins mixed types.
  evidence:
  - reads-mixed-collection-type
  - reads-rejoin-mixed-types
  - iwc-exemplar-sra-manifest-structure
- id: multiqc-includes-sample-qc
  decided_by: nextflow-summary-to-galaxy-template
  decision: MultiQC receives the sample QC outputs (the FastQC zips, flagstat, stats, idxstats and fastq_info, merged by qc_merge), plus config,
    logo, methods and title. Supersedes multiqc-faithful-metadata-only. This diverges from the source, which gives MultiQC only versions, summary
    and methods.
  rationale: With versions and summary dropped, the source's MultiQC inputs leave nothing to report. The expert can reverse this.
  evidence:
  - software-versions-and-methods-text-dropped-v1
  - multiqc-omits-fastqc-and-samtools-qc
- id: collate-kept-with-fastx-export
  decided_by: nextflow-summary-to-galaxy-template
  decision: Name collation stays in deferred steps (single_collate, map_collate, unmap_collate), as in the source's collatefastq. The FASTQ export
    uses the IWC samtools_fastx wrapper (single_fastx, map_fastx, unmap_fastx), pinned at 1.22+galaxy2.
  rationale: The source's samtools collatefastq does both steps in one module. Splitting keeps the source's fast-collate parameters (samtools_collate_fast,
    reads_in_memory) wired. The export has a corpus precedent; collation has none.
  evidence:
  - bam-collate-fastq-no-corpus-precedent
  - samtools-fastx-paired-split-unverified
- id: per-sample-gates-with-filter-null
  decided_by: nextflow-summary-to-galaxy-template
  decision: The single-end and paired branches run per sample under when gates. Skipped elements are removed with __FILTER_NULL__ (single_filter_null,
    map_pairs_filter, unmap_pairs_filter). The branches are not rejoined; each feeds its own output. This refines per-element-single-paired-gates.
    paired_group groups the pairs by sample before concatenation, replacing the source's inner join.
  rationale: A gated map-over keeps every sample in every step, empty where skipped. __FILTER_NULL__ is the cleanup. Grouping replaces the join.
    No corpus workflow shows this classifier (per-element-classifier-gating-no-corpus-precedent).
  evidence:
  - per-element-classifier-gating-no-corpus-precedent
  - paired-concat-join-drops-silently
- id: chr-path-identifiers-follow-the-path
  decided_by: nextflow-summary-to-galaxy-template
  decision: Under chr, output identifiers are sample_id.region, as the source's ext.prefix gives. pick_alignments, pick_index and pick_flags keep
    the identifiers of the path that ran.
  rationale: This matches the source's published names. The pick pairs alternatives by position (pick-value-positional-alternatives).
  evidence:
  - chr-prefix-sets-element-identifiers
  - pick-value-positional-alternatives
- id: fai-wired-to-the-eleven-source-consumers
  decided_by: nextflow-summary-to-galaxy-template
  decision: fai_effective (the user FAI, else fai_index's output) is wired to a TODO_reference_fai port on the eleven steps that take the reference
    index in the source. fai_index runs only when fasta is set and fasta_fai is absent. This implements fasta-fai-built-once-per-invocation (phase
    2).
  rationale: In the first draft fai_effective had no consumer, so the index was built and never used. The source passes the same [meta, fasta,
    fai] tuple to all eleven.
  evidence:
  - fai-consumers-in-source
  - reference-fai-consumer-ports-unverified
  - faidx-precursor-wrapper-not-yet-discovered
- id: samtools-sort-name-order-replaces-collate
  decided_by: advance-galaxy-draft-step
  supersedes: collate-kept-with-fastx-export
  decision: Name order for the FASTQ export comes from samtools_sort -n (devteam 2.0.8), not a collate step. samtools_fastx exports the sorted
    alignments.
  rationale: The cached samtools_sort summary offers name (-n) ordering, and the IWC corpus uses samtools_sort in 6 workflows. samtools_fastx
    needs name-grouped input to write pairs.
  evidence:
  - bam-collate-fastq-no-corpus-precedent
  - samtools-fastx-paired-split-unverified
- id: paired-export-single-selection
  decided_by: advance-galaxy-draft-step
  supersedes: per-sample-gates-with-filter-null
  decision: Paired reads are exported in one step per sample (samtools_fastx with outputs r1, r2 and s on the name-sorted alignments) and zipped
    into list:paired with __ZIP_COLLECTION__. This replaces the mapped and unmapped branches, their merge, the pair filters, paired_group and
    paired_cat. The per-sample when gates stay for the layout.
  rationale: 'The source''s four flag selections partition the paired alignments. A pair''s mates are both in the mapped-pair selection or both
    outside it, because the mapped flag is symmetric between mates, so the source''s grouping never splits a pair. The source''s exports exclude
    secondary and supplementary alignments by default (samtools fastq -F 0x900), and the cached fastx wrapper defaults to 256 and 2048. The exported
    read set is therefore the union of the selections. Read order changes: the source concatenates mapped then unmapped pairs.'
  evidence:
  - unmapped-merge-port-shape
  - paired-concat-join-drops-silently
- id: layout-detected-per-sample-by-flagstat
  decided_by: advance-galaxy-draft-step
  decision: A sample is paired when samtools_flagstat reports paired reads in sequencing (Grep1 on the line, Cut1 for the count, param_value_from_file
    as an integer per sample). Each branch gates on that integer with a per-element when.
  rationale: 'The source''s CHECKPAIREDEND reads the first 1000 records and requires every one to be paired. A flagstat count needs no custom
    tool. The rule changes: a mixed file is paired here and single in the source. The per-element when from a mapped param_value_from_file boolean
    is verified in Galaxy''s API tests (channel-shape note); this uses the integer form.'
  evidence:
  - per-element-classifier-gating-no-corpus-precedent
- id: multiqc-repeats-take-collections
  decided_by: advance-galaxy-draft-step
  decision: 'MultiQC gets one repeat instance per QC collection: fastqc (pre-conversion), fastqc (post-conversion, paired), fastqc (post-conversion,
    single), samtools stats, samtools idxstats and samtools flagstat. qc_merge is removed. This refines multiqc-includes-sample-qc.'
  rationale: The cached MultiQC summary shows each leaf input with multiple=True, so a collection can feed one instance without a merge. A merge
    of the QC collections would duplicate sample identifiers.
  evidence:
  - qc-merge-of-mixed-collections
- id: fastqc-post-output-per-read-type
  decided_by: advance-galaxy-draft-step
  supersedes: flat-per-file-qc-lists-with-mate-identifiers
  decision: FastQC runs on the flattened paired reads and, separately, on the single-end reads. The outputs fastqc_post_paired_html and fastqc_post_single_html
    replace fastqc_post_conversion_html. No identifier rewrite (Apply Rules) and no merge are built.
  rationale: A merge needs unique identifiers, which the flatten step does not guarantee (not verified). The Apply Rules state for the mate suffixes
    has no verified example. Two outputs avoid both.
  evidence:
  - fastqc-post-paired-html-flattening
  - paired-element-to-multi-input-tool
- id: index-dropped-wrappers-index-internally
  decided_by: advance-galaxy-draft-step
  supersedes: index-strategy-fallback-until-carrier
  decision: No index steps. Each pinned wrapper receives the alignments only. Any index a wrapper needs is its own concern, to be checked in phase
    12.
  rationale: No pinned wrapper takes an index port (blocking entry index-ports-absent-on-pinned-wrappers).
  evidence:
  - index-ports-absent-on-pinned-wrappers
  - record-slot-index-extraction-uncomputable
- id: reference-dropped-with-cram
  decided_by: advance-galaxy-draft-step
  supersedes: fai-wired-to-the-eleven-source-consumers
  decision: No reference inputs and no fai steps in v1. This also supersedes fasta-fai-built-once-per-invocation and fasta-optional-with-cram-note
    (phase 2), and reference-broadcast-and-pick (phase 4).
  rationale: The pinned wrappers take no separate index (blocking entry fai-ports-absent-on-pinned-wrappers), and CRAM needs the per-row file
    type, which the record input carried.
  evidence:
  - fai-ports-absent-on-pinned-wrappers
  - cram-input-not-supported-v1
- id: samplesheet-as-alignment-list
  decided_by: advance-galaxy-draft-step
  supersedes: samplesheet-as-sample-sheet-record
  decision: The input is a list of BAM alignments whose element identifiers are the sample ids. The sample sheet record, its file_type column
    and its index column are not carried.
  rationale: No IWC workflow or test uses a record or sample_sheet collection (blocking entry samplesheet-record-input-without-test-precedent).
  evidence:
  - samplesheet-record-input-without-test-precedent
- id: chr-not-built-v1
  decided_by: advance-galaxy-draft-step
  supersedes: chr-inline-gate-with-pick-rejoin
  decision: The chromosome path is not built in v1. This also supersedes chr-path-identifiers-follow-the-path (phase 6).
  rationale: The selected candidate does not set chr, and the path needs a relabel table and a flag relabel that are not built (dropped entry
    chr-extraction-not-built-v1).
  evidence:
  - chr-extraction-not-built-v1
- id: scalar-gates-after-repair
  decided_by: advance-galaxy-draft-step
  supersedes: scalar-analysis-gates-kept
  decision: Of the scalar gates, none is carried. The layout detection is the only per-sample decision. no_read_QC, no_stats, chr, samtools_collate_fast
    and reads_in_memory are dropped (dropped entries).
  rationale: Each scalar gate's consumer is either dropped or cannot take a null (see the dropped entries).
  evidence:
  - index-ports-absent-on-pinned-wrappers
  - chr-extraction-not-built-v1
  - cram-input-not-supported-v1
  - collate-options-not-carried
  - no-read-qc-and-no-stats-switches-not-carried
discoveries:
- id: d-summary-misses-key-expansion
  raised_by: nextflow-summary-to-galaxy-reference-data
  evidence: fasta and fasta_fai carry source_kind nextflow_schema in the phase 1 summary. main.nf lines 37-38 assign both from getGenomeAttribute.
  impact: The key-expanded classification comes from source reading, not from the summary (feedback entry getgenomeattribute-in-workflow-body-not-detected).
- id: d-igenomes-has-no-fasta-fai
  raised_by: nextflow-summary-to-galaxy-reference-data
  evidence: conf/igenomes.config has 39 fasta entries and no fasta_fai entry.
  impact: Genome-key runs always rebuild the index.
- id: d-suite-never-omits-fasta
  raised_by: nextflow-summary-to-galaxy-reference-data
  evidence: Every tests/*.nf.test file mentions fasta. The default test sets params.fasta to the test genome and uses it for CRAM verification.
  impact: No nf-test exercises a run without a FASTA, so the no-FASTA behaviour has no test evidence.
- id: d-per-sample-index-not-reference
  raised_by: nextflow-summary-to-galaxy-reference-data
  evidence: PREPARE_INDICES builds missing per-sample BAM and CRAM indexes with SAMTOOLS_INDEX, gated by the samplesheet index column.
  impact: This is per-sample compute-if-missing, not reference data. The interface step must handle the optional index column.
- id: d-boolean-defaults-from-schema-only
  raised_by: nextflow-summary-to-galaxy-reference-data
  evidence: Ten boolean params show default null in the summary, but nextflow.config sets false (feedback entry boolean-param-defaults-from-schema-only).
  impact: Galaxy defaults for these come from nextflow.config.
- id: default-publishdir-applies-to-fastqc-and-fastqutils
  raised_by: nextflow-summary-to-galaxy-interface
  evidence: conf/modules.config lines 13-18 set a global publishDir for all processes, with the path taken from the process name. The phase 1
    summary shows publish_dir null for FASTQC and FASTQUTILS_INFO, yet the default snapshot lists fastqc/ and fastqutils/ outputs (lines 56-71).
  impact: FastQC and fastq_info outputs are user-visible. The summary's publish evidence is incomplete (feedback entry default-publishdir-not-captured).
- id: multiqc-omits-fastqc-and-samtools-qc
  raised_by: nextflow-summary-to-galaxy-interface
  evidence: ch_multiqc_files mixes only the collated versions, the workflow summary and the methods description (phase 1 warnings).
  impact: The QC tables and FastQC reports must be exposed as separate outputs.
- id: chr-alignments-published-by-default-dir
  raised_by: nextflow-summary-to-galaxy-interface
  evidence: conf/modules.config has a selector for SAMTOOLS_CHR (line 161) but no publishDir in it, so the global default applies. Not run.
  impact: Chromosome-restricted alignments are probably published to samtools/. Verify with a chr run.
- id: collate-fast-coupled-to-reads-in-memory
  raised_by: nextflow-summary-to-galaxy-interface
  evidence: 'conf/modules.config lines 40-59: the collate processes use reads_in_memory in ext.args only when samtools_collate_fast is true.'
  impact: reads_in_memory has no effect unless the fast-collate flag is set.
- id: chr-prefix-sets-element-identifiers
  raised_by: nextflow-summary-to-galaxy-data-flow
  evidence: 'conf/modules.config, SAMTOOLS_CHR ext.prefix: <meta.id>.<region>. tests/chr.nf.test.snap shows test3.chrX_chrY_X_Y.'
  impact: The chromosome path renames every element. The per-element single_end flag must be re-keyed (P6).
- id: single-end-classification-by-sampling
  raised_by: nextflow-summary-to-galaxy-data-flow
  evidence: 'modules/local/checkpairedend/main.nf lines 26-35: the first 1000 records are sampled, and a sample is paired only if every sampled
    record has flag 1.'
  impact: A mixed file is classified single-end. The classification depends on the first records, not the whole file.
- id: subworkflow-when-cannot-gate-per-element
  raised_by: nextflow-summary-to-galaxy-data-flow
  evidence: 'nextflow-conditional-to-galaxy-subworkflow-when: a subworkflow when is evaluated once per invocation, not once per element.'
  impact: Per-element branches (single or paired, index present or absent) must use per-element gates on steps.
- id: no-qc-test-misspelled-parameter
  raised_by: nextflow-summary-to-galaxy-data-flow
  evidence: tests/no_qc.nf.test sets no_read_qc = true (line 23). The pipeline declares no_read_QC (nextflow.config). The no_qc snapshot has 12
    fastqc/ entries, the same as default.
  impact: The QC-off branch is never exercised. The test plan must cover it itself (feedback entry no-qc-test-sets-misspelled-parameter).
- id: iwc-exemplar-sra-manifest-structure
  raised_by: compare-against-iwc-exemplar
  evidence: 'data-fetching/sra-manifest-to-concatenated-fastqs at IWC c07557f: split_file_to_collection, fasterq_dump (list_paired and output_collection),
    __RELABEL_FROM_FILE__ with a tabular label table, __APPLY_RULES__ (list_identifiers and paired_identifier), cat_multi_datasets (paired_collection
    with by_strand; singles), outputs paired_output and single_output.'
  impact: Corpus precedent for two outputs, table-driven relabel, identifier grouping and by-strand concatenation. See nextflow-galaxy-data-flow.md
    N24 and N25 and iwc-comparison-notes.md sections 3 and 5.
- id: iwc-no-bam-to-fastq-workflow
  raised_by: compare-against-iwc-exemplar
  evidence: Phase 5 searched 133 .ga and .gxwf.yml files at IWC c07557f for samtools_collate, samtools_fastq, bam2fastq and bamtofastq tool ids
    and found none. Phase 6 found that iuc samtools_fastx 1.22+galaxy2 exports alignments to FASTQ in two of those workflows (microbiome/host-contamination-removal/host-contamination-removal-long-reads;
    microbiome/pathogen-identification/nanopore-pre-processing).
  impact: 'Corrected in phase 6. The phase 5 id and impact implied that no IWC workflow converts BAM to FASTQ, which was wrong. The FASTQ export
    has a partial precedent (samtools_fastx: single_fastx, map_fastx, unmap_fastx). Name collation has none (gap bam-collate-fastq-no-corpus-precedent).
    The id is kept for provenance.'
- id: iwc-atacseq-flag-selection-low-precedent
  raised_by: compare-against-iwc-exemplar
  evidence: epigenetics/atacseq/atacseq.ga uses samtools_view with flag filtering, samtools_idxstats and MultiQC. Its input is a list:paired FASTQ
    collection, not alignments.
  impact: Low-confidence precedent for the flag-selection nodes N17-N20 and the idxstats node N6. It is not a domain exemplar.
- id: iwc-exemplar-tests-size-only
  raised_by: compare-against-iwc-exemplar
  evidence: 'data-fetching/sra-manifest-to-concatenated-fastqs-tests.yml: element tests use has_size with a delta only.'
  impact: These are smoke checks in the shortcuts note's sense. The reads checkpoint in the interface needs content checks, not size bands.
- id: samtools-fastx-precedent
  raised_by: nextflow-summary-to-galaxy-template
  evidence: 'iuc samtools_fastx 1.22+galaxy2 is used in two IWC workflows: microbiome/host-contamination-removal/host-contamination-removal-long-reads
    and microbiome/pathogen-identification/nanopore-pre-processing. Both write fastqsanger (or fastqsanger.gz) with exclusive_filter 256 and 2048,
    and both set outputs to other only (single-end reads).'
  impact: Corrects the phase 5 claim that no IWC workflow converts BAM to FASTQ. Pins the single, map and unmap FASTQ exports. The paired split
    is open (gap samtools-fastx-paired-split-unverified).
- id: samtools-pins-from-corpus
  raised_by: nextflow-summary-to-galaxy-template
  evidence: 'Counts in the IWC copy at c07557f (.ga and .gxwf.yml, checked in phase 6), as workflows and occurrences: samtools_view 1.22+galaxy2
    15 and 38; samtools_stats 2.0.9 7 and 22; samtools_idxstats 2.0.8 3 and 6; samtools_merge 1.22+galaxy2 4 and 16; samtools_sort 2.0.8 6 and
    16; samtools_fastx 1.22+galaxy2 2 and 6; fastqc 0.74+galaxy1 5 and 40; multiqc 1.35+galaxy5 11 and 30; cat_multi_datasets 1.4.3 2 and 18.
    Built-ins: __APPLY_RULES__ 15 workflows, __RELABEL_FROM_FILE__ 14, __FLATTEN__ 11, __MERGE_COLLECTION__ 6, param_value_from_file 43 (254 occurrences),
    __FILTER_NULL__ 0. No IWC use of samtools_index, samtools_faidx, samtools_flagstat, samtools_collatefastq, fastq_utils or checkpairedend.'
  impact: Identity-pinned steps carry the pinned tool_id with tool_version TODO. These counts are workflows and occurrences, not step counts.
- id: draft-validator-resolves-by-label
  raised_by: nextflow-summary-to-galaxy-template
  evidence: gxwf draft-validate resolves step references by label for list-form steps. When a label differs from its id, every reference to that
    step fails as unknown (86 topology errors in the first run).
  impact: The draft sets label equal to id and moves the description to doc. Feedback entry draft-format-step-reference-key-unspecified.
- id: draft-structure-error-no-path
  raised_by: nextflow-summary-to-galaxy-template
  evidence: 'A YAML null inside a type list (type: [null, File]) produced one structure error at the workflow root with no path, and the full
    union text was printed. Quoting the null as "null" cleared it.'
  impact: 'Feedback entry gxwf-draft-validate-structure-error-no-path. Record-slot optionality is written as type: ["null", File].'
- id: fai-consumers-in-source
  raised_by: nextflow-summary-to-galaxy-template
  evidence: alignment_to_fastq/main.nf passes fasta_fai to SAMTOOLS_VIEW (lines 23-32, four views), SAMTOOLS_MERGE_UNMAP (line 54), and COLLATE_FASTQ_UNMAP
    and COLLATE_FASTQ_MAP (lines 59-70). workflows/bamtofastq.nf passes ch_fasta_fai to SAMTOOLS_CHR (line 121), SAMTOOLS_COLLATEFASTQ_SINGLE_END
    (line 157) and CHECKPAIREDEND (line 85). pre_conversion_qc/main.nf passes it to SAMTOOLS_STATS (line 23). The tuple is [meta, fasta, fai],
    or an empty value when no fasta is set (bamtofastq.nf lines 61-67).
  impact: Eleven consumers. The first draft left fai_effective without a consumer; fixed in phase 6 (decision fai-wired-to-the-eleven-source-consumers).
- id: wrapper-port-survey-phase7
  raised_by: advance-galaxy-draft-step
  evidence: 'Cached summaries under the job temporary directory (summaries/*.summary.json), read with the walker in the job temporary directory.
    Pinned wrappers: idxstats 2.0.8, stats 2.0.9, view 1.22+galaxy2, merge 1.22+galaxy2, fastx 1.22+galaxy2, fastqc 0.74+galaxy1, cat_multi_datasets
    1.4.3 (paired output named paired_out_file, not paired_output), multiqc 1.35+galaxy5, samtools_sort 2.0.8, param_value_from_file 0.1.0 (integer,
    boolean and text outputs are parameter outputs). Stock tools cached: Grep1 1.0.4, Cut1 1.0.2, __FILTER_NULL__ 1.1.0, __ZIP_COLLECTION__ 1.0.0,
    __FLATTEN__ 1.0.0.'
  impact: The draft's wires were drawn from nf-core module signatures. Eleven index and reference wires and several output names had no port on
    the pinned wrappers.
- id: default-candidate-paired-only
  raised_by: advance-galaxy-draft-step
  evidence: tests/default.nf.test.snap lists reads/test_1.merged.fastq.gz, reads/test_2.merged.fastq.gz, reads/test2_1.merged.fastq.gz and reads/test2_2.merged.fastq.gz,
    and no single-end reads. conf/test.config uses test_bam_samplesheet.csv.
  impact: The selected candidate exercises the paired branch only. The single branch needs another candidate (phase 8 test data) or a fixture
    of its own.
- id: iwc-no-sample-sheet-or-record-collections
  raised_by: advance-galaxy-draft-step
  evidence: 'Corpus grep at c07557f: no .ga or .gxwf.yml file contains sample_sheet. -tests.yml collection_type values: list 103, paired 55, list:paired
    45, list:list 4.'
  impact: A record input has no precedent for upload or testing (blocking entry samplesheet-record-input-without-test-precedent).
- id: chr-text-region-mode-exists
  raised_by: advance-galaxy-draft-step
  evidence: 'samtools_view 1.22+galaxy2 cond_region options: no, text (Manually specify regions), bed (Regions from BED file).'
  impact: The chr path is not wrapper-impossible. It is dropped for cost and test scope (dropped entry chr-extraction-not-built-v1).
- id: samtools-fastx-default-exclusive-filter
  raised_by: advance-galaxy-draft-step
  evidence: 'Cached samtools_fastx 1.22+galaxy2 defaults: exclusive_filter selected 256 and 2048; read_numbering default empty; the source''s
    collate steps pass -N (conf/modules.config ext.args2).'
  impact: The export excludes secondary and supplementary alignments by default, which matches the source's default (decision paired-export-single-selection).
- id: element-identifier-tool-exists
  raised_by: advance-galaxy-draft-step
  evidence: toolshed.g2.bx.psu.edu/repos/iuc/collection_element_identifiers/collection_element_identifiers/0.0.3 appears in 56 IWC workflow steps
    (0.0.2 in 4).
  impact: An identifier file for a relabel table is available if chr is restored later.
- id: repair-1-realized-reading
  raised_by: repair-galaxy-draft-topology
  evidence: The procedure says not to remove a realized step, and does not define realized. Repair 1 read realized as implemented by implement-galaxy-tool-step.
    No removed step had a concrete tool_version. The removed concrete steps were the built-in pick_value steps fai_effective, index_select and
    pick_index, removed as feeding-only steps.
  impact: Anyone reading the removal list should know the reading used. If realized means concrete, these three steps would have to stay.
- id: repair-1-decisions-not-applied
  raised_by: repair-galaxy-draft-topology
  evidence: 'Not applied in repair 1: layout-detected-per-sample-by-flagstat (classify_paired stays deferred); fastqc-post-output-per-read-type
    (fastqc_post stays on read_files_merge, and paired_identifiers stays); chr-not-built-v1 (chr kept, rewired). scalar-gates-after-repair is
    partly applied: no_read_QC, no_stats and the collate options are removed, and chr is kept.'
  impact: These decisions stay recorded as decisions. The draft does not yet reflect them, and the per-step loop or a later repair must decide
    whether to apply them.
- id: repair-2-chr-path-removed
  raised_by: repair-galaxy-draft-topology
  evidence: 'Repair 2 (escalation 2 of cap 5) removed the chr path under blocking entry chr-label-table-uncomputable. Steps removed: chr_label_table,
    chr_view, chr_relabel, chr_flag_relabel, chr_index, pick_alignments, pick_flags. Input removed: chr. Outputs removed: chr_alignments, chr_alignments_index.
    single_collate and paired_name_sort now read alignments; their gates, and those of single_fastx and paired_fastx, read paired_flag_convert''s
    flag.'
  impact: Decision chr-not-built-v1 is now applied. Decision scalar-gates-after-repair is now fully applied.
- id: repair-3-applied
  raised_by: repair-galaxy-draft-topology
  evidence: 'Repair 3 (escalation 3 of cap 5). Removed classify_paired and paired_flag_convert. Added grep_paired_line (Grep1 1.0.4), cut_paired_count
    (Cut1 1.0.2) and paired_count (param_value_from_file 0.1.0, integer). Gates: single_collate and single_fastx on paired_count === 0; paired_name_sort
    and paired_fastx on paired_count > 0. Restored fastq_info (bgruening 0.25.3+galaxy0) with the output fastqutils_info.'
  impact: Decision layout-detected-per-sample-by-flagstat is applied. A mixed file is paired here and single in the source. The fastq_info drop
    is withdrawn, and the earlier 'no wrapper' claim is struck.
- id: paired-mate-identifier-divergence
  raised_by: repair-galaxy-draft-topology
  evidence: The source's post-conversion FastQC files are named test.post_conversion_1_fastqc.html and _2 (tests/default.nf.test.snap). The draft's
    flattened mates are <sample>_forward and <sample>_reverse (__FLATTEN__ help).
  impact: Output file names for the paired post-conversion FastQC differ from the source. Element identifiers are unique, and the mate meaning
    is kept. Logged as a naming divergence.
- id: integer-when-fallback
  raised_by: advance-galaxy-draft-step
  evidence: Tool Shed search 'compare parameter value' (2026-11-12) returned iuc/compare_param_value (to get a boolean). The packaged channel-shape
    note verifies a mapped boolean when, not an integer one.
  impact: If the integer when (paired_count === 0 and > 0) fails in phase 12, the fallback is compare_param_value to a boolean, then the verified
    boolean route.

            intent: "Assert exact MD5 checksum for test_1.merged.fastq.gz"
            expected_value: "md5:9b0c08862a5e47e842a485ddad31b871"
            tolerance: null
            element_identifier: test
            evidence: test-evidence
            confidence: high
          - family: checksum
            intent: "Assert exact MD5 checksum for test2_1.merged.fastq.gz"
            expected_value: "md5:a4984fb5a60f80ccbfbfcf1cef9daaf3"
            tolerance: null
            element_identifier: test2
            evidence: test-evidence
            confidence: high

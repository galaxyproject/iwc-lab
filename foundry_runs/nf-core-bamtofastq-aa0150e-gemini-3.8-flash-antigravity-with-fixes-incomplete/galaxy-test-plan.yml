      - workflow_label: input_bams
        label_status: resolved
        description: "Input BAM alignment list collection containing samples test and test2."
        collection_shape: list
        datatype: bam
        fixture:
          storage: null
          location: null
          checksum: null
          provenance: "Extracted from test_bam_samplesheet.csv"
      - workflow_label: reference_fasta
        label_status: resolved
        description: "Reference genome FASTA used for decoding CRAM alignments."
        collection_shape: null
        datatype: fasta
        fixture:
          storage: remote-url
          location: "https://raw.githubusercontent.com/nf-core/test-datasets/modules/data/genomics/homo_sapiens/genome/genome.fasta"
          checksum: "SHA-1:56e7a0c035e2fce8ebe497d3704431d7586fd444"
          provenance: "Declared in test profile params.fasta"
    expected_outputs:
      - workflow_label: extracted_fastqs_r1
        label_status: resolved
        description: "Extracted R1 FASTQ reads per sample matching upstream snapshot MD5 checksums."
        output_kind: collection
        collection_shape: list

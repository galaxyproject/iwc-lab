# Expected values.
#
# snp-soil-15-isolates-refchooser compares against the expected outputs CSP2's authors publish with
# their test data, microbial-bioinformatics/CSP2_TestData at 61b1f790417ed2a2a08390d432b03effabbd66e2,
# assets/SNP/Output/Soil_Analysis. Files under test-data/snpdiffs/ and test-data/15-isolates/ are byte
# copies of that tree; Sample_M's snpdiffs is gzipped (decompress: true) to stay under 100 KB.
#
# snp-soil-3-isolates-named-reference has no published oracle. Its files under test-data/3-isolates/
# come from upstream's own Nextflow pipeline (CSP2.nf --runmode snp --ref_id Sample_A --notree) run in
# cfsanbiostatistics/csp2:v.0.9.7.8-galaxy on the same three assemblies, and match this workflow's
# outputs. Its snpdiffs, screening rows, distances and alignment bases also equal the 15-isolate
# upstream values for the same isolates (SNPs_Cocalled differs, since the site set is smaller).
#
# What is not compared byte for byte, and why:
# - snpdiffs headers and the Raw MUMmer summary / Isolate data rows carry assembly paths, which are
#   fasta/<ID>.fasta here but absolute upstream paths in the published files, and the summary's
#   SNPDiffs_File is a job-local path; the rest of each line is matched exactly ([^\t]+ stands
#   for a path, lines_diff: 2 allows the header line in the snpdiffs diff).
# - Reference screening rows follow the order of a Python set of snpdiffs paths, and the preserved
#   SNP list follows a set of Ref_Loc strings (runSNPPipeline.py), so both are sorted before an exact
#   comparison. The preserved SNP alignment's columns follow that same set order, so its size,
#   records and per-record base counts are asserted instead of its bytes.
# - The tree comes from the Tool Shed IQ-TREE, newer than upstream's and stochastic, so only its
#   shape is asserted: one Newick line with each isolate as a leaf exactly once.
# - Each k-mer count (Shared_Kmers, Reference_Unique_Kmers, Query_Unique_Kmers) accepts the published
#   value or one more. CSP2 v.0.9.7.8 counts an empty first kmercountexact.sh attempt as an extra
#   k-mer when the host is short of memory, and nothing else in the output changes when that happens.
#   The snpdiffs header regexes and Raw MUMmer summary rows allow it directly; the Reference screening
#   diff gets lines_diff of two per row, and anchored per-row regexes pin every other column exactly.
# Not covered by any case: more than one reference (Number of references to select > 1, or several
# Reference isolate IDs). Upstream publishes no expected output for that path.
- doc: 'snp-soil-3-isolates-named-reference: CSP2 snp mode on three of the Soil_Analysis assemblies (Sample_A, Sample_B, Sample_D) with Sample_A named as the reference and the tree step switched off. Exercises the user-supplied reference path (RefChooser skipped) and the Build phylogenetic tree = false branch in two alignments instead of fourteen. Expected outputs come from upstream''s own Nextflow pipeline on the same three assemblies.'
  job:
    Query assemblies:
      class: Collection
      collection_type: list
      elements:
      - class: File
        identifier: Sample_A
        location: https://raw.githubusercontent.com/microbial-bioinformatics/CSP2_TestData/61b1f790417ed2a2a08390d432b03effabbd66e2/assets/SNP/Sample_A.fasta
        filetype: fasta
        hashes:
        - hash_function: SHA-1
          hash_value: 9ede9ea9addfd9233453fe05200d63b2e63f6c25
      - class: File
        identifier: Sample_B
        location: https://raw.githubusercontent.com/microbial-bioinformatics/CSP2_TestData/61b1f790417ed2a2a08390d432b03effabbd66e2/assets/SNP/Sample_B.fasta
        filetype: fasta
        hashes:
        - hash_function: SHA-1
          hash_value: d5fdde41045a6393adb978d8f1d0f689d1a08471
      - class: File
        identifier: Sample_D
        location: https://raw.githubusercontent.com/microbial-bioinformatics/CSP2_TestData/61b1f790417ed2a2a08390d432b03effabbd66e2/assets/SNP/Sample_D.fasta
        filetype: fasta
        hashes:
        - hash_function: SHA-1
          hash_value: 2239f6fdcc72a133c45d914c8b91d8e10ba4a393
    Reference isolate IDs: Sample_A
    Build phylogenetic tree: false
  outputs:
    Reference IDs:
      asserts:
      - has_line:
          line: Sample_A
      - has_n_lines:
          n: 1
    SNPDiffs:
      class: Collection
      element_count: 2

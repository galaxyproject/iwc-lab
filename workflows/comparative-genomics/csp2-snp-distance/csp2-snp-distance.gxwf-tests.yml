        Sample_D:Sample_A:
          file: test-data/snpdiffs/Sample_D__vs__Sample_A.snpdiffs
          compare: diff
          lines_diff: 2
          asserts:
          - has_line_matching:
              expression: \#\tQuery_ID:Sample_D\tQuery_Assembly:[^\t]+\tQuery_Contig_Count:55\tQuery_Assembly_Bases:4627990\tQuery_N50:238061\tQuery_N90:54649\tQuery_L50:7\tQuery_L90:23\tQuery_SHA256:0a8824d9ecda9632b817d421c082e8bf87b613a8032e6e41ce02fb8a8167d8c0\tReference_ID:Sample_A\tReference_Assembly:[^\t]+\tReference_Contig_Count:50\tReference_Assembly_Bases:4626313\tReference_N50:285283\tReference_N90:80168\tReference_L50:7\tReference_L90:20\tReference_SHA256:dae2379030db9c465040198216d2976ef11fcea1a5739c2dc47950253842bd4b\tSNPs:10\tReference_Percent_Aligned:99\.99\tQuery_Percent_Aligned:99\.97\tMedian_Percent_Identity:100\.00\tMedian_Alignment_Length:40058\.00\tKmer_Similarity:99\.92\tShared_Kmers:461609[12]\tReference_Unique_Kmers:(?:1439|1440)\tQuery_Unique_Kmers:247[45]\tReference_Breakpoints:51\tQuery_Breakpoints:52\tReference_Relocations:0\tQuery_Relocations:0\tReference_Translocations:13\tQuery_Translocations:5\tReference_Inversions:0\tQuery_Inversions:0\tReference_Insertions:21\tQuery_Insertions:30\tReference_Tandem:0\tQuery_Tandem:0\tIndels:11\tInvalid:0\tgSNPs:10\tgIndels:3
    Raw MUMmer summary:

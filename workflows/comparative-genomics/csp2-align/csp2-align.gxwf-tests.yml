# Expected values.
#
# Expected files come from upstream's own Nextflow pipeline (CSP2.nf --runmode align, v.0.9.7.8) run
# in cfsanbiostatistics/csp2:v.0.9.7.8-galaxy on the same three assemblies, not from this workflow.
# Files under test-data/ are byte copies of that run's snpdiffs/ directory. The two Sample_X:Sample_A
# pairs also equal the files CSP2's authors publish in microbial-bioinformatics/CSP2_TestData at
# 61b1f790417ed2a2a08390d432b03effabbd66e2, assets/SNP/Output/Soil_Analysis/snpdiffs, apart from
# assembly paths.
#
# What is not compared exactly, and why:
# - snpdiffs headers and the Raw MUMmer summary / Isolate data rows carry assembly paths, which are
#   fasta/<ID>.fasta here but absolute paths upstream, and the summary's SNPDiffs_File is a
#   job-local path; [^\t]+ stands for a path and lines_diff: 2 allows the header line in the
#   snpdiffs diff, which the header regex then pins.
# - Each k-mer count (Shared_Kmers, Reference_Unique_Kmers, Query_Unique_Kmers) accepts upstream's
#   value or one more: CSP2 v.0.9.7.8 counts an empty first kmercountexact.sh attempt as an extra
#   k-mer when the host is short of memory, and nothing else in the output changes when it does.
#   A k-mer count or Kmer_Similarity that is far off instead points at host memory too: under a
#   small Java heap kmercountexact.sh can print a partial set and exit 0, which CSP2 accepts. That
#   is not a workflow regression; rerun on a host with more free memory.
- doc: 'align-soil-3-isolates-named-reference: CSP2 align mode on three of the Soil_Analysis assemblies (Sample_A, Sample_B, Sample_D) with Sample_A named as the reference, so Sample_B and Sample_D are each aligned against Sample_A. Expected outputs come from upstream''s own Nextflow pipeline on the same three assemblies (--fasta with --ref_id Sample_A).'
  job:
    Query assemblies:
      class: Collection
      collection_type: list
      elements:
      - class: File
        identifier: Sample_A
        location: https://raw.githubusercontent.com/microbial-bioinformatics/CSP2_TestData/61b1f790417ed2a2a08390d432b03effabbd66e2/assets/SNP/Sample_A.fasta
        filetype: fasta
        hashes:
        - hash_function: SHA-1
          hash_value: 9ede9ea9addfd9233453fe05200d63b2e63f6c25
      - class: File
        identifier: Sample_B
        location: https://raw.githubusercontent.com/microbial-bioinformatics/CSP2_TestData/61b1f790417ed2a2a08390d432b03effabbd66e2/assets/SNP/Sample_B.fasta
        filetype: fasta
        hashes:
        - hash_function: SHA-1
          hash_value: d5fdde41045a6393adb978d8f1d0f689d1a08471
      - class: File
        identifier: Sample_D
        location: https://raw.githubusercontent.com/microbial-bioinformatics/CSP2_TestData/61b1f790417ed2a2a08390d432b03effabbd66e2/assets/SNP/Sample_D.fasta
        filetype: fasta
        hashes:
        - hash_function: SHA-1
          hash_value: 2239f6fdcc72a133c45d914c8b91d8e10ba4a393
    Reference isolate IDs: Sample_A
  outputs:
    Reference IDs:
      asserts:
      - has_line:
          line: Sample_A
      - has_n_lines:
          n: 1
    SNPDiffs:
      class: Collection
      element_count: 2
      element_tests:
        Sample_B:Sample_A:
          file: test-data/Sample_B__vs__Sample_A.snpdiffs
          compare: diff
          lines_diff: 2
          asserts:
          - has_line_matching:
              expression: '\#\tQuery_ID:Sample_B\tQuery_Assembly:[^\t]+\tQuery_Contig_Count:40\tQuery_Assembly_Bases:4631086\tQuery_N50:285283\tQuery_N90:87355\tQuery_L50:6\tQuery_L90:17\tQuery_SHA256:2486ab6c17c1c7997a5707111aa8e2cac41c578382aff413fa66086a31fbde38\tReference_ID:Sample_A\tReference_Assembly:[^\t]+\tReference_Contig_Count:50\tReference_Assembly_Bases:4626313\tReference_N50:285283\tReference_N90:80168\tReference_L50:7\tReference_L90:20\tReference_SHA256:dae2379030db9c465040198216d2976ef11fcea1a5739c2dc47950253842bd4b\tSNPs:37\tReference_Percent_Aligned:99\.99\tQuery_Percent_Aligned:99\.94\tMedian_Percent_Identity:100\.00\tMedian_Alignment_Length:50330\.00\tKmer_Similarity:99\.87\tShared_Kmers:(?:4616020|4616021)\tReference_Unique_Kmers:(?:1510|1511)\tQuery_Unique_Kmers:(?:4565|4566)\tReference_Breakpoints:42\tQuery_Breakpoints:85\tReference_Relocations:0\tQuery_Relocations:0\tReference_Translocations:3\tQuery_Translocations:12\tReference_Inversions:0\tQuery_Inversions:0\tReference_Insertions:10\tQuery_Insertions:51\tReference_Tandem:0\tQuery_Tandem:1\tIndels:2\tInvalid:0\tgSNPs:35\tgIndels:2'
        Sample_D:Sample_A:
          file: test-data/Sample_D__vs__Sample_A.snpdiffs
          compare: diff
          lines_diff: 2
          asserts:
          - has_line_matching:
              expression: '\#\tQuery_ID:Sample_D\tQuery_Assembly:[^\t]+\tQuery_Contig_Count:55\tQuery_Assembly_Bases:4627990\tQuery_N50:238061\tQuery_N90:54649\tQuery_L50:7\tQuery_L90:23\tQuery_SHA256:0a8824d9ecda9632b817d421c082e8bf87b613a8032e6e41ce02fb8a8167d8c0\tReference_ID:Sample_A\tReference_Assembly:[^\t]+\tReference_Contig_Count:50\tReference_Assembly_Bases:4626313\tReference_N50:285283\tReference_N90:80168\tReference_L50:7\tReference_L90:20\tReference_SHA256:dae2379030db9c465040198216d2976ef11fcea1a5739c2dc47950253842bd4b\tSNPs:10\tReference_Percent_Aligned:99\.99\tQuery_Percent_Aligned:99\.97\tMedian_Percent_Identity:100\.00\tMedian_Alignment_Length:40058\.00\tKmer_Similarity:99\.92\tShared_Kmers:(?:4616091|4616092)\tReference_Unique_Kmers:(?:1439|1440)\tQuery_Unique_Kmers:(?:2474|2475)\tReference_Breakpoints:51\tQuery_Breakpoints:52\tReference_Relocations:0\tQuery_Relocations:0\tReference_Translocations:13\tQuery_Translocations:5\tReference_Inversions:0\tQuery_Inversions:0\tReference_Insertions:21\tQuery_Insertions:30\tReference_Tandem:0\tQuery_Tandem:0\tIndels:11\tInvalid:0\tgSNPs:10\tgIndels:3'
    Raw MUMmer summary:

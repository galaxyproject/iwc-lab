class: GalaxyWorkflow
label: One-to-Many Whole-Genome Alignment Panel with KegAlign and UCSC Chain/Net (Growler Panel)
doc: This workflow aligns one soft-masked target genome against a list collection of soft-masked query
  genomes in parallel using GPU-accelerated KegAlign seeding, mapped LASTZ gapped extension (LAV), and
  UCSC kent doBlastzChainNet.pl / doRecipBest.pl chaining and netting, emitting per-query collections
  of chains, nets, syntenic-net MAFs, and reciprocal-best MAFs.
inputs:
  Target genome FASTA:
    type: data
    doc: Target genome, soft-masked FASTA.
    position:
      left: 0
      top: 304
  Query genome FASTAs:
    type: collection
    collection_type: list
    doc: Query genomes, soft-masked FASTA; element identifier = genome label.
    position:
      left: 0
      top: 380
  Target chromosome sizes:
    type: data
    doc: Target chromosome sizes (name<TAB>length).
    position:
      left: 0
      top: 1816
  Query chromosome sizes:
    type: collection
    collection_type: list
    doc: Query chromosome sizes, a list in the SAME ORDER as queries.
    position:
      left: 0
      top: 1892
  LASTZ scoring matrix:
    type: data
    doc: 'lastz scoring matrix, uploaded as tabular: KegAlign and lastz read it as text, axtChain as tabular.'
    position:
      left: 0
      top: 580
  axtChain linear gap table:
    type: data
    doc: 'axtChain gap-cost table: gap/loose.lineargap (chicken-human) or gap/medium.lineargap (mouse-human
      and closer).'
    position:
      left: 0
      top: 656
  HSP threshold (K):
    type: integer
    default: 3000
    doc: blastz K. lastz default 3000.
    position:
      left: 0
      top: 932
  Gapped threshold (L):
    type: integer
    default: 3000
    doc: blastz L; lastz default L=K. Fed to BOTH stages.
    position:
      left: 0
      top: 1008
  X-drop threshold (X):
    type: integer
    default: 910
    doc: blastz X. lastz's default is 10 x the matrix's A/A score.
    position:
      left: 0
      top: 1084
  Y-drop threshold (Y):
    type: integer
    default: 9430
    doc: blastz Y. lastz's default is O + 300E for the matrix used. Fed to BOTH stages.
    position:
      left: 0
      top: 1160
  Inner interpolation threshold (H):
    type: integer
    default: 0
    doc: 'blastz H; 0 is off. UCSC hg38 x panTro6: 2000.'
    position:
      left: 0
      top: 1236
  Dynamic masking threshold (M):
    type: integer
    default: 0
    doc: blastz M; 0 is off. Acts in the gapped stage only (KegAlign seeds).
    position:
      left: 0
      top: 1312
  Disallow transitions (T=2):
    type: boolean
    default: false
    doc: blastz T=2 is 12of19 with --notransition.
    position:
      left: 0
      top: 1388
  Disable entropy filtering:
    type: boolean
    default: false
    doc: blastz P=1 (entropy on) is the default.
    position:
      left: 0
      top: 1464
  Minimum chain score:
    type: integer
    default: 1000
    doc: axtChain -minScore. doBlastzChainNet.pl's default is axtChain's own, 1000.
    position:
      left: 0
      top: 732
  KegAlign segment lines per batch:
    type: integer
    default: 1000000
    doc: KegAlign segment lines per element; 0 is one element per chromosome pair.
    position:
      left: 0
      top: 1540
  Number of GPUs for KegAlign:
    type: integer
    default: 1
    doc: KegAlign GPUs. The tool default, -1, means every GPU on the node.
    position:
      left: 0
      top: 1616
outputs:
  All chains:
    outputSource: chainmergesort/out
    doc: hg38.panTro6.all.chain analogue (a list keyed by query)
  net:
    outputSource: netsyntenic/out
    doc: noClass.net (a list keyed by query)
  LiftOver chains:
    outputSource: over_chain/output
    doc: the liftOver chain (a list keyed by query)
  Filtered syntenic nets:
    outputSource: syn_net/out
    doc: (a list keyed by query)
  Syntenic net MAFs:
    outputSource: synnet_maf/out
    doc: multiz input for close genomes (a list keyed by query)
  Reciprocal-best chains:
    outputSource: rb_chain/out
    doc: (a list keyed by query)
  Reciprocal-best nets:
    outputSource: rb_net/out
    doc: (a list keyed by query)
  Reciprocal-best MAFs:
    outputSource: rbest_maf/out
    doc: multiz input for other genomes (a list keyed by query)
  lav:
    outputSource: lastz_lav/output
    doc: 'per-element LAV, the raw alignment record. NOT retained by the cs10 panel: ~45 of each pair''s
      78 GiB, purged as an intermediate once the pair is done, before the eight chain/net/MAF outputs
      are moved off the compute host. Deliberate, and it is the only copy -- a consumer that needs LAV
      must take it while the pair is still live. (a list keyed by query)'
steps:
  kegalign:
    tool_id: toolshed.g2.bx.psu.edu/repos/richard-burhans/kegalign/kegalign/0.3.4+galaxy5
    label: kegalign
    doc: 'Seed, filter and gap-free extension on the GPU. `bundle_selector: collection` makes it emit
      pair files instead of data_package.tgz; the tarball path is untouched and still available.

      ⚠ The format set here is INERT on the collection path -- kegalign.xml says so in its own words:
      `--format` still selects what KegAlign writes into its command lines, and nothing on this path reads
      them. The format that reaches lastz is `output_format`, below. Do not "fix" the two to agree; they
      are not the same setting.



      ⛔ `seed` IS STATE, NOT AN INPUT, AND THAT IS GALAXY''S CONSTRAINT RATHER THAN A CHOICE. It is a
      CONDITIONAL SELECTOR: the selected case determines the step''s structure, so it has to be known
      when the workflow is defined. Wired to a `text` input, the workflow imports cleanly with zero step
      errors and then refuses every invocation with `The selected case is unavailable/invalid` -- measured
      on laila 2026-09-24. Every other seeding parameter is a plain scalar and connects normally.

      ⚠ So changing the seed means editing this document. `12of19` is both the tool default and this project''s
      settled value; `14of22` was tested and rejected, and it is also what overran the GPU seed buffer.

      '
    in:
      target: Target genome FASTA
      query: Query genome FASTAs
      scoring_options|scoring: LASTZ scoring matrix
      seeding_options|notransition: Disallow transitions (T=2)
      ungapped_extension_options|hspthresh: HSP threshold (K)
      ungapped_extension_options|xdrop: X-drop threshold (X)
      ungapped_extension_options|noentropy: Disable entropy filtering
      gapped_extension_options|gappedthresh: Gapped threshold (L)
      gapped_extension_options|ydrop: Y-drop threshold (Y)
      batch_lines: KegAlign segment lines per batch
      system_options|num_gpu: Number of GPUs for KegAlign
    state:
      bundle_selector: collection
      sequence_options:
        strand_selector: both
      output_options:
        format:
          format_selector: maf
          maf_type: maf-
      scoring_options:
        ambiguous_selector: x
        ambiguous_params:
          set_ambiguous_params_selector: 'false'
        scoring:
          __class__: ConnectedValue
      gapped_extension_options:
        notrivial: false
        gappedthresh:
          __class__: ConnectedValue
        ydrop:
          __class__: ConnectedValue
      interpolation_options:
        inner: -1
      developer:
        alignment_type: vertebrates_default
      system_options:
        wga_chunk_size: 250000
        lastz_interval_size: 10000000
        seq_block_size: 400000000
        debug: true
        num_gpu:
          __class__: ConnectedValue
      seeding_options:
        seed:
          seed_selector: 12of19
        step: 1
        notransition:
          __class__: ConnectedValue
      target:
        __class__: ConnectedValue
      query:
        __class__: ConnectedValue
      ungapped_extension_options:
        hspthresh:
          __class__: ConnectedValue
        xdrop:
          __class__: ConnectedValue
        noentropy:
          __class__: ConnectedValue
      batch_lines:
        __class__: ConnectedValue
    position:
      left: 380
      top: 363
    tool_version: 0.3.4+galaxy5
  chunk_ids:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/collection_element_identifiers/collection_element_identifiers/0.0.3
    label: chunk_ids
    in:
      input_collection: kegalign/pairs
    state:
      input_collection:
        __class__: ConnectedValue
    position:
      left: 680

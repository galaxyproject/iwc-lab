comments:
- type: markdown
  position:
  - 0
  - 0
  size:
  - 3300
  - 190
  color: none
  text: '## Growler UCSC panel (one target, a list of queries, flat)


    **How to read this workflow.** Columns follow a topological sort of the steps, wrapped into

    bands read like lines of text, with the inputs in yellow down the left; the grey outer frames are
    UCSC''s

    two scripts, and each numbered frame inside is one stage. Everything after KegAlign is a command from
    UCSC''s own scripts, wired in their order

    (kent @d4e9b27): **blue, green, orange** are `doBlastzChainNet.pl`, **pink, red** are `doRecipBest.pl`;
    the

    frame titles give the commands and script line numbers. The orange and red MAFs are the multiz

    inputs: synNet for close genomes, reciprocal best for the rest. Generated by galaxytools

    `workflows/growler/assemble_ucsc.py`, which asserts this wiring.'

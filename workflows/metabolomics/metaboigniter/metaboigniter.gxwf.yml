  ms2query_model_download:
    label: Download polarity-specific MS2Query models
    when: $((inputs.identification === true) && (inputs.run_ms2query === true))
    run:
      class: GalaxyUserTool
      id: metaboigniter_ms2query_model_download
      version: 1.0.0
      name: Metaboigniter MS2Query model downloader
      description: Download the polarity-specific model files from the exact public URLs in the source pipeline.
      container: quay.io/biocontainers/gnu-wget:1.18--h5bf99c6_5
      shell_command: mkdir -p downloads && if [ '$(inputs.polarity)' = 'positive' ]; then bash download_models.sh model_positive.csv downloads; else bash download_models.sh model_negative.csv downloads; fi
      inputs:
      - name: polarity
        type: select
        options:
        - label: Positive
          value: positive
          selected: true
        - label: Negative
          value: negative
      outputs:
      - name: model_files
        type: collection
        collection_type: list
        discover_datasets:
        - discover_via: pattern
          directory: downloads
          pattern: (?P<designation>.+)
          format: data
      configfiles:
      - filename: download_models.sh
        content: "#!/bin/bash\n\n# Check if correct number of arguments are provided\nif [ \"$#\" -ne 2 ]; then\n    echo \"Usage: $0 filename.csv output_folder\"\n    exit 1\nfi\n\n# File containing URLs\nCSV_FILE=\"$1\"\n\n# Directory where files will be downloaded\nDOWNLOAD_DIR=\"$2\"\n\n# Create the directory if it doesn't exist\nmkdir -p \"$DOWNLOAD_DIR\"\n\n# Skip the first line (header) and read each subsequent line from the CSV file\ntail -n +2 \"$CSV_FILE\" | while IFS= read -r url\ndo\n    # Download the file using wget or curl\n    wget -P \"$DOWNLOAD_DIR\" \"$url\" || curl -o \"${DOWNLOAD_DIR}/$(basename $url)\" \"$url\"\ndone"
      - filename: model_positive.csv
        content: 'model_files

          https://zenodo.org/record/7947603/files/library_GNPS_15_12_2021_ms2ds_embeddings.pickle

          https://zenodo.org/record/7947603/files/library_GNPS_15_12_2021_s2v_embeddings.pickle

          https://zenodo.org/record/7947603/files/ms2ds_model_GNPS_15_12_2021.hdf5

          https://zenodo.org/record/7947603/files/ms2query_library.sqlite

          https://zenodo.org/record/7947603/files/ms2query_random_forest_model.onnx

          https://zenodo.org/record/7947603/files/spec2vec_model_GNPS_15_12_2021.model

          https://zenodo.org/record/7947603/files/spec2vec_model_GNPS_15_12_2021.model.syn1neg.npy

          https://zenodo.org/record/7947603/files/spec2vec_model_GNPS_15_12_2021.model.wv.vectors.npy'
      - filename: model_negative.csv
        content: 'model_files

          https://zenodo.org/record/7944658/files/negative_mode_15_12_2021.sqlite

          https://zenodo.org/record/7944658/files/neg_GNPS_15_12_2021_ms2ds_model.hdf5

          https://zenodo.org/record/7944658/files/neg_GNPS_15_12_2021_ms2query_random_forest_model.onnx

          https://zenodo.org/record/7944658/files/neg_mode_GNPS_15_12_2021_ms2ds_embeddings.pickle

          https://zenodo.org/record/7944658/files/neg_mode_GNPS_15_12_2021_s2v_embeddings.pickle

          https://zenodo.org/record/7944658/files/neg_mode_spec2vec_model_GNPS_15_12_2021.model

          https://zenodo.org/record/7944658/files/neg_mode_spec2vec_model_GNPS_15_12_2021.model.syn1neg.npy

          https://zenodo.org/record/7944658/files/neg_mode_spec2vec_model_GNPS_15_12_2021.model.wv.vectors.npy'
    in:
      polarity: polarity
    state:
      polarity:
        __class__: ConnectedValue
    out:
    - id: model_files
    doc: Download the polarity-specific MS2Query model files declared by the source manifest (source MS2QUERY_MODELDOWNLOADER).

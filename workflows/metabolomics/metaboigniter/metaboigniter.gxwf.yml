  split_consensus:
    label: Split complete and missing consensus features
    when: $((inputs.requantification === true))
    run:
      class: GalaxyUserTool
      id: metaboigniter_split_consensus
      version: 1.0.0
      name: Metaboigniter consensus split
      description: Wrapper derived from the pinned nf-core/metaboigniter 2.0.1 source.
      container: quay.io/biocontainers/pyopenms:2.9.1--py311h9b8898c_3
      shell_command: python split.py '$(inputs.consensusxml.path)' complete.consensusXML missing.consensusXML
      inputs:
      - name: consensusxml
        type: data
        format:
        - consensusxml
      outputs:
      - name: complete
        type: data
        format: consensusxml
        from_work_dir: complete.consensusXML
      - name: missing
        type: data
        format: consensusxml
        from_work_dir: missing.consensusXML
      configfiles:
      - filename: split.py
        content: "#!/usr/bin/env python\n\n# Written by Payam Emami and Axel Walter and released under the MIT license.\n\nfrom pyopenms import *\nimport glob\nimport sys\n\n# Split the ConsensusMap into features that have no missing values,\n# and features that have at least one missing value;\n# requantify only the missing values.\n\n\ndef split(in_cmap, out_complete, out_missing):\n    # split ConsensusMap\n    consensus_map = ConsensusMap()\n    ConsensusXMLFile().load(in_cmap, consensus_map)\n\n    headers = consensus_map.getColumnHeaders()\n\n    complete = ConsensusMap(consensus_map)\n    complete.clear(False)\n    missing = ConsensusMap(consensus_map)\n    missing.clear(False)\n\n    for cf in consensus_map:\n        if len(cf.getFeatureList()) < len(headers):  # missing values\n            missing.push_back(cf)\n        else:\n            complete.push_back(cf)  # no missing values\n\n    ConsensusXMLFile().store(out_complete, complete)\n    ConsensusXMLFile().store(out_missing,\
          \ missing)\n    return out_complete, out_missing\n\n\nif __name__ == \"__main__\":\n    split(sys.argv[1], sys.argv[2], sys.argv[3])"
    in:
      consensusxml: 14/out
    out:
    - id: complete
    - id: missing
    doc: Split consensus features into complete and missing-feature groups to drive requantification (source PYOPENMS_SPLITCONSENSUS).
  reload_maps:
    label: Reload maps for complete features
    when: $((inputs.requantification === true))
    run:
      class: GalaxyUserTool
      id: metaboigniter_reload_maps
      version: 1.0.0
      name: Metaboigniter reload feature maps
      description: Wrapper derived from the pinned nf-core/metaboigniter 2.0.1 source.
      container: quay.io/biocontainers/pyopenms:2.9.1--py311h9b8898c_3
      shell_command: python reloadmaps.py '$(inputs.featurexml.path)' '$(inputs.consensusxml.path)' reloaded.featureXML
      inputs:
      - name: featurexml
        type: data
        format:
        - featurexml
      - name: consensusxml
        type: data
        format:
        - consensusxml
      outputs:
      - name: complete_features
        type: data
        format: featurexml
        from_work_dir: reloaded.featureXML
      configfiles:
      - filename: reloadmaps.py
        content: "#!/usr/bin/env python\n\n# Written by Payam Emami and Axel Walter and released under the MIT license.\n\nfrom pyopenms import *\nimport glob\nimport sys\n\n\ndef reloadmaps(in_aligned, in_complete, out_complete):\n    # first load feature files in an OpenMS format\n    featurexml_files = glob.glob(in_aligned)\n    feature_maps = []\n    for featurexml_file in featurexml_files:\n        fmap = FeatureMap()\n        FeatureXMLFile().load(featurexml_file, fmap)\n        feature_maps.append(fmap)\n\n    consensus_map = ConsensusMap()\n    ConsensusXMLFile().load(in_complete, consensus_map)\n    to_keep_ids = [\n        item\n        for sublist in [[feature.getUniqueId() for feature in cf.getFeatureList()] for cf in consensus_map]\n        for item in sublist\n    ]\n\n    for fm in feature_maps:\n        fm_filterd = FeatureMap(fm)\n        fm_filterd.clear(False)\n        for f in fm:\n            if f.getUniqueId() in to_keep_ids:\n                fm_filterd.push_back(f)\n\
          \        FeatureXMLFile().store(out_complete, fm_filterd)\n\n    return out_complete\n\n\nif __name__ == \"__main__\":\n    reloadmaps(sys.argv[1], sys.argv[2], sys.argv[3])"
    in:
      featurexml: 8/aligned_featurexml
      consensusxml: 30/complete
    out:
    - id: complete_features
    doc: Reload per-sample feature maps for the complete consensus features (source PYOPENMS_RELOADMAPS).
  lib_builder:
    label: Build requantification search library
    when: $((inputs.requantification === true))
    run:
      class: GalaxyUserTool
      id: metaboigniter_lib_builder
      version: 1.0.0
      name: Metaboigniter requantification library builder
      description: Wrapper derived from the pinned nf-core/metaboigniter 2.0.1 source.
      container: quay.io/biocontainers/pyopenms:2.9.1--py311h9b8898c_3
      shell_command: python lib_generator.py --input '$(inputs.consensusxml.path)' --output library.tsv --polarity '$(inputs.polarity)'
      inputs:
      - name: consensusxml
        type: data
        format:
        - consensusxml
      - name: polarity
        type: select
        options:
        - label: Positive
          value: positive
          selected: true
        - label: Negative
          value: negative
      outputs:
      - name: library_tsv
        type: data
        format: tabular
        from_work_dir: library.tsv
      configfiles:
      - filename: lib_generator.py
        content: "#!/usr/bin/env python\n\n# Written by Payam Emami and Axel Walter and released under the MIT license.\n\nimport pyopenms as po\nimport argparse\n\nparser = argparse.ArgumentParser()\nparser.add_argument(\"--input\", help=\"input consensusXML file\")\nparser.add_argument(\"--output\", help=\"output tsv file\")\nparser.add_argument(\"--polarity\", choices=[\"positive\", \"negative\"], help=\"polarity\")\n\nargs = parser.parse_args()\n\ncmap = po.ConsensusMap()\npo.ConsensusXMLFile().load(args.input, cmap)\n\npolarity = \"+\"\n# set polarity\nif args.polarity == \"negative\":\n    polarity = \"-\"\n\n\ncmap.sortBySize()\ncolumn_headers = [\n    \"CompoundName\",\n    \"SumFormula\",\n    \"Mass\",\n    \"Charge\",\n    \"RetentionTime\",\n    \"RetentionTimeRange\",\n    \"IsoDistribution\",\n]\n\n\ndef mz_to_mass(mz, charge, polarity):\n    # Treat charge zero as one\n    if charge == 0:\n        charge = 1\n\n    mass = (mz * charge) - (charge * polarity * 1.007825)\n  \
          \  return mass\n\n\ni = 0\nwith open(args.output, \"w\") as f:\n    f.write(\"\\t\".join(column_headers) + \"\\n\")\n    for cfeature in cmap:\n        int_info = [\"NA\" for number in range(len(column_headers))]\n        int_info[0] = \"feature_\" + str(i)\n        int_info[1] = \" \"\n\n        # set charge first\n        charge = cfeature.getCharge()\n        # set mass\n\n        int_info[2] = str(mz_to_mass(cfeature.getMZ(), charge, int(polarity + \"1\")))\n        if charge == 0:\n            charge = 1\n        int_info[3] = polarity + str(charge)\n        int_info[4] = str(cfeature.getRT())\n\n        int_info[5] = \"0\"\n        int_info[6] = \"0\"\n        i = i + 1\n        f.write(\"\\t\".join(int_info) + \"\\n\")"
    in:
      consensusxml: 30/missing
      polarity: polarity
    out:
    - id: library_tsv
    doc: Build the requantification search library from complete consensus features (source PYOPENMS_LIBBUILDER).

    run:
      class: GalaxyUserTool
      id: metaboigniter_ms2query_merge
      version: 1.0.0
      name: Metaboigniter MS2Query result merge
      description: Source-derived Metaboigniter tool.
      container: quay.io/biocontainers/pyopenms:2.9.1--py311h9b8898c_3
      shell_command: mkdir -p inputs && $(inputs.result_files.map((input, index) => "cp '" + input.path + "' 'inputs/result_" + index + ".csv'").join(" && ")) && python conc_tsv.py --input_dir inputs/ --output_file ms2query.tsv --input_type csv --output_type tsv
      inputs:
      - name: result_files

- doc: Metaboigniter source test profile, quantification branch
  job:
    quantification_samples:
      class: Collection
      collection_type: list
      elements:
      - identifier: X2_Rep1
        class: File
        location: https://raw.githubusercontent.com/nf-core/test-datasets/metaboigniter/mzML_POS_Quant/X2_Rep1.mzML
        filetype: mzml
      - identifier: X3_Rep1
        class: File
        location: https://raw.githubusercontent.com/nf-core/test-datasets/metaboigniter/mzML_POS_Quant/X3_Rep1.mzML
        filetype: mzml
      - identifier: X6_Rep1
        class: File
        location: https://raw.githubusercontent.com/nf-core/test-datasets/metaboigniter/mzML_POS_Quant/X6_Rep1.mzML
        filetype: mzml
    requantification: false
    identification: false
    polarity: positive
    run_sirius: false
    run_fingerid: false
    run_ms2query: false
  outputs:
    Quantification table:
      asserts:
        has_n_lines:
          min: 57386
          max: 57387
        has_text:

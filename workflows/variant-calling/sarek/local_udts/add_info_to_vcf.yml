class: GalaxyUserTool
id: add_info_to_vcf
version: "1.0.0"
name: Add Source Info to VCF
description: Adds file source metadata to INFO column of VCF variants (nf-core/sarek local module)
container: quay.io/biocontainers/gawk:5.3.0
shell_command: |
  set -euo pipefail
  zcat "$(inputs.vcf_gz.path)" > input.vcf
  grep -E "^##" input.vcf > output.vcf
  echo '##INFO=<ID=SOURCE,Number=1,Type=String,Description="Name of vcf-file from whence the variant came">' >> output.vcf
  grep -E "^#CHROM" input.vcf >> output.vcf
  if grep -Ev "^#" input.vcf > /dev/null; then
    grep -Ev "^#" input.vcf | awk -v src="$(inputs.source_name)" 'BEGIN{FS=OFS="\t"} { $8=="." ? $8="SOURCE="src : $8=$8";SOURCE="src; print }' >> output.vcf
  fi
inputs:
  - name: vcf_gz
    type: data
    format:
      - vcf_bgzip
    label: Input compressed VCF file
  - name: source_name
    type: text
    label: Source name to append in INFO
outputs:
  - name: out_vcf
    type: data
    format: vcf
    from_work_dir: output.vcf
    label: VCF with added INFO SOURCE
help:
  format: markdown
  content: |
    Adds source file provenance metadata to the INFO column of a VCF, replicating the Sarek ADD_INFO_TO_VCF local module.

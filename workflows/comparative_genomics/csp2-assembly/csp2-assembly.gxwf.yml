class: GalaxyWorkflow
label: CSP2 assembly of paired reads with SKESA
doc: |-
  This workflow runs the read assembly of the CFSAN SNP Pipeline 2 (CSP2, v.0.9.7.8), its assemble mode, on a collection of paired bacterial reads to produce one SKESA assembly per isolate. SKESA is the build shipped in the CSP2 image and is called with CSP2's own command line, so the assemblies are the ones CSP2 would make, ready to use as the query or reference assemblies of the CSP2 SNP distance and screening workflows.
creator:
  - class: Person
    identifier: https://orcid.org/0000-0002-4882-5357
    name: Dannon Baker
license: MIT
release: '0.1'
inputs:
  Paired reads:
    type: collection
    collection_type: list:paired
    format:
      - fastqsanger
      - fastqsanger.gz
    doc: "One forward/reverse pair of FASTQ files per isolate, plain or gzipped; the identifier of each pair = isolate ID. As in CSP2 v.0.9.7.8, SKESA reads only the forward file of each pair."
outputs:
  Assemblies:
    outputSource: Assemble reads with SKESA/assembly
steps:
  Split pairs into forward and reverse:
    tool_id: __UNZIP_COLLECTION__
    tool_version: 1.0.0
    doc: Two parallel lists, forward and reverse, each keyed by isolate ID, so that the assembly job can read the isolate ID from its inputs (source fetchReads.py, which pairs the files and takes the isolate ID from the file name).
    in:
      input: Paired reads
    out:
      - id: forward
      - id: reverse
  Assemble reads with SKESA:
    doc: Source process skesaAssemble, one job per isolate (SKESA 2.4.0 from the FDA image with CSP2's command line) as one authored user-defined tool; the output list keeps the isolate IDs as element identifiers.
    run:
      class: GalaxyUserTool
      id: csp2_skesa_assemble
      version: 0.1.0
      name: CSP2 SKESA assembly
      description: assemble the reads of one isolate with SKESA, invoked the way CSP2 invokes it
      container: cfsanbiostatistics/csp2:v.0.9.7.8-galaxy
      configfiles:
        - filename: reads.txt
          content: |
            ${
              return [
                String(inputs.forward.element_identifier),
                String(inputs.reverse.element_identifier),
                inputs.forward.path,
                inputs.reverse.path
              ].join("\n") + "\n";
            }
      shell_command: |
        { IFS= read -r id && IFS= read -r reverse_id && IFS= read -r forward && IFS= read -r reverse; } < reads.txt &&
        if [ "$id" != "$reverse_id" ]; then echo "Forward reads '$id' and reverse reads '$reverse_id' are not the same isolate" >&2; exit 1; fi &&
        case "$id" in
          ""|*[[:space:],/:]*) echo "Isolate ID '$id' is empty or contains whitespace, ',', '/' or ':'" >&2; exit 1 ;;
        esac &&
        slots=$GALAXY_SLOTS &&
        if [ -z "$slots" ]; then slots=1; fi &&
        skesa --cores "$slots" --use_paired_ends --fastq "$forward" "$reverse" --contigs_out assembly.fasta &&
        if [ ! -e assembly.fasta ]; then echo "SKESA finished without writing an assembly for isolate '$id'" >&2; exit 1; fi &&
        if [ ! -s assembly.fasta ]; then echo "SKESA assembled no contigs for isolate '$id'; the assembly is empty" >&2; fi
      inputs:
        - name: forward
          type: data
          format:
            - fastqsanger
            - fastqsanger.gz
          label: Forward reads
          help: Forward FASTQ of one isolate, plain or gzipped. Its element identifier is the isolate ID and must not contain whitespace, ',', '/' or ':'.
        - name: reverse
          type: data
          format:
            - fastqsanger
            - fastqsanger.gz
          label: Reverse reads
          help: Reverse FASTQ of the same isolate, from the list parallel to the forward list, carrying the same element identifier. Passed to SKESA as CSP2 passes it, which means SKESA does not read it.
      outputs:
        - name: assembly
          type: data
          format: fasta
          from_work_dir: assembly.fasta
          label: SKESA assembly
      help:
        format: markdown
        content: |
          Runs the read assembly of CFSAN CSP2 v.0.9.7.8 (process `skesaAssemble`) for one isolate, with the
          SKESA 2.4.0 binary of the CSP2 image and CSP2's own command line:
          `skesa --cores <slots> --use_paired_ends --fastq <forward> <reverse> --contigs_out <assembly>`.
          No trimming, filtering or other option is added; everything else is SKESA's default.

          **Only the forward reads are assembled.** SKESA 2.4.0 takes one file per `--fastq` and ignores the
          second file on that command line, so the reverse reads are never opened. This is what CSP2 v.0.9.7.8
          does, and the tool keeps it so that its assemblies are the ones CSP2 produces: for the Week_42 reads
          of the CSP2 test data the result is byte-for-byte the assembly published with the expected output.

          Meant to be mapped over two parallel lists, the forward and the reverse reads of a `list:paired`
          collection, one job per isolate, giving a list of assemblies whose element identifiers are the
          isolate IDs. The isolate ID is read from the element identifier and checked against the characters
          the CSP2 alignment tools refuse, so that a bad ID fails here and not after the assembly.

          The assembly is an uncompressed FASTA with contigs named `Contig_<number>_<k-mer coverage>`; contigs
          shorter than 200 bases are not reported. The output does not depend on the number of cores. The
          job fails when SKESA fails, which includes reads it cannot assemble at all (too few or too short).
          If SKESA succeeds without reporting any contig the assembly is an empty dataset, as it is in CSP2.
          SKESA's log is on the job's standard error.
    in:
      forward: Split pairs into forward and reverse/forward
      reverse: Split pairs into forward and reverse/reverse
    out:
      - id: assembly
